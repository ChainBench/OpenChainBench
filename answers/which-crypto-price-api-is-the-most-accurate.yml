expert_take: |
  Price accuracy is two questions measured as one. The first is construction: which venues and pairs feed the number and how they are weighed. A provider that counts USDT books as dollars prints a few basis points high on every asset whenever USDT trades under par, and no amount of refresh speed removes that offset. The second is age: a price rebuilt every minute is, on average, half a minute old when it is read, and in a fast market half a minute is worth more basis points than any construction choice. The bias column isolates the first, the price age column the second, and the gap is what a reader actually receives. Choosing on the headline alone hides which of the two a provider is paying for, and the cure differs: a construction bias is permanent, while age is a plan or a cadence away.

