          series: avg_over_time(rpc_latency_milliseconds{provider="bloxroute", chain="robinhood", region="sgp"}[1h])

  # API-key cohort (tier: keyed). Queries pin tier="keyed", the label the
  # rpc-keyed-latency harness emits; the public rows above carry no tier label.
  #
  # Every aggregate below also carries region!="sgp". GetBlock does not offer
  # this chain in Singapore, and the chain's nodes look US and EU only for
  # every provider, so a Singapore sample is mostly the distance to a node
  # that is not there. Averaging a two-region row against three-region rows
  # would compare different populations, which is the defect bench 208 was
  # rebuilt to remove, so the whole cohort is measured from us-east and
  # eu-west. The public cohort above is untouched and still spans 3 regions.
  #
  # Each vendor that answers from Singapore still carries an explicit
  # `- region: sgp` entry below. Those are separate queries from the headline,
  # so the hub and the geo view can show the Singapore measurement without it
  # entering the two-region average the ranking rests on.
  #
  # Written as a negative matcher, not region=~"us-east|eu-west", and that is
  # load-bearing: injectLabels() treats any `region=` (including `=~`) as
  # already filtered and would then inject nothing, so every region tab would
  # silently serve this two-region average. `region!="sgp"` is not matched by
  # that check, so a region tab still appends its own region="<value>" and the
  # Singapore tab resolves to a contradictory pair that matches nothing.
  - slug: chainstack
    name: Chainstack
    tier: keyed
    tag: Growth plan Global Node, endpoint provided, plan disclosed
    formula: "p50 over 24h of round-trip latency (ms) for eth_getBlockByNumber probed every 120 s from us-east and eu-west on Chainstack's keyed Robinhood Chain endpoint."
