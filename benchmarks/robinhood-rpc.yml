    name: Alchemy
    tier: keyed
    tag: Free plan key, plan disclosed
    formula: "p50 over 24h of round-trip latency (ms) for eth_getBlockByNumber probed every 120 s from us-east and eu-west on Alchemy's keyed Robinhood Chain endpoint."
