# OpenChainBench. Bench № 243

slug: robinhood-rpc
number: "243"
title: "Robinhood Chain RPC endpoints: free public URLs and private API-key providers by latency"
seo_title: "Robinhood Chain RPC: public and private endpoints by latency"
seo_description: "{{best_name}} leads free Robinhood Chain RPC at {{best_p50}} (p50, 24h); URLs for all {{count}} no-key endpoints. {{best_name:tier:keyed}} leads the private (API-key) cohort at {{best_p50:tier:keyed}}."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Robinhood Chain RPC endpoint (probed every 60 seconds from 3 regions) and, under the Access selector (Private), against the API-key endpoints of Alchemy, Chainstack, GetBlock, Quicknode and Dwellir (every 120 seconds). The two cohorts are ranked separately, never against each other.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Robinhood Chain (chain ID 4663) is Robinhood's Arbitrum Orbit L2 for
  tokenized equity trading, live on mainnet since July 2026 with about 100 ms
  blocks. Its RPC field is young: a rate-limited official endpoint, three
  public gateways (dRPC, PublicNode, bloXroute) and keyed endpoints at
  Alchemy, Chainstack, GetBlock, Quicknode and Dwellir. This page measures both sides
  with one probe, `eth_getBlockByNumber` with a rotating request id, every 60 seconds
  on the {{count}} free endpoints from us-east, eu-west and Singapore, and
  every 120 seconds on the keyed ones from the same three regions. The keyed
  headline averages us-east and eu-west only: GetBlock does not offer
  Robinhood Chain in Singapore, and averaging a two-region row against
  three-region rows would compare different populations. Singapore is
  published per region for the five vendors that answer the Singapore probe. The Access
  selector switches between the two cohorts, which are never ranked against
  each other.

abstract: |
  Robinhood Chain: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the Robinhood-operated endpoint measures {{p50:robinhood-official}}. The same page carries the private cohort (API key), Alchemy, Chainstack, GetBlock, Quicknode and Dwellir on their keyed Robinhood Chain endpoints every 120 seconds from us-east and eu-west: switch the Access selector; {{best_name:tier:keyed}} leads it at {{best_p50:tier:keyed}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Robinhood Chain endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore, and against the keyed endpoints of Alchemy, Chainstack, GetBlock, Quicknode and Dwellir every 120 seconds from the same three regions, the keyed headline averaging us-east and eu-west because GetBlock has no Robinhood Chain endpoint in Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained, honest availability rather than a fast error message. Robinhood Chain runs on the Arbitrum Orbit stack with about 100 ms block times; the probe samples the serving path, not block production.

methodology:
  - "Cadence: the public cohort every 60 seconds per provider from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore), its headline p50/p90/p99 aggregating all 3 via Prometheus `avg(quantile_over_time(...))`. The keyed cohort runs every 120 seconds from the same 3 regions; its headline averages us-east and eu-west only, for the GetBlock coverage reason below. Per-region breakdowns are first-class via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. The request id rotates, but that does not guarantee a cache miss: many caches normalise `id` away. Measured 2026-10-08, fixed and rotating ids answer within 2 to 4 percent of each other."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Robinhood Chain-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=\"robinhood\" (chain id 4663). Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. Exclusions follow the cluster-wide rules documented on the parent benchmark."
  - "Private cohort (Access selector, Private): Alchemy, Chainstack, GetBlock, Quicknode, Dwellir and BlockMachine probed on their keyed Robinhood Chain endpoints every 120 seconds from all 3 probe regions, same call (eth_getBlockByNumber, rotating id), same ok / http_err / jsonrpc_err / stale / timeout classification."
  - "Keys live in the probe environment, never in the repo. Plan tiers, disclosed: Chainstack: a Global Node on the Growth plan; Alchemy: a Free plan key (30M CU per month, 300 compute units per second), the tier any reader gets; Alchemy states free and paid keys share one routing; Quicknode: an endpoint on a Build plan ($49 per month), shared fleet; GetBlock: an endpoint on the Enterprise plan, shared by the two probe regions. Chainstack, GetBlock and Quicknode provided their endpoints."
  - "Dwellir plan tier, disclosed: a Developer plan key ($49 per month, 25 million API responses, 100 responses per second; 1 RPC response = 1 API credit, no compute units). Shared nodes, the same product a reader buys. Dwellir publishes no Solana endpoint, so it is absent from that page rather than shown as unavailable."
  - "GetBlock regional pairing: us-east uses GetBlock's New York endpoint and eu-west its Frankfurt endpoint. Alchemy, Chainstack and Quicknode publish one routed entry point per chain instead, which in the general case does land a probe on a nearby node. Some of any gap between the two arrangements is deployment topology rather than node speed, and a deployment in one of these regions would see the same benefit GetBlock's endpoint gives the probe."
  - "GetBlock coverage: GetBlock does not offer Robinhood Chain in Singapore, so no GetBlock figure exists for that region: the endpoint is not offered there, which is not a failed or pending measurement. The keyed headline therefore averages us-east and eu-west for every vendor, because averaging a two-region row against three-region rows would compare different populations. Singapore is published per region for the five that answer the Singapore probe."
  - "Two cohorts, two rankings: the public endpoints are shared, rate-limited gateways probed every 60 seconds; the keyed endpoints are metered or dedicated and probed every 120 seconds. The selector switches the whole page (ranking, chart, region tabs, badges, citation) between them. No figure on this page compares a public endpoint with a keyed one."
  - "Robinhood Chain runs on the Arbitrum Orbit stack with about 100 ms block times; the probe samples the serving path, not block production. The stale check tolerates 200 blocks behind the cross-provider tip (20 s of wall clock, the same tolerance as the 1 s chains at 20 blocks) on the public cohort and 20 blocks on the keyed one."

excluded_providers:
  - { name: Ankr, reason: "serves Robinhood Chain on Premium only, not on the Freemium or public plans" }
  - { name: Infura, reason: "does not list Robinhood Chain" }
  - { name: Tenderly, reason: "no public gateway for Robinhood Chain at the last sweep" }
  - { name: Nodies, reason: "no public endpoint for Robinhood Chain at the last sweep" }

faq:
  - q: "Which Robinhood Chain RPCs work without an API key?"
    a: "{{declared_count}} endpoints are probed on this chain; each is listed with its URL, 24h median and success rate in the endpoints table on this page, and the list changes as providers come and go. Every (provider, chain) pair was live-verified no-key before inclusion; anything that key-gates, region-blocks or rate-limits below the 60-second cadence is excluded rather than listed with an asterisk."
  - q: "Which Robinhood Chain RPC provider is fastest with an API key?"
    a: "Per the live data: {{best_name:tier:keyed}} at {{best_p50:tier:keyed}} (eth_getBlockByNumber p50 over 24h, averaged across us-east and eu-west); Alchemy measures {{p50:alchemy}}, Chainstack {{p50:chainstack}} and Quicknode {{p50:quicknode}}; GetBlock measures {{p50:getblock}}. The headline averages those two regions only, because GetBlock does not offer Robinhood Chain in Singapore and averaging a two-region row against three-region rows would compare different populations; the Singapore figures are published per region for the five vendors that answer that probe, and GetBlock's absence there is a coverage fact rather than a failed measurement. On the free cohort {{best_name}} leads at {{best_p50}}, measured on the same call from 3 regions; the two cohorts are never ranked in one table (shared gateways at 60 s against metered endpoints at 120 s). Switch the Access selector to Private for the region tabs and the p99 column; plan tiers are disclosed in the methodology."
  - q: "What is Robinhood Chain?"
    a: "Robinhood Chain (chain ID 4663) is an Arbitrum Orbit L2 built by Robinhood for tokenized equity trading. It launched on mainnet in July 2026 with about 100 ms block times and a gas fee subsidy running through September 29, 2026. It supports EVM tooling and standard eth_ JSON-RPC methods; the official endpoint rpc.mainnet.chain.robinhood.com is free, rate-limited and documented as suited to wallet connectivity and testing."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on region alone; the tier
# partition drops the other cohort's samples.
rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="robinhood"})

# Region and access tier: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }
  # Access tier: partitions the provider list (no PromQL label). The
  # first value is the headline cohort; ?tier=keyed reaches the other.
  tier:
    - { value: public, label: "Public, no key" }
    - { value: keyed,  label: "Private, API key" }
    - { value: keyed-cold, label: "Private, cold start" }
    - { value: keyed-heavy, label: "Private, heavy call" }

metric_panels:
  # ---- API capability, keyed cohort only ----
  #
  # Measured by the rpc-keyed-latency harness, which asks each method once per
  # provider per chain every six hours from a single region. These panels are
  # per (provider, chain), which is the granularity of this page, so they sit
  # here rather than on a cross-chain board: pooling them across chains would
  # average different block times, state sizes and node fleets.
  #
  # `tiers: [keyed]` because capability is probed on the keyed endpoints only.
  # On the public tab these panels are absent and their columns disappear with
  # them, instead of drawing dashes under a header that promises a reading.
  - id: cap_debug_trace
    label: "debug_traceTransaction"
    label_key: provider
    metric: 100 * max by (provider) (rpc_api_supported{chain="robinhood",api="debug_tracetransaction"})
    unit: pct
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Whether this provider served debug_traceTransaction on this chain at the last check. 100 means served, 0 means the provider declined it, and a blank means we could not ask."
  - id: cap_trace_block
    label: "trace_block"
    label_key: provider
    metric: 100 * max by (provider) (rpc_api_supported{chain="robinhood",api="trace_block"})
    unit: pct
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Whether trace_block was served. It sits in a different client namespace from debug_traceTransaction, so a provider can have one and not the other."
  - id: cap_receipts
    label: "eth_getBlockReceipts"
    label_key: provider
    metric: 100 * max by (provider) (rpc_api_supported{chain="robinhood",api="eth_getblockreceipts"})
    unit: pct
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Whether eth_getBlockReceipts was served, the one call that returns every receipt in a block instead of one per transaction."
  - id: cap_archive
    label: "Archive at 5M blocks"
    label_key: provider
    metric: 100 * max by (provider) (rpc_api_supported{chain="robinhood",api="archive_5m"})
    unit: pct
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Whether a balance read five million blocks behind the head returned non-pruned state. A chain younger than that depth cannot answer and is left blank."
  - id: cap_getlogs_raw
    label: "eth_getLogs, no filter"
    label_key: provider
    metric: 100 * max by (provider) (rpc_api_supported{chain="robinhood",api="eth_getlogs_nofilter"})
    unit: pct
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Whether an unfiltered eth_getLogs over five blocks was served. A distinct question from the filtered shapes: some providers require an address or a topic."
  - id: cap_win_address
    label: "eth_getLogs window, address filter"
    label_key: provider
    metric: min by (provider) (rpc_getlogs_max_range_blocks{chain="robinhood",filter_shape="address",bound=~"refused|top"})
    unit: count
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Widest address-filtered eth_getLogs window accepted, in blocks, climbing 100 to 1,000,000 and stopping at the first refusal. This is the static guard that trips before any work and freezes an indexer's cursor."
  - id: cap_win_topics
    label: "eth_getLogs window, topic filter"
    label_key: provider
    metric: min by (provider) (rpc_getlogs_max_range_blocks{chain="robinhood",filter_shape="topics",bound=~"refused|top"})
    unit: count
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Same ladder for a topic-filtered query. The two shapes are indexed differently and a provider can admit a wider window on one than the other."
  - id: cap_age_hours
    label: "Hours since check"
    label_key: provider
    metric: (time() - min by (provider) (rpc_api_last_probe_timestamp{chain="robinhood"})) / 3600
    unit: count
    higher_is_better: false
    tab: false
    tiers: [keyed]
    carry: false
    description: "Age of the capability verdicts on this chain, from the oldest cell. The probe runs every six hours; if it stops, the verdicts are withheld rather than held at their last reading."

  - id: cap_work_ms
    label: "Compute work"
    label_key: provider
    metric: max by (provider) (ocb:rpc_api_work_milliseconds:mean_24h{chain="robinhood"}) > 0
    unit: ms
    higher_is_better: false
    tab: false
    tiers: [keyed-heavy]
    carry: false
    description: "The heavy call minus its light reference, both on a pooled connection in the same pass, so the difference is the work the node did rather than the distance to it. Withheld at or below zero: a fifty-read call cannot be the faster one, and a negative here is noise."
ledger_columns:
  # The default latency columns, re-declared: any ledger_columns block
  # replaces the default layout rather than extending it, so leaving
  # these out would strip p90 and p99 from the public tab.
  - label: "p50"
    slot: p50
    unit: ms
  - label: "p90"
    slot: p90
    unit: ms
  - label: "p99"
    slot: p99
    unit: ms
  # The capability matrix, shown under the Private tab. Order follows the
  # question an integrator asks: can it trace, can it read deep history,
  # and how wide a log query will it take.
  - label: "debug_trace"
    panel: cap_debug_trace
    unit: pct
  - label: "trace_block"
    panel: cap_trace_block
    unit: pct
  - label: "Receipts"
    panel: cap_receipts
    unit: pct
  - label: "Archive 5M"
    panel: cap_archive
    unit: pct
  - label: "getLogs raw"
    panel: cap_getlogs_raw
    unit: pct
  - label: "getLogs addr, blocks"
    panel: cap_win_address
    unit: count
  - label: "getLogs topic, blocks"
    panel: cap_win_topics
    unit: count
  - label: "Checked, h"
    panel: cap_age_hours
    unit: count

  - label: "Work, ms"
    panel: cap_work_ms
    unit: ms
providers:
  - slug: robinhood-official
    name: Robinhood
    endpoint: https://rpc.mainnet.chain.robinhood.com
    tag: Robinhood-operated mainnet RPC, rate-limited, no SLA
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Robinhood's no-key Robinhood Chain endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="robinhood-official", chain="robinhood"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="robinhood-official", chain="robinhood"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="robinhood-official", chain="robinhood"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="robinhood-official", chain="robinhood"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="robinhood-official", chain="robinhood"}) / sum(ocb:rpc_call:rate_24h{provider="robinhood-official", chain="robinhood"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="robinhood-official", chain="robinhood"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="robinhood-official", chain="robinhood"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="robinhood-official", chain="robinhood", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="robinhood-official", chain="robinhood", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="robinhood-official", chain="robinhood", region="eu-west"})
