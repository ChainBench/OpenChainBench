# OpenChainBench. Bench № 096

slug: neutron-rpc
number: "096"
title: "Neutron RPC endpoints: free public URLs ranked by latency"
seo_title: "Neutron RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Neutron RPC at {{best_p50}} (Tendermint `status` p50, 24h). URLs for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for the Tendermint `status` method against every free, no-key public Neutron Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Neutron is a Cosmos SDK smart-contract chain running CosmWasm, secured by Cosmos Hub validators via Interchain Security. Same Tendermint `status` probe used on the rest of the Cosmos cluster; every provider live-verified with 4 consecutive keyless probes at launch. Neutron's official `rpc-kralum.neutron-1.neutron.org` endpoint returned an SSL handshake failure during the launch audit and was excluded; it will be re-audited when the TLS chain is fixed.

abstract: |
  Neutron: {{count}} free public RPC endpoints answering `status` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical JSON-RPC call (Tendermint `status`) against every no-key public Neutron endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a Neutron-scaled staleness gap (40 blocks at Neutron's ~2 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Neutron-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"status\",\"params\":[]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the rotating id defeats edge caches that would answer a bare head query without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Neutron-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"neutron\"`. Provider coverage at launch: {{count}} no-key endpoints (PublicNode, Polkachu, LavenderFive)."

faq:
  - q: "Which Neutron RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today; each is listed with its URL, 24h median and success rate in the endpoints table on this page, and the list changes as providers come and go."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="neutron"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://neutron-rpc.publicnode.com
    tag: Allnodes-operated, 70+ chains, includes Cosmos SDK
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key neutron RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="neutron"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="neutron"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="neutron"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="neutron"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="neutron"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="neutron"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="neutron"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="neutron"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="neutron", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="neutron", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="neutron", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="neutron", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="neutron", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="neutron", region="sgp"}[1h])

  - slug: polkachu
    name: Polkachu
    endpoint: https://neutron-rpc.polkachu.com
    tag: Community Cosmos validator + public RPC network
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Polkachu's no-key neutron RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="neutron"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="polkachu", chain="neutron"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="polkachu", chain="neutron"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="polkachu", chain="neutron"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="polkachu", chain="neutron"}) / sum(ocb:rpc_call:rate_24h{provider="polkachu", chain="neutron"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="polkachu", chain="neutron"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="neutron"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="neutron", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="neutron", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="neutron", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="neutron", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="neutron", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="neutron", region="sgp"}[1h])

  - slug: lavenderfive
    name: LavenderFive
    endpoint: https://rpc.lavenderfive.com:443/neutron
    tag: Cosmos validator + no-key RPC path, multi-chain
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to LavenderFive's no-key neutron RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="neutron"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="lavenderfive", chain="neutron"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="lavenderfive", chain="neutron"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="lavenderfive", chain="neutron"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="lavenderfive", chain="neutron"}) / sum(ocb:rpc_call:rate_24h{provider="lavenderfive", chain="neutron"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="lavenderfive", chain="neutron"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="neutron"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="neutron", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="neutron", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="neutron", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="neutron", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="neutron", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="neutron", region="sgp"}[1h])
