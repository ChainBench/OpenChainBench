# OpenChainBench. Bench 273
slug: chain-bridged-tvl
number: "273"
title: "Bridged TVL by chain: how much of a chain's capital came from somewhere else"
seo_title: "Bridged TVL by chain: {{best_names}} at {{best_p50}}"
seo_description: "{{best_names}}: {{best_p50}} of bridged TVL, the most of {{ranked_count}} chains. Value secured that arrived from elsewhere, canonical plus external, from L2Beat, with the weekly move against peers."
subtitle: "L2Beat's value secured per chain, restricted to what arrived from elsewhere: canonical (locked in the chain's own escrow on its host chain) plus external (a third-party bridge). The complement is native, minted here. The weekly columns move with the whole balance, and the one to read is the move against the cohort median."
category: Blockchains
status: live
metric: Bridged TVL
unit: usd
higher_is_better: true
row_noun: { one: chain, many: chains }

disclaimer: |
  Bridged TVL is value secured by the chain's bridge, not value locked in
  its DeFi protocols; a chain can rank high on one and low on the other.
  The split is L2Beat's: canonical is escrowed on the host chain by the
  chain's own contracts, external came through a third-party bridge,
  native was minted here. Rows are the chains L2Beat tracks in its scaling
  summary; a settled L1 has no row by construction, not by omission. Size
  is not quality: a large balance says capital came, not that it stayed.

seo_intro: |
  A chain's headline TVL says how much capital sits in its DeFi protocols.
  It does not say where that capital came from, and the difference matters:
  value bridged in is value someone moved on purpose, while value minted
  natively can be a token the chain issued to itself. L2Beat separates the
  two for every chain in its scaling summary, and this benchmark publishes
  that split alongside the weekly move. The weekly move is the part worth
  reading carefully. When the whole market rises, every chain's raw change
  is positive and a ranking on it ranks the market rather than the chains.
  The excess column subtracts the cohort median from each chain's move,
  which is what separates a chain that gained ground from one that merely
  floated up with everything else. The cohort median, its size and how
  much of it L2Beat currently has under review are published as their own
  Prometheus series, so the subtraction can be re-derived from the source
  rather than believed.

abstract: |
  The chain-kpis harness reads l2beat.com/api/scaling/summary once every
  15 minutes. One request covers the whole cohort; each project entry
  carries tvs.breakdown with total, native, canonical and external in USD,
  and a 7-day change. The harness publishes chain_bridged_tvl_usd as
  canonical + external, chain_value_secured_usd split by origin,
  chain_tvs_usd as the total, chain_tvs_change_7d_pct as the raw weekly
  move and chain_tvs_change_7d_excess_pct as that move minus the median of
  every live project above a $200M size floor. The median and the cohort
  size are published as chain_tvs_cohort_median_7d_pct,
  chain_tvs_cohort_size, chain_tvs_cohort_layer3 and
  chain_tvs_cohort_under_review, so the subtraction can be re-derived from
  the series rather than taken on trust. Rows are the chains in the OCB registry that L2Beat
  tracks in its scaling summary, whatever category it files them under;
  settled L1s carry no id because a chain with no host chain has no bridged
  balance to report.

methodology:
  - "Source: L2Beat /api/scaling/summary, one unauthenticated request per tick covering every tracked project. Poll cadence 15 minutes, matched to the DefiLlama cadence in the same harness. Neither is the instant it is read at: DefiLlama publishes one daily TVL aggregate, and L2Beat computes an hourly series that normally runs one to two hours behind, so the page reports the last point each source finished rather than the moment of the request."
  - "Bridged TVL = canonical + external from tvs.breakdown, in USD. Canonical is value escrowed on the host chain by the chain's own contracts; external arrived through a third-party bridge; native was minted on the chain itself and is excluded."
  - "The three origins reconstruct the total, so bridged TVL is exactly the value secured that is not native, and a chain whose value is entirely canonical reads 100 percent bridged. A row whose origins miss its total by more than 0.1 percent is not published at all: if the upstream field names change, every one of them binds to zero, and a $0 bridged TVL at full health would be a wrong number that looks measured."
  - "Weekly move: L2Beat's own change7d on total value secured, converted from a ratio to a percentage. The excess subtracts the median change across every live project above $200M of value secured."
  - "The $200M floor exists because the median is a yardstick. L2Beat tracks about a hundred projects and most of them are small, so without a floor the many dust chains outnumber the rest and their moves, which are incentive programs rather than capital rotation, own the middle of the sorted list."
  - "Cohort composition: every live project above the floor votes, layer 3s and projects L2Beat currently has under review included. They are counted, not filtered, because dropping them would make the yardstick a judgement rather than a measurement; chain_tvs_cohort_size, _layer3 and _under_review publish the composition. Below five projects no median is published and the excess series is cleared rather than frozen."
  - "Rows: every chain in the OCB registry that carries an L2Beat project id, each verified against a live read of the endpoint. Several ids differ from the OCB slug (polygon-pos, zksync2, roninnetwork, worldchain, mantapacific, galxegravity, nova, polygonzkevm, bobanetwork, immutablezkevm)."
  - "Membership: a row is a chain in the OCB chain registry that L2Beat tracks in its scaling summary, whatever category L2Beat files it under (42 of L2Beat's roughly 100 projects on 2026-09-25, Plume mapped that day); L2Beat projects outside the registry are not rows. Settled L1s carry no id because a chain with no host chain has no bridged balance to report."
  - "A project L2Beat has archived, one reporting a zero total, and one whose origins do not reconstruct that total all publish nothing: the chain's gauges are deleted rather than carried forward, so the row reads unresponsive within the hour, and chain_kpis_health{source=\"l2beat\"} drops to 0 for that chain. That health series is the success column, so a row that stopped reporting also stops reading 100 percent."
  - "Freshness reads L2Beat's own chart.syncedUntil, not the Prometheus scrape and not the time of our fetch. The first is always seconds old because the harness re-exports carried-forward gauges; the second stays green when L2Beat answers 200 with stale numbers. A row whose weekly move is missing keeps its balance and loses only its two weekly columns, rather than publishing a flat week that never happened."
  - "Every aggregate column reads the latest value rather than a window statistic, so the board and the origin panels always describe the same instant. p50, p90, p99 and the mean are equal by construction; the sample count is the number of Prometheus scrapes in the 24h window (about 2,880 at a 30 second scrape), not a count of measurements, since the underlying value refreshes every 15 minutes."
  - "L2Beat's figures are a third-party measurement, credited as the source. OCB does not re-derive the escrow balances; this bench republishes the split and computes the cohort-relative move on top of it."

findings:
  - "The most bridged capital of the {{ranked_count}} chains sits on {{best_names}}, at {{best_p50}}."
  - "A chain at 100 percent bridged secures nothing it minted itself: every dollar was escrowed on its host chain or carried over by a bridge. Several rows sit there, and the Bridged share tab is where to read which."
  - "The opposite case is a chain whose balance is mostly its own issuance, where the bridged share falls into single digits and the Native column carries almost the whole total."
  - "A chain can be up on the week and still lose ground: the 7d vs peers column is the one that says which, because it subtracts the cohort median from the raw move."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/chain-kpis

prometheus:
  window: 24h
  # Three clocks, and only the third one stops when upstream does. The
  # Prometheus scrape reads ~20 s old whatever happens, because the harness
  # re-exports a carried-forward gauge every 30 s. Our own fetch time reads
  # under 15 min whenever the HTTP call succeeds, including when L2Beat is
  # serving stale numbers with a 200. chart.syncedUntil is when L2Beat last
  # computed a point: hourly, and 87 min behind when this was written. The
  # window below covers that normal lag plus a missed hourly point.
  expected_freshness_seconds: 14400
  freshness_timestamp_metric: chain_kpis_l2beat_synced_until_unix

panel_main_description: "Value secured that arrived from another chain, canonical plus external, in USD. The complement is value minted on the chain itself."

metric_panels:
  - id: bridged_share
    label: Bridged share
    label_key: chain
    metric: 100 * chain_bridged_tvl_usd{} / chain_tvs_usd{}
    unit: pct
    higher_is_better: true
    description: "Share of value secured that came from another chain. 100 percent means nothing was minted locally; a low number means the chain's balance is mostly its own issuance. Neither end is better: the tab sorts descending like the board, and the order is a reading aid, not a ranking."
  - id: change_7d
    label: 7d change
    label_key: chain
    metric: chain_tvs_change_7d_pct{}
    unit: pct
    higher_is_better: true
    description: "Change in total value secured over the trailing week, on the whole balance and not on the bridged part alone. Mostly the market's move: rank on the next column instead."
  - id: excess_7d
    label: 7d vs peers
    label_key: chain
    metric: chain_tvs_change_7d_excess_pct{}
    unit: pct
    higher_is_better: true
    description: "The weekly move minus the median move across every live L2Beat project above $200M. Positive means the chain gained ground on its peers."
  - id: native
    label: Native
    label_key: chain
    metric: chain_value_secured_usd{origin="native"}
    unit: usd
    higher_is_better: true
    description: "Value minted on the chain itself, with no counterpart escrowed elsewhere."
  - id: canonical
    label: Canonical
    label_key: chain
    metric: chain_value_secured_usd{origin="canonical"}
    unit: usd
    higher_is_better: true
    description: "Value locked in the chain's own escrow contracts on its host chain."
  - id: external
    label: External
    label_key: chain
    metric: chain_value_secured_usd{origin="external"}
    unit: usd
    higher_is_better: true
    description: "Value brought over by a third-party bridge rather than the chain's canonical one."

faq:
  - q: "What is the difference between bridged TVL and the TVL on DefiLlama?"
    a: "DefiLlama publishes two figures a reader may confuse with this one: its chain TVL counts what DeFi protocols on the chain hold, and its own Bridged TVL page counts all tokens held on a chain. This board republishes L2Beat's value secured instead, canonical plus external with native excluded. The three answer different questions, so one chain can show three different numbers, and only the L2Beat one is on this page."
  - q: "What does a bridged share of 100 percent mean?"
    a: "That every dollar the chain secures was escrowed on its host chain and nothing was minted locally. It is a statement about where the capital came from, not about its safety: canonical escrow is the chain's own bridge, the one whose security L2Beat rates separately."
  - q: "Why rank on bridged TVL rather than on the weekly change?"
    a: "Because a size ranking is stable and a weekly ranking is not. In a broad up week every chain rises, so a change ranking mostly reorders the market's own move. The weekly columns are on the page, and the one to read is the excess against the cohort median."
  - q: "Where are Ethereum, Solana and BNB?"
    a: "They are not in L2Beat's scaling summary, which is the source for this board. A chain with no host chain has nothing escrowed elsewhere, so there is no bridged balance to report. Note the rule is not 'only rollups': Polygon PoS, Gnosis and Hyperliquid run their own consensus and are tracked. Those L1s are ranked on the other Blockchains benchmarks linked at the foot of this page."
  - q: "Does a high bridged share mean the chain is risky?"
    a: "No, and the tab does not rank it as better or worse. It says the capital came from elsewhere, which is what a scaling chain is designed for. It becomes a risk reading only next to the bridge's own security rating, which is L2Beat's subject rather than this bench's."
