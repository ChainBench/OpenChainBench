# OpenChainBench. Bench № 089

slug: rwa-yield-accuracy
number: "089"
title: Which tokenized T-bill or yield fund actually pays what it promises
seo_title: "Tokenized treasury and yield fund promised vs delivered 2026"
seo_description: "Signed bps deviation between advertised APY and on-chain distributed yield for USDY, USTB, OUSG and SyrupUSDC. Measured live over 30 days, keyless, reproducible."
subtitle: How far the yield each tokenized U.S. Treasury actually distributes on-chain sits from the APY it advertises, in basis points over 30 days; the closest tracker ranks first, and the signed gap (paid less or more than promised) is the column beside it.

category: RWA
# Live cohort: USDY (rebase), USTB (monthly USDC dividend), OUSG
# (NAV via Ondo's Aave-style on-chain oracle), SyrupUSDC (ERC-4626).
# BUIDL + BENJI dormant: BUIDL because distributor mints conflate yield
# with new subscriptions, BENJI because the Ethereum wrapper has no
# on-chain NAV function and Franklin has not published a JSON endpoint.
status: live
metric: Yield deviation
unit: bps
higher_is_better: false

seo_intro: |
  Every tokenized U.S. Treasury on the market publishes an APY.
  Ondo USDY, Superstate USTB, Ondo OUSG, Maple SyrupUSDC, each
  advertises a yield on its public dashboard. This page measures what
  they actually pay their token holders on-chain, using each issuer's
  own distribution mechanism (daily rebase, monthly USDC dividend,
  on-chain NAV oracle, or ERC-4626 share price), and compares it to
  the advertised number. The delta in basis points, sign preserved,
  is the honest read on whether the tokenized wrapper delivers what
  the marketing page claims. Every measurement traces back to an
  on-chain event and a citable issuer disclosure. No opinion, just
  the two numbers side by side. BlackRock BUIDL and Franklin BENJI
  are on the roadmap but currently paused: measurement methodology
  for each is not yet accurate (see FAQ).

abstract: |
  For each tokenized T-bill in the cohort we compute the delivered
  yield over a 30-day rolling window from the issuer's own on-chain
  distribution mechanism, then compare to the promised APY published
  on the issuer's official dashboard. Deviation is expressed in basis
  points with sign preserved: negative means the token paid less than
  advertised over the window, positive means more. The three
  distribution mechanisms measured are rebase (USDY), monthly USDC
  dividend transfers (USTB) and NAV appreciation via on-chain oracle
  (OUSG) or ERC-4626 vault share price (SyrupUSDC). Windows: 30-day
  rolling annualized as the headline, plus 7d and lifetime for
  volatility context. BUIDL and BENJI are not yet active: BUIDL's
  distributor mints conflate new subscriptions with yield; BENJI's
  Ethereum wrapper exposes no on-chain NAV.

methodology:
  - "Cohort: USDY (Ondo), USTB (Superstate), OUSG (Ondo), SyrupUSDC (Maple). BUIDL (BlackRock) and BENJI (Franklin Templeton) measurement is currently paused: BUIDL's distributor mints conflate new subscriptions with yield distribution, making the dividend-event model inaccurate; BENJI's Ethereum wrapper exposes no on-chain NAV function and Franklin has not yet published a machine-readable NAV endpoint."
  - "Delivered yield: derived per issuer from on-chain events. Rebase-model tokens compare totalSupply snapshots (t=now vs t=window ago). Dividend-model tokens sum USDC Transfer events from the treasury wallet to holders across the window. NAV-model tokens compare share NAV snapshots published by the issuer (fetched via the issuer's public endpoint, cross-checked with the smart contract's own price oracle where one exists)."
  - "Promised yield: the APY the issuer publishes on its dashboard or fact sheet, read by hand and logged in the harness config with URL and date (last pass 2026-09-23: USDY 3.60%, OUSG 3.48%, USTB 3.78%, SyrupUSDC 5.16%; the previous pass was 2026-07-22). A stale promised value shows up as a deviation that is the curation's, not the issuer's; the Promised column shows the value in force."
  - "Windows: headline is the absolute 30-day rolling deviation (closest tracker first); the signed 30-day figure and the 7-day absolute deviation are the next columns. The harness also exposes a lifetime-since-inception series, but it is only computed for the dormant BUIDL adapter and reads zero for the live cohort, so it is not shown."
  - "Sign: delivered minus promised, in basis points, in the Signed 30d column. Negative means the token paid less than advertised over the window, positive means more. The ranking uses the absolute value: overdelivering by 20 bps is as far from the promise as underdelivering by 20 bps."
  - "Fees: promised APY is stated net of management fees. Delivered yield is measured on the same net basis. Any residual structural deviation typically reflects distribution timing (dividend-style tokens accrue daily but pay monthly), weekend accrual conventions (T-bills yield on business days only), or measurement methodology, not accounting."
  - "Cadence: on-chain reads every 60 seconds. Delivered-yield 30d rolling window is recomputed hourly (calculation is heavy, values move slowly). Promised-yield config file is reloaded every 60 seconds so a weekly update lands within a scrape cycle."
  - "Multi-chain tokens: USDY exists on Ethereum plus Solana, Aptos, Sui. V1 measures the Ethereum instance; V2 will surface per-chain deviations weighted by supply."
  - "Reproducibility: harness source at github.com/ChainBench/OpenChainBench/tree/main/harnesses/rwa-yield-accuracy. Every delivered-yield number derives from a public RPC read (contract address, event signature, block range documented). Every promised-yield number cites its source URL and date."

findings:
  - "{{best_name}} tracks its advertised yield most tightly, {{best_p50}} from its promise over the last 30 days across {{count}} measured providers; the Signed 30d column says which way."
  - "Rebase-model tokens (USDY) are the most transparent to measure. Delivered yield is a direct function of totalSupply growth on-chain, with no off-chain NAV, no distribution schedule and no treasury wallet to identify."
  - "Dividend-model tokens (USTB) settle monthly. A 30-day rolling window that starts mid-cycle will underrepresent yield until the next distribution lands. The lifetime column is the honest cross-model comparison; the 30d column is the live signal."
  - "NAV-model tokens (OUSG, SyrupUSDC) derive yield from on-chain oracle or ERC-4626 share price. Any measurable deviation typically reflects a data pipeline gap (missed NAV update, weekend interpolation) rather than a delivery gap."
  - "A persistent negative deviation greater than 20 bps warrants investigation. It can point to a management-fee timing gap, a distribution cycle mismatch, or a methodology difference between advertised APY (often SEC-standard 7-day yield) and realized post-fee yield. This benchmark reports the number; the interpretation belongs to the reader and, ultimately, the issuer's own fund managers."

faq:
  - q: "Why does the delivered yield sometimes differ from the advertised APY?"
    a: "Three main reasons. First, distribution timing: dividend-style tokens like USTB accrue yield daily but pay it monthly, so a 30-day window that starts mid-cycle undersamples. Second, weekend and holiday accrual: U.S. Treasuries do not yield on Saturdays, Sundays or federal holidays, so a naive calendar-day annualization differs from the SEC's own convention. Third, management-fee timing: fees are accrued daily but recognized at the fund level on different schedules, which can create a 5 to 30 bps short-window gap even when the annual net yield matches the advertised APY exactly."
  - q: "Which distribution model is the most transparent?"
    a: "Rebase, exemplified by USDY. Delivered yield is a pure function of totalSupply at t=now versus t=window ago, both readable on-chain by anyone. Dividend-style (USTB) is one step less transparent: delivered yield sums USDC Transfer events from the treasury wallet, which requires knowing the treasury address (documented here). NAV-style (OUSG) is the least on-chain-native: the daily NAV is set by the fund manager off-chain and posted daily; a delayed NAV update looks like a yield gap even when the underlying portfolio is fine. SyrupUSDC sits between: its ERC-4626 convertToAssets share price is fully on-chain but the underlying loan book is off-chain."
  - q: "Where does the promised yield come from?"
    a: "From each issuer's own public dashboard or fund fact sheet, read by hand; each entry in the harness config logs the source URL and the date the value was last read, and the Promised column shows the value in force. The readings are not weekly in practice (2026-07-22, then 2026-09-23), so a deviation can be the curation lagging a rate move rather than the issuer. When an issuer updates the advertised APY, the change is picked up on the next config reload."
  - q: "Can this benchmark tell me if an issuer is misrepresenting yield?"
    a: "No. It tells you how the delivered yield tracks the advertised yield over a specific window. A persistent negative deviation is a signal worth investigating, but the cause can be timing, methodology, weekend conventions or fee schedules. This bench provides the number; investors and regulators can investigate the cause with the issuer directly."
  - q: "Why are BUIDL and BENJI not in the cohort?"
    a: "Both are dormant pending harness improvements. BUIDL (BlackRock) uses a Securitize distributor that mints additional BUIDL shares rather than transferring USDC, so the dividend-Transfer model reports zero and conflates new subscriptions with yield. Separating the two requires cross-referencing Securitize's monthly distribution announcements, which is on the roadmap. BENJI (Franklin Templeton) primarily lives on Stellar; its Ethereum wrapper exposes no on-chain NAV function, and Franklin has not yet published a machine-readable JSON endpoint. Outreach was sent to Franklin's digital assets team; the probe activates once an endpoint is confirmed."
  - q: "Why don't you include DAI, USDS, sUSDe or other yield-bearing stablecoins?"
    a: "This bench is scoped to tokenized U.S. Treasury and money-market funds where an off-chain issuer publishes a specific advertised APY that can be compared to delivered yield. Yield-bearing stablecoins backed by CDP interest, LSTs or perp funding are a different question with a different measurement contract; they may join a sibling bench later."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rwa-yield-accuracy

prometheus:
  window: 30d
  freshness_metric: rwa_yield_last_measured_unix
  expected_freshness_seconds: 3600

metric_panels:
  - id: promised
    label: Promised APY
    metric: rwa_yield_promised_bps
    label_key: token
    unit: bps
    higher_is_better: true
    tab: false
    description: "The APY the issuer advertises, as read by hand on the date logged in the harness config."
  - id: delivered
    label: Delivered 30d
    metric: rwa_yield_delivered_bps_30d
    label_key: token
    unit: bps
    higher_is_better: true
    description: "Annualized yield actually distributed on-chain over the trailing 30 days, from the issuer's own mechanism (rebase, dividend transfers, NAV oracle, ERC-4626 share price)."
  - id: aum
    label: AUM
    metric: rwa_yield_aum_usd
    label_key: token
    unit: usd
    higher_is_better: true
    description: "Token supply times NAV, in USD, read on-chain."

ledger_columns:
  - { label: "|Deviation| 30d", slot: p50 }
  - { label: "Signed 30d", slot: p99 }
  - { label: "Promised", panel: promised }
  - { label: "Delivered 30d", slot: mean }
  - { label: "|Deviation| 7d", slot: p90 }
  - { label: "AUM", panel: aum }

providers:
  # BUIDL + BENJI dormant per the spec comment above (distributor mints
  # conflate yield with new subscriptions on BUIDL, no on-chain NAV on
  # BENJI). Removed from the public providers list until the harness
  # can emit a defensible number; kept in methodology text as context.
  - slug: usdy
    name: USDY
    tag: "Ondo, Ethereum + Solana + Aptos + Sui, daily rebase"
    formula: "USDY totalSupply growth (t=now vs t=30d ago), annualized. Rebase happens daily via the smart contract; delivered yield is a direct function of supply growth. Compared to Ondo's stated APY."
    queries:
      p50: abs(rwa_yield_deviation_bps_30d{token="usdy"})
      p90: abs(rwa_yield_deviation_bps_7d{token="usdy"})
      p99: rwa_yield_deviation_bps_30d{token="usdy"}
      mean: rwa_yield_delivered_bps_30d{token="usdy"}
      success: rwa_yield_probe_ok{token="usdy"}
      sample_size: count_over_time(rwa_yield_delivered_bps_30d{token="usdy"}[30d])
      series: rwa_yield_delivered_bps_30d{token="usdy"}

  - slug: ustb
    name: USTB
    tag: "Superstate, Ethereum, monthly USDC dividend"
    formula: "Sum of USDC Transfer events from the Superstate treasury wallet to USTB holders over 30d, divided by average USTB supply, annualized. Compared to Superstate's stated APY."
    queries:
      p50: abs(rwa_yield_deviation_bps_30d{token="ustb"})
      p90: abs(rwa_yield_deviation_bps_7d{token="ustb"})
      p99: rwa_yield_deviation_bps_30d{token="ustb"}
      mean: rwa_yield_delivered_bps_30d{token="ustb"}
      success: rwa_yield_probe_ok{token="ustb"}
      sample_size: count_over_time(rwa_yield_delivered_bps_30d{token="ustb"}[30d])
      series: rwa_yield_delivered_bps_30d{token="ustb"}

  - slug: ousg
    name: OUSG
    tag: "Ondo, Ethereum, NAV appreciation"
    formula: "NAV growth of the OUSG token, NAV(t=now) vs NAV(t=30d ago), annualized. NAV is published by Ondo daily. Compared to Ondo's stated OUSG APY."
    queries:
      p50: abs(rwa_yield_deviation_bps_30d{token="ousg"})
      p90: abs(rwa_yield_deviation_bps_7d{token="ousg"})
      p99: rwa_yield_deviation_bps_30d{token="ousg"}
      mean: rwa_yield_delivered_bps_30d{token="ousg"}
      success: rwa_yield_probe_ok{token="ousg"}
      sample_size: count_over_time(rwa_yield_delivered_bps_30d{token="ousg"}[30d])
      series: rwa_yield_delivered_bps_30d{token="ousg"}

  - slug: syrup-usdc
    name: SyrupUSDC
    tag: "Maple, Ethereum, ERC-4626 NAV"
    formula: "ERC-4626 convertToAssets(1 share) delta over 30d, annualized. SyrupUSDC is Maple's yield-bearing USDC vault backed by institutional loans, not T-bills. Compared to the pool's base APY on DefiLlama (excludes SYRUP token incentives)."
    queries:
      p50: abs(rwa_yield_deviation_bps_30d{token="syrup-usdc"})
      p90: abs(rwa_yield_deviation_bps_7d{token="syrup-usdc"})
      p99: rwa_yield_deviation_bps_30d{token="syrup-usdc"}
      mean: rwa_yield_delivered_bps_30d{token="syrup-usdc"}
      success: rwa_yield_probe_ok{token="syrup-usdc"}
      sample_size: count_over_time(rwa_yield_delivered_bps_30d{token="syrup-usdc"}[30d])
      series: rwa_yield_delivered_bps_30d{token="syrup-usdc"}
