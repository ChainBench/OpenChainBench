          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="kujira", region="sgp"}[1h])

  - slug: lavenderfive
    name: LavenderFive
    tag: Cosmos validator and no-key RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to LavenderFive's no-key Kujira endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="kujira"})
