# OpenChainBench. Bench № 171

slug: kujira-rpc
number: "171"
title: Fastest free Kujira RPC, live no-key endpoint latency
seo_title: "Fastest free Kujira RPC 2026"
seo_description: "{{best_name}} leads free Kujira RPC at {{best_p50}} (Tendermint status p50, 24h). 3 no-key providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for the Tendermint status method against every free, no-key public Kujira Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Kujira (kaiyo-1) is a Cosmos SDK blockchain hosting FIN (a fully on-chain order book DEX), ORCA (a liquidation platform), and USK (a decentralized stablecoin), KUJI staking token, using CometBFT consensus. Polkachu, PublicNode, and LavenderFive provide keyless Tendermint RPC endpoints probed every 60 seconds from three regions.

abstract: |
  Per-chain member of the RPC latency cluster, extended to Kujira.
  We measure the round-trip latency of a single, identical Cosmos SDK call
  (Tendermint `status`) against every no-key public Kujira endpoint
  that sustains continuous probing, 3 providers at launch,
  every 60 seconds, from us-east, eu-west and Singapore. The harness
  classifies every response (ok / http_err / jsonrpc_err / stale /
  timeout) so the leaderboard rewards sustained availability rather than
  fast error messages. The cross-chain view lives on the parent
  `rpc-capabilities` benchmark; this page is the Kujira-scoped answer
  with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"status\",\"params\":[]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms to 10 s), so percentiles are computed via Prometheus `quantile_over_time` over the last 24 hours."
  - "Call-result classification: `ok` (HTTP 200 + non-empty result with a parsable decimal `sync_info.latest_block_height`), `http_err`, `jsonrpc_err`, `stale` (more than 40 blocks behind the cross-provider tip), `timeout`."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities) benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to `chain=\"kujira\"`. Provider coverage at launch: 3 no-key endpoints (Polkachu, PublicNode, LavenderFive)."

findings:
  - "{{best_name}} currently leads free Kujira RPC at {{best_p50}} (Tendermint `status` p50, 24h) across 3 measured providers."

faq:
  - q: "What is the fastest free Kujira RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (Tendermint `status` p50 over the last 24h), measured against 3 no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Kujira RPCs work without an API key?"
    a: "3 endpoints sustain continuous keyless probing at launch: Polkachu, PublicNode, LavenderFive. Every listed endpoint was live-verified before inclusion."
  - q: "Does the fastest Kujira RPC change by region?"
    a: "Often. The region tabs at the top of the page re-scope every number to a single origin; pick the one closest to where your requests originate."
  - q: "How is Kujira RPC latency measured here?"
    a: "One identical Tendermint `status` POST every 60 seconds against each provider from each of 3 regions. Responses are classified so an endpoint stuck on an old block is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="kujira"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: polkachu
    name: Polkachu
    tag: Community Cosmos validator and public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Polkachu's no-key Kujira endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="kujira"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="polkachu", chain="kujira"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="polkachu", chain="kujira"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="polkachu", chain="kujira"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="polkachu", chain="kujira"}) / sum(ocb:rpc_call:rate_24h{provider="polkachu", chain="kujira"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="polkachu", chain="kujira"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="kujira"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="kujira", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="kujira", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="kujira", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="kujira", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="kujira", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="kujira", region="sgp"}[1h])

