    name: PublicNode
    tag: Allnodes-operated, 70+ chains
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Kujira endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="kujira"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="kujira"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="kujira"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="kujira"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="kujira"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="kujira"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="kujira"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="kujira"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="kujira", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="kujira", region="us-east"}[1h])
        - region: eu-west
