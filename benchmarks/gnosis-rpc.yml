# OpenChainBench. Bench № 056

slug: gnosis-rpc
number: "056"
title: "Gnosis RPC endpoints: free public URLs by latency"
seo_title: "Gnosis RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Gnosis RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Gnosis RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Gnosis is where official does not mean fast: the chain-official `rpc.gnosischain.com` measures {{p50:gnosis-official}} p50 on the 3-region average against {{best_p50}} for {{best_name}}, and several third-party gateways sit in between. {{count}} no-key providers, the same `eth_getBlockByNumber` call every 60 seconds, three regions.

abstract: |
  Gnosis: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:gnosis-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Gnosis endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore. The harness also classifies every response (ok / http_err / jsonrpc_err / stale / timeout) and audits archive depth every 5 minutes, so the leaderboard rewards sustained, honest availability rather than a fast error message. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Gnosis-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the latest-header fetch with a rotating id defeats edge caches that answer eth_blockNumber without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Gnosis-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=\"gnosis\". Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. Nodies was delisted 2026-07 when its Gnosis endpoint moved behind a paid plan. Exclusions follow the cluster-wide rules documented on the parent benchmark."

faq:
  - q: "Which Gnosis RPCs work without an API key?"
    a: "The {{count}} providers on this page are listed with their URLs in the endpoints table above. Nodies was delisted in July 2026 when its Gnosis endpoint moved behind a paid plan. Every (provider, chain) pair was live-verified no-key before inclusion, and anything that key-gates, region-blocks or rate-limits below our 60-second cadence is excluded rather than listed with an asterisk."
  - q: "Should I use rpc.gnosischain.com as my Gnosis RPC?"
    a: "Only as a fallback. It measures {{p50:gnosis-official}} at the median across three regions against {{best_p50}} for the leader, though its reliability and head freshness are fine. The measured leaders above serve the same chain at {{best_p50}}; keep the official endpoint in the rotation for redundancy rather than as primary."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on region alone.
rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="gnosis"})

# Region is the only dimension: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://gnosis-rpc.publicnode.com
    tag: Allnodes-operated, 70+ chains, archive on most
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Gnosis endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="gnosis"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="gnosis"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="gnosis"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="gnosis"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="gnosis"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="gnosis"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="gnosis"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="gnosis"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="gnosis", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="gnosis", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="gnosis", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="gnosis", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="gnosis", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="gnosis", region="sgp"}[1h])

