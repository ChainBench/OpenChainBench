# OpenChainBench. Bench № 300

slug: polygon-rpc-ws
number: "300"
title: Fastest private Polygon WebSocket push, per-block race across keyed RPC providers
seo_title: "Fastest Polygon WebSocket RPC push 2026, private endpoints"
seo_description: "{{best_name}} pushes the most Polygon blocks first over WebSocket, {{best_p50}} of those it received (24h), among Alchemy, Chainstack, Dwellir, GetBlock and Quicknode."
subtitle: Share of Polygon blocks each provider pushed first over WebSocket, per region, across API-key endpoints probed from us-east, eu-west and Singapore.

category: RPCs
status: live
source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-keyed-latency
metric: First to push
unit: pct
higher_is_better: true
# A provider that never wins a race reads 0%, a result, not a missing value.
zero_is_a_value: true

seo_intro: |
  A bot that subscribes to eth_subscribe(newHeads) does not care what a
  provider's median HTTP latency is. It cares who hands it block N first.
  This page races the private (Polygon) cohort: one WebSocket per provider
  per region, open ten minutes in every hour across the whole cohort,
  every frame timestamped on arrival, and each block credited to whichever
  provider delivered it earliest in that region. {{best_name}} currently
  leads, first on {{best_p50}} of the blocks it received (24h), across
  {{count}} keyed providers.

  The figure is a share of wins, not a latency. A provider at 0% received
  the blocks but never first; read it with the coverage column, which
  counts the blocks each provider delivered against the cohort maximum.

abstract: |
  Private, API-key Polygon endpoints raced on WebSocket delivery. One
  harness holds an eth_subscribe(newHeads) subscription per provider in
  each of three regions and timestamps every push on receipt. Per block,
  the earliest arrival in that region wins; each provider's figure is the
  share of the blocks it received that it delivered first.

  The same process runs the HTTP arm of the keyed cohort, which is
  deliberate: comparing arrival times recorded by separate processes would
  compare clocks as much as providers, and the differences here are tens
  of milliseconds.

methodology:
  - "Race, not latency: all providers wait for the same block, so only who delivers it first belongs to them. The published figure is each provider's share of the blocks it received that it delivered first in its region, pooled over 24h. A provider at 0% received the blocks, never first."
  - "One socket per provider per region, eth_subscribe(newHeads), opened for the same ten minutes of every hour across the whole cohort and closed with the window. Every frame is timestamped on receipt. The window is aligned to the clock rather than to each connection, because a race only means something if every provider is listening to the same blocks."
  - "Sampled rather than continuous since 2026-10-17, and the reason is ours: a permanent subscription on nine chains pushed about 138 million messages a month per provider against 583 thousand HTTP probes, and one vendor reached its monthly limit. The three fastest chains left the arm and the rest listen a sixth of the time. Racing a provider until its account is exhausted would remove it from nine other pages."
  - "Reconnections are a published result, not an implementation detail: a provider that drops twice in two minutes is unusable to a subscriber whatever its share of wins says."
  - "GetBlock issues one WebSocket token per chain per region, so its three cells are distinct endpoints rather than one URL probed from three places."
  - "Validation Cloud is listed on the HTTP cohorts of this chain but not here: its WebSocket endpoint refuses the upgrade in all three regions (`websocket: bad handshake`), so there is nothing to race. Measured over 3h on 2026-10-17: 542 reconnection attempts, zero frames. The row returns when the endpoint opens."
  - "Alchemy joined this race on 13 November 2026. Its endpoint bills a subscription by the byte it pushes, so the probe holds a monthly byte budget per region for Alchemy and closes its sockets when the budget is spent; the HTTP rows on the same key are unaffected. A month in which the budget trips shows Alchemy with fewer blocks seen, which the coverage column makes visible."
  - "Same keyed endpoints as the HTTP cohort on this chain, same keys, same three regions. Keys live in the probe environment, never in this repository. Plan tiers are disclosed on the HTTP cohort's methodology."

expected_n: 29000

prometheus:
  window: 24h
  freshness_metric: rpc_ws_head_seen_total

# Per-cell (region) ranking matrix for scoped badge claims. Chain is fixed for
# the whole bench, so cells key on provider and region.
rank_matrix_query: 100 * sum by (provider, region) (ocb:rpc_ws_head_first:increase_24h{chain="polygon",tier="keyed"}) / sum by (provider, region) (ocb:rpc_ws_head_seen:increase_24h{chain="polygon",tier="keyed"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

faq:
  - q: "Which private RPC provider pushes new Polygon blocks first over WebSocket?"
    a: "{{best_name}}, first on {{best_p50}} of the blocks it received over 24h. {{worst_name}} wins the fewest races, at {{worst_p50}}. The board re-scores on every Polygon block. Read the coverage column too: a provider can win the races it runs and still skip blocks."
  - q: "Why a share of wins rather than a lag in milliseconds?"
    a: "Because the race is relative. The earliest arrival starts the clock for each block, so the winner's lag is zero by construction and a median lag mostly says how often a provider wins. The share of first arrivals says it directly. It is read per provider over the blocks it received, so a provider raced from one region compares fairly with one raced from three."
  - q: "Is this the same as the HTTP latency cohort on this chain?"
    a: "Same providers, same keys, same regions, different question. The HTTP cohort measures a request you send; this measures a push you wait for, and the two orderings are not the same. GetBlock issues one WebSocket token per chain per region, so its three cells are distinct endpoints rather than one URL probed from three places."
  - q: "Could a provider win by pushing blocks before validating them?"
    a: "In principle, at the cost of occasionally pushing something that gets retracted. That is why coverage is published next to the share of wins: a provider that wins by pushing early but wrong shows gaps, and the coverage column counts blocks seen against the cohort maximum. Hash-level cross-checking against an independent reference is not in this version."

providers:
  - slug: alchemy
    name: Alchemy
    tag: Private WS, same keyed endpoint as the HTTP cohort
    formula: "Share of the Polygon blocks this provider received over eth_subscribe(newHeads) that it delivered first in its region, from one socket per provider per region, pooled over 24h."
    queries:
      p50: 100 * sum(ocb:rpc_ws_head_first:increase_24h{provider="alchemy",chain="polygon",tier="keyed"}) / sum(ocb:rpc_ws_head_seen:increase_24h{provider="alchemy",chain="polygon",tier="keyed"})
      success: clamp_max(sum(increase(rpc_ws_head_seen_total{provider="alchemy",chain="polygon",tier="keyed"}[24h])) / max(sum by (provider) (increase(rpc_ws_head_seen_total{chain="polygon",tier="keyed"}[24h]))), 1)
      sample_size: sum(increase(rpc_ws_head_seen_total{provider="alchemy",chain="polygon",tier="keyed"}[24h]))
      series: 100 * sum(increase(rpc_ws_head_first_total{provider="alchemy",chain="polygon",tier="keyed"}[1h])) / sum(increase(rpc_ws_head_seen_total{provider="alchemy",chain="polygon",tier="keyed"}[1h]))
      regions:
        - region: us-east
          p50: 100 * sum(ocb:rpc_ws_head_first:increase_24h{provider="alchemy",chain="polygon",tier="keyed",region="us-east"}) / sum(ocb:rpc_ws_head_seen:increase_24h{provider="alchemy",chain="polygon",tier="keyed",region="us-east"})
          series: 100 * sum(increase(rpc_ws_head_first_total{provider="alchemy",chain="polygon",tier="keyed",region="us-east"}[1h])) / sum(increase(rpc_ws_head_seen_total{provider="alchemy",chain="polygon",tier="keyed",region="us-east"}[1h]))
        - region: eu-west
          p50: 100 * sum(ocb:rpc_ws_head_first:increase_24h{provider="alchemy",chain="polygon",tier="keyed",region="eu-west"}) / sum(ocb:rpc_ws_head_seen:increase_24h{provider="alchemy",chain="polygon",tier="keyed",region="eu-west"})
          series: 100 * sum(increase(rpc_ws_head_first_total{provider="alchemy",chain="polygon",tier="keyed",region="eu-west"}[1h])) / sum(increase(rpc_ws_head_seen_total{provider="alchemy",chain="polygon",tier="keyed",region="eu-west"}[1h]))
        - region: ap-southeast
          p50: 100 * sum(ocb:rpc_ws_head_first:increase_24h{provider="alchemy",chain="polygon",tier="keyed",region="sgp"}) / sum(ocb:rpc_ws_head_seen:increase_24h{provider="alchemy",chain="polygon",tier="keyed",region="sgp"})
          series: 100 * sum(increase(rpc_ws_head_first_total{provider="alchemy",chain="polygon",tier="keyed",region="sgp"}[1h])) / sum(increase(rpc_ws_head_seen_total{provider="alchemy",chain="polygon",tier="keyed",region="sgp"}[1h]))

