# OpenChainBench. Bench No 224

slug: vechain-rpc
number: "224"
title: Fastest free VeChain RPC, live no-key endpoint latency
seo_title: "Fastest free VeChain RPC 2026"
seo_description: "{{best_name}} leads free VeChain RPC at {{best_p50}} (blocks/best number p50, 24h). 3 providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for GET /blocks/best against every available public VeChain node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  VeChain is a proof-of-authority enterprise blockchain targeting supply chain transparency and IoT use cases, producing one block every 10 seconds. It uses a two-token model (VET + VTHO) and exposes a REST API at /blocks/best for the latest committed block. Public REST endpoints are available without an API key from the VeChain Foundation (mainnet.vechain.org, vethor-node.vechain.com) and VeChain.energy. Every provider was live-verified with consecutive block probes at launch.

abstract: |
  Per-chain member of the RPC latency cluster, extended to VeChain.
  We measure the round-trip latency of a single REST call (GET
  /blocks/best) against every available public VeChain node that
  sustains continuous probing: 3 providers at launch, every 60
  seconds, from us-east, eu-west and Singapore. The harness classifies
  every response (ok / http_err / jsonrpc_err / stale / timeout) with
  a VeChain-scaled staleness gap (30 blocks, around 5 min at
  10 s/block). The cross-chain view lives on the parent
  rpc-capabilities benchmark; this page is the VeChain-scoped answer
  with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: HTTP GET /blocks/best. Plain REST call. The response carries number as a plain unsigned integer."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms to 10 s), so percentiles are computed via Prometheus quantile_over_time over the last 24 hours."
  - "Call-result classification: ok (HTTP 200 + parsable number integer), http_err, jsonrpc_err, stale (block more than 30 behind the cross-provider tip), timeout. Latency without reliability is a misleading ranking signal."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain rpc-capabilities benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to chain=vechain. Provider coverage at launch: 3 endpoints (VeChain Foundation x2, VeChain.energy)."

findings:
  - "{{best_name}} currently leads VeChain RPC at {{best_p50}} (blocks/best number p50, 24h) across 3 measured providers."

faq:
  - q: "What is the fastest free VeChain RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (VeChain block number p50 over the last 24h), measured against 3 providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which VeChain RPC endpoints work without an API key?"
    a: "3 endpoints sustain continuous keyless probing at launch: VeChain Foundation mainnet node (mainnet.vechain.org), VeThor Node (vethor-node.vechain.com) and VeChain.energy community node (node-mainnet.vechain.energy). Every listed endpoint was live-verified with a blocks/best call returning a parsable block number before inclusion."
  - q: "Does the fastest VeChain RPC change by region?"
    a: "Often. Public infra concentrates in specific regions; a gateway that wins from Amsterdam can lose from Singapore by multiples. The region tabs at the top of the page re-scope every number to a single origin."
  - q: "How is VeChain RPC latency measured here, technically?"
    a: "One GET /blocks/best REST call every 60 seconds against each provider from each of 3 regions. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus quantile_over_time over 24 hours. Best-effort measurements; p50 is the median, p90 the 90th percentile and p99 the 99th percentile of latency samples collected over the last 24 hours."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="vechain"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: vechain-foundation
    name: VeChain Foundation
    tag: VeChain Foundation official mainnet node, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /blocks/best sent every 60s from 3 regions to mainnet.vechain.org."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vechain-foundation", chain="vechain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="vechain-foundation", chain="vechain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="vechain-foundation", chain="vechain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="vechain-foundation", chain="vechain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="vechain-foundation", chain="vechain"}) / sum(ocb:rpc_call:rate_24h{provider="vechain-foundation", chain="vechain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="vechain-foundation", chain="vechain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="vechain-foundation", chain="vechain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vechain-foundation", chain="vechain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="vechain-foundation", chain="vechain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vechain-foundation", chain="vechain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="vechain-foundation", chain="vechain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vechain-foundation", chain="vechain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="vechain-foundation", chain="vechain", region="sgp"}[1h])

  - slug: vethor-node
    name: VeThor Node
    tag: VeChain Foundation VeThor public node, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /blocks/best sent every 60s from 3 regions to vethor-node.vechain.com."
    queries:
