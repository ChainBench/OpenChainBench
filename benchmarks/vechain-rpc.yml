          series: avg_over_time(rpc_latency_milliseconds{provider="vethor-node", chain="vechain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vethor-node", chain="vechain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="vethor-node", chain="vechain", region="sgp"}[1h])

  - slug: vechain-energy
    name: VeChain.energy
    tag: VeChain.energy community node, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /blocks/best sent every 60s from 3 regions to node-mainnet.vechain.energy."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vechain-energy", chain="vechain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="vechain-energy", chain="vechain"})
