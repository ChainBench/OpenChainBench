# OpenChainBench. Bench No 224

slug: vechain-rpc
number: "224"
title: "VeChain RPC endpoints: free public URLs by latency"
seo_title: "VeChain RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free VeChain RPC at {{best_p50}} (blocks/best number p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for GET /blocks/best against every available public VeChain node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  VeChain is a proof-of-authority enterprise blockchain targeting supply chain transparency and IoT use cases, producing one block every 10 seconds. It uses a two-token model (VET + VTHO) and exposes a REST API at /blocks/best for the latest committed block. Public REST endpoints are available without an API key from the VeChain Foundation (mainnet.vechain.org, vethor-node.vechain.com) and VeChain.energy. Every provider was live-verified with consecutive block probes at launch.

abstract: |
  VeChain: {{count}} free public RPC endpoints answering `GET /blocks/best` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single REST call (GET /blocks/best) against every available public VeChain node that sustains continuous probing: {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a VeChain-scaled staleness gap (30 blocks, around 5 min at 10 s/block). The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the VeChain-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: HTTP GET /blocks/best. Plain REST call. The response carries number as a plain unsigned integer."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the VeChain-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=vechain. Provider coverage today: {{count}} endpoints (VeChain Foundation x2, VeChain.energy)."

faq:
  - q: "Which VeChain RPC endpoints work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today: VeChain Foundation mainnet node (mainnet.vechain.org), VeThor Node (vethor-node.vechain.com) and VeChain.energy community node (node-mainnet.vechain.energy). Every listed endpoint was live-verified with a blocks/best call returning a parsable block number before inclusion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="vechain"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: vechain-foundation
    name: VeChain Foundation
    endpoint: https://mainnet.vechain.org
    tag: VeChain Foundation official mainnet node, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /blocks/best sent every 60s from 3 regions to mainnet.vechain.org."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vechain-foundation", chain="vechain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="vechain-foundation", chain="vechain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="vechain-foundation", chain="vechain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="vechain-foundation", chain="vechain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="vechain-foundation", chain="vechain"}) / sum(ocb:rpc_call:rate_24h{provider="vechain-foundation", chain="vechain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="vechain-foundation", chain="vechain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="vechain-foundation", chain="vechain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vechain-foundation", chain="vechain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="vechain-foundation", chain="vechain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vechain-foundation", chain="vechain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="vechain-foundation", chain="vechain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vechain-foundation", chain="vechain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="vechain-foundation", chain="vechain", region="sgp"}[1h])

  - slug: vethor-node
    name: VeThor Node
    endpoint: https://vethor-node.vechain.com
    tag: VeChain Foundation VeThor public node, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /blocks/best sent every 60s from 3 regions to vethor-node.vechain.com."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vethor-node", chain="vechain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="vethor-node", chain="vechain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="vethor-node", chain="vechain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="vethor-node", chain="vechain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="vethor-node", chain="vechain"}) / sum(ocb:rpc_call:rate_24h{provider="vethor-node", chain="vechain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="vethor-node", chain="vechain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="vethor-node", chain="vechain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vethor-node", chain="vechain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="vethor-node", chain="vechain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vethor-node", chain="vechain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="vethor-node", chain="vechain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vethor-node", chain="vechain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="vethor-node", chain="vechain", region="sgp"}[1h])

  - slug: vechain-energy
    name: VeChain.energy
    endpoint: https://node-mainnet.vechain.energy
    tag: VeChain.energy community node, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /blocks/best sent every 60s from 3 regions to node-mainnet.vechain.energy."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vechain-energy", chain="vechain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="vechain-energy", chain="vechain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="vechain-energy", chain="vechain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="vechain-energy", chain="vechain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="vechain-energy", chain="vechain"}) / sum(ocb:rpc_call:rate_24h{provider="vechain-energy", chain="vechain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="vechain-energy", chain="vechain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="vechain-energy", chain="vechain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vechain-energy", chain="vechain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="vechain-energy", chain="vechain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vechain-energy", chain="vechain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="vechain-energy", chain="vechain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="vechain-energy", chain="vechain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="vechain-energy", chain="vechain", region="sgp"}[1h])
