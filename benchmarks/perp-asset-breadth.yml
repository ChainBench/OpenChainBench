# OpenChainBench. Bench 124

slug: perp-asset-breadth
number: "124"
title: "Perp DEX asset breadth: non-crypto markets live, forex + stocks + indices + commodities"
seo_title: "Perp DEX asset breadth 2026"
seo_description: "Hyperliquid leads perp DEX asset breadth with 143 non-crypto markets live, through its HIP-3 builder dexes (TSLA, NVDA, GOLD, EUR, US500). Extended 131, Aster 124, Gains 110 across forex, stocks, indices and commodities. Live count updated every 5 minutes."
subtitle: "Total number of tradable non-crypto perpetual markets per venue: forex currency pairs, tokenized stocks, indices and commodities. Higher means broader asset coverage beyond BTC/ETH/SOL. Live count updated every 5 minutes."
category: Trading
status: live
metric: Non-crypto markets
unit: count
higher_is_better: true

disclaimer: |
  Counts reflect each venue's catalog at query time, mainnet only (testnets excluded). Gains and Lighter are classed by Mobula's editorial assetClass tag; the other venues by the same four classes read from their own APIs. Hyperliquid's total includes markets deployed by third parties under HIP-3, which the exchange hosts but does not list itself.

seo_intro: |
  Most perp DEX comparisons measure fees, funding and volume on BTC and ETH.
  They ignore a structural question: which venues let you trade assets that
  are not crypto? This benchmark measures the live count of non-crypto
  perpetual markets, including forex pairs like EUR/USD and GBP/JPY, tokenized
  stocks like AAPL and NVDA, indices like SPX and NDX, and commodities like
  XAU and WTI crude, across the major onchain perp venues.

  The ranking changed hands in 2026. Hyperliquid now lists the most,
  around 143, not on its core exchange but through HIP-3: ten builder-deployed
  dexes carrying equities, indices, metals and FX (xyz:TSLA, km:EUR,
  cash:US500). Extended and Aster follow. Gains, at about 110, remains the
  widest catalog native to a single EVM venue and the deepest across all four
  classes at once. GMX v2 and dYdX v4 stay effectively crypto-only.

  For a trader hedging FX or taking leveraged equity exposure on-chain, the
  question is no longer "which venue has any of this" but which one has it
  natively rather than through a third-party deployer.

abstract: |
  Every 5 minutes the harness counts, per venue, the live markets whose asset
  class is forex, stocks, indices or commodities. Gains and Lighter come from
  the Mobula perp pairs catalog (GET /api/2/perp/pairs) and its assetClass
  tag; the other venues come from their own APIs through the same cohort
  harness. degen (leverage variants of crypto pairs) and new (listed but
  unclassified) are excluded: neither is a new asset class.

  Hyperliquid is counted across its HIP-3 builder dexes as well as its core
  universe. Those markets are deployed by third parties on Hyperliquid, not
  listed by the exchange itself, and the count says so rather than crediting
  or discounting them silently.

methodology:
  - "Cadence: every 5 minutes. Source: Mobula /api/2/perp/pairs for Gains and Lighter; each other venue through its own API in the same cohort harness."
  - "Gains: Mobula catalog bucketed by assetClass. Counted classes: forex (EUR/USD, GBP/JPY...), stocks (AAPL, TSLA, NVDA, AMZN...), indices (SPX, NDX, DJI...), commodities (XAU, XAG, WTI, NATGAS...). Mainnet only (arbitrum-sepolia excluded)."
  - "Lighter: same Mobula catalog. Lighter lists non-crypto markets but with smaller catalogs per class."
  - "Hyperliquid: core universe plus every HIP-3 builder dex (info perpDexs, then meta per dex). On 2026-09-22 the builder dexes carried 290 markets across 10 deployers, most of them equities, indices, metals and FX."
  - "GMX v2: DataStore onchain pairs. Almost entirely crypto, with a small commodities and index tail."
  - "dYdX v4: indexer perpetualMarkets. Effectively crypto-only, with a two-market commodities tail."
  - "Ostium, Extended, Aster, Ondo and Paradex are ranked here too: each is read through its own API by the same harness, with the same four counted classes."
  - "Asset class taxonomy: Mobula editorial, updated at listing time. The bench re-reads on every 5-minute tick so new listings appear automatically."

findings:
  - "{{best_name}} leads non-crypto perp breadth with {{best_p50}} active markets in forex, stocks, indices and commodities combined."
  - "Hyperliquid reaches {{p50:hyperliquid}} almost entirely through HIP-3: ten builder-deployed dexes listing equities (xyz:TSLA, cash:NVDA), indices (km:US500), metals (flx:GOLD) and FX (mkts:EUR). Its core exchange stays crypto."
  - "Gains lists {{p50:gains}}, the widest catalog native to one EVM venue: forex (EUR/USD, GBP/JPY...), stocks (AAPL, TSLA, NVDA...), indices (SPX, NDX, DAX...) and commodities (XAU, WTI...)."
  - "GMX v2 at {{p50:gmx}} and dYdX v4 at {{p50:dydx}} remain effectively crypto-only; Lighter lists {{p50:lighter}} across all four classes with smaller per-class catalogs."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/perp-cohort-stats

prometheus:
  window: 24h
  expected_freshness_seconds: 600
  freshness_metric: perp_venue_noncore_markets_total

faq:
  - q: "What counts as a non-crypto market?"
    a: "Forex: currency pairs like EUR/USD, GBP/JPY. Stocks: tokenized equities like AAPL/USD, TSLA/USD. Indices: index perpetuals like SPX/USD, NDX/USD. Commodities: XAU/USD (gold), XAG/USD (silver), WTI/USD (crude oil), NATGAS/USD. The classification uses Mobula's editorial assetClass tag."
  - q: "Why are degen and new markets excluded?"
    a: "degen markets are high-leverage variants of existing crypto pairs (BTCDEGEN, ETHDEGEN); they do not represent a new asset class. new markets are newly listed pairs pending classification. Both are excluded to give an honest count of genuine non-crypto breadth."
  - q: "Can I trade US stocks 24/7 on Gains?"
    a: "Gains lists synthetic stock perpetuals. Trading availability during off-hours depends on the venue's oracle and liquidity configuration. The market is listed but execution conditions may differ from market-hours trading."
  - q: "How often does the market list change?"
    a: "The Mobula catalog is updated when venues list or delist pairs. The bench re-reads every 5 minutes so new listings appear automatically within one polling cycle."
  - q: "Do Hyperliquid's HIP-3 markets count as Hyperliquid's?"
    a: "They are listed and margined on Hyperliquid, and a trader reaches them from the same account, so they are counted. They are deployed by third-party builders rather than by the exchange, which is why the finding names HIP-3 explicitly: Hyperliquid's own core universe stays crypto, and the breadth comes from its deployers."

