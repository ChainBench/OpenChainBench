# OpenChainBench. Bench No 289

slug: neox-rpc
number: "289"
title: "Neo X RPC endpoints: free public URLs by latency"
seo_title: "Neo X RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Neo X RPC at {{best_p50}} (`eth_getBlockByNumber` p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for the `eth_getBlockByNumber(\"latest\", false)` method against every free, no-key public Neo X EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Neo X is Neo's EVM-compatible sidechain (chain 47763). Its keyless roster is unusual: a pair of Bane Labs endpoints (mainnet-1 and mainnet-2.rpc.banelabs.org) plus Thirdweb (47763.rpc.thirdweb.com), all returning chain id 0xba93 on the 2026-10-07 sweep. Neither dRPC nor PublicNode routes Neo X, so two thirds of this board is one operator behind two hostnames, and the page is honest about that rather than presenting three independent choices.

abstract: |
  Neo X: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:neox-official-1}}.
  We measure the round-trip latency of a single, identical JSON-RPC call (`eth_getBlockByNumber(\"latest\", false)`) against every no-key public Neo X endpoint that sustains continuous probing, {{count}} providers measured, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a Neo X-scaled staleness gap (20 blocks at Neo X's ~1 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Neo X-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\", false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the rotating id defeats edge caches that would answer a bare head query without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the exclusion rules follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Neo X-scoped view of the same harness."
  - "Roster: every endpoint here answered a real `eth_getBlockByNumber` call without a key on the 2026-10-07 sweep before being added to the probe matrix. An endpoint that needs a key, region-blocks us or rate-limits below the 60-second cadence is excluded rather than listed with an asterisk."
  - "Chain scope: every query on this page is pinned to `chain=\"neox\"`. Provider coverage: {{count}} no-key endpoints."

faq:
  - q: "Which Neo X RPCs work without an API key?"
    a: "{{declared_count}} endpoints are probed on this chain: Bane Labs (mainnet-1.rpc.banelabs.org), Bane Labs (secondary) (mainnet-2.rpc.banelabs.org), Thirdweb (47763.rpc.thirdweb.com). Every listed endpoint was live-verified with a `eth_getBlockByNumber` call returning a parsable response before inclusion."
  - q: "How is Neo X RPC latency measured here, technically?"
    a: "One identical `eth_getBlockByNumber` call every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest."
  - q: "Are Neo X's two official endpoints independent?"
    a: "They are two hostnames operated by Bane Labs, so treat them as one operator with two entry points rather than as redundancy across organisations. That matters for failover planning: if the operator has an incident, both rows on this board can move together, and Thirdweb is the only independent fallback measured here. We list them separately because they measure differently, not because they fail independently."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="neox"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: neox-official-1
    name: Bane Labs
    endpoint: https://mainnet-1.rpc.banelabs.org
    tag: Bane Labs official public RPC endpoint for Neo X mainnet
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Bane Labs's no-key neox RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="neox-official-1", chain="neox"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="neox-official-1", chain="neox"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="neox-official-1", chain="neox"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="neox-official-1", chain="neox"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="neox-official-1", chain="neox"}) / sum(ocb:rpc_call:rate_24h{provider="neox-official-1", chain="neox"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="neox-official-1", chain="neox"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="neox-official-1", chain="neox"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="neox-official-1", chain="neox", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="neox-official-1", chain="neox", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="neox-official-1", chain="neox", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="neox-official-1", chain="neox", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="neox-official-1", chain="neox", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="neox-official-1", chain="neox", region="sgp"}[1h])

