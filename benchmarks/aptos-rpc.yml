# OpenChainBench. Bench No 212

slug: aptos-rpc
number: "212"
title: Fastest free Aptos RPC, live no-key endpoint latency
seo_title: "Fastest free Aptos RPC 2026"
seo_description: "{{best_name}} leads free Aptos RPC at {{best_p50}} (REST ledger block_height p50, 24h). URLs for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for the Aptos REST ledger endpoint (block_height) against every free, no-key public Aptos node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Aptos is a Move-based L1 blockchain targeting over 100,000 TPS via Block-STM parallel execution, producing roughly one block per second with sub-second finality. Unlike EVM chains, Aptos exposes a REST API rather than JSON-RPC: GET /v1/ returns the current ledger block_height as a decimal string. Free public API endpoints are available without a key from Aptos Labs ({{count}} endpoints). Every provider was live-verified with consecutive keyless GET /v1/ probes at launch.

abstract: |
  Aptos: {{count}} free public RPC endpoints answering `the chain's head call` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single REST GET to /v1/ against every no-key public Aptos node that sustains continuous probing: {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / stale / timeout) with an Aptos-scaled staleness gap (300 blocks, around 5 min). The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Aptos-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: HTTP GET to <base>/v1/ with Accept: application/json. Pure REST endpoint, no API key in any request. The response JSON includes block_height (decimal string) and ledger_version."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Aptos-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=aptos. Provider coverage at launch: {{count}} no-key endpoints (Aptos Labs api, Aptos Labs fullnode)."

faq:
  - q: "What is the fastest free Aptos RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (Aptos REST /v1/ block_height p50 over the last 24h), measured against {{count}} no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Aptos nodes work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today: the Aptos Labs official API node and the Aptos Labs fullnode endpoint. Every listed endpoint was live-verified with a GET /v1/ returning a parsable block_height before inclusion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="aptos"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: aptoslabs
    name: Aptos Labs
    endpoint: https://api.mainnet.aptoslabs.com/v1/
    tag: Official Aptos Labs public mainnet node, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a REST GET to /v1/ sent every 60s from 3 regions to the Aptos Labs official endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="aptoslabs", chain="aptos"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="aptoslabs", chain="aptos"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="aptoslabs", chain="aptos"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="aptoslabs", chain="aptos"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="aptoslabs", chain="aptos"}) / sum(ocb:rpc_call:rate_24h{provider="aptoslabs", chain="aptos"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="aptoslabs", chain="aptos"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="aptoslabs", chain="aptos"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="aptoslabs", chain="aptos", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="aptoslabs", chain="aptos", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="aptoslabs", chain="aptos", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="aptoslabs", chain="aptos", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="aptoslabs", chain="aptos", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="aptoslabs", chain="aptos", region="sgp"}[1h])

  - slug: aptos-fullnode
    name: Aptos Labs (Fullnode)
    endpoint: https://fullnode.mainnet.aptoslabs.com/v1/
    tag: Aptos Labs fullnode endpoint, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a REST GET to /v1/ sent every 60s from 3 regions to the Aptos Labs fullnode endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="aptos-fullnode", chain="aptos"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="aptos-fullnode", chain="aptos"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="aptos-fullnode", chain="aptos"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="aptos-fullnode", chain="aptos"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="aptos-fullnode", chain="aptos"}) / sum(ocb:rpc_call:rate_24h{provider="aptos-fullnode", chain="aptos"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="aptos-fullnode", chain="aptos"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="aptos-fullnode", chain="aptos"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="aptos-fullnode", chain="aptos", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="aptos-fullnode", chain="aptos", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="aptos-fullnode", chain="aptos", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="aptos-fullnode", chain="aptos", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="aptos-fullnode", chain="aptos", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="aptos-fullnode", chain="aptos", region="sgp"}[1h])
