# OpenChainBench. Bench № 306

slug: vendor-claim-audit
number: "306"
title: "Pump Bridge vs Relay cross-chain errors, recomputed from pump.fun's own export"
seo_title: "Pump Bridge vs Relay error rate, recomputed from pump's own data"
seo_description: "pump.fun published a Pump Bridge vs Relay comparison and invited anyone to check it. Recomputed from its own 416,669 rows: the 13x headline holds on buys and falls to 2.95x once sells are included."
subtitle: A vendor's published benchmark, recomputed from the rows it released. pump.fun's Pump Bridge against Relay on cross-chain trade errors, split by direction, because the headline and the full export disagree.

category: Bridges
status: live
metric: Error rate
unit: pct
higher_is_better: false

disclaimer: |
  Not our measurement. These figures are recomputed from the export pump.fun published on 2026-10-21 alongside its comparison, over a window that ended on 2026-10-07 and does not move. The counts behind every number are in this repository with the SHA256 of the original file, so the arithmetic can be redone without trusting this page. What we do measure ourselves about this bridge is on bench 268.

seo_intro: |
  On 2026-10-21 pump.fun published a comparison of its new bridge against Relay
  and invited people to verify it, releasing the rows behind it. We did. The
  headline reproduces exactly: on buys, Pump Bridge errors on 0.869 % of trades
  against Relay's 11.214 %, which is the "almost 13x" the announcement claims
  and the 0.9 % and 11.2 % it quotes. The same export also carries sells, which
  the headline leaves out. There the bridge errors on 7.378 % against Relay's
  10.511 %. Over both directions the ratio is 2.95x, not 12.90x: the bridge
  fails 8.5 times more often on a sell than on a buy, almost entirely as
  bridge_execute_failed.

abstract: |
  pump.fun released 416,669 trade outcomes from a randomised test that ran from
  2026-09-28 to 2026-10-07, assigning users to Pump Bridge or Relay for
  cross-chain trades on Robinhood Chain, BSC, Base, Arc and Ink. This page
  recomputes the error rate from those rows, per direction, and publishes the
  counts beside every rate so a figure is never read without its base.
  The direction tabs are the point: the ranking does not change but its size
  does, from 12.90x on buys to 1.42x on sells.

methodology:
  - "Source: the export pump.fun linked in its 2026-10-21 thread inviting verification. 416,669 rows, each a trade outcome with its chain, lane (bridge or relay), direction, outcome and error class. Window 2026-09-28T16 to 2026-10-07T20 UTC."
  - "Reduction: the 20 MB export is carried in this repository as 58 counts, one per chain, lane, direction, outcome and error class, which is lossless for any rate computed from it. The header holds the SHA256 of the original so the digest can be tied back to what pump published."
  - "Error rate: trades whose outcome is not success, over all trades in that cell. No weighting, no exclusion, no window of our own."
  - "Direction: buys and sells are published apart and together. pump's headline uses buys only, which the export supports; the combined figure is the same arithmetic over the same file."
  - "Arm balance: the two lanes are matched to 0.6 % on buys (103,089 against 102,513) but not on sells, where the bridge carries 77,593 against Relay's 133,474. That weakens the comparison in both directions and is published as the row counts rather than argued about."
  - "Not live: the export is finished. These gauges are loaded once at startup, because a figure that cannot move should not sit on a dashboard pretending to."
  - "Not our measurement: this page restates a vendor's own data. What OpenChainBench measures about this bridge on chain, including the 0.05 plus 40 to 45 basis points it deducts, is on bench 268."

findings:
  - "pump.fun's headline reproduces exactly on its own rows: 0.869 % of Pump Bridge buys error against 11.214 % of Relay's, which is 12.90x."
  - "The same export carries sells, and the headline leaves them out: there the bridge errors on 7.378 % against Relay's 10.511 %, only 1.42x apart."
  - "Over both directions the ratio is 2.95x, not 12.90x: the bridge fails 8.5 times more often on a sell than on a buy, almost all of it bridge_execute_failed."
  - "The arms are matched to 0.6 % on buys and not on sells, where the bridge carries 77,593 trades against Relay's 133,474."

faq:
  - q: "Is this OpenChainBench's own measurement?"
    a: "No. Every figure here is recomputed from the export pump.fun published itself, over a window that ended on 2026-10-07. We publish it because the vendor invited verification and because the headline and the full file disagree. What we measure independently about this bridge, on chain and continuously, is on bench 268: the fee it deducts, the cost per swap on six EVM chains, and the time it takes to settle."
  - q: "Why does the ranking change with the direction tab?"
    a: "It does not change, its size does. Pump Bridge errors less often than Relay in both directions. On buys it is 12.90 times less often, on sells 1.42, and over the whole export 2.95. A comparison quoted from one direction is not wrong, it is partial, and the tabs let you see which."
  - q: "Can I redo this myself?"
    a: "Yes, and that is the point of carrying the counts rather than a sentence about them. The digest sits in the harness directory with the SHA256 of pump's original 20 MB file; 58 rows reproduce every rate on this page by addition."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/terminal-fill-quality

prometheus:
  window: 24h
  freshness_metric: tfq_vendor_ab_error_rate_pct

panel_main_description: "Share of cross-chain trades that errored, from pump.fun's own published export. Use the direction tabs: the headline uses buys only, where the gap is widest."

dimensions:
  direction:
    - { value: all,  label: Buys and sells }
    - { value: buy,  label: Buys only }
    - { value: sell, label: Sells only }

providers:
  - slug: pump-bridge
    name: Pump Bridge
    tag: "pump.fun's own bridge, the lane its announcement promotes"
    formula: "Share of Pump Bridge trades whose outcome is not success, from pump.fun's published export of 416,669 outcomes, 2026-09-28 to 2026-10-07. Recomputed, not measured by us."
    queries:
      p50: tfq_vendor_ab_error_rate_pct{vendor="pump-fun",lane="bridge",direction="all"}
      sample_size: tfq_vendor_ab_rows{vendor="pump-fun",lane="bridge",direction="all"}
      series: tfq_vendor_ab_error_rate_pct{vendor="pump-fun",lane="bridge",direction="all"}

  - slug: relay
    name: Relay
    tag: "the lane pump.fun compared itself against, and used until 2026-10-07"
    formula: "Share of Relay trades whose outcome is not success, from the same export and the same arms. Recomputed, not measured by us."
    queries:
      p50: tfq_vendor_ab_error_rate_pct{vendor="pump-fun",lane="relay",direction="all"}
      sample_size: tfq_vendor_ab_rows{vendor="pump-fun",lane="relay",direction="all"}
      series: tfq_vendor_ab_error_rate_pct{vendor="pump-fun",lane="relay",direction="all"}

metric_panels:
  - id: rows
    label: Trades in the export
    label_key: lane
    metric: tfq_vendor_ab_rows{vendor="pump-fun",direction="all"}
    unit: count
    higher_is_better: true
    description: "How many trades each lane carries in pump.fun's export. Published beside every rate because the arms are matched on buys and not on sells, where the bridge carries 77,593 against Relay's 133,474."
