# OpenChainBench. Bench № 306

slug: vendor-claim-audit
number: "306"
title: "Cross-chain trade error rate by route and direction"
seo_title: "Cross-chain trade error rate: Pump Bridge and Relay"
seo_description: "Share of cross-chain trades that error, for Pump Bridge and Relay, from a published randomised test of 416,669 trades. Split by direction: 12.90x apart on buys, 1.42x on sells."
subtitle: Share of cross-chain trades that end in an error, for Pump Bridge and Relay, computed from a published randomised test of 416,669 trades and split by direction.

category: Bridges
status: live
metric: Error rate
unit: pct
higher_is_better: false

disclaimer: |
  Not our measurement. These figures come from a randomised test pump.fun ran and published on 2026-10-21, over a window that ended on 2026-10-07 and does not move. The counts are in this repository with the SHA256 of the original file, so the arithmetic can be redone without trusting this page. Our own continuous on-chain measurements of these providers are on bench 268 (cost per swap) and bench 003 (bridge cost across eight providers).

seo_intro: |
  pump.fun ran a randomised test assigning users to its own bridge or to Relay
  for cross-chain trades, and published the 416,669 outcomes on 2026-10-21.
  This page computes the error rate from those rows, per direction.

  On buys, Pump Bridge errors on 0.869 % of trades against Relay's 11.214 %,
  a ratio of 12.90x. On sells the two are much closer: 7.378 % against
  10.511 %, a ratio of 1.42x. Over both directions together the rate is
  3.664 % against 10.817 %, or 2.95x.

  The direction matters more than the gap between the providers: the bridge
  errors 8.5 times more often on a sell than on a buy, almost entirely as
  bridge_execute_failed. Which figure is the right one depends on what a user
  does, so all three are published.

abstract: |
  416,669 trade outcomes from a randomised test that ran from 2026-09-28 to
  2026-10-07, assigning users to Pump Bridge or Relay for cross-chain trades on
  Robinhood Chain, BSC, Base, Arc and Ink. This page computes the error rate
  from those rows per direction and publishes the counts beside every rate.
  Pump Bridge errors less often than Relay in both directions; the size of the
  difference changes with the direction, from 12.90x on buys to 1.42x on
  sells.

methodology:
  - "Source: the export pump.fun published on 2026-10-21. 416,669 rows, each a trade outcome with its chain, lane (bridge or relay), direction, outcome and error class. Window 2026-09-28T16 to 2026-10-07T20 UTC."
  - "Reduction: the 20 MB export is carried in this repository as 58 counts, one per chain, lane, direction, outcome and error class, which is lossless for any rate computed from it. The header holds the SHA256 of the original so the digest can be tied back to what pump published."
  - "Error rate: trades whose outcome is not success, over all trades in that cell. No weighting, no exclusion, no window of our own."
  - "Direction: buys and sells are published apart and together, because the gap between the two providers depends on which is quoted. All three come from the same arithmetic over the same file."
  - "Arm balance: the two lanes are matched to 0.6 % on buys (103,089 against 102,513) but not on sells, where the bridge carries 77,593 against Relay's 133,474. That weakens the comparison in both directions and is published as the row counts rather than argued about."
  - "Not live: the export is finished. These gauges are loaded once at startup, because a figure that cannot move should not sit on a dashboard pretending to."
  - "Not our measurement: this page restates a published test. What OpenChainBench measures itself, continuously and on chain, is the cost per swap on bench 268 and the cost of eight bridge providers on bench 003."

findings:
  - "On buys, 0.869 % of Pump Bridge trades error against 11.214 % of Relay's, a ratio of 12.90x."
  - "On sells the two are close: 7.378 % against 10.511 %, a ratio of 1.42x."
  - "Over both directions the rate is 3.664 % against 10.817 %, a ratio of 2.95x. Pump Bridge errors 8.5 times more often on a sell than on a buy, almost all of it bridge_execute_failed."
  - "The arms are matched to 0.6 % on buys and not on sells, where the bridge carries 77,593 trades against Relay's 133,474."

faq:
  - q: "Is this OpenChainBench's own measurement?"
    a: "No. Every figure here comes from a test pump.fun ran and published, over a window that ended on 2026-10-07. It is on the site because the underlying rows are public and the arithmetic can be checked. What we measure independently, on chain and continuously, is on bench 268 (cost per swap, sixteen terminals) and bench 003 (bridge cost, eight providers)."
  - q: "Why does the ranking change with the direction tab?"
    a: "It does not change, its size does. Pump Bridge errors less often than Relay in both directions: 12.90 times less often on buys, 1.42 on sells, 2.95 over the whole file. The tabs exist so the figure can be read against the direction it came from."
  - q: "Can I redo this myself?"
    a: "Yes. The digest sits in the harness directory with the SHA256 of the original 20 MB file; 58 counts reproduce every rate on this page by addition."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/terminal-fill-quality

prometheus:
  window: 24h
  freshness_metric: tfq_vendor_ab_error_rate_pct

panel_main_description: "Share of cross-chain trades that errored, from a published randomised test. The direction tabs change the size of the gap: it is widest on buys, narrowest on sells."

dimensions:
  kind:
    - { value: all,  label: Buys and sells }
    - { value: buy,  label: Buys only }
    - { value: sell, label: Sells only }

providers:
  - slug: pump-bridge
    name: Pump Bridge
    tag: "pump.fun's own bridge, the lane its announcement promotes"
    formula: "Share of Pump Bridge trades whose outcome is not success, from pump.fun's published export of 416,669 outcomes, 2026-09-28 to 2026-10-07. Recomputed, not measured by us."
    queries:
      p50: tfq_vendor_ab_error_rate_pct{vendor="pump-fun",lane="pump-bridge",kind="all"}
      sample_size: tfq_vendor_ab_rows{vendor="pump-fun",lane="pump-bridge",kind="all"}
      series: tfq_vendor_ab_error_rate_pct{vendor="pump-fun",lane="pump-bridge",kind="all"}

  - slug: relay
    name: Relay
    tag: "the lane pump.fun compared itself against, and used until 2026-10-07"
    formula: "Share of Relay trades whose outcome is not success, from the same export and the same arms. Recomputed, not measured by us."
    queries:
      p50: tfq_vendor_ab_error_rate_pct{vendor="pump-fun",lane="relay",kind="all"}
      sample_size: tfq_vendor_ab_rows{vendor="pump-fun",lane="relay",kind="all"}
      series: tfq_vendor_ab_error_rate_pct{vendor="pump-fun",lane="relay",kind="all"}

metric_panels:
  - id: rows
    label: Trades in the export
    label_key: lane
    metric: tfq_vendor_ab_rows{vendor="pump-fun",kind="all"}
    unit: count
    higher_is_better: true
    description: "How many trades each route carries. Published beside every rate because the two arms are matched to 0.6 % on buys and not on sells, where the bridge carries 77,593 against Relay's 133,474."
