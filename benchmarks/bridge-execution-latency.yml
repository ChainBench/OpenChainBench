      mean: avg(ocb:bridge_exec_latency_ms:mean_7d{bridge="relay", region="eu-west"})
      success: sum(increase(bridge_success_total{bridge="relay", region="eu-west"}[7d])) / clamp_min(sum(increase(bridge_success_total{bridge="relay", region="eu-west"}[7d])) + sum(increase(bridge_reverts_total{bridge="relay", region="eu-west"}[7d])) + sum(increase(bridge_stuck_total{bridge="relay", region="eu-west"}[7d])), 1)
      sample_size: round(sum(increase(bridge_success_total{bridge="relay", region="eu-west"}[7d])) + sum(increase(bridge_reverts_total{bridge="relay", region="eu-west"}[7d])) + sum(increase(bridge_stuck_total{bridge="relay", region="eu-west"}[7d])))
      series: ocb:bridge_exec_latency_ms:p50_7d{bridge="relay", region="eu-west"}

  - slug: lifi
    name: LI.FI
    tag: Aggregator
    formula: "p50 over the last 7 days of settlement latency (deposit included to credit observed, ms) for real USDC-triangle transfers executed through LI.FI from EU-West, $3 and $30 tickets pooled, at the selected corridor."
    queries:
      p50: avg(ocb:bridge_exec_latency_ms:p50_7d{bridge="lifi", region="eu-west"})
      p90: avg(ocb:bridge_exec_latency_ms:p90_7d{bridge="lifi", region="eu-west"})
      p99: avg(ocb:bridge_exec_latency_ms:p99_7d{bridge="lifi", region="eu-west"})
      mean: avg(ocb:bridge_exec_latency_ms:mean_7d{bridge="lifi", region="eu-west"})
      success: sum(increase(bridge_success_total{bridge="lifi", region="eu-west"}[7d])) / clamp_min(sum(increase(bridge_success_total{bridge="lifi", region="eu-west"}[7d])) + sum(increase(bridge_reverts_total{bridge="lifi", region="eu-west"}[7d])) + sum(increase(bridge_stuck_total{bridge="lifi", region="eu-west"}[7d])), 1)
      sample_size: round(sum(increase(bridge_success_total{bridge="lifi", region="eu-west"}[7d])) + sum(increase(bridge_reverts_total{bridge="lifi", region="eu-west"}[7d])) + sum(increase(bridge_stuck_total{bridge="lifi", region="eu-west"}[7d])))
      series: ocb:bridge_exec_latency_ms:p50_7d{bridge="lifi", region="eu-west"}

  - slug: near-intents
    name: Near Intents
    tag: Intent layer (NEAR)
    formula: "p50 over the last 7 days of settlement latency (deposit included to credit observed, ms) for real USDC-triangle transfers executed through the Near Intents 1Click flow from EU-West, $3 and $30 tickets pooled, at the selected corridor."
    queries:
      p50: avg(ocb:bridge_exec_latency_ms:p50_7d{bridge="near-intents", region="eu-west"})
      p90: avg(ocb:bridge_exec_latency_ms:p90_7d{bridge="near-intents", region="eu-west"})
      p99: avg(ocb:bridge_exec_latency_ms:p99_7d{bridge="near-intents", region="eu-west"})
