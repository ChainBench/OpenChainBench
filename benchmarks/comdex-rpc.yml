# OpenChainBench. Bench № 183

slug: comdex-rpc
number: "183"
title: "Comdex RPC endpoints: free public URLs ranked by latency"
seo_title: "Comdex RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Comdex RPC at {{best_p50}} (Tendermint status p50, 24h). {{count}} no-key endpoints measured, updated every 60s from 3 regions."
subtitle: HTTP round-trip latency for the Tendermint status method against the free, no-key public Comdex Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Comdex (comdex-1) is a Cosmos SDK DeFi blockchain providing a decentralised synthetics and lending protocol with on-chain commodity markets, CMDX staking token, CometBFT consensus, IBC-connected to Osmosis, Cosmos Hub, and other Cosmos chains. STAVR provides a keyless Tendermint RPC endpoint probed every 60 seconds from three regions.

abstract: |
  Comdex: {{count}} free public RPC endpoints answering `status` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical Cosmos SDK call (Tendermint `status`) against the no-key public Comdex endpoint that sustains continuous probing, {{count}} provider at launch, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Comdex-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"status\",\"params\":[]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Comdex-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"comdex\"`. Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page."

faq:
  - q: "Which Comdex RPCs work without an API key?"
    a: "STAVR's endpoint (comdex.rpc.m.stavr.tech) is the free, keyless Comdex RPC sustaining probes from all 3 regions. Every listed endpoint was live-verified before inclusion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="comdex"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: stavr
    name: STAVR
    endpoint: https://comdex.rpc.m.stavr.tech:443
    tag: STAVR validator public Cosmos RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to STAVR's no-key Comdex endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="stavr", chain="comdex"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="stavr", chain="comdex"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="stavr", chain="comdex"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="stavr", chain="comdex"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="stavr", chain="comdex"}) / sum(ocb:rpc_call:rate_24h{provider="stavr", chain="comdex"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="stavr", chain="comdex"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="stavr", chain="comdex"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="stavr", chain="comdex", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="stavr", chain="comdex", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="stavr", chain="comdex", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="stavr", chain="comdex", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="stavr", chain="comdex", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="stavr", chain="comdex", region="sgp"}[1h])
