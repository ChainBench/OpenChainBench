# OpenChainBench. Bench № 052

slug: scroll-rpc
number: "052"
title: Fastest free Scroll RPC, live no-key endpoint latency
seo_title: "Fastest free Scroll RPC 2026"
seo_description: "{{best_name}} leads free Scroll RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). 3 no-key providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Scroll RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Scroll runs the same 4-gateway field as Linea (PublicNode, dRPC, Tenderly), making the two chains a natural controlled experiment: same providers, same probe, different chain infrastructure. The differences you see between this page and the Linea leaderboard are the chains, not the gateways. Probes every 60 seconds, three regions, stale-head detection against the cross-provider tip.

abstract: |
  Per-chain member of the RPC latency cluster. We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Scroll endpoint that sustains continuous probing, 4 providers, every 60 seconds, from us-east, eu-west and Singapore. The harness also classifies every response (ok / http_err / jsonrpc_err / stale / timeout) and audits archive depth every 5 minutes, so the leaderboard rewards sustained, honest availability rather than a fast error message. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Scroll-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the latest-header fetch with a rotating id defeats edge caches that answer eth_blockNumber without touching a node."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms → 10 s), so percentiles are computed via Prometheus `quantile_over_time` over the last 24 hours."
  - "Call-result classification: `ok` (HTTP 200 + non-empty result), `http_err`, `jsonrpc_err` (HTTP 200 carrying an error body), `stale` (more than 20 blocks behind the cross-provider tip), `timeout`. Latency without reliability is a misleading ranking signal."
  - "Archive depth: every 5 minutes we issue `eth_getBalance` at (head − depth) for depths from Geth's default pruned cap up to 5M blocks, exposing which free endpoints actually serve historical state."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities) benchmark; the identical harness, methodology and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to chain=\"scroll\". Provider coverage: 4 no-key endpoints (PublicNode, dRPC, Tenderly). Exclusions follow the cluster-wide rules documented on the parent benchmark."

findings:
  - "{{best_name}} currently leads free Scroll RPC at {{best_p50}} (`eth_getBlockByNumber` p50, 24h) across 3 measured providers."
  - "Scroll and Linea share an identical provider field, so cross-reading the two pages isolates chain-side latency from gateway-side latency, a comparison no single-chain benchmark can offer."
  - "As on every thin-cohort chain, the success-rate column outranks the latency column for picking a production default."

faq:
  - q: "What is the fastest free Scroll RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber` p50 over the last 24h), measured against 3 no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples, so the answer on this page is the answer right now, not a quarterly snapshot. Use the region tabs to see the leader from the origin closest to your deployment."
  - q: "Which Scroll RPCs work without an API key?"
    a: "The 4 providers on this page: PublicNode, dRPC, Tenderly. Every (provider, chain) pair was live-verified no-key before inclusion, and anything that key-gates, region-blocks or rate-limits below our 15-second cadence is excluded rather than listed with an asterisk."
  - q: "Does the fastest Scroll RPC change by region?"
    a: "Frequently. The headline number averages three probe origins (us-east, eu-west, Singapore), but per-region leaders regularly diverge, a gateway that wins from Virginia can lose from Singapore by multiples. The region tabs at the top of the page re-scope every number on the page to a single origin; pick the one closest to where your requests actually originate."
  - q: "How is Scroll RPC latency measured here?"
    a: "One identical JSON-RPC POST (`eth_getBlockByNumber`) every 60 seconds against each provider from each of 3 regions, with the same plain HTTP client. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest. The harness is open source and every number on this page is a public Prometheus query you can run yourself."
  - q: "Which free RPC should I default to on Scroll?"
    a: "Start from the current leader above, then check its per-region row for the origin closest to your deployment. With a 4-provider field the honest answer changes more often than on Ethereum, so a primary-plus-fallback pair (the top two on this page) is the resilient configuration rather than any single hardcoded URL."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on region alone.
rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="scroll"})

# Region is the only dimension: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    tag: Allnodes-operated, 70+ chains, archive on most
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Scroll endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="scroll"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="scroll"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="scroll"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="scroll"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="scroll"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="scroll"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="scroll"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="scroll"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="scroll", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="scroll", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="scroll", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="scroll", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="scroll", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="scroll", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    tag: Decentralized RPC mesh, consensus-checked
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to dRPC's no-key Scroll endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="scroll"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="scroll"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="scroll"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="scroll"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="scroll"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="scroll"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="scroll"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="scroll"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="scroll", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="scroll", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="scroll", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="scroll", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="scroll", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="scroll", region="sgp"}[1h])

  - slug: tenderly
    name: Tenderly
    tag: Multi-chain public gateway, 9 chains, no key
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Tenderly's no-key Scroll endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tenderly", chain="scroll"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="tenderly", chain="scroll"})
