      sample_size: sum(ocb:rpc_call:increase_24h{provider="tenderly", chain="scroll"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="tenderly", chain="scroll"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tenderly", chain="scroll", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tenderly", chain="scroll", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tenderly", chain="scroll", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tenderly", chain="scroll", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tenderly", chain="scroll", region="sgp"})
