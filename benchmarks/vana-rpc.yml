# OpenChainBench. Bench № 163

slug: vana-rpc
number: "163"
title: Fastest free Vana RPC, live no-key endpoint latency
seo_title: "Fastest free Vana RPC 2026"
seo_description: "{{best_name}} leads free Vana RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). {{count}} no-key endpoints measured, updated every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Vana RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Vana (chain 1480) is an EVM-compatible L1 designed for data liquidity networks (DLNs) where users tokenize and monetize personal data through Data DAOs. VANA is the native gas token. The Vana Foundation's rpc.vana.org provides keyless access probed every 60 seconds from three regions.

abstract: |
  Vana: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:vana-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Vana endpoint that sustains continuous probing, {{count}} provider at launch, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Vana-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Vana-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"vana\"`. Provider coverage at launch: {{count}} no-key endpoints (Vana Foundation)."

faq:
  - q: "What is the fastest free Vana RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber` p50 over the last 24h), measured against {{count}} no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Vana RPCs work without an API key?"
    a: "{{count}} endpoint sustains continuous keyless probing at launch: Vana Foundation. Every listed endpoint was live-verified before inclusion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="vana"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: vana-official
    name: Vana Foundation
    tag: Vana Foundation's official public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Vana Foundation's no-key Vana endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="vana"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="vana"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="vana"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="vana"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="vana"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="vana"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="vana"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="vana"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="vana", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="vana", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="vana", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="vana", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="vana", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="vana", region="sgp"}[1h])
