# OpenChainBench. Bench № 088

slug: ws-head-latency-solana
number: "088"
title: Fastest Solana WebSocket slotSubscribe push, live slot-push lag across RPC providers
seo_title: "Fastest Solana WebSocket RPC slotSubscribe push 2026"
seo_description: "{{best_name}} pushes the most Solana slots first over WebSocket, {{best_p50}} of the slots it received (24h), across the free keyless Solana cohort."
subtitle: Share of Solana slots each keyless provider pushed first over WebSocket, raced per region from us-east, eu-west and Singapore.

category: RPCs
status: live
metric: First to push
unit: pct
higher_is_better: true
# A provider that never wins a race reads 0%, a result, not a missing value.
zero_is_a_value: true

seo_intro: |
  Solana slots land every ~400 ms, thirty times faster than Ethereum
  blocks, and every real-time integrator on Solana (perp keeper,
  liquidator, market maker, on-chain scanner) inherits its provider's
  slot push pipeline thirty times as often.

  This page races the free keyless Solana WebSocket endpoints on
  `slotSubscribe`: one persistent connection per provider in each of
  three regions, every slot notification timestamped on receipt, each
  slot credited to the provider that delivered it earliest in that
  region. The headline is each provider's share of first arrivals.
  {{best_name}} currently leads, first on {{best_p50}} of the slots it
  received (24 h), across PublicNode's gateway and the Solana
  Foundation's `api.mainnet-beta.solana.com`.

abstract: |
  Keyless WebSocket endpoints raced on Solana slot delivery. One harness
  holds a persistent `slotSubscribe` connection per provider in each of
  three regions and timestamps every push on receipt. Per slot, the
  earliest arrival in that region wins; each provider's figure is the
  share of the slots it received that it delivered first, pooled over 24
  hours. A provider at 0% received the slots and was never first.

methodology:
  - "Providers measured (keyless WebSocket endpoints): PublicNode (wss://solana-rpc.publicnode.com) and Solana Foundation (wss://api.mainnet-beta.solana.com). Keyed providers (Alchemy, Chainstack, Helius, Quicknode) join the cohort when contributor keys are wired via WS_URL_<PROVIDER>_SOLANA env vars."
  - "Cohort saturation: dRPC's free Solana tier explicitly disallows slotSubscribe (\"method is not available on freetier\") and the other public Solana WSS gateways audited (Blast, BlockPI, Ankr, extrnode, Chainstack public) all reject the handshake (verified 2026-07), which is why the keyless tier stops at two."
  - "Race scoring: the first provider to deliver slot N in a region wins it. The published figure is each provider's share of first arrivals among the slots it received, pooled over 24 hours, so a provider raced from fewer regions is not diluted by the others. A slot's cohort closes 5 seconds after the first arrival; a provider arriving later is scored as a missed slot (ws_block_gap_total)."
  - "Chain scope: every query on this page is pinned to chain=\"solana\". Solana slot cadence is ~400ms, so a 24h window carries roughly 216000 samples per provider, an order of magnitude beyond the 7000 sample floor used across the head-lag cluster."
  - "RPC method: `slotSubscribe`, not `signatureSubscribe` or `logsSubscribe`. The notification payload includes the slot number and the parent slot; the harness dedupes on slot number and uses the first arrival per slot to define T0."
  - "Connection discipline: one persistent WebSocket per (provider, chain), client ping every 30s, read deadline 60s, 90s slot watchdog forcing reconnect when a socket keeps the heartbeat alive but silently drops the subscription. Exponential backoff 2s to 60s on reconnect."
  - "Why a share and not a lag: a single vantage point cannot separate its own network path from a provider's push pipeline, so the race compares arrivals over the same path. The winner's lag is zero by construction and a median lag mostly measures how often a provider wins; the share of first arrivals states it directly."
  - "Coverage: ws_head_blocks_seen_total per provider divided by the cohort maximum over the same 24h window, clamped to 1. A provider that wins the races it runs but skips slots loses on this column."
  - "Regions: one harness per region (us-east, eu-west, Singapore), each slot raced within its region. Geography moves absolute arrival times for every provider over the same path; a provider whose nearest edge is far from a region is disadvantaged there, which is why each region has its own tab."

findings:
  - "{{best_name}} leads the Solana cohort, first on {{best_p50}} of the slots it received (24 h), across {{count}} measured providers. At ~400 ms slots each provider runs about 200,000 races a day, so the share is stable."
  - "{{name:solana}} against {{name:publicnode}}: the Solana Foundation's public endpoint and PublicNode's Solana gateway raced on identical terms. A latency-sensitive integration should read the share alongside coverage to see which endpoint delivers slot N first most often without skipping slots."
  - "Shares are comparable across chains only as shares: Solana runs at 400 ms slots, Base at 2 s, Ethereum at 12 s, and each chain is raced on its own heads. Use each per-chain leaderboard on its own terms."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/ws-head-latency

expected_n: 50000

prometheus:
  window: 24h
  freshness_metric: ws_head_blocks_seen_total

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on provider and region.
rank_matrix_query: 100 * sum by (provider, region) (increase(ws_head_wins_total{chain="solana"}[24h])) / sum by (provider, region) (increase(ws_head_blocks_seen_total{chain="solana"}[24h]))

# Region is the only dimension: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

faq:
  - q: "What is the fastest free Solana RPC over WebSocket right now?"
    a: "{{best_name}} currently wins the largest share of per-slot races, first on {{best_p50}} of the slots it received (24 h) across {{count}} measured keyless providers. The leaderboard re-scores on every Solana slot, roughly every 400 ms, so the answer reflects sustained live measurement, not a one-off test. Check coverage too before wiring a latency-sensitive bot to any single provider."
  - q: "Why a share of wins rather than a lag in milliseconds?"
    a: "Because the race is relative. The earliest arrival starts the clock for each slot, so the winner's lag is zero by construction and a median lag mostly says how often a provider wins. The share of first arrivals says it directly, read per provider over the slots it received."
  - q: "How is the Solana WebSocket push race measured on OpenChainBench?"
    a: "One Go harness per region holds a persistent `slotSubscribe` WebSocket per provider. Every notification is timestamped on receipt, keyed on slot number and deduplicated. Each slot is a race within its region: the earliest arrival wins. The cohort closes 5 seconds after the first arrival, and each provider's share of first arrivals is computed over 24 hours."
  - q: "Why aren't Alchemy and Helius on the leaderboard?"
    a: "Both are keyed-only for Solana WebSocket subscriptions and V1 measures the keyless tier. The harness reads Alchemy and Helius endpoints from env variables and adds them to the cohort automatically once contributor keys are wired into the deployment."
  - q: "Solana slots land every ~400ms. How does that change the numbers?"
    a: "Each provider runs many more races per day than on Ethereum for the same 24h window, so its share of first arrivals settles quickly and moves little from one hour to the next. The interpretation is unchanged: the share says how often a provider delivers the slot first, not how many milliseconds it gains."
  - q: "Why `slotSubscribe` and not `signatureSubscribe` or `logsSubscribe`?"
    a: "The race we score is head delivery: which endpoint pushes the newest thing first. On Solana that is a slot notification; `slotSubscribe` fires on every slot with the slot number and parent slot in the payload. `signatureSubscribe` targets one specific transaction and `logsSubscribe` filters by program, so neither is a fair head-delivery race across providers."

providers:
  - slug: publicnode
    name: PublicNode
    tag: Keyless WS, wss://solana-rpc.publicnode.com
    formula: "Share of the Solana slots this provider pushed over `slotSubscribe` that it delivered first in its region, from one persistent WebSocket per provider per region, pooled over 24h."
    queries:
      p50: 100 * sum(increase(ws_head_wins_total{provider="publicnode", chain="solana"}[24h])) / sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="solana"}[24h]))
      success: clamp_max(sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="solana"}[24h])) / max(sum by (provider) (increase(ws_head_blocks_seen_total{chain="solana"}[24h]))), 1)
      sample_size: sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="solana"}[24h]))
      series: 100 * sum(increase(ws_head_wins_total{provider="publicnode", chain="solana"}[1h])) / sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="solana"}[1h]))
      regions:
        - region: us-east
          p50: 100 * sum(increase(ws_head_wins_total{provider="publicnode", chain="solana", region="us-east"}[24h])) / sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="solana", region="us-east"}[24h]))
          series: 100 * sum(increase(ws_head_wins_total{provider="publicnode", chain="solana", region="us-east"}[1h])) / sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="solana", region="us-east"}[1h]))
        - region: eu-west
          p50: 100 * sum(increase(ws_head_wins_total{provider="publicnode", chain="solana", region="eu-west"}[24h])) / sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="solana", region="eu-west"}[24h]))
          series: 100 * sum(increase(ws_head_wins_total{provider="publicnode", chain="solana", region="eu-west"}[1h])) / sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="solana", region="eu-west"}[1h]))
        - region: ap-southeast
          p50: 100 * sum(increase(ws_head_wins_total{provider="publicnode", chain="solana", region="sgp"}[24h])) / sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="solana", region="sgp"}[24h]))
          series: 100 * sum(increase(ws_head_wins_total{provider="publicnode", chain="solana", region="sgp"}[1h])) / sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="solana", region="sgp"}[1h]))

