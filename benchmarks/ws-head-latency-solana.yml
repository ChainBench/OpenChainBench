    name: Solana
    tag: Keyless WS, wss://api.mainnet-beta.solana.com
    formula: "Share of the Solana slots this provider pushed over `slotSubscribe` that it delivered first in its region, from one persistent WebSocket per provider per region, pooled over 24h."
    queries:
      p50: 100 * sum(increase(ws_head_wins_total{provider="solana", chain="solana"}[24h])) / sum(increase(ws_head_blocks_seen_total{provider="solana", chain="solana"}[24h]))
      success: clamp_max(sum(increase(ws_head_blocks_seen_total{provider="solana", chain="solana"}[24h])) / max(sum by (provider) (increase(ws_head_blocks_seen_total{chain="solana"}[24h]))), 1)
      sample_size: sum(increase(ws_head_blocks_seen_total{provider="solana", chain="solana"}[24h]))
      series: 100 * sum(increase(ws_head_wins_total{provider="solana", chain="solana"}[1h])) / sum(increase(ws_head_blocks_seen_total{provider="solana", chain="solana"}[1h]))
      regions:
        - region: us-east
          p50: 100 * sum(increase(ws_head_wins_total{provider="solana", chain="solana", region="us-east"}[24h])) / sum(increase(ws_head_blocks_seen_total{provider="solana", chain="solana", region="us-east"}[24h]))
          series: 100 * sum(increase(ws_head_wins_total{provider="solana", chain="solana", region="us-east"}[1h])) / sum(increase(ws_head_blocks_seen_total{provider="solana", chain="solana", region="us-east"}[1h]))
        - region: eu-west
