# OpenChainBench. Bench № 166

slug: sanko-rpc
number: "166"
title: Fastest free Sanko RPC, live no-key endpoint latency
seo_title: "Fastest free Sanko RPC 2026"
seo_description: "{{best_name}} leads free Sanko RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). 1 no-key provider measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against the free, no-key public Sanko RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Sanko (chain 1996) is an EVM-compatible L3 on Arbitrum Orbit using DMT as the native gas token, built for gaming and entertainment applications within the Sanko Games ecosystem. Thirdweb's chain-ID RPC gateway provides keyless access probed every 60 seconds from three regions.

abstract: |
  Per-chain member of the RPC latency cluster, extended to Sanko.
  We measure the round-trip latency of a single, identical RPC call
  (`eth_getBlockByNumber`) against the no-key public Sanko endpoint
  that sustains continuous probing, 1 provider at launch,
  every 60 seconds, from us-east, eu-west and Singapore. The harness
  classifies every response (ok / http_err / jsonrpc_err / stale /
  timeout) so the leaderboard rewards sustained availability rather than
  fast error messages. The cross-chain view lives on the parent
  `rpc-capabilities` benchmark; this page is the Sanko-scoped answer
  with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms to 10 s), so percentiles are computed via Prometheus `quantile_over_time` over the last 24 hours."
  - "Call-result classification: `ok` (HTTP 200 + non-empty result), `http_err`, `jsonrpc_err` (HTTP 200 carrying an error body), `stale` (more than 20 blocks behind the cross-provider tip), `timeout`."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities) benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to `chain=\"sanko\"`. Provider coverage: 1 no-key endpoint (Thirdweb)."

findings:
  - "{{best_name}} currently leads free Sanko RPC at {{best_p50}} (`eth_getBlockByNumber` p50, 24h)."

faq:
  - q: "What is the fastest free Sanko RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber` p50 over the last 24h), measured every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Sanko RPCs work without an API key?"
    a: "Thirdweb's chain-ID gateway (1996.rpc.thirdweb.com) is the only free, keyless endpoint sustaining probes from all 3 regions. Every listed endpoint was live-verified before inclusion."
  - q: "Does the Sanko RPC latency change by region?"
    a: "Often. The region tabs at the top of the page re-scope every number to a single origin; pick the one closest to where your requests originate."
  - q: "How is Sanko RPC latency measured here?"
    a: "One identical JSON-RPC POST (`eth_getBlockByNumber`) every 60 seconds against the provider from each of 3 regions. Responses are classified so an endpoint stuck on an old head or returning errors is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="sanko"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: thirdweb
    name: Thirdweb
    tag: Thirdweb chain-ID RPC gateway
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Thirdweb's no-key Sanko endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="sanko"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="thirdweb", chain="sanko"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="thirdweb", chain="sanko"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="thirdweb", chain="sanko"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="thirdweb", chain="sanko"}) / sum(ocb:rpc_call:rate_24h{provider="thirdweb", chain="sanko"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="thirdweb", chain="sanko"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="sanko"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="sanko", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="sanko", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="sanko", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="sanko", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="sanko", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="sanko", region="sgp"}[1h])
