      mean: avg_over_time(bridge_cost_percent{bridge="relay", amount_usd="300"}[24h])
      success: avg_over_time(bridge_quote_success{bridge="relay", amount_usd="300"}[24h])
      sample_size: sum(count_over_time(bridge_cost_percent{bridge="relay", amount_usd="300"}[24h]))
      series: avg_over_time(bridge_cost_percent{bridge="relay", amount_usd="300"}[1h])

