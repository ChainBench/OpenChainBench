      mean: avg_over_time(bridge_cost_percent{bridge="lifi", amount_usd="300"}[24h])
      success: avg_over_time(bridge_quote_success{bridge="lifi", amount_usd="300"}[24h])
      sample_size: sum(count_over_time(bridge_cost_percent{bridge="lifi", amount_usd="300"}[24h]))
      series: avg_over_time(bridge_cost_percent{bridge="lifi", amount_usd="300"}[1h])

  - slug: debridge
    name: Debridge
    tag: Native-token fees
    queries:
      p50: quantile_over_time(0.50, bridge_cost_percent{bridge="debridge", amount_usd="300"}[24h])
      p90: quantile_over_time(0.90, bridge_cost_percent{bridge="debridge", amount_usd="300"}[24h])
