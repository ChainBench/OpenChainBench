# OpenChainBench — Bench № 003

slug: bridge-fee
number: "003"
title: Cross-Chain Bridge — Fee
subtitle: Bridge fees as a percentage of trade size, sampled at $300 notional and reported in basis points.
category: Bridges
status: live
metric: Bridge fee
unit: bps

abstract: |
  We measure the fee each bridge charges as a fraction of trade size,
  reported in basis points (1 bps = 0.01% of notional). Fees are sampled
  on $300 quotes — small notionals skew the percentage upward because
  fixed-fee components dominate ($5 quotes can show 2,000 bps even for
  cheap bridges), so a single reference size keeps providers comparable.
  Slippage and destination gas are tracked separately on the same series;
  they are not included in the fee figures here. Lower is better.

methodology:
  - "Routes: USDC pairs spanning Solana, Base and Arbitrum."
  - "Reference notional: $300 USDC. Smaller sizes ($5, $50) are captured by the harness but excluded from this report."
  - "Fee: `bridge_fees_percent{amount_usd=\"300\"}` × 100, in basis points. Excludes slippage and gas."
  - "Cadence: full sweep every 5 minutes for 24 hours."
  - "Region: eu-west (single point — multi-region requires running additional monitor instances)."
  - "Failures (quote_failed, unsupported route) excluded from fee aggregates and counted toward success rate."

findings: []

source: https://github.com/OpenChainBench/OpenChainBench/tree/main/harnesses/bridge-fee

prometheus:
  url: https://prometheus-production-9ffe.up.railway.app
  window: 24h

# Real metrics exposed by the bridge-monitor harness:
#   bridge_fees_percent{bridge, from_chain, to_chain, from_token, to_token, amount_usd, region}
#   → gauge in percent (0.796 = 0.796% = 79.6 bps). Multiply by 100 to convert.
#
# Other fee-related gauges available for follow-up benches:
#   bridge_cost_percent  (fees + slippage + gas)
#   bridge_gas_usd, bridge_slippage_usd, bridge_fees_usd, bridge_fix_fee_usd

providers:
  - slug: mobula
    name: Mobula
    tag: Aggregator + intent layer
    queries:
      p50: quantile_over_time(0.50, bridge_fees_percent{bridge="mobula", amount_usd="300"}[24h]) * 100
      p90: quantile_over_time(0.90, bridge_fees_percent{bridge="mobula", amount_usd="300"}[24h]) * 100
      p99: quantile_over_time(0.99, bridge_fees_percent{bridge="mobula", amount_usd="300"}[24h]) * 100
      mean: avg_over_time(bridge_fees_percent{bridge="mobula", amount_usd="300"}[24h]) * 100
      success: avg_over_time(bridge_quote_success{bridge="mobula", amount_usd="300"}[24h])
      sample_size: count_over_time(bridge_fees_percent{bridge="mobula", amount_usd="300"}[24h])
      series: avg_over_time(bridge_fees_percent{bridge="mobula", amount_usd="300"}[1h]) * 100

