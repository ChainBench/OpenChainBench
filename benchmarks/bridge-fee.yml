    name: Relay
    tag: Cross-chain relay
    formula: "Per-corridor 24h median of total cost percent (fees + slippage + destination gas) on a $300 USDC quote from Relay's API, averaged across corridors. Sampled every 5 minutes from eu-west."
    type: relay
    queries:
      p50: avg(quantile_over_time(0.50, bridge_cost_percent{bridge="relay", amount_usd="300", from_token!="6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN"}[24h]))
      p90: avg(quantile_over_time(0.90, bridge_cost_percent{bridge="relay", amount_usd="300", from_token!="6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN"}[24h]))
      p99: avg(quantile_over_time(0.99, bridge_cost_percent{bridge="relay", amount_usd="300", from_token!="6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN"}[24h]))
