# OpenChainBench. Bench № 003

slug: bridge-fee
number: "003"
title: Cheapest cross-chain bridge for USDC at $300 notional
seo_title: "Cheapest cross-chain bridge 2026"
seo_description: "Cheapest cross-chain bridge for USDC at $300. Total cost (fees, slippage, gas) across Across, deBridge, LI.FI, Mobula, Relay, Near Intents."
subtitle: Total cost as a percent of notional, fees plus slippage plus destination gas combined, sampled at $300 USDC across Solana, Base and Arbitrum corridors.
category: Bridges
status: live
metric: Effective fee
unit: pct

# Per-destination breakdown. Same rationale as bridge-quote-latency:
# bridges quote different cost structures per corridor (gas on the
# destination dominates short hops, solver spread dominates long
# auction routes), so an aggregate cross-corridor cost percent
# obscures more than it reveals.
dimensions:
  chain:
    - { value: Base,      label: Sol to Base }
    - { value: Arbitrum,  label: Base to Arb }
    - { value: Solana,    label: Arb to Sol }
    - { value: HyperCore, label: Arb to HyperCore }
  region:
    - { value: all,     label: All regions }
    - { value: eu-west, label: EU-West }
    - { value: us-east, label: US-East }
    - { value: sgp,     label: Singapore }
  amount_usd:
    - { value: "300", label: "$300" }
    - { value: "50",  label: "$50" }
    - { value: "5",   label: "$5" }

seo_intro: |
  This benchmark measures the cheapest cross-chain bridge live, refreshed
  every five minutes across the major USDC corridors. The headline figure
  is total cost (fees plus slippage plus destination gas) expressed as a
  percent of trade size, not the explicit fee field most providers
  advertise. Bridge fee tables in the wild quote $1000 or $10000
  notionals, where fixed costs are diluted into the percentage. We sample
  at $300, the size where small-trade dynamics actually dominate. Gas
  eats a larger share, intent spreads compress, aggregator markups
  become visible. The leaderboard sorts by p50 over 24 hours, so a
  single favourable quote cannot crown a winner. Below the table the
  same providers split into three pricing architectures (intent,
  aggregator, direct protocol) because each absorbs cost differently
  and they do not converge under the same query.

abstract: |
  We measure the effective fee each bridge charges, the bottom-line cost
  a user pays (fees plus slippage plus destination gas) as a percentage
  of trade size. The harness uses Prometheus gauge `bridge_cost_percent`
  rather than the narrower `bridge_fees_percent` because providers
  structure pricing differently. Some charge an explicit fee, others
  bake it into the spread. Comparing only the explicit fee field would
  let aggregators with implicit pricing show a misleading 0%. Sampled
  at $300 notional so small-amount fixed-fee blowups don't skew the
  percentile aggregates.

methodology:
  - "Routes: USDC pairs spanning Solana, Base and Arbitrum."
  - "Reference notional: $300 USDC. Smaller sizes ($5, $50) are captured by the harness but excluded from this report."
  - "Cost: `bridge_cost_percent{amount_usd=\"300\"}`, in percent of notional. Includes fees + slippage + destination gas."
  - "Cadence: full sweep every 5 minutes for 24 hours."
  - "Aggregation: the headline number is the average of per-corridor 24h medians over the corridors a provider actually quotes. The TRUMP to BRETT calibration route is excluded. Near Intents has no USDT legs, so its aggregate covers the Solana to Base and Arbitrum to HyperCore corridors only. deBridge does not quote the Arbitrum to HyperCore corridor, so its aggregate covers the remaining three. Across also skips Arbitrum to HyperCore, so its aggregate covers the same three corridors as deBridge."
  - "Normalization: cost is quoted USD in minus quoted USD delivered, the same all-in definition for every provider. Near Intents bundles the destination chain withdrawal fee into its quoted amountOut (the 1Click API documents withdrawFee as already deducted), so no extra gas term is added on top."
  - "Regions: eu-west, us-east, sgp. Three independent instances probe simultaneously; the All-regions aggregate uses the full union; per-region tabs isolate the view to one origin."
  - "Failures (quote_failed, unsupported route) excluded from cost aggregates and counted toward success rate."
  - "Provider types are surfaced as badges: direct protocols (deBridge) charge their own bridging fees; aggregators (LI.FI) route through whichever underlying bridge is cheapest, so their effective fee includes that bridge's cost plus any aggregator markup; intent / relay layers (Mobula, Relay, Across, Near Intents) bake cost into the spread of a settlement intent or optimistic fill rather than charging an explicit fee."
  - "Excluded by design: Stargate, because its keyless quote endpoint was deprecated in favor of a key-gated LayerZero API, and its on-chain quoteOFT path is same-asset EVM-only, which matches none of this bench's corridors. CCTP, because Circle's burn/mint has no quote that returns a delivered amount; standard transfers mint 1:1 and the whole cost is user-paid gas we would have to estimate ourselves, which breaks the quoted USD in minus quoted USD delivered definition used for every other row."

# Per-corridor leader rewrite deferred: this YAML does not yet declare
# `dimensions:` for `from_chain`/`to_chain` / corridor. The underlying
# metric already carries those labels (see comment block lower in this
# file), so per-corridor placeholders can be wired in once dimensions
# are added (separate code/data PR). Until then, the {{best_name}} /
# {{worst_name}} placeholders below resolve to the cross-corridor
# aggregate, which is honest because every provider in this bench is
# queried on the same Solana/Base/Arbitrum corridors. but the text is
# softened to make the aggregation explicit rather than implying a
# single winning corridor.
findings:
  - "{{best_name}} currently leads the cross-corridor aggregate at {{best_p50}} (p50, 24 h) for $300 USDC trades, across {{count}} measured bridges. The number averages over the Solana/Base/Arbitrum corridors the harness sweeps; per-corridor leaders can diverge sharply on routes where one solver has inventory and another does not."
  - "{{name:mobula}} returns {{p50:mobula}} (p50, 24 h). Intent layers compress fees, slippage and destination gas into a single spread, so the effective number reads lower than aggregators that route through a paid underlying bridge."
  - "{{name:lifi}} sits at {{p50:lifi}} (p50, 24 h). Aggregators pay the underlying bridge plus a thin markup, so their effective cost trails intent layers on liquid corridors where multiple solvers compete on the same route."
  - "{{name:debridge}} clocks {{p50:debridge}} (p50, 24 h). Direct protocols front-load cost into a native-token fee, which dominates on $300 trades because the fixed component does not scale with notional."
  - "{{name:across}} posts {{p50:across}} (p50, 24 h). Optimistic relayer fills price mostly relayer capital plus destination gas, so the number stays tight on same-asset USDC corridors and widens on the cross-asset USDT legs, where the quote wraps a DEX swap around the bridge and swap impact enters the all-in cost."
  - "{{worst_name}} trails the cross-corridor aggregate at {{worst_p50}} (p50, 24 h). On a $300 trade the gap between leader and laggard is mostly the fixed-fee floor of the slower path, not relative spread efficiency, and the laggard on one corridor can be the leader on another once corridor dimensions are surfaced."

faq:
  - q: "What is the cheapest cross-chain bridge right now?"
    a: "{{best_name}} currently leads the cross-corridor aggregate at {{best_p50}} (p50, 24 h) for $300 USDC trades, averaged across the Solana/Base/Arbitrum corridors the harness sweeps. The leaderboard re-sorts every five minutes against fresh Prometheus samples, so the answer is anchored to the last 24 hours of live data rather than a frozen table from a blog post. Per-corridor leaders can diverge from this aggregate when a solver has deep inventory on one specific route and not on others, that breakdown is on the roadmap once corridor dimensions are surfaced in the page UI."
  - q: "How much does it cost to bridge $300 USDC?"
    a: "Total cost varies between providers. The current p50 across {{count}} bridges spans from {{best_p50}} (leader) up to {{worst_p50}} (laggard) of the $300 notional. The figure already includes fees, slippage and destination gas because we report `bridge_cost_percent`, the all-in number that actually leaves the user's wallet, not the explicit fee field providers advertise."
  - q: "Why do bridge fees vary 10x between providers?"
    a: "Three pricing architectures cohabit in this leaderboard. Direct protocols (deBridge) charge a native-token fee front-loaded into the quote. Aggregators (LI.FI) pay an underlying bridge plus a thin markup. Intent and relay layers (Mobula, Relay, Across, Near Intents) compress all of it into a single spread quoted on a settlement intent or an optimistic fill. On small trades the fixed-fee component dominates and the gap stretches, on large trades the spread component dominates and the leaderboard re-orders."
  - q: "Are bridge aggregators cheaper than direct bridges?"
    a: "Not consistently. Aggregators route through whichever underlying bridge is cheapest at quote time, but they add a markup on top and their best route is constrained to the bridges they have integrated. Intent layers can route to any solver willing to settle the intent, including aggregators themselves. On liquid USDC corridors intent layers usually lead this leaderboard, but aggregators win when a corridor has only one underlying bridge and that bridge is cheaper than every solver's quote."
  - q: "Is it cheaper to bridge small or large amounts?"
    a: "Large amounts, in percentage terms. Part of every bridge quote is fixed (destination gas, base protocol fee), so at $300 the fixed component is the dominant share of the cost, while at $1000 or $10000 it dilutes into the percentage and the leaderboard re-orders. That is also why published bridge fee tables sampled at $10000 understate what retail users pay. The harness records $5, $50, $300, $1000 and $10000 buckets; this report surfaces $300 because the small-trade regime is where intent layers compress costs hardest, aggregator markups become visible, and most real transfers happen."
  - q: "Why does the cheapest bridge change throughout the day?"
    a: "Solver competition is the main driver. Intent layers like Mobula and Relay rank quotes from a rotating set of solvers whose inventory and risk appetite shift with destination-chain volatility and time of day. When Solana gas spikes or an L2 sees a deposit cluster, solvers reprice, and the leaderboard re-orders. The 5-minute scrape cadence catches these moves; the 24-hour p50 smooths them so the headline number reflects sustained competitiveness rather than a single favourable quote."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/bridge-monitor

prometheus:
  window: 24h
  expected_freshness_seconds: 1800

# Real metrics exposed by the bridge-monitor harness:
#   bridge_cost_percent{bridge, from_chain, to_chain, from_token, to_token, amount_usd, region}
#   → gauge in percent (1.18 = 1.18% of notional).
#
# Why cost rather than fee:
#   bridge_fees_percent only captures the explicit fee field in each quote.
#   Some providers (e.g. Mobula) bake the cost into the spread instead of
#   reporting an explicit fee, so they would render as 0%, misleading
#   readers. bridge_cost_percent = fees + slippage + gas, which is the
#   number that actually leaves the user's wallet.

# rank_matrix_query required when dimensions.region is declared.
# label_replace maps bridge= → provider= so badge scoping works per region.
rank_matrix_query: avg by (provider, region) (label_replace(quantile_over_time(0.50, bridge_cost_percent[24h]), "provider", "$1", "bridge", "(.+)"))

providers:
  - slug: mobula
    name: Mobula
    tag: Aggregator + intent layer
    formula: "Per-corridor 24h median of total cost percent (fees + slippage + destination gas) on a $300 USDC quote from Mobula's intent layer, averaged across corridors. Sampled every 5 minutes from eu-west."
    type: intent
    queries:
      p50: avg(quantile_over_time(0.50, bridge_cost_percent{bridge="mobula", from_token!="6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN"}[24h]))
      p90: avg(quantile_over_time(0.90, bridge_cost_percent{bridge="mobula", from_token!="6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN"}[24h]))
      p99: avg(quantile_over_time(0.99, bridge_cost_percent{bridge="mobula", from_token!="6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN"}[24h]))
      mean: avg(avg_over_time(bridge_cost_percent{bridge="mobula", from_token!="6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN"}[24h]))
      success: avg(avg_over_time(bridge_quote_success{bridge="mobula", from_token!="6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN"}[24h]))
      sample_size: sum(count_over_time(bridge_cost_percent{bridge="mobula", from_token!="6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN"}[24h]))
      series: avg_over_time(bridge_cost_percent{bridge="mobula", from_token!="6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN"}[1h])
      regions:
        - region: eu-west
          p50: avg(quantile_over_time(0.50, bridge_cost_percent{bridge="mobula", from_token!="6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN", region="eu-west"}[24h]))
          series: avg_over_time(bridge_cost_percent{bridge="mobula", from_token!="6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN", region="eu-west"}[1h])
        - region: us-east
