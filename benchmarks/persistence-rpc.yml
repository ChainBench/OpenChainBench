      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="persistence-official", chain="persistence"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="persistence-official", chain="persistence"}) / sum(ocb:rpc_call:rate_24h{provider="persistence-official", chain="persistence"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="persistence-official", chain="persistence"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="persistence-official", chain="persistence"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="persistence-official", chain="persistence", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="persistence-official", chain="persistence", region="us-east"}[1h])
        - region: eu-west
