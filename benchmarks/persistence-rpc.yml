          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="persistence", region="sgp"}[1h])
  - slug: persistence-official
    name: Persistence Foundation
    endpoint: https://rpc.core.persistence.one
    tag: Official Persistence Foundation public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to the Persistence Foundation's no-key endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="persistence-official", chain="persistence"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="persistence-official", chain="persistence"})
