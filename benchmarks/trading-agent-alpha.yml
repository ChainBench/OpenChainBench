# OpenChainBench. Bench № 284

slug: trading-agent-alpha
number: "284"
title: "AI trading agents: what eight models earn net of the asset"
seo_title: "AI trading agent results: alpha net of the asset, live"
seo_description: "Eight frontier models trade ETH/USDC on Base under identical rules. {{best_name}} leads at {{best_p50}} alpha over {{count}} agents. None beats holding the same exposure."
subtitle: Compounded return minus a passive position at each agent's own measured exposure, over the weekly Recall arena rounds it funded. Eight frontier models, one token, identical rules.

category: Trading
status: live
metric: Alpha net of asset exposure
unit: pct
higher_is_better: true
row_noun: { one: agent, many: agents }

seo_intro: |
  Recall Labs runs a weekly spot-trading arena on Base where eight autonomous agents trade the same ETH/USDC pair for six days under identical rules. Each agent is one harness wrapped around a different frontier model, so the roster holds everything constant except the model. Recall publishes who won each round. This page publishes what that cannot show: whether any of them beat simply holding the exposure they were already carrying.

abstract: |
  Eight frontier models, same token, same rules, {{count}} ranked over the weekly rounds each one funded. {{best_name}} leads at {{best_p50}}; the trailer is {{worst_name}} at {{worst_p50}}. Every figure is alpha, not return.
  The arena is single-asset, so a round's raw return is mostly ETH's move: measured across the scored rounds, the correlation between the round's median agent return and ETH's own return is 0.81, and the agents carry an implied exposure near 0.43. Ranking raw returns would rank ETH weeks. So the headline subtracts, round by round, what a passive position at that agent's own measured beta would have returned over exactly the rounds it funded. No agent is charged for a round it sat out, and none is credited for the asset rising.

methodology:
  - "Source: Recall Labs' public competition API, no credential required. One pass an hour recomputes every figure from scratch, so the harness holds no state and a missed pass loses nothing. Results back to May 2025 are still served upstream, verified against the oldest round."
  - "Scope: the `aerodrome-spot-live` arena only, which is live spot trading on Base through Aerodrome with real money. One arena on purpose. Across Recall's other arenas the round length spans 11x, the funded capital spans ten orders of magnitude, the field runs from 6 to 64, and the instrument changes between spot, leveraged perpetuals and simulated money."
  - "Why one arena and not a pooled score: we built eight defensible aggregates of the pooled data and they disagree. Mean rank percentile against mean raw return share only 3 of the top 10 names, with a median move of 12 places and a maximum of 51 out of 67 agents. Whatever sat on top would be a property of the chosen normalisation, not of the agents."
  - "Headline: compounded return over an agent's funded rounds, minus the compounded return of a passive position at that agent's own regression beta to the asset over those same rounds. Higher is better and zero means the model added nothing beyond the exposure it held."
  - "Beta is measured per agent, not assumed, by regressing its round returns on the asset's return over the same windows. The measured betas run from 0.12 to 0.74, so a single blanket exposure assumption would flatter some agents and penalise others."
  - "A round with a zero profit figure is almost never a flat trade. Of the zero rows in this arena, 88 of 90 carry a portfolio value of zero, meaning the agent did not fund that round. Only funded rounds count. Treating them as zero-percent results drops the measured hit rate by eleven points and inflates each sample from about 22 rounds to 34."
  - "Eleven ended rounds publish ranks from 1 to 8 and no data at all, every portfolio value zero. The harness refuses to score a round without a real field, and publishes the count it refused as `trading_agent_rounds_skipped`."
  - "The roster changed once. Only agents with at least ten funded rounds are ranked, which selects the eight-model roster that 32 rounds share. A handful of other entries appear two or three times and are not averaged into the same table."
  - "The asset counterfactual comes from Coinbase's public ETH-USD daily closes, deliberately outside Recall, because a benchmark drawn from the same source as the thing it measures is circular. Where a round boundary has no candle the harness walks back up to five days, and a round with no price is skipped rather than scored against nothing."
  - "What this does not measure: Recall builds the agents. Their own description reads `Autonomous live spot trading agent built by Recall Labs, powered by` the model in question, so the prompt, the rebalancing and the execution are Recall's and are held constant. This is one harness interacting with each model, never a model's trading ability in the abstract."
  - "Agent names are declared, not verified. Nothing in the data proves which model sits behind a name, so no row here is a claim about a vendor's product."
  - "Input modality (since 2026-10-06): the arena runs several models twice, once fed numeric chart data and once fed an image. The tabs expose it, but only three models have both variants, so the contrast is indicative and not a result. The mean paired difference is 7.3 points with a standard deviation of 7.1 across those three."
  - "Cadence: rounds are weekly and last six days, so a figure that has not moved in days is current rather than stale. Freshness is published as `trading_agent_last_round_end_timestamp_seconds`."

findings:
  - "{{count}} agents are ranked and not one of them beats a passive position at its own measured exposure. The leader, {{best_name}}, still gives up {{best_p50}} against simply holding what it was already holding."
  - "Raw returns on this arena are mostly the asset. The correlation between the round median and ETH's own move is 0.81, which leaves about a third of a round's outcome for everything the agents do, including fees and slippage."
  - "The spread between models is far smaller than the spread between the agents that wrap them. In a separate Recall round that put these models against purpose-built agents on Hyperliquid perpetuals, the purpose-built entries took the first three places and all six models trailed, while the gap between models inside this one harness stays inside a few points."
  - "{{worst_name}} is the trailer at {{worst_p50}}, and it also carries the lowest measured exposure at 0.12. Holding less of the asset did not protect it: the shortfall is the trading, not the market."

faq:
  - q: "Are there AI agents that trade profitably on their own?"
    a: "On a single round, yes, and some post large gains. Across a record, no agent in this arena beats holding the exposure it already carries. The leader's alpha is {{best_p50}} and every one of the {{count}} ranked agents is negative, measured over the weekly rounds each one funded with real money on Base."
  - q: "Which AI model is the best trader?"
    a: "This data cannot answer that, and a page that claimed to would be overstating it. Every agent here is the same harness built by Recall Labs with a different model behind it, so the comparison is between models inside one wrapper. The measured gap between them is small enough that separating them confidently would need years more rounds."
  - q: "Why measure alpha instead of return?"
    a: "The arena is single-asset: every agent holds a mix of ETH and USDC, so a round's return is mostly ETH's move. The return column is published for context, but ranking it would rank weeks in which ETH rose. Alpha subtracts a passive position at each agent's own measured exposure over exactly the rounds it funded."
  - q: "Is this real money?"
    a: "Yes. The arena is live spot trading on Base through Aerodrome with self-funded wallets, and the swaps are on-chain. The portfolios are small, with medians in the low hundreds of dollars, so nothing here speaks to how these strategies would behave at size where slippage and capacity bind."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/trading-agent-alpha

prometheus:
  window: 30d
  freshness_metric: trading_agent_alpha_pct
  freshness_timestamp_metric: trading_agent_last_run_timestamp_seconds
  expected_freshness_seconds: 10800

dimensions:
  kind:
    # Input modality, not strategy: the same model fed numbers or fed a chart
    # image. `all` is the pooled roster and is pinned in every query below so
    # the tab actually filters instead of relabelling an unfiltered number.
    - { value: all,    label: All agents }
    - { value: chart,  label: Fed chart data }
    - { value: vision, label: Fed chart images }

dimension_labels:
  kind: Input modality

metric_panels:
  - id: raw_return
    label: Return
    label_key: agent
    metric: trading_agent_return_pct
    unit: pct
    description: "Compounded return over the rounds this agent funded. Published for context: on a single-asset arena this mostly tracks ETH, which is why it is not the headline."
  - id: passive
    label: Same exposure held
    label_key: agent
    metric: trading_agent_passive_pct
    unit: pct
    description: "What holding this agent's own measured beta to ETH would have returned over exactly the same rounds. The counterfactual the alpha is measured against."
  - id: asset_hold
    label: Asset held outright
    label_key: agent
    metric: trading_agent_asset_pct
    unit: pct
    description: "What holding ETH outright would have returned over the rounds this agent funded. Shown so the reader can see the market the agent was trading in."
  - id: hit_rate
    label: Winning rounds
    label_key: agent
    metric: trading_agent_hit_rate_pct
    unit: pct
    description: "Share of funded rounds that finished above zero. Unfunded rounds are excluded: an agent that did not put money up has not had a flat week, it has had no week."
  - id: exposure
    label: Measured exposure
    label_key: agent
    metric: trading_agent_beta
    unit: x
    description: "Regression slope of the agent's round returns against ETH over the same rounds. 1.0 would be holding ETH outright, 0 would be sitting in stablecoins."
  - id: n_rounds
    label: Rounds
    label_key: agent
    metric: trading_agent_rounds
    unit: count
    description: "Funded rounds behind this agent's figures. Every column on this page is computed over exactly these rounds and no others."

ledger_columns:
  - { label: "Alpha", slot: p50 }
  - { label: "Return", panel: raw_return }
  - { label: "Same exposure held", panel: passive }
  - { label: "Winning rounds", panel: hit_rate }
  - { label: "Exposure", panel: exposure }
  - { label: "Rounds", panel: n_rounds }

providers:
  - slug: gemini-3-pro-chart
    name: gemini 3 pro chart
    tag: Recall harness, Gemini 3 Pro, fed chart data
    formula: "Compounded return over this agent's funded rounds minus a passive position at its own measured beta to ETH over the same rounds. Declared model, not verified."
    queries:
      p50: avg(quantile_over_time(0.50, trading_agent_alpha_pct{agent="gemini-3-pro-chart", kind="all"}[30d]))
      p90: avg(quantile_over_time(0.90, trading_agent_alpha_pct{agent="gemini-3-pro-chart", kind="all"}[30d]))
      p99: avg(quantile_over_time(0.99, trading_agent_alpha_pct{agent="gemini-3-pro-chart", kind="all"}[30d]))
      mean: avg(avg_over_time(trading_agent_alpha_pct{agent="gemini-3-pro-chart", kind="all"}[30d]))
      success: clamp_max(avg(trading_agent_rounds{agent="gemini-3-pro-chart", kind="all"}) / 20, 1)
      sample_size: avg(trading_agent_rounds{agent="gemini-3-pro-chart", kind="all"})
      series: avg_over_time(trading_agent_alpha_pct{agent="gemini-3-pro-chart", kind="all"}[1d])

