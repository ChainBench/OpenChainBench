# OpenChainBench. Bench № 154

slug: astar-rpc
number: "154"
title: "Astar Network RPC endpoints: free public URLs by latency"
seo_title: "Astar Network RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Astar Network RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Astar Network RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Astar Network (chain 592) is Polkadot's flagship EVM and WebAssembly parachain, ASTR gas token, supporting both Solidity and ink! smart contracts. Developed by Startale (formerly Stake Technologies) and chosen by Sony for Soneium infrastructure, it exposes a standard EVM endpoint alongside Substrate RPC. OnFinality and 1RPC provide keyless access probed every 60 seconds from three regions. PublicNode returned 404 and BlastAPI's DNS is dead.

abstract: |
  Astar Network: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Astar Network endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Astar Network-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Astar Network-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"astar\"`. Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. PublicNode returned 404; BlastAPI DNS is dead."

faq:
  - q: "Which Astar Network RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing, each listed with its URL in the endpoints table above. PublicNode returned 404 and BlastAPI's DNS is dead; both were removed."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="astar"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: onfinality
    name: OnFinality
    endpoint: https://astar.api.onfinality.io/public
    tag: OnFinality shared node service
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to OnFinality's no-key Astar Network endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="astar"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="onfinality", chain="astar"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="onfinality", chain="astar"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="onfinality", chain="astar"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="onfinality", chain="astar"}) / sum(ocb:rpc_call:rate_24h{provider="onfinality", chain="astar"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="onfinality", chain="astar"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="astar"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="astar", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="astar", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="astar", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="astar", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="astar", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="astar", region="sgp"}[1h])

  - slug: 1rpc
    name: 1RPC
    endpoint: https://1rpc.io/astr
    tag: Privacy-first RPC relay, Automata Network
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to 1RPC's no-key Astar endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="1rpc", chain="astar"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="1rpc", chain="astar"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="1rpc", chain="astar"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="1rpc", chain="astar"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="1rpc", chain="astar"}) / sum(ocb:rpc_call:rate_24h{provider="1rpc", chain="astar"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="1rpc", chain="astar"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="1rpc", chain="astar"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="1rpc", chain="astar", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="1rpc", chain="astar", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="1rpc", chain="astar", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="1rpc", chain="astar", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="1rpc", chain="astar", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="1rpc", chain="astar", region="sgp"}[1h])
