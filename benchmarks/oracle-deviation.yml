prometheus:
  window: 24h

# Real metrics emitted by the oracle-deviation harness:
#   ocb_oracle_price{source, pair}                                gauge (USD)
#   ocb_oracle_deviation_pct{pair, source_a, source_b}            gauge (percent)
#   ocb_oracle_max_deviation_pct{pair}                            gauge (percent, max across all source pairs)
#   ocb_oracle_update_latency_seconds{source, pair}               gauge
#   ocb_oracle_last_round_age_seconds{source="chainlink", pair}   gauge (Chainlink only, on-chain updatedAt gap)
#   ocb_oracle_scrape_errors_total{source, pair}                  counter
#
# sources are "chainlink" | "pyth" | "binance" | "coinbase".
#
# Each "provider" below is one USD pair. The leaderboard ranks
# pairs by p99 of the per-pair max cross-oracle deviation over
# 24 h (lower = tighter cross-oracle agreement). The harness
# publishes the metric as a percent; we multiply by 100 in every
# query to surface it in basis points (bps), which is the right
# granularity for oracle-grade reporting (1 bps = 0.01%).
#
# XRP, ADA and DOGE are 3-source pairs because the Chainlink
# mainnet AggregatorV3 contracts for those USD feeds are
# deprecated (the harness drops Chainlink from the deviation
# matrix for these pairs rather than averaging in a stale value).
# The provider tag flags it explicitly.

providers:
  - slug: btc-usd
    name: BTC/USD
    tag: Bitcoin spot · 4 sources
    formula: "Median of the max pairwise BTC/USD price disagreement (in bps) across Chainlink, Pyth, Binance and Coinbase, polled every 30s, p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, ocb_oracle_max_deviation_pct{pair="BTC/USD"}[24h]) * 100
      p90: quantile_over_time(0.90, ocb_oracle_max_deviation_pct{pair="BTC/USD"}[24h]) * 100
      p99: quantile_over_time(0.99, ocb_oracle_max_deviation_pct{pair="BTC/USD"}[24h]) * 100
      mean: avg_over_time(ocb_oracle_max_deviation_pct{pair="BTC/USD"}[24h]) * 100
      success: clamp_min(clamp_max(1 - sum(rate(ocb_oracle_scrape_errors_total{pair="BTC/USD"}[24h])) / (4 * (1/30)), 1), 0)
      sample_size: sum(count_over_time(ocb_oracle_price{pair="BTC/USD"}[24h]))
      series: ocb_oracle_max_deviation_pct{pair="BTC/USD"} * 100

  - slug: eth-usd
    name: ETH/USD
    tag: Ether spot · 4 sources
    formula: "Median of the max pairwise ETH/USD price disagreement (in bps) across Chainlink, Pyth, Binance and Coinbase, polled every 30s, p50 over 24h."
