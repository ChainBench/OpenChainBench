# OpenChainBench. Bench № 025

slug: oracle-deviation
number: "025"
title: Chainlink vs Pyth vs Binance vs Coinbase, live oracle deviation
seo_title: "Chainlink vs Pyth oracle deviation 2026"
seo_description: "Chainlink, Pyth, Binance, Coinbase oracle deviation ranked live on BTC, ETH, SOL, BNB, XRP, ADA, DOGE, AVAX, LINK, POL. Max pairwise bps, p99 over 24h."
subtitle: Maximum pairwise price disagreement in basis points across Chainlink, Pyth, Binance and Coinbase, polled every 30 seconds on 10 USD pairs.
category: Trading
status: live
metric: Max cross-oracle deviation
unit: bps
higher_is_better: false

disclaimer: |
  Three caveats. (1) Lower is better, but a non-zero floor (~5-20 bps) is normal, ticker last-traded prices have micro-jitter and Chainlink updates only on deviation/heartbeat. (2) XRP, ADA, DOGE measured on 3 sources because Chainlink deprecated those USD feeds on Ethereum mainnet, tag flags it. (3) POL/USD is the post-migration symbol for MATIC; we point at POLUSDT (not the frozen legacy MATICUSDT).

seo_intro: |
  This benchmark answers the question every protocol designer
  picking an oracle asks. how aligned are the major price feeds in
  reality, not in marketing, on the exact pair I'm settling at this
  exact second. Most "oracle comparison" articles cite vendor
  whitepapers ("99.9% accurate", "sub-second latency") without
  publishing the diff. We poll four oracles every 30 seconds for ten
  USD-quoted blue chips, compute the pairwise deviation
  `|a-b|/avg * 100` for every source pair, and publish the per-asset
  maximum as a Prometheus gauge in basis points. Coverage. Chainlink
  AggregatorV3 (eth_call against the canonical Ethereum mainnet
  contracts), Pyth Hermes REST (batched latest_price_feeds), Binance
  REST ticker (USDT-quoted, treated as ≈ USD), Coinbase REST ticker
  (USD-quoted). Pairs. BTC, ETH, SOL, BNB, AVAX, LINK, POL (4
  oracles each) and XRP, ADA, DOGE (3 oracles, Chainlink mainnet
  feeds for these pairs are deprecated, documented per provider).
  Honest about the SOL case. SOL/USD currently shows the widest
  disagreement (~1.2% live) not because the bench is broken but
  because the Chainlink on-chain SOL/USD feed is updated on a 0.5%
  deviation trigger that frequently lags the CEX/Pyth quote during
  fast moves, exactly the kind of oracle-health signal a protocol
  team needs to see before settling perp liquidations on it.

abstract: |
  We measure live oracle disagreement by polling four price oracles
  every 30 seconds for ten USD-quoted blue chips, then computing the
  full pairwise deviation matrix per pair. Deviation between two
  sources is `|price_a - price_b| / ((price_a + price_b) / 2) * 100`
  in percent; the bench surfaces it both per source-pair
  (`ocb_oracle_deviation_pct{source_a, source_b}`) and as the per-pair
  maximum across all source pairs (`ocb_oracle_max_deviation_pct`).
  The headline leaderboard ranks the 10 pairs by p99 of the max
  deviation over 24 h (lower = better cross-oracle alignment, i.e.
  more agreement on what the asset actually trades at). A stale-price
  guard skips any sample older than `2 * pollInterval` (60 s) so a
  dead poller doesn't artificially flatten the deviation. Three pairs
  (XRP, ADA, DOGE) are measured on 3 sources only because Chainlink
  deprecated those USD feed contracts on Ethereum mainnet; the bench
  exposes them honestly with the disclaimer in the provider tag and
  still computes the deviation across the remaining trio. The
  `ocb_oracle_last_round_age_seconds{source="chainlink"}` companion
  gauge surfaces Chainlink's on-chain update gap separately, so a
  high deviation can be attributed to the right cause (a lagging
  feed vs. a CEX outlier) without confusing the reader.

methodology:
  - "Sources. Chainlink AggregatorV3 via `eth_call(latestRoundData())` on Ethereum mainnet (no API key, public RPC with fallback), Pyth Network via Hermes REST `/api/latest_price_feeds` batch endpoint (no key), Binance REST `/api/v3/ticker/price` on USDT-quoted symbols (treated as ≈ USD), Coinbase REST `/products/<P>/ticker` on USD-quoted products. All four are free, no-auth, public endpoints."
  - "Pairs (10). BTC, ETH, SOL, BNB, AVAX, LINK and POL are tracked on all 4 sources. XRP, ADA, DOGE are tracked on 3 sources (Pyth + Binance + Coinbase) because the Chainlink mainnet AggregatorV3 contracts for these USD feeds are deprecated and no longer updated by node operators, the provider tag flags it."
  - "Cadence. 30 second polling interval per (source, pair). 4 sources × 10 pairs × 2/minute = 80 requests/minute total, comfortably under every free-tier ceiling (Binance 1200/min, Coinbase 10/s public, Pyth ~30/s soft, public RPC courteous). HTTP timeout is 8 s per request to match the gas-estimation harness."
  - "Deviation formula. For every unordered pair of sources `(a, b)` that both have a fresh sample for the same pair: `deviation_pct = |price_a - price_b| / ((price_a + price_b) / 2) * 100`. With 4 sources we compute 6 pairwise deviations per asset; with 3 sources we compute 3. Per-pair headline is the max across all source-pairs (`ocb_oracle_max_deviation_pct`)."
  - "Stale-price guard. A source's sample is considered stale and excluded from the deviation calculation if its last successful update is older than `2 * pollInterval` (60 s). Prevents a dead Coinbase ticker from registering as a 0% deviation against itself by leaving the price gauge fossilized."
  - "Chainlink round age. The on-chain `updatedAt` timestamp from `latestRoundData()` is published separately as `ocb_oracle_last_round_age_seconds{source=\"chainlink\", pair}`. Chainlink updates only on deviation (typically 0.25-0.5% for blue chips) or heartbeat (~1 h), so a 30-minute age on a quiet ETH minute is normal; a 2-hour age on SOL during a volatile minute is the actual signal."
  - "USDT ≈ USD assumption. Binance only quotes USDT pairs (BTCUSDT, etc.). We treat USDT as ≈ USD ± 10 bps drift, which is acceptable for a bench whose alert floor is ≥ 10 bps. A real USDT depeg would surface as Binance drifting from the other three sources for *every* pair simultaneously, exactly what we want this bench to flag, not hide."
  - "MATIC → POL migration. Polygon migrated MATIC → POL 1:1 on Sep 4 2024. The Chainlink mainnet feed contract is still named MATIC/USD but on-chain `description()` confirms it tracks the POL token; Pyth renamed the feed to POL/USD; Coinbase delisted MATIC-USD and only lists POL-USD; Binance kept MATICUSDT as a frozen historical pair AND lists POLUSDT. We point Binance at POLUSDT so all four sources track the same underlying asset. Bench label is kept as `pair=\"MATIC/USD\"` for query continuity."
  - "Time-aligned deviation (canonical headline). For every source pair we anchor on the more recent SourceTS (Chainlink's on-chain `updatedAt`, fetch time for continuous sources) and look up the older source's price in a 30-minute rolling history at that moment. Published as `ocb_oracle_deviation_at_oracle_ts_pct`, feeding `ocb_oracle_max_deviation_pct`. Removes Chainlink heartbeat-lag inflating deviation; alignment misses count as `ocb_oracle_alignment_miss_total`."
  - "Excluded by design. Redstone (push-pull, no continuous gauge to scrape without integration contract), Uniswap V3 TWAP (per-pool integration + derivation of same CEX prints), DIA (smaller footprint than the four kept), and aggregator-of-aggregators (CoinGecko, CMC, DefiLlama), re-aggregating already-aggregated data adds latency and hides per-source disagreement."

findings:
  - "{{best_name}} currently leads at {{best_p50}} (p99 max cross-oracle deviation, 24 h) across {{count}} measured pairs. The leaderboard ranks by how tightly the available sources agree on the asset's price, lower = better, so the leader is the asset for which every source you might integrate would settle within fractions of a basis point of every other."
  - "{{name:btc-usd}} clocks {{p50:btc-usd}} on 4 sources. BTC's deep liquidity on every CEX plus the most-watched Chainlink feed on mainnet (heartbeats updated within minutes by competing node operators) means the 4-way disagreement is structurally near the floor; if you can't get oracle agreement on BTC, you have a poller bug, not a market signal."
  - "{{name:sol-usd}} runs wider at {{p50:sol-usd}} on 4 sources. This is a real signal, not a bench bug. Chainlink SOL/USD updates only on 0.5% deviation or 1h heartbeat while Pyth/Binance/Coinbase publish continuously, during fast SOL moves the on-chain Chainlink price lags the CEX print by minutes (`ocb_oracle_last_round_age_seconds` often shows multi-thousand-second ages vs ~1000-1500s for blue chips). Any perp DEX settling SOL liquidations off Chainlink alone inherits this as trader slippage."
  - "XRP, ADA and DOGE are measured on 3 sources, not 4, the Chainlink mainnet AggregatorV3 contracts for these USD pairs are deprecated and no longer updated by node operators, so the bench drops them from the deviation matrix rather than averaging in stale data. The 3-source deviation is honest (Pyth + Binance + Coinbase, all live), and the provider tag flags the asymmetry. Protocols settling these assets on Chainlink mainnet should confirm directly with the contract's `updatedAt`."
  - "{{name:matic-usd}} sits at {{p50:matic-usd}}, the post-migration POL token. The Chainlink mainnet contract still answers to the legacy MATIC/USD name but on-chain `description()` confirms it tracks POL 1:1 (verified against Pyth's renamed POL/USD feed and Coinbase's POL-USD product). If you're building on Polygon and integrating the legacy contract address, you're already on POL, no migration needed."
  - "{{worst_name}} trails at {{worst_p50}} on the active filter. The gap between leader and laggard is dominated by two factors: how fast the asset moves (volatile minutes widen the deviation regardless of oracle quality) and how aggressive each oracle's update trigger is (Chainlink's deviation threshold is the binding constraint on most pairs; Pyth/Binance/Coinbase are within bps of each other most of the time)."

faq:
  - q: "What is oracle deviation and why does it matter?"
    a: "Oracle deviation is the basis-point gap between two oracles' reported price for the same asset at the same moment. It matters because every on-chain product that settles in fiat (perp DEXes, lending markets, derivatives, stablecoin issuers) picks one oracle and inherits its drift. If your lending market uses Chainlink ETH/USD and Chainlink lags the CEX print by 30 bps during a fast move, every liquidation triggered in that window over- or under-pays the keeper by 30 bps, which is the difference between a healthy liquidation engine and a bad-debt spiral. The bench measures this gap live so you can size the risk before you ship the integration."
  - q: "Why is SOL deviation so much higher than BTC?"
    a: "Two reasons, both structural and both informative. (1) Chainlink's SOL/USD mainnet feed is configured with a 0.5% deviation trigger and a 1-hour heartbeat, so during fast SOL moves the on-chain price legitimately lags the live CEX print until the trigger fires. (2) SOL is more volatile per unit time than BTC/ETH, so even within the trigger window there's more price travel between updates. The companion gauge `ocb_oracle_last_round_age_seconds{pair=\"SOL/USD\"}` regularly shows ages in the multiple thousands of seconds (vs ~1000-1500 s for ETH/BTC/AVAX/LINK), which is the on-chain confirmation that the deviation is Chainlink lag, not a CEX outlier. The bench surfaces this honestly, it's exactly the signal a protocol team needs to see before settling SOL perps off a single oracle."
  - q: "What does 'Chainlink lag' mean in practice, does the oracle break?"
    a: "Chainlink doesn't break, but it intentionally doesn't push every tick. On-chain updates cost gas; Chainlink node operators only post a new round when either (a) the off-chain aggregated price has drifted by a configured threshold from the last on-chain value (the 'deviation trigger', typically 0.25-0.5% for blue chips, 1% for long-tail) or (b) the configured heartbeat interval has elapsed since the last update (typically 1 h for blue chips, longer for stale-tolerant assets). Between updates, the on-chain value is whatever was last pushed, so during a fast move the on-chain price can lag the off-chain market by 1× the deviation threshold for as long as it takes the next round to land. That's by design: it trades latency for gas cost. The bench's `ocb_oracle_last_round_age_seconds` gauge surfaces the gap directly so the lag is never invisible."
  - q: "Why are XRP, ADA and DOGE measured on only 3 sources?"
    a: "The Chainlink mainnet AggregatorV3 contracts for XRP/USD, ADA/USD and DOGE/USD are deprecated, node operators no longer post fresh rounds to them, so the on-chain `updatedAt` is days or weeks stale. Rather than averaging in a fossilized value (which would either falsely deflate the deviation by anchoring it to an outdated number or falsely inflate it once the live market moves away), the bench excludes Chainlink from the deviation matrix for these three pairs and computes the disagreement across Pyth + Binance + Coinbase only. The provider tag for each of these pairs flags '3 sources' explicitly. Protocols settling XRP, ADA or DOGE on Ethereum mainnet through Chainlink should confirm the feed's status directly, these are tier-2 assets on Chainlink's Ethereum L1 deployment and the production feeds for them live on other chains (BSC, Solana for ADA/DOGE)."
  - q: "MATIC vs POL, what changed and which one is this bench measuring?"
    a: "Polygon migrated its native token from MATIC to POL on September 4 2024, 1:1. POL is the new token; MATIC is the legacy ticker. The four oracles handled it differently: Pyth renamed the feed to POL/USD; Coinbase delisted MATIC-USD and lists only POL-USD; Binance kept MATICUSDT as a frozen historical pair (don't use it, it detaches from spot) AND lists POLUSDT; Chainlink left the mainnet feed contract at its old address with the legacy `description()` of 'MATIC / USD' but it tracks the POL token. The bench resolves all four to POL and keeps the label `pair=\"MATIC/USD\"` for query continuity. The reported price is POL/USD and all four sources agree on the same underlying asset."
  - q: "Why these four oracles and not Redstone, Uniswap TWAP or DIA?"
    a: "Two filters: 'free no-auth public endpoint' and 'continuous gauge'. Chainlink, Pyth Hermes, Binance and Coinbase all expose continuously-updating price feeds via REST or eth_call with no API key, which lets the bench scrape them at 30 s cadence indefinitely at zero cost. Redstone is push-pull/on-demand, the on-chain price is only refreshed when a transaction includes the signed off-chain quote in calldata, so there is no continuous gauge to scrape without deploying an integration contract that pulls on a timer. Uniswap V3 TWAP is a derivation of the same CEX prints we already poll directly, plus it needs per-pool integration code. DIA has smaller deployment footprint than the four kept. We may add Redstone and a pure-on-chain reference (TWAP) in a follow-up bench that runs on-chain itself; for the off-chain comparison this is the honest set."
  - q: "How often is each oracle polled and why 30 s?"
    a: "Every (source, pair) is polled every 30 seconds. The cadence is bounded below by Chainlink's update mechanics, the on-chain feed only refreshes on deviation or heartbeat, so polling faster than the feed updates returns the same value and wastes RPC calls. 30 s is fast enough to catch every Chainlink round within ~half a heartbeat of its on-chain landing while keeping total request volume at 80 req/min across all 4 sources × 10 pairs (well under every free-tier ceiling). Pyth Hermes, Binance and Coinbase tickers refresh continuously so 30 s polling captures them at full freshness."

