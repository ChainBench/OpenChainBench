# OpenChainBench. Bench № 156

slug: oasis-emerald-rpc
number: "156"
title: "Oasis Emerald RPC endpoints: free public URLs ranked by latency"
seo_title: "Oasis Emerald RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Oasis Emerald RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). {{count}} no-key endpoints measured, updated every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Oasis Emerald RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Oasis Emerald (chain 42262) is the EVM-compatible ParaTime on the Oasis Network providing a standard Solidity environment without confidentiality overhead, ROSE gas token bridged from the consensus layer, lower fees than mainnet Ethereum. The Oasis Foundation's emerald.oasis.io provides keyless access probed every 60 seconds from three regions.

abstract: |
  Oasis Emerald: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:oasis-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Oasis Emerald endpoint that sustains continuous probing, {{count}} provider at launch, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Oasis Emerald-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Oasis Emerald-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"oasis-emerald\"`. Provider coverage at launch: {{count}} no-key endpoints (Oasis Foundation)."

faq:
  - q: "Which Oasis Emerald RPCs work without an API key?"
    a: "{{count}} endpoint sustains continuous keyless probing at launch: Oasis Foundation. Every listed endpoint was live-verified before inclusion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="oasis-emerald"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: oasis-official
    name: Oasis Foundation
    tag: Oasis Foundation's Emerald public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Oasis Foundation's no-key Oasis Emerald endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="oasis-emerald"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="oasis-emerald"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="oasis-emerald"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="oasis-emerald"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="oasis-emerald"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="oasis-emerald"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="oasis-emerald"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="oasis-emerald"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="oasis-emerald", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="oasis-emerald", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="oasis-emerald", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="oasis-emerald", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="oasis-emerald", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="oasis-emerald", region="sgp"}[1h])
