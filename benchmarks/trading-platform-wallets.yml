# OpenChainBench. Bench № 232

slug: trading-platform-wallets
number: "232"
title: "Daily active wallets per trading terminal: Fomo vs Axiom vs pump.fun vs GMGN"
seo_title: "Daily active wallets by trading terminal 2026"
seo_description: "{{best_name}} leads trading terminals with {{best_p50}} distinct wallets in a day. Fomo, Axiom, GMGN and pump.fun ranked per chain."
subtitle: Distinct wallets that traded through each terminal in one complete day, counted per chain rather than pooled, with swaps per wallet and volume per wallet beside the count.

category: Trading
status: live
metric: Active wallets 24h
unit: count
higher_is_better: true
row_noun: { one: terminal, many: terminals }
# The success query is a publication gate (the harness published this terminal
# and chain on a day inside the window, or it did not), never a probe success
# rate. Declaring that hides the Success and Reliability columns, which would
# otherwise read 100% on every live row and invite a reader to take it for a
# measured uptime.
ledger_reliability: false

disclaimer: |
  Distinct wallets per chain for one complete UTC day, from the public tehcscreener API, which is Allium-backed. A wallet that used two terminals is counted in each, so the columns are not mutually exclusive, and bots, MEV searchers and multi-wallet traders are all included. A wallet is not a person. Counts are per chain and never summed across chains: the source's own cross-chain deduplication runs about 0.6 of the per-chain sum, so adding the tabs would overstate every terminal.

seo_intro: |
  Active wallet count says more about how many people use a terminal than
  transaction count does, because one bot can produce thousands of transactions
  and one wallet. This page counts the distinct wallets that traded through each
  terminal on the latest complete day, for each chain separately, and puts two
  ratios next to the count: swaps per wallet, and volume per wallet. The three
  together separate a terminal with many light users from one with few heavy
  ones. Fomo leads on wallet count while Terminal leads on both ratios, which is
  the same business run at two different intensities.

abstract: |
  The harness reads one day per terminal per chain from the tehcscreener
  /bots/{bot} endpoint and publishes the distinct wallet count as
  terminal_wallets, with terminal_trades_per_wallet and
  terminal_volume_per_wallet_usd derived from the same day's transactions and
  volume. Every figure is one chain's, on the day the source names as its latest.

  This bench measured nothing but Solana until 2026-10-07, through fee-wallet
  attribution over Dune, and three of its nine rows were structurally blank as a
  result. pump.fun and BasedBot had no fee wallet to attribute from, so they read
  unresponsive. Fomo sponsors the gas on the trades it routes, so the trader ids
  on its transactions were its own routing accounts and a count off them was
  orders of magnitude too low. None of those three limitations exist in a source
  that counts wallets directly rather than inferring them from who paid a fee,
  so all three now carry a real figure, and the comparison is no longer
  Solana-only.

methodology:
  - "Source: the public tehcscreener API (https://tehcscreener.com/api), Allium-backed, no key, synced once a day. The harness reads /bots over the full history for the roster and /bots/{bot} for each terminal's per-chain daily series, and publishes one day: the latest the source names."
  - "Wallets: the source's distinct wallet count for that terminal on that chain on that day. Counted per chain. The source also publishes a cross-chain deduplicated count, but only for 2 of the 9 terminals, so this bench uses the per-chain figure everywhere rather than mixing two definitions in one column."
  - "Why the counts are not summed across chains: measured on Fomo, the deduplicated cross-chain count is about 0.6 of the sum of its per-chain counts, because a wallet trading on two chains is one wallet. Adding the tabs together would overstate every multi-chain terminal, so each tab is read on its own."
  - "The two ratios: swaps per wallet is that day's transactions divided by that day's wallets, and volume per wallet is that day's volume divided by the same denominator. Both come from the same row as the count, so all three describe one terminal on one chain on one day."
  - "Latest complete day, not a rolling 24 hours: the source publishes daily and its latest day is normally yesterday. A terminal with no activity on that day carries no figure and reads unresponsive rather than having its last live day carried forward. BasedBot is the live case, with volume on Robinhood and none on Solana."
  - "Stale source: a day more than 3 whole days behind, or a terminal the source stops returning, has its gauges deleted and reads unresponsive. An old figure is never republished as current, because these gauges are scraped every 60 seconds and read through a 24h window, which would average a frozen figure in as though it had just been measured."
  - "Chains: five are offered as tabs, the ones with at least five terminals and meaningful volume. The harness also measures Arc, HyperEVM, Monad, X Layer and Avalanche, which are left off the tab strip because one or two terminals on a chain is a list, not a comparison."
  - "Includes every wallet: bots, MEV searchers and automated traders all count. Not a human-only metric, and a wallet using two terminals on the same day is counted in both."
  - "Not scored here: execution quality and cost. A terminal with many wallets is not thereby a cheap one; benches 268 and 279 measure what a swap costs on each."

findings:
  - "{{best_name}} leads trading terminals with {{best_p50}} distinct wallets in a day on this chain."
  - "Wallet count and wallet intensity rank differently. The terminal with the most wallets is not the one whose wallets trade hardest, and the two ratio columns are there so the gap is visible without leaving the page."
  - "A wallet count next to a transaction count is a bot ratio. A terminal whose users average thirty swaps a day is not serving the same behaviour as one whose users average nine."
  - "Every count is one chain's. The same terminal appears on several tabs with a different user base on each, and those sets overlap, which is why this page never adds them up."

source: https://github.com/ChainBench/OpenChainBench/tree/dev/harnesses/terminal-activity

prometheus:
  window: 24h
  url: https://prom.openchainbench.com
  expected_freshness_seconds: 172800
  freshness_timestamp_metric: terminal_activity_last_success_unix

dimension_labels:
  chain: Chain

dimensions:
  # No all-chains tab, and that is a measurement rather than an omission. A
  # wallet trading on two chains is one wallet; the source's own deduplicated
  # count runs about 0.6 of the sum of the per-chain counts, and it exists for
  # only 2 of the 9 terminals. Summing the tabs would overstate every
  # multi-chain terminal, so `all` carries Solana, the headline chain, and the
  # label says Solana rather than pretending to be a total.
  #
  # Every other bench on this harness does offer a real all-chains slice,
  # because volume, transactions and fees add up and wallets do not.
  chain:
    - { value: all,       label: Solana }
    - { value: bnb,       label: BNB Chain }
    - { value: robinhood, label: Robinhood Chain }
    - { value: base,      label: Base }
    - { value: arc,       label: Arc }
    - { value: ethereum,  label: Ethereum }
    - { value: hyperevm,  label: HyperEVM }

# The count, then the two ratios built on it. All three are one terminal on one
# chain on one day, so a reader never has to hold two definitions at once.
ledger_columns:
  - { label: Active wallets, slot: p50, unit: count }
  - { label: Swaps per wallet, panel: trades_per_wallet, unit: count }
  - { label: Volume per wallet, panel: volume_per_wallet, unit: usd }

metric_panels:
  - id: trades_per_wallet
    label: Swaps per wallet
    description: That day's transactions divided by that day's distinct wallets, for this terminal on this chain. How heavily the terminal's users trade, which separates a broad retail base from a small automated one.
    metric: terminal_trades_per_wallet{chain="all"}
    label_key: platform
    unit: count
    higher_is_better: true
  - id: volume_per_wallet
    label: Volume per wallet
    description: That day's volume divided by that day's distinct wallets, in USD, for this terminal on this chain. The average wallet's daily size.
    metric: terminal_volume_per_wallet_usd{chain="all"}
    label_key: platform
    unit: usd
    higher_is_better: true

faq:
  - q: "What does active wallet count measure?"
    a: "The number of distinct addresses that executed at least one swap through the terminal on the day, on the chain the tab names. It is a proxy for daily active users, with two caveats that cut in opposite directions: one person can control many wallets, and bots count as wallets."
  - q: "How is this different from swap transaction count (bench 207)?"
    a: "Bench 207 counts every individual swap. This one counts distinct addresses. A bot placing 500 swaps contributes 500 there and 1 here, so the ratio between the two is a measure of trading frequency and bot intensity. That ratio is the Swaps per wallet column, so you do not have to open both pages to see it."
  - q: "Why are the counts not added across chains?"
    a: "Because a wallet trading on two chains is one wallet, not two. The source publishes a cross-chain deduplicated count where it can, and measured on Fomo it is about 0.6 of the sum of the per-chain counts. Since that deduplicated figure exists for only 2 of the 9 terminals, this page reads each chain on its own rather than mixing a deduplicated column with a summed one."
  - q: "Why did pump.fun, BasedBot and Fomo used to be blank here?"
    a: "Because the old source inferred wallets from who paid a terminal's fee wallet. pump.fun and BasedBot had no fee wallet to attribute from, and Fomo sponsors the gas on the trades it routes, so the addresses on its transactions were its own routing accounts rather than its users. The current source counts wallets directly, so none of those three limitations apply and all three carry a figure."
  - q: "Can a terminal read unresponsive here while ranking on another bench?"
    a: "Yes, and BasedBot does. It routes real volume on Robinhood Chain and almost none on Solana, so it ranks on one tab and reads unresponsive on the other. A terminal with no activity on the day is never given its last live day instead."

providers:
  - slug: fomo
    name: Fomo
    url: https://fomo.family
    tag: "Cross-chain terminal, gas sponsored"
    formula: "Distinct wallets that traded through Fomo on this chain on the day, from the tehcscreener /bots/fomo series. Counted directly, not attributed from a fee payment: Fomo sponsors its traders' gas, which is why this row used to be blank."
    queries:
      p50: max(terminal_wallets{platform="fomo",chain="all"})
      p90: max(terminal_wallets{platform="fomo",chain="all"})
      p99: max(terminal_wallets{platform="fomo",chain="all"})
      success: max(terminal_activity_health{platform="fomo",chain="all"})
      sample_size: max(terminal_txns{platform="fomo",chain="all"})
      series: max by (platform) (terminal_wallets{platform="fomo",chain="all"})

