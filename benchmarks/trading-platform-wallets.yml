    formula: "Not measured. pump.fun charges no bonding-curve fee since Aug 2026, so no fee wallet receives anything on its trades and fee-wallet attribution cannot see them. The row reads unresponsive."
    queries:
      p50: dune_platform_wallets_24h{platform="pump-fun"}
      p90: dune_platform_wallets_24h{platform="pump-fun"}
      p99: dune_platform_wallets_24h{platform="pump-fun"}
      mean: dune_platform_wallets_24h{platform="pump-fun"}
