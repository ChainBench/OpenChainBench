  - slug: pump-fun
    name: pump.fun
    tag: "Solana meme launchpad"
    formula: "Unique wallets on pump.fun's app (dataset_pumpapp_sol_daily), latest complete day."
    queries:
      p50: dune_platform_wallets_24h{platform="pump-fun"}
      p90: dune_platform_wallets_24h{platform="pump-fun"}
      p99: dune_platform_wallets_24h{platform="pump-fun"}
      mean: dune_platform_wallets_24h{platform="pump-fun"}
      success: dune_platform_volume_health{platform="pump-fun"}
