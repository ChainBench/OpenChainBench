# OpenChainBench. Bench № 065

slug: fraxtal-rpc
number: "065"
title: Fastest free Fraxtal RPC, live no-key endpoint latency
seo_title: "Fastest free Fraxtal RPC 2026"
seo_description: "{{best_name}} leads free Fraxtal RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). {{count}} no-key providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Fraxtal RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Fraxtal, Frax's OP Stack rollup, fields {{count}} no-key providers: PublicNode, dRPC, Tenderly and Frax's own `rpc.frax.com`. The {{count}}-provider floor it just clears is the cluster's deliberate admission bar, chains that could not field {{count}} keyless endpoints (Mode, Zora, Abstract) were left out of the expansion entirely rather than shipped as two-row leaderboards. Identical probes every 60 seconds, three regions.

abstract: |
  Fraxtal: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:fraxtal-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Fraxtal endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore. The harness also classifies every response (ok / http_err / jsonrpc_err / stale / timeout) and audits archive depth every 5 minutes, so the leaderboard rewards sustained, honest availability rather than a fast error message. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Fraxtal-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the latest-header fetch with a rotating id defeats edge caches that answer eth_blockNumber without touching a node."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms → 10 s), so percentiles are computed via Prometheus `quantile_over_time` over the last 24 hours."
  - "Call-result classification: `ok` (HTTP 200 + non-empty result), `http_err`, `jsonrpc_err` (HTTP 200 carrying an error body), `stale` (more than 20 blocks behind the cross-provider tip), `timeout`. Latency without reliability is a misleading ranking signal."
  - "Archive depth: every 5 minutes we issue `eth_getBalance` at (head − depth) for depths from Geth's default pruned cap up to 5M blocks, exposing which free endpoints actually serve historical state."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities) benchmark; the identical harness, methodology and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to chain=\"fraxtal\". Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. Exclusions follow the cluster-wide rules documented on the parent benchmark."

faq:
  - q: "What is the fastest free Fraxtal RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber` p50 over the last 24h), measured against {{count}} no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples, so the answer on this page is the answer right now, not a quarterly snapshot. Use the region tabs to see the leader from the origin closest to your deployment."
  - q: "Which Fraxtal RPCs work without an API key?"
    a: "The {{count}} providers on this page are listed with their URLs in the endpoints table above. Every (provider, chain) pair was live-verified no-key before inclusion, and anything that key-gates, region-blocks or rate-limits below our 60-second cadence is excluded rather than listed with an asterisk."
  - q: "Why are chains like Mode, Zora or Sei missing from this cluster?"
    a: "Each failed a specific admission test. Mode, Zora and Abstract could not field {{count}} keyless providers, below the bar for a meaningful leaderboard. Sei was excluded because dRPC caches `eth_getBlockByNumber` there, poisoning the exact probe we rank on. opBNB fell out because 1RPC returns 429 at our 60-second cadence, leaving only 3 solid providers. The cluster only ships chains where the comparison is honest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on region alone.
rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="fraxtal"})

# Region is the only dimension: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://fraxtal-rpc.publicnode.com
    tag: Allnodes-operated, 70+ chains, archive on most
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Fraxtal endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="fraxtal"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="fraxtal"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="fraxtal"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="fraxtal"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="fraxtal"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="fraxtal"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="fraxtal"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="fraxtal"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="fraxtal", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="fraxtal", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="fraxtal", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="fraxtal", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="fraxtal", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="fraxtal", region="sgp"}[1h])

