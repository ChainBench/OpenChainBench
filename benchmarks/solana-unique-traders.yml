# OpenChainBench. Bench 207

slug: solana-unique-traders
number: "207"
title: "Daily swap transactions on Solana: Axiom vs Fomo vs GMGN vs Terminal vs Trojan"
seo_title: "Daily swap transactions by Solana platform 2026: Axiom vs Fomo vs GMGN vs Terminal vs Trojan"
seo_description: "{{best_name}} leads Solana platforms with {{best_p50}} swap transactions in a day. Axiom vs Fomo vs GMGN vs Terminal vs Trojan ranked by daily trading activity, from our own Dune SQL over fee-wallet attribution."
subtitle: Count of swap transactions executed through each Solana trading platform in one complete day. Built from our own SQL over Dune's solana.account_activity and dex_solana.trades, one execution a day. Reveals which platforms drive the most activity and which serve concentrated whales against broad retail flow.

category: Trading
status: live
metric: Unique swap tx 24h
unit: count
higher_is_better: true

disclaimer: |
  Counts distinct transaction ids per platform, not wallets, and the wallet count is several times lower because an active trader or bot sends many transactions a day. Bots, MEV searchers and multi-wallet traders are all included. A transaction counts for a platform when that platform's fee wallet received value in it, on Solana. pump.fun and BasedBot read unresponsive, for reasons the methodology gives.

seo_intro: |
  Axiom leads Solana platforms by raw swap transaction count, on the strength of a
  broad web-native user base and high-frequency retail flow. Fomo follows, its count
  swollen by the gas it sponsors on every trade it routes, and GMGN and Terminal each
  attract hundreds of thousands of transactions a day while Trojan and Photon serve a
  smaller and more concentrated segment. Every count here is fee-paying: a transaction
  is attributed to the platform whose fee wallet received value in it, from our own
  SQL over Dune's solana.account_activity and dex_solana.trades, one execution a day.
  Transaction count and volume rankings diverge, which is the point of reading both.

abstract: |
  The dune-platform-volume harness runs one Dune execution a day against its own SQL
  and counts the distinct transaction ids attributed to each platform for one
  complete UTC day. A transaction is attributed when the platform's fee wallet
  received value in it: a native SOL inflow on the wallet itself, or a USDC or wSOL
  inflow into a token account it owns. The count is exposed as
  dune_platform_txns_24h, alongside dune_platform_volume_data_day_unix and
  dune_platform_volume_health per platform. Bench 210 measures the same activity on
  a rolling 24h window from the solana-unique-traders harness and publishes
  solana_platform_unique_traders_24h, which is a different window and a separate
  series.

methodology:
  - "Source: our own SQL over Dune's solana.account_activity, dex_solana.trades and prices.day, one execution a day. No uploaded third-party dataset: the eight this bench read until 2026-09-27 all froze on 2026-08-25 and were served as current for 32 days."
  - "Count: COUNT(DISTINCT tx_id) over the transactions in which the platform's fee wallet received value on the data day, either a native SOL inflow on the wallet or a USDC or wSOL inflow into a token account it owns, joined to dex_solana.trades."
  - "Day: the newest UTC day that closed at least 10 hours earlier, the rule DeFiLlama's own Solana adapters use. dune_platform_volume_data_day_unix carries the day each figure is for."
  - "Stale source: a platform whose data day falls more than 3 days behind, or that the query stops returning, has its gauges deleted and reads unresponsive. An old figure is never republished as current."
  - "Scope: Solana only. GMGN, Axiom and Terminal also trade on EVM chains, and those legs are not counted here."
  - "pump.fun and BasedBot are not measured. pump.fun charges no bonding-curve fee since Aug 2026, so fee-wallet attribution cannot see it; no public fee wallet or router list for BasedBot exists."
  - "Metric represents unique swap transactions per platform. Actual unique-wallet count is 3-10x lower since active traders (and bots) execute multiple transactions per day."
  - "Bot inclusion: all transactions counted including automated traders, sniping bots, and copy-trade bots."
  - "Double-count across platforms: a tx touching two fee wallets is counted in both. Counts are not mutually exclusive."

findings:
  - "{{best_name}} leads Solana platforms with {{best_p50}} daily swap transactions."
  - "Every count here is fee-paying, so a transaction appears only where a platform earned on it. A trade routed through one terminal into another's pool counts once, for the terminal that took the fee."
  - "Axiom leads on transaction count, reflecting its broad web-native user base and high-frequency retail flow."
  - "Trojan and Photon serve a smaller but highly active segment, with fewer transactions and a higher average trade size."
  - "pump.fun and BasedBot read unresponsive. pump.fun charges no bonding-curve fee, so there is no fee wallet to attribute its transactions from, and BasedBot has no public wallet list."
  - "Unique swap tx and volume rankings diverge: Axiom leads terminals on tx count while Photon and Trojan serve more concentrated user bases with higher average position sizes."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/solana-unique-traders

prometheus:
  window: 24h
  freshness_metric: dune_platform_txns_24h

faq:
  - q: "What does unique daily swap transactions measure?"
    a: "Unique daily swap transactions counts the number of distinct tx_ids per platform in the rolling 24-hour window. For terminals it detects fee wallet inflows; for pump.fun it uses dex_solana.trades (pumpdotfun + pumpswap). Each tx_id represents one swap event. Actual unique-wallet count is 3-10x lower since active traders and bots execute many transactions per day."
  - q: "Why does pump.fun have so many more transactions than GMGN?"
    a: "pump.fun's bonding curve launch mechanic triggers massive bot sniping activity as automated traders race to buy newly created tokens in the first seconds of each launch. GMGN serves a more deliberate, power-trader segment with larger positions and fewer but higher-value transactions."
  - q: "Is this apple-to-apple between pump.fun and the others?"
    a: "Approximately yes. Both measure COUNT(DISTINCT tx_id) over 24h: terminals via fee wallet inflow detection (all trades generate a fee inflow), pump.fun via dex_solana.trades Spellbook (all indexed swap events). The methodological difference is the data source, not the underlying event type. Both capture real on-chain swap activity."
  - q: "Why did you switch pump.fun from fee wallets to dex_solana.trades?"
    a: "After pump.fun cut bonding-curve trading fees to 0% on 2026-08-07, its fee wallets still appeared in every bonding-curve tx as required program accounts, with micro-SOL balance changes from rent and account-creation side-effects. This inflated the fee-wallet count by ~60% (9.7M vs 6M real swaps). dex_solana.trades indexes actual swap events via the Dune Spellbook, eliminating the noise."
  - q: "How is Fomo tracked given its off-chain relay fees?"
    a: "Fomo collects per-trade fees in USDC to a protocol-owned token account. The Dune query matches on token_balance_owner = Fomo's fee wallet in solana.account_activity with USDC mint and positive balance change, capturing on-chain per-trade fee inflows. Fomo's off-chain relay fee component is not counted here."
  - q: "How is this different from bench 201 (24h volume)?"
    a: "Bench 201 ranks platforms by 24h swap volume in USD. This bench ranks by unique daily swap transactions. A platform can have high volume with few transactions (large trades) or high tx count with low volume (micro-trades and bots). Both metrics together reveal the full trader profile."

providers:
  - slug: pump-fun
    name: pump.fun
    tag: "Solana meme launchpad + relay"
    formula: "Not measured. pump.fun charges no bonding-curve fee since Aug 2026, so no fee wallet receives anything on its trades and fee-wallet attribution cannot see them. The row reads unresponsive."
    queries:
      p50: dune_platform_txns_24h{platform="pump-fun"}
      p90: dune_platform_txns_24h{platform="pump-fun"}
      p99: dune_platform_txns_24h{platform="pump-fun"}
      mean: dune_platform_txns_24h{platform="pump-fun"}
      success: dune_platform_volume_health{platform="pump-fun"}
      sample_size: dune_platform_txns_24h{platform="pump-fun"}
      series: dune_platform_txns_24h{platform="pump-fun"}

