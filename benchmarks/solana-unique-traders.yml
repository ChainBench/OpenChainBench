# OpenChainBench. Bench № 207

slug: solana-unique-traders
number: "207"
title: "Daily swap transactions on Solana: Axiom vs Fomo vs pump.fun vs GMGN"
seo_title: "Daily swap transactions by Solana terminal 2026"
seo_description: "{{best_name}} leads Solana terminals with {{best_p50}} swap transactions in a day. Axiom, Fomo, pump.fun, GMGN, Terminal and Trojan ranked."
subtitle: Swap transactions routed through each trading terminal on Solana in one complete day. Counts transactions, not wallets, so an automated trader sending hundreds of swaps a day counts hundreds of times.

category: Trading
status: live
metric: Swap transactions 24h
unit: count
higher_is_better: true
row_noun: { one: terminal, many: terminals }
# The success query is a publication gate (the harness published this terminal
# and chain on a day inside the window, or it did not), never a probe success
# rate. Declaring that hides the Success and Reliability columns, which would
# otherwise read 100% on every live row and invite a reader to take it for a
# measured uptime.
ledger_reliability: false

disclaimer: |
  Transaction counts for one complete UTC day on Solana, from the public tehcscreener API, which is Allium-backed. Counts transactions, not wallets: bench 232 counts the distinct wallets behind them, and the ratio between the two pages is a measure of automation. Bots, MEV searchers and multi-wallet traders are all included. Solana only, which is this bench's scope and not a limit of the source: the harness measures ten chains and bench 232 offers five of them as tabs.

seo_intro: |
  Transaction count is the rawest measure of how much a trading terminal is
  used, and the least flattering to read alone: an automated strategy sending
  three hundred swaps from one wallet counts three hundred times, so a terminal
  can lead on transactions while serving a fraction of another's users. This
  page counts the swaps routed through each terminal on Solana on the latest
  complete day. Read it next to bench 232, which counts the wallets behind
  those swaps on the same day from the same source, and the division is the
  automation ratio.

abstract: |
  The harness reads one day per terminal from the tehcscreener /bots/{bot}
  endpoint, takes the Solana series, and publishes its transaction count as
  terminal_txns. The figure is one chain's and one day's.

  Until 2026-10-07 this bench counted transactions in which a terminal's fee
  wallet received value, computed from our own SQL over Dune. That attribution
  could not see a terminal that charges no fee, so pump.fun was structurally
  absent from a transaction count it leads on. The current source counts
  routed transactions directly, so the cohort is complete.

methodology:
  - "Source: the public tehcscreener API (https://tehcscreener.com/api), Allium-backed, no key, synced once a day. The harness reads /bots over the full history for the roster and /bots/{bot} for each terminal's per-chain daily series, and publishes one day: the latest the source names."
  - "Transactions: the source's swap transaction count for that terminal on Solana on the day. A transaction is counted once, so a multi-hop route is one transaction and not one per hop."
  - "Not wallets: bench 232 counts the distinct wallets behind these transactions from the same source and the same day, and publishes the division as a Swaps per wallet column. A terminal whose users average thirty swaps a day is not serving the same behaviour as one whose users average nine."
  - "Latest complete day, not a rolling 24 hours: the source publishes daily and its latest day is normally yesterday. A terminal with no activity on that day carries no figure and reads unresponsive rather than having its last live day carried forward. BasedBot is the live case, with volume on Robinhood Chain and almost none on Solana."
  - "Stale source: a day more than 3 whole days behind, or a terminal the source stops returning, has its gauges deleted and reads unresponsive. An old figure is never republished as current, because these gauges are scraped every 60 seconds and read through a 24h window, which would average a frozen figure in as though it had just been measured."
  - "Two freshness layers, because they fail differently: terminal_activity_last_success_unix says the harness is still running, and terminal_activity_health says this particular terminal and chain published a day inside the window. A harness that runs while its source freezes trips the second, not the first."
  - "Scope: Solana only, by this bench's own definition rather than by what the source can see. The harness publishes ten chains; bench 232 and bench 203 offer the comparable ones as tabs."
  - "Not scored here: what those transactions cost. A terminal can lead on transaction count and be the most expensive way to route a swap; benches 268 and 279 measure that."

findings:
  - "{{best_name}} leads Solana trading terminals with {{best_p50}} swap transactions in a day."
  - "Transaction count and wallet count rank differently, and the gap is the point. Bench 232 counts the wallets behind these same transactions on the same day."
  - "pump.fun appears here for the first time. It charges no terminal fee, so a count built on fee-wallet attribution could not see it at all, whatever its real volume."
  - "A transaction is one routed swap, counted once however many hops it took, so a terminal that splits a route is not rewarded for it."

source: https://github.com/ChainBench/OpenChainBench/tree/dev/harnesses/terminal-activity

prometheus:
  window: 24h
  url: https://prom.openchainbench.com
  expected_freshness_seconds: 172800
  freshness_timestamp_metric: terminal_activity_last_success_unix

faq:
  - q: "What counts as a swap transaction here?"
    a: "One on-chain transaction that routed a swap through the terminal on Solana, counted once however many hops or pools it touched. A wallet sending fifty swaps in the day contributes fifty."
  - q: "Why is this higher than the wallet count on bench 232?"
    a: "Because one wallet sends many transactions. The two pages read the same source on the same day, so dividing one by the other gives swaps per wallet, which bench 232 now publishes as a column so you do not have to."
  - q: "Why was pump.fun missing before?"
    a: "The previous source counted transactions in which a terminal's fee wallet received value. The pump.fun app charges no terminal fee, so there was nothing to attribute from and the row was structurally blank rather than low. The current source counts routed transactions directly."
  - q: "Is this Solana only?"
    a: "This page is. The harness behind it measures ten chains, and bench 232 offers five of them as tabs for wallet counts. The Solana scope here is the bench's definition, which is why the slug says so."

providers:
  - slug: fomo
    name: Fomo
    tag: "Cross-chain terminal, gas sponsored"
    formula: "Swap transactions routed through Fomo on Solana on the day, from the tehcscreener /bots/fomo series."
    queries:
      p50: max(terminal_txns{platform="fomo",chain="solana"})
      p90: max(terminal_txns{platform="fomo",chain="solana"})
      p99: max(terminal_txns{platform="fomo",chain="solana"})
      success: max(terminal_activity_health{platform="fomo",chain="solana"})
      sample_size: max(terminal_volume_usd{platform="fomo",chain="solana"})
      series: max by (platform) (terminal_txns{platform="fomo",chain="solana"})

