    name: Solana
    formula: "last_over_time(chain_fees_30d_usd{chain=\"solana\"}[2h])"
    queries:
      p50: last_over_time(chain_fees_30d_usd{chain="solana"}[2h])
      p90: last_over_time(chain_fees_30d_usd{chain="solana"}[2h])
      p99: last_over_time(chain_fees_30d_usd{chain="solana"}[2h])
      mean: last_over_time(chain_fees_30d_usd{chain="solana"}[2h])
      success: avg_over_time(chain_kpis_health{chain="solana",source="fees"}[24h])
