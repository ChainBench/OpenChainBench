# OpenChainBench. Bench № 199

slug: peaq-rpc
number: "199"
title: "Peaq Network RPC endpoints: free public URLs ranked by latency"
seo_title: "Peaq Network RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Peaq Network RPC at {{best_p50}} (chain_getHeader p50, 24h). URLs for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for chain_getHeader against every free, no-key public Peaq Network Polkadot parachain endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Peaq Network is a DePIN (Decentralized Physical Infrastructure) parachain on Polkadot focused on the machine economy and IoT connectivity. PEAQ is the native token. Partnerships with Bosch and Fetch.ai underpin its real-world machine data use cases. {{count}} keyless endpoints are probed continuously, each listed with its URL in the endpoints table above.

abstract: |
  Peaq Network: {{count}} free public RPC endpoints answering `chain_getHeader` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical JSON-RPC call (`chain_getHeader`) against every no-key public Peaq parachain endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Peaq-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"chain_getHeader\",\"params\":[]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Peaq Network-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"peaq\"`. Provider coverage at launch: {{count}} no-key endpoints."

faq:
  - q: "Which Peaq Network RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing, each listed with its URL in the endpoints table above."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="peaq"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://peaq-rpc.publicnode.com
    tag: PublicNode multi-chain gateway including Substrate/Peaq
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `chain_getHeader` POST sent every 60s from 3 regions to PublicNode's no-key Peaq endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="peaq"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="peaq"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="peaq"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="peaq"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="peaq"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="peaq"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="peaq"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="peaq"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="peaq", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="peaq", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="peaq", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="peaq", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="peaq", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="peaq", region="sgp"}[1h])

  - slug: onfinality
    name: OnFinality
    endpoint: https://peaq.api.onfinality.io/public
    tag: OnFinality Substrate public gateway for Peaq
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `chain_getHeader` POST sent every 60s from 3 regions to OnFinality's no-key Peaq endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="peaq"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="onfinality", chain="peaq"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="onfinality", chain="peaq"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="onfinality", chain="peaq"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="onfinality", chain="peaq"}) / sum(ocb:rpc_call:rate_24h{provider="onfinality", chain="peaq"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="onfinality", chain="peaq"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="peaq"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="peaq", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="peaq", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="peaq", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="peaq", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="peaq", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="peaq", region="sgp"}[1h])
