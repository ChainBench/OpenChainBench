# OpenChainBench. Bench № 075

slug: solana-rpc
number: "075"
title: "Solana RPC endpoints: free public URLs and private API-key providers by latency"
seo_title: "Solana RPC endpoints: public and private, ranked by latency"
seo_description: "{{best_name}} leads free Solana RPC at {{best_p50}} (p50, 24h); URLs for all {{count}} no-key endpoints. {{best_name:tier:keyed}} leads the private (API-key) cohort at {{best_p50:tier:keyed}}."
subtitle: HTTP round-trip latency for getSlot against every free, no-key public Solana RPC endpoint (probed every 60 seconds) and, under the Access selector (Private), against the API-key endpoints of Alchemy, Chainstack and QuickNode (every 120 seconds), from 3 regions. The two cohorts are ranked separately, never against each other.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Solana is the first non-EVM member of the RPC latency cluster, and the chain where the free-RPC question is asked most and answered worst: most "best Solana RPC" roundups list endpoints that key-gated or died years ago. This page probes the {{count}} endpoints that actually answer keyless today, including the Solana Labs official api.mainnet-beta.solana.com that every tutorial pastes, with the same rules as the 20 EVM chains in the cluster: one identical probe (getSlot at the processed commitment) every 60 seconds from us-east, eu-west and Singapore, stale-slot detection against the cross-provider tip, and result classification so a fast error never ranks as a fast answer. The candidates that failed the keyless audit are listed with their exact refusals: dRPC moved Solana to paid tiers, Ankr returns 403 without a key, OnFinality's shared public quota is permanently exhausted.

abstract: |
  Solana: {{count}} free public RPC endpoints answering `getSlot` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}. The same page carries the private cohort (API key), Alchemy, Chainstack and QuickNode on their keyed Solana endpoints every 120 seconds: switch the Access selector; {{best_name:tier:keyed}} leads it at {{best_p50:tier:keyed}}.
  We measure round-trip latency of a single identical JSON-RPC call (getSlot at the processed commitment) against every no-key public Solana endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore. Responses are classified (ok / http_err / jsonrpc_err / stale / timeout) with staleness measured in slots against the cross-provider tip. The archive-depth audit run on EVM chains has no keyless Solana equivalent and is not performed. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Solana-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"getSlot\",\"params\":[{\"commitment\":\"processed\"}]}`. Plain HTTP POST, identical for every endpoint, no API key in any request; the rotating id defeats body-keyed edge caches."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Solana-scoped view of the same harness, with the same exclusion rules."
  - "No archive-depth audit on Solana: the EVM chains probe `eth_getBalance` at historical heights, which has no equivalent on public Solana endpoints. Disclosed rather than faked."
  - "LeoRPC disclosure: the endpoint uses a publicly documented FREE query key (solana.leorpc.com/?api_key=FREE). It is admitted as keyless in practice since no signup is required; flagged here for transparency."
  - "Chain scope: every query on this page is pinned to chain=\"solana\". Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. Excluded with verified refusals 2026-07-12: dRPC (Solana is paid-tier only), Ankr (403 key required), OnFinality (shared quota permanently 429), BlockPI (no public URL), Triton free.rpcpool.com (403), Blast API + ExtrNode + AllThatNode (DNS dead), OMNIA (521), Helius + Shyft + BlockEden (key-gated)."
  - "Private cohort (Access selector, Private): Alchemy, Chainstack and QuickNode probed on their keyed Solana endpoints every 120 seconds from the same 3 regions, same call (getSlot, rotating id), same ok / http_err / jsonrpc_err / stale / timeout classification."
  - "Keys live in the probe environment, never in the repo. Plan tiers, disclosed: Alchemy: a Free plan key (30M CU per month, 25 requests per second) normal signup, the tier any reader gets; Alchemy states free and paid keys share one routing; Chainstack: a Global Node on the Growth plan, sponsored by Chainstack; QuickNode: an endpoint on the Mobula enterprise-tier account, shared fleet. GetBlock is listed under exclusions until a key exists."
  - "Two cohorts, two rankings: the public endpoints are shared, rate-limited gateways probed every 60 seconds; the keyed endpoints are metered or dedicated and probed every 120 seconds. The selector switches the whole page (ranking, chart, region tabs, badges, citation) between them. No figure on this page compares a public endpoint with a keyed one."

excluded_providers:
  - { name: dRPC, reason: "Solana moved to paid tiers, no keyless endpoint" }
  - { name: Ankr, reason: "returns 403 without an API key" }
  - { name: OnFinality, reason: "shared public quota permanently exhausted" }
  - { name: Helius, reason: "requires an API key; no key held yet, so it is not in the private cohort either" }
  - { name: GetBlock, reason: "requires an API key; no key held yet, so it is not in the private cohort either" }

faq:
  - q: "Which Solana RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today; each is listed with its URL, 24h median and success rate in the endpoints table on this page, and the list changes as providers come and go."
  - q: "Is api.mainnet-beta.solana.com good enough for production?"
    a: "For development, demos and light read workloads, yes: Solana Labs documents roughly 100 requests per 10 seconds per IP. For production trading, indexing or anything latency-sensitive, dedicated providers exist for a reason; this page measures the free tier so you know exactly what the default gets you before you decide."
  - q: "Why is there no archive-depth column like the EVM pages?"
    a: "The EVM cluster probes eth_getBalance at historical block heights to expose which free endpoints serve archive state. Public Solana endpoints expose no comparable keyless historical-state query, so the audit is disclosed as not applicable rather than approximated."
  - q: "Which Solana RPC provider is fastest with an API key?"
    a: "Per the live data: {{best_name:tier:keyed}} at {{best_p50:tier:keyed}} (getSlot p50 over 24h, averaged across us-east, eu-west and Singapore); Alchemy measures {{p50:alchemy}}, Chainstack {{p50:chainstack}} and QuickNode {{p50:quicknode}}. On the free cohort {{best_name}} leads at {{best_p50}}, measured on the same call from the same three regions; the two cohorts are never ranked in one table (shared gateways at 60 s against metered endpoints at 120 s). Switch the Access selector to Private for the region tabs and the p99 column; plan tiers are disclosed in the methodology."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="solana"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }
  # Access tier: partitions the provider list (no PromQL label). The
  # first value is the headline cohort; ?tier=keyed reaches the other.
  tier:
    - { value: public, label: "Public, no key" }
    - { value: keyed,  label: "Private, API key" }

providers:
  - slug: solana
    name: Solana Labs
    endpoint: https://api.mainnet-beta.solana.com
    tag: Chain-official api.mainnet-beta.solana.com, 100 req per 10s documented
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `getSlot` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to api.mainnet-beta.solana.com."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="solana", chain="solana"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="solana", chain="solana"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="solana", chain="solana"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="solana", chain="solana"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="solana", chain="solana"}) / sum(ocb:rpc_call:rate_24h{provider="solana", chain="solana"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="solana", chain="solana"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="solana", chain="solana"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="solana", chain="solana", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="solana", chain="solana", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="solana", chain="solana", region="eu-west"})
