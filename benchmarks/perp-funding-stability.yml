providers:
  - slug: hyperliquid
    name: Hyperliquid
    tag: Onchain order book perps, funding settled hourly
    formula: "stddev_over_time of perp_funding_hold_24h_bps{venue=\"hyperliquid\",asset=\"ETH\"} over a 24h window. p90/p99 columns reuse the same query on BTC and SOL to stay within the standard provider shape."
    queries:
      p50: stddev_over_time(perp_funding_hold_24h_bps{venue="hyperliquid",asset="ETH"}[24h])
      p90: stddev_over_time(perp_funding_hold_24h_bps{venue="hyperliquid",asset="BTC"}[24h])
      p99: stddev_over_time(perp_funding_hold_24h_bps{venue="hyperliquid",asset="SOL"}[24h])
      mean: stddev_over_time(perp_funding_hold_24h_bps{venue="hyperliquid",asset="ETH"}[24h])
      success: (perp_funding_venue_ok_unix{venue="hyperliquid"} > bool (time() - 300))
      sample_size: count_over_time(perp_funding_hold_24h_bps{venue="hyperliquid",asset="ETH"}[24h])
      series: stddev_over_time(perp_funding_hold_24h_bps{venue="hyperliquid",asset="ETH"}[24h])

