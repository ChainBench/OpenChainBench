# OpenChainBench. Bench № 043

slug: perp-funding-stability
number: "043"
title: Perp DEX funding stability, 24h stddev of ETH funding ranked
seo_title: "Perp DEX funding stability 2026: ETH funding stddev across 7 venues ranked"
seo_description: "Live 24h standard deviation of ETH perpetual futures funding rate in bps across 7 major venues (Hyperliquid, Binance, Bybit, OKX, dYdX v4, Paradex, Aster). Lower means more stable funding for carry traders."
subtitle: 24h standard deviation of ETH funding rate, in basis points per 24h, across the perp-funding cohort. Lower means funding stays in a tight band, the carry trader's preferred signal.
category: Trading
status: live
metric: 24h ETH funding stddev
unit: bps
higher_is_better: false

disclaimer: |
  Stability is not directionality. A venue with persistently positive but tight-banded funding ranks better here than one that flips between positive and negative every settlement, even if the second venue offers better average carry. Read alongside perp-funding for direction and average level.

seo_intro: |
  This benchmark ranks perp venues by how tightly their ETH funding
  rate clusters over the trailing 7 days. Average funding tells you
  which side gets paid; stability tells you how reliably. A venue
  whose 24h hold cost wanders 15 bps in a week is harder to carry
  trade than one that holds within 3 bps even if both average the
  same number. The bench reads the same normalized series as
  perp-funding (per-venue hold cost in bps per 24h) and exposes
  stddev_over_time of that series on a 24 hour window for ETH.
  Cohort is the 7 venues with documented interval semantics:
  Hyperliquid, Binance, Bybit, OKX, dYdX v4, Paradex, Aster. Lower
  is better.

abstract: |
  The bench reuses the normalized 24h ETH funding series from
  perp-funding (bench № 036). For each venue it publishes the 7 day
  rolling standard deviation of the ETH hold-24h gauge, in bps. Sign
  is preserved on the underlying series; the ranking metric is the
  magnitude of the swing, not its direction. Lower means the venue's
  funding stayed in a tight band, the cleanest signal for funding-rate
  arbitrage and basis trades. Cadence and freshness inherit from the
  upstream funding scrape (60 second poll, 30 second Prom scrape).

methodology:
  - "Source. Same upstream as perp-funding: each venue's public funding endpoint polled every 60 seconds, normalized to bps per hour and per 24h hold, sign preserved."
  - "Metric. stddev_over_time(perp_funding_hold_24h_bps{asset=\"ETH\"}[24h]) per venue. The 7d window smooths intraday noise but reacts to regime shifts within a week."
  - "Sign handling. The underlying series is signed (positive means longs pay). Stability measures the swing, so the ranking uses the unsigned stddev. Average direction and level are the perp-funding bench."
  - "Cohort. 7 venues from the perp-funding bench: Hyperliquid (onchain), Binance, Bybit, OKX, dYdX v4 (Cosmos appchain), Paradex (Starknet L2), Aster (BNB Chain). All publish documented funding intervals."
  - "Cadence. The upstream funding harness polls every 60 seconds; Prometheus scrapes every 30 seconds. The 7 day stddev refreshes on every scrape."
  - "Failures. A venue whose upstream funding feed errors keeps its last gauge value; the leaderboard tags the row stale once the success gauge drops to 0."
  - "Reproducibility. The harness emits perp_funding_hold_24h_bps with labels venue and asset; the bench query is the stddev over 7d on that series with asset=ETH pinned."

findings:
  - "{{best_name}} currently has the tightest ETH funding band at {{best_p50}} stddev (24h)."
  - "{{name:hyperliquid}} sits at {{p50:hyperliquid}} stddev (24h) on ETH. Hourly settlement means rapid reaction to skew but tight clustering once the book is calm."
  - "{{name:binance}} sits at {{p50:binance}} stddev (24h). Deepest book in the field anchors the rate."
  - "Outliers on this bench are the venues to watch for funding arbitrage: a wider band means larger spreads to harvest against the cohort median."

source: https://github.com/ChainBench/OpenChainBench/tree/main/benchmarks/perp-funding-stability.yml

prometheus:
  window: 24h
  expected_freshness_seconds: 3600

faq:
  - q: "What does funding stability measure?"
    a: "It is the 24 hour standard deviation of each venue's ETH funding rate, expressed in basis points per 24 hour hold. The metric measures how tightly funding clusters around its own 7 day mean, ignoring whether the rate sits positive or negative. A low value means traders carrying a position on that venue paid (or received) a predictable number every settlement; a high value means the rate swung a lot over the week."
  - q: "Why is lower better?"
    a: "Carry trades, basis trades and funding-rate arbitrage all assume the rate behaves predictably over the holding window. A venue with a noisy funding curve forces wider stop-losses and reduces the achievable Sharpe even when the average rate looks attractive. Stability is the second-order property that turns an average rate into a trade you can size."
  - q: "How does this differ from perp-funding (bench 036)?"
    a: "perp-funding ranks venues by the current normalized 24h funding cost on ETH; it answers 'who is cheapest to hold right now'. perp-funding-stability ranks venues by the 24 hour standard deviation of that same series; it answers 'whose rate is most predictable'. The two are complementary: a cheap-but-noisy venue is still risky to carry; a stable-but-expensive venue is honest about its cost."
  - q: "Why ETH only?"
    a: "ETH is the deepest contract on every venue in the cohort, so the funding series has the strongest signal-to-noise ratio for cross-venue comparison. BTC and SOL are also published by the upstream harness as gauges; future revisions of this bench may expand the dimension."
  - q: "How fresh are the numbers?"
    a: "The upstream funding gauge is scraped every 30 seconds. The stddev refreshes on every Prom evaluation, so the leaderboard reflects the most recent 24 hour window minus at most 30 seconds of lag."

dimensions: {}

providers:
  - slug: hyperliquid
    name: Hyperliquid
    tag: Onchain order book perps, funding settled hourly
    formula: "stddev_over_time of perp_funding_hold_24h_bps{venue=\"hyperliquid\",asset=\"ETH\"} over a 7d window."
    queries:
      p50: stddev_over_time(perp_funding_hold_24h_bps{venue="hyperliquid",asset="ETH"}[24h])
      mean: stddev_over_time(perp_funding_hold_24h_bps{venue="hyperliquid",asset="ETH"}[24h])
      success: clamp_max(count_over_time(perp_funding_hold_24h_bps{venue="hyperliquid",asset="ETH"}[1h]), 1)
      sample_size: count_over_time(perp_funding_hold_24h_bps{venue="hyperliquid",asset="ETH"}[24h])
      series: stddev_over_time(perp_funding_hold_24h_bps{venue="hyperliquid",asset="ETH"}[24h])

