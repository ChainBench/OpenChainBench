prometheus:
  window: 24h

# Real metrics emitted by the token-unlocks harness:
#   ocb_unlock_upcoming_pct_supply{token, unlock_date, allocation_type}   gauge (% circulating)
#   ocb_unlock_upcoming_value_usd{token, unlock_date}                     gauge (USD at spot)
#   ocb_unlock_expected_impact_pct{token, unlock_date, window="J+30"}     gauge (% — conditional median)
#   ocb_unlock_historical_impact_pct{token, unlock_date, window}          gauge
#   ocb_unlock_historical_samples{bucket}                                 gauge (sample count per bucket)
#   ocb_unlock_tokens_tracked                                             gauge
#   ocb_unlock_source_freshness_seconds                                   gauge
#   ocb_unlock_scrape_errors_total{source}                                counter
#   ocb_unlock_buildid_rotations_total                                    counter
#
# Each "provider" below is one major token in the curated whitelist.
# The leaderboard ranks tokens by aggregate upcoming pressure over J+0..J+90
# (sum of % supply unlocked in the window). higher_is_better: true is set
# because the leaderboard sorts by the prediction (less-negative median is
# "better" from a holder's perspective — smaller historical drawdown for the
# unlock size); the headline metric is the conditional median impact at J+30
# in the matching bucket. p50/p90/p99 columns mirror the same gauge (single
# scalar per token, not a statistical distribution) for renderer consistency.

providers:
  - slug: arb
    name: ARB
    tag: Arbitrum, monthly investor + team unlocks, known v1 expected-impact gap
    queries:
      p50: max(ocb_unlock_expected_impact_pct{token="ARB"})
      p90: max(ocb_unlock_expected_impact_pct{token="ARB"})
      p99: max(ocb_unlock_expected_impact_pct{token="ARB"})
      mean: avg(ocb_unlock_expected_impact_pct{token="ARB"})
      success: clamp_max(count(ocb_unlock_upcoming_pct_supply{token="ARB"}) / 4, 1)
      sample_size: sum(ocb_unlock_upcoming_pct_supply{token="ARB"})
      series: max(ocb_unlock_upcoming_pct_supply{token="ARB"}) by (unlock_date)

