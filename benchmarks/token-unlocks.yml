# The full universe is wider than the 10 majors listed above (53 distinct
# tokens currently emitting upcoming-supply rows, capped at 200 by
# UNLOCK_PRIORITY_CAP). The page renders the leaderboard as a sortable
# table of every token with at least one upcoming unlock in the J+0..J+90
# window — the providers list above pins the editorial picks for the
# narrative columns and per-token sparklines.
