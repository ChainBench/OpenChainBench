# OpenChainBench. Bench № 149

slug: b2-rpc
number: "149"
title: Fastest free B² Network RPC, live no-key endpoint latency
seo_title: "Fastest free B² Network RPC 2026"
seo_description: "{{best_name}} leads free B² Network RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public B² Network RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  B² Network is a Bitcoin L2 combining ZK proof verification with a Rollup+Restaking hybrid model (chain 223), using BTC as the gas token. The official endpoint (`rpc.bsquared.network`) is operated by the B² team, with dRPC and Thirdweb providing additional keyless alternatives probed every 60 seconds from three regions.

abstract: |
  b2: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:b2-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public B² Network endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the B² Network-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the B² Network-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"b2\"`. Provider coverage today: {{count}} no-key endpoints (B² Official, dRPC, Thirdweb)."


source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="b2"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: b2-official
    name: B² Network Official
    endpoint: https://rpc.bsquared.network
    tag: B² team-operated public RPC for B² Network mainnet
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to B² Official's no-key B² Network endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="b2-official", chain="b2"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="b2-official", chain="b2"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="b2-official", chain="b2"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="b2-official", chain="b2"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="b2-official", chain="b2"}) / sum(ocb:rpc_call:rate_24h{provider="b2-official", chain="b2"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="b2-official", chain="b2"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="b2-official", chain="b2"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="b2-official", chain="b2", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="b2-official", chain="b2", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="b2-official", chain="b2", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="b2-official", chain="b2", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="b2-official", chain="b2", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="b2-official", chain="b2", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    endpoint: https://b2-mainnet.drpc.org
    tag: Decentralized RPC mesh, consensus-checked
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to dRPC's no-key B² Network endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="b2"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="b2"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="b2"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="b2"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="b2"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="b2"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="b2"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="b2"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="b2", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="b2", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="b2", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="b2", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="b2", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="b2", region="sgp"}[1h])

  - slug: thirdweb
    name: Thirdweb
    endpoint: https://223.rpc.thirdweb.com
    tag: Multi-chain RPC gateway, 1000+ chains via chain ID routing
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Thirdweb's no-key B² Network endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="b2"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="thirdweb", chain="b2"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="thirdweb", chain="b2"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="thirdweb", chain="b2"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="thirdweb", chain="b2"}) / sum(ocb:rpc_call:rate_24h{provider="thirdweb", chain="b2"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="thirdweb", chain="b2"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="b2"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="b2", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="b2", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="b2", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="b2", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="b2", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="b2", region="sgp"}[1h])
