# OpenChainBench. Bench № 149

slug: b2-rpc
number: "149"
title: Fastest free B² Network RPC, live no-key endpoint latency
seo_title: "Fastest free B² Network RPC 2026"
seo_description: "{{best_name}} leads free B² Network RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). 3 no-key providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public B² Network RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  B² Network is a Bitcoin L2 combining ZK proof verification with a Rollup+Restaking hybrid model (chain 223), using BTC as the gas token. The official endpoint (`rpc.bsquared.network`) is operated by the B² team, with dRPC and Thirdweb providing additional keyless alternatives probed every 60 seconds from three regions.

abstract: |
  Per-chain member of the RPC latency cluster, extended to B² Network.
  We measure the round-trip latency of a single, identical RPC call
  (`eth_getBlockByNumber`) against every no-key public B² Network endpoint
  that sustains continuous probing, 3 providers at launch,
  every 60 seconds, from us-east, eu-west and Singapore. The harness
  classifies every response (ok / http_err / jsonrpc_err / stale /
  timeout) so the leaderboard rewards sustained availability rather than
  fast error messages. The cross-chain view lives on the parent
  `rpc-capabilities` benchmark; this page is the B² Network-scoped answer
  with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms → 10 s), so percentiles are computed via Prometheus `quantile_over_time` over the last 24 hours."
  - "Call-result classification: `ok` (HTTP 200 + non-empty result), `http_err`, `jsonrpc_err` (HTTP 200 carrying an error body), `stale` (more than 20 blocks behind the cross-provider tip), `timeout`."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities) benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to `chain=\"b2\"`. Provider coverage at launch: 3 no-key endpoints (B² Official, dRPC, Thirdweb)."

findings:
  - "{{best_name}} currently leads free B² Network RPC at {{best_p50}} (`eth_getBlockByNumber` p50, 24h) across 3 measured providers."

faq:
  - q: "What is the fastest free B² Network RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber` p50 over the last 24h), measured against 3 no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which B² Network RPCs work without an API key?"
    a: "3 endpoints sustain continuous keyless probing at launch: B² Official, dRPC, Thirdweb. Every listed endpoint was live-verified before inclusion."
  - q: "Does the fastest B² Network RPC change by region?"
    a: "Often. The region tabs at the top of the page re-scope every number to a single origin; pick the one closest to where your requests originate."
  - q: "How is B² Network RPC latency measured here?"
    a: "One identical JSON-RPC POST (`eth_getBlockByNumber`) every 60 seconds against each provider from each of 3 regions. Responses are classified so an endpoint stuck on an old head or returning errors is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="b2"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: b2-official
    name: B² Network Official
    tag: B² team-operated public RPC for B² Network mainnet
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to B² Official's no-key B² Network endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="b2-official", chain="b2"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="b2-official", chain="b2"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="b2-official", chain="b2"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="b2-official", chain="b2"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="b2-official", chain="b2"}) / sum(ocb:rpc_call:rate_24h{provider="b2-official", chain="b2"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="b2-official", chain="b2"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="b2-official", chain="b2"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="b2-official", chain="b2", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="b2-official", chain="b2", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="b2-official", chain="b2", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="b2-official", chain="b2", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="b2-official", chain="b2", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="b2-official", chain="b2", region="sgp"}[1h])

