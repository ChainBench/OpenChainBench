# OpenChainBench. Bench No 220

slug: multiversx-rpc
number: "220"
title: Fastest free MultiversX RPC, live no-key endpoint latency
seo_title: "Fastest free MultiversX RPC 2026"
seo_description: "{{best_name}} leads free MultiversX RPC at {{best_p50}} (metachain erd_nonce p50, 24h). 3 providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for GET /network/status/4294967295 (metachain nonce) against every available public MultiversX node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  MultiversX (formerly Elrond) is a proof-of-stake L1 blockchain using Secure Proof of Stake (SPoS) with adaptive state sharding, supporting up to 15,000 TPS per shard. The metachain coordinates shard consensus and commits a nonce (block height) approximately every 6 seconds with immediate finality. Public gateway endpoints are available without an API key from the MultiversX Foundation (gateway.multiversx.com and api.multiversx.com) and via the legacy Elrond API domain (api.elrond.com, maintained as an alias). Every provider was live-verified with consecutive metachain status probes at launch.

abstract: |
  Per-chain member of the RPC latency cluster, extended to MultiversX.
  We measure the round-trip latency of a single REST GET to
  /network/status/4294967295 (metachain) against every available public
  MultiversX node that sustains continuous probing: 3 providers at launch,
  every 60 seconds, from us-east, eu-west and Singapore. The harness
  classifies every response (ok / http_err / stale / timeout) with a
  MultiversX-scaled staleness gap (50 nonces, around 5 min at 6 s/nonce).
  The cross-chain view lives on the parent rpc-capabilities benchmark;
  this page is the MultiversX-scoped answer with per-region breakdowns
  as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: HTTP GET to <base>/network/status/4294967295 with Accept: application/json. The shard ID 4294967295 (0xFFFFFFFF) is the MultiversX metachain identifier. The response carries data.status.erd_nonce as a decimal uint64."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms to 10 s), so percentiles are computed via Prometheus quantile_over_time over the last 24 hours."
  - "Call-result classification: ok (HTTP 200 + parsable erd_nonce), http_err, stale (nonce more than 50 behind the cross-provider tip), timeout. Latency without reliability is a misleading ranking signal."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain rpc-capabilities benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to chain=multiversx. Provider coverage at launch: 3 endpoints (MultiversX Gateway, MultiversX API, Elrond API)."

findings:
  - "{{best_name}} currently leads MultiversX RPC at {{best_p50}} (metachain erd_nonce p50, 24h) across 3 measured providers."

faq:
  - q: "What is the fastest free MultiversX RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (MultiversX metachain nonce p50 over the last 24h), measured against 3 providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which MultiversX RPC endpoints work without an API key?"
    a: "3 endpoints sustain continuous keyless probing at launch: the MultiversX Gateway (gateway.multiversx.com), the MultiversX API (api.multiversx.com), and the Elrond legacy API (api.elrond.com, maintained as a public alias by the MultiversX team). Every listed endpoint was live-verified with a GET /network/status/4294967295 returning a parsable erd_nonce before inclusion."
  - q: "Does the fastest MultiversX RPC change by region?"
    a: "Often. Public infra concentrates in specific regions; a gateway that wins from Amsterdam can lose from Singapore by multiples. The region tabs at the top of the page re-scope every number to a single origin."
  - q: "How is MultiversX RPC latency measured here, technically?"
    a: "One GET /network/status/4294967295 REST call every 60 seconds against each provider from each of 3 regions. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus quantile_over_time over 24 hours. Best-effort measurements; p50 is the median, p90 the 90th percentile and p99 the 99th percentile of latency samples collected over the last 24 hours."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="multiversx"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: mvx-gateway
    name: MultiversX Gateway
    tag: MultiversX Foundation official gateway, public REST endpoint, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /network/status/4294967295 sent every 60s from 3 regions to gateway.multiversx.com."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="mvx-gateway", chain="multiversx"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="mvx-gateway", chain="multiversx"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="mvx-gateway", chain="multiversx"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="mvx-gateway", chain="multiversx"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="mvx-gateway", chain="multiversx"}) / sum(ocb:rpc_call:rate_24h{provider="mvx-gateway", chain="multiversx"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="mvx-gateway", chain="multiversx"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="mvx-gateway", chain="multiversx"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="mvx-gateway", chain="multiversx", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="mvx-gateway", chain="multiversx", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="mvx-gateway", chain="multiversx", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="mvx-gateway", chain="multiversx", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="mvx-gateway", chain="multiversx", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="mvx-gateway", chain="multiversx", region="sgp"}[1h])

  - slug: mvx-api
    name: MultiversX API
    tag: MultiversX Foundation official API endpoint, public REST, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /network/status/4294967295 sent every 60s from 3 regions to api.multiversx.com."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="mvx-api", chain="multiversx"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="mvx-api", chain="multiversx"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="mvx-api", chain="multiversx"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="mvx-api", chain="multiversx"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="mvx-api", chain="multiversx"}) / sum(ocb:rpc_call:rate_24h{provider="mvx-api", chain="multiversx"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="mvx-api", chain="multiversx"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="mvx-api", chain="multiversx"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="mvx-api", chain="multiversx", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="mvx-api", chain="multiversx", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="mvx-api", chain="multiversx", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="mvx-api", chain="multiversx", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="mvx-api", chain="multiversx", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="mvx-api", chain="multiversx", region="sgp"}[1h])

  - slug: elrond
    name: Elrond API
    tag: MultiversX legacy Elrond domain (api.elrond.com), public REST, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /network/status/4294967295 sent every 60s from 3 regions to api.elrond.com."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="elrond", chain="multiversx"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="elrond", chain="multiversx"})
