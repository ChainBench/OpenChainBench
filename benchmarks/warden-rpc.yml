# OpenChainBench. Bench № 197

slug: warden-rpc
number: "197"
title: Fastest free Warden Protocol RPC, live no-key endpoint latency
seo_title: "Fastest free Warden Protocol RPC 2026"
seo_description: "{{best_name}} leads free Warden Protocol RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Warden Protocol EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Warden Protocol is a modular intent-based L1 for cross-chain smart contract security, built by the Qredo team with WARD as the native gas token. EVM-compatible with Cosmos SDK internals, enabling omnichain key management and intent execution via SpaceWard. {{count}} keyless EVM endpoints are probed continuously: PublicNode (warden-evm-rpc.publicnode.com) and the Warden Foundation official endpoint (evm.wardenprotocol.org).

abstract: |
  Warden Protocol: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:warden-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Warden EVM endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Warden-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Warden Protocol-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"warden\"`. Provider coverage at launch: {{count}} no-key endpoints."

faq:
  - q: "What is the fastest free Warden Protocol RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber` p50 over the last 24h), measured against {{count}} no-key providers probed every 60 seconds from us-east, eu-west and Singapore."
  - q: "Which Warden Protocol RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing, each listed with its URL in the endpoints table above."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="warden"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://warden-evm-rpc.publicnode.com
    tag: PublicNode multi-chain gateway for Warden EVM
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions to PublicNode's no-key Warden endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="warden"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="warden"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="warden"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="warden"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="warden"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="warden"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="warden"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="warden"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="warden", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="warden", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="warden", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="warden", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="warden", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="warden", region="sgp"}[1h])

  - slug: warden-official
    name: Warden Foundation
    endpoint: https://evm.wardenprotocol.org
    tag: Warden Foundation official public EVM RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions to the Warden Foundation's no-key endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="warden-official", chain="warden"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="warden-official", chain="warden"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="warden-official", chain="warden"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="warden-official", chain="warden"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="warden-official", chain="warden"}) / sum(ocb:rpc_call:rate_24h{provider="warden-official", chain="warden"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="warden-official", chain="warden"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="warden-official", chain="warden"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="warden-official", chain="warden", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="warden-official", chain="warden", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="warden-official", chain="warden", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="warden-official", chain="warden", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="warden-official", chain="warden", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="warden-official", chain="warden", region="sgp"}[1h])
