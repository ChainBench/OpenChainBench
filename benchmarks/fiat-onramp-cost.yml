providers:
  - slug: moonpay
    name: MoonPay
    tag: Direct on-ramp, card and SEPA, pricing by request IP
    type: protocol
    formula: "24h median of the all-in premium over Kraken EUR mid on the headline cell (USDC, SEPA, 500 EUR, France), quoted directly through MoonPay's own API."
    queries:
      p50: quantile_over_time(0.50, onramp_quote_all_in_premium_bps{provider="moonpay",via="direct",asset="usdc",network=~"base|arbitrum",payment_method="sepa",notional="500",fiat="EUR",country="FR",region="eu-west",spot_ref="kraken_eur"}[24h])
      p90: quantile_over_time(0.90, onramp_quote_all_in_premium_bps{provider="moonpay",via="direct",asset="usdc",network=~"base|arbitrum",payment_method="sepa",notional="500",fiat="EUR",country="FR",region="eu-west",spot_ref="kraken_eur"}[24h])
