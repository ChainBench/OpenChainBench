# OpenChainBench. Bench № 076

slug: tokenized-stock-peg
number: "076"
title: Tokenized stock price accuracy, live onchain vs Nasdaq across 6 equities
seo_title: "Tokenized stock price vs Nasdaq 2026: {{best_name}} closest, {{best_p50}}"
seo_description: "{{ranked_count}} Robinhood Chain tokenized stocks against the real share price, regular hours, last 5 sessions: {{best_name}} closest at {{best_p50}}, {{worst_name}} furthest at {{worst_p50}}."
subtitle: "Absolute deviation between each tokenized equity's Uniswap v4 pool price on Robinhood Chain and its real market reference price, in basis points, labeled by market session. A live, keyless measurement of whether onchain stocks track their underlying."

category: RWA
status: live
metric: Price deviation
unit: bp
row_noun: { one: tokenized stock, many: tokenized stocks }
higher_is_better: false

seo_intro: |
  Robinhood Chain tokenizes ~95 equities, and its Uniswap v4 pools trade
  them 24/7 while the Nasdaq closes every evening and every weekend.
  This page answers the question that setup begs: how far does the
  onchain price drift from the real one. Every 60 seconds we read each
  pool's spot price straight from the chain (StateView getSlot0, keyless)
  and compare it to the live reference price, labeling every sample with
  the market session it was taken in (pre, regular, post, closed). The
  regular-hours deviation is the headline ranking; the closed-state
  series is the weekend drift, one value per weekend: what AAPL is worth
  onchain on a Saturday when no market maker has a reference to arb
  against. Of the ~95 tokenized equities only 14 have pools with real
  liquidity; we measure the 6 whose pool still trades against the
  market (GOOGL, TSLA, MSFT, AMZN and SPY pools froze at their last
  swap and were dropped, see the methodology). SpaceX trades
  onchain too, but SpaceX is not listed anywhere, so there is no
  reference price to measure against, which says something about
  tokenized private equity all by itself.

abstract: |
  Every 60 seconds the harness reads the Uniswap v4 spot price of 6
  tokenized equities on Robinhood Chain (one batched eth_call to the
  StateView contract, keyless) and fetches the reference equity price
  from Yahoo Finance (one batched spark call). Deviation is
  10000 x |pool - reference| / reference, in basis points, published
  with a market_state label derived from Yahoo's holiday-aware session
  windows. No API keys, no transactions, both legs reproducible from
  public endpoints.

methodology:
  - "Onchain leg: one JSON-RPC batch per tick to StateView (0xF3334192D15450CdD385c8B70e03f9A6bD9E673b) getSlot0(poolId) on the Uniswap v4 PoolManager singleton, keyless against the official Robinhood Chain RPC. sqrtPriceX96 converts to USDG per share with the per-pool currency ordering and the USDG 6 vs stock 18 decimal gap (factor 1e12)."
  - "Reference leg: Yahoo Finance v8 spark batch, one call for all 6 symbols per tick, browser User-Agent, no key. regularMarketPrice doubles as the last-close reference when the market is closed, which is exactly the weekend baseline."
  - "Market session labels: derived from Yahoo currentTradingPeriod epochs (pre / regular / post / closed), which Yahoo publishes holiday-aware, so the harness maintains no NYSE calendar. The headline ranking pins market_state=\"regular\" over the last five sessions (a 24h window holds no session on a weekend and, with the gauge kept between sessions, held one frozen tick as its median until 2026-09-23); the closed series feeds the weekend-drift bench."
  - "Deviation: 10000 x |pool_price - reference_price| / reference_price, sampled every 60 seconds, quantiles over 24h via quantile_over_time."
  - "Cohort: the 6 official tokenized equities (name pattern <Company> * Robinhood Token, shared verified Stock implementation) whose USDG pool still shows arbitrage activity: NVDA, AAPL, PLTR, META, AMD, MU. GOOGL, TSLA, MSFT, AMZN and SPY were measured until their pools froze at the last swap price (no swaps for days while the reference moved), which is a dead pool, not a peg; they return when swap volume does. Pool fee tiers: 0.3% on NVDA and META, 1% on AAPL, PLTR, AMD and MU."
  - "Excluded, with reasons: SPCX (SpaceX pool holds ~$196k but SpaceX is not listed, no reference price exists), SNDK and QQQ (pool depth under $2k, deviation would be noise), CRCL (pool at zero liquidity), ~80 other official tokens (issuer-seeded placeholder pools at 90-95% fee, zero swaps), HOOD (never issued onchain, all HOOD tokens on the chain are third-party spam)."
  - "Thin liquidity is part of the story, not a defect: pool depths ran $24k to $330k when last read (2026-07-13), so a single mid-size swap can move the onchain price meaningfully off the reference until arbitrage closes it. The bench measures the size of that gap in regular hours, not the speed of its closure (the arbitrage-latency tracker was retired)."
  - "Reading grid: an AMM price can sit anywhere inside the pool's fee band without creating an arbitrage opportunity, so a 1% fee pool resting 80 bps off its reference is economically at equilibrium, not broken. Cross-symbol ranking therefore partly reflects each pool's fee tier (disclosed in every tag); the within-symbol trend over time is the purest signal."
  - "Quote-asset caveat: pool prices are denominated in USDG and compared against USD references. A USDG peg wobble would appear as a correlated deviation across all six symbols simultaneously, which is the signature to check before reading a broad move as tracking error."
  - "Caveats: the issuer can pause or blocklist a token (a failed read deletes that asset's deviation gauge on the spot rather than freezing it, and the freshness stamp tsp_last_success_timestamp_seconds stops advancing), and the Stock contract carries a split multiplier; a corporate action can look like a one-day deviation spike until reconciled."

findings:
  - "{{best_name}} tracks its reference tightest at {{best_p50}} (p50, last 5 sessions) across {{count}} measured tokenized equities."
  - "{{name:aapl}} deviates {{p50:aapl}} (p50, last 5 sessions) in what was the deepest tokenized-stock pool on the chain when depth was last read (about $330k on 2026-07-13), alongside {{name:nvda}} ({{p50:nvda}}, about $290k then)."
  - "{{name:nvda}} ({{p50:nvda}}) and {{name:aapl}} ({{p50:aapl}}) have the most active pools of the cohort by swap count, which is what keeps an AMM price honest between arbitrage passes."
  - "The spread between the regular-hours deviation and the closed-market drift is the number this pair of benches exists for: pools keep trading nights and weekends with no reference to arb against, and the drift until Monday open is measured on the companion bench tokenized-stock-weekend-drift."
  - "Of the ~95 equities Robinhood tokenized, only 14 have a pool anyone actually trades. The other 80 sit in issuer-seeded placeholder pools at 90-95% fees with zero swaps. Tokenization is easy; markets are hard."

faq:
  - q: "Do tokenized stocks track their real market price?"
    a: "During regular Nasdaq hours, mostly yes: arbitrageurs keep the Uniswap v4 pools within tens of basis points of the reference on the liquid names, and this page shows the live per-symbol number. Outside market hours the pools keep trading with no live reference; those samples are labelled and exported but not ranked here, and the weekend's maximum drift per stock is published on tokenized-stock-weekend-drift."
  - q: "What happens to tokenized stock prices on weekends?"
    a: "The pools trade continuously, so the onchain price becomes pure supply and demand against the Friday close. The harness samples that drift every minute all weekend and the companion bench tokenized-stock-weekend-drift publishes the maximum per symbol; this page ranks regular hours only. Monday pre-market is compared against the previous close (the reference feed carries no pre-market print), so the snap-back shows up in the first regular session."
  - q: "Why only 6 stocks when Robinhood tokenized about 95?"
    a: "Because only 14 of the 95 have a USDG pool with real liquidity and swap activity, 3 of those are unmeasurable (SpaceX has no listed reference price, SNDK and QQQ hold under $2k of depth), and 5 more (GOOGL, TSLA, MSFT, AMZN, SPY) froze at their last swap price for days on end, a dead pool rather than a tracking error, so they left the cohort until they trade again. The other 80 tokens sit in placeholder pools at 90-95% fees that nobody has ever traded. The gap between tokens issued and markets that exist is one of this page's findings."
  - q: "How is the onchain price read?"
    a: "One batched keyless eth_call per minute to the StateView contract of the Uniswap v4 singleton on Robinhood Chain, decoding sqrtPriceX96 from getSlot0 for each pool and converting with the pool's currency ordering and the 6-vs-18 decimals gap. No indexer, no API key, reproducible with curl."
  - q: "Where does the reference price come from?"
    a: "Yahoo Finance's public chart API, one batched call per minute with the session windows read from currentTradingPeriod, which is holiday-aware. When the market is closed the reference is the last regular close, which is exactly the baseline the weekend drift should be measured against."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/tokenized-stock-peg

prometheus:
  window: 7d
  freshness_timestamp_metric: tsp_last_success_timestamp_seconds

# Metrics emitted by the tokenized-stock-peg harness:
#   tsp_deviation_bps{asset, market_state}  gauge, abs deviation in bps
#   tsp_price_onchain_usdg{asset}           gauge, v4 pool spot
#   tsp_price_reference_usd{asset}          gauge, yahoo reference
#   tsp_reference_age_seconds{asset}        gauge
#   tsp_market_session{market_state}        gauge, active session flag
#   tsp_health{asset}                       gauge
#   tsp_source_call_total{source, result}   counter
#   tsp_source_latency_milliseconds{source} gauge

providers:
  - slug: nvda
    name: NVDA
    tag: "Nvidia, ~$290k pool depth, 0.3% fee"
    formula: "Median over the last five regular sessions (7d, session-gated) of the absolute deviation (bps) between the NVDA Uniswap v4 pool price on Robinhood Chain and the Yahoo reference, regular market hours only."
    queries:
      p50: quantile_over_time(0.50, (tsp_deviation_bps{benchmark="tokenized-stock-peg", issuer="robinhood", asset="nvda", market_state="regular"} and on() (tsp_market_session{benchmark="tokenized-stock-peg", market_state="regular"} == 1))[7d:1m])
      p90: quantile_over_time(0.90, (tsp_deviation_bps{benchmark="tokenized-stock-peg", issuer="robinhood", asset="nvda", market_state="regular"} and on() (tsp_market_session{benchmark="tokenized-stock-peg", market_state="regular"} == 1))[7d:1m])
      p99: quantile_over_time(0.99, (tsp_deviation_bps{benchmark="tokenized-stock-peg", issuer="robinhood", asset="nvda", market_state="regular"} and on() (tsp_market_session{benchmark="tokenized-stock-peg", market_state="regular"} == 1))[7d:1m])
      mean: avg_over_time((tsp_deviation_bps{benchmark="tokenized-stock-peg", issuer="robinhood", asset="nvda", market_state="regular"} and on() (tsp_market_session{benchmark="tokenized-stock-peg", market_state="regular"} == 1))[7d:1m])
      success: (avg_over_time(tsp_health{benchmark="tokenized-stock-peg", asset="nvda"}[24h]) or on() vector(0))
      sample_size: count_over_time((tsp_deviation_bps{benchmark="tokenized-stock-peg", issuer="robinhood", asset="nvda", market_state="regular"} and on() (tsp_market_session{benchmark="tokenized-stock-peg", market_state="regular"} == 1))[7d:1m])
      series: tsp_deviation_bps{benchmark="tokenized-stock-peg", issuer="robinhood", asset="nvda", market_state="regular"}
