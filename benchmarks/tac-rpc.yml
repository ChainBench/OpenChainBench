# OpenChainBench. Bench No 290

slug: tac-rpc
number: "290"
title: "TAC RPC endpoints: free public URLs by latency"
seo_title: "TAC RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free TAC RPC at {{best_p50}} (`eth_getBlockByNumber` p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for the `eth_getBlockByNumber(\"latest\", false)` method against every free, no-key public TAC EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  TAC is an EVM L1 (chain 239) that also runs a Cosmos consensus layer. The endpoints on this page are the EVM JSON-RPC surface only: the TAC official RPC (rpc.tac.build), Ankr (rpc.ankr.com/tac), dRPC (tac.drpc.org) and Thirdweb (239.rpc.thirdweb.com), all four returning chain id 0xef on the 2026-10-07 sweep. Ankr appearing keyless is notable: it key-gates most chains we measure, and TAC is one of the few where its public route answers.

abstract: |
  TAC: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:tac-official}}.
  We measure the round-trip latency of a single, identical JSON-RPC call (`eth_getBlockByNumber(\"latest\", false)`) against every no-key public TAC endpoint that sustains continuous probing, {{count}} providers measured, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a TAC-scaled staleness gap (20 blocks at TAC's ~3 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the TAC-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\", false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. The request id rotates, but that does not guarantee a cache miss: many caches normalise `id` away. Measured 2026-10-08, fixed and rotating ids answer within 2 to 4 percent of each other."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the exclusion rules follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the TAC-scoped view of the same harness."
  - "Roster: every endpoint here answered a real `eth_getBlockByNumber` call without a key on the 2026-10-07 sweep before being added to the probe matrix. An endpoint that needs a key, region-blocks us or rate-limits below the 60-second cadence is excluded rather than listed with an asterisk."
  - "Chain scope: every query on this page is pinned to `chain=\"tac\"`. Provider coverage: {{count}} no-key endpoints."

faq:
  - q: "Which TAC RPCs work without an API key?"
    a: "{{declared_count}} endpoints are probed on this chain: TAC (rpc.tac.build), Ankr (rpc.ankr.com/tac), dRPC (tac.drpc.org), Thirdweb (239.rpc.thirdweb.com). Every listed endpoint was live-verified with a `eth_getBlockByNumber` call returning a parsable response before inclusion."
  - q: "How is TAC RPC latency measured here, technically?"
    a: "One identical `eth_getBlockByNumber` call every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest."
  - q: "TAC has a Cosmos layer too, so why only the EVM endpoints here?"
    a: "Because they are different probes answering different questions. The EVM JSON-RPC surface takes `eth_getBlockByNumber`; a Cosmos consensus RPC takes Tendermint `status`. Mixing the two in one latency column would compare a call that reads an EVM block with a call that reads consensus state, which is not the same work. This page is the EVM surface, which is what a wallet or a contract call uses."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="tac"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: tac-official
    name: TAC
    endpoint: https://rpc.tac.build
    tag: TAC official public EVM RPC endpoint for TAC mainnet
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to TAC's no-key tac RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tac-official", chain="tac"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="tac-official", chain="tac"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="tac-official", chain="tac"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="tac-official", chain="tac"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="tac-official", chain="tac"}) / sum(ocb:rpc_call:rate_24h{provider="tac-official", chain="tac"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="tac-official", chain="tac"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="tac-official", chain="tac"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tac-official", chain="tac", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tac-official", chain="tac", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tac-official", chain="tac", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tac-official", chain="tac", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tac-official", chain="tac", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tac-official", chain="tac", region="sgp"}[1h])

