# OpenChainBench. Bench № 031

slug: network-fees
number: "031"
title: Cheapest blockchain transaction fee, live across L1 and L2 chains
seo_title: "Cheapest crypto transaction fee 2026"
seo_description: "Cheapest blockchain transaction fee in USD, live across {{count}} L1 and L2 chains: Solana, Base, Optimism, Arbitrum, BNB, Stellar ranked, L1 data fee included for rollups."
subtitle: "Live USD cost of one native token transaction on {{count}} Layer 1 and Layer 2 chains, refreshed every 30 seconds."

seo_intro: |
  This page answers one question. How much does it cost in dollars to send one transaction on each major blockchain right now. We track {{count}} chains in parallel and refresh the number every 30 seconds: Layer 1 chains (Ethereum, Solana, BNB Chain, Avalanche, TRON, Cardano, Sui, Stellar, Gram, Litecoin, Monero, Sei, Cronos, Kaia, Somnia, Algorand, Aptos, NEAR, Internet Computer) and Layer 2 rollups (Arbitrum, Optimism, Base, Scroll, zkSync Era, Linea, Mantle, Taiko, Robinhood Chain), with the L1 data fee included for the rollups that expose it. For every chain we query its own fee market directly (eth_feeHistory for the EVM family, getRecentPrioritizationFees on Solana, koios epoch params on Cardano, get_fee_estimate on Monero, the mempool oracle on Litecoin, getChainParameters on TRON, the GraphQL reference gas price on Sui, algod transaction params on Algorand, estimate_gas_price on Aptos, gas_price and the runtime fee table on NEAR, the ledger transfer fee on Internet Computer), convert the result to the smallest native unit, then multiply by the live USD price of the chain's native token from Mobula. The output is the dollar amount a wallet user pays for a plain transfer today. Compare Ethereum gas now versus Solana fee in USD, see whether Arbitrum is still cheaper than Base today, find out which Layer 1 has the lowest transaction cost this minute.

faq:
  - q: "What does this benchmark measure?"
    a: "The USD cost of one native token transaction on each of the {{count}} tracked chains, refreshed every 30 seconds. A native transaction is the simplest action on a chain. Send ETH on Ethereum, SOL on Solana, ADA on Cardano, TRX on TRON, ICP on Internet Computer, and so on, to an account that already exists. We do not measure token transfers, DEX swaps, account creation or contract deployments."
  - q: "Which chains are tracked?"
    a: "On the L1 tab: Ethereum, Solana, BNB Chain, Avalanche, TRON, Cardano, Sui, Stellar, Gram, Litecoin, Monero, Sei, Cronos, Kaia, Somnia, Algorand, Aptos, NEAR and Internet Computer. On the L2 tab: Arbitrum One, Optimism, Base, Scroll, zkSync Era, Linea, Mantle, Taiko and Robinhood Chain. A chain whose fee source is down drops off the table until it answers again, which is why the live count can sit below that list."
  - q: "Why USD instead of gas price in gwei?"
    a: "Gas price in gwei on Ethereum cannot be compared to lamports per compute unit on Solana or sun per byte on TRON. The only honest cross chain unit is the dollar cost of a user facing action, computed at scrape time using a live USD price for each native token. Mobula's market API delivers the prices we multiply by."
  - q: "What do slow, standard and fast tiers mean?"
    a: "Tiers exist on chains with a priority market where users can pay more for faster inclusion. On EVM chains slow, standard and fast are the 25th, 50th and 90th percentile of the priority tips paid in the last 4 blocks (median across the blocks); on Solana the same percentiles of recent priority fees; on Aptos the deprioritized, standard and prioritized gas price estimates. Chains with deterministic fees (Cardano, Stellar, Gram, TRON, Algorand, NEAR, Internet Computer) emit a single tier because there is no priority market to bid into."
  - q: "Why is the Solana fee so low?"
    a: "Solana charges 5000 lamports per signature as a hard base, plus an optional priority fee priced in micro lamports per compute unit. A simple SOL transfer uses around 200 compute units, so the priority component is typically dwarfed by the base. Over the last 24 hours the standard tier sat at {{p50:solana}}."
  - q: "Why is the Cardano fee always similar?"
    a: "Cardano fees are deterministic. The protocol parameters min_fee_a per byte and min_fee_b base are set by governance and updated rarely. A standard ADA transaction is roughly 250 bytes, so the lovelace cost is essentially fixed until the next parameter vote. The USD figure on the leaderboard only moves because ADA's USD price moves."
  - q: "What does a user pay on Internet Computer?"
    a: "The ICP ledger charges a fixed transfer fee of 0.0001 ICP (10000 e8s) to the sender, which we read live from the ledger's Rosetta node and price at the live ICP rate: {{p50:icp}} over the last 24 hours. Cycles, the gas that pays for canister computation and storage, are bought and burnt by the developer running the canister, not by the person sending ICP, so they are not part of this figure."
  - q: "Are the L2 numbers complete?"
    a: "Yes for the rollups that expose their data cost separately. On OP Stack chains (Optimism, Base, Mantle) the figure is L2 execution plus the L1 data fee the GasPriceOracle predeploy quotes for a 113 byte transfer; on Scroll the L1GasPriceOracle plays that role; on Arbitrum the L1 component arrives as extra gas in eth_estimateGas. zkSync Era, Linea, Taiko and Robinhood Chain embed the data cost in the sequencer gas price, so the plain formula is already the wallet total. The L1 data fee tracks the blob market block to block, which is why an OP Stack fee can move while its L2 base fee is flat."
  - q: "Which chain has the cheapest transaction fee right now?"
    a: "The leaderboard refreshes every 30 seconds and is sorted by cost. Over the last 24 hours {{best_name}} is the cheapest tracked chain at {{best_p50}} for a standard transfer, and {{worst_name}} the most expensive at {{worst_p50}}. Exact ordering depends on congestion and on each native token's USD price at the moment of read."
  - q: "How often does the page refresh?"
    a: "Every 30 seconds. The harness re queries each chain's fee oracle and Mobula's price API on the same cadence, so headline values are at most 30 seconds stale plus chain RPC latency (typically under one second)."
  - q: "Why are some chains showing one tier instead of three?"
    a: "Cardano and Internet Computer fees are protocol deterministic, Algorand charges its flat minimum fee unless the transaction pool is congested, Stellar charges its base fee per operation, NEAR burns gas at the block's gas price with no tip, and TRON native transfers consume bandwidth at the published rate per byte. None of them exposes a priority market a user can bid into for a native transfer, so emitting a single tier is more honest than fabricating three identical values."
  - q: "Can I cite a value from this page?"
    a: "Yes. Every number is a Prometheus query over a 24h window. The query string is shown in the row's hover tooltip. The harness source is open at the link in the source field below. Cite the value and the timestamp at the top of the page."

per_chain_explainer:
  - slug: avalanche
    h2: "Avalanche transaction fee"
    body: |
      Avalanche native transfer fee is {{p50:avalanche}} (p50, 24h). The C-Chain runs an EVM under Snowman consensus with a dynamic fee market whose base fee target adjusts every few seconds; a native AVAX transfer is 21000 gas. Computed via `eth_feeHistory` percentiles 25/50/90 on the official C-Chain RPC times live AVAX price.
  - slug: stellar
    h2: "Stellar transaction fee"
    body: |
      Stellar native transfer fee is {{p50:stellar}} (p50, 24h). The Stellar base fee is 100 stroops (0.00001 XLM) per operation network-wide, surging only when the ledger fills above its capacity threshold; a native XLM payment is one operation, so the fee sits at a fraction of a cent except during surge windows. Computed from `horizon fee_stats.last_ledger_base_fee` times one operation times live XLM price.
  - slug: gram
    h2: "Gram transaction fee"
    body: |
      Gram native transfer fee is {{p50:gram}} (p50, 24h). The chain has no clean fee-estimate RPC because its fee model accounts for storage, gas, forward and import fees separately per workchain and shard; a typical Wallet v4 transfer settles around 0.005 GRAM. We publish that conservative observed value times live GRAM price as a single deterministic tier.
  - slug: optimism
    h2: "Optimism transaction fee"
    body: |
      Optimism native transfer fee is {{p50:optimism}} (p50, 24h). Optimism uses an OP Stack EIP-1559 fee market with a near-zero priority fee (single sequencer, no public mempool to bid against); a native ETH transfer is 21000 gas. The L1 blob-posting cost, quoted by the GasPriceOracle predeploy for a 113 byte transfer, is included in this figure and is usually the larger of the two components. Computed via `eth_feeHistory` plus `getL1Fee` on the Optimism RPC times live ETH price.
  - slug: scroll
    h2: "Scroll transaction fee"
    body: |
      Scroll native transfer fee is {{p50:scroll}} (p50, 24h). Scroll's bytecode-equivalent zkEVM exposes a 1-to-1 EIP-1559 surface so wallets submit transactions unchanged; the L2 base fee covers prover work, and the L1 data fee quoted by Scroll's L1GasPriceOracle for a 113 byte transfer is included in this figure. Computed via `eth_feeHistory` plus `getL1Fee` on the Scroll RPC times live ETH price.
  - slug: ethereum
    h2: "Ethereum transaction fee"
    body: |
      Ethereum native transfer fee is {{p50:ethereum}} (p50, 24h). Fees follow EIP-1559: the base fee adjusts by up to 12.5 percent per block from the previous block's gas usage, plus a priority tip set by the user; a plain ETH transfer is 21000 gas. Congested periods (NFT mints, MEV bursts) push it up block by block, quiet hours pull it down, which is why the p90 column can sit well above the median. Computed as (base + p50 priority) times 21000 gas times live ETH price.
  - slug: bnb
    h2: "BNB Chain transaction fee"
    body: |
      BNB Chain native transfer fee is {{p50:bnb}} (p50, 24h). BNB Smart Chain runs a Parlia PoSA consensus with 21 active validators and a fixed 3 s block; fee market is EIP-1559-style with a validator-set minimum gas price that has been cut several times, which is why a native BNB transfer typically stays under one cent. Computed as (base + p50 priority) times 21000 gas times live BNB price.
  - slug: solana
    h2: "Solana transaction fee"
    body: |
      Solana native transfer fee is {{p50:solana}} (p50, 24h). Solana charges a hard 5000 lamports per signature base, plus an optional priority fee priced in micro-lamports per compute unit; a SOL transfer consumes around 200 CUs, so the priority component is usually dwarfed by the base. At current SOL prices the headline fee sits well under one cent on non-congested blocks. Measured via `getRecentPrioritizationFees` percentiles.
  - slug: tron
    h2: "TRON transaction fee"
    body: |
      TRON native transfer fee is {{p50:tron}} (p50, 24h). TRON uses a bandwidth and energy resource model rather than a gas auction: a TRX transfer is roughly 268 bytes, billed at the published bandwidth rate (currently 1000 sun per byte via `getChainParameters`), and free if the sender has enough free daily bandwidth or staked TRX. The single-tier figure reflects the on-chain rate parameter times typical transfer size times TRX price.
  - slug: cardano
    h2: "Cardano transaction fee"
    body: |
      Cardano native transfer fee is {{p50:cardano}} (p50, 24h). Cardano fees are protocol-deterministic: min_fee_a per byte plus a flat min_fee_b base, both set by governance and updated rarely; a typical ADA transfer is ~250 bytes, so the lovelace cost is essentially fixed until the next parameter vote. The USD figure only moves because ADA price moves. Computed from live koios epoch_params times 250 bytes times ADA price.
  - slug: sui
    h2: "Sui transaction fee"
    body: |
      Sui native transfer fee is {{p50:sui}} (p50, 24h). Sui uses a reference-gas-price model where validators agree on a per-epoch gas price via DPoS auction; a wallet send is SplitCoins plus TransferObjects, which pays the 1000 unit minimum computation bucket at the reference price plus the storage of the new coin object the recipient receives (988000 MIST); the rewritten gas coin gets almost all of its storage back as a rebate. Computed from the GraphQL reference gas price times 1000 units, plus that storage, times SUI price.
  - slug: litecoin
    h2: "Litecoin transaction fee"
    body: |
      Litecoin native transfer fee is {{p50:litecoin}} (p50, 24h). Litecoin inherits Bitcoin's UTXO fee market priced in litoshi per virtual byte; a SegWit P2WPKH single-input single-output transfer is around 225 vBytes, so even at fastest-tier mempool rates the headline cost stays a fraction of a cent, far under Bitcoin. Computed from litecoinspace.org recommended fee tiers times 225 vBytes times live LTC price.
  - slug: monero
    h2: "Monero transaction fee"
    body: |
      Monero native transfer fee is {{p50:monero}} (p50, 24h). Monero uses RingCT transactions with a dynamic block-size penalty: a 1-input 2-output transfer is roughly 1500 bytes, and the per-byte rate from `get_fee_estimate` rises sharply when miners are filling blocks above the median size. The fee covers both anonymity-set inflation and ring-signature footprint, which is why XMR fees sit above most L1s. Computed via the daemon's three-tier `get_fee_estimate` times 1500 bytes times XMR price.
  - slug: arbitrum
    h2: "Arbitrum transaction fee"
    body: |
      Arbitrum One native transfer fee is {{p50:arbitrum}} (p50, 24h). Arbitrum Nitro runs an EIP-1559 fee market against the sequencer at sub-second cadence; the sequencer's priority fee is near-zero by design. Nitro charges the L1 data-posting component as extra gas units, so `eth_estimateGas` on a native transfer returns 21000 plus that component, and this figure scales the L2 gas price by it: the result is the wallet total. Computed via `eth_feeHistory` and `eth_estimateGas` on the Arbitrum RPC times live ETH price.
  - slug: robinhood
    h2: "Robinhood Chain transaction fee"
    body: |
      Robinhood Chain native transfer fee is {{p50:robinhood}} (p50, 24h). Robinhood's Arbitrum Orbit rollup posts a very low base fee (~0.05 gwei) and zero priority rewards, the typical Orbit pattern where the centralized sequencer needs no tip market; ETH is the gas asset and the sequencer gas price already embeds the data posting cost, so the plain formula is the wallet total. Computed via `eth_feeHistory` on the official sequencer RPC times live ETH price.
  - slug: base
    h2: "Base transaction fee"
    body: |
      Base native transfer fee is {{p50:base}} (p50, 24h). Base is Coinbase's OP Stack rollup with a priority-fee-near-zero pattern; native ETH transfers settle at fractions of a cent on L2 execution alone. Base posts batches to Ethereum via EIP-4844 blobs; the L1 data fee quoted by the GasPriceOracle predeploy is included in this figure and tracks the blob fee market. Computed via `eth_feeHistory` plus `getL1Fee` on the Base RPC times live ETH price.
  - slug: zksync
    h2: "zkSync Era transaction fee"
    body: |
      zkSync Era native transfer fee is {{p50:zksync}} (p50, 24h). zkSync Era uses a custom fee model where the gas figure bundles execution, pubdata and prover cost into a single price published by the sequencer; prover work is amortized into the per-transaction fee rather than billed separately at batch time. Computed via `eth_feeHistory` on the zkSync sequencer RPC.
  - slug: linea
    h2: "Linea transaction fee"
    body: |
      Linea native transfer fee is {{p50:linea}} (p50, 24h). Linea is the Consensys zkEVM and exposes a standard EIP-1559 fee surface to wallets; the sequencer's posted base fee tracks zk-prover-batch economics rather than mempool congestion, so native ETH transfers sit in the sub-cent range even when Ethereum L1 is congested. The sequencer gas price already embeds the data posting cost, so nothing is added on top. Computed via `eth_feeHistory` on the Linea RPC times live ETH price.
  - slug: mantle
    h2: "Mantle transaction fee"
    body: |
      Mantle native transfer fee is {{p50:mantle}} (p50, 24h). Mantle is an OP Stack fork that uses EigenDA for data availability instead of Ethereum blob calldata, which lowers the L1-posting component substantially; the L2 fee market still follows EIP-1559 against a centralized sequencer, gas is paid in MNT, and native MNT transfers sit in the sub-cent range. Computed via `eth_feeHistory` plus `getL1Fee` on the Mantle RPC times live MNT price.
  - slug: taiko
    h2: "Taiko transaction fee"
    body: |
      Taiko native transfer fee is {{p50:taiko}} (p50, 24h). Taiko is a based rollup sequenced by Ethereum L1 validators, so its block cadence is bounded by Ethereum's 12 s slot and its fee market reflects the L1 priority surface; the gas price it publishes already carries the data posting cost. Computed via `eth_feeHistory` on the Taiko RPC times live ETH price.
  - slug: sei
    h2: "Sei transaction fee"
    body: |
      Sei native transfer fee is {{p50:sei}} (p50, 24h). Sei runs a parallelized EVM on its own Layer 1 with an EIP-1559 style base fee held at a network minimum and priority tips that are usually zero; a native SEI transfer is 21000 gas, paid in SEI. Computed via `eth_feeHistory` on the Sei EVM RPC (base fee plus the median tip percentiles of the last 4 blocks) times 21000 gas times live SEI price.
  - slug: cronos
    h2: "Cronos transaction fee"
    body: |
      Cronos native transfer fee is {{p50:cronos}} (p50, 24h). Cronos EVM is a Cosmos SDK Layer 1 with an EIP-1559 base fee priced in CRO; a native CRO transfer is 21000 gas, and the base fee moves only when the chain's governance or block fullness moves it. Computed via `eth_feeHistory` on the official Cronos EVM RPC times 21000 gas times live CRO price.
  - slug: kaia
    h2: "Kaia transaction fee"
    body: |
      Kaia native transfer fee is {{p50:kaia}} (p50, 24h). Kaia, the merged Klaytn and Finschia chain, runs a dynamic base fee that rises with block usage plus a priority tip paid to validators; a native KAIA transfer is 21000 gas. Tips vary a lot from block to block, so the tiers take the median of each percentile across the last 4 blocks rather than a mean that one outlier block could swing. Computed via `eth_feeHistory` on the Kaia public endpoint times live KAIA price.
  - slug: somnia
    h2: "Somnia transaction fee"
    body: |
      Somnia native transfer fee is {{p50:somnia}} (p50, 24h). Somnia is an EVM Layer 1 that prices gas in SOMI with a flat base fee and no tip market in practice; a native SOMI transfer estimates at exactly 21000 gas on its RPC. Computed via `eth_feeHistory` on the official Somnia RPC times 21000 gas times live SOMI price.
  - slug: algorand
    h2: "Algorand transaction fee"
    body: |
      Algorand native transfer fee is {{p50:algorand}} (p50, 24h). An ALGO payment pays the larger of the minimum fee (1000 microAlgo, 0.001 ALGO) and a per byte congestion fee that algod only raises above zero when the transaction pool is full; a signed payment is about 250 bytes, so outside congestion the fee is exactly the minimum. Computed from algod `/v2/transactions/params` (min-fee and fee) times 250 bytes, floored at min-fee, times live ALGO price.
  - slug: aptos
    h2: "Aptos transaction fee"
    body: |
      Aptos native transfer fee is {{p50:aptos}} (p50, 24h). Aptos charges gas used times the gas unit price in octas; an `aptos_account::transfer` of APT to an account that already exists burns 62 to 66 gas units (measured on mainnet), and the fullnode publishes deprioritized, standard and prioritized unit prices that map to the slow, standard and fast tiers. A transfer that creates the recipient account also pays its storage and costs far more; that case is out of scope. Computed via `estimate_gas_price` times 63 gas units times live APT price.
  - slug: near
    h2: "NEAR transaction fee"
    body: |
      NEAR native transfer fee is {{p50:near}} (p50, 24h). NEAR burns gas at the block gas price with no tip; a transfer between two existing named accounts burns the receipt creation and transfer action costs once on send and once on execution, about 0.45 Tgas under the current runtime fee table. A transfer to an implicit account that does not exist yet also creates it and costs more; that is out of scope. Computed via the `gas_price` RPC times the transfer gas read from `EXPERIMENTAL_protocol_config`, times live NEAR price.
  - slug: icp
    h2: "Internet Computer transaction fee"
    body: |
      Internet Computer native transfer fee is {{p50:icp}} (p50, 24h). Sending ICP is a call to the ICP ledger, which charges the sender a fixed transfer fee of 0.0001 ICP (10000 e8s); there is no gas auction. Cycles, which pay for canister computation and storage, are burnt by the developer who runs the canister, not by the person sending ICP, so they are not in this figure. Computed from the ledger fee published by the ICP Rosetta node times live ICP price.

category: Blockchains
status: live
metric: Native transfer fee USD
unit: usd
higher_is_better: false
row_noun: { one: chain, many: chains }

abstract: |
  Every 30 seconds we ask each of {{count}} chains for its current native
  transaction fee in the chain's smallest unit (wei, lamport, lovelace,
  sun, MIST, litoshi, atomic, microAlgo, octa, yoctoNEAR, e8s), multiply
  by the live USD price of the chain's native token from Mobula's market
  API and publish the result. Chains with a priority market expose three
  tiers (slow, standard, fast) mapped to roughly the 25th, 50th and 90th
  percentile of the recent fee distribution. Deterministic fee chains
  emit a single tier. Layer 1 chains and Layer 2 rollups sit on separate
  tabs, and the rollup figures include the L1 data fee, so a wallet
  routing decision can be made on real data instead of marketing claims.

methodology:
  - "Refresh cadence. 30 seconds. One process samples every chain in the table in parallel goroutines."
  - "Ethereum, BNB Chain, Avalanche, Sei, Cronos, Kaia and Somnia on the L1 tab. eth_feeHistory over the last 4 blocks at percentiles 25, 50 and 90, median across the 4 blocks per percentile. Cost = (base_fee + reward_percentile) * 21000 gas in the chain's own gas token, mapped to slow, standard and fast."
  - "Arbitrum, Optimism, Base, Scroll, zkSync Era, Linea, Mantle, Taiko and Robinhood Chain on the L2 tab. Same eth_feeHistory flow against each rollup's sequencer RPC. ETH is the native gas asset on every tracked rollup except Mantle, which prices gas in MNT."
  - "Layer 2 data fee. OP Stack rollups (Optimism, Base, Mantle): eth_call GasPriceOracle.getL1Fee(bytes) at 0x42..0F on a serialized 113 byte EIP 1559 transfer, added to every tier. Scroll: the same call on L1GasPriceOracle at 0x53..02. Arbitrum: eth_estimateGas on a native transfer returns 21000 plus the L1 calldata component; every tier is scaled by estimated / 21000. zkSync Era, Linea, Taiko and Robinhood Chain: none added, the sequencer gas price already includes data posting."
  - "Stellar. horizon fee_stats.last_ledger_base_fee (100 stroops outside surge) times one operation. Single tier."
  - "Gram. 0.005 GRAM, the conservative observed cost of a Wallet v4 transfer; the chain exposes no fee estimate RPC. Single tier."
  - "Solana. getRecentPrioritizationFees percentiles 25, 50 and 90 of micro lamports per compute unit, times 200 compute units, plus 5000 lamports base. Empty fees response collapses to a single standard tier at the 5000 base."
  - "TRON. getChainParameters.getTransactionFee (currently 1000 sun per byte) times 268 bytes for a typical native transfer. Single tier because TRON native transfers do not bid into a priority market."
  - "Cardano. koios epoch_params.min_fee_a and min_fee_b, times 250 bytes for a typical native transfer. Deterministic by protocol, refreshes only when on chain parameters change."
  - "Sui. GraphQL epoch.referenceGasPrice (the JSON RPC method was retired on public fullnodes in 2026) times the 1000 unit minimum computation bucket, plus 988000 MIST of storage for the new coin object of a SplitCoins + TransferObjects send, net of the gas coin rebate. Single standard tier."
  - "Litecoin. litecoinspace.org /api/v1/fees/recommended (hour, half hour and fastest fees in litoshi per vByte) times 225 vBytes for a typical 1 input 1 output P2WPKH transfer."
  - "Monero. monero rpc get_fee_estimate.fees[0..2] times 1500 bytes for a typical 1 input 2 output RingCT transaction."
  - "Algorand. algod /v2/transactions/params: max(min-fee, fee per byte times 250 bytes) for a signed payment. min-fee is 1000 microAlgo and the per byte fee is zero outside congestion. Single tier."
  - "Aptos. /v1/estimate_gas_price (deprioritized, standard, prioritized octas per gas unit) times 63 gas units, the median measured for an aptos_account::transfer of APT to an existing account."
  - "NEAR. gas_price (yoctoNEAR per gas) times the gas a transfer between existing named accounts burns: action receipt creation plus transfer action, send_not_sir plus execution, read from EXPERIMENTAL_protocol_config. Single tier."
  - "Internet Computer. The ICP ledger transfer fee from the ICP Rosetta /construction/metadata suggested_fee (10000 e8s, 0.0001 ICP). Cycles are paid by canister developers and are not part of what the sender pays. Single tier."
  - "USD prices. api.mobula.io/api/1/market/multi-data polled every 30 seconds for every native token, by asset slug or by Mobula asset id for tokens that were renamed (Gram) or added later."
  - "Failures. Any upstream error leaves the previous gauge in place, increments tx_fee_fetch_errors_total{chain, error_type}, and sets tx_fee_health{chain} to zero."

findings:
  - "{{best_name}} is the cheapest tracked native transaction at {{best_p50}} over the last 24 hours."
  - "{{worst_name}} is the most expensive tracked native transaction at {{worst_p50}}; {{name:ethereum}} sits at {{p50:ethereum}} (standard tier, 24h median)."
  - "A standard transaction costs {{p50:bnb}} on {{name:bnb}}, {{p50:solana}} on {{name:solana}} and {{p50:litecoin}} on {{name:litecoin}} (24h medians)."
  - "{{name:cardano}}, {{name:tron}}, {{name:algorand}} and {{name:icp}} use deterministic fee models. Their USD figure on the leaderboard moves with native token price, not with network congestion."
  - "USD costs are computed at scrape time. A 10 percent intraday move in the native token's USD price shifts the headline by 10 percent even if the chain native fee is flat. We surface that intentionally because the dollar cost is what a wallet user actually pays."
  - "Layer 2 values are the wallet total: L2 execution plus the L1 data fee where the rollup exposes it (OP Stack GasPriceOracle, Scroll L1GasPriceOracle, Arbitrum estimateGas); zkSync Era, Linea, Taiko and Robinhood Chain embed it in the gas price."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/transaction-fee

prometheus:
  window: 24h

# Real metrics exposed by the transaction-fee harness:
#   tx_fee_native_transfer_usd{chain, tier}         gauge (USD)
#   tx_fee_native_transfer_native{chain, tier}      gauge (smallest unit)
#   tx_fee_gas_price_gwei{chain, tier}              gauge (EVM only)
#   tx_fee_native_token_price_usd{chain}            gauge (USD per token)
#   tx_fee_last_refresh_timestamp_seconds{chain}    gauge (unix s)
#   tx_fee_fetch_errors_total{chain, error_type}    counter
#   tx_fee_health{chain}                            gauge (0|1)

providers:
  - slug: ethereum
    name: Ethereum
    layer: l1
    tag: EIP 1559 fee market, 21000 gas × (base + p50 priority)
    formula: "Median USD cost of a native ETH transfer over 24h: (base_fee + p50 priority_fee) × 21000 gas × ETH USD price."
    queries:
      p50: quantile_over_time(0.50, tx_fee_native_transfer_usd{chain="ethereum",tier="std"}[24h])
      p90: quantile_over_time(0.90, tx_fee_native_transfer_usd{chain="ethereum",tier="fast"}[24h])
      p99: quantile_over_time(0.99, tx_fee_native_transfer_usd{chain="ethereum",tier="fast"}[24h])
      mean: avg_over_time(tx_fee_native_transfer_usd{chain="ethereum",tier="std"}[24h])
      success: avg_over_time(tx_fee_health{chain="ethereum"}[24h])
      sample_size: count_over_time(tx_fee_native_transfer_usd{chain="ethereum",tier="std"}[7d])
      series: tx_fee_native_transfer_usd{chain="ethereum",tier="std"}

  - slug: bnb
    name: BNB Chain
    layer: l1
    tag: EIP 1559 fee market, 21000 gas
    formula: "Median USD cost of a native BNB transfer over 24h."
