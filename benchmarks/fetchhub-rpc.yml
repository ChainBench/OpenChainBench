    name: PublicNode
    endpoint: https://fetch-rpc.publicnode.com
    tag: PublicNode public Fetch.ai RPC, no API key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /status sent every 60s from 3 regions to fetch-rpc.publicnode.com."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="fetchhub"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="fetchhub"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="fetchhub"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="fetchhub"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="fetchhub"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="fetchhub"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="fetchhub"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="fetchhub"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="fetchhub", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="fetchhub", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="fetchhub", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="fetchhub", region="eu-west"}[1h])
        - region: ap-southeast
