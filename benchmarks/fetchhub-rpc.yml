          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="fetchhub", region="sgp"}[1h])

  - slug: cosmos-directory
    name: Cosmos Directory
    endpoint: https://rpc.cosmos.directory/fetchhub
    tag: Cosmos Directory public Fetch.ai RPC proxy, no API key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /status sent every 60s from 3 regions to rpc.cosmos.directory/fetchhub."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="cosmos-directory", chain="fetchhub"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="cosmos-directory", chain="fetchhub"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="cosmos-directory", chain="fetchhub"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="cosmos-directory", chain="fetchhub"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="cosmos-directory", chain="fetchhub"}) / sum(ocb:rpc_call:rate_24h{provider="cosmos-directory", chain="fetchhub"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="cosmos-directory", chain="fetchhub"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="cosmos-directory", chain="fetchhub"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="cosmos-directory", chain="fetchhub", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="cosmos-directory", chain="fetchhub", region="us-east"}[1h])
        - region: eu-west
