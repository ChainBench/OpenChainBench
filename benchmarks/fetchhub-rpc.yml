# OpenChainBench. Bench No 252

slug: fetchhub-rpc
number: "252"
title: Fastest free Fetch.ai RPC, live no-key endpoint latency
seo_title: "Fastest free Fetch.ai RPC 2026"
seo_description: "{{best_name}} leads free Fetch.ai RPC at {{best_p50}} (block height p50, 24h). 3 providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for Tendermint /status queries against every available public Fetch.ai (FetchHub-4) endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Fetch.ai is a Cosmos SDK blockchain (fetchhub-4 mainnet) focused on AI agents, autonomous economic agents, and the ASI Alliance (the merger of Fetch.ai, SingularityNET, and Ocean Protocol under the FET/ASI token). It uses the standard Cosmos Tendermint RPC interface; block height is fetched via the /status endpoint. Public keyless RPC nodes are provided by the Fetch.ai official team (rpc-fetchhub.fetch.ai), PublicNode, and Cosmos Directory. Every provider was live-verified with consecutive block-height probes at launch.

abstract: |
  Per-chain member of the RPC latency cluster, extended to Fetch.ai (FetchHub-4).
  We measure the round-trip latency of a Tendermint /status query against
  every available public Fetch.ai endpoint that sustains continuous probing:
  3 providers at launch, every 60 seconds, from us-east, eu-west and
  Singapore. Each provider is probed via a GET /status request
  from which the block number is extracted.
  The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout)
  with a Cosmos-scaled staleness gap (20 blocks, around 120 s at 6 s/block).
  The cross-chain view lives on the parent rpc-capabilities benchmark;
  this page is the Fetch.ai-scoped answer with per-region breakdowns as
  a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: GET /status. The result.sync_info.latest_block_height field (string-encoded integer) is extracted as the current block height."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms to 10 s), so percentiles are computed via Prometheus quantile_over_time over the last 24 hours."
  - "Call-result classification: ok (parsable block height returned), http_err, jsonrpc_err, stale (block more than 20 behind the cross-provider tip), timeout."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain rpc-capabilities benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to chain=fetchhub. Provider coverage at launch: 3 endpoints (Fetch.ai official, PublicNode, Cosmos Directory)."

findings:
  - "{{best_name}} leads free Fetch.ai RPC at {{best_p50}} (Tendermint /status p50, 24h) across 3 measured providers."

faq:
  - q: "What is the fastest free Fetch.ai RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (Fetch.ai block height p50 over the last 24h), measured against 3 providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Fetch.ai RPC endpoints work without an API key?"
    a: "3 endpoints sustain continuous keyless probing at launch: Fetch.ai official (rpc-fetchhub.fetch.ai), PublicNode (fetch-rpc.publicnode.com), and Cosmos Directory (rpc.cosmos.directory/fetchhub). Every listed endpoint was live-verified before inclusion."
  - q: "What is Fetch.ai and why does its RPC latency matter?"
    a: "Fetch.ai is a Cosmos SDK blockchain enabling autonomous AI agents to transact, negotiate, and execute tasks on-chain. The FET token (rebranded as ASI following the ASI Alliance merger with SingularityNET and Ocean Protocol) powers agent services and staking. Developers building AI agent frameworks, DeFi integrations, or on-chain governance tools need reliable low-latency RPC access to query agent registrations, transactions, and network state."
  - q: "Does the fastest Fetch.ai RPC change by region?"
    a: "Often. The official Fetch.ai node infrastructure is concentrated in specific regions while PublicNode distributes globally. The region tabs re-scope every number to a single probe origin."
  - q: "What is the ASI Alliance and how does it relate to FetchHub?"
    a: "The ASI Alliance is a merger of Fetch.ai, SingularityNET, and Ocean Protocol into a unified AI blockchain project. FetchHub-4 remains the underlying Cosmos SDK chain; the FET token migrated to the ASI token name while the technical RPC infrastructure and chain ID are unchanged."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="fetchhub"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: fetchai-official
    name: Fetch.ai
    tag: Fetch.ai official public RPC node, no API key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /status sent every 60s from 3 regions to rpc-fetchhub.fetch.ai."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="fetchai-official", chain="fetchhub"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="fetchai-official", chain="fetchhub"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="fetchai-official", chain="fetchhub"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="fetchai-official", chain="fetchhub"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="fetchai-official", chain="fetchhub"}) / sum(ocb:rpc_call:rate_24h{provider="fetchai-official", chain="fetchhub"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="fetchai-official", chain="fetchhub"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="fetchai-official", chain="fetchhub"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="fetchai-official", chain="fetchhub", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="fetchai-official", chain="fetchhub", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="fetchai-official", chain="fetchhub", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="fetchai-official", chain="fetchhub", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="fetchai-official", chain="fetchhub", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="fetchai-official", chain="fetchhub", region="sgp"}[1h])

