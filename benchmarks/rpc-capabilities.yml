# OpenChainBench. Bench № 010

slug: rpc-capabilities
number: "010"
title: Fastest free public RPC for Ethereum, BNB, Polygon and 7 more EVM chains
seo_title: "Fastest free public RPC 2026"
seo_description: "Fastest free public RPC live on eth_getBlockByNumber p50. dRPC, PublicNode, 1RPC, Tenderly, Nodies, Lava ranked."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against free, no-key public RPC endpoints across 10 EVM chains, audited every 60 seconds.
category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

disclaimer: >
  Latency is conditional on success: the harness times only calls that
  return a valid, fresh block, so an endpoint failing most calls can
  still post a fast p50 from its rare successes. Treat rows below 50
  percent success as degraded. Providers whose probes stop succeeding
  are pinned below the table as unresponsive. On the All chains tab
  each number is the mean of per chain, per region 24h p50s; single
  chain providers are measured on their one chain only.

seo_intro: |
  This benchmark answers the question every developer reaching for a
  free public RPC asks before pasting a URL into their dapp. which
  no-key endpoint is actually fast and reliable right now, on the
  chain my product runs on. Alchemy and Infura own the keyed-tier
  market; the free public side of the question lives elsewhere, in
  the RPC services dapps hit when a contributor's free quota is the
  budget. We probe `eth_getBlockByNumber` every 60 seconds against 15
  audited providers across 10 EVM chains. PublicNode, dRPC, 1RPC,
  MeowRPC, Tenderly Gateway, Nodies (POKT), Lava Network, Merkle,
  Flashbots Protect, Cloudflare and 5 chain-official foundation
  endpoints (Base, Binance BSC, Avalanche, Arbitrum, Optimism).
  Chains covered. Ethereum (9 providers), Arbitrum (8), Base (6),
  Optimism (6), Avalanche (6), BNB (5), Polygon (5), Linea + Scroll + Mantle (4
  each). The headline question is per chain, not cross-chain. Five
  providers are single-chain by design (the foundation endpoints
  above), so a cross-chain aggregate mechanically rewards whichever
  single-chain endpoint happens to be fastest on its one chain.
  Current per-chain leaders. Ethereum {{best_name:chain:ethereum}}
  at {{best_p50:chain:ethereum}}, Base {{best_name:chain:base}} at
  {{best_p50:chain:base}}, BNB {{best_name:chain:bnb}} at
  {{best_p50:chain:bnb}}, Arbitrum {{best_name:chain:arbitrum}} at
  {{best_p50:chain:arbitrum}}. Use the chain tab above to filter the
  leaderboard. Latency is the headline; the leaderboard also exposes
  call-result classification (`ok` vs `http_err` vs `jsonrpc_err` vs `stale` vs
  `timeout`, the Cloudflare-eth trap where a 200 OK hides a JSON-RPC
  error field) and archive-depth support so a fast endpoint that
  returned a state-pruned response at block (head, 5M) is not
  silently treated as a viable archive source.

abstract: |
  We measure the round-trip latency of a single, identical RPC call
  (`eth_getBlockByNumber`) against every major no-key Ethereum-compatible
  public RPC endpoint, across 10 EVM chains. The
  harness emits three metric families from one binary because they
  share the same (provider × chain) client matrix and same 15 s
  scrape interval: (a) `rpc_latency_milliseconds` for the speed
  leaderboard, (b) `rpc_call_total{result}` for the reliability and
  silent-failure analysis, (c) `rpc_archive_depth_supported{depth}`
  for an honest read on which endpoints actually serve historical
  state. The depth set covers Geth's default pruned cap (~5760
  blocks) up through genesis-era archive (5M blocks). Stale-head
  detection compares each provider's reported block against the
  cross-provider tip and flags anything more than 20 blocks behind
  so a dead endpoint stuck on an old number is not silently ranked
  as the fastest. Latency is recorded only for successful calls, so
  every percentile is conditional on success; the `rpc_call_total`
  counters are the companion signal that keeps a mostly failing
  endpoint from reading as fast.

methodology:
  - "Cadence: every 60 seconds per (provider, chain) pair, from each of 3 Railway replicas (us-east Virginia, eu-west Amsterdam, sgp Singapore). The harness stamps a `region` label on every metric from `$RAILWAY_REPLICA_REGION`. Headline p50/p90/p99 are the mean of per (chain, region) `quantile_over_time` cells: all 3 regions, and on the All chains tab every chain the provider serves. Per-region breakdowns are on the time-series chart."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the latest-header fetch with a rotating id defeats edge caches that answer eth_blockNumber without touching a node."
  - "Latency: client-side `time.Now()` delta around the round-trip, in milliseconds. Exposed as both a gauge (`rpc_latency_milliseconds`) and a histogram (`rpc_latency_milliseconds_histogram`) with buckets 50 ms → 10 s, so p50/p90/p99 are computed via Prometheus `histogram_quantile` / `quantile_over_time`. Latency is recorded only for calls classified `ok`; failed calls never enter the latency distribution, so every percentile is conditional on success."
  - "Call-result classification: `ok` (HTTP 200 + non-empty result), `http_err` (status ≠ 200 or transport failure), `jsonrpc_err` (HTTP 200 with an `error` field, the Cloudflare-eth trap), `stale` (returned block more than 20 behind the cross-provider tip for that chain), `timeout`. Counter `rpc_call_total{result}` powers the reliability leaderboard."
  - "Success gating: because failed probes record no latency, a mostly failing endpoint can post a fast p50 from its rare successes. The ledger pairs every latency figure with a Success column computed as ok calls over total calls in the same 24h window; read rows below 50 percent success as degraded. Providers with under 5 percent success lose their latency series to Prometheus staleness and are pinned below the table as unresponsive instead of being ranked."
  - "Archive depth: every 5 minutes we issue `eth_getBalance` at (head, depth) for `depth` in {300, 7200, 216_000, 1_296_000, 5_000_000}. Gauge `rpc_archive_depth_supported{depth}` is 1 when the response is non-pruned, 0 otherwise. The 300/7200 thresholds cover Geth's default pruned-cap range; 216k ≈ 1 month; 1.3M ≈ 6 months; 5M ≈ genesis-era full archive."
  - "Chain coverage: 10 EVM chains. Ethereum (9 providers), Arbitrum (8), Base (6), Optimism (6), Avalanche (6), BNB (5), Polygon (5), Linea (4), Scroll (4), Mantle (4). Provider matrix per chain is documented in `miniapps/rpc-capabilities/cmd/script/config.go`."
  - "Excluded by design: Ankr (key-gated), gateway.fm (29 req/IP budget too tight for 15s polling), LlamaRPC + BlockPI + OmniaTech (Cloudflare 521 region-blocked), Alchemy demo (rate-limited dead), NodeReal + GetBlock + Chainstack (key-gated). Merkle on Ethereum + Lava on non-ETH/Arb + MeowRPC on non-ETH/Arb all excluded chain-by-chain. Every (provider, chain) was live-verified no-key before inclusion."

findings:
  - "Per-chain leaders, not a cross-chain crown. On Ethereum the current leader is {{best_name:chain:ethereum}} at {{best_p50:chain:ethereum}} (p50, 24 h) across 9 measured providers, the largest cohort in this bench. Ethereum is also the chain where Cloudflare-eth's `jsonrpc_err` traps the lazy reader."
  - "On Base the leader is {{best_name:chain:base}} at {{best_p50:chain:base}} (p50, 24 h) across 6 providers. Base sees Coinbase's `mainnet.base.org` go head-to-head with PublicNode, dRPC, Tenderly and Merkle, an unusually clean comparison because the chain-official endpoint is operated by the same team that runs the sequencer."
  - "On BNB Chain the leader is {{best_name:chain:bnb}} at {{best_p50:chain:bnb}} (p50, 24 h) across 5 providers. Binance's `bsc-dataseed1` is the incumbent, but PublicNode, dRPC and Merkle have closed the gap on EU origin nodes."
  - "On Arbitrum the leader is {{best_name:chain:arbitrum}} at {{best_p50:chain:arbitrum}} (p50, 24 h) across 8 providers. Arbitrum is the second-largest cohort and one of the few chains where Lava and MeowRPC compete on a no-key tier alongside PublicNode and the Arbitrum Foundation's own endpoint."
  - "{{name:publicnode}} returns {{p50:publicnode}} on the unfiltered aggregate (mean of its per chain, per region 24h p50s). PublicNode (operated by Allnodes) is the de-facto default no-key RPC for many dapps because it terminates close to a large EU-anchored validator footprint and is one of the few providers present on most measured chains."
  - "{{name:drpc}} sits at {{p50:drpc}} on the unfiltered aggregate (mean of its per chain, per region 24h p50s). dRPC is a decentralized RPC mesh that routes each request across third-party node providers with consensus checks, so latency tracks the median of the underlying mesh rather than a single host."
  - "Cloudflare-eth is a cautionary tale. The endpoint returns HTTP 200 in well under a second, but a growing share of calls now resolve to `jsonrpc_err -32046 Cannot fulfill request` rather than a usable block, reliability is measured by `rpc_call_total{result=\"ok\"} / rpc_call_total` rather than HTTP status alone."
  - "Single-chain providers (Base official, Binance, Arbitrum Foundation, Optimism Foundation, Avalanche) mechanically inflate a cross-chain aggregate because they only emit metrics for their one chain. Read the leaderboard per chain and the comparison stays honest."

faq:
  - q: "What is the fastest free public RPC right now?"
    a: "The question is per chain because several providers are single-chain by design (Base official, Binance, Arbitrum Foundation, Optimism Foundation, Avalanche) and a cross-chain aggregate mechanically rewards whichever single-chain endpoint happens to be fastest on its one chain. Current per-chain leaders. Ethereum {{best_name:chain:ethereum}} at {{best_p50:chain:ethereum}}, Base {{best_name:chain:base}} at {{best_p50:chain:base}}, BNB Chain {{best_name:chain:bnb}} at {{best_p50:chain:bnb}}, Arbitrum {{best_name:chain:arbitrum}} at {{best_p50:chain:arbitrum}}. The leaderboard re-sorts every 60 seconds against fresh Prometheus samples averaged across us-east, eu-west and sgp probes. Switch the chain tab to see the leader on the network your product runs on."
  - q: "Which public RPCs work without an API key in 2026?"
    a: "15 audited providers across 10 EVM chains. Universal multi-chain (work on 4+ chains): PublicNode, dRPC, 1RPC, Tenderly Gateway (`gateway.tenderly.co/public/<slug>`), Nodies (POKT successor at `*-pokt.nodies.app`). Ethereum-specific or limited footprint: MeowRPC (ETH + Arbitrum only since 2025), Flashbots Protect, Cloudflare (read-degraded), Lava Network (ETH + Arbitrum no-key, other chains require key), Merkle (Base + BSC stable, ETH locked-out by Cloudflare). Chain-official foundation RPCs: Arbitrum (`arb1.arbitrum.io/rpc`), Optimism (`mainnet.optimism.io`), Base (`mainnet.base.org`), Avalanche (`api.avax.network`), BNB (`bsc-dataseed1.binance.org`). Excluded: Ankr (key-gated), gateway.fm (29 req/IP), LlamaRPC / BlockPI / OmniaTech (Cloudflare 521 region-blocked), Alchemy demo (rate-limited dead), NodeReal / GetBlock / Chainstack (key-gated)."
  - q: "Why is Cloudflare-eth returning errors?"
    a: "Cloudflare's public Ethereum gateway recently switched to a permissioned mode for many JSON-RPC methods. The endpoint still returns HTTP 200 quickly, but the body is increasingly a JSON-RPC error (`-32046 Cannot fulfill request`) rather than a block number. This benchmark catches the trap by classifying responses as `ok` only when both the HTTP status is 200 and the JSON-RPC body has a usable `result` field. Latency without reliability is a misleading ranking signal for a public RPC."
  - q: "Why can an RPC with a low success rate still show a fast latency?"
    a: "Latency percentiles are computed only from successful calls. The harness records a round-trip time when a probe returns a valid, fresh block; HTTP errors, JSON-RPC error bodies, timeouts and stale responses increment the `rpc_call_total` counter but never enter the latency distribution. An endpoint failing 60 percent of its calls is therefore timed only on the 40 percent that succeed, which can make it look faster than a healthy provider doing real work on every request. That is why the leaderboard pairs every latency figure with a Success column computed as ok calls over total calls in the same 24h window. Read rows below 50 percent success as degraded regardless of their p50. Providers under 5 percent success are dropped from the ranking and pinned below the table as unresponsive."
  - q: "Which free RPC supports Ethereum archive node calls?"
    a: "Most free public RPCs are state-pruned, so `eth_getBalance` at block (head, 5,000,000) returns an error rather than the historical balance. This benchmark probes five depths (300, 7,200, 216,000, 1,296,000, 5,000,000 blocks) every five minutes and exposes a gauge per provider per depth. The page surfaces a per-provider archive-depth badge: a green tick at the 5M tier means full historical state is available for free without a key. Anything pruned at 7200 confirms the endpoint is on a Geth default config and only serves the last ~24 hours."
  - q: "How is RPC latency measured on OpenChainBench?"
    a: "The harness issues a single `eth_getBlockByNumber` JSON-RPC POST every 60 seconds against each (provider, chain) pair from each of 3 regions (us-east, eu-west, sgp), using the same plain HTTP client for every endpoint. Wall-clock delta around the round-trip is recorded with millisecond precision and pushed to both a gauge and a histogram. p50/p90/p99 are computed via Prometheus `quantile_over_time` over the last 24 hours. Stale-head detection compares each response against the cross-provider tip and flags anything more than 20 blocks behind as `stale`, so a dead endpoint stuck on yesterday's block cannot rank as the fastest."
  - q: "Are public RPCs production-grade for a dapp?"
    a: "Read the success-rate column before deciding. A median latency under 100 ms is irrelevant if the endpoint silently returns a JSON-RPC error 5% of the time or stalls during an L1 reorg. Free public RPCs share rate-limit budgets with the entire internet and have no SLA. They are good for read-heavy demos, local development and fallback paths; production dapps usually graduate to a keyed tier (Alchemy, QuickNode, Infura) for `eth_sendRawTransaction`, websocket subscriptions and archive queries beyond Geth's pruned cap. This benchmark measures the no-key tier specifically because that is the unmeasured part of the market."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Chain selector. tabs at the top of the page. Server injects
# `chain="X"` into every PromQL query for the active tab. The special
# value `all` skips the filter, aggregate across every chain.
dimensions:
  chain:
    - { value: all,       label: All chains }
    - { value: ethereum,  label: Ethereum }
    - { value: polygon,   label: Polygon }
    - { value: arbitrum,  label: Arbitrum }
    - { value: optimism,  label: Optimism }
    - { value: base,      label: Base }
    - { value: bnb,       label: BNB Chain }
    - { value: avalanche, label: Avalanche }
    - { value: linea,     label: Linea }
    - { value: scroll,    label: Scroll }
    - { value: mantle,    label: Mantle }
  # Region values are the raw harness labels (REGION env on each Railway
  # service: us-east / eu-west / sgp). Selecting one at the top of the
  # page re-fetches all queries with `region="X"` injected, headline
  # numbers + ranked-bar + chart all flip to that region. "All" leaves
  # the queries unscoped, falling back to the cross-region average.
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

# One instant query feeding the exact per-cell (chain x region) rankings
# behind scoped badges and leadership claims. Cross-region averages hide
# region-restricted leaders (dRPC wins every chain from sgp only), so
# badge scoping reads these cells instead of the aggregate ranks.
rank_matrix_query: avg by (provider, chain, region) (ocb:rpc_latency_milliseconds:p50_24h)

# Real metrics emitted by the rpc-capabilities harness:
#   rpc_latency_milliseconds{provider, chain}                       gauge
#   rpc_latency_milliseconds_histogram{provider, chain}             histogram
#   rpc_call_total{provider, chain, result}                         counter
#   rpc_health{provider, chain}                                     gauge (0|1)
#   rpc_archive_depth_supported{provider, chain, depth}             gauge (0|1)
#
# Each "provider" below is one public no-key RPC service. The chain
# dimension above filters every PromQL query to the active tab. The
# All chains tab aggregates across chains where the provider is
# present (so universal providers like PublicNode + dRPC compare
# meaningfully against chain-specialists like base-official + binance).

providers:
  - slug: publicnode
    name: PublicNode
    tag: Allnodes-operated, 70+ chains, archive on most
    formula: "Mean over its measured chains and 3 regions of per cell 24h p50 round-trip latency (ms) for `eth_getBlockByNumber` sent every 60s to PublicNode's no-key endpoint. Successful calls only; failures show in the Success column."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    tag: Decentralized RPC mesh, consensus-checked
    formula: "Mean over its measured chains and 3 regions of per cell 24h p50 round-trip latency (ms) for `eth_getBlockByNumber` sent every 60s to dRPC's decentralized mesh. Successful calls only; failures show in the Success column."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc"}) / sum(ocb:rpc_call:rate_24h{provider="drpc"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", region="sgp"}[1h])

  - slug: 1rpc
    name: 1RPC
    tag: Privacy-preserving gateway by Automata Network
    formula: "Mean over its measured chains and 3 regions of per cell 24h p50 round-trip latency (ms) for `eth_getBlockByNumber` sent every 60s to 1RPC's Automata gateway. Successful calls only; failures show in the Success column."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="1rpc"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="1rpc"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="1rpc"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="1rpc"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="1rpc"}) / sum(ocb:rpc_call:rate_24h{provider="1rpc"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="1rpc"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="1rpc"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="1rpc", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="1rpc", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="1rpc", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="1rpc", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="1rpc", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="1rpc", region="sgp"}[1h])

  - slug: meowrpc
    name: MeowRPC
    tag: Free public RPC, no registration
    formula: "Mean over ETH + Arbitrum and 3 regions of per cell 24h p50 round-trip latency (ms) for `eth_getBlockByNumber` sent every 60s to MeowRPC's no-key endpoint. Successful calls only; failures show in the Success column."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="meowrpc"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="meowrpc"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="meowrpc"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="meowrpc"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="meowrpc"}) / sum(ocb:rpc_call:rate_24h{provider="meowrpc"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="meowrpc"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="meowrpc"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="meowrpc", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="meowrpc", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="meowrpc", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="meowrpc", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="meowrpc", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="meowrpc", region="sgp"}[1h])

  - slug: flashbots
    name: Flashbots
    tag: Private-mempool RPC, anti-sandwich
    formula: "Mean across 3 regions of the 24h p50 round-trip latency (ms) for `eth_getBlockByNumber` sent every 60s to the Flashbots Protect read proxy. Ethereum only; successful calls only, failures show in the Success column."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="flashbots"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="flashbots"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="flashbots"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="flashbots"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="flashbots"}) / sum(ocb:rpc_call:rate_24h{provider="flashbots"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="flashbots"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="flashbots"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="flashbots", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="flashbots", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="flashbots", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="flashbots", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="flashbots", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="flashbots", region="sgp"}[1h])

  - slug: cloudflare
    name: Cloudflare
    tag: Permissioned-mode for many JSON-RPC methods
    formula: "Mean across 3 regions of the 24h p50 round-trip latency (ms) for `eth_getBlockByNumber` sent every 60s to cloudflare-eth. Ethereum only; successful calls only, so the fast p50 hides the jsonrpc_err share shown in the Success column."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="cloudflare"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="cloudflare"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="cloudflare"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="cloudflare"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="cloudflare"}) / sum(ocb:rpc_call:rate_24h{provider="cloudflare"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="cloudflare"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="cloudflare"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="cloudflare", region="us-east"})
