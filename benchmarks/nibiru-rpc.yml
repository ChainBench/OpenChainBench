# OpenChainBench. Bench № 179

slug: nibiru-rpc
number: "179"
title: "Nibiru RPC endpoints: free public URLs by latency"
seo_title: "Nibiru RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Nibiru RPC at {{best_p50}} (Tendermint status p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for the Tendermint status method against every free, no-key public Nibiru Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Nibiru (cataclysm-1) is a high-throughput Cosmos SDK blockchain supporting both CosmWasm and EVM smart contracts, NIBI staking token, using CometBFT consensus with sub-second block times. This bench covers the Tendermint RPC path. Polkachu, PublicNode, and the Nibiru Foundation provide keyless Tendermint RPC endpoints probed every 60 seconds from three regions.

abstract: |
  Nibiru: {{count}} free public RPC endpoints answering `status` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:nibiru-official}}.
  We measure the round-trip latency of a single, identical Cosmos SDK call (Tendermint `status`) against every no-key public Nibiru endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Nibiru-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"status\",\"params\":[]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Nibiru-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"nibiru\"`. Provider coverage today: {{count}} no-key endpoints."


source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="nibiru"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: polkachu
    name: Polkachu
    endpoint: https://nibiru-rpc.polkachu.com
    tag: Community Cosmos validator and public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Polkachu's no-key Nibiru endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="nibiru"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="polkachu", chain="nibiru"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="polkachu", chain="nibiru"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="polkachu", chain="nibiru"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="polkachu", chain="nibiru"}) / sum(ocb:rpc_call:rate_24h{provider="polkachu", chain="nibiru"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="polkachu", chain="nibiru"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="nibiru"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="nibiru", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="nibiru", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="nibiru", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="nibiru", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="nibiru", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="nibiru", region="sgp"}[1h])
  - slug: publicnode
    name: PublicNode
    endpoint: https://nibiru-rpc.publicnode.com:443
    tag: Non-profit public RPC by Allnodes
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Nibiru endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="nibiru"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="nibiru"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="nibiru"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="nibiru"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="nibiru"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="nibiru"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="nibiru"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="nibiru"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="nibiru", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="nibiru", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="nibiru", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="nibiru", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="nibiru", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="nibiru", region="sgp"}[1h])
  - slug: nibiru-official
    name: Nibiru Foundation
    endpoint: https://rpc.nibiru.fi:443
    tag: Official Nibiru Foundation public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to the Nibiru Foundation's no-key endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nibiru-official", chain="nibiru"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="nibiru-official", chain="nibiru"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="nibiru-official", chain="nibiru"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="nibiru-official", chain="nibiru"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="nibiru-official", chain="nibiru"}) / sum(ocb:rpc_call:rate_24h{provider="nibiru-official", chain="nibiru"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="nibiru-official", chain="nibiru"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="nibiru-official", chain="nibiru"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nibiru-official", chain="nibiru", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="nibiru-official", chain="nibiru", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nibiru-official", chain="nibiru", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="nibiru-official", chain="nibiru", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nibiru-official", chain="nibiru", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="nibiru-official", chain="nibiru", region="sgp"}[1h])
