# OpenChainBench. Bench No 285

slug: katana-rpc
number: "285"
title: "Katana RPC endpoints: free public URLs by latency"
seo_title: "Katana RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Katana RPC at {{best_p50}} (`eth_getBlockByNumber` p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for the `eth_getBlockByNumber(\"latest\", false)` method against every free, no-key public Katana EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Katana is an EVM L2 (chain 747474) aimed at DeFi, reachable through {{count}} keyless endpoints. The 2026-10-07 sweep found the widest usable roster of any chain added that day alongside 0G and TAC: the Katana official RPC (rpc.katana.network), a Tenderly gateway (katana.gateway.tenderly.co), dRPC (katana.drpc.org) and Thirdweb (747474.rpc.thirdweb.com). All four returned chain id 0xb67d2 on the audit. Carrying both a managed gateway and a routing pool is unusual at this size, and it makes the per-region comparison worth reading: a managed gateway and a routing pool answer the same call very differently depending on where the request starts.

abstract: |
  Katana: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:katana-official}}.
  We measure the round-trip latency of a single, identical JSON-RPC call (`eth_getBlockByNumber(\"latest\", false)`) against every no-key public Katana endpoint that sustains continuous probing, {{count}} providers measured, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a Katana-scaled staleness gap (20 blocks at Katana's ~1 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Katana-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\", false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. The request id rotates, but that does not guarantee a cache miss: many caches normalise `id` away. Measured 2026-10-08, fixed and rotating ids answer within 2 to 4 percent of each other."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the exclusion rules follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Katana-scoped view of the same harness."
  - "Roster: every endpoint here answered a real `eth_getBlockByNumber` call without a key on the 2026-10-07 sweep before being added to the probe matrix. An endpoint that needs a key, region-blocks us or rate-limits below the 60-second cadence is excluded rather than listed with an asterisk."
  - "Chain scope: every query on this page is pinned to `chain=\"katana\"`. Provider coverage: {{count}} no-key endpoints."

faq:
  - q: "Which Katana RPCs work without an API key?"
    a: "{{declared_count}} endpoints are probed on this chain: Katana (rpc.katana.network), Tenderly (katana.gateway.tenderly.co), dRPC (katana.drpc.org), Thirdweb (747474.rpc.thirdweb.com). Every listed endpoint was live-verified with a `eth_getBlockByNumber` call returning a parsable response before inclusion."
  - q: "How is Katana RPC latency measured here, technically?"
    a: "One identical `eth_getBlockByNumber` call every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest."
  - q: "Why does Katana have both a Tenderly gateway and dRPC?"
    a: "They are different shapes of infrastructure answering the same call. Tenderly fronts its own nodes behind a managed gateway; dRPC routes to a pool of third-party nodes. Both are keyless on Katana, which is rare, and the region tabs are where the difference shows: a managed gateway tends to hold a tighter distribution while a routing pool can win on median from one origin and lose badly from another."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="katana"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: katana-official
    name: Katana
    endpoint: https://rpc.katana.network
    tag: Katana official public RPC endpoint for Katana mainnet
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Katana's no-key katana RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="katana-official", chain="katana"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="katana-official", chain="katana"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="katana-official", chain="katana"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="katana-official", chain="katana"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="katana-official", chain="katana"}) / sum(ocb:rpc_call:rate_24h{provider="katana-official", chain="katana"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="katana-official", chain="katana"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="katana-official", chain="katana"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="katana-official", chain="katana", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="katana-official", chain="katana", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="katana-official", chain="katana", region="eu-west"})
