# OpenChainBench. Bench № 005

slug: network-coverage
number: "005"
title: Most networks supported by data provider
seo_title: Onchain data provider with the most networks supported - GeckoTerminal, Codex & Mobula live benchmark
subtitle: Number of blockchains each major onchain data provider officially supports. Higher is better.
category: Data
status: live
metric: Networks supported
unit: count
higher_is_better: true

abstract: |
  We benchmark how many networks each major onchain data provider lists
  in its public "supported networks" endpoint. The harness fetches the
  official listing every six hours from GeckoTerminal, Codex and Mobula,
  deduplicates by chain id and counts. Mainnet only. testnets are
  excluded because providers list them inconsistently and the comparison
  is meant to reflect what a builder can integrate against in production.
  Coverage breadth is one dimension of a data provider's product, not a
  ranking on quality. Latency, freshness and metadata completeness are
  measured separately by benches № 001 and № 004.

methodology:
  - "Source: each provider's public supported-networks endpoint."
  - "GeckoTerminal: GET /api/v2/networks (paginated, no auth)."
  - "Codex: GraphQL `getNetworks` query at https://graph.codex.io/graphql with an official API key."
  - "Mobula: GET /api/1/blockchains with an Authorization API key."
  - "Cadence: full refresh every 6 hours."
  - "Counting: a provider's network is counted once per unique chain id; mainnet only."
  - "Failures (network errors, rate limits, auth errors) leave the previous count in place and increment a fetch_errors counter. the page falls back to its last successful sample."

findings: []

source: https://github.com/OpenChainBench/OpenChainBench/tree/main/harnesses/network-coverage

prometheus:
  url: https://prometheus-production-0859.up.railway.app
  window: 24h

# Real metrics exposed by the network-coverage harness:
#   networks_supported_total{provider="geckoterminal"|"codex"|"mobula"}
#     -> gauge, the unique-chain count from the latest successful refresh.
#   network_supported{provider, chain_id, slug, name} -> gauge (1 per
#     network; useful for diff queries on the site if we add a
#     "missing chains" panel later).

providers:
  - slug: geckoterminal
    name: GeckoTerminal
    tag: CoinGecko's DEX index
    queries:
      p50: networks_supported_total{provider="geckoterminal"}
      p90: networks_supported_total{provider="geckoterminal"}
      p99: networks_supported_total{provider="geckoterminal"}
      mean: networks_supported_total{provider="geckoterminal"}
      success: clamp_max(networks_supported_total{provider="geckoterminal"} > bool 0, 1)
      sample_size: networks_supported_total{provider="geckoterminal"}
      series: networks_supported_total{provider="geckoterminal"}

  - slug: codex
    name: Codex
    tag: Defined.fi data API
    queries:
      p50: networks_supported_total{provider="codex"}
      p90: networks_supported_total{provider="codex"}
      p99: networks_supported_total{provider="codex"}
      mean: networks_supported_total{provider="codex"}
      success: clamp_max(networks_supported_total{provider="codex"} > bool 0, 1)
      sample_size: networks_supported_total{provider="codex"}
      series: networks_supported_total{provider="codex"}

  - slug: mobula
    name: Mobula
    tag: Aggregator + intent layer
    queries:
      p50: networks_supported_total{provider="mobula"}
      p90: networks_supported_total{provider="mobula"}
      p99: networks_supported_total{provider="mobula"}
      mean: networks_supported_total{provider="mobula"}
      success: clamp_max(networks_supported_total{provider="mobula"} > bool 0, 1)
      sample_size: networks_supported_total{provider="mobula"}
      series: networks_supported_total{provider="mobula"}
