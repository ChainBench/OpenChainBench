    tag: World Chain → any chain, VAA finality after OP Stack sequencer block
    formula: "50th percentile over 24h of Wormhole VAA finalization latency for VAAs emitted from World Chain: wall-clock delta from source-chain observation to Guardian quorum, indexed via wormholescan."
    queries:
      p50: histogram_quantile(0.50, sum by(le) (rate(wormhole_vaa_latency_milliseconds_bucket{source_chain="world-chain"}[24h])))
      p90: histogram_quantile(0.90, sum by(le) (rate(wormhole_vaa_latency_milliseconds_bucket{source_chain="world-chain"}[24h])))
      p99: histogram_quantile(0.99, sum by(le) (rate(wormhole_vaa_latency_milliseconds_bucket{source_chain="world-chain"}[24h])))
      mean: sum(rate(wormhole_vaa_latency_milliseconds_sum{source_chain="world-chain"}[24h])) / sum(rate(wormhole_vaa_latency_milliseconds_count{source_chain="world-chain"}[24h]))
      sample_size: increase(wormhole_vaa_seen_total{source_chain="world-chain"}[24h])
      series: histogram_quantile(0.50, sum by(le) (rate(wormhole_vaa_latency_milliseconds_bucket{source_chain="world-chain"}[1h])))

