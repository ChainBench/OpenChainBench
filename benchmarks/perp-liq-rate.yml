  - slug: nado
    name: Nado
    tag: Ink orderbook; 24h figure is a cumulative counter delta, no per-event detail
    formula: "Difference of cumulative_liquidation_amounts between the newest and oldest of 25 hourly archive snapshots (x18 USD), over peak 24h OI from the same snapshots, as a percentage."
    queries:
      p50: last_over_time(perp_liq_rate_24h_pct{venue="nado"}[1h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="nado"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="nado"}[24h])
      mean: last_over_time(perp_liq_rate_24h_pct{venue="nado"}[1h])
      success: avg_over_time(perp_liq_health{venue="nado",chain=~".*"}[24h])
      sample_size: count_over_time(perp_liq_rate_24h_pct{venue="nado"}[24h])
      ranked: min_over_time(perp_liq_ranked{venue="nado"}[1h])
      series: perp_liq_rate_24h_pct{venue="nado"}

  - slug: ostium
    name: Ostium
    tag: Arbitrum synthetics; LiquidationExecuted events from the public subgraph
    formula: "24h sum of the liquidated trade's notional (6-decimal USD) over tradeEvents of type LiquidationExecuted, over peak 24h OI ((longOI + shortOI) x lastTradePrice), as a percentage."
    queries:
      p50: last_over_time(perp_liq_rate_24h_pct{venue="ostium"}[1h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="ostium"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="ostium"}[24h])
      mean: last_over_time(perp_liq_rate_24h_pct{venue="ostium"}[1h])
      success: avg_over_time(perp_liq_health{venue="ostium",chain=~".*"}[24h])
      sample_size: count_over_time(perp_liq_rate_24h_pct{venue="ostium"}[24h])
      ranked: min_over_time(perp_liq_ranked{venue="ostium"}[1h])
      series: perp_liq_rate_24h_pct{venue="ostium"}

  - slug: aevo
    name: Aevo
    tag: OP Stack rollup perps; no reachable public liquidation feed
    unranked: "No liq feed"
    formula: "No rate. OI from GET /statistics?asset=X&instrument_type=PERPETUAL, open_interest.total x mark_price, with daily_volume as the 24h notional."
    queries:
      p50: last_over_time(perp_liq_rate_24h_pct{venue="aevo"}[1h])
      success: avg_over_time(perp_liq_health{venue="aevo",chain=~".*"}[24h])
      series: perp_liq_rate_24h_pct{venue="aevo"}
