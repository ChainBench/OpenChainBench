prometheus:
  window: 24h
  expected_freshness_seconds: 1800
  freshness_metric: perp_liq_last_refresh_timestamp_seconds

faq:
  - q: "What is the liquidation rate and why does it matter?"
    a: "It is the share of a venue's book closed by force over 24 hours: liquidated notional divided by the peak open interest across the same day. For a trader it says how much of the book the venue's risk engine is closing, which bears on how large a margin buffer a position needs to survive a volatile session. For anyone providing liquidity to a vault-backed venue it bears on how often the vault is on the other side of a forced close."
  - q: "Why is the ranked field smaller than the cohort?"
    a: "Because the venues do not agree on what a liquidation is, and a single ranked column would imply they do. dYdX labels a fill LIQUIDATED only on its dedicated liquidation path and returned one such fill on ETH over the 24 hours to 2026-09-27. Paradex's tape returned none. Hyperliquid's ETH feed returned 22 events against 693 on BTC. A row ranks only when its figure is a flow (10,000 dollars or more, no single event over half) between 0.01% and 3% of the venue's own traded notional."
  - q: "Why 0.01% to 3% of traded notional, and why the size gates?"
    a: "The band is where a perp venue's liquidation flow sits, and traded notional is a denominator nearly every venue publishes (GMX's from the same squid as its liquidations, Gains' from the same contract logs), so it cancels venue size. On 2026-09-27: Hyperliquid 0.17% on BTC and 0.93% on SOL, Aster 0.18% and 0.09%, Lighter 0.024% and 0.018%, GMX v2 2.02% on BTC. The size gates exist because a share cannot tell a flow from an event: Ostium BTC sat inside the band on 338 dollars from one close."
  - q: "Why does Gains read so much higher than the rest?"
    a: "Because the reading is right and the venue is different. Gains allows up to 200x, so a position is liquidated on a move of well under a percent and a liquidation carries the full leveraged notional. On 2026-09-28, a day ETH fell 2.8%, it liquidated 27.3M dollars on ETH from a peak book of 43.7M, 62% of the book, while the traders behind all 84 liquidations lost 423k of collateral at a median 73x. The two encodings of position size in each event agree to 0.02%."
  - q: "Is the rate the money traders lost?"
    a: "No. It is the share of the book closed by force, counted in notional, and not neutral to leverage: a 100x position counts at 100 times its margin, in the numerator and in open interest, so a 200x venue and a 20x one are two products on one column. Where a source exposes the position behind the fill (Gains on chain), collateral lost and median leverage publish beside the notional. Trade tapes and hourly buckets carry size and price only, so notional is the figure every venue can be measured on."
  - q: "Why does Aevo show no rate, and what changed for GMX v2?"
    a: "Aevo has no public liquidation feed: every liquidation path on its API 404s, its trade history endpoint is per-account, and no aggregator covers it. It is declared unranked and publishes open interest and 24h traded notional so the gap is visible rather than rendered as a zero. GMX v2 had a feed all along: this spec blamed Subsquid positionChanges for exposing no order type, true of that entity and false of tradeActions, whose orderType is 7 for a liquidation. GMX publishes a measured rate."
  - q: "Which venues were checked and left out?"
    a: "Pacifica, Extended and Backpack flag liquidations publicly, but only on a tape or stream that reaches back minutes, so a 5-minute poller cannot see a day; they need a persistent collector. ApeX Omni, GRVT, Vest and StandX expose no liquidation signal on any public endpoint. edgeX v2 publishes no public trade tape. Jupiter Perps' trades endpoint needs a wallet address and has no liquidation action. Drift is now Velocity, a fresh deployment holding a few thousand dollars of ETH and BTC."
  - q: "Why is the denominator the peak open interest of the day rather than the current figure or the mean?"
    a: "Because the numerator covers 24 hours, so the denominator has to describe the book that was there to be liquidated over those hours. Against the instant, Gains published 343% on 2026-09-24 as its open interest fell from 37M to 7.3M dollars while the numerator stood still. Against the mean it still read 251% on 2026-09-28, when its ETH book went from 43.7M to 2.1M because most of it was liquidated. The peak is the largest book observed, and above 100% is turnover; that day reads 62%."
  - q: "How is Lighter liquidation data obtained, and what was wrong with it?"
    a: "Lighter's own trades endpoint needs authentication, so the numerator comes from Coinalyze hourly liquidation buckets for Lighter's markets, in base units, converted at that hour's close price. The bug was in how the buckets were folded in: each hour was captured minutes after it opened, when it was nearly empty, and the dedup key then held that reading for a full day. Hours are now restated as they fill. The figure went from 887 dollars to roughly 44k on ETH."
  - q: "What does the warming up period mean?"
    a: "Every liquidation source backfills the full 24 hours on the first tick, so the numerator is complete from the start. The denominator depends on the venue. Gains reads its past open interest off the chain, so its curve is complete on the first tick and it never warms up. Every other venue publishes only the book it holds now, so its window needs twelve readings, an hour here, before a peak is worth dividing by; until then the rate is withheld."

dimensions:
  chain:
    - { value: ETH, label: ETH }
    - { value: BTC, label: BTC }
    - { value: SOL, label: SOL }

# The headline view is ETH, the same pin perp-fees uses, so the board
# compares one asset across venues instead of whichever series Prom
# returned first. Hyperliquid on 2026-09-23 read 0.50% on BTC and 0.12%
# on ETH, so this was a 4x difference decided by ordering.
aggregate_filters: { chain: ETH }
# The pin is injected into every query on the bench, including ones whose
# metric has no chain label: perp_liq_health is per venue, so an injected
# chain="ETH" matched nothing and nulled seven venues' success, which
# load.ts then reads as 100% healthy. Those selectors carry chain=~".*",
# which suppresses the injection (a selector already naming the label is
# left alone) and still matches series that have no chain label.
# perp_liq_ranked and every metric_panel below are per venue and per asset,
# so they take the pin and must not carry that escape hatch.

metric_panels:
  - id: liq_volume
    label: Liquidated 24h
    label_key: venue
    metric: perp_liq_volume_24h_usd{}
    unit: usd
    higher_is_better: false
    description: "The numerator: liquidated notional in USD over the trailing 24 hours, summed over the window the rate is built on. Absent for a venue with no liquidation feed."
  - id: collateral
    label: Collateral lost 24h
    label_key: venue
    metric: perp_liq_collateral_24h_usd{}
    unit: usd
    higher_is_better: false
    tab: false
    description: "The margin behind the liquidated positions: the money traders lost, not the notional closed. An annotation on the rows whose feed carries the position, not a ranking: only Gains publishes it today and six of the ten feeds cannot carry it. Gains: 39.5M of notional on 423k of collateral, 2026-09-28."
  - id: median_leverage
    label: Median leverage
    label_key: venue
    metric: perp_liq_median_leverage_x{}
    unit: x
    higher_is_better: false
    tab: false
    description: "Median leverage of the positions liquidated in the window, where this harness reads it, which today is Gains alone. An annotation, not a ranking: the rate above counts a 100x position at 100 times its margin, so two venues with similar rates and different leverage are not the same product."
  - id: oi_peak
    label: Peak OI 24h
    label_key: venue
    metric: perp_liq_open_interest_peak_24h_usd{}
    unit: usd
    higher_is_better: true
    description: "The denominator: the peak open interest in USD over the same 24 hours, one reading per 5-minute tick. The largest book the venue was observed holding, so a book liquidated away inside the day is still measured against the book it had. One side for an order book, long plus short for a pool venue."
  - id: oi_trough
    label: Trough OI 24h
    label_key: venue
    metric: perp_liq_open_interest_trough_24h_usd{}
    unit: usd
    higher_is_better: true
    description: "Smallest open interest in USD over the same 24 hours. Read it against the peak: when the two are far apart the peak and the mean describe different markets. Gains BTC ran from 49.94M dollars to 1.12M and back to 10.65M inside 2026-09-28."
  - id: oi_avg
    label: Mean OI 24h
    label_key: venue
    metric: perp_liq_open_interest_avg_24h_usd{}
    unit: usd
    higher_is_better: true
    tab: false
    description: "Mean open interest in USD over the same 24 hours, beside the peak. A wide gap between the two is a book that moved a lot inside the day, as Gains ETH did on 2026-09-28 (peak 43.7M, mean 10.9M)."
  - id: oi_now
    label: OI now
    label_key: venue
    metric: perp_liq_open_interest_usd{}
    unit: usd
    higher_is_better: true
    tab: false
    description: "Open interest in USD at the most recent tick, read natively per venue."
  - id: venue_volume
    label: Volume 24h
    label_key: venue
    metric: perp_liq_venue_volume_24h_usd{}
    unit: usd
    higher_is_better: true
    description: "The venue's own 24h traded notional for this market, from its own API (GMX from the same squid as its liquidations, Gains from the same contract logs). Blank for a venue that publishes none, which is why such a row cannot be tested and does not rank."
  - id: share_of_volume
    label: Share of volume
    label_key: venue
    metric: perp_liq_share_of_volume_pct{}
    unit: pct
    higher_is_better: false
    description: "Liquidated notional as a percentage of the venue's own 24h traded notional. Between 0.01 and 3 the figure is treated as a measurement and the row can rank. Below the floor it is an absence; above the ceiling it is not comparable to the field."
  - id: largest_event
    label: Largest event
    label_key: venue
    metric: perp_liq_largest_event_share_pct{}
    unit: pct
    higher_is_better: false
    description: "The largest single liquidation in the window as a percentage of the window total. Above 50 the row does not rank: the 24h figure is one position, not a flow. Blank for rows read from hourly buckets or a cumulative counter (Lighter, Aster, Nado), which carry no single event."

ledger_columns:
  - { label: "Liq rate", slot: p50 }
  - { label: "Liquidated 24h", panel: liq_volume }
  - { label: "Peak OI 24h", panel: oi_peak }
  - { label: "Trough OI 24h", panel: oi_trough }
  - { label: "Volume 24h", panel: venue_volume }
  - { label: "Share of vol", panel: share_of_volume, unit: pct }
  - { label: "Largest event", panel: largest_event, unit: pct }

providers:
  - slug: hyperliquid
    name: Hyperliquid
    tag: HyperBFT L1; 0xArchive feed covers every liquidation type
    formula: "24h sum of liquidated notional USD (0xArchive liquidations, all types) over peak 24h OI (openInterest x midPx from metaAndAssetCtxs), as a percentage. Window deduplicated by trade id."
    queries:
      p50: last_over_time(perp_liq_rate_24h_pct{venue="hyperliquid"}[1h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="hyperliquid"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="hyperliquid"}[24h])
      mean: last_over_time(perp_liq_rate_24h_pct{venue="hyperliquid"}[1h])
      success: avg_over_time(perp_liq_health{venue="hyperliquid",chain=~".*"}[24h])
      sample_size: count_over_time(perp_liq_rate_24h_pct{venue="hyperliquid"}[24h])
      ranked: min_over_time(perp_liq_ranked{venue="hyperliquid"}[1h])
      series: perp_liq_rate_24h_pct{venue="hyperliquid"}

  - slug: lighter
    name: Lighter
