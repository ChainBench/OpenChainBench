    queries:
      p50: avg_over_time(perp_liq_rate_24h_pct{venue="gmx"}[24h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="gmx"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="gmx"}[24h])
