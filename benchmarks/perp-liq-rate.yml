seo_intro: |
  Every perpetual futures platform closes a position when the margin behind
  it falls below the maintenance requirement. The liquidation rate, defined
  here as liquidated notional over 24 hours divided by the peak open
  interest over the same 24 hours, measures how much of the largest book a
  venue held that day was closed by force rather than by its owner.

  The hard part of this measurement is not the arithmetic, it is that the
  venues do not agree on what counts as a liquidation. Hyperliquid's feed
  covers every liquidation type including positions closed by market order.
  dYdX v4 labels a fill LIQUIDATED only when it came through the dedicated
  liquidation path, and over the 24 hours to 2026-09-27 that was one fill
  on ETH and one on BTC. Paradex's public tape carried no LIQUIDATION row
  at all over the same day, and its ETH book traded about 1.4M dollars.
  Gains, whose crypto pairs allow up to 200x, emits an explicit liquidation
  order type on chain; on 2026-09-27 two positions at 136x and 78x were 91%
  of its whole day, and in the cascade of 2026-09-28 its ETH book went from
  43.7M dollars to 2.1M with 27.3M liquidated.

  Every one of those figures is a correct reading of its own source, and
  they span four orders of magnitude as a share of each venue's own traded
  notional. So this bench states the source behind each row and ranks only
  the rows whose figure is a flow (at least 10,000 dollars, no single
  liquidation more than half of it) inside the band a perp venue's
  liquidation flow actually occupies. A venue whose feed reports nothing is
  published as reporting nothing, and never as the lowest rate on the board.

  Open interest is read natively per venue every 5 minutes and the rate
  divides by its peak over the same 24 hours the numerator covers:
  Hyperliquid metaAndAssetCtxs, Lighter orderBookDetails, dYdX v4 and
  Paradex REST, Aevo statistics, Gains trading-variables across every
  collateral of both deployments, GMX v2 from the gmxinfra markets endpoint.

abstract: |
  A Go exporter polls each venue every 5 minutes. Liquidation events are
  accumulated in a 24-hour sliding window keyed by event identity, so the
  same close is never counted twice. An aggregator that publishes hourly
  totals rather than events is folded in by restatement: each hour's key
  carries the newest figure for that hour, because an hour read while it is
  still open under-reports. Open interest and the venue's 24h traded
  notional are read fresh on each tick, and the rate divides by the peak
  open interest of the trailing 24 hours: the largest book the venue was
  observed holding, so the published rate moves with its numerator rather
  than with a denominator read at one instant, and a book that is liquidated
  away inside the window is still measured against the book it had. A figure
  above 100% is then turnover: positions opened after the peak reading, or
  opened and closed between two readings, count in the numerator without
  ever entering the denominator.

  perp_liq_rate_24h_pct = sum(liquidated_notional_usd, 24h) /
  max(one_sided_open_interest_usd, 24h) * 100. The page's headline is the
  latest reading of that gauge, not a further average of it.

  Beside the rate, and separately from it, the harness publishes what a forced
  close costs the trader where the feed carries the position behind the fill.
  For each close: the loss at trigger, the share of margin returned, and the
  forfeited share, which is 100 minus the other two *for that close*. Each is
  then published as a median over the window, so the three medians are
  independent and do not add to 100.

  Every one of those is computed inside a leverage band, and the venue-level
  medians over closes between 10x and 100x only, because the forfeit grows with
  leverage and the venues sell different ranges: comparing a venue whose median
  liquidated position is 91x against one at 45x otherwise reports which sells
  more leverage. The forfeited share also holds the closing fee, the funding and
  the rollover, which a trader pays on any close, so
  perp_liq_fee_and_carry_pct itemises that part wherever the feed separates it.
  perp_liq_margin_destroyed_share_pct answers the same question as the notional
  rate in money instead of notional, and so cancels leverage rather than
  scaling with it.

  Three of the eleven venues carry these quantities; the other eight publish no
  series at all rather than a 0.0% that would read as a venue forfeiting none of
  its traders' margin. A feed of hourly aggregates is not comparable to a feed
  of events on any per-position figure, and Lighter, Aster and Nado are
  aggregates: they are absent here and their largest-event share is left blank
  for the same reason.

  perp_liq_ranked is 1 when the row takes a rank. It reads 0 when the venue
  has no liquidation feed, when a fetch failed, when a page cap cut a read
  short and the unread edge is still inside the window, for the first hour
  after a restart while the denominator fills, when no liquidation was
  observed at all, when less than 10,000 dollars was liquidated, when one
  liquidation is more than half of the figure, when the venue publishes no
  24h notional to test the figure against, or when
  perp_liq_share_of_volume_pct falls outside 0.01% to 3%. Fetch failures
  leave the previous gauges unchanged and increment
  perp_liq_fetch_errors_total; the health gauge drops to 0.

methodology:
  - "Cadence: every 5 minutes, in parallel across all venue and asset pairs. Numerator: liquidation events are held in a 24-hour window keyed by event identity: a trade, order or event id where the venue issues one, or transaction hash plus log index on chain. Events older than 24 hours are dropped each tick. Every fetch re-asks for the previous two hours as well, so a row an indexer ingests late is still picked up; the key set makes the repeat free."
  - "Aggregator buckets are restated, not deduplicated. An hourly total read while its hour is still open is smaller than the hour's final figure, so each hour's key carries the newest reading. Freezing the first reading is what made Lighter publish 887 dollars against 185.6M of ETH volume until 2026-09-27."
  - "Open interest is the notional that could have been force-closed, read differently per venue kind. An order book (Hyperliquid, dYdX, Paradex, Lighter, Aster, Orderly, Nado) reports one side, because longs and shorts match. A pool venue (GMX v2, Gains, Ostium) reports long and short separately against its vault and the two are independent, so both count. Halving the pool figure, as this did until 2026-09-28, put the rate over 100% on an unbalanced book with no turnover."
  - "Headline: the latest trailing-24h reading. Averaging a trailing-24h gauge over a further 24h would weight two days and peak a day late, so p50 and mean are last_over_time over the past hour; p90 and p99 keep the day's range. perp_liq_newest_event_age_seconds says how long ago each row's feed last reported a liquidation."
  - "Denominator: the peak open interest over the same 24 hours, with the mean and the trough beside it. The peak, because the numerator is everything force-closed in the window and the book it came from is the largest one held: an instant moves with open interest rather than liquidations, and a mean is dragged down by the collapse it is measuring. The trough publishes alongside, because a book that ran from 49.94M dollars to 1.12M in a day is two markets."
  - "Where the open-interest series comes from decides whether it is right. Gains is read from the chain: the diamond emits PairOiAfterV10Updated on every open and close carrying the post-state book per collateral, so one pass of the scan gives the whole curve at every change, seeded at the window edge and needing no warm-up. Every other venue publishes only the book it holds now, so its curve is still accumulated one reading per tick and its peak is only as old as the process."
  - "That distinction was worth 15x. On 2026-09-28 the accumulated window gave Gains ETH a peak of 2.72M dollars, every reading having been taken after the cascade, and the bench published 952%. The reconstruction gives the 43.54M the venue held, so 27.29M of liquidations reads 63%. On BTC the accumulated peak understated the book 4.6x and 211% becomes 25%. Two independent reconstructions agree with the API to five figures."
  - "Historical open interest is valued at historical prices, and how exactly depends on the collateral. The quantities come from the events; the price comes from the collateralPriceUsd the contract stamps on its own execution events, nearest at or before each reading, falling back to the current price when nothing earlier is held. Of the collaterals Gains runs, the stablecoins (USDC and DAI on Arbitrum) are exact either way, while a WETH, GNS or BtcUSD book is as good as the nearest execution to it."
  - "Ranking: a row ranks only when at least 10,000 dollars was liquidated, no single liquidation is more than half of the figure (rows with per-event detail), and the figure is between 0.01% and 3% of the venue's own 24h traded notional, from the venue's API or, for GMX and Gains, the same indexer or contract logs as the liquidations. Published per row as perp_liq_share_of_volume_pct and perp_liq_largest_event_share_pct; perp_liq_ranked carries the verdict."
  - "What the rate is and is not. It is the share of a venue's book closed by force, in notional. It is not the money traders lost, and not neutral to leverage: a 100x position counts at 100 times its margin, in the numerator and in open interest. On 2026-09-28 Gains liquidated 39.5M dollars of notional on 423k of collateral at a median 73x. The money itself is published separately, as the three shares below, wherever the feed carries the position behind the fill."
  - "The three shares. Per forced close: the margin behind the position, the share of it the price had taken when the venue closed, and the share that went back. The forfeited share is 100 minus those two for that close, the margin destroyed in excess of the loss the trader incurred. All three publish as medians, so they are three independent medians and do not add to 100. perp_liq_forfeit_events says how many closes are behind them."
  - "Every cross-venue figure is computed inside a leverage band: the forfeit grows with leverage and the venues sell different ranges. Gains' median forfeit runs 10.5 points under 5x to 41.3 above 200x, and 45% of its liquidations are above 100x against GMX's 2%. So the venue-level medians cover 10x to 100x, where all three liquidate (Gains 418 closes, GMX 968, Ostium 366). The full curve publishes per band with its own count; a band a venue does not trade has no series."
  - "The forfeited share is not a penalty on its own. All three venues define their loss as the price move times the leverage, so the forfeit also holds the closing fee, the funding and the rollover, costs the trader did incur. perp_liq_fee_and_carry_pct itemises that part where the feed can: GMX separates positionFeeAmount, borrowingFeeAmount and fundingFeeAmount from its liquidationFeeAmount, Ostium carries five fee fields. The Gains event has no fee word, so its cell is blank."
  - "Three of the eleven venues carry all three: Gains reads percentProfit and amountSentToTrader off the LimitExecuted log, GMX v2 initialCollateralDeltaAmount, basePnlUsd and pnlUsd off its squid, Ostium profitPercent, amountSentToTrader and the linked trade's collateral off its subgraph. The other eight publish nothing rather than 0.0%, which would read as forfeiting none of a trader's margin: seven have a feed with no position in it, Aevo has no feed."
  - "Two blanks, told apart. A venue that can read the position and saw no forced close in the window publishes perp_liq_forfeit_events = 0 with no medians, because there is nothing to take a median of. A venue whose feed cannot read the position publishes no series at all, count included. Ostium is regularly the first case: it liquidated one BTC position in the 24h to 2026-09-29 and none on ETH or SOL."
  - "The same objection applies to the notional rate and the share of volume beside it. Both are notional over notional, so they scale with the leverage a venue sells: at a median 91x Gains is measured against a venue whose traders sit near 45x. perp_liq_margin_destroyed_share_pct is the leverage-neutral companion, margin destroyed over the margin behind every position the venue closed. Both halves are money the trader posted, so leverage cancels."
  - "Why the size gates exist: on 2026-09-28 Ostium BTC sat inside the band at 0.458% on 338 dollars from a single liquidation, above Hyperliquid and GMX, while dYdX BTC sat outside it on 537 dollars from a single liquidation. A share of volume cannot tell a flow from an event; the notional floor and the largest-event ceiling can."
  - "Rows outside the gate keep every figure they measured and sit below the ranked field. Nothing is hidden and nothing is estimated to fill a gap. An exact zero never ranks either: a zero reads the same whether the venue liquidated nothing or its feed returned nothing, so it is published as an observation and not as a best value."
  - "The rate is withheld, not merely unranked, when the gate's reason means the ratio describes nothing: one liquidation being most of the window, no notional to test it against, an open-interest window shorter than the numerator, or a failed read. Every input still publishes. Both windows survive a restart in a JSON file on a mounted volume, since open interest cannot be backfilled: without it a redeploy divided 24h of liquidations by the peak of the minutes since boot, and Gains ETH read 952%."
  - "Page caps. The tapes that page newest first (dYdX, Paradex, Orderly, the Ostium subgraph, the GMX squid) hand over what they read when a cap stops them short of the window, with the oldest row reached. The rows count, the high-water mark advances so the next request fits, and the row does not rank until the unread edge has aged out of the window. Repeating a request that did not fit would lock the pair out while the tape stayed busy. 0xArchive keeps the refusal: its cap is 29 busy BTC days."
  - "A venue with no 24h traded notional of its own cannot be tested and is not ranked. Gains was the case until 2026-09-28: its trading-variables payload carries open interest per pair and no volume. Its notional is now summed from the diamond's own execution logs, see below."
  - "Hyperliquid: OI and 24h notional from POST /info {type:metaAndAssetCtxs} (openInterest x midPx, dayNtlVlm). Liquidations from 0xArchive GET /v1/hyperliquid/liquidations/{coin} with cursor pagination. Without OXARCHIVE_API_KEY the row publishes no rate at all: the HLP vault fallback sees backstop liquidations only, a knowably partial numerator, and the same rule that keeps Lighter and Aster silent without a Coinalyze key applies."
  - "The band caught the reference feed itself. On 2026-09-27 0xArchive returned 22 ETH liquidations in 24h, one page with no cursor, the most recent nine hours stale, against 693 on BTC and 569 on SOL over the same window and on a comparable book. 25,834 dollars on 505.7M of ETH volume is 0.005%, below the floor, so the ETH row publishes and does not rank."
  - "dYdX v4: OI, oracle price and volume24H from GET /v4/perpetualMarkets. Liquidations from GET /v4/trades/perpetualMarket/{ticker} paged backwards, keeping type == LIQUIDATED; notional = size x price. Verified by paging the full 24h tape on 2026-09-27: one fill on ETH at 466.93 dollars, one on BTC at 16.92, ten on SOL totalling 5,024.62."
  - "Paradex: OI, mark price and volume_24h from GET /v1/markets/summary. Liquidations from GET /v1/trades paged by cursor, keeping trade_type == LIQUIDATION. Over the full 24h to 2026-09-27 the ETH and BTC tapes carried none: 354 and 3,677 rows, all FILL, RPI, BLOCK_TRADE or UNWIND_TRANSFER."
  - "Lighter: OI, mark price and daily_quote_token_volume from GET /api/v1/orderBookDetails?filter=perp. Liquidations from Coinalyze /v1/liquidation-history hourly buckets (symbols 0.T for ETH, 1.T for BTC), in base units, converted at Hyperliquid's hourly close for that hour, since the aggregator publishes no price and Lighter's own candles are not public. Requires COINALYZE_API_KEY."
  - "Gains: liquidations from eth_getLogs on the gTrade diamond on Arbitrum and Base, keeping LimitExecuted logs whose orderType is LIQ_CLOSE (6). Notional = collateralAmount / 10^decimals x leverage / 1e3 x collateralPriceUsd / 1e8; the TradeClosed shape this spec once named is not emitted. The decode is self-checking: the event encodes the position twice, both in collateral units, and a log whose encodings differ by over 5% is refused. Six real logs are pinned."
  - "Gains traded notional comes off the same diamond scan as its liquidations, per pair: MarketExecuted and LimitExecuted legs at full notional plus executed resizes at their delta, the backend's own auto-plus-direct perimeter, validated on the complete UTC day 2026-09-27 at 79% of the venue. The scan runs once per deployment per tick from a block cursor, and each log is placed on the clock by interpolating between the headers at both ends of the range."
  - "The Gains row is the Arbitrum and Base deployments, and all three of its figures are read on that perimeter: liquidations, open interest and traded notional. It is internally consistent and smaller than the venue, which also trades on Polygon, MegaETH and ApeChain. Comparing it with a venue-level figure needs the same day as well: by the venue's own backend 2026-09-27 was 34.76M dollars and 2026-09-28, a cascade day, 210.8M."
  - "Gains open interest reads oiLongCollateral and oiShortCollateral across every collateral of both deployments, each at its own decimals and USD price, so open interest held in WETH or GNS is not counted at face value, and sums long plus short as the trader legs outstanding against the vault."
  - "GMX v2: OI from arbitrum-api.gmxinfra.io/markets/info, openInterestLong plus openInterestShort over every listed market, at 30 decimals. Liquidations from the public Subsquid squid: tradeActions with orderType 7, pinned to eventName OrderExecuted because every liquidation also appears as OrderCreated. This spec said until 2026-09-27 that no source existed because positionChanges exposes no orderType; that is true of positionChanges and false of tradeActions."
  - "GMX's volume denominator is summed from the same squid, over executed tradeActions with orderType 2 or above, which excludes the plain swap types. Numerator and denominator therefore carry one definition. Cached for 15 minutes because the query pages over a few thousand rows."
  - "Aster: liquidations from Coinalyze hourly buckets for Aster's markets, in base units, converted at Hyperliquid's hourly close for that hour. Aster's own allForceOrders history endpoint answers that it is out of maintenance, forceOrders is per-account, and the public forceOrder websocket carries no history and drops every few minutes, so a 5-minute poller cannot use it. OI and 24h notional from the futures gateway."
  - "Ostium: liquidations from tradeEvents of type LiquidationExecuted on the Ormi subgraph, the venue's only data surface. The size, the collateral and the leverage come off the linked trade, because the event's own notional, collateralDelta and leverage are null on a liquidation row. Its leverage is 1e2 fixed point, not the 1e3 Gains uses. Ostium is small: it liquidated nothing on any pair over the 24h to 2026-09-27 and 383 positions over 30 days. A zero does not rank."
  - "Orderly: liquidations from GET /v1/public/liquidated_positions, the only purpose-built public liquidation endpoint in the cohort that carries history; it takes a time range and pages. Filtering by symbol returns whole liquidated accounts, so only the leg on the requested market counts, at cost_position_transfer, which is already USD. OI, mark price and 24h_amount from /v1/public/futures. meta.total saturates at 500, so paging stops on a short page rather than on it."
  - "Nado: the archive publishes a cumulative liquidated-USD counter per product in its hourly snapshots rather than a tape, so the 24h figure is the difference between two snapshots, one number for the whole window, scaled to 24h by the span the snapshots actually cover. It is published, and because no per-event detail exists the largest-event panel is left blank for it rather than reading 100%. Traded notional and OI come from the same snapshot pair."
  - "Checked, feed present, not pollable: Pacifica (cause) and Extended (tT) flag liquidations on a public tape that reaches back only minutes, and Backpack publishes them on a websocket with no REST form, so all three need a persistent collector. Checked, no public signal: ApeX Omni, GRVT, Vest and StandX expose no liquidation flag on any public endpoint, only behind per-account authentication where it exists at all."
  - "Venues checked and left out, with the reason. edgeX: the v2 deployment has no public trade tape at all (every trades and liquidation path 404s) and the only websocket gateway serves the dead v1 contract ids. Jupiter Perps: /v1/trades requires a wallet address and its action enum has no liquidation value, so there is no venue-level feed. Drift: the venue is now Velocity, a fresh program deployment carrying single-digit thousands of dollars of ETH and BTC open interest."
  - "Aevo: OI from GET /statistics?asset=X&instrument_type=PERPETUAL, open_interest.total x mark_price, with daily_volume as the 24h notional. No public liquidation feed was reachable, so no rate is published and the row is declared unranked."
  - "Not apples to apples across the whole field, and the bench says so rather than implying otherwise. Open interest and traded notional are comparable everywhere. The liquidation definition is not, which is why the ranked field is a subset and every row carries its source."

findings:
  - "{{best_name}} records the lowest ranked liquidation rate at {{best_p50}}, on {{ranked_count}} ranked rows out of {{count}} in the cohort. The rest publish their figures below the field with the reason they are not ranked."
  - "{{name:hyperliquid}} reads {{p50:hyperliquid}} on ETH and does not rank there. Its 0xArchive feed returned 22 ETH liquidations worth 25,834 dollars over the 24h to 2026-09-27, against 693 on BTC worth 1.87M and 569 on SOL worth 2.00M, on ETH and BTC books of comparable size. The ETH coverage is short, so the row publishes without a rank. BTC and SOL rank."
  - "{{name:lighter}} reads {{p50:lighter}}. Until 2026-09-27 this row published 887 dollars of liquidations against 185.6M of ETH volume, because each hourly bucket was captured minutes after its hour opened and then frozen by the dedup key. Coinalyze was reporting 16.36 ETH over the same window, about 44k dollars."
  - "{{name:gains}} reads {{p50:gains}}. Since 2026-09-28 its traded notional is summed per pair from the same diamond logs as its liquidations, so the row goes through the same gate as every other. In the cascade of that day it liquidated 27.3M dollars on ETH against a peak book of 43.7M, 62% of the book, on 423k of collateral venue-wide at a median 73x: the notional is right (two encodings agree to 0.02%) and the leverage is why a 2.8% move clears most of a book."
  - "{{name:dydx}} does not rank on ETH or BTC. Paging the full 24h tape on 2026-09-27 returned one LIQUIDATED fill on each, 466.93 dollars and 16.92, against 54.97M and 7.24M of traded notional. The harness reproduced both to the cent, so the reading is right and it is not a rate: one fill is an event, and the gate now says so by name."
  - "{{name:paradex}} does not rank. Its public tape carried no LIQUIDATION row on ETH or BTC over a full 24 hours, and its ETH book traded 1.4M dollars against 14.9M of open interest. An exact zero off a working feed is published as an observation, not as the lowest rate."
  - "{{name:gmx}} joined the measured field on 2026-09-27. This spec had claimed no liquidation source existed for it; the public squid's tradeActions does carry the order type, and 103 executed liquidations totalling 900,656 dollars were found over the previous 24 hours."
  - "{{name:aster}} and {{name:ostium}} were added the same day. Aster reads {{p50:aster}} on ETH, at 0.18% of its own traded notional. Ostium's feed works on a book of 78k and 158k dollars; it liquidated nothing on 2026-09-27 and 338 dollars in one BTC position on 2026-09-28, which sat inside the volume band and ranked above Hyperliquid until the size gates were added. It publishes without a rank."
  - "{{name:orderly}} and {{name:nado}} were added the same day. Orderly reads {{p50:orderly}} on ETH off a purpose-built public liquidation endpoint with history, at 0.028% of its own traded notional. Nado's archive reports the day as one cumulative figure, 26,033 dollars on BTC and nothing on ETH, so its BTC row ranks and its ETH row publishes a zero without one."
  - "{{name:aevo}} publishes open interest and traded notional with no rate, because every liquidation path on its API 404s, its trade history is per-account and no aggregator covers it. It is declared unranked in the spec rather than dropped, so the gap is visible. edgeX, Jupiter Perps and Drift were checked and left out, with reasons in the methodology."
  - "The forfeited share is the figure a trader can act on, and it is not small. Measured on Gains across every pair on Arbitrum over the three days to 2026-09-29: 876 liquidations carrying a leverage, 865,543 dollars of margin, nothing returned on any of them, a median loss at trigger of 60.0% and so a median forfeit of 40.0 points. Four dollars in every ten that a liquidated Gains trader posted went somewhere other than their own loss."
  - "That 40.0 is not a cross-venue figure, because the forfeit grows with leverage and Gains sells more of it. Its own curve: 0-5x forfeits 10.5 points on 9 closes, 5-10x 28.0 on 54, 10-25x 29.2 on 119, 25-50x 31.3 on 111, 50-100x 41.3 on 188, 100-200x 40.0 on 151 and 200x+ 41.3 on 244. Its median liquidated position is 91x and 45% sit above 100x, against GMX's median 45x and 2%."
  - "So compare inside the range all three sell. GMX v2 over 7 days: 0-5x 1.4 points on 27 closes, 5-10x 4.0 on 30, 10-25x 6.3 on 176, 25-50x 15.0 on 482, 50-100x 24.1 on 310, 100-200x 27.6 on 21, nothing above 107x at all. Ostium over 30 days: 0-5x 26.1 on 5, 5-10x 7.9 on 10, 10-25x 4.9 on 71, 25-50x 12.3 on 84, 50-100x 22.0 on 211, 100-200x 28.0 on 2, nothing above 200x."
  - "Band for band, Gains still forfeits the most, and by a factor rather than a margin: 29.2 points against 6.3 and 4.9 at 10-25x, 31.3 against 15.0 and 12.3 at 25-50x, 41.3 against 24.1 and 22.0 at 50-100x. Restricted to 10x-100x the venue medians are Gains 32.8 points on 418 closes, GMX 16.0 on 968 and Ostium 18.3 on 366. The leverage mix accounts for 7.2 of the 24-point venue-level gap; the rest is the venue."
  - "The mechanism is the loss at trigger, and it runs the other way. At 10-25x Gains closes a position once the price has taken 70.8% of its margin, GMX at 85.1% and Ostium at 95.1%. Closing earlier leaves more margin on the table, and on Gains none of it goes back: its returned share is 0.00% on all 876 liquidations, while GMX pays a median 19.3% of margin back inside the same leverage range."
  - "The forfeit is not all penalty, and where the feed says so it is split. On GMX at 50-100x a median forfeit of 24.1 points is 19.7 of liquidation fee, 4.0 of trading fee, 0.0 of carry and 0.6 of price impact, so four fifths of it is the venue's own charge. On Ostium at the same band, 22.0 points holds 6.4 of itemised fees and 0.3 of carry. The Gains event carries no fee word at all, so its forfeit cannot be split from the event."
  - "Gains' own stop losses bound it instead, since a stop loss carries no liquidation penalty. Over the same three days and the same bands, its stop-loss forfeit runs 0.9 points at 0-5x, 2.0 at 10-25x, 8.0 at 50-100x and 20.6 above 200x, against liquidation forfeits of 10.5, 29.2, 41.3 and 41.3. The difference, 9.7 to 33.3 points depending on the band, is what liquidation costs over and above closing the same position voluntarily."
  - "The leverage-neutral rate says the same thing in money rather than notional. Margin destroyed over the margin behind every position the venue closed in the window: GMX v2 337,015 dollars of 30,945,285 over 7 days, 1.09%, and Ostium 54,920 of 3,984,471 over 30 days, 1.38%. Unlike the notional rate above, neither half counts a 100x position at a hundred times the money behind it."
  - "Twelve of those 602 stop losses returned nothing at all, so a zero payout is not by itself the signature of a liquidation; in aggregate they returned 116,089 dollars of 154,420, 75.2%, at a median loss at trigger of 24.3%."
  - "Each venue's decode was checked against the chain and not against this harness. Gains: in tx 0x427c242f a 200,228 dollar ETH position at 108.213x was closed 51.24% down, and the three USDC transfers in that transaction total the whole margin and every one goes to the vault, none to the trader. So that trader forfeited 48.76 points, 97,631 dollars, on top of what the move had cost them."
  - "GMX v2: the residual this harness computes as margin plus all-in P&L is the amount the pool actually paid out. In tx 0xee583c74 it predicts 8.6551 USDC and the transaction transferred 8.655363 to the liquidated account. Across the twelve largest liquidations of that day seven matched an on-chain transfer of exactly that amount and five were cross-chain orders paid to a GMX vault for the same amount. Ostium: in tx 0xfa67b49b the two USDC legs total the margin and both go to the vault."
  - "Ten of the 886 Gains liquidations carried a positive price return, the largest a long on pair 482 up 8.88% at 52.88x, closed as a liquidation with nothing returned. The word is read correctly (the price move times the leverage reproduces it on 120 of 120 rows) and the event is not a trader losing money to a move, so those rows keep their notional and stay out of the forfeited arithmetic. Left in, each would have contributed 569 points."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/perp-liq-rate

prometheus:
  window: 24h
  expected_freshness_seconds: 1800
  freshness_metric: perp_liq_last_refresh_timestamp_seconds

faq:
  - q: "What is the liquidation rate and why does it matter?"
    a: "It is the share of a venue's book closed by force over 24 hours: liquidated notional divided by the peak open interest across the same day. For a trader it says how much of the book the venue's risk engine is closing, which bears on how large a margin buffer a position needs to survive a volatile session. For anyone providing liquidity to a vault-backed venue it bears on how often the vault is on the other side of a forced close."
  - q: "Why is the ranked field smaller than the cohort?"
    a: "Because the venues do not agree on what a liquidation is, and a single ranked column would imply they do. dYdX labels a fill LIQUIDATED only on its dedicated liquidation path and returned one such fill on ETH over the 24 hours to 2026-09-27. Paradex's tape returned none. Hyperliquid's ETH feed returned 22 events against 693 on BTC. A row ranks only when its figure is a flow (10,000 dollars or more, no single event over half) between 0.01% and 3% of the venue's own traded notional."
  - q: "Why 0.01% to 3% of traded notional, and why the size gates?"
    a: "The band is where a perp venue's liquidation flow sits, and traded notional is a denominator nearly every venue publishes (GMX's from the same squid as its liquidations, Gains' from the same contract logs), so it cancels venue size. On 2026-09-27: Hyperliquid 0.17% on BTC and 0.93% on SOL, Aster 0.18% and 0.09%, Lighter 0.024% and 0.018%, GMX v2 2.02% on BTC. The size gates exist because a share cannot tell a flow from an event: Ostium BTC sat inside the band on 338 dollars from one close."
  - q: "Why does Gains read so much higher than the rest?"
    a: "Because the reading is right and the venue is different. Gains allows up to 200x, so a position is liquidated on a move of well under a percent and a liquidation carries the full leveraged notional. On 2026-09-28, a day ETH fell 2.8%, it liquidated 27.3M dollars on ETH from a peak book of 43.7M, 62% of the book, while the traders behind all 84 liquidations lost 423k of collateral at a median 73x. The two encodings of position size in each event agree to 0.02%."
  - q: "Is the rate the money traders lost?"
    a: "No. It is the share of the book closed by force, counted in notional, and not neutral to leverage: a 100x position counts at 100 times its margin, in the numerator and in open interest, so a 200x venue and a 20x one are two products on one column. Where a source exposes the position behind the fill (Gains on chain), collateral lost and median leverage publish beside the notional. Trade tapes and hourly buckets carry size and price only, so notional is the figure every venue can be measured on."
  - q: "Why does Aevo show no rate, and what changed for GMX v2?"
    a: "Aevo has no public liquidation feed: every liquidation path on its API 404s, its trade history endpoint is per-account, and no aggregator covers it. It is declared unranked and publishes open interest and 24h traded notional so the gap is visible rather than rendered as a zero. GMX v2 had a feed all along: this spec blamed Subsquid positionChanges for exposing no order type, true of that entity and false of tradeActions, whose orderType is 7 for a liquidation. GMX publishes a measured rate."
  - q: "Which venues were checked and left out?"
    a: "Pacifica, Extended and Backpack flag liquidations publicly, but only on a tape or stream that reaches back minutes, so a 5-minute poller cannot see a day; they need a persistent collector. ApeX Omni, GRVT, Vest and StandX expose no liquidation signal on any public endpoint. edgeX v2 publishes no public trade tape. Jupiter Perps' trades endpoint needs a wallet address and has no liquidation action. Drift is now Velocity, a fresh deployment holding a few thousand dollars of ETH and BTC."
  - q: "Why is the denominator the peak open interest of the day rather than the current figure or the mean?"
    a: "Because the numerator covers 24 hours, so the denominator has to describe the book that was there to be liquidated over those hours. Against the instant, Gains published 343% on 2026-09-24 as its open interest fell from 37M to 7.3M dollars while the numerator stood still. Against the mean it still read 251% on 2026-09-28, when its ETH book went from 43.7M to 2.1M because most of it was liquidated. The peak is the largest book observed, and above 100% is turnover; that day reads 62%."
  - q: "How is Lighter liquidation data obtained, and what was wrong with it?"
    a: "Lighter's own trades endpoint needs authentication, so the numerator comes from Coinalyze hourly liquidation buckets for Lighter's markets, in base units, converted at that hour's close price. The bug was in how the buckets were folded in: each hour was captured minutes after it opened, when it was nearly empty, and the dedup key then held that reading for a full day. Hours are now restated as they fill. The figure went from 887 dollars to roughly 44k on ETH."
  - q: "How much of a liquidated position's margin does a trader actually forfeit?"
    a: |
      Not all of it, and not only what the price took. The harness reads the
      margin behind each forced close, the share the price had taken (the loss
      at trigger), and the share that went back. What is left is forfeited.

      It only compares inside a leverage band, because the forfeit grows with
      leverage and the venues sell different ranges. Measured 2026-09-29, Gains
      forfeits the most band for band and by a factor: 29.2 points against GMX's
      6.3 and Ostium's 4.9 at 10-25x, 41.3 against 24.1 and 22.0 at 50-100x.
      Across 10x to 100x, Gains reads 32.8 points, GMX 16.0, Ostium 18.3. Gains
      closes earliest, at 70.8% of margin lost against 85.1% and 95.1%, and
      returns none of the rest.

      It is not all penalty: it holds the closing fee, funding and rollover too.
      GMX itemises that, and 19.7 of its 24.1 points at 50-100x is its own
      liquidation fee. Gains has no fee word, so its split is bounded by its
      stop losses, which forfeit 2.0 points at 10-25x against 29.2.
  - q: "Why is the forfeited share not ranked across the field?"
    a: |
      Because three of the eleven venues carry it. Gains and Ostium publish the
      position behind the close on chain and GMX v2 publishes it on its squid.
      Hyperliquid's feed carries the realized P&L in dollars but no margin to
      divide it by; the dYdX and Paradex tapes carry size and price; Lighter and
      Aster arrive as hourly aggregate buckets with no positions in them at all;
      Nado publishes one cumulative counter for the window. Orderly comes
      closest and still cannot: its collateral_value is the equity remaining at
      the moment of liquidation, not the margin posted, so there is no
      denominator.

      Those seven, and Aevo which has no liquidation feed at all, publish
      nothing on these columns rather than 0.0%, which would read as a venue
      that forfeits none of its traders' margin. The three that do report are
      annotations beside the ranked notional rate, never a ranked column, and
      the ledger carries the count of forced closes next to the figure, because
      on a quiet day for a small venue that count is 1.
  - q: "What does the warming up period mean?"
    a: "Every liquidation source backfills the full 24 hours on the first tick, so the numerator is complete from the start. The denominator depends on the venue. Gains reads its past open interest off the chain, so its curve is complete on the first tick and it never warms up. Every other venue publishes only the book it holds now, so its window needs twelve readings, an hour here, before a peak is worth dividing by; until then the rate is withheld."

dimensions:
  chain:
    - { value: ETH, label: ETH }
    - { value: BTC, label: BTC }
    - { value: SOL, label: SOL }

# The headline view is ETH, the same pin perp-fees uses, so the board
# compares one asset across venues instead of whichever series Prom
# returned first. Hyperliquid on 2026-09-23 read 0.50% on BTC and 0.12%
# on ETH, so this was a 4x difference decided by ordering.
aggregate_filters: { chain: ETH }
# The pin is injected into every query on the bench, including ones whose
# metric has no chain label: perp_liq_health is per venue, so an injected
# chain="ETH" matched nothing and nulled seven venues' success, which
# load.ts then reads as 100% healthy. Those selectors carry chain=~".*",
# which suppresses the injection (a selector already naming the label is
# left alone) and still matches series that have no chain label.
# perp_liq_ranked and every metric_panel below are per venue and per asset,
# so they take the pin and must not carry that escape hatch.

metric_panels:
  - id: liq_volume
    label: Liquidated 24h
    label_key: venue
    metric: perp_liq_volume_24h_usd{}
    unit: usd
    higher_is_better: false
    description: "The numerator: liquidated notional in USD over the trailing 24 hours, summed over the window the rate is built on. Absent for a venue with no liquidation feed."
  - id: collateral
    label: Collateral lost 24h
    label_key: venue
    metric: perp_liq_collateral_24h_usd{}
    unit: usd
    higher_is_better: false
    tab: false
    description: "The margin behind the liquidated positions: the money traders lost, not the notional closed. An annotation, not a ranking: Gains, GMX v2 and Ostium publish it, the other eight cannot carry it. Gains: 39.5M of notional on 423k of collateral, 2026-09-28."
  - id: median_leverage
    label: Median leverage
    label_key: venue
    metric: perp_liq_median_leverage_x{}
    unit: x
    higher_is_better: false
    tab: false
    description: "Median leverage of the positions liquidated in the window, where the feed says: Gains and Ostium off chain, GMX v2 as notional over margin. An annotation, not a ranking: the rate above counts a 100x position at 100 times its margin, so equal rates at unequal leverage are not equal products."
  - id: forfeited
    label: Margin forfeited
    label_key: venue
    metric: perp_liq_collateral_forfeited_pct{}
    unit: pct
    higher_is_better: false
    tab: false
    description: "Median share of a liquidated position's margin destroyed beyond the loss the trader incurred, over closes between 10x and 100x only, the range all three venues offer. Taken per close then medianed, so it is not 100 minus the panels beside it. It holds the venue's penalty AND fees. Never ranked."
  - id: loss_at_trigger
    label: Loss at trigger
    label_key: venue
    metric: perp_liq_loss_at_trigger_pct{}
    unit: pct
    higher_is_better: false
    tab: false
    description: "Median share of the margin the price had taken when the venue closed the position, over the same 10x to 100x closes. The move times the leverage, before fees and carry. A LOWER figure means the venue closed earlier and kept more: at 10-25x Gains reads 70.8%, GMX 85.1%, Ostium 95.1%."
  - id: returned
    label: Margin returned
    label_key: venue
    metric: perp_liq_collateral_returned_pct{}
    unit: pct
    higher_is_better: true
    tab: false
    description: "Median share of the margin that went back to the trader, over the same 10x to 100x closes. Zero is a measurement and the common one: Gains and Ostium returned nothing on any of the 876 and 383 liquidations read, GMX v2 a median 19.3%. Blank on the eight venues with no position."
  - id: forfeit_events
    label: Forced closes measured
    label_key: venue
    metric: perp_liq_forfeit_events{}
    unit: count
    higher_is_better: false
    tab: false
    description: "How many forced closes of the window carried the position AND sat between 10x and 100x, the set the venue-level medians are taken over. A 0 is a venue that can report and saw none; one whose feed cannot report publishes no figure at all. The per-band counts cover the whole curve."
  - id: fee_and_carry
    label: Of which fees
    label_key: venue
    metric: perp_liq_fee_and_carry_pct{}
    unit: pct
    higher_is_better: false
    tab: false
    description: "The part of the forfeited share that is trading fees and carry rather than the venue's liquidation penalty. A fee is a cost the trader incurred and a penalty is not. GMX v2 itemises it in full, Ostium in part; the Gains event carries no fee word, so its cell is blank, not zero."
  - id: margin_liq_share
    label: Margin liquidated
    label_key: venue
    metric: perp_liq_margin_destroyed_share_pct{}
    unit: pct
    higher_is_better: false
    tab: false
    description: "Margin destroyed by force over the margin behind every position the venue closed in the window. The leverage-neutral companion to Share of volume, which is notional over notional and counts a 100x position at a hundred times the money behind it. GMX v2 1.09% over 7 days, Ostium 1.38% over 30."
  - id: oi_peak
    label: Peak OI 24h
    label_key: venue
    metric: perp_liq_open_interest_peak_24h_usd{}
    unit: usd
    higher_is_better: true
    description: "The denominator: the peak open interest in USD over the same 24 hours, read from the venue's own on-chain record of every change where there is one, otherwise sampled per tick. The largest book the venue held, so a book liquidated away inside the day is still measured against the book it had."
  - id: oi_trough
    label: Trough OI 24h
    label_key: venue
    metric: perp_liq_open_interest_trough_24h_usd{}
    unit: usd
    higher_is_better: true
    description: "Smallest open interest in USD over the same 24 hours. Read it against the peak: when the two are far apart the peak and the mean describe different markets. Gains BTC ran from 49.94M dollars to 1.12M and back to 10.65M inside 2026-09-28."
  - id: oi_avg
    label: Mean OI 24h
    label_key: venue
    metric: perp_liq_open_interest_avg_24h_usd{}
    unit: usd
    higher_is_better: true
    tab: false
    description: "Mean open interest in USD over the same 24 hours, beside the peak. A wide gap between the two is a book that moved a lot inside the day, as Gains ETH did on 2026-09-28 (peak 43.7M, mean 10.9M)."
  - id: oi_now
    label: OI now
    label_key: venue
    metric: perp_liq_open_interest_usd{}
    unit: usd
    higher_is_better: true
    tab: false
    description: "Open interest in USD at the most recent tick, read natively per venue."
  - id: venue_volume
    label: Volume 24h
    label_key: venue
    metric: perp_liq_venue_volume_24h_usd{}
    unit: usd
    higher_is_better: true
    description: "The venue's own 24h traded notional for this market, from its own API (GMX from the same squid as its liquidations, Gains from the same contract logs). Blank for a venue that publishes none, which is why such a row cannot be tested and does not rank."
  - id: share_of_volume
    label: Share of volume
    label_key: venue
    metric: perp_liq_share_of_volume_pct{}
    unit: pct
    higher_is_better: false
    description: "Liquidated notional as a percentage of the venue's own 24h traded notional. Between 0.01 and 3 the figure is treated as a measurement and the row can rank. Below the floor it is an absence; above the ceiling it is not comparable to the field."
  - id: largest_event
    label: Largest event
    label_key: venue
    metric: perp_liq_largest_event_share_pct{}
    unit: pct
    higher_is_better: false
    description: "The largest single liquidation in the window as a percentage of the window total. Above 50 the row does not rank: the 24h figure is one position, not a flow. Blank for rows read from hourly buckets or a cumulative counter (Lighter, Aster, Nado), which carry no single event."

ledger_columns:
  - { label: "Liq rate", slot: p50 }
  - { label: "Liquidated 24h", panel: liq_volume }
  - { label: "Peak OI 24h", panel: oi_peak }
  - { label: "Volume 24h", panel: venue_volume }
  - { label: "Margin liquidated", panel: margin_liq_share, unit: pct }
  - { label: "Share of vol", panel: share_of_volume, unit: pct }
  - { label: "Largest event", panel: largest_event, unit: pct }
  - { label: "Margin forfeited", panel: forfeited, unit: pct }
  - { label: "Closes measured", panel: forfeit_events }

providers:
  - slug: hyperliquid
    name: Hyperliquid
    tag: HyperBFT L1; 0xArchive feed covers every liquidation type
    formula: "24h sum of liquidated notional USD (0xArchive liquidations, all types) over peak 24h OI (openInterest x midPx from metaAndAssetCtxs), as a percentage. Window deduplicated by trade id."
    queries:
      p50: last_over_time(perp_liq_rate_24h_pct{venue="hyperliquid"}[1h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="hyperliquid"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="hyperliquid"}[24h])
      mean: last_over_time(perp_liq_rate_24h_pct{venue="hyperliquid"}[1h])
      success: avg_over_time(perp_liq_health{venue="hyperliquid",chain=~".*"}[24h])
      sample_size: count_over_time(perp_liq_rate_24h_pct{venue="hyperliquid"}[24h])
      ranked: min_over_time(perp_liq_ranked{venue="hyperliquid"}[1h])
      series: perp_liq_rate_24h_pct{venue="hyperliquid"}

  - slug: lighter
    name: Lighter
    tag: zk-rollup; liquidations via Coinalyze hourly buckets, restated as they fill
    formula: "24h sum of (long + short) base units x Hyperliquid's close for that hour (Coinalyze liquidation-history, 1h resolution) over peak 24h OI (open_interest x mark_price from orderBookDetails), as a percentage."
    queries:
      p50: last_over_time(perp_liq_rate_24h_pct{venue="lighter"}[1h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="lighter"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="lighter"}[24h])
      mean: last_over_time(perp_liq_rate_24h_pct{venue="lighter"}[1h])
      success: avg_over_time(perp_liq_health{venue="lighter",chain=~".*"}[24h])
      sample_size: count_over_time(perp_liq_rate_24h_pct{venue="lighter"}[24h])
      ranked: min_over_time(perp_liq_ranked{venue="lighter"}[1h])
      series: perp_liq_rate_24h_pct{venue="lighter"}

  - slug: dydx
    name: dYdX v4
    tag: Cosmos appchain; tape labels a fill LIQUIDATED on the liquidation path only
    formula: "24h sum of size x price over trades whose type is LIQUIDATED (v4 indexer tape, paged backwards) over peak 24h OI (openInterest x oraclePrice), as a percentage."
    queries:
      p50: last_over_time(perp_liq_rate_24h_pct{venue="dydx"}[1h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="dydx"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="dydx"}[24h])
      mean: last_over_time(perp_liq_rate_24h_pct{venue="dydx"}[1h])
      success: avg_over_time(perp_liq_health{venue="dydx",chain=~".*"}[24h])
      sample_size: count_over_time(perp_liq_rate_24h_pct{venue="dydx"}[24h])
      ranked: min_over_time(perp_liq_ranked{venue="dydx"}[1h])
      series: perp_liq_rate_24h_pct{venue="dydx"}

  - slug: paradex
    name: Paradex
    tag: Starknet appchain; public tape carries a LIQUIDATION trade type
    formula: "24h sum of size x price over trades whose trade_type is LIQUIDATION (public tape, cursor paged) over peak 24h OI (open_interest x mark_price), as a percentage."
    queries:
      p50: last_over_time(perp_liq_rate_24h_pct{venue="paradex"}[1h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="paradex"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="paradex"}[24h])
      mean: last_over_time(perp_liq_rate_24h_pct{venue="paradex"}[1h])
      success: avg_over_time(perp_liq_health{venue="paradex",chain=~".*"}[24h])
      sample_size: count_over_time(perp_liq_rate_24h_pct{venue="paradex"}[24h])
      ranked: min_over_time(perp_liq_ranked{venue="paradex"}[1h])
      series: perp_liq_rate_24h_pct{venue="paradex"}

  - slug: gains
    name: Gains
    tag: gTrade on Arbitrum and Base; liquidations and traded notional off the same diamond logs, up to 200x leverage
    formula: "24h sum of collateral x leverage x collateralPriceUsd over LimitExecuted logs with orderType LIQ_CLOSE, over peak 24h OI from trading-variables. Traded notional: every execution log of the pair off the same scan, resizes at their delta."
    queries:
      p50: last_over_time(perp_liq_rate_24h_pct{venue="gains"}[1h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="gains"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="gains"}[24h])
      mean: last_over_time(perp_liq_rate_24h_pct{venue="gains"}[1h])
      success: avg_over_time(perp_liq_health{venue="gains",chain=~".*"}[24h])
      sample_size: count_over_time(perp_liq_rate_24h_pct{venue="gains"}[24h])
      ranked: min_over_time(perp_liq_ranked{venue="gains"}[1h])
      series: perp_liq_rate_24h_pct{venue="gains"}

  - slug: gmx
