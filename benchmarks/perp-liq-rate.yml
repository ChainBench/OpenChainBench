prometheus:
  window: 24h
  expected_freshness_seconds: 1800
  freshness_metric: perp_liq_last_refresh_timestamp_seconds

faq:
  - q: "What is the liquidation rate and why does it matter?"
    a: "It is the share of a venue's open interest closed by force over 24 hours: liquidated notional divided by mean open interest across the same day. For a trader it says how much of the book the venue's risk engine is closing, which bears on how large a margin buffer a position needs to survive a volatile session. For anyone providing liquidity to a vault-backed venue it bears on how often the vault is on the other side of a forced close."
  - q: "Why is the ranked field smaller than the cohort?"
    a: "Because the venues do not agree on what a liquidation is, and a single ranked column would imply they do. dYdX labels a fill LIQUIDATED only on its dedicated liquidation path and returned one such fill on ETH over the 24 hours to 2026-09-27. Paradex's tape returned none. Hyperliquid's own ETH feed returned 22 events against 693 on BTC. Gains counts the full leveraged notional of positions at up to 200x. A row ranks only when its figure is between 0.01% and 3% of the venue's own traded notional; the others publish everything they measured, below the field, with the reason."
  - q: "Why 0.01% to 3% of traded notional?"
    a: "It is the band a perp venue's liquidation flow occupies, and traded notional is the one denominator every venue reports on the same endpoint as its open interest, so it cancels venue size. Measured on 2026-09-27: Hyperliquid 0.17% on BTC and 0.93% on SOL, Aster 0.18% on ETH and 0.09% on BTC, Lighter 0.024% and 0.018%, dYdX SOL 0.092%, GMX v2 2.02% on BTC. The floor sits a decade below the lowest of those and the ceiling several times above the highest, so the band is a guard against a figure that is an absence or an artifact, not a narrow target."
  - q: "Why does Gains read so much higher than the rest?"
    a: "Because the reading is right and the venue is different. Gains allows up to 200x on crypto pairs, so a position is liquidated on a move of well under a percent, and a liquidation carries the full leveraged notional. On 2026-09-27 two ETH positions at 136x and 78x were 91% of its whole 24-hour figure, which came to 14.9% of its own traded notional. The decode was checked against the chain: the event encodes position size twice and the two encodings agree to 0.02%. The figures publish; the row does not rank."
  - q: "Why does Aevo show no rate, and what changed for GMX v2?"
    a: "Aevo has no public liquidation feed: every liquidation path on its API 404s, its trade history endpoint is per-account, and no aggregator covers it. It is declared unranked and publishes open interest and 24h traded notional so the gap is visible rather than rendered as a zero. GMX v2 did have a feed all along. This spec blamed Subsquid positionChanges for exposing no order type, which is true of that entity and false of tradeActions, whose orderType is 7 for a liquidation. GMX now publishes a measured rate."
  - q: "Which venues were checked and left out?"
    a: "edgeX: the v2 deployment publishes no public trade tape at all, every trades and liquidation path returns 404, and its only reachable websocket gateway serves the dead v1 contract ids. Jupiter Perps: the trades endpoint needs a wallet address and its action enum has no liquidation value, so no venue-level figure exists without decoding the program on chain. Drift: the venue is now Velocity on a fresh program deployment whose ETH and BTC books hold single-digit thousands of dollars, where a rate would be noise."
  - q: "Why is open interest averaged rather than read at the moment of measurement?"
    a: "Because the numerator covers 24 hours, so the denominator has to as well. With an instantaneous denominator the rate moved with open interest rather than with liquidations. Gains published 343% on 2026-09-24 because its open interest fell from 37M to 7.3M dollars while its numerator stood still, and 491% earlier in the same week. Both were denominator artifacts, not liquidation events."
  - q: "How is Lighter liquidation data obtained, and what was wrong with it?"
    a: "Lighter's own trades endpoint needs authentication, so the numerator comes from Coinalyze hourly liquidation buckets for Lighter's markets, in base units, converted at that hour's close price. The bug was in how the buckets were folded in: each hour was captured minutes after it opened, when it was nearly empty, and the dedup key then held that reading for a full day. Hours are now restated as they fill. The figure went from 887 dollars to roughly 44k on ETH."
  - q: "What does the warming up period mean?"
    a: "Every liquidation source here backfills the full 24 hours on the harness's first tick, so the numerator is complete from the start. The denominator is not: it needs twelve readings, one hour at this cadence, before a mean is worth dividing by. Until then perp_liq_ranked is 0 and the row publishes without a rank. perp_liq_warming_up stays 1 for the first 24 hours, which is when the window has seen a full span of its own."

dimensions:
  chain:
    - { value: ETH, label: ETH }
    - { value: BTC, label: BTC }
    - { value: SOL, label: SOL }

# The headline view is ETH, the same pin perp-fees uses, so the board
# compares one asset across venues instead of whichever series Prom
# returned first. Hyperliquid on 2026-09-23 read 0.50% on BTC and 0.12%
# on ETH, so this was a 4x difference decided by ordering.
aggregate_filters: { chain: ETH }
# The pin is injected into every query on the bench, including ones whose
# metric has no chain label: perp_liq_health is per venue, so an injected
# chain="ETH" matched nothing and nulled seven venues' success, which
# load.ts then reads as 100% healthy. Those selectors carry chain=~".*",
# which suppresses the injection (a selector already naming the label is
# left alone) and still matches series that have no chain label.
# perp_liq_ranked and every metric_panel below are per venue and per asset,
# so they take the pin and must not carry that escape hatch.

metric_panels:
  - id: liq_volume
    label: Liquidated 24h
    label_key: venue
    metric: perp_liq_volume_24h_usd{}
    unit: usd
    higher_is_better: false
    description: "The numerator: liquidated notional in USD over the trailing 24 hours, summed over the window the rate is built on. Absent for a venue with no liquidation feed."
  - id: oi_avg
    label: Mean OI 24h
    label_key: venue
    metric: perp_liq_open_interest_avg_24h_usd{}
    unit: usd
    higher_is_better: true
    description: "The denominator: mean open interest in USD over the same 24 hours, one reading per 5-minute tick. Averaged so the rate moves with its numerator rather than with a denominator read at one instant."
  - id: oi_now
    label: OI now
    label_key: venue
    metric: perp_liq_open_interest_usd{}
    unit: usd
    higher_is_better: true
    tab: false
    description: "Open interest in USD at the most recent tick, read natively per venue."
  - id: venue_volume
    label: Volume 24h
    label_key: venue
    metric: perp_liq_venue_volume_24h_usd{}
    unit: usd
    higher_is_better: true
    description: "The venue's own 24h traded notional for this market, from the same endpoint that reports its open interest. Blank for a venue that publishes none, which is why such a row cannot be tested and does not rank."
  - id: share_of_volume
    label: Share of volume
    label_key: venue
    metric: perp_liq_share_of_volume_pct{}
    unit: pct
    higher_is_better: false
    description: "Liquidated notional as a percentage of the venue's own 24h traded notional. Between 0.01 and 3 the figure is treated as a measurement and the row ranks. Below the floor it is an absence; above the ceiling it is not comparable to the field."
  - id: largest_event
    label: Largest event
    label_key: venue
    metric: perp_liq_largest_event_share_pct{}
    unit: pct
    higher_is_better: false
    description: "The largest single liquidation in the window as a percentage of the window total. Near 100 the 24h figure is one position rather than a flow. Gains read 66 on ETH on 2026-09-27."

ledger_columns:
  - { label: "Liq rate", slot: p50 }
  - { label: "Liquidated 24h", panel: liq_volume }
  - { label: "Mean OI 24h", panel: oi_avg }
  - { label: "Volume 24h", panel: venue_volume }
  - { label: "Share of vol", panel: share_of_volume, unit: pct }
  - { label: "Largest event", panel: largest_event, unit: pct }

providers:
  - slug: hyperliquid
    name: Hyperliquid
    tag: HyperBFT L1; 0xArchive feed covers every liquidation type
    formula: "24h sum of liquidated notional USD (0xArchive liquidations, all types) over mean 24h OI (openInterest x midPx from metaAndAssetCtxs), as a percentage. Window deduplicated by trade id."
    queries:
      p50: avg_over_time(perp_liq_rate_24h_pct{venue="hyperliquid"}[24h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="hyperliquid"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="hyperliquid"}[24h])
      mean: avg_over_time(perp_liq_rate_24h_pct{venue="hyperliquid"}[24h])
      success: avg_over_time(perp_liq_health{venue="hyperliquid",chain=~".*"}[24h])
      sample_size: count_over_time(perp_liq_rate_24h_pct{venue="hyperliquid"}[24h])
      ranked: min_over_time(perp_liq_ranked{venue="hyperliquid"}[1h])
      series: perp_liq_rate_24h_pct{venue="hyperliquid"}

  - slug: lighter
    name: Lighter
    tag: zk-rollup; liquidations via Coinalyze hourly buckets, restated as they fill
    formula: "24h sum of (long + short) base units x that hour's close (Coinalyze liquidation-history, 1h resolution) over mean 24h OI (open_interest x mark_price from orderBookDetails), as a percentage."
    queries:
      p50: avg_over_time(perp_liq_rate_24h_pct{venue="lighter"}[24h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="lighter"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="lighter"}[24h])
      mean: avg_over_time(perp_liq_rate_24h_pct{venue="lighter"}[24h])
      success: avg_over_time(perp_liq_health{venue="lighter",chain=~".*"}[24h])
      sample_size: count_over_time(perp_liq_rate_24h_pct{venue="lighter"}[24h])
      ranked: min_over_time(perp_liq_ranked{venue="lighter"}[1h])
      series: perp_liq_rate_24h_pct{venue="lighter"}

  - slug: dydx
    name: dYdX v4
    tag: Cosmos appchain; tape labels a fill LIQUIDATED on the liquidation path only
    formula: "24h sum of size x price over trades whose type is LIQUIDATED (v4 indexer tape, paged backwards) over mean 24h OI (openInterest x oraclePrice), as a percentage."
    queries:
      p50: avg_over_time(perp_liq_rate_24h_pct{venue="dydx"}[24h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="dydx"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="dydx"}[24h])
      mean: avg_over_time(perp_liq_rate_24h_pct{venue="dydx"}[24h])
      success: avg_over_time(perp_liq_health{venue="dydx",chain=~".*"}[24h])
      sample_size: count_over_time(perp_liq_rate_24h_pct{venue="dydx"}[24h])
      ranked: min_over_time(perp_liq_ranked{venue="dydx"}[1h])
      series: perp_liq_rate_24h_pct{venue="dydx"}

  - slug: paradex
    name: Paradex
    tag: Starknet appchain; public tape carries a LIQUIDATION trade type
    formula: "24h sum of size x price over trades whose trade_type is LIQUIDATION (public tape, cursor paged) over mean 24h OI (open_interest x mark_price), as a percentage."
    queries:
      p50: avg_over_time(perp_liq_rate_24h_pct{venue="paradex"}[24h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="paradex"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="paradex"}[24h])
      mean: avg_over_time(perp_liq_rate_24h_pct{venue="paradex"}[24h])
      success: avg_over_time(perp_liq_health{venue="paradex",chain=~".*"}[24h])
      sample_size: count_over_time(perp_liq_rate_24h_pct{venue="paradex"}[24h])
      ranked: min_over_time(perp_liq_ranked{venue="paradex"}[1h])
      series: perp_liq_rate_24h_pct{venue="paradex"}

  - slug: gains
    name: Gains
    tag: gTrade on Arbitrum and Base; on-chain LIQ_CLOSE logs, up to 200x leverage
    formula: "24h sum of collateralAmount / 10^decimals x leverage / 1e3 x collateralPriceUsd / 1e8 over LimitExecuted logs with orderType LIQ_CLOSE, over mean 24h OI from trading-variables across every collateral."
    queries:
      p50: avg_over_time(perp_liq_rate_24h_pct{venue="gains"}[24h])
      p90: quantile_over_time(0.90, perp_liq_rate_24h_pct{venue="gains"}[24h])
      p99: quantile_over_time(0.99, perp_liq_rate_24h_pct{venue="gains"}[24h])
      mean: avg_over_time(perp_liq_rate_24h_pct{venue="gains"}[24h])
      success: avg_over_time(perp_liq_health{venue="gains",chain=~".*"}[24h])
      sample_size: count_over_time(perp_liq_rate_24h_pct{venue="gains"}[24h])
      ranked: min_over_time(perp_liq_ranked{venue="gains"}[1h])
      series: perp_liq_rate_24h_pct{venue="gains"}

  - slug: gmx
    name: GMX v2
    tag: Arbitrum synthetics; on-chain liquidation orders via the public squid
