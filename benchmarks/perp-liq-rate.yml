# OpenChainBench. Bench 208

slug: perp-liq-rate
number: "208"
title: "Perp DEX liquidation rate: 24h liquidated notional over the day's peak open interest, live"
seo_title: "Perp DEX liquidation rate: {{best_name}} lowest at {{best_p50}}"
seo_description: "Liquidated notional over 24 hours as a percentage of the peak open interest over the same 24 hours, on ETH and BTC across Hyperliquid, Lighter, dYdX v4, Aster, GMX v2, Orderly, Nado, Gains, Paradex, Ostium and Aevo. Rows whose liquidation figure is not comparable publish unranked."
subtitle: "Liquidated notional over the trailing 24 hours divided by the peak open interest over the same 24 hours, in percent. Measured every 5 minutes on ETH and BTC, and SOL where a venue lists it. A row ranks only when the figure is a flow (10,000 dollars or more, no single liquidation over half) between 0.01% and 3% of the venue's own 24h traded notional; otherwise it publishes without a rank."
category: Trading
status: live
metric: Liquidation rate
unit: pct
higher_is_better: false
row_noun: { one: venue, many: venues }

seo_intro: |
  Every perpetual futures platform closes a position when the margin behind
  it falls below the maintenance requirement. The liquidation rate, defined
  here as liquidated notional over 24 hours divided by the peak open
  interest over the same 24 hours, measures how much of the largest book a
  venue held that day was closed by force rather than by its owner.

  The hard part of this measurement is not the arithmetic, it is that the
  venues do not agree on what counts as a liquidation. Hyperliquid's feed
  covers every liquidation type including positions closed by market order.
  dYdX v4 labels a fill LIQUIDATED only when it came through the dedicated
  liquidation path, and over the 24 hours to 2026-09-27 that was one fill
  on ETH and one on BTC. Paradex's public tape carried no LIQUIDATION row
  at all over the same day, and its ETH book traded about 1.4M dollars.
  Gains, whose crypto pairs allow up to 200x, emits an explicit liquidation
  order type on chain; on 2026-09-27 two positions at 136x and 78x were 91%
  of its whole day, and in the cascade of 2026-09-28 its ETH book went from
  43.7M dollars to 2.1M with 27.3M liquidated.

  Every one of those figures is a correct reading of its own source, and
  they span four orders of magnitude as a share of each venue's own traded
  notional. So this bench states the source behind each row and ranks only
  the rows whose figure is a flow (at least 10,000 dollars, no single
  liquidation more than half of it) inside the band a perp venue's
  liquidation flow actually occupies. A venue whose feed reports nothing is
  published as reporting nothing, and never as the lowest rate on the board.

  Open interest is read natively per venue every 5 minutes and the rate
  divides by its peak over the same 24 hours the numerator covers:
  Hyperliquid metaAndAssetCtxs, Lighter orderBookDetails, dYdX v4 and
  Paradex REST, Aevo statistics, Gains trading-variables across every
  collateral of both deployments, GMX v2 from the gmxinfra markets endpoint.

abstract: |
  A Go exporter polls each venue every 5 minutes. Liquidation events are
  accumulated in a 24-hour sliding window keyed by event identity, so the
  same close is never counted twice. An aggregator that publishes hourly
  totals rather than events is folded in by restatement: each hour's key
  carries the newest figure for that hour, because an hour read while it is
  still open under-reports. Open interest and the venue's 24h traded
  notional are read fresh on each tick, and the rate divides by the peak
  open interest of the trailing 24 hours: the largest book the venue was
  observed holding, so the published rate moves with its numerator rather
  than with a denominator read at one instant, and a book that is liquidated
  away inside the window is still measured against the book it had. A figure
  above 100% is then turnover: positions opened after the peak reading, or
  opened and closed between two readings, count in the numerator without
  ever entering the denominator.

  perp_liq_rate_24h_pct = sum(liquidated_notional_usd, 24h) /
  max(one_sided_open_interest_usd, 24h) * 100. The page's headline is the
  latest reading of that gauge, not a further average of it.

  perp_liq_ranked is 1 when the row takes a rank. It reads 0 when the venue
  has no liquidation feed, when a fetch failed, when a page cap cut a read
  short and the unread edge is still inside the window, for the first hour
  after a restart while the denominator fills, when no liquidation was
  observed at all, when less than 10,000 dollars was liquidated, when one
  liquidation is more than half of the figure, when the venue publishes no
  24h notional to test the figure against, or when
  perp_liq_share_of_volume_pct falls outside 0.01% to 3%. Fetch failures
  leave the previous gauges unchanged and increment
  perp_liq_fetch_errors_total; the health gauge drops to 0.

methodology:
  - "Cadence: every 5 minutes, in parallel across all venue and asset pairs."
  - "Numerator: liquidation events are held in a 24-hour window keyed by event identity: a trade, order or event id where the venue issues one, or transaction hash plus log index on chain. Events older than 24 hours are dropped each tick. Every fetch re-asks for the previous two hours as well, so a row an indexer ingests late is still picked up; the key set makes the repeat free."
  - "Aggregator buckets are restated, not deduplicated. An hourly total read while its hour is still open is smaller than the hour's final figure, so each hour's key carries the newest reading. Freezing the first reading is what made Lighter publish 887 dollars against 185.6M of ETH volume until 2026-09-27."
  - "Open interest is the notional that could have been force-closed, read differently per venue kind. An order book (Hyperliquid, dYdX, Paradex, Lighter, Aster, Orderly, Nado) reports one side, because longs and shorts match. A pool venue (GMX v2, Gains, Ostium) reports long and short separately against its vault and the two are independent, so both count. Halving the pool figure, as this did until 2026-09-28, put the rate over 100% on an unbalanced book with no turnover."
  - "Headline: the latest trailing-24h reading. Averaging a trailing-24h gauge over a further 24h would weight two days and peak a day late, so p50 and mean are last_over_time over the past hour; p90 and p99 keep the day's range. perp_liq_newest_event_age_seconds says how long ago each row's feed last reported a liquidation."
  - "Denominator: the peak open interest over the same 24 hours, with the mean and the trough beside it. The peak, because the numerator is everything force-closed in the window and the book it came from is the largest one held: an instant moves with open interest rather than liquidations, and a mean is dragged down by the collapse it is measuring. The trough publishes alongside, because a book that ran from 49.94M dollars to 1.12M in a day is two markets."
  - "Where the open-interest series comes from decides whether it is right. Gains is read from the chain: the diamond emits PairOiAfterV10Updated on every open and close carrying the post-state book per collateral, so one pass of the scan gives the whole curve at every change, seeded at the window edge and needing no warm-up. Every other venue publishes only the book it holds now, so its curve is still accumulated one reading per tick and its peak is only as old as the process."
  - "That distinction was worth 15x. On 2026-09-28 the accumulated window gave Gains ETH a peak of 2.72M dollars, every reading having been taken after the cascade, and the bench published 952%. The reconstruction gives the 43.54M the venue held, so 27.29M of liquidations reads 63%. On BTC the accumulated peak understated the book 4.6x and 211% becomes 25%. Two independent reconstructions agree with the API to five figures."
  - "Historical open interest is valued at historical prices. The quantities come from the events; the collateral price comes from the price the contract stamped on its own execution events, nearest at or before each reading, falling back to the venue's head price when the window holds nothing earlier. Exact for USDC and DAI either way, and it stops a WETH-collateral book from a day when ETH traded elsewhere being restated at today's price."
  - "Ranking: a row ranks only when at least 10,000 dollars was liquidated, no single liquidation is more than half of the figure (rows with per-event detail), and the figure is between 0.01% and 3% of the venue's own 24h traded notional, from the venue's API or, for GMX and Gains, the same indexer or contract logs as the liquidations. Published per row as perp_liq_share_of_volume_pct and perp_liq_largest_event_share_pct; perp_liq_ranked carries the verdict."
  - "What the rate is and is not. It is the share of a venue's book closed by force, in notional. It is not the money traders lost, and not neutral to leverage: a 100x position counts at 100 times its margin, in the numerator and in open interest. On 2026-09-28 Gains liquidated 39.5M dollars of notional on 423k of collateral at a median 73x. Where this harness reads the position behind the fill, today Gains alone, perp_liq_collateral_24h_usd and perp_liq_median_leverage_x publish beside it."
  - "Collateral coverage, measured across all eleven venues on 2026-09-28. Available: Gains (Trade tuple on chain, published today), Ostium (subgraph trade.collateral and trade.leverage) and GMX v2 (initialCollateralDeltaAmount x collateralTokenPriceMin on the liquidation row); the last two are reachable and not read yet. Partial: Orderly, whose collateral_value is account-level, cross-margin and the collateral remaining rather than the margin posted."
  - "Not available, structurally: Hyperliquid's 0xArchive feed carries price, size, closed_pnl and the liquidated address but no margin; dYdX and Paradex tapes carry size and price; Lighter and Aster come through hourly aggregate buckets with no positions in them at all; Nado publishes one cumulative counter per window. Six of the ten feeds therefore cannot carry collateral, which is why the ranked column is notional and collateral is an annotation on the rows that have one."
  - "Why the size gates exist: on 2026-09-28 Ostium BTC sat inside the band at 0.458% on 338 dollars from a single liquidation, above Hyperliquid and GMX, while dYdX BTC sat outside it on 537 dollars from a single liquidation. A share of volume cannot tell a flow from an event; the notional floor and the largest-event ceiling can."
  - "Rows outside the gate keep every figure they measured and sit below the ranked field. Nothing is hidden and nothing is estimated to fill a gap."
  - "An exact zero never ranks. A zero reads the same whether the venue liquidated nothing or its feed returned nothing, so it is published as an observation and not as a best value."
  - "The rate is withheld, not merely unranked, when the gate's reason means the ratio describes nothing: one liquidation being most of the window, no notional to test it against, an open-interest window shorter than the numerator, or a failed read. Every input still publishes. Both windows survive a restart in a JSON file on a mounted volume, since open interest cannot be backfilled: without it a redeploy divided 24h of liquidations by the peak of the minutes since boot, and Gains ETH read 952%."
  - "Page caps. The tapes that page newest first (dYdX, Paradex, Orderly, the Ostium subgraph, the GMX squid) hand over what they read when a cap stops them short of the window, with the oldest row reached. The rows count, the high-water mark advances so the next request fits, and the row does not rank until the unread edge has aged out of the window. Repeating a request that did not fit would lock the pair out while the tape stayed busy. 0xArchive keeps the refusal: its cap is 29 busy BTC days."
  - "A venue with no 24h traded notional of its own cannot be tested and is not ranked. Gains was the case until 2026-09-28: its trading-variables payload carries open interest per pair and no volume. Its notional is now summed from the diamond's own execution logs, see below."
  - "Hyperliquid: OI and 24h notional from POST /info {type:metaAndAssetCtxs} (openInterest x midPx, dayNtlVlm). Liquidations from 0xArchive GET /v1/hyperliquid/liquidations/{coin} with cursor pagination. Without OXARCHIVE_API_KEY the row publishes no rate at all: the HLP vault fallback sees backstop liquidations only, a knowably partial numerator, and the same rule that keeps Lighter and Aster silent without a Coinalyze key applies."
  - "The band caught the reference feed itself. On 2026-09-27 0xArchive returned 22 ETH liquidations in 24h, one page with no cursor, the most recent nine hours stale, against 693 on BTC and 569 on SOL over the same window and on a comparable book. 25,834 dollars on 505.7M of ETH volume is 0.005%, below the floor, so the ETH row publishes and does not rank."
  - "dYdX v4: OI, oracle price and volume24H from GET /v4/perpetualMarkets. Liquidations from GET /v4/trades/perpetualMarket/{ticker} paged backwards, keeping type == LIQUIDATED; notional = size x price. Verified by paging the full 24h tape on 2026-09-27: one fill on ETH at 466.93 dollars, one on BTC at 16.92, ten on SOL totalling 5,024.62."
  - "Paradex: OI, mark price and volume_24h from GET /v1/markets/summary. Liquidations from GET /v1/trades paged by cursor, keeping trade_type == LIQUIDATION. Over the full 24h to 2026-09-27 the ETH and BTC tapes carried none: 354 and 3,677 rows, all FILL, RPI, BLOCK_TRADE or UNWIND_TRANSFER."
  - "Lighter: OI, mark price and daily_quote_token_volume from GET /api/v1/orderBookDetails?filter=perp. Liquidations from Coinalyze /v1/liquidation-history hourly buckets (symbols 0.T for ETH, 1.T for BTC), in base units, converted at Hyperliquid's hourly close for that hour, since the aggregator publishes no price and Lighter's own candles are not public. Requires COINALYZE_API_KEY."
  - "Gains: liquidations from eth_getLogs on the gTrade diamond on Arbitrum and Base, keeping LimitExecuted logs whose orderType is LIQ_CLOSE (6). Notional = collateralAmount / 10^decimals x leverage / 1e3 x collateralPriceUsd / 1e8; the TradeClosed shape this spec once named is not emitted. The decode is self-checking: the event encodes the position twice, both in collateral units, and a log whose encodings differ by over 5% is refused. Six real logs are pinned."
  - "Gains traded notional comes off the same diamond scan as its liquidations, per pair: MarketExecuted and LimitExecuted legs at full notional plus executed resizes at their delta, the backend's own auto-plus-direct perimeter, validated on the complete UTC day 2026-09-27 at 79% of the venue. The scan runs once per deployment per tick from a block cursor, and each log is placed on the clock by interpolating between the headers at both ends of the range."
  - "The Gains row is the Arbitrum and Base deployments, and all three of its figures are read on that perimeter: liquidations, open interest and traded notional. It is internally consistent and smaller than the venue, which also trades on Polygon, MegaETH and ApeChain. Comparing it with a venue-level figure needs the same day as well: by the venue's own backend 2026-09-27 was 34.76M dollars and 2026-09-28, a cascade day, 210.8M."
  - "Gains open interest reads oiLongCollateral and oiShortCollateral across every collateral of both deployments, each at its own decimals and USD price, so open interest held in WETH or GNS is not counted at face value, and sums long plus short as the trader legs outstanding against the vault."
  - "GMX v2: OI from arbitrum-api.gmxinfra.io/markets/info, openInterestLong plus openInterestShort over every listed market for the asset, at 30 decimals. Liquidations from the public Subsquid squid: tradeActions with orderType 7, pinned to eventName OrderExecuted because every liquidation also appears as OrderCreated. sizeDeltaUsd is USD at 30 decimals."
  - "This spec said until 2026-09-27 that GMX had no reachable liquidation source because Subsquid positionChanges exposes no orderType. That is true of positionChanges and false of tradeActions. Re-measured on 2026-09-27: 103 executed liquidations in 24h across every market, 900,656 dollars, of which ETH 276,827 and BTC 145,148."
  - "GMX's volume denominator is summed from the same squid, over executed tradeActions with orderType 2 or above, which excludes the plain swap types. Numerator and denominator therefore carry one definition. Cached for 15 minutes because the query pages over a few thousand rows."
  - "Aster: liquidations from Coinalyze hourly buckets for Aster's markets, in base units, converted at Hyperliquid's hourly close for that hour. Aster's own allForceOrders history endpoint answers that it is out of maintenance, forceOrders is per-account, and the public forceOrder websocket carries no history and drops every few minutes, so a 5-minute poller cannot use it. OI and 24h notional from the futures gateway."
  - "Ostium: liquidations from tradeEvents of type LiquidationExecuted on the Ormi-hosted subgraph, which is the venue's only data surface. The size is read from the linked trade, whose notional is 6-decimal USD, because tradeEvents.notional is null on a liquidation row. Cancelled and failed orders are dropped in the harness: a where clause naming those booleans returns no rows at all."
  - "Ostium is small. It executed 418k dollars of notional in the 24h to 2026-09-27 and liquidated nothing on any pair in that window, the most recent liquidation being 40 hours old. Over 7 days the same query returns 99 events including 159,564 dollars on ETH, so the path is live and the 24h zero is the venue. A zero does not rank."
  - "Orderly: liquidations from GET /v1/public/liquidated_positions, the only purpose-built public liquidation endpoint in the cohort that carries history; it takes a time range and pages. Filtering by symbol returns whole liquidated accounts, so only the leg on the requested market counts, at cost_position_transfer, which is already USD. OI, mark price and 24h_amount from /v1/public/futures. meta.total saturates at 500, so paging stops on a short page rather than on it."
  - "Nado: the archive publishes a cumulative liquidated-USD counter per product in its hourly snapshots rather than a tape, so the 24h figure is the difference between two snapshots, one number for the whole window, scaled to 24h by the span the snapshots actually cover. It is published, and because no per-event detail exists the largest-event panel is left blank for it rather than reading 100%. Traded notional and OI come from the same snapshot pair."
  - "Checked, feed present, not pollable: Pacifica (cause) and Extended (tT) flag liquidations on a public tape that reaches back only minutes, and Backpack publishes them on a websocket with no REST form, so all three need a persistent collector. Checked, no public signal: ApeX Omni, GRVT, Vest and StandX expose no liquidation flag on any public endpoint, only behind per-account authentication where it exists at all."
  - "Venues checked and left out, with the reason. edgeX: the v2 deployment has no public trade tape at all (every trades and liquidation path 404s) and the only websocket gateway serves the dead v1 contract ids. Jupiter Perps: /v1/trades requires a wallet address and its action enum has no liquidation value, so there is no venue-level feed. Drift: the venue is now Velocity, a fresh program deployment carrying single-digit thousands of dollars of ETH and BTC open interest."
  - "Aevo: OI from GET /statistics?asset=X&instrument_type=PERPETUAL, open_interest.total x mark_price, with daily_volume as the 24h notional. No public liquidation feed was reachable, so no rate is published and the row is declared unranked."
  - "Not apples to apples across the whole field, and the bench says so rather than implying otherwise. Open interest and traded notional are comparable everywhere. The liquidation definition is not, which is why the ranked field is a subset and every row carries its source."

findings:
  - "{{best_name}} records the lowest ranked liquidation rate at {{best_p50}}, on {{ranked_count}} ranked rows out of {{count}} in the cohort. The rest publish their figures below the field with the reason they are not ranked."
  - "{{name:hyperliquid}} reads {{p50:hyperliquid}} on ETH and does not rank there. Its 0xArchive feed returned 22 ETH liquidations worth 25,834 dollars over the 24h to 2026-09-27, against 693 on BTC worth 1.87M and 569 on SOL worth 2.00M, on ETH and BTC books of comparable size. The ETH coverage is short, so the row publishes without a rank. BTC and SOL rank."
  - "{{name:lighter}} reads {{p50:lighter}}. Until 2026-09-27 this row published 887 dollars of liquidations against 185.6M of ETH volume, because each hourly bucket was captured minutes after its hour opened and then frozen by the dedup key. Coinalyze was reporting 16.36 ETH over the same window, about 44k dollars."
  - "{{name:gains}} reads {{p50:gains}}. Since 2026-09-28 its traded notional is summed per pair from the same diamond logs as its liquidations, so the row goes through the same gate as every other. In the cascade of that day it liquidated 27.3M dollars on ETH against a peak book of 43.7M, 62% of the book, on 423k of collateral venue-wide at a median 73x: the notional is right (two encodings agree to 0.02%) and the leverage is why a 2.8% move clears most of a book."
  - "{{name:dydx}} does not rank on ETH or BTC. Paging the full 24h tape on 2026-09-27 returned one LIQUIDATED fill on each, 466.93 dollars and 16.92, against 54.97M and 7.24M of traded notional. The harness reproduced both to the cent, so the reading is right and it is not a rate: one fill is an event, and the gate now says so by name."
  - "{{name:paradex}} does not rank. Its public tape carried no LIQUIDATION row on ETH or BTC over a full 24 hours, and its ETH book traded 1.4M dollars against 14.9M of open interest. An exact zero off a working feed is published as an observation, not as the lowest rate."
  - "{{name:gmx}} joined the measured field on 2026-09-27. This spec had claimed no liquidation source existed for it; the public squid's tradeActions does carry the order type, and 103 executed liquidations totalling 900,656 dollars were found over the previous 24 hours."
  - "{{name:aster}} and {{name:ostium}} were added the same day. Aster reads {{p50:aster}} on ETH, at 0.18% of its own traded notional. Ostium's feed works on a book of 78k and 158k dollars; it liquidated nothing on 2026-09-27 and 338 dollars in one BTC position on 2026-09-28, which sat inside the volume band and ranked above Hyperliquid until the size gates were added. It publishes without a rank."
  - "{{name:orderly}} and {{name:nado}} were added the same day. Orderly reads {{p50:orderly}} on ETH off a purpose-built public liquidation endpoint with history, at 0.028% of its own traded notional. Nado's archive reports the day as one cumulative figure, 26,033 dollars on BTC and nothing on ETH, so its BTC row ranks and its ETH row publishes a zero without one."
  - "{{name:aevo}} publishes open interest and traded notional with no rate, because every liquidation path on its API 404s, its trade history is per-account and no aggregator covers it. It is declared unranked in the spec rather than dropped, so the gap is visible. edgeX, Jupiter Perps and Drift were checked and left out, with reasons in the methodology."

