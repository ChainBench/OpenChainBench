# OpenChainBench. Bench No 214

slug: algorand-rpc
number: "214"
title: "Algorand RPC endpoints: free public URLs ranked by latency"
seo_title: "Algorand RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Algorand RPC at {{best_p50}} (algod /v2/status last-round p50, 24h). URLs for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for the Algorand algod status endpoint (last-round) against every free, no-key public Algorand node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Algorand is an L1 blockchain using a Pure Proof-of-Stake consensus (BA* Byzantine Agreement) that commits one round every roughly 3.5 seconds with immediate finality and no forks. Algorand nodes expose a REST algod API rather than JSON-RPC: GET /v2/status returns the current last-round (equivalent to block height). Free public API endpoints are available without a key from AlgoNode, Nodely and Tatum. Every provider was live-verified with consecutive keyless GET /v2/status probes at launch.

abstract: |
  Algorand: {{count}} free public RPC endpoints answering `the chain's head call` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single REST GET to /v2/status against every no-key public Algorand algod node that sustains continuous probing: {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / stale / timeout) with an Algorand-scaled staleness gap (90 rounds, around 5 min). The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Algorand-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: HTTP GET to <base>/v2/status with Accept: application/json. Pure REST endpoint, no API key in any request. The response JSON includes last-round (integer round number)."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Algorand-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=algorand. Provider coverage at launch: {{count}} no-key endpoints (AlgoNode, Nodely, Tatum)."

faq:
  - q: "Which Algorand nodes work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today: AlgoNode community node, Nodely (mainnet-api.4160.nodely.dev) and Tatum gateway. Every listed endpoint was live-verified with a GET /v2/status returning a parsable last-round before inclusion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="algorand"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: algonode
    name: AlgoNode
    endpoint: https://mainnet-api.algonode.cloud
    tag: Community-operated free Algorand mainnet API node, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a REST GET to /v2/status sent every 60s from 3 regions to AlgoNode's mainnet endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="algonode", chain="algorand"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="algonode", chain="algorand"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="algonode", chain="algorand"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="algonode", chain="algorand"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="algonode", chain="algorand"}) / sum(ocb:rpc_call:rate_24h{provider="algonode", chain="algorand"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="algonode", chain="algorand"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="algonode", chain="algorand"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="algonode", chain="algorand", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="algonode", chain="algorand", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="algonode", chain="algorand", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="algonode", chain="algorand", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="algonode", chain="algorand", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="algonode", chain="algorand", region="sgp"}[1h])

  - slug: nodely
    name: Nodely
    endpoint: https://mainnet-api.4160.nodely.dev
    tag: Nodely free Algorand algod node (mainnet-api.4160.nodely.dev), no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a REST GET to /v2/status sent every 60s from 3 regions to Nodely's Algorand endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nodely", chain="algorand"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="nodely", chain="algorand"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="nodely", chain="algorand"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="nodely", chain="algorand"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="nodely", chain="algorand"}) / sum(ocb:rpc_call:rate_24h{provider="nodely", chain="algorand"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="nodely", chain="algorand"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="nodely", chain="algorand"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nodely", chain="algorand", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="nodely", chain="algorand", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nodely", chain="algorand", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="nodely", chain="algorand", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nodely", chain="algorand", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="nodely", chain="algorand", region="sgp"}[1h])

  - slug: tatum
    name: Tatum
    endpoint: https://algorand-mainnet-algod.gateway.tatum.io
    tag: Multi-chain RPC gateway with Algorand algod support, public endpoint, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a REST GET to /v2/status sent every 60s from 3 regions to Tatum's Algorand algod gateway."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tatum", chain="algorand"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="tatum", chain="algorand"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="tatum", chain="algorand"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="tatum", chain="algorand"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="tatum", chain="algorand"}) / sum(ocb:rpc_call:rate_24h{provider="tatum", chain="algorand"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="tatum", chain="algorand"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="tatum", chain="algorand"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tatum", chain="algorand", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tatum", chain="algorand", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tatum", chain="algorand", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tatum", chain="algorand", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tatum", chain="algorand", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tatum", chain="algorand", region="sgp"}[1h])
