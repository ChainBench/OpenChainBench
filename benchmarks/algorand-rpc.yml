# OpenChainBench. Bench No 214

slug: algorand-rpc
number: "214"
title: Fastest free Algorand RPC, live no-key endpoint latency
seo_title: "Fastest free Algorand RPC 2026"
seo_description: "{{best_name}} leads free Algorand RPC at {{best_p50}} (algod /v2/status last-round p50, 24h). Measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for the Algorand algod status endpoint (last-round) against every free, no-key public Algorand node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Algorand is an L1 blockchain using a Pure Proof-of-Stake consensus (BA* Byzantine Agreement) that commits one round every roughly 3.5 seconds with immediate finality and no forks. Algorand nodes expose a REST algod API rather than JSON-RPC: GET /v2/status returns the current last-round (equivalent to block height). The AlgoNode community endpoint is available free without a key. Every provider was live-verified with consecutive keyless GET /v2/status probes at launch.

abstract: |
  Per-chain member of the RPC latency cluster, extended to Algorand.
  We measure the round-trip latency of a single REST GET to /v2/status
  against every no-key public Algorand algod node that sustains
  continuous probing: 1 provider at launch, every 60 seconds, from
  us-east, eu-west and Singapore. The harness classifies every response
  (ok / http_err / stale / timeout) with an Algorand-scaled staleness
  gap (90 rounds, around 5 min). The cross-chain view lives on the parent
  rpc-capabilities benchmark; this page is the Algorand-scoped answer
  with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: HTTP GET to <base>/v2/status with Accept: application/json. Pure REST endpoint, no API key in any request. The response JSON includes last-round (integer round number)."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms to 10 s), so percentiles are computed via Prometheus quantile_over_time over the last 24 hours."
  - "Call-result classification: ok (HTTP 200 + parsable last-round), http_err, stale (round more than 90 behind the cross-provider tip), timeout. Latency without reliability is a misleading ranking signal."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain rpc-capabilities benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to chain=algorand. Provider coverage at launch: 1 no-key endpoint (AlgoNode)."

findings:
  - "{{best_name}} currently leads free Algorand RPC at {{best_p50}} (algod /v2/status last-round p50, 24h)."

faq:
  - q: "What is the fastest free Algorand RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (Algorand algod /v2/status last-round p50 over the last 24h), measured against keyless providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Algorand nodes work without an API key?"
    a: "AlgoNode is the primary community-operated endpoint that sustains continuous keyless probing. Every listed endpoint was live-verified with a GET /v2/status returning a parsable last-round before inclusion."
  - q: "Does the fastest Algorand RPC change by region?"
    a: "Often. Public infra concentrates in specific regions; a gateway that wins from Amsterdam can lose from Singapore by multiples. The region tabs at the top of the page re-scope every number to a single origin."
  - q: "How is Algorand RPC latency measured here, technically?"
    a: "One identical REST GET to /v2/status every 60 seconds against each provider from each of 3 regions. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus quantile_over_time over 24 hours. Best-effort measurements; p50 is the median, p90 the 90th percentile and p99 the 99th percentile of latency samples collected over the last 24 hours."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="algorand"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: algonode
    name: AlgoNode
    tag: Community-operated free Algorand mainnet API node, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a REST GET to /v2/status sent every 60s from 3 regions to AlgoNode's mainnet endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="algonode", chain="algorand"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="algonode", chain="algorand"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="algonode", chain="algorand"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="algonode", chain="algorand"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="algonode", chain="algorand"}) / sum(ocb:rpc_call:rate_24h{provider="algonode", chain="algorand"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="algonode", chain="algorand"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="algonode", chain="algorand"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="algonode", chain="algorand", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="algonode", chain="algorand", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="algonode", chain="algorand", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="algonode", chain="algorand", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="algonode", chain="algorand", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="algonode", chain="algorand", region="sgp"}[1h])
