# OpenChainBench. Bench 271
slug: perp-volume-oi-ratio
number: "271"
title: "Perp DEX volume to open interest: 24h turnover per dollar of OI, live"
seo_title: "Perp DEX volume/OI ratio: {{best_name}} at {{best_p50}} turnover"
seo_description: "{{best_name}} turns over {{best_p50}} of its open interest a day, {{worst_name}} {{worst_p50}}. 24h volume over OI for {{count}} perp venues, the screen for volume that no position backs."
subtitle: "24h traded notional divided by open interest, per venue. A ratio of 1.0x means the venue trades its whole open interest once a day. Order-book venues with real position holders sit between 0.3x and 3x; a ratio far above that means volume that no open position backs (incentive farming, wash trading, or a very short-horizon retail flow). Lower ranks first; read the bands, not the rank alone."
category: Trading
status: live
metric: "Volume / OI (24h)"
unit: x
higher_is_better: false
disclaimer: |
  The ratio is a screen, not a verdict. Both terms are the venue's own
  figures (24h volume and open interest as each API reports them, in USD),
  so a venue that counts both legs of a fill moves its ratio without
  changing anything real. A very low ratio (Ostium, 0.2x) means positions
  held for days on thin daily volume; a very high one (Kalshi, above 40x)
  means a day of trading dwarfs what stays open. The bands in the
  methodology say what each range usually means.
seo_intro: |
  Volume is the number every perp DEX leaderboard sorts by, and the one
  easiest to manufacture: points programs, maker rebates and self-matched
  flow all inflate it. Open interest is harder to fake, because a position
  has to be collateralised and held. The ratio of the two says how much of
  the reported volume is backed by positions that exist at the end of the
  day. Binance and Bybit historically run at about 1x to 2x on the majors;
  Hyperliquid at 0.5x with a large, sticky open interest; a venue at 8x or
  40x is turning its book over many times a day. This page publishes the
  ratio for {{count}} venues from the same volume and open-interest
  gauges the /perps hub shows, refreshed every minute, with a 24-hour
  average so a single print does not move the board. It is the screen to
  read before believing a volume ranking.
abstract: |
  For every venue in the perp cohort the harness publishes
  perp_venue_volume_24h_usd (24h traded notional from the venue's own API)
  and perp_venue_oi_usd (open interest in USD, from the venue's API or,
  for GMX v2, from DefiLlama). The bench divides the 24h time average of
  the first by the 24h time average of the second. The result is the
  number of times a venue turned its open interest over in a day. Venues
  where one of the two series is missing (Vest publishes no open interest)
  are left out rather than shown at zero. The ranking sorts ascending so
  the venues whose volume is most position-backed read first, but the
  interesting reading is the distribution: order-book venues with real
  holders cluster between 0.3x and 3x, oracle and pool venues between 1x
  and 4x, and outliers above 8x are where the volume figure deserves a
  second look.
methodology:
  - "Cadence: both gauges come from the perp-cohort-stats harness (every 60 seconds, one native call per venue); the ratio is computed in PromQL at query time from 24h time averages."
  - "Ratio = avg_over_time(perp_venue_volume_24h_usd[24h]) / avg_over_time(perp_venue_oi_usd[24h]), per venue. Volume is the venue's own rolling 24h notional; OI is the venue's own USD open interest (GMX v2: DefiLlama)."
  - "Bands: 0.3x to 3x is the range of order-book venues with real position holders (Hyperliquid 0.5x, dYdX 1.3x, Lighter 2.5x on 2026-09-22); 1x to 4x for pool and oracle venues (Gains 1.4x, GMX v2 4.0x); above 8x the daily volume is many multiples of what stays open (Pacifica 8.5x, Kalshi 41x)."
  - "Venues without one of the two series are excluded: Vest publishes no open interest; SynFutures, KiloEx, Orderly and Backpack publish no OI to the harness."
  - "Both terms are as the venue reports them. A venue counting both legs of every fill doubles its ratio against one that counts one; the bench does not normalise that, the venue formula on each row says what the API returns."
  - "Ranking sorts ascending (lower is first) so the venues whose volume is most backed by open positions lead; the subtitle and the bands are the reading, not the rank alone."
  - "A one-print spike does not move the board: both terms are 24h time averages of gauges sampled every minute."
findings:
  - "{{best_name}} turns over {{best_p50}} of its open interest a day, the most position-backed volume of the {{count}} venues; {{worst_name}} sits at {{worst_p50}}."
  - "{{name:hyperliquid}} reads {{p50:hyperliquid}}: a day of trading is half its open interest, the signature of a large, sticky position base."
  - "{{name:lighter}} reads {{p50:lighter}} and {{name:extended}} {{p50:extended}}, in the upper half of the order-book range; {{name:pacifica}} at {{p50:pacifica}} and {{name:kalshi}} at {{p50:kalshi}} are the outliers where the volume figure deserves a second look."
  - "Pool and oracle venues sit between 1x and 4x: {{name:gains}} {{p50:gains}}, {{name:gmx-v2}} {{p50:gmx-v2}}, {{name:jupiter}} {{p50:jupiter}}."
source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/perp-cohort-stats
prometheus:
  window: 24h
  expected_freshness_seconds: 600
  freshness_metric: perp_venue_volume_24h_usd
faq:
  - q: "What does a volume to open interest ratio of 2x mean?"
    a: "That the venue traded twice its open interest in 24 hours. If $1B of positions are open and $2B changed hands, the ratio is 2x. Order-book venues with real position holders usually sit between 0.3x and 3x; higher means most of the day's volume was opened and closed within the day."
  - q: "Is a high ratio proof of wash trading?"
    a: "No. It is a screen. Incentive programs, maker rebates, market-maker inventory recycling and a retail flow that day-trades all push the ratio up without self-matching. A ratio far above the cohort, sustained, is where to look; the bench publishes the number and the bands, not a verdict."
  - q: "Why does the ranking put the lowest ratio first?"
    a: "Because the question the bench answers is which venues' volume is backed by positions that exist at the end of the day. The rank is one reading; a very low ratio can also mean a venue where positions sit for days on thin volume (Ostium). The bands in the methodology are the second reading."
  - q: "Where do volume and open interest come from?"
    a: "From each venue's own public API through the perp-cohort-stats harness: Hyperliquid metaAndAssetCtxs, Lighter exchangeStats and orderBookDetails, Aster ticker/24hr and openInterest, dYdX perpetualMarkets, Kalshi margin/markets, and so on, every 60 seconds. GMX v2 open interest comes from DefiLlama. The per-venue formula on each row names the source."
  - q: "Why are Vest, SynFutures and KiloEx missing?"
    a: "Vest publishes no open interest on its API; SynFutures and KiloEx are read through CoinGecko, which carries volume only. Without a denominator the ratio would be undefined, so those venues are left out rather than shown at zero."

providers:
  - slug: hyperliquid
    name: Hyperliquid
    tag: HyperBFT L1 orderbook, volume and OI from metaAndAssetCtxs
    formula: "avg_over_time(perp_venue_volume_24h_usd{venue=\"hyperliquid\"}[24h]) / avg_over_time(perp_venue_oi_usd{venue=\"hyperliquid\"}[24h])"
    queries:
      p50: avg_over_time(perp_venue_volume_24h_usd{venue="hyperliquid"}[24h]) / avg_over_time(perp_venue_oi_usd{venue="hyperliquid"}[24h])
      p90: quantile_over_time(0.90, perp_venue_volume_24h_usd{venue="hyperliquid"}[24h]) / avg_over_time(perp_venue_oi_usd{venue="hyperliquid"}[24h])
      p99: quantile_over_time(0.99, perp_venue_volume_24h_usd{venue="hyperliquid"}[24h]) / avg_over_time(perp_venue_oi_usd{venue="hyperliquid"}[24h])
      mean: avg_over_time(perp_venue_volume_24h_usd{venue="hyperliquid"}[24h]) / avg_over_time(perp_venue_oi_usd{venue="hyperliquid"}[24h])
      success: avg_over_time(perp_venue_health{venue="hyperliquid"}[24h])
      sample_size: count_over_time(perp_venue_volume_24h_usd{venue="hyperliquid"}[24h])
      series: perp_venue_volume_24h_usd{venue="hyperliquid"} / perp_venue_oi_usd{venue="hyperliquid"}

