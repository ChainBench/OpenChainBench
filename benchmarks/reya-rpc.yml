# OpenChainBench. Bench № 165

slug: reya-rpc
number: "165"
title: "Reya Network RPC endpoints: free public URLs by latency"
seo_title: "Reya Network RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Reya Network RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). {{count}} no-key endpoints measured, updated every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Reya Network RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Reya Network (chain 1729) is an EVM-compatible L2 purpose-built for perpetual futures trading, featuring a native order book, cross-margin accounts, and a passive liquidity pool. The Reya Foundation's rpc.reya.network and Thirdweb provide keyless access probed every 60 seconds from three regions.

abstract: |
  Reya Network: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:reya-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Reya Network endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Reya Network-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Reya Network-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"reya\"`. Provider coverage today: {{count}} no-key endpoints."


source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="reya"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: reya-official
    name: Reya Foundation
    tag: Reya Foundation's official public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Reya Foundation's no-key Reya Network endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="reya"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="reya"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="reya"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="reya"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="reya"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="reya"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="reya"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="reya"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="reya", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="reya", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="reya", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="reya", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="reya", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="reya", region="sgp"}[1h])

  - slug: thirdweb
    name: Thirdweb
    endpoint: https://1729.rpc.thirdweb.com
    tag: Thirdweb chain-ID RPC gateway
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Thirdweb's no-key Reya Network endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="reya"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="thirdweb", chain="reya"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="thirdweb", chain="reya"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="thirdweb", chain="reya"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="thirdweb", chain="reya"}) / sum(ocb:rpc_call:rate_24h{provider="thirdweb", chain="reya"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="thirdweb", chain="reya"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="reya"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="reya", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="reya", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="reya", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="reya", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="reya", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="reya", region="sgp"}[1h])
