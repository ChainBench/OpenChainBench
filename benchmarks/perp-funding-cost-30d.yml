# OpenChainBench. Bench 272
slug: perp-funding-cost-30d
number: "272"
title: "Funding paid to hold an ETH perp long for 30 days, per venue, live"
seo_title: "30-day ETH funding cost: {{best_name}} cheapest at {{best_p50}}"
seo_description: "A month of ETH perp funding costs {{best_p50}} on {{best_name}} at its average daily rate over the trailing 30 days, {{worst_p50}} on {{worst_name}}. {{count}} DEX and CEX venues, sampled every minute."
subtitle: "A month of funding for an ETH long at each venue's average daily cost over the trailing 30 days, in basis points of notional (BTC and SOL in the p90 and p99 columns). Positive means the long paid, negative means it was paid. The 24h-hold figure on the perp-funding bench is the rate right now; this is what a month at the rates actually observed costs."
category: Trading
status: live
metric: Funding paid, 30d ETH long
unit: bp
higher_is_better: false
row_noun: { one: venue, many: venues }
expected_n: 720
disclaimer: |
  Every row is a month of funding at the venue's average daily cost over
  the hours measured in the trailing 30 days (average x 30). A venue
  ranks only with 576 of the 720 hours (24 days) behind that average;
  under the floor the row is provisional, unranked, and shows its day
  count (the venues added on 2026-09-22 and 2026-09-23 start there).
  Funding is signed: on a month where shorts paid longs the figure is
  negative and "cheapest" means "was paid the most".
seo_intro: |
  A funding rate quoted per hour or per 8 hours says what a position pays
  right now. A trader who held an ETH long through September did not pay
  the current rate; they paid every settlement along the way, and on the
  same day venues can differ by a factor of two. This page integrates the
  normalised 24-hour funding cost the harness records every minute into
  the cost of holding a long for the trailing 7 and 30 days, in basis
  points of notional, for {{count}} venues: the onchain order books
  (Hyperliquid, Lighter, Paradex), the regulated Kalshi book, and the
  large CEX books (Binance, Bybit, OKX, Coinbase, Kraken) as the
  reference. The number a carry trader wants is here: which venue was
  cheapest to be long on over the month, and by how much.
abstract: |
  The perp-cohort-stats harness publishes perp_venue_funding_24h_bps for
  every venue and asset it covers: the venue's current funding rate,
  normalised from its settlement interval (1h, 4h or 8h) to the cost in
  basis points of holding a long for 24 hours, sampled every minute. The
  bench averages that series over the trailing 30 days and multiplies by
  30: a month of funding at the average daily cost the venue actually
  quoted. The same figure over 7 days is in the mean column. ETH is the
  headline; BTC and SOL sit in the p90 and p99 columns on the same
  convention as the perp-funding bench. The sample count per row is the
  number of hours behind the average: 720 for a full month, and a venue
  ranks only with 576 of them (24 days), because a total over fewer days
  would rank on coverage rather than on cost. Under that floor the row
  is provisional and unranked, with its day count: a month at the rate
  of the days measured, which the sample-health badge flags until 15
  days and the provisional label until 24.
methodology:
  - "Source series: perp_venue_funding_24h_bps{venue,asset} from the perp-cohort-stats harness (each venue's own rate endpoint where the harness reads one: Kalshi, Vest, StandX, ApeX, Polymarket, Extended, edgeX, Pacifica, Aster, and Lighter since 2026-09-23, whose window before that date is the Mobula series for the same venue, identical at the switch; the Mobula funding aggregator for Hyperliquid and the CEX rows), sampled every 60 seconds and read here on an hourly grid ([30d:1h])."
  - "30d cost = avg_over_time(series[30d:1h]) x 30: the average daily cost over the hours measured in the window, times a month. A venue is ranked only with 576 hourly samples (24 days) behind that average; under the floor the figure is a month at the rate of the days measured and the row carries its day count. 7d cost is avg_over_time(series[7d:1h]) x 7 (mean column)."
  - "Columns: p50 = ETH 30d, p90 = BTC 30d, p99 = SOL 30d, mean = ETH 7d. The column labels are inherited from the latency template; the values are signed bps."
  - "Sign: positive means the long paid funding to shorts; negative means shorts paid longs. Lower ranks first, so on a month where shorts paid, the venue that paid longs the most is first."
  - "Sample health: expected_n is 720 (a month of hourly samples). A venue ranks only with 576 of them (24 days, 80 percent of the grid, which absorbs harness restarts): the figure does not move with coverage, but an average over a few days is not a month's evidence. Under the floor the row is unranked and shows its day count. A feed that stops loses its hours: the harness drops a rate nobody refreshed for five minutes (ten on edgeX and ApeX, read through a ticker cache) rather than repeat it. Venues added on 2026-09-22 and 23 start under the floor."
  - "Interval normalisation is the venue's: Hyperliquid, Vest, StandX and ApeX settle hourly, Kalshi every 8 hours (three settlements a day), the CEX rows per their own schedule; every row is expressed as cost per 24h before integrating."
  - "This page does not replace perp-funding (bench 036), which ranks the rate right now; it ranks what the last month cost."
findings:
  - "{{best_name}} was the cheapest venue to hold an ETH long over the trailing 30 days, {{best_p50}} of funding for the month at its average daily rate; {{worst_name}} cost {{worst_p50}}."
  - "{{name:hyperliquid}} at {{p50:hyperliquid}} for the month, {{name:lighter}} at {{p50:lighter}}: the two largest onchain books against the CEX reference of {{name:binance}} at {{p50:binance}} and {{name:bybit}} at {{p50:bybit}}."
  - "{{name:okx}} {{p50:okx}}, {{name:coinbase-international}} {{p50:coinbase-international}}, {{name:kraken}} {{p50:kraken}}: the spread between CEX books over a month is itself several basis points, the carry a cross-venue position collects."
  - "Rows with a low-sample badge (the venues that joined on 2026-09-22 and 2026-09-23) show a month at the average daily cost of the days measured since they joined, with the day count on the row; they take a rank once 24 days are behind the average, in mid-October."
source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/perp-cohort-stats
prometheus:
  window: 30d
  expected_freshness_seconds: 600
  freshness_metric: perp_venue_funding_24h_bps
faq:
  - q: "How is the 30-day funding cost computed?"
    a: "The harness records every minute the venue's current funding rate normalised to the cost of holding a long for 24 hours. The bench averages that series over the trailing 30 days on an hourly grid and multiplies by 30: a month of funding at the average daily cost the venue quoted, in basis points of notional. A venue ranks only with 24 days behind that average; with fewer the row shows its day count and no rank. The 7-day figure is the same average over 7 days times 7."
  - q: "Why is the number negative on some venues?"
    a: "Funding is signed. When the perp trades below spot, shorts pay longs and a long collects funding; the cost is then negative. Lower ranks first, so on such a month the venue that paid longs the most is at the top."
  - q: "Is this what I would have paid?"
    a: "For a long of constant notional held the whole window on a venue with a full month measured, yes, to the precision of a per-minute sample of the quoted rate. A position opened mid-window, resized, or held on a venue that settles funding in discrete 8-hour steps (Kalshi) pays the settlements it was open for; the bench does not model entries and exits. A rate no source refreshed for five minutes is dropped, not repeated, so hours the harness could not read leave the average (at most five minutes of a last value can precede a gap, ten on edgeX and ApeX, which read a ticker cache)."
  - q: "Why are CEXs on a perp DEX bench?"
    a: "Because the reference a carry trader compares a DEX against is Binance, Bybit or OKX. The CEX rows come from the same Mobula funding feed the perp-funding bench uses (so does Hyperliquid's); the other DEX rows and Kalshi come from each venue's own API."
  - q: "Why do Kalshi, Vest, StandX and ApeX show a low-sample badge?"
    a: "They joined the cohort on 2026-09-22 (Extended, edgeX, Pacifica, Aster and Lighter RH on 2026-09-23). Their figure is a month at the average daily cost of the days measured since then; the sample count on the row says how many hours are behind it. The badge goes at 15 days (half a month of samples), the provisional label and the rank come at 576 hours, 24 days."

providers:
  - slug: hyperliquid
    name: Hyperliquid
    tag: Onchain order book, hourly funding
    formula: "Average of perp_venue_funding_24h_bps{venue=\"hyperliquid\",asset=\"ETH\"} over the days measured in the trailing 30 (hourly samples) x 30: the month's funding at that average daily cost, in bps of notional; ranked with 24 days measured."
    queries:
      p50: avg_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="ETH"}[30d:1h]) * 30
      p90: avg_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="BTC"}[30d:1h]) * 30
      p99: avg_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="SOL"}[30d:1h]) * 30
      mean: avg_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="ETH"}[7d:1h]) * 7
      success: ((perp_venue_funding_refresh_unix{venue="hyperliquid",asset="ETH"} > bool (time() - 900)) or on() vector(0))
      sample_size: count_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="ETH"}[30d:1h])
      ranked: (count_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="ETH"}[30d:1h]) >= bool 576)
      series: avg_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="ETH"}[30d:1h]) * 30

