# OpenChainBench. Bench 272
slug: perp-funding-cost-30d
number: "272"
title: "Funding paid to hold an ETH perp long for 30 days, per venue, live"
seo_title: "30-day ETH funding cost: {{best_name}} cheapest at {{best_p50}}"
seo_description: "Holding an ETH perp long for 30 days cost {{best_p50}} of funding on {{best_name}}, {{worst_p50}} on {{worst_name}}. {{count}} DEX and CEX venues, accumulated from the live rate every minute."
subtitle: "Funding accumulated by a long held for the trailing 30 days, in basis points of notional, per venue on ETH (BTC and SOL in the p90 and p99 columns). Positive means the long paid, negative means it was paid. The 24h-hold figure on the perp-funding bench is the rate right now; this is what the month actually cost."
category: Trading
status: live
metric: Funding paid, 30d ETH long
unit: bp
higher_is_better: false
expected_n: 720
disclaimer: |
  A venue that joined the cohort less than 30 days ago (Kalshi, Vest,
  StandX, ApeX Omni on 2026-09-22) shows the average daily cost times
  the days it has been measured, with a sample count well under a month
  of hours; the sample-health badge marks those rows and they are not
  ranked before three days of data. Funding is signed: on a month where shorts paid longs the
  figure is negative and "cheapest" means "was paid the most".
seo_intro: |
  A funding rate quoted per hour or per 8 hours says what a position pays
  right now. A trader who held an ETH long through September did not pay
  the current rate; they paid every settlement along the way, and on the
  same day venues can differ by a factor of two. This page integrates the
  normalised 24-hour funding cost the harness records every minute into
  the cost of holding a long for the trailing 7 and 30 days, in basis
  points of notional, for {{count}} venues: the onchain order books
  (Hyperliquid, Lighter, Paradex), the regulated Kalshi book, and the
  large CEX books (Binance, Bybit, OKX, Coinbase, Kraken) as the
  reference. The number a carry trader wants is here: which venue was
  cheapest to be long on over the month, and by how much.
abstract: |
  The perp-cohort-stats harness publishes perp_venue_funding_24h_bps for
  every venue and asset it covers: the venue's current funding rate,
  normalised from its settlement interval (1h, 4h or 8h) to the cost in
  basis points of holding a long for 24 hours, sampled every minute. The
  bench averages that series over the trailing 30 days and multiplies by
  the days measured in the window, capped at 30: the average daily cost
  times the days a long was exposed is the funding it paid. The same figure over 7 days is
  in the mean column. ETH is the headline; BTC and SOL sit in the p90 and
  p99 columns on the same convention as the perp-funding bench. The
  sample count per row is the number of hours the venue has been in the
  window: 720 for a full month, a few dozen for a venue that joined this
  week, which the sample-health badge flags; for those rows the average
  is multiplied by the days measured, not by 30, so the figure is what
  the position accumulated, never a projection.
methodology:
  - "Source series: perp_venue_funding_24h_bps{venue,asset} from the perp-cohort-stats harness (native venue APIs for the DEXs and Kalshi, the Mobula funding aggregator for the CEX rows), sampled every 60 seconds and read here on an hourly grid ([30d:1h])."
  - "30d cost = avg_over_time(series[30d:1h]) x min(days measured, 30), where days measured = count_over_time(series[30d:1h]) / 24. A venue with a full month in the window pays average daily cost x 30; a venue measured for 3 days pays average x 3, the funding it accumulated, not a month projected from three days. 7d cost is the same with a 7 day cap (mean column)."
  - "Columns: p50 = ETH 30d, p90 = BTC 30d, p99 = SOL 30d, mean = ETH 7d. The column labels are inherited from the latency template; the values are signed bps."
  - "Sign: positive means the long paid funding to shorts; negative means shorts paid longs. Lower ranks first, so on a month where shorts paid, the venue that paid longs the most is first."
  - "Sample health: expected_n is 720 (a month of hourly samples). A venue under 10 % of that (three days) is shown but not ranked; under 50 % it carries a low-sample badge and its figure covers the days measured. The four venues added on 2026-09-22 start there."
  - "Interval normalisation is the venue's: Hyperliquid, Vest, StandX and ApeX settle hourly, Kalshi every 8 hours (three settlements a day), the CEX rows per their own schedule; every row is expressed as cost per 24h before integrating."
  - "This page does not replace perp-funding (bench 036), which ranks the rate right now; it ranks what the last month cost."
findings:
  - "{{best_name}} was the cheapest venue to hold an ETH long over the trailing 30 days at {{best_p50}} of funding; {{worst_name}} cost {{worst_p50}}."
  - "{{name:hyperliquid}} accumulated {{p50:hyperliquid}}, {{name:lighter}} {{p50:lighter}}: the two largest onchain books against the CEX reference of {{name:binance}} at {{p50:binance}} and {{name:bybit}} at {{p50:bybit}}."
  - "{{name:okx}} {{p50:okx}}, {{name:coinbase}} {{p50:coinbase}}, {{name:kraken}} {{p50:kraken}}: the spread between CEX books over a month is itself several basis points, the carry a cross-venue position collects."
  - "Rows with a low-sample badge (Kalshi, Vest, StandX, ApeX Omni) show the funding accumulated since they joined the cohort (average daily cost x days measured), not a month; the figure grows into a 30-day number over October and the row takes a rank after three days."
source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/perp-cohort-stats
prometheus:
  window: 30d
  expected_freshness_seconds: 600
  freshness_metric: perp_venue_funding_24h_bps
faq:
  - q: "How is the 30-day funding cost computed?"
    a: "The harness records every minute the venue's current funding rate normalised to the cost of holding a long for 24 hours. The bench averages that series over the trailing 30 days on an hourly grid and multiplies by the days actually measured in the window (30 for a venue with a full month, fewer for a venue that joined recently): the funding a long held over those days paid, in basis points of notional. The 7-day figure is the same with a 7 day cap."
  - q: "Why is the number negative on some venues?"
    a: "Funding is signed. When the perp trades below spot, shorts pay longs and a long collects funding; the cost is then negative. Lower ranks first, so on such a month the venue that paid longs the most is at the top."
  - q: "Is this what I would have paid?"
    a: "For a long of constant notional held the whole window, yes, to the precision of a per-minute sample of the quoted rate. A position opened mid-window, resized, or held on a venue that settles funding in discrete 8-hour steps (Kalshi) pays the settlements it was open for; the bench does not model entries and exits."
  - q: "Why are CEXs on a perp DEX bench?"
    a: "Because the reference a carry trader compares a DEX against is Binance, Bybit or OKX. The CEX rows come from the same Mobula funding feed the perp-funding bench uses; the DEX and Kalshi rows come from each venue's own API."
  - q: "Why do Kalshi, Vest, StandX and ApeX show a low-sample badge?"
    a: "They joined the cohort on 2026-09-22. Their figure is the funding accumulated over the days measured since then, not a month; the sample count on the row says how many hours are in it. They take a rank once they pass three days (10 percent of a month) and lose the badge at 15 days."

providers:
  - slug: hyperliquid
    name: Hyperliquid
    tag: Onchain order book, hourly funding
    formula: "avg of perp_venue_funding_24h_bps{venue=\"hyperliquid\",asset=\"ETH\"}} over the days measured in the trailing 30 (hourly samples) x those days, capped at 30: bps of notional a long paid."
    queries:
      p50: avg_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="ETH"}[30d:1h]) * clamp_max(count_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="ETH"}[30d:1h]) / 24, 30)
      p90: avg_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="BTC"}[30d:1h]) * clamp_max(count_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="BTC"}[30d:1h]) / 24, 30)
      p99: avg_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="SOL"}[30d:1h]) * clamp_max(count_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="SOL"}[30d:1h]) / 24, 30)
      mean: avg_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="ETH"}[7d:1h]) * clamp_max(count_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="ETH"}[7d:1h]) / 24, 7)
      success: (perp_venue_last_refresh_unix{venue="hyperliquid",source="hl_native"} > bool (time() - 900))
      sample_size: count_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="ETH"}[30d:1h])
      series: avg_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="ETH"}[30d:1h]) * clamp_max(count_over_time(perp_venue_funding_24h_bps{venue="hyperliquid",asset="ETH"}[30d:1h]) / 24, 30)

