# OpenChainBench. Bench 201

slug: solana-trading-platform-wars
number: "201"
title: "Trading platform leaderboard: GMGN vs Axiom vs Fomo vs Trojan, daily Solana volume"
seo_title: "Solana trading app volume: GMGN vs Axiom vs Fomo vs Trojan"
seo_description: "{{best_name}} leads {{ranked_count}} trading apps at {{best_p50}} of Solana volume, attributed by the fee wallet each transaction pays, refreshed daily. GMGN, Axiom, Fomo, Trojan, Terminal, Photon."
subtitle: Daily Solana trading volume per app and Telegram bot, attributed by the fee wallet each transaction pays. Built from our own SQL over Dune's solana.account_activity and dex_solana.trades, one execution a day.

category: Trading
status: live
metric: 24h volume
unit: usd
higher_is_better: true

disclaimer: |
  Volume is the Solana leg only. A transaction counts for a platform when that platform's fee wallet received value in it, and one leg per transaction and trader is taken so a multi-hop route is not counted twice. GMGN, Axiom and Terminal also trade on EVM chains and those legs are not in here, so their figures sit below a cross-chain total. Fomo is measured on its USDC fee leg. pump.fun and BasedBot read unresponsive. The query runs once a day, so a figure holds for the day.

seo_intro: |
  Solana's trading frontend market is a contested race between GMGN, Axiom and
  Fomo, with Trojan and Terminal behind them. This benchmark measures the daily
  Solana volume attributed to each app by the fee wallet its transactions pay,
  from our own SQL over Dune's raw and Spellbook tables rather than from anyone's
  uploaded spreadsheet. {{best_name}} leads at {{best_p50}} as of the last
  refresh, and the order of the top three changes from one day to the next rather
  than settling. Trojan serves the Telegram-native segment with bot-driven flow
  and Terminal is pump.fun's own trading app, formerly Padre. The fee column
  shows which apps collect the most per dollar traded; see the methodology for
  what the attribution counts and what it leaves out.

abstract: |
  The harness runs one Dune execution a day against its own SQL over
  solana.account_activity, dex_solana.trades and prices.day, and exposes
  dune_platform_volume_24h_usd, dune_platform_fees_24h_usd,
  dune_platform_volume_data_day_unix and dune_platform_volume_health per
  platform. The query takes the transactions in which a platform's fee wallet
  received value and sums one dex_solana.trades leg per transaction and trader,
  so the figure is a daily snapshot rather than a rolling window: it holds for
  the day and steps once when the next execution lands. Prometheus scrapes the
  gauges every 60 s, which keeps them current but does not make the underlying
  number move faster.

methodology:
  - "Source: our own SQL over Dune's solana.account_activity, dex_solana.trades and prices.day. No uploaded third-party dataset. The eight this bench read until 2026-09-27 all stopped on 2026-08-25 and were republished as current for 32 days, which is why the source tier matters."
  - "Attribution: a transaction counts for a platform when that platform's fee wallet received value in it. Keying on the fee collector rather than on a router survives a platform rotating routers, which they do. Wallet lists come from the DeFiLlama adapter repo and from our solana-unique-traders harness, read 2026-09-27."
  - "One leg per trade: each transaction and trader contributes one dex_solana.trades leg, the SOL leg where there is one and otherwise the largest. Counting every leg reads 8% to 18% higher across this cohort."
  - "Fees: the SOL, USDC and wSOL a platform received on those same transactions, priced with the day's SOL close. An inflow with no trade behind it, such as a sweep between two of a platform's own fee wallets, is not a fee and is not counted, so the take rate's two halves describe the same transactions."
  - "Day: the newest UTC day that closed at least 10 hours earlier, the rule DeFiLlama's own Solana adapters use, so the two sets of figures are comparable. dune_platform_volume_data_day_unix carries the day each figure is for."
  - "Stale source: a platform whose data day falls more than 3 days behind, or that the query stops returning, has its gauges deleted and reads unresponsive. An old figure is never republished as current."
  - "Scope: Solana only. GMGN, Axiom and Terminal also trade on EVM chains, and those legs are not counted here."
  - "pump.fun and BasedBot are not measured. pump.fun charges no bonding-curve fee since Aug 2026, so fee-wallet attribution cannot see it; no public fee wallet or router list for BasedBot exists to attribute it from."
  - "Cadence: one Dune execution per data day, about 25 credits a run, retried up to three times an hour apart if it fails. Prometheus scrapes :2112/metrics every 60 s, so the gauge is current while the underlying figure changes daily."

findings:
  - "{{best_name}} leads Solana trading platforms at {{best_p50}} 24h volume."
  - "{{best_name}} leads at {{best_p50}} as of the last refresh. GMGN and Axiom both serve power traders with web terminals, GMGN through AI copy-trading and Axiom through execution speed, and the two trade places between refreshes."
  - "{{name:fomo}} reads {{p50:fomo}} and {{name:trojan}} {{p50:trojan}}, so the distance between a web terminal and the Telegram-native segment is visible in the table rather than asserted."
  - "Trojan serves the Telegram-native segment and accounts for bot-driven swap flow. Terminal is pump.fun's own trading app, formerly Padre, and is measured from its own fee wallets."
  - "pump.fun and BasedBot read unresponsive. pump.fun charges no bonding-curve fee, so there is no fee wallet to attribute its frontend volume from, and BasedBot has no public wallet list at all."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/dune-platform-volume

prometheus:
  window: 24h
  freshness_metric: dune_platform_volume_24h_usd

faq:
  - q: "Which Solana trading platform has the most volume?"
    a: "{{best_name}} leads at {{best_p50}} as of the last refresh, and GMGN, Axiom and Fomo trade places between refreshes. The table is rebuilt from one Dune execution a day, so a figure holds for the day and steps once when the next lands: read it as a complete day, not as an intraday ticker. Headlines claiming one app has overtaken another are usually a single day or a single metric."
  - q: "Why is the pump.fun row empty?"
    a: "pump.fun cut its bonding-curve fee to 0% in Aug 2026, so no fee wallet receives anything on its trades and the attribution this bench uses cannot see them. The retired dataset that used to fill this row stopped updating on 2026-08-25. Reading pump.fun's own app program instead is possible, but it lands 33% away from the series this row used to carry, so it would be a different measurement under the same name. The row reads unresponsive until there is an attribution that matches."
  - q: "What is the difference between GMGN and Axiom?"
    a: "Both are web-based Solana trading terminals targeting power traders. GMGN emphasizes AI-powered wallet analysis and copy trading. Axiom is a terminal-style platform focused on chart speed and order execution. Both route through Jupiter and direct DEX pools."
  - q: "Why is Fomo measured differently from the others?"
    a: "Fomo takes a flat USDC fee into R4rNJHaffSUotNmqSKNEfDcJE8A7zJUkaoM5Jkd7cYX and sponsors the gas on every trade it routes, so one transaction carries several trader ids and the per-transaction-and-trader rule would count one trade as many. Its volume is the largest USDC leg per transaction instead, the rule its own DeFiLlama adapter uses. Fomo also settles cross-chain trades through Relay, which is not on Solana and not counted, so the figure here is its Solana activity rather than its whole business."
  - q: "Are Trojan and Terminal Telegram bots?"
    a: "Trojan is a Telegram-native trading bot. Terminal is pump.fun's trading app, formerly Padre, acquired in Apr 2025. Both are measured the same way, from the fee wallets their transactions pay, so the comparison does not depend on how either describes itself."
  - q: "How is trading platform volume different from launchpad volume?"
    a: "Launchpad volume (bench 200) counts swaps through bonding-curve programs like pump.fun or Flap. Volume here counts swaps attributed to a trading app whatever DEX or launchpad sat underneath. The attribution is mutually exclusive: a trade on pump.fun tokens routed through GMGN counts under GMGN, not under pump.fun."
  - q: "Why does BullX show zero or low volume?"
    a: "BullX has no fee wallet list this bench can attribute it from, so there is nothing to measure here rather than a measurement showing zero. Its cross-chain DEX volume is tracked in bench 205."
  - q: "What happens when the source stops updating?"
    a: "The harness publishes the data day alongside every figure. A platform whose day falls more than 3 days behind, or that the query stops returning at all, has its gauges deleted and its row reads unresponsive. That is the fix for what went wrong here before: the previous source froze on 2026-08-25 and the old query took the newest row it had, so a month-old day kept being served as live with nothing erroring."

