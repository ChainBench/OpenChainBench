    name: dRPC
    endpoint: https://superseed.drpc.org
    tag: dRPC public gateway routing to a Superseed node pool
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to dRPC's no-key superseed RPC endpoint."
    queries:
