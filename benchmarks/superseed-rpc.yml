          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="superseed", region="sgp"}[1h])

  - slug: thirdweb
    name: Thirdweb
    endpoint: https://5330.rpc.thirdweb.com
    tag: Thirdweb public RPC gateway for Superseed
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Thirdweb's no-key superseed RPC endpoint."
    queries:
