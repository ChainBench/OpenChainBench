# OpenChainBench. Bench № 035

slug: hyperliquid-hip3-deployers
number: "035"
title: Hyperliquid HIP-3 dex volume leaderboard
seo_title: "Hyperliquid HIP-3 dexes: {{count}} deployers ranked by volume"
seo_description: "{{count}} HIP-3 dexes on Hyperliquid ranked by 24h notional volume: {{best_name}} cleared {{best_p50}}. Markets and open interest per dex, from the public info API."
subtitle: How much notional each HIP-3 builder-deployed dex traded over the rolling 24 hours, with its live market count and open interest, from the Hyperliquid info API that every node serves.
category: Trading
status: live
metric: Volume 24h
unit: usd
higher_is_better: true

disclaimer: |
  Ranking is by rolling 24h notional volume across the dex's namespaced markets, as reported by the Hyperliquid info API. Deployer fee revenue is not published by the chain's public endpoints and is not shown; the earlier version of this page derived it from a self-hosted node, which is retired. Core Hyperliquid markets (no namespace) are excluded. Every namespace is matched to its operating team through the on-chain perpDexs registry, which publishes the deployer address and full name.

seo_intro: |
  This page answers one question. Which HIP-3 builder-deployed dex on
  Hyperliquid traded the most notional over the last 24 hours, how many
  markets it runs and how much open interest sits on them. HIP-3 lets any
  team that stakes 500,000 HYPE deploy its own perpetual markets on
  HyperCore under a dedicated namespace (xyz:AAPL, para:10Y, mkts:US500),
  set the fee policy for those markets, and collect a deployer cut on
  every fill. The mechanism powers the tokenized stock, index and
  commodity perps on Hyperliquid; {{best_name}} leads the field today at
  {{best_p50}} of 24h notional. The bench ranks every namespace registered on
  mainnet by the 24h notional the chain reports for its markets, next to
  the number of markets that traded, the number listed, open interest in
  USD and 7 day and 30 day volume built from one sample per UTC day. Data
  comes from the public Hyperliquid info API (perpDexs and
  metaAndAssetCtxs), polled every 10 minutes by a Go harness on OCB
  infrastructure that exposes Prometheus gauges this page consumes.

abstract: |
  The bench ranks HIP-3 builder-deployed dexes by the notional volume
  their markets traded over the rolling 24 hours. Source data is the
  Hyperliquid info API, the same endpoint the official frontend and every
  node serve: perpDexs lists each deployed dex with its deployer address
  and full name, and metaAndAssetCtxs with a dex parameter returns each
  market's rolling 24h notional (dayNtlVlm), open interest and mark
  price. A Go harness on OCB infrastructure polls both every 10 minutes,
  sums notional and open interest per dex, counts markets listed and
  markets with non-zero volume, and exposes the totals as Prometheus
  gauges (hl_hip3_deployer_volume_usd_24h, _markets_24h,
  _markets_listed, _open_interest_usd). Once a day, right after
  midnight UTC, it records each dex's 24h volume as that day's sample;
  the 7 day and 30 day figures sum those samples. The dex set is the
  on-chain registry, no hand-curated list, because HIP-3 namespaces are
  unique on chain by construction. The bench does not place trades, does
  not touch private keys, and does not depend on a node or internal
  service.

methodology:
  - "Data source. The public Hyperliquid info API at api.hyperliquid.xyz/info. perpDexs returns every HIP-3 dex with its namespace, full name and deployer address; metaAndAssetCtxs with the dex parameter returns, per market, the rolling 24h notional volume (dayNtlVlm), open interest in base units and the mark price. No key, no node."
  - "Attribution. A market belongs to the dex whose namespace prefixes its coin (xyz:AAPL belongs to xyz). Namespaces are unique on chain by construction, so the on-chain registry is the provider list; a newly deployed dex starts being metered on the next poll and joins this page after a short spec review. Core Hyperliquid markets carry no namespace and are excluded, and a dex whose markets are all delisted (flx, vntl, hyna, km, cash on 2026-09-24) is metered but not listed."
  - "Cadence. The Go harness polls perpDexs and one metaAndAssetCtxs call per dex every 10 minutes. Prometheus scrapes the gauges every 30 seconds. The 24h figure is the chain's own rolling window, so the page is at most about 10 minutes behind the API."
  - "Headline calculation. For each dex, the sum of dayNtlVlm across its listed markets: the notional traded over the trailing 24 hours as computed by the chain."
  - "Markets. Two counts per dex: markets currently listed (delisted excluded) and markets with non-zero notional over the trailing 24 hours. A dex with 100 active equity markets and a dex with one commodity market are different products; the columns make that visible next to the volume."
  - "Open interest. Per market, open interest in base units times the mark price, summed per dex, in USD. A snapshot at poll time, not a window."
  - "7 day and 30 day volume. Once a day, on the first poll after 00:00 UTC, the harness stores each dex's 24h notional as the sample for the day that just closed. The 7 day and 30 day figures sum the last 7 and 30 samples. Samples accumulate from the day the feed edition went live, so those figures grow toward the full window and the days-sampled gauge says how many are behind them."
  - "Deployer fees. HIP-3 deployers configure a fee share and receive a cut of every fill, but the chain's public endpoints do not expose that revenue per fill or per dex. The earlier version of this bench read the deployerFee field from a self-hosted node's fill stream; that node is retired and the column is gone rather than estimated."
  - "Naming. Every namespace is resolved against the on-chain perpDexs registry: xyz is trade.xyz, mkts (and the retired km) is Markets by Kinetiq, para is Paragon, io is EntropyIO; vntl (Ventuals), cash (Dreamcash), hyna (HyENA) and flx (Felix Exchange) have delisted every market. Attribution is by namespace either way, so the numbers do not depend on naming."
  - "Reproducibility. Harness source is open in the OCB harness tree (harnesses/hyperliquid-frontends). Anyone can call the same two info endpoints and reproduce every number on this page."
  - "Failures. A failed poll for one dex leaves its previous gauge values in place; the harness liveness gauge drives the availability column. Daily samples are written once and never overwritten."

findings:
  - "{{best_name}} leads the leaderboard at {{best_p50}} in notional traded over the last 24 hours."
  - "{{name:xyz}} clears {{p50:xyz}} on the 24h view. Tokenized equities and commodities trade under the xyz namespace; the Markets columns show how many are live."
  - "{{name:io}} returns {{p50:io}} on the 24h view. Thematic and pre IPO markets are a smaller but structurally distinct niche, traders price sectors and private valuations rather than listed stock."
  - "HIP-3 volume concentrates hard. The top namespace typically trades more than the rest of the field combined, mirroring the builder code market where consumer wallets dominate."
  - "Volume moves with catalog depth and listing events. The Markets columns separate a broad equity catalog from a single-market dex, and open interest shows where positions actually sit."
  - "The 7 day and 30 day figures smooth out listing events and promo spikes. Use those for ranking stability, the 24h view for current activity."

faq:
  - q: "What does this benchmark measure?"
    a: "The notional volume each HIP-3 builder-deployed dex traded over the rolling 24 hours, as reported by the Hyperliquid info API, next to its market counts, open interest and 7 day and 30 day volume. HIP-3 lets a team that stakes 500,000 HYPE deploy its own perpetual markets on Hyperliquid under a dedicated namespace and collect a fee cut on every fill."
  - q: "What is HIP-3?"
    a: "Hyperliquid Improvement Proposal 3, builder-deployed perpetuals. It opens HyperCore market deployment to outside teams: stake 500,000 HYPE, deploy markets under your namespace, set the fee policy, collect the deployer cut. It powers the tokenized stock, index and commodity perps on Hyperliquid, which represent a large share of platform volume."
  - q: "Where does the data come from?"
    a: "The public Hyperliquid info API, the same endpoint the official app and every node serve. perpDexs gives the dex registry; metaAndAssetCtxs with a dex parameter gives each market's rolling 24h notional, open interest and mark price. A Go harness on OCB infrastructure polls both every 10 minutes. No node, no key, no internal service."
  - q: "Why is deployer fee revenue no longer shown?"
    a: "The chain's public endpoints do not expose deployer fees per fill or per dex. The earlier version of this page read the deployerFee field from the fill stream of a node OCB hosted; that node is retired. Volume, markets and open interest are what the chain publishes, so that is what the bench measures. Estimating fees from volume and each dex's fee share would depend on every trader's fee tier and maker share, so it is not done."
  - q: "How are dexes identified?"
    a: "By their on-chain coin namespace. Every HIP-3 market trades under a prefix (xyz:AAPL, para:10Y, mkts:US500) that is unique to its deployer. The perpDexs registry lists each namespace with its deployer address and full name; the page lists each new namespace after a short spec review."
  - q: "What puts a dex at the top of this table?"
    a: "Catalog depth and open interest. The Markets and Open interest columns show which dex lists the most markets and holds the most positions; the leader is recomputed from the live figures on every render, so the table, not this paragraph, says who is ahead today."
  - q: "Why do 7 day and 30 day figures look low for some dexes?"
    a: "They are sums of one 24h sample per UTC day, recorded since the feed edition of the harness went live. Until 7 and 30 samples exist, those figures cover the available days and grow toward the full window. The 24h view is always complete."
  - q: "How often does the page refresh?"
    a: "The harness polls the info API every 10 minutes and Prometheus scrapes every 30 seconds. The page uses incremental static regeneration with a 60 second window, so headline values are at most about 12 minutes behind the API."
  - q: "Can I cite a value from this page?"
    a: "Yes. Every number is a Prometheus query exposed via the OCB API endpoints. The harness source is open at the link in the source field below. Cite the value and the timestamp at the top of the page."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/hyperliquid-frontends

prometheus:
  window: 24h
  expected_freshness_seconds: 1800
  freshness_timestamp_metric: hl_hip3_last_tick_unix

# Gauges from harnesses/hyperliquid-frontends (feed edition), label `dex`:
#   hl_hip3_deployer_volume_usd_24h     p50 headline (USD notional, chain's rolling 24h)
#   hl_hip3_deployer_open_interest_usd  p90 column
#   hl_hip3_deployer_markets_24h        p99 column (markets that traded)
#   hl_hip3_deployer_markets_listed     sample_size
#   hl_hip3_deployer_volume_usd_{7d,30d}, hl_hip3_deployer_days_sampled
#   hl_hip3_last_tick_unix              liveness (success query)

providers:
  - slug: xyz
    name: trade.xyz
    tag: Tokenized US equities, indices and commodities, 100+ markets
    formula: "Sum of dayNtlVlm across xyz namespaced markets from metaAndAssetCtxs, the chain's rolling 24h notional."
    queries:
      p50: hl_hip3_deployer_volume_usd_24h{dex="xyz"}
      p90: hl_hip3_deployer_open_interest_usd{dex="xyz"}
      p99: hl_hip3_deployer_markets_24h{dex="xyz"}
      mean: avg_over_time(hl_hip3_deployer_volume_usd_24h{dex="xyz"}[7d])
      success: (hl_hip3_last_tick_unix > bool (time() - 1800))
      sample_size: hl_hip3_deployer_markets_listed{dex="xyz"}
      series: hl_hip3_deployer_volume_usd_24h{dex="xyz"}


  - slug: mkts
    name: Markets by Kinetiq (mkts)
    tag: Index and volatility markets under the mkts namespace, by Kinetiq
    formula: "Sum of dayNtlVlm across mkts namespaced markets from metaAndAssetCtxs, the chain's rolling 24h notional."
    queries:
      p50: hl_hip3_deployer_volume_usd_24h{dex="mkts"}
      p90: hl_hip3_deployer_open_interest_usd{dex="mkts"}
      p99: hl_hip3_deployer_markets_24h{dex="mkts"}
      mean: avg_over_time(hl_hip3_deployer_volume_usd_24h{dex="mkts"}[7d])
      success: (hl_hip3_last_tick_unix > bool (time() - 1800))
      sample_size: hl_hip3_deployer_markets_listed{dex="mkts"}
      series: hl_hip3_deployer_volume_usd_24h{dex="mkts"}



  - slug: para
    name: Paragon
    tag: Rates and macro markets under the para namespace
    formula: "Sum of dayNtlVlm across para namespaced markets from metaAndAssetCtxs, the chain's rolling 24h notional."
    queries:
      p50: hl_hip3_deployer_volume_usd_24h{dex="para"}
      p90: hl_hip3_deployer_open_interest_usd{dex="para"}
      p99: hl_hip3_deployer_markets_24h{dex="para"}
      mean: avg_over_time(hl_hip3_deployer_volume_usd_24h{dex="para"}[7d])
      success: (hl_hip3_last_tick_unix > bool (time() - 1800))
      sample_size: hl_hip3_deployer_markets_listed{dex="para"}
      series: hl_hip3_deployer_volume_usd_24h{dex="para"}

  - slug: io
    name: EntropyIO
    tag: Thematic and pre IPO markets under the io namespace
    formula: "Sum of dayNtlVlm across io namespaced markets from metaAndAssetCtxs, the chain's rolling 24h notional."
    queries:
      p50: hl_hip3_deployer_volume_usd_24h{dex="io"}
      p90: hl_hip3_deployer_open_interest_usd{dex="io"}
      p99: hl_hip3_deployer_markets_24h{dex="io"}
      mean: avg_over_time(hl_hip3_deployer_volume_usd_24h{dex="io"}[7d])
      success: (hl_hip3_last_tick_unix > bool (time() - 1800))
      sample_size: hl_hip3_deployer_markets_listed{dex="io"}
      series: hl_hip3_deployer_volume_usd_24h{dex="io"}

metric_panels:
  - id: markets
    label: Markets traded
    metric: hl_hip3_deployer_markets_24h
    label_key: dex
    unit: count
    higher_is_better: true
    description: "Markets on this dex with non-zero notional over the trailing 24 hours."
  - id: markets_listed
    label: Markets listed
    metric: hl_hip3_deployer_markets_listed
    label_key: dex
    unit: count
    higher_is_better: true
    description: "Markets currently listed on this dex, delisted excluded."
  - id: open_interest
    label: Open interest
    metric: hl_hip3_deployer_open_interest_usd
    label_key: dex
    unit: usd
    higher_is_better: true
    description: "Open interest across the dex's markets in USD: base units times mark price, summed at poll time."
  # Data-only panels (tab: false): they feed the ledger's 7d/30d
  # timeframe toggle below. Sums of one 24h sample per UTC day.
  - id: volume_7d
    label: Volume 7d
    metric: hl_hip3_deployer_volume_usd_7d
    label_key: dex
    unit: usd
    higher_is_better: true
    tab: false
  - id: volume_30d
    label: Volume 30d
    metric: hl_hip3_deployer_volume_usd_30d
    label_key: dex
    unit: usd
    higher_is_better: true
    tab: false

# Honest column labels: the p50/p90/p99 slots are repurposed (USD volume,
# no percentile semantics). `windows` wires the 24h/7d/30d toggle to the
# data-only panels above; open interest and markets stay live snapshots on
# every timeframe.
ledger_columns:
  - { label: "Volume", slot: p50, windows: { 7d: volume_7d, 30d: volume_30d } }
  - { label: "Open interest", slot: p90 }
  - { label: "Markets traded", slot: p99, unit: count }
  - { label: "Listed", panel: markets_listed }
