# OpenChainBench. Bench № 205

slug: solana-dex-volume
number: "205"
title: "Solana trading terminal volume: pump.fun vs Axiom vs GMGN vs Fomo"
seo_title: "Solana trading terminal volume 2026: Axiom vs GMGN vs Fomo"
seo_description: "{{best_name}} routes the most Solana volume at {{best_p50}} in a day. Seven terminals ranked on routed volume and fee revenue, Solana only."
subtitle: Routed volume and fee revenue per trading terminal on Solana, for one complete day, with seven-day volume beside it.

category: Trading
status: live
metric: 24h volume
unit: usd
higher_is_better: true
row_noun: { one: terminal, many: terminals }
ledger_reliability: false

disclaimer: |
  Solana only, and routed volume rather than volume on the tokens traded: a swap on a pump.fun token executed through Axiom counts for Axiom. From the public tehcscreener API, which is Allium-backed. This page is bench 201 scoped to one chain; 201 carries the same terminals across every chain with take rate beside them.

seo_intro: |
  Solana carries more trading-terminal volume than every other chain in this
  cohort combined, which is why it gets a page of its own. This one ranks the
  seven terminals that route there by what each moved in a complete day, with
  the fees it collected and its seven-day total beside it.

abstract: |
  The harness reads the tehcscreener /bots endpoint, takes the Solana series
  and publishes routed volume and fee revenue summed over 1, 7 and 30 days.

  This bench read DeFiLlama until 2026-10-07 and now reads tehcscreener, the
  single source behind the /trading-apps hub. It overlaps bench 201 heavily by
  construction: same source, same cohort bar one row, this one pinned to
  Solana where 201 offers every chain.

methodology:
  - "Source: the public tehcscreener API (https://tehcscreener.com/api), Allium-backed, no key, synced once a day. The single source behind every bench on the /trading-apps hub."
  - "Scope: Solana only. Bench 201 is the same measurement across eight chain tabs, so this page is a view rather than a separate finding."
  - "Volume: what the terminal routed through its own interface on Solana. Not volume on the tokens it trades, which is bench 200."
  - "Windows are sums over days, never averages. The seven-day column is the sum of seven daily figures."
  - "Single source by decision, and not cross-checked. On 2026-10-07 this source read pump.fun 2.2x above DeFiLlama on app volume while agreeing with DeFiLlama within 30% on six other platforms."
  - "A terminal with no Solana activity on the day reads unresponsive rather than carrying its last live day forward."

findings:
  - "{{best_name}} routes the most Solana volume of any trading terminal, at {{best_p50}} in a day."
  - "This page and bench 201 measure the same thing from the same source; 201 adds every other chain and the take rate."
  - "Routed volume is not token volume. The same swap appears here under the terminal and on bench 200 under the launchpad."

source: https://github.com/ChainBench/OpenChainBench/tree/dev/harnesses/terminal-activity

prometheus:
  window: 24h
  url: https://prom.openchainbench.com
  expected_freshness_seconds: 172800
  freshness_timestamp_metric: terminal_activity_last_success_unix

ledger_columns:
  - { label: "24h Volume", slot: p50, unit: usd }
  - { label: "24h Fees", panel: fees, unit: usd }
  - { label: "7d Volume", panel: volume_7d, unit: usd }

metric_panels:
  - id: fees
    label: Fee revenue (24h)
    description: Fees the source reports for this terminal on Solana for the day. More than its own commission; bench 203 explains.
    metric: terminal_window_fees_usd{chain="solana",window="1d"}
    label_key: platform
    unit: usd
    higher_is_better: true
  - id: volume_7d
    label: Volume 7d
    description: Routed Solana volume summed over the last seven days.
    metric: terminal_window_volume_usd{chain="solana",window="7d"}
    label_key: platform
    unit: usd
    higher_is_better: true

faq:
  - q: "How is this different from bench 201?"
    a: "It is bench 201 pinned to Solana. Same source, same terminals bar one, same definition of volume. 201 offers every chain as a tab and adds the observed take rate."
  - q: "Is this volume on Solana DEXes or through these terminals?"
    a: "Through the terminals. A swap routed by Axiom into a Raydium pool counts for Axiom here, not for Raydium."

providers:
  - slug: pump-fun
    name: pump.fun
    queries:
      p50: max(terminal_window_volume_usd{platform="pump-fun",chain="solana",window="1d"})
      p90: max(terminal_window_volume_usd{platform="pump-fun",chain="solana",window="1d"})
      p99: max(terminal_window_volume_usd{platform="pump-fun",chain="solana",window="1d"})
      success: max(terminal_activity_health{platform="pump-fun",chain="solana"})
      sample_size: max(terminal_window_txns{platform="pump-fun",chain="solana",window="1d"})
      series: max by (platform) (terminal_window_volume_usd{platform="pump-fun",chain="solana",window="1d"})

