# OpenChainBench. Bench 205

slug: solana-dex-volume
number: "205"
title: "Solana DEX volume: PumpSwap vs Axiom vs GMGN vs Fomo, live 24h"
seo_title: "Solana DEX trading volume 2026: PumpSwap vs Axiom vs GMGN vs Fomo vs Trojan vs Photon vs BullX"
seo_description: "{{best_name}} leads Solana DEX trading platforms at ${{best_p50}} 24h volume. PumpSwap vs Axiom vs GMGN vs Fomo vs Trojan vs pump.fun vs Photon vs BullX ranked live from DeFiLlama."
subtitle: Live 24-hour trading volume and protocol revenue for the top Solana DEX platforms. Updated every 30 minutes from DeFiLlama. The fee column shows what each protocol earns, not what users pay in gas.

category: Trading
status: live
metric: 24h volume
unit: usd
higher_is_better: true

disclaimer: |
  Volume and revenue data sourced from DeFiLlama's DEX and fees APIs, which track on-chain swap events attributed to each protocol. DeFiLlama attribution relies on on-chain referral tags and program IDs; platforms that do not embed standard tags may be undercounted. Figures are 24-hour and 7-day rolling totals updated every 30 minutes. Revenue figures use DeFiLlama's dailyRevenue dataType, which strips LP fees and reports only the share captured by the protocol itself.

seo_intro: |
  The Solana DEX market is a contested three-way race between PumpSwap, Axiom and
  GMGN in the summer of 2026. PumpSwap (pump.fun's new AMM) surged to over $500
  million in daily volume after pump.fun reduced bonding-curve trading fees in August 2026, making
  it the dominant Solana DEX by raw volume. Axiom and GMGN each process around $70
  million per day, competing for the power-trader segment. Fomo's DEX reached $50
  million daily volume and briefly overtook Axiom in revenue for the first time on
  August 6, 2026, a milestone that triggered pump.fun's fee cut the following day.
  This benchmark tracks all eight platforms in real time from DeFiLlama's DEX data
  feed, refreshed every 30 minutes.

abstract: |
  The harness polls DeFiLlama's public DEX API (api.llama.fi/summary/dexs/{slug})
  and fees API (api.llama.fi/summary/fees/{slug}?dataType=dailyRevenue) every 30
  minutes for each tracked platform. No API key is required. DeFiLlama attributes
  swap volume using on-chain referral tags and program IDs embedded in transactions.
  The harness exposes six Prometheus gauges per platform: defillama_dex_volume_24h_usd,
  defillama_dex_volume_7d_usd, defillama_dex_fees_24h_usd, defillama_dex_fees_7d_usd,
  defillama_dex_take_rate and defillama_dex_health.

methodology:
  - "Source: DeFiLlama public DEX API (api.llama.fi/summary/dexs/{slug}) and fees API (api.llama.fi/summary/fees/{slug}?dataType=dailyRevenue). No authentication required."
  - "Poll cadence: harness fetches each platform every 30 minutes and updates Prometheus gauges immediately."
  - "Volume: total24h and total7d fields from DeFiLlama's DEX endpoint, sum of all swap notional values in USD attributed to this platform."
  - "Revenue: total24h and total7d from the fees endpoint with dataType=dailyRevenue. This strips LP fees that stay in pool accounts and returns only the protocol's own share."
  - "Take rate: protocol revenue divided by trading volume (defillama_dex_fees_24h_usd / defillama_dex_volume_24h_usd). Measures how much of each dollar traded the platform captures."
  - "Attribution: DeFiLlama uses on-chain referral tags, program IDs and memo fields. Platforms without standard tagging may be undercounted."
  - "PumpSwap (slug pumpswap, layer AMM): pump.fun's constant-product AMM launched April 2025. Volume surged after pump.fun reduced bonding-curve trading fees in August 2026."
  - "pump.fun (slug pump.fun, layer Launchpad): the original bonding-curve launchpad. A token graduates from the curve to PumpSwap's AMM when it reaches its market cap target. Revenue includes creator fees, graduation fees, and protocol fees across the full lifecycle."
  - "Axiom (slug axiom, layer Terminal): web-based Solana trading terminal. 0.25 to 0.5% platform fee on routed swaps. Revenue briefly overtaken by Fomo on Aug 6 2026."
  - "GMGN (slug gmgn, layer Terminal): AI-powered trading terminal on Solana. Approximately 1% fee on routed swaps."
  - "fomo Wallet (slug fomo-wallet, layer Terminal): Fomo's DEX routing layer. 0.5% platform fee. First crossed Axiom on daily revenue Aug 6 2026."
  - "Trojan (slug trojan, layer Bot): Telegram trading bot on Solana. Lower volume than web terminals but serves a distinct Telegram-native user base."
  - "Photon (slug photon, layer Terminal): Solana trading terminal targeted at advanced traders."
  - "BullX (slug bullx, layer Terminal): Solana and multi-chain trading terminal. Volume fell sharply from its 2025 highs after competitors expanded; now a fraction of peak levels."
  - "Phantom: Phantom Wallet is the largest Solana wallet by user count but does not have its own DeFiLlama DEX slug and is therefore not tracked here. Phantom routes swaps through Jupiter and other aggregators, which appear in those protocols' volume figures."

findings:
  - "{{best_name}} leads Solana DEX platforms at ${{best_p50}} 24h volume."
  - "PumpSwap is the dominant Solana DEX by raw volume, propelled by pump.fun's fee reductions in August 2026 which shifted bonding-curve activity to the AMM."
  - "Axiom and GMGN are the top independent trading terminals, each routing around $70 million per day."
  - "Fomo's DEX briefly outpaced Axiom in daily revenue on Aug 6 2026, the event that triggered pump.fun's zero-fee response."
  - "The fee column shows the business model split: pump.fun monetises token launches, PumpSwap monetises secondary trading, while Axiom, GMGN and Fomo charge frontend routing fees."
  - "BullX is tracked but operates at a fraction of peak volume following market share losses in 2026."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/solana-dex-volume

prometheus:
  window: 24h
  freshness_metric: defillama_dex_volume_24h_usd

metric_panels:
  - id: fees
    label: Protocol revenue (24h)
    label_key: platform
    metric: defillama_dex_fees_24h_usd
    unit: usd
    higher_is_better: true
    description: "Protocol revenue captured by each platform in the last 24 hours (DeFiLlama dailyRevenue). Excludes LP fees that stay in pool accounts."

  - id: volume_7d
    label: 7-day volume
    label_key: platform
    metric: defillama_dex_volume_7d_usd
    unit: usd
    higher_is_better: true
    description: "Total DEX trading volume over the last 7 days."

  - id: take_rate
    label: Take rate
    label_key: platform
    metric: defillama_dex_take_rate
    unit: pct
    higher_is_better: false
    description: "Protocol revenue as a fraction of trading volume (revenue / volume). Higher means the platform captures more of each dollar traded."

ledger_columns:
  - { label: "24h Volume", slot: p50 }
  - { label: "24h Revenue", panel: fees }
  - { label: "7d Volume", panel: volume_7d }

faq:
  - q: "What is the difference between pump.fun and PumpSwap?"
    a: "pump.fun is the original bonding-curve launchpad where new tokens are created and traded. PumpSwap is pump.fun's separate constant-product AMM where tokens migrate after graduating from the bonding curve at roughly $69K market cap. Both are tracked separately because they serve different trading stages and have different fee structures."
  - q: "Why did PumpSwap volume surge in August 2026?"
    a: "pump.fun reduced bonding-curve trading fees in August 2026, shifting more swap activity toward PumpSwap's AMM layer and driving PumpSwap volume above $500 million per day. Revenue reported by DeFiLlama for pump.fun still includes creator fees, graduation fees, and other lifecycle revenue components, so the revenue figure does not drop to zero even after the fee reduction."
  - q: "Why is Phantom not tracked here?"
    a: "Phantom is the largest Solana wallet by user count but it routes swaps through aggregators like Jupiter rather than operating its own DEX contract. DeFiLlama does not assign Phantom a DEX slug because its on-chain footprint is the aggregator's, not Phantom's. Those swaps appear in Jupiter's figures. This bench tracks the platforms that DeFiLlama can attribute volume to directly."
  - q: "How is this different from the Solana trading platform leaderboard (bench 201)?"
    a: "Bench 201 uses Mobula's lighthouse API to attribute swaps to the frontend UI (GMGN, Axiom, Fomo, etc.). This bench uses DeFiLlama's protocol-level DEX data, which tracks the on-chain contracts and programs. The two data sources cross-validate each other and may differ when users route through multiple aggregators."
  - q: "What is Fomo?"
    a: "Fomo (fomo.family) is a Solana trading platform and wallet launched in April 2025 by a team backed by Index Ventures and USV. It charges 0.5% on routed swaps and briefly led Solana daily DEX revenue on August 6 2026, overtaking Axiom for the first time."
  - q: "Why does Photon show less volume than GMGN and Axiom?"
    a: "Photon targets advanced traders and has a smaller but higher-frequency user base. Volume varies by day and market conditions. DeFiLlama attribution may also undercount platforms that do not embed standard on-chain referral tags."
  - q: "What is the take rate and why does it matter?"
    a: "The take rate is protocol revenue divided by trading volume. It shows how much of each dollar traded the platform keeps. A launchpad like pump.fun has a high take rate because it charges 1% on bonding-curve trades. A pure AMM like PumpSwap has a lower take rate because most of the fee goes to liquidity providers, not the protocol. Comparing take rates reveals which platforms extract more value from their users."

