# OpenChainBench. Bench № 196

slug: pulsechain-rpc
number: "196"
title: "PulseChain RPC endpoints: free public URLs ranked by latency"
# seo_title test cohort (2026-09-19): endpoint-intent title; H1 keeps the measured claim.
seo_title: "PulseChain RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free PulseChain RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public PulseChain EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  PulseChain (chain 369) is a full-state Ethereum fork launched in 2023 with PLS as the gas token. It maintains EVM compatibility and has a large retail user base. {{count}} keyless endpoints are probed continuously, each listed with its URL in the endpoints table above.

abstract: |
  PulseChain: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:pulsechain-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public PulseChain endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the PulseChain-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the PulseChain-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"pulsechain\"`. Provider coverage at launch: {{count}} no-key endpoints."

faq:
  - q: "What is the fastest free PulseChain RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber` p50 over the last 24h), measured against {{count}} no-key providers probed every 60 seconds from us-east, eu-west and Singapore."
  - q: "Which PulseChain RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing, each listed with its URL in the endpoints table above."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="pulsechain"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://pulsechain-rpc.publicnode.com
    tag: PublicNode multi-chain gateway for PulseChain
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions to PublicNode's no-key PulseChain endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="pulsechain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="pulsechain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="pulsechain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="pulsechain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="pulsechain"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="pulsechain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="pulsechain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="pulsechain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="pulsechain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="pulsechain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="pulsechain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="pulsechain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="pulsechain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="pulsechain", region="sgp"}[1h])

  - slug: pulsechain-official
    name: PulseChain Foundation
    endpoint: https://rpc.pulsechain.com
    tag: PulseChain official public RPC endpoint
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions to PulseChain Foundation's no-key endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="pulsechain-official", chain="pulsechain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="pulsechain-official", chain="pulsechain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="pulsechain-official", chain="pulsechain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="pulsechain-official", chain="pulsechain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="pulsechain-official", chain="pulsechain"}) / sum(ocb:rpc_call:rate_24h{provider="pulsechain-official", chain="pulsechain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="pulsechain-official", chain="pulsechain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="pulsechain-official", chain="pulsechain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="pulsechain-official", chain="pulsechain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="pulsechain-official", chain="pulsechain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="pulsechain-official", chain="pulsechain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="pulsechain-official", chain="pulsechain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="pulsechain-official", chain="pulsechain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="pulsechain-official", chain="pulsechain", region="sgp"}[1h])

  - slug: g4mm4
    name: G4MM4
    endpoint: https://rpc-pulsechain.g4mm4.io
    tag: G4MM4 community public RPC for PulseChain
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions to G4MM4's no-key PulseChain endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="g4mm4", chain="pulsechain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="g4mm4", chain="pulsechain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="g4mm4", chain="pulsechain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="g4mm4", chain="pulsechain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="g4mm4", chain="pulsechain"}) / sum(ocb:rpc_call:rate_24h{provider="g4mm4", chain="pulsechain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="g4mm4", chain="pulsechain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="g4mm4", chain="pulsechain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="g4mm4", chain="pulsechain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="g4mm4", chain="pulsechain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="g4mm4", chain="pulsechain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="g4mm4", chain="pulsechain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="g4mm4", chain="pulsechain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="g4mm4", chain="pulsechain", region="sgp"}[1h])
