# OpenChainBench. Bench № 161

slug: plume-rpc
number: "161"
title: "Plume Network RPC endpoints: free public URLs by latency"
seo_title: "Plume Network RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Plume Network RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). {{count}} no-key endpoints measured, updated every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Plume Network RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Plume Network (chain 98866) is an EVM-compatible modular L2 specialized for real-world asset (RWA) tokenization, providing compliance tooling, asset onboarding infrastructure, and DeFi composability for institutional and retail RWA products. The Plume Foundation's rpc.plume.org and dRPC provide keyless access probed every 60 seconds from three regions.

abstract: |
  Plume Network: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:plume-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Plume Network endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Plume Network-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Plume Network-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"plume\"`. Provider coverage today: {{count}} no-key endpoints."


source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="plume"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: plume-official
    name: Plume Foundation
    tag: Plume Foundation's official public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Plume Foundation's no-key Plume Network endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="plume-official", chain="plume"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="plume-official", chain="plume"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="plume-official", chain="plume"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="plume-official", chain="plume"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="plume-official", chain="plume"}) / sum(ocb:rpc_call:rate_24h{provider="plume-official", chain="plume"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="plume-official", chain="plume"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="plume-official", chain="plume"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="plume-official", chain="plume", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="plume-official", chain="plume", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="plume-official", chain="plume", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="plume-official", chain="plume", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="plume-official", chain="plume", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="plume-official", chain="plume", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    endpoint: https://plume.drpc.org
    tag: Decentralized RPC mesh
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to dRPC's no-key Plume Network endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="plume"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="plume"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="plume"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="plume"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="plume"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="plume"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="plume"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="plume"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="plume", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="plume", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="plume", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="plume", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="plume", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="plume", region="sgp"}[1h])
