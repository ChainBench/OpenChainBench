    name: Tenderly Gateway
    endpoint: https://worldchain-mainnet.gateway.tenderly.co
    tag: Tenderly's public multi-chain RPC gateway
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Tenderly Gateway's no-key world-chain RPC endpoint."
    queries:
