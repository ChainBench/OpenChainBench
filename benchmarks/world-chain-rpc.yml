# OpenChainBench. Bench № 097

slug: world-chain-rpc
number: "097"
title: "World Chain RPC endpoints: free public URLs by latency"
seo_title: "World Chain RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free World Chain RPC at {{best_p50}} (`eth_getBlockByNumber(\"latest\", false)` p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for the `eth_getBlockByNumber(\"latest\", false)` method against every free, no-key public World Chain EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  World Chain is an OP Stack rollup (chain 480) launched by Tools for Humanity in 2024, giving World ID-verified humans prioritised block space. ETH gas, standard EVM JSON-RPC. Excluded by the launch audit: PublicNode (no worldchain subdomain yet), Grove/Pocket public LB (needs app id), Alchemy paid tier (branded as `/public` but the same host serves both). Every provider live-verified with 4 consecutive keyless probes at launch.

abstract: |
  World Chain: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:worldchain-official}}.
  We measure the round-trip latency of a single, identical JSON-RPC call (`eth_getBlockByNumber(\"latest\", false)`) against every no-key public World Chain endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a World Chain-scaled staleness gap (25 blocks at World Chain's ~2 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the World Chain-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\", false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the rotating id defeats edge caches that would answer a bare head query without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the World Chain-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"world-chain\"`. Provider coverage today: {{count}} no-key endpoints."

faq:
  - q: "Which World Chain RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today; each is listed with its URL, 24h median and success rate in the endpoints table on this page, and the list changes as providers come and go."
  - q: "How is World Chain RPC latency measured here, technically?"
    a: "One identical `eth_getBlockByNumber(\"latest\", false)` POST every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="world-chain"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: worldchain-official
    name: World Chain
    endpoint: https://worldchain-mainnet.g.alchemy.com/public
    tag: Tools for Humanity's official public RPC on Alchemy infra
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to World Chain's no-key world-chain RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="worldchain-official", chain="world-chain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="worldchain-official", chain="world-chain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="worldchain-official", chain="world-chain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="worldchain-official", chain="world-chain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="worldchain-official", chain="world-chain"}) / sum(ocb:rpc_call:rate_24h{provider="worldchain-official", chain="world-chain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="worldchain-official", chain="world-chain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="worldchain-official", chain="world-chain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="worldchain-official", chain="world-chain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="worldchain-official", chain="world-chain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="worldchain-official", chain="world-chain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="worldchain-official", chain="world-chain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="worldchain-official", chain="world-chain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="worldchain-official", chain="world-chain", region="sgp"}[1h])

