metric_panels:
  - id: volume
    label: Volume routed
    metric: hl_frontend_volume_usd_24h_v2
    unit: usd
    higher_is_better: true
    description: "Notional USD routed through this frontend on the last complete UTC day. Use the chart range tabs to see the trend over longer windows."
  - id: users
    label: Users 24h
    metric: hl_frontend_users_24h_v2
    unit: count
    higher_is_better: true
    description: "Unique wallets that traded through this frontend on the last complete UTC day."
  - id: effective_fee
    label: Effective fee bps
    metric: hl_frontend_effective_fee_bps_v2
    unit: bps
    description: "Effective builder fee in basis points. Fees divided by notional volume times 10000. The trader perspective on cost."
  # Data-only panels (tab: false): no chart tab, they feed the ledger's
  # 7d/30d timeframe toggle below.
  - id: revenue_7d
    label: Revenue 7d
    metric: hl_frontend_fees_usd_7d_v2
    unit: usd
    higher_is_better: true
    tab: false
  - id: revenue_30d
    label: Revenue 30d
    metric: hl_frontend_fees_usd_30d_v2
    unit: usd
    higher_is_better: true
    tab: false
  - id: volume_7d
    label: Volume 7d
    metric: hl_frontend_volume_usd_7d_v2
    unit: usd
    higher_is_better: true
    tab: false
  - id: volume_30d
    label: Volume 30d
    metric: hl_frontend_volume_usd_30d_v2
    unit: usd
    higher_is_better: true
    tab: false
  - id: users_7d
    label: Users 7d
    metric: hl_frontend_users_7d_v2
    unit: count
    higher_is_better: true
    tab: false
  - id: users_30d
    label: Users 30d
    metric: hl_frontend_users_30d_v2
    unit: count
    higher_is_better: true
    tab: false

# Honest column labels for the main table. The p50/p90/p99/mean slots are
# repurposed on this bench (USD revenue, no percentile semantics), so the
# ledger renders these labeled columns instead of latency headers, with
# unique users surfaced inline from the users panel. `windows` wires the
# 24h/7d/30d timeframe toggle to the data-only panels above. Users 7d/30d
# come from per-UTC-day wallet sets in the harness (absent until its disk
# backfill seeds them; the column shows a dash in that window). $ / user
# stays 24h and its header says so on every timeframe.
ledger_columns:
  - { label: "Revenue", slot: p50, windows: { 7d: revenue_7d, 30d: revenue_30d } }
  - { label: "Volume", slot: p90, windows: { 7d: volume_7d, 30d: volume_30d } }
  - { label: "Users", panel: users, windows: { 7d: users_7d, 30d: users_30d } }
  - { label: "$ / user", slot: p99 }
