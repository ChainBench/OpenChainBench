# OpenChainBench. Bench № 030

slug: hyperliquid-frontends
number: "030"
title: Hyperliquid frontends user-cost benchmark
seo_title: "Hyperliquid frontends 2026: effective builder fee bps, $/user efficiency, fee discipline (Phantom, Axiom, OKX, GMGN, pvp.trade)"
seo_description: "Live benchmark of Hyperliquid frontends ranked by how much they extract from users, not by raw volume. Effective builder fee in bps (cap 100), D7 cohort retention per builder, and USD captured per active trader. Observational, on-chain attribution via builder code field, methodology public."
subtitle: How much each Hyperliquid frontend charges its users via the on-chain builder code. Effective fee in basis points (cap 100), summed over 24h. Lower = more aligned with traders.
category: Trading
status: live
metric: Effective builder fee (24h, bps)
unit: bps
higher_is_better: false

disclaimer: |
  Volume-share dashboards already exist (ASXN, Coinmarketman, Flowscan, Allium). OCB leads with user cost instead: effective fee is a volume-weighted `builder_fee / notional` over 24h, so fee-free promo windows pull it down. Native HL UI orders carry no builder code and are excluded — covered by `aggregator-head-lag`.

seo_intro: |
  Every Hyperliquid order carries an optional on-chain `builder`
  field. Frontends like Phantom Perps, Axiom, OKX, GMGN,
  pvp.trade, Dexterity, KGEN, Insilico, and ASXN use this field to
  claim a share of taker fees as their own rebate (capped at 100
  basis points on perps, 1000 on spot). The same field is the
  cleanest user-cost signal available: dividing the total
  `builder_fee` captured by the total notional routed gives the
  effective fee each frontend charges its users on top of the
  base Hyperliquid fee schedule. This benchmark publishes that
  ratio per builder, refreshed hourly from Hyperliquid's public
  `stats-data.hyperliquid.xyz/Mainnet/builder_fills` daily CSV
  dumps. Three columns surface per frontend. The headline is the
  24-hour volume-weighted effective fee in basis points; the
  second column is D7 cohort retention, the percentage of users
  who first traded via this builder a week ago and traded again
  within the last 24 hours; the third is USD fees captured per
  unique trader. Lower fee + higher retention + lower $/user =
  most aligned with traders. Why this framing. The Hyperliquid
  frontend wars have a half-dozen volume-share dashboards
  already (ASXN, Coinmarketman, Flowscan, Allium, Dune); none of
  them publish retention per builder because none of them keep
  the persistent state. OCB does. Volume share is exposed as a
  secondary gauge so the number readers expect to see is still
  on the page — it just doesn't drive the ranking.

abstract: |
  We compute four quality metrics per Hyperliquid builder code
  by reading the public per-day fills dumps published by the
  Hyperliquid team at `stats-data.hyperliquid.xyz`, plus a
  local SQLite state layer for cohort retention. (1) Effective
  fee bps, `sum(builder_fee) / sum(notional) * 10000` over the
  last 24 hours, volume-weighted across every fill attributed to
  the builder address. (2) D7 and D30 cohort retention, the
  percentage of users whose first observed fill for the builder
  lands in the UTC-day window 7 (or 30) days ago and who traded
  again within the last 24 hours — derived from a local SQLite
  state of `(builder, user, first_seen_ms, last_seen_ms)`. (3)
  USD captured per unique trader, `sum(builder_fee) /
  count(distinct user)` over the UTC-day window. (4) Volume share in
  percent, exposed as a secondary signal so readers who came for
  the standard leaderboard number still find it. The harness
  maintains a curated `builders.json` mapping of builder EVM
  addresses to frontend slugs (Phantom Perps, Axiom, OKX, GMGN,
  pvp.trade, Dexterity, KGEN, Insilico, ASXN). Builder addresses
  with valid fills outside this registry are bucketed as
  `unattributed` so the coverage gap is visible. The bench does
  not place trades, does not touch private keys, and does not
  depend on any internal Mobula service.

methodology:
  - "Data source. The Hyperliquid team publishes a per-builder, per-day CSV of every attributed fill at `https://stats-data.hyperliquid.xyz/Mainnet/builder_fills/{builder_address_lowercase}/{YYYYMMDD}.csv.lz4`. The bucket is public, unauthenticated, and lossless (LZ4-compressed). Schema: `time, user, coin, side, px, sz, crossed, special_trade_type, tif, is_trigger, counterparty, closed_pnl, twap_id, builder_fee`."
  - "Cadence. The harness polls each registered builder's `T-1` (yesterday's, complete) and `T-0` (today's, preview) CSV every 3600 seconds. `T-1` is treated as authoritative; `T-0` updates the live gauge with a `preview=true` label that the page ignores for ranking purposes."
  - "Effective fee calculation. For each builder over a UTC-day window: `effective_fee_bps = sum(builder_fee_usd) / sum(notional_usd) * 10000`, where `notional_usd = px * sz` summed over every fill row. Volume-weighted, not flat-averaged, so a builder routing one $10M trade at 1 bps and 10,000 $100 trades at 10 bps lands near 1 bps (matching what its biggest users actually paid)."
  - "USD-per-user efficiency. `fees_per_user_usd = sum(builder_fee_usd) / count(distinct user)` over the same UTC-day window. Surfaces predatory pricing more clearly than effective fee alone: a builder with 5 bps effective fee and $50 per user is extracting differently than one with the same 5 bps and $0.50 per user."
  - "D7 / D30 cohort retention. Local SQLite state of `(builder, user, first_seen_ms, last_seen_ms)` updated on every fill. D7 = (users with `first_seen_ms` 7 days ago AND `last_seen_ms` within 24h) ÷ (cohort size). D30 same with 30d window. Catches frontends that dominate yesterday's UTC volume while bleeding their day-old cohort. State pruned past 90 days to keep the SQLite bounded."
  - "Fee discipline (secondary). `stddev_over_time(hl_frontend_effective_fee_bps[30d])` computed in Prometheus. Frontends running rotating fee-free promotions show high variance; frontends with stable transparent pricing show low. Not in the leaderboard columns by default but queryable via the MCP server for any reader who wants it."
  - "Builder registry. `harnesses/hyperliquid-frontends/builders.json` is a hand-curated `[{slug, name, address, valid_from, notes}]` array, cross-referenced against Flowscan's builder leaderboard, the Hyperliquid governance forum's builder-code disclosures, and each frontend's public announcement of their builder address. Reviewed weekly. When a new builder address appears in the `unattributed` slice with >0.5% volume share, an issue is filed."
  - "Unattributed bucket. Builder addresses present in Hyperliquid CSV dumps but absent from `builders.json` are aggregated under the `unattributed` slug. The bench surfaces this slice explicitly rather than hiding it so the reader knows the coverage limit. An `unattributed` share >2% triggers a registry-update alert."
  - "Excluded by design. (a) Native HL UI orders have no builder code, not user-attributable; `aggregator-head-lag` covers HL's data feed separately. (b) Spot fills roll into the perp headline; per-asset breakdowns ship in v1.1. (c) Builders with <100 unique users over 24h tag as `low_sample` and drop from the leaderboard ranking (raw metrics still visible)."
  - "Reproducibility. The full harness source is published at `harnesses/hyperliquid-frontends/` in the OCB repo (Go). Anyone can clone, point at the public `stats-data.hyperliquid.xyz` URL, run the binary against a Prometheus scraper, and reproduce these metrics. No private API keys, no internal Mobula service dependency."
  - "Methodology versioning. Any change (registry additions, formula tweaks, exclusion thresholds, window sizes) ships as a public PR with a 14-day comment window before activation. Major changes run a 30-day shadow period publishing old and new metric series in parallel."

findings:
  - "{{best_name}} currently charges {{best_p50}} effective on the last 24 hours of attributed Hyperliquid flow — the most aligned frontend in the {{count}}-builder set we track. Lower is better here: 100 bps is the on-chain cap, 0 bps means the frontend is fully waiving its builder rebate."
  - "{{name:phantom-perps}} sits at {{p50:phantom-perps}}. Phantom routes the largest share of attributed Hyperliquid volume but the fee column tells you what its users actually pay on top of HL's base schedule, which is the number that matters for choosing a frontend."
  - "{{name:axiom}} reports {{p50:axiom}}. Axiom expanded from Solana to Hyperliquid in 2025 and runs a transparent flat fee model — useful counterpoint to frontends that promote fee-free windows."
  - "{{worst_name}} extracts {{worst_p50}} from its users on the same window. The gap between {{best_name}} and {{worst_name}} is the operational signal traders should weigh against the UX advantages each frontend ships with."
  - "Fee discipline (the secondary p90 column, 30-day stddev) flags frontends running promotional cycles. A builder with a low 24h fee but a high stddev is in a fee-free phase and will normalize; one with both low is what alignment looks like."

faq:
  - q: "Why does OpenChainBench not show Hyperliquid volume share?"
    a: "Volume share is already published cleanly by ASXN HyperScreener, Coinmarketman HyperTracker, Flowscan, Allium, and at least three Dune dashboards. Republishing it would add no value. The unmeasured part of the frontend question is user cost — how much does each frontend take per dollar routed, and how stable is that take rate. That's what this bench answers. Raw yesterday's UTC notional per builder is still exposed as a secondary metric for readers who want it; it just doesn't drive the headline ranking."
  - q: "How is the effective fee actually computed?"
    a: "For each Hyperliquid builder address in our registry, the harness fetches `https://stats-data.hyperliquid.xyz/Mainnet/builder_fills/{address}/{YYYYMMDD}.csv.lz4` once per hour. Each row of the CSV is one attributed fill with a `builder_fee` field and the `px × sz` notional. We sum `builder_fee` and `px × sz` across every row in the last 24 hours and compute `sum(builder_fee) / sum(notional) × 10000`. That's the volume-weighted effective fee in basis points — what a representative dollar of flow paid that frontend."
  - q: "What's the on-chain cap?"
    a: "Hyperliquid caps builder fees at 100 basis points on perps and 1000 basis points on spot, configured via the `ApproveBuilderFee` action signed by each user's main wallet. The bench's headline is denominated in basis points so 100 = the on-chain cap and 0 = fully waived rebate. Most frontends sit well below the cap; the bench surfaces who sits where."
  - q: "Which frontends are tracked?"
    a: "The registry tracks Phantom Perps, Axiom, OKX, GMGN, pvp.trade, Dexterity, KGEN, Insilico Terminal, and ASXN. Builder addresses are cross-referenced against Flowscan's builder leaderboard, governance forum disclosures, and each frontend's public announcement of their address. New builders meeting the 0.5% volume threshold get added on the next weekly review."
  - q: "What is the 'unattributed' slice?"
    a: "Builder addresses that appear in Hyperliquid's public dumps but aren't in our registry, aggregated together. Surfacing this slice explicitly is honest — it's the share of attributed flow our methodology doesn't yet cover. When the unattributed share crosses 2%, a registry-update issue is filed; the bench freshness counter on the page tells you when the registry was last reviewed."
  - q: "What's fee discipline and why is it useful?"
    a: "The 30-day standard deviation of the daily effective fee in basis points. Frontends running rotating promotions (fee-free week → normalize the next week → discount cycle) show high variance even when the 24h headline is low. Frontends with stable transparent pricing show low variance. The discipline column is what tells you whether the headline number you're reading is a stable rate or a snapshot mid-promo."
  - q: "Does the bench measure native HL UI orders?"
    a: "No. The native HL UI doesn't set a builder code, so its orders are not user-attributable by this method. Native HL's performance is covered separately by `/benchmarks/aggregator-head-lag` (data-feed latency) and the operational metrics Hyperliquid publishes themselves. This bench is specifically about third-party frontends that opt into the builder-code attribution system."
  - q: "Can a frontend game the bench by routing wash trades?"
    a: "Yes, the bench measures what the chain records. A frontend running wash volume to drive its own fee revenue (or to suppress its effective fee via 0-fee internal flow) shows up exactly as it appears on-chain. Mitigation is structural: the user-count column flags frontends with anomalously low unique-user counts relative to volume (a wash-heavy frontend has high $/user efficiency and low user count). A v1.1 methodology PR will add a sybil-cluster heuristic for repeat-counterparty fills."

