# OpenChainBench. Bench № 030

slug: hyperliquid-frontends
number: "030"
title: Hyperliquid frontends user-cost benchmark
seo_title: "Hyperliquid frontends 2026: effective builder fee bps, $/user efficiency, fee discipline (Phantom, Axiom, OKX, GMGN, pvp.trade)"
seo_description: "Live benchmark of Hyperliquid frontends ranked by how much they extract from users, not by raw volume. Effective builder fee in bps (cap 100), D7 cohort retention per builder, and USD captured per active trader. Observational, on-chain attribution via builder code field, methodology public."
subtitle: How much each Hyperliquid frontend charges its users via the on-chain builder code. Effective fee in basis points (cap 100), summed over 24h. Lower = more aligned with traders.
category: Trading
status: live
metric: Effective builder fee (24h, bps)
unit: bps
higher_is_better: false

disclaimer: |
  Volume share dashboards already exist (ASXN, Coinmarketman, Flowscan, Allium). OCB leads with user cost instead. Effective fee is a volume weighted `builder_fee / notional` over the rolling 24h, so fee free promo windows pull it down. Native HL UI orders carry no builder code and are excluded; the bench tracks third party frontends that opt into the builder field. Companion metrics surface slippage, freshness, taker share, asset concentration. Local hl-node source, sub minute freshness.

seo_intro: |
  Every Hyperliquid order carries an optional on chain `builder`
  field. Frontends like Phantom Perps, Axiom, MetaMask, pvp.trade,
  Insilico, DefiApp, Dexari and Okto use this field to claim a
  share of taker fees as their own rebate (capped at 100 basis
  points on perps, 1000 on spot). The same field is the cleanest
  user cost signal available. Dividing the total `builder_fee`
  captured by the total notional routed gives the effective fee
  each frontend charges its users on top of the base Hyperliquid
  fee schedule. This benchmark publishes that ratio per builder
  in sub minute freshness, reading the local hl-node fills stream
  on the OCB infrastructure rather than the public daily CSV bucket.
  The default chart shows the 24h volume weighted effective fee
  in basis points. A tab switcher above the chart surfaces five
  companion views computed from the same stream. Slippage proxy
  is the per fill basis point gap between executed price and the
  previous trade on the same asset, averaged over 24h, so a
  frontend with a low fee but a wide routing path shows the real
  user cost. Time since last fill is an outage detector, seconds
  since the most recent attributed fill for that builder. Fills
  per minute is the rolling activity rate. Taker share is the
  fraction of fills that crossed the spread, separating aggressive
  wallet style UIs from pro maker heavy terminals. Volume routed
  is the headline number every other dashboard publishes, kept
  here as a companion not the ranking driver.

abstract: |
  We compute a family of quality metrics per Hyperliquid builder
  code by tailing the fills stream of a local hl-node operated
  on OCB infrastructure. The node writes every block of fills
  to `node_fills_by_block/hourly/YYYYMMDD/HH`, one JSON object
  per line, with the `builder` address and `builderFee` on every
  attributed fill. A Go harness tails these files every 30 seconds,
  maintains a rolling 24h window in memory, and exposes a stable
  Prometheus surface that this page consumes. The headline metric
  is effective fee in basis points, `sum(builder_fee_usd) /
  sum(notional_usd) * 10000` over the rolling 24h, volume weighted
  across every fill attributed to the builder address. Five
  companion metrics share the same stream. Price deviation bps is
  the per fill `|fill_px - last_seen_px_same_asset| / last_seen_px
  * 10000` averaged over the window, a proxy for execution quality.
  Time since last fill in seconds catches frontends whose routing
  pipeline is down. Fills per minute is the rolling activity rate.
  Taker share is `crossed_fills / total_fills`. Top three assets
  by routed notional per builder reveals routing strategy and
  surfaces HIP-3 perps. The harness keeps a curated `builders.json`
  mapping of EVM addresses to frontend slugs, currently 60 entries
  covering wallets, terminals, social trading apps, bots, and
  HIP-3 perps deployers, seeded from the public DefiLlama
  dimension adapter registry plus behavioral cross reference of
  the top unidentified addresses. Builder addresses with valid
  fills outside this registry route through the same `builder`
  field but stay invisible to this leaderboard until added by a
  public PR. The bench does not place trades,
  does not touch private keys, and does not depend on any internal
  Mobula service.

methodology:
  - "Data source. A local hl-node operated on OCB infrastructure tails the Hyperliquid mainnet and writes every block of attributed fills to `node_fills_by_block/hourly/YYYYMMDD/HH`. Each line is one block, the `events` array carries one entry per fill, and every fill with a builder code includes the `builder` address plus `builderFee` in USDC. Sub minute freshness, no dependency on the public daily CSV bucket."
  - "Cadence. The Go harness re reads the current and previous hourly files every 30 seconds, parses appended lines, and maintains a rolling 24h window in memory. Prometheus scrapes the metrics every 30 seconds via a Caddy reverse proxy with basic auth. End to end staleness from fill landing on chain to bench page render is typically under 60 seconds."
  - "Effective fee calculation. For each builder over the rolling 24h window: `effective_fee_bps = sum(builder_fee_usd) / sum(notional_usd) * 10000`, where `notional_usd = px * sz` summed over every fill. Volume weighted, not flat averaged, so a builder routing one large trade at 1 bps and many tiny trades at 10 bps lands near the rate the biggest dollars actually paid."
  - "USD per user efficiency. `fees_per_user_usd = sum(builder_fee_usd) / count(distinct user)` over the rolling 24h window. Surfaces predatory pricing more clearly than effective fee alone. A builder with 5 bps effective fee and $50 per user is extracting differently than one with the same 5 bps and $0.50 per user."
  - "Price deviation, slippage proxy. For each new fill on asset A by builder B: `dev_bps = abs(fill_px - last_seen_px_on_A) / last_seen_px * 10000`, where `last_seen_px` is the most recent fill price on that asset across the whole cohort. Averaged per builder over the rolling 24h. Proxy for execution quality. A frontend that routes to less liquid venues or slower order paths shows higher deviation, a direct user cost on top of the fee column."
  - "Outage detector. `last_fill_age_seconds = now - max(fill.time for fills in window)` per builder. During active hours the cohort baseline runs under one minute, so anything above a few minutes is a real anomaly. Catches frontends whose routing pipeline is down and frontends that quietly stopped operating but still have their builder code in circulation."
  - "Taker share. Each fill has a boolean `crossed` field, true when the fill crossed the spread (taker), false when it rested in the book (maker). `taker_pct = crossed_fills / total_fills` per builder over the window. Separates aggressive instant execution UIs from pro maker heavy terminals."
  - "Per asset top three. For each builder, the three assets with the highest notional volume in the rolling 24h. Cardinality bounded at the cohort size times 3 ranks (currently 60 builders × 3 = 180 series). The `asset` label rotates as concentration shifts. Reveals routing strategy and surfaces HIP-3 perps (xyz:, km:, cash: prefixes) that the older Hyperliquid frontends do not list."
  - "Builder registry. `miniapps/hyperliquid-frontends-local/builders.json` is a hand curated `[{slug, name, address, valid_from, notes}]` array, currently 60 entries seeded from DefiLlama's open source dimension adapter registry plus a behavioral cross reference pass on the top unidentified addresses. Covers wallets (Phantom, MetaMask, Rabby, OneKey, Trust Wallet, Gem Wallet, Rainbow, Coin98), pro terminals (Insilico, Dexari, Axiom, Pear, Lit Trade, Nautilus Trader), social and PvP UIs (pvp.trade, Senpi, FOMO, SuperX), bots and signal apps (FlowBot, Tread.fi, Moonbot, Hyperdash, Metascalp), and HIP-3 deployers, accounting for the bulk of attributed Hyperliquid volume. New addresses ship via public PR."
  - "Excluded by design. Native HL UI orders carry no builder code so they are not user attributable by this method. Roughly 95 percent of Hyperliquid fills land without a builder field. The 5 percent that do are the frontend ecosystem this bench measures."
  - "Reproducibility. Harness source at `miniapps/hyperliquid-frontends-local/` in the mobula-api repo (Go). Anyone running their own hl-node can clone, point the `-data` flag at their `node_fills_by_block/hourly` root, run the binary against a Prometheus scraper, and reproduce these metrics. No private API keys, no internal Mobula service dependency."
  - "Methodology versioning. Any change (registry additions, formula tweaks, exclusion thresholds, window sizes) ships as a public PR. Major changes run a parallel period publishing old and new metric series side by side under a `_v2` suffix until cutover."

findings:
  - "Effective fee spread is 10x across the cohort. Insilico and Axiom both clock 1.00 bps on the last 24h of attributed flow, the cheapest transparent flat in the set. MetaMask sits at 10.00 bps, the practical on-chain cap most frontends respect, making it the most extractive currently tracked. Phantom Perps lands at 5.22, in line with the wallet-integrated tier."
  - "Fee alone is half the story. DefiApp executes tightest at 1.90 bps price deviation despite charging 5.02 bps in builder fee. Dexari deviates 25.83 bps, 13x the cohort median of about 3 bps, on top of its 8.91 bps fee. A user paying Dexari to route their flow is paying twice: once at the fee line, once at the fill price."
  - "Volume and user-cost are uncorrelated. Phantom Perps routes 19.4M USD in 24h at 5.22 bps. Insilico routes 7.9M USD at 1.00 bps. MetaMask routes 5M USD at 10 bps. The leaderboard most HL dashboards publish (volume share) ranks Phantom first; the leaderboard users actually care about (what each routed dollar pays) ranks Insilico and Axiom on top."
  - "Two outage signals are currently firing. Dexari's last attributed fill is 19 minutes stale against a cohort baseline under 1 minute. Okto has zero fills in 24h, fully inactive. The sub-minute hl-node freshness lets the bench distinguish 'no flow yet today' from 'frontend down', a gap the daily CSV pipeline could not close."
  - "Taker share separates aggressive UIs from pro terminals. pvp.trade fills 100% taker, Phantom 99.4%, MetaMask 97.9%, all instant execution wallets that cross the spread by default. Insilico sits at 80.6%, the most maker heavy in the cohort, consistent with its workstation positioning where users place resting limit orders rather than market buying."
  - "Asset concentration reveals routing strategy. Phantom is 51% BTC weighted (9.9M of 19.4M USD in 24h on BTC alone). DefiApp is the only frontend with HYPE as its #1 asset. Dexari and MetaMask both surface HIP-3 perps in their top three (xyz:TSLA, xyz:CL crude), a feature that does not exist on the older Hyperliquid frontends, useful for traders looking for stock perps exposure."

faq:
  - q: "Why does OpenChainBench not show Hyperliquid volume share?"
    a: "Volume share is already published cleanly by ASXN HyperScreener, Coinmarketman HyperTracker, Flowscan, Allium, and at least three Dune dashboards. Republishing it would add no value. The unmeasured part of the frontend question is user cost: how much does each frontend take per dollar routed, and how stable is that take rate. That's what this bench answers. Raw yesterday's UTC notional per builder is still exposed as a secondary metric for readers who want it; it just doesn't drive the headline ranking."
  - q: "How is the effective fee actually computed?"
    a: "A local hl-node operated on OCB infrastructure tails the Hyperliquid mainnet and writes every block of attributed fills to disk. A Go harness re reads the current hourly file every 30 seconds. For each builder in our registry, we sum `builderFee` (USD) and `px * sz` (notional USD) over every fill in the rolling 24h window, then compute `sum(builder_fee) / sum(notional) * 10000`. That's the volume weighted effective fee in basis points, what a representative dollar of flow paid that frontend. End to end staleness from fill landing on chain to bench page render is typically under 60 seconds."
  - q: "What's the on-chain cap?"
    a: "Hyperliquid caps builder fees at 100 basis points on perps and 1000 basis points on spot, configured via the `ApproveBuilderFee` action signed by each user's main wallet. The bench's headline is denominated in basis points so 100 = the on-chain cap and 0 = fully waived rebate. Most frontends sit well below the cap; the bench surfaces who sits where."
  - q: "Which frontends are tracked?"
    a: "The registry currently tracks Phantom Perps, Axiom, pvp.trade, Insilico Terminal, DefiApp, MetaMask, Dexari and Okto. These eight account for roughly half of attributed Hyperliquid volume. Builder addresses were sourced from each frontend's public announcement, cross referenced against CoinMarketMan HyperTracker and Flowscan. Several hundred smaller builder addresses route the remaining attributed volume. They show in our local node stream and are scheduled for inclusion via public PR. The 95 percent of HL flow that uses no builder code (native UI orders, frontends that did not opt into the attribution system) sits outside this bench by design."
  - q: "What about builder addresses outside the eight tracked frontends?"
    a: "The local hl-node sees every builder address that appears on any Hyperliquid fill. Several hundred smaller builders route attributed volume below the eight tracked here. Those addresses are visible in our raw node stream but stay off the leaderboard until a public PR adds them to `builders.json` with a verified name. The coverage gap is honest, not hidden. Volume share dashboards from ASXN and CoinMarketMan list the full distribution if you need the exhaustive picture today."
  - q: "What's fee discipline and why is it useful?"
    a: "The 30-day standard deviation of the daily effective fee in basis points. Frontends running rotating promotions (fee-free week → normalize the next week → discount cycle) show high variance even when the 24h headline is low. Frontends with stable transparent pricing show low variance. The discipline column is what tells you whether the headline number you're reading is a stable rate or a snapshot mid-promo."
  - q: "Does the bench measure native HL UI orders?"
    a: "No. The native HL UI doesn't set a builder code, so its orders are not user-attributable by this method. Native HL's performance is covered separately by `/benchmarks/aggregator-head-lag` (data-feed latency) and the operational metrics Hyperliquid publishes themselves. This bench is specifically about third-party frontends that opt into the builder-code attribution system."
  - q: "Can a frontend game the bench by routing wash trades?"
    a: "Yes, the bench measures what the chain records. A frontend running wash volume to drive its own fee revenue (or to suppress its effective fee via 0-fee internal flow) shows up exactly as it appears on-chain. Mitigation is structural: the user-count column flags frontends with anomalously low unique-user counts relative to volume (a wash-heavy frontend has high $/user efficiency and low user count). A v1.1 methodology PR will add a sybil-cluster heuristic for repeat-counterparty fills."
  - q: "What is price deviation and why publish it alongside the fee?"
    a: "Per-fill basis-point gap between executed price and the most recent fill price on the same asset, averaged across the 24h window. Cleanest proxy for execution quality from a frontend that does not publish slippage stats. A frontend can charge a low builder fee and still cost users more if its routing fills wide of the recent print. Fee plus deviation is closer to true user cost than either alone."
  - q: "What does the last-fill-age outage signal actually measure?"
    a: "Seconds since the most recent attributed fill for that builder. The cohort baseline runs under one minute during active hours, so above a few minutes is a real anomaly. Catches two failure modes: a frontend whose routing pipeline is down (no new fills even when users try to trade), and a frontend that has quietly stopped operating but still has its builder code in circulation. Both were invisible on volume dashboards where zero volume reads as zero, not as broken."

source: https://github.com/MobulaFi/mobula-monorepo/tree/dev/miniapps/hyperliquid-frontends-local

prometheus:
  window: 24h
  expected_freshness_seconds: 5400

# Real metrics emitted by the hyperliquid-frontends harness. The Prom labels
# are kept narrow (just `builder`) so the cross-series queries below don't
# explode in cardinality.
#
#   hl_frontend_effective_fee_bps_v2{builder}            gauge   (p50 headline)
#   hl_frontend_d7_retention_pct{builder}             gauge   (p90 column)
#   hl_frontend_d30_retention_pct{builder}            gauge   (also exposed)
#   hl_frontend_fees_per_user_usd_v2{builder}            gauge   (p99 column)
#   hl_frontend_volume_usd_24h{builder}               gauge   (secondary)
#   hl_frontend_volume_share_pct{builder}             gauge   (secondary)
#   hl_frontend_users_24h{builder}                    gauge
#   hl_frontend_d7_cohort_size{builder}               gauge   (sample-size guard)
#   hl_frontend_d30_cohort_size{builder}              gauge
#   hl_frontend_fills_total_24h_v2{builder}                  gauge
#   hl_frontend_unattributed_share_pct                gauge   (coverage signal)
#   hl_frontend_registry_age_seconds                  gauge   (freshness signal)
#   hl_frontend_csv_fetch_status_total{builder,code}  counter (per HTTP code)
#
# Bench page column mapping. The p50/p90/p99 slots are repurposed since the
# unit is bps and there is no native percentile semantics: p50 = effective
# fee, p90 = D7 cohort retention, p99 = USD fees per unique trader. The
# repurposing is called out in the methodology + FAQ so readers don't
# misread the columns. Fee discipline (30d stddev) is computable in
# Prom via the MCP server but not surfaced in a column.

providers:
  - slug: phantom-perps
    name: Phantom
    tag: Phantom wallet's HL perps integration
    formula: "Volume-weighted effective builder fee in basis points over the last complete UTC day, computed from Hyperliquid's public attributed-fills CSV for Phantom's builder address."
    queries:
      p50: hl_frontend_effective_fee_bps_v2{builder="phantom-perps"}
      p90: hl_frontend_d7_retention_pct{builder="phantom-perps"}
      p99: hl_frontend_fees_per_user_usd_v2{builder="phantom-perps"}
      mean: avg_over_time(hl_frontend_effective_fee_bps_v2{builder="phantom-perps"}[7d])
      success: (hl_frontend_local_last_tick_unix_v2 > bool (time() - 120))
      sample_size: hl_frontend_fills_total_24h_v2{builder="phantom-perps"}
      series: hl_frontend_effective_fee_bps_v2{builder="phantom-perps"}

