# Companion metric panels surfaced as a switchable mini leaderboard below
# the main p50/p90/p99 table. Each panel queries one Prom metric per
# provider (builder label) and re-ranks the cohort under its direction.
# All five metrics come from the local hl-node harness and update at the
# same sub-minute cadence as the main headline.
metric_panels:
  - id: volume
    label: Volume routed
    metric: hl_frontend_volume_usd_24h_v2
    unit: usd
    higher_is_better: true
    description: "Notional USD routed through this frontend in the last 24 hours. Use the chart range tabs (1h, 6h, 24h, 7d, 30d) to see the trend over longer windows."
  - id: users
    label: Users 24h
    metric: hl_frontend_users_24h_v2
    unit: count
    higher_is_better: true
    description: "Unique wallets that traded through this frontend in the last 24 hours."
  - id: effective_fee
    label: Effective fee bps
    metric: hl_frontend_effective_fee_bps_v2
    unit: bps
    description: "Effective builder fee in basis points. Fees divided by notional volume times 10000. The trader perspective on cost."
  - id: outage
    label: Time since last fill
    metric: hl_frontend_last_fill_age_seconds_v2
    unit: s
    description: "Seconds since this frontend's most recent attributed fill. An outage signal."
