disclaimer: |
  Ranking is by raw builder fee revenue in USD, not by value for users. Bigger number means more fees collected via the on-chain builder code field. For the trader cost perspective, switch to the Effective fee bps companion tab. Native Hyperliquid UI orders carry no builder code and are excluded. Figures describe the last complete UTC day published on Hyperliquid's builder fills feed, so they run 3 to 27 hours behind the chain.


seo_intro: |
  This page answers one question. Which Hyperliquid frontend collected the most builder fee revenue in USD over the last 24 hours, 7 days and 30 days. Every Hyperliquid order can attach an optional on-chain builder field. Frontends like Phantom Perps, MetaMask, Rabby, Insilico, based.app, OneKey, Axiom and pvp.trade write their wallet address into this field on every fill they route, then collect a share of the taker fee as their own rebate (capped at 100 basis points on perps, 1000 on spot). The bench ranks {{count}} frontends by the dollar amount each one collected through this mechanism, surfacing the real revenue scale of the Hyperliquid frontend ecosystem rather than a percentage ratio that hides the actual numbers. Data comes from the per-builder fills CSV that Hyperliquid publishes for every UTC day on its public stats feed. A Go harness on OCB infrastructure downloads each builder's file once the day is published, sums fees, notional and distinct wallets per builder, keeps 30 days of files for the 7 day and 30 day windows, and exposes Prometheus gauges that this page consumes. Day D lands on the feed early on D+1, so every number here describes the last complete UTC day and every builder is measured on the same day. Companion tabs surface volume routed, unique users and the trader perspective effective fee in basis points.


abstract: |
  The bench ranks every Hyperliquid frontend with a known builder address by the USD value of builder
  fees they collected on the last complete UTC day, and over the 7 and 30 days ending on it.
  Source data is the per-builder daily fills feed Hyperliquid publishes
  at stats-data.hyperliquid.xyz: one lz4-compressed CSV per builder
  address and UTC day, listing every fill that carried that builder
  code with its notional, wallet, taker flag, closed PnL and builder fee.
  A Go harness on OCB infrastructure downloads each file once the day
  is published, keeps a 30 day local mirror, sums fees and notional per
  builder for the day, 7 day and 30 day windows, unions the daily wallet
  sets for the user counts, and exposes the totals as Prometheus gauges
  (hl_frontend_fees_usd_24h_v2, _7d_v2, _30d_v2). This page reads the
  gauges every 30 seconds. The registry of tracked builder addresses
  lives at `harnesses/hyperliquid-frontends/builders.json` in this
  repo, seeded from DefiLlama dimension adapters and HyperTracker plus a
  cross reference pass on the top unidentified addresses. New builders
  ship via public PR. The bench does not place trades, does not touch
  private keys, and does not depend on any node or internal service.


methodology:
  - "Data source. Hyperliquid publishes one CSV per builder address and UTC day at stats-data.hyperliquid.xyz/Mainnet/builder_fills/<address>/<YYYYMMDD>.csv.lz4, listing every fill that carried that builder code with time, wallet, coin, price, size, taker flag, closed PnL and builder fee in USDC. The feed is public and keyless; a missing file answers 403."
  - "Cadence. Day D is published early on D+1 (observed 02:45 to 03:30 UTC). The harness re-checks the feed every 30 minutes, downloads new files into a local mirror, and switches the whole cohort to day D once at least five builders have a file and the batch has settled for 45 minutes. Prometheus scrapes the gauges every 30 seconds. End-to-end lag from a fill to this page is 3 to 27 hours."
  - "Headline calculation. For each builder, the sum of builder_fee over every fill in the day-D file. The 7 day and 30 day figures sum the same field over the files of the 7 and 30 UTC days ending on D, so the three ranges are consistent and every builder is compared on the same days."
  - "Volume companion. Notional is px times sz per fill, summed the same way for the day, 7 day and 30 day windows."
  - "Users. Distinct wallets in the day-D file. The 7 day and 30 day counts are unions of the daily wallet sets, never sums, so a wallet active every day counts once."
  - "Effective fee bps. Builder fees divided by notional, times ten thousand, on day D. The trader perspective on what a representative dollar of flow paid the frontend."
  - "Builder registry. builders.json in the harness tree is a hand-curated array of slug, name and address for every tracked frontend; a frontend routing through several builder addresses lists them all and they are merged into one row. New addresses ship via public PR. Addresses outside the registry are not fetched."
  - "Exclusions. Native Hyperliquid UI orders carry no builder code and are not attributable; roughly 95 percent of Hyperliquid fills land without one. HIP-3 market fills routed through a frontend count toward that frontend; deployer fees are not part of this feed."
  - "Reproducibility. Harness source is open in the OCB harness tree. Anyone can run it against the same public feed with the same registry and reproduce every number, no node required."
  - "Failures. A transport error leaves the previous file and gauge values in place and is retried on the next pass. The cohort never switches to a day before its batch has settled, and the choice of day only moves forward. Restarts re-read the local mirror before touching the feed."

findings:
  - "{{best_name}} leads the leaderboard at {{best_p50}} in builder fees collected on the last complete UTC day."
  - "Top 3 frontends typically capture the majority of attributed builder fee revenue on Hyperliquid mainnet on any given day."
  - "{{name:phantom-perps}} sits at {{p50:phantom-perps}} on the daily view, consistently among the largest revenue collectors thanks to consumer wallet integration."
  - "{{name:metamask}} returns {{p50:metamask}} on the daily view, sustained by a high effective fee bps on a wallet integrated user base."
  - "{{name:insilico}} returns {{p50:insilico}} on the daily view. Pro terminal frontends sit a tier below consumer wallets in raw revenue because their lower effective fee leaves more on the trader side."
  - "USD figures move with both volume and effective fee. A frontend can climb the leaderboard by routing more notional or by widening its fee, the bench surfaces both via companion tabs."
  - "The 7 day and 30 day ranges smooth out promo cycles and one off campaigns. Use those for ranking stability, the daily view for the latest complete day."


faq:
  - q: "What does this benchmark measure?"
    a: "The USD value of builder fees each Hyperliquid frontend collected on the last complete UTC day, and over the 7 and 30 days ending on it. A builder fee is the optional rebate the frontend writes into the builder field on every Hyperliquid order it routes. The on-chain protocol caps this at 100 basis points on perps and 1000 on spot. The bench sums every fill's builderFee value attributed to a known frontend address and publishes the total per timeframe."
  - q: "Why USD revenue instead of effective fee in basis points?"
    a: "The previous version of this bench ranked frontends by effective fee in basis points, which answered the trader question of cost per dollar routed. The dollar revenue framing answers the operator question of size and revenue scale, the same way CoinMarketMan and ASXN dashboards present builder leaderboards. Both views are useful. The effective fee bps view is still available as a companion tab."
  - q: "Where does the data come from?"
    a: "From the per-builder daily fills feed Hyperliquid publishes on its public stats CDN: one CSV per builder address and UTC day, with every fill that carried that builder code. A Go harness on OCB infrastructure downloads each file once the day is published and aggregates it locally. No node, no API key, no third party indexer, no internal Mobula service. Source code is in `harnesses/hyperliquid-frontends` in this repo."
  - q: "How are the 7 day and 30 day numbers built?"
    a: "The harness keeps the last 30 daily files per builder in a local mirror. The 7 day figure sums builder fees over the files of the 7 UTC days ending on the current feed day, the 30 day figure over 30 days. Wallet counts for those windows are unions of the daily wallet sets. Files older than the window are deleted; a small ledger of daily totals is kept for the revenue history on the product pages."
  - q: "Why does the page say 24h when the data is a full UTC day?"
    a: "The feed is cut per UTC day, so the shortest window available is one complete day: midnight to midnight UTC. The 24h label is kept for continuity with the metric names and the recorded history. Every builder is measured on the same day, which is fairer than a rolling window that zeroes frontends whose flow lands early in the day."
  - q: "Which frontends are tracked?"
    a: "Every Hyperliquid frontend with a known builder address, {{count}} today. The cohort spans consumer wallets (Phantom Perps, MetaMask, Rabby, OneKey, Trust Wallet), pro terminals (Insilico, Axiom, Pear, Lit Trade), social and pvp UIs (pvp.trade, Senpi, FOMO), bots and signal apps (FlowBot, Tread fi, Moonbot, Hyperdash), based.app, defi.app and HIP-3 deployers. The registry is in `miniapps/hyperliquid-frontends/local/builders.json` on the open mobula api repo. New addresses ship via public PR."
  - q: "Why are some frontends at zero?"
    a: "Three reasons. The frontend stopped operating or routed no attributed fills that day. The frontend never enabled the builder code attribution system. The frontend uses a builder address not yet in our registry. A frontend at zero on the daily view but not on 7 day or 30 day is in the first bucket; a consistent zero across all timeframes points to the second or third."
  - q: "What kind of frontend collects the most builder fees?"
    a: "Consumer wallets integrate Hyperliquid trading directly inside the wallet UI. Their effective fee is typically in the 5 to 10 basis point range and the user base is large. The combination of wide reach times a moderate fee produces the highest absolute revenue. Pro terminals sit below because they charge less per dollar routed by design, even though their notional volume is comparable."
  - q: "How often does the page refresh?"
    a: "The harness checks the feed every 30 minutes and Prometheus scrapes the gauges every 30 seconds, but the numbers only change once a day, when Hyperliquid publishes the previous UTC day (early morning UTC). The timestamp at the top of the page is the end of the day the numbers describe."
  - q: "Can I cite a value from this page?"
    a: "Yes. Every number is a Prometheus query exposed via the OCB API endpoints. The query string is visible in the row hover tooltip on the leaderboard. The harness source is open at the link in the source field below. Cite the value and the timestamp at the top of the page."


source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/hyperliquid-frontends

prometheus:
  window: 24h
  # The feed publishes day D early on D+1; the gauges describe that day and
  # the timestamp below is its end. A day plus the publish lag is normal.
  expected_freshness_seconds: 129600
  freshness_timestamp_metric: hl_frontend_data_day_end_unix_v2

# Gauges from harnesses/hyperliquid-frontends (feed edition). All carry the
# `builder` label only. "24h" = the last complete UTC day on the feed.
#   hl_frontend_fees_usd_24h_v2        p50 headline (USD builder fees)
#   hl_frontend_volume_usd_24h_v2      p90 column (USD notional)
#   hl_frontend_fees_per_user_usd_v2   p99 column (USD per wallet)
#   hl_frontend_fills_total_24h_v2     sample_size
#   hl_frontend_{fees,volume}_usd_{7d,30d}_v2, hl_frontend_users_{24h,7d,30d}_v2
#   hl_frontend_effective_fee_bps_v2   companion tab
#   hl_frontend_data_day_end_unix_v2   freshness timestamp (end of the feed day)
#   hl_frontend_local_last_tick_unix_v2  harness liveness (success query)
#
# The p50/p90/p99 slots are repurposed since the unit is USD and there is no
# percentile semantics; ledger_columns below label them honestly.

providers:
  - slug: phantom-perps
    name: Phantom
    tag: Hyperliquid builder code, USD revenue on the last complete UTC day
    formula: "USD builder fees collected on the last complete UTC day, summed across every attributed fill in the daily feed file for Phantom's builder address."
    queries:
      p50: hl_frontend_fees_usd_24h_v2{builder="phantom-perps"}
      p90: hl_frontend_volume_usd_24h_v2{builder="phantom-perps"}
      p99: hl_frontend_fees_per_user_usd_v2{builder="phantom-perps"}
      mean: avg_over_time(hl_frontend_fees_usd_24h_v2{builder="phantom-perps"}[7d])
      success: (hl_frontend_local_last_tick_unix_v2 > bool (time() - 7200))
      sample_size: hl_frontend_fills_total_24h_v2{builder="phantom-perps"}
      series: hl_frontend_fees_usd_24h_v2{builder="phantom-perps"}

