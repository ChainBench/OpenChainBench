disclaimer: |
  Ranking is by raw builder fee revenue in USD, not by value for users. Bigger number means more fees collected via the on chain builder code field. For the trader cost perspective, switch to the Effective fee bps companion tab. Native Hyperliquid UI orders carry no builder code and are excluded. Data from a local hl node tailing every fill on mainnet.


seo_intro: |
  This page answers one question. Which Hyperliquid frontend collected the most builder fee revenue in USD over the last 24 hours, 7 days and 30 days. Every Hyperliquid order can attach an optional on chain builder field. Frontends like Phantom Perps, MetaMask, Rabby, Insilico, based dot app, OneKey, Axiom and pvp dot trade write their wallet address into this field on every fill they route, then collect a share of the taker fee as their own rebate (capped at 100 basis points on perps, 1000 on spot). The bench ranks 60 frontends by the dollar amount each one collected through this mechanism, surfacing the real revenue scale of the Hyperliquid frontend ecosystem rather than a percentage ratio that hides the actual numbers. Data comes from a local hl node operated on OCB infrastructure tailing the Hyperliquid mainnet fill stream. A Go harness reads every block of attributed fills, aggregates per builder over rolling 24h, 7 day and 30 day windows in memory, and exposes Prometheus gauges that this page consumes. End to end staleness from fill landing on chain to page render is typically under one minute. Companion tabs surface volume routed, unique users, the trader perspective effective fee in basis points, and an outage detector.


abstract: |
  The bench ranks 60 Hyperliquid frontends by the USD value of builder
  fees they collected over rolling 24 hour, 7 day and 30 day windows.
  Source data is a local hl node operated on OCB infrastructure that
  writes every block of fills to disk as one JSON line. A Go harness
  tails these files, decodes each fill, and increments per builder
  hourly buckets keyed by the UTC hour floor of the fill timestamp.
  At publish time, the harness sums the recent 24, 168 and 720 hourly
  buckets to compute the 24h, 7d and 30d revenue figures, exposes
  them as Prometheus gauges (hl_frontend_fees_usd_24h_v2, _7d_v2,
  _30d_v2), and this page reads the gauges every 30 seconds. The
  registry of tracked builder addresses lives at
  miniapps hyperliquid frontends local builders dot json in the
  open mobula api repo, currently 60 entries seeded from DefiLlama
  dimension adapters plus a behavioral cross reference pass on the
  top unidentified addresses. New builders ship via public PR. The
  bench does not place trades, does not touch private keys, and does
  not depend on any internal Mobula service.


methodology:
  - "Data source. A local hl node operated on OCB infrastructure tails the Hyperliquid mainnet and writes every block of attributed fills to node_fills_by_block hourly YYYYMMDD HH on local disk. Each line is one JSON block, the events array carries one entry per fill, and every fill that opted into the builder code attribution system includes the builder address plus builderFee in USDC."
  - "Cadence. The Go harness re reads the current and previous hourly files every 30 seconds, parses appended lines, and updates per builder hourly buckets keyed by the UTC hour floor of the fill timestamp. Prometheus scrapes the metrics every 30 seconds via a Caddy reverse proxy with basic auth. End to end staleness from fill landing on chain to bench page render is typically under one minute."
  - "Headline calculation. For each builder over the last 24 rolling hours, we sum the builderFee USD values of every attributed fill. The figure is the raw amount of USDC the frontend collected through the builder code field. The 7 day and 30 day figures sum the same field over the last 168 and 720 hourly buckets respectively, so the metric is consistent across the three ranges."
  - "Window mechanics. The harness keeps a small in memory hourly bucket map per builder going back 30 days. Memory footprint is about 350 KB total for 60 builders. Older buckets are pruned on every publish. This is cheaper than keeping fill level granularity for 30 days and lets the bench expose the three ranges without expanding the live fill window."
  - "Volume companion. hl_frontend_volume_usd_24h_v2, _7d_v2 and _30d_v2 are computed the same way on the px times sz product of every fill. They feed the Volume tabs."
  - "Users 24h. Count of unique wallet addresses that placed at least one attributed fill on this builder in the last 24 hours. Computed on the fill level window, not the hourly buckets, because uniqueness requires the full set."
  - "Effective fee bps companion. Volume weighted ratio computed as sum of builder fees divided by sum of notional, times ten thousand, over the rolling 24h window. Surfaces the trader perspective on cost. Volume share dashboards rank frontends by raw notional, this column ranks them by what a representative dollar of flow paid them."
  - "Time since last fill. Seconds elapsed since this builder's most recent attributed fill. During active hours the cohort baseline runs under one minute, so anything above a few minutes is a real anomaly. Catches frontends whose routing pipeline is down and frontends that quietly stopped operating but still have their builder code in circulation."
  - "Builder registry. miniapps hyperliquid frontends local builders dot json is a hand curated array of slug, name, address and notes for every tracked frontend, currently 60 entries. New addresses ship via public PR. Builder addresses outside the registry remain visible in the raw node stream but stay off the leaderboard until added."
  - "Exclusions. Native Hyperliquid UI orders carry no builder code and are not user attributable by this method. Roughly 95 percent of Hyperliquid fills land without a builder field. The 5 percent that do are the frontend ecosystem this bench measures."
  - "Reproducibility. Harness source at miniapps hyperliquid frontends local in the mobula api repo, written in Go. Anyone running their own hl node can clone, point the data flag at their node_fills_by_block hourly root, run the binary against a Prometheus scraper, and reproduce these metrics."
  - "Failures. Any read error on the hourly files leaves the previous gauge values in place. Hourly bucket pruning is idempotent. Restarts replay the warmup window from disk before going live tail."


findings:
  - "{{best_name}} leads the leaderboard at {{best_p50}} in builder fees collected over the last 24 hours."
  - "Top 3 frontends typically capture the majority of attributed builder fee revenue on Hyperliquid mainnet on any given day."
  - "{{name:phantom-perps}} sits at {{p50:phantom-perps}} on the 24h view, consistently among the largest revenue collectors thanks to consumer wallet integration."
  - "{{name:metamask}} returns {{p50:metamask}} on the 24h view, sustained by a high effective fee bps on a wallet integrated user base."
  - "{{name:insilico}} returns {{p50:insilico}} on the 24h view. Pro terminal frontends sit a tier below consumer wallets in raw revenue because their lower effective fee leaves more on the trader side."
  - "USD figures move with both volume and effective fee. A frontend can climb the leaderboard by routing more notional or by widening its fee, the bench surfaces both via companion tabs."
  - "The 7 day and 30 day ranges smooth out promo cycles and one off campaigns. Use those for ranking stability, the 24h view for current activity."


faq:
  - q: "What does this benchmark measure?"
    a: "The USD value of builder fees each Hyperliquid frontend collected over rolling 24 hour, 7 day and 30 day windows. A builder fee is the optional rebate the frontend writes into the builder field on every Hyperliquid order it routes. The on chain protocol caps this at 100 basis points on perps and 1000 on spot. The bench sums every fill's builderFee value attributed to a known frontend address and publishes the total per timeframe."
  - q: "Why USD revenue instead of effective fee in basis points?"
    a: "The previous version of this bench ranked frontends by effective fee in basis points, which answered the trader question of cost per dollar routed. The dollar revenue framing answers the operator question of size and revenue scale, the same way CoinMarketMan and ASXN dashboards present builder leaderboards. Both views are useful. The effective fee bps view is still available as a companion tab."
  - q: "Where does the data come from?"
    a: "A local hl node operated on OCB infrastructure tails the Hyperliquid mainnet. The node writes every block of fills to disk as one JSON line under node_fills_by_block hourly YYYYMMDD HH. A Go harness running on the same host reads these files continuously, parses each fill, and increments per builder hourly aggregates. No third party API, no daily CSV bucket dependency, no internal Mobula service. Source code is in miniapps hyperliquid frontends local in the open mobula api repo."
  - q: "How are the 7 day and 30 day numbers built?"
    a: "The harness keeps a small in memory map of per builder hourly buckets going back 30 days. Each bucket stores the sum of builderFee values and the sum of notional values for fills that landed in that hour. The 7 day figure is the sum of the recent 168 buckets, the 30 day figure is the sum of the recent 720 buckets. Memory footprint is about 350 KB total for all 60 tracked frontends. Buckets older than 30 days are dropped on every publish."
  - q: "How is the 24 hour figure built?"
    a: "Same hourly bucket logic, last 24 buckets. The harness also keeps a separate fill level window for the 24h companions that require per fill granularity (unique users, taker share, slippage proxy)."
  - q: "Which frontends are tracked?"
    a: "Sixty Hyperliquid frontends with a known builder address. The cohort spans consumer wallets (Phantom Perps, MetaMask, Rabby, OneKey, Trust Wallet), pro terminals (Insilico, Axiom, Pear, Lit Trade), social and pvp UIs (pvp dot trade, Senpi, FOMO), bots and signal apps (FlowBot, Tread fi, Moonbot, Hyperdash), based.app, defiapp and HIP-3 deployers. The registry is in miniapps hyperliquid frontends local builders dot json on the open mobula api repo. New addresses ship via public PR."
  - q: "Why are some frontends at zero?"
    a: "Three reasons. The frontend stopped operating or hasn't routed any attributed fills in the window. The frontend never enabled the builder code attribution system. The frontend uses a builder address not yet in our registry. The Time since last fill companion separates these cases. A frontend with hours of inactivity is in the first bucket. A frontend with consistent zero across all timeframes is in the second or third."
  - q: "Why does Phantom Perps usually lead?"
    a: "Consumer wallets integrate Hyperliquid trading directly inside the wallet UI. Their effective fee is typically in the 5 to 10 basis point range and the user base is large. The combination of wide reach times a moderate fee produces the highest absolute revenue. Pro terminals sit below because they charge less per dollar routed by design, even though their notional volume is comparable."
  - q: "How often does the page refresh?"
    a: "Every 30 seconds. The harness re reads the local hl node hourly file every 30 seconds and Prometheus scrapes the gauges on the same cadence. The page itself uses incremental static regeneration with a 60 second window, so headline values are at most 90 seconds stale plus chain propagation delay."
  - q: "Can I cite a value from this page?"
    a: "Yes. Every number is a Prometheus query exposed via the OCB API endpoints. The query string is visible in the row hover tooltip on the leaderboard. The harness source is open at the link in the source field below. Cite the value and the timestamp at the top of the page."


source: https://github.com/MobulaFi/mobula-monorepo/tree/dev/miniapps/hyperliquid-frontends-local

prometheus:
  window: 24h
  expected_freshness_seconds: 5400

# Real metrics emitted by the hyperliquid-frontends harness. The Prom labels
# are kept narrow (just `builder`) so the cross-series queries below don't
# explode in cardinality.
#
#   hl_frontend_fees_usd_24h_v2{builder}            gauge   (p50 headline)
#   hl_frontend_volume_usd_24h_v2{builder}             gauge   (p90 column)
#   hl_frontend_d30_retention_pct{builder}            gauge   (also exposed)
#   hl_frontend_fees_per_user_usd_v2{builder}            gauge   (p99 column)
#   hl_frontend_volume_usd_24h{builder}               gauge   (secondary)
#   hl_frontend_volume_share_pct{builder}             gauge   (secondary)
#   hl_frontend_users_24h{builder}                    gauge
#   hl_frontend_d7_cohort_size{builder}               gauge   (sample-size guard)
#   hl_frontend_d30_cohort_size{builder}              gauge
#   hl_frontend_fills_total_24h_v2{builder}                  gauge
#   hl_frontend_unattributed_share_pct                gauge   (coverage signal)
#   hl_frontend_registry_age_seconds                  gauge   (freshness signal)
#   hl_frontend_csv_fetch_status_total{builder,code}  counter (per HTTP code)
#
# Bench page column mapping. The p50/p90/p99 slots are repurposed since the
# unit is USD and there is no native percentile semantics: p50 = builder
# fees collected 24h, p90 = volume routed 24h, p99 = builder fees per unique
# trader. p90 was previously d7_retention_pct but that metric is only emitted
# for the original 8 builders, which silently dropped the other 52 from the
# leaderboard (spec.ts skips any provider with a null p90 or p99). Switching
# p90 to volume_usd_24h_v2 unblocks the full 60-builder cohort.

providers:
  - slug: phantom-perps
    name: Phantom
    tag: Hyperliquid builder code, USD revenue captured over rolling 24h window
    formula: "Volume-weighted effective builder fee in basis points over the last complete UTC day, computed from Hyperliquid's public attributed-fills CSV for Phantom's builder address."
    queries:
      p50: hl_frontend_fees_usd_24h_v2{builder="phantom-perps"}
      p90: hl_frontend_volume_usd_24h_v2{builder="phantom-perps"}
      p99: hl_frontend_fees_per_user_usd_v2{builder="phantom-perps"}
      mean: avg_over_time(hl_frontend_fees_usd_24h_v2{builder="phantom-perps"}[7d])
      success: (hl_frontend_local_last_tick_unix_v2 > bool (time() - 120))
      sample_size: hl_frontend_fills_total_24h_v2{builder="phantom-perps"}
      series: hl_frontend_fees_usd_24h_v2{builder="phantom-perps"}

