# OpenChainBench. Bench No 230

slug: thundercore-rpc
number: "230"
title: "ThunderCore RPC endpoints: free public URLs by latency"
seo_title: "ThunderCore RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free ThunderCore RPC at {{best_p50}} (eth_getBlockByNumber EVM p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every available public ThunderCore node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  ThunderCore is an EVM-compatible Layer 1 blockchain (chain ID 108) designed for high throughput, producing approximately one block per second with fast finality. It runs a modified version of Ethereum with the Thunder consensus protocol and exposes a standard JSON-RPC interface. Public EVM endpoints are available without an API key from ThunderCore Official, ThunderToken and dRPC. Every provider was live-verified with consecutive eth_getBlockByNumber probes at launch.

abstract: |
  ThunderCore: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:thundercore-official}}.
  We measure the round-trip latency of a single eth_getBlockByNumber ("latest", false) call against every available public ThunderCore node that sustains continuous probing: {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a standard EVM staleness gap. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the ThunderCore-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: {\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}. Plain HTTP POST. Standard Ethereum JSON-RPC 2.0."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the ThunderCore-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=thundercore. Provider coverage today: {{count}} endpoints."

faq:
  - q: "Which ThunderCore RPC endpoints work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today: ThunderCore Official (mainnet-rpc.thundercore.com), ThunderToken (mainnet-rpc.thundertoken.net) and dRPC (thundercore.drpc.org). Every listed endpoint was live-verified with an eth_getBlockByNumber call returning a parsable block number before inclusion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="thundercore"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: thundercore-official
    name: ThunderCore Official
    endpoint: https://mainnet-rpc.thundercore.com
    tag: ThunderCore official public RPC, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for an eth_getBlockByNumber POST sent every 60s from 3 regions to mainnet-rpc.thundercore.com."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thundercore-official", chain="thundercore"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="thundercore-official", chain="thundercore"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="thundercore-official", chain="thundercore"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="thundercore-official", chain="thundercore"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="thundercore-official", chain="thundercore"}) / sum(ocb:rpc_call:rate_24h{provider="thundercore-official", chain="thundercore"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="thundercore-official", chain="thundercore"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="thundercore-official", chain="thundercore"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thundercore-official", chain="thundercore", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thundercore-official", chain="thundercore", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thundercore-official", chain="thundercore", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thundercore-official", chain="thundercore", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thundercore-official", chain="thundercore", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thundercore-official", chain="thundercore", region="sgp"}[1h])

  - slug: thundertoken
    name: ThunderToken
    endpoint: https://mainnet-rpc.thundertoken.net
    tag: ThunderToken public ThunderCore RPC, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for an eth_getBlockByNumber POST sent every 60s from 3 regions to mainnet-rpc.thundertoken.net."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thundertoken", chain="thundercore"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="thundertoken", chain="thundercore"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="thundertoken", chain="thundercore"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="thundertoken", chain="thundercore"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="thundertoken", chain="thundercore"}) / sum(ocb:rpc_call:rate_24h{provider="thundertoken", chain="thundercore"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="thundertoken", chain="thundercore"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="thundertoken", chain="thundercore"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thundertoken", chain="thundercore", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thundertoken", chain="thundercore", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thundertoken", chain="thundercore", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thundertoken", chain="thundercore", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thundertoken", chain="thundercore", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thundertoken", chain="thundercore", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    endpoint: https://thundercore.drpc.org
    tag: dRPC decentralised multi-chain RPC, public ThunderCore endpoint, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for an eth_getBlockByNumber POST sent every 60s from 3 regions to thundercore.drpc.org."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="thundercore"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="thundercore"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="thundercore"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="thundercore"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="thundercore"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="thundercore"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="thundercore"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="thundercore"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="thundercore", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="thundercore", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="thundercore", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="thundercore", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="thundercore", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="thundercore", region="sgp"}[1h])
