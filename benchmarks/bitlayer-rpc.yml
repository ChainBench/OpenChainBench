      success: sum(ocb:rpc_call:ok_rate_24h{provider="ankr", chain="bitlayer"}) / sum(ocb:rpc_call:rate_24h{provider="ankr", chain="bitlayer"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="ankr", chain="bitlayer"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="ankr", chain="bitlayer"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ankr", chain="bitlayer", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ankr", chain="bitlayer", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ankr", chain="bitlayer", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ankr", chain="bitlayer", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ankr", chain="bitlayer", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ankr", chain="bitlayer", region="sgp"}[1h])
