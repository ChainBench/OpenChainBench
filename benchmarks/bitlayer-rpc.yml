# OpenChainBench. Bench № 148

slug: bitlayer-rpc
number: "148"
title: "Bitlayer RPC endpoints: free public URLs by latency"
seo_title: "Bitlayer RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Bitlayer RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Bitlayer RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Bitlayer is the first EVM-compatible Bitcoin L2 (chain 200901) secured by a BitVM-based fraud-proof scheme with BTC as the gas token. The official endpoint (`rpc.bitlayer.org`) is operated by Bitlayer Labs, with dRPC and Ankr providing additional keyless alternatives probed every 60 seconds from three regions.

abstract: |
  Bitlayer: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:bitlayer-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Bitlayer endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Bitlayer-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Bitlayer-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"bitlayer\"`. Provider coverage today: {{count}} no-key endpoints."


source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="bitlayer"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: bitlayer-official
    name: Bitlayer Official
    endpoint: https://rpc.bitlayer.org
    tag: Bitlayer Labs-operated public RPC for Bitlayer mainnet
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Bitlayer Official's no-key Bitlayer endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="bitlayer-official", chain="bitlayer"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="bitlayer-official", chain="bitlayer"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="bitlayer-official", chain="bitlayer"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="bitlayer-official", chain="bitlayer"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="bitlayer-official", chain="bitlayer"}) / sum(ocb:rpc_call:rate_24h{provider="bitlayer-official", chain="bitlayer"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="bitlayer-official", chain="bitlayer"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="bitlayer-official", chain="bitlayer"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="bitlayer-official", chain="bitlayer", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="bitlayer-official", chain="bitlayer", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="bitlayer-official", chain="bitlayer", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="bitlayer-official", chain="bitlayer", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="bitlayer-official", chain="bitlayer", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="bitlayer-official", chain="bitlayer", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    endpoint: https://bitlayer.drpc.org
    tag: Decentralized RPC mesh, consensus-checked
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to dRPC's no-key Bitlayer endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="bitlayer"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="bitlayer"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="bitlayer"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="bitlayer"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="bitlayer"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="bitlayer"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="bitlayer"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="bitlayer"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="bitlayer", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="bitlayer", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="bitlayer", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="bitlayer", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="bitlayer", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="bitlayer", region="sgp"}[1h])

  - slug: ankr
    name: Ankr
    endpoint: https://rpc.ankr.com/bitlayer
    tag: Multi-cloud RPC network, 40+ chains, keyless tier
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Ankr's no-key Bitlayer endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ankr", chain="bitlayer"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="ankr", chain="bitlayer"})
