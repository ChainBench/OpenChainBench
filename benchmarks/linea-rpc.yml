# OpenChainBench. Bench № 051

slug: linea-rpc
number: "051"
title: "Linea RPC endpoints: free public URLs ranked by latency"
# seo_title test cohort (2026-09-19): endpoint-intent title; H1 keeps the measured claim.
seo_title: "Linea RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Linea RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Linea RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  The no-key field thins out on Linea: {{count}} providers qualify (PublicNode, dRPC, Tenderly), all multi-chain gateways. Thinner competition makes the reliability columns matter more than raw speed, a fast endpoint with a high stale or timeout rate is a worse default than a slightly slower consistent one. Probes run every 60 seconds from us-east, eu-west and Singapore with full response classification.

abstract: |
  Linea: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Linea endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore. The harness also classifies every response (ok / http_err / jsonrpc_err / stale / timeout) and audits archive depth every 5 minutes, so the leaderboard rewards sustained, honest availability rather than a fast error message. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Linea-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the latest-header fetch with a rotating id defeats edge caches that answer eth_blockNumber without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Linea-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=\"linea\". Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. Exclusions follow the cluster-wide rules documented on the parent benchmark."

faq:
  - q: "Which Linea RPCs work without an API key?"
    a: "The {{count}} providers on this page are listed with their URLs in the endpoints table above. Every (provider, chain) pair was live-verified no-key before inclusion, and anything that key-gates, region-blocks or rate-limits below our 60-second cadence is excluded rather than listed with an asterisk."
  - q: "Why do so few free RPCs support Linea?"
    a: "Free-tier coverage follows demand: gateways add no-key chains when traffic justifies the infrastructure. Linea's cohort ({{count}} providers) is typical of newer L2s; the Ethereum and Arbitrum pages list their own live counts. The flip side is that the providers that do qualify are the disciplined multi-chain operators, so the measured success rates (listed in the endpoints table) stay high even where the field is thin."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on region alone.
rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="linea"})

# Region is the only dimension: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://linea-rpc.publicnode.com
    tag: Allnodes-operated, 70+ chains, archive on most
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Linea endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="linea"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="linea"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="linea"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="linea"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="linea"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="linea"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="linea"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="linea"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="linea", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="linea", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="linea", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="linea", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="linea", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="linea", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    endpoint: https://linea.drpc.org
    tag: Decentralized RPC mesh, consensus-checked
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to dRPC's no-key Linea endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="linea"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="linea"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="linea"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="linea"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="linea"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="linea"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="linea"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="linea"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="linea", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="linea", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="linea", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="linea", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="linea", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="linea", region="sgp"}[1h])

  - slug: tenderly
    name: Tenderly
    endpoint: https://gateway.tenderly.co/public/linea
    tag: Multi-chain public gateway, 9 chains, no key
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Tenderly's no-key Linea endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tenderly", chain="linea"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="tenderly", chain="linea"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="tenderly", chain="linea"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="tenderly", chain="linea"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="tenderly", chain="linea"}) / sum(ocb:rpc_call:rate_24h{provider="tenderly", chain="linea"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="tenderly", chain="linea"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="tenderly", chain="linea"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tenderly", chain="linea", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tenderly", chain="linea", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tenderly", chain="linea", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tenderly", chain="linea", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tenderly", chain="linea", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tenderly", chain="linea", region="sgp"}[1h])

