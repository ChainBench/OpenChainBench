# OpenChainBench. Bench № 239

slug: keyed-rpc-base
number: "239"
title: "Fastest Base RPC with API key: Alchemy, Infura, Chainstack"
seo_title: "Fastest Base RPC API key 2026: Alchemy vs Infura vs Chainstack latency"
seo_description: "Live Base RPC latency: Alchemy, Infura, and Chainstack keyed endpoints measured every 60s from 3 regions. Best free API key for Base."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against keyed Base endpoints (Alchemy, Infura, Chainstack), probed every 60 seconds from 3 regions.
category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Base, Coinbase's OP Stack L2, has become one of the fastest-growing
  chains for consumer apps. This bench probes Alchemy, Infura, and
  Chainstack on their keyed Base endpoints every 60 seconds from
  us-east, eu-west, and Singapore, staying inside each provider's
  free monthly quota.
  Alchemy leads at 6-7ms across all regions. Chainstack sits at
  69-74ms as a consistent second option. Infura shows 450ms+ on Base,
  the same throttling pattern as on other chains in its shared
  free-tier pool.
  The multi-chain overview across all providers and chains is at
  [rpc-keyed-latency](/benchmarks/rpc-keyed-latency); this page
  isolates Base for teams building there.

abstract: |
  We measure the round-trip latency of a single eth_getBlockByNumber
  call against the keyed free tier of Alchemy, Infura, and Chainstack
  on Base. The probe uses a rotating JSON-RPC id to defeat edge caches,
  fires every 60 seconds from 3 regions, and classifies each response
  as ok, http_err, jsonrpc_err, stale, or timeout. Only ok responses
  contribute to the latency distribution.

methodology:
  - "Cadence: every 60 seconds per provider from each of 3 probe regions (us-east, eu-west, sgp), inside each provider's free monthly quota. Headline p50/p90/p99 aggregate across regions via Prometheus avg(quantile_over_time(...))."
  - "Payload: eth_getBlockByNumber('latest', false) with a rotating JSON-RPC id. Non-cacheable by design: the rotating id defeats body-keyed edge caches and forces the provider to serve a real Base chain tip."
  - "Authentication: each provider's standard free-tier key, no credit card required. Keys live in env vars on probe services and never in the repo. Endpoint shapes: key-in-path (Alchemy /v2/<key>, Chainstack, Infura /v3/<key>)."
  - "Call-result classification: ok (HTTP 200 with usable block number), http_err, jsonrpc_err (HTTP 200 with error body), stale (block more than 20 behind the cross-provider tip), timeout. Latency is recorded only for ok responses."
  - "Cohort: Alchemy, Chainstack (Global Node, plan disclosed; free plan caps at one node), Infura / MetaMask Developer. A provider is absent when its free tier does not cover Base or its key quota was exhausted; that absence is itself a finding."

findings:
  - "{{name:alchemy}} leads at {{p50:alchemy}} (p50, 24h) across all 3 regions."
  - "{{name:chainstack}} delivers {{p50:chainstack}} as the second-fastest option on Base; its Global Node anycast product routes to the closest node automatically."
  - "{{name:infura}} sits at {{p50:infura}}, consistent with its shared free-tier pool routing pattern across OP Stack chains."

faq:
  - q: "Which Base RPC provider is fastest with a free API key?"
    a: "Per the live data above: {{name:alchemy}} at {{p50:alchemy}} (p50 over 24h, averaged across us-east, eu-west, and Singapore probes). Chainstack is the closest second at {{p50:chainstack}}."
  - q: "Does Alchemy have an advantage on Base specifically?"
    a: "Alchemy built Base's sequencer and maintains close infrastructure ties to Coinbase. This co-location advantage is visible in the sub-10ms p50 across all 3 probe regions. Chainstack and Infura rely on external access to the same sequencer, so an additional hop adds latency."
  - q: "Does the keyed tier add any reliability vs the public Base RPC?"
    a: "The public Base RPC (base.llamarpc.com, etc.) is compared on the [rpc-capabilities](/benchmarks/rpc-capabilities) bench with the same probe. The keyed tier adds quota attribution and (on paid plans) dedicated capacity, but at the free tier the infrastructure is typically shared."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-keyed-latency

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="base",tier="keyed"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: alchemy
    name: Alchemy
    tag: 30M CU/mo free, keyed Base endpoint
    formula: "p50 over 24h of round-trip latency (ms) for eth_getBlockByNumber probed every 60s from 3 regions on Alchemy's keyed Base endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="alchemy",chain="base",tier="keyed"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="alchemy",chain="base",tier="keyed"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="alchemy",chain="base",tier="keyed"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="alchemy",chain="base",tier="keyed"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="alchemy",chain="base",tier="keyed"}) / sum(ocb:rpc_call:rate_24h{provider="alchemy",chain="base",tier="keyed"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="alchemy",chain="base",tier="keyed"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="alchemy",chain="base",tier="keyed"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="alchemy",chain="base",tier="keyed",region="us-east"})
          series: avg(avg_over_time(rpc_latency_milliseconds{provider="alchemy",chain="base",tier="keyed",region="us-east"}[1h]))
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="alchemy",chain="base",tier="keyed",region="eu-west"})
          series: avg(avg_over_time(rpc_latency_milliseconds{provider="alchemy",chain="base",tier="keyed",region="eu-west"}[1h]))
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="alchemy",chain="base",tier="keyed",region="sgp"})
          series: avg(avg_over_time(rpc_latency_milliseconds{provider="alchemy",chain="base",tier="keyed",region="sgp"}[1h]))

