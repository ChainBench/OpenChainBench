      p50: 100 * sum by (provider) (rpc_api_supported{provider="alchemy",chain!="solana"}) / count by (provider) (rpc_api_supported{provider="alchemy",chain!="solana"})
      success: 100 * count by (provider) (rpc_api_supported{provider="alchemy",chain!="solana"}) / count by (provider) (count by (provider, chain, api) (rpc_api_probe_total{provider="alchemy",chain!="solana"}))
