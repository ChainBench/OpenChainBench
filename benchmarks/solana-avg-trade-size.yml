# OpenChainBench. Bench 206

slug: solana-avg-trade-size
number: "206"
title: "Average swap size on Solana: pump.fun vs GMGN vs Fomo vs Axiom, live"
seo_title: "Average trade size by Solana trading platform 2026: pump.fun vs GMGN vs Axiom vs Fomo"
seo_description: "{{best_name}} has the largest average swap size at {{best_p50}} per trade. GMGN vs Axiom vs Fomo vs Trojan vs Terminal ranked by average trade size, from our own Dune SQL over Solana fee-wallet attribution."
subtitle: Average swap size in USD per attributed transaction for each Solana trading platform, for one complete day. Built from our own SQL over Dune's solana.account_activity and dex_solana.trades. Reveals the trader profile of each platform, from retail micro-trades to large-order flow.

category: Trading
status: live
metric: Avg swap size
unit: usd
higher_is_better: true

disclaimer: |
  Average swap size is a day's attributed Solana volume divided by that day's attributed transaction count. Both include bot and MEV activity: the figure covers every on-chain swap attributed to the platform, not human-only trades. A transaction is attributed when that platform's fee wallet received value in it, and one leg per transaction and trader is counted. GMGN, Axiom and Terminal also trade on EVM chains and those legs are not in here. pump.fun and BasedBot read unresponsive.

seo_intro: |
  The average swap size on Solana varies by several multiples across platforms,
  revealing sharply different trader profiles. pump.fun consistently sits at the
  bottom of the leaderboard, reflecting the micro-cap degen activity of its
  bonding-curve launchpad and the heavy bot sniping that inflates trade count while
  compressing average size. GMGN and Trojan serve more sophisticated traders running
  larger positions and consistently rank at the top. Fomo sits in the middle,
  positioning between retail and professional. This benchmark tracks average swap
  size live across all major Solana trading frontends and launchpads, updated every
  15 minutes from Mobula lighthouse attribution data.

abstract: |
  The harness runs one Dune execution a day against its own SQL over
  solana.account_activity, dex_solana.trades and prices.day, and divides the day's
  attributed volume by its attributed transaction count. It exposes
  dune_platform_avg_trade_usd, dune_platform_txns_24h,
  dune_platform_volume_data_day_unix and dune_platform_volume_health per platform.
  A transaction is attributed to the platform whose fee wallet received value in
  it, and one dex_solana.trades leg per transaction and trader is summed so a
  multi-hop route is not counted several times.

methodology:
  - "Source: our own SQL over Dune's solana.account_activity, dex_solana.trades and prices.day, one execution a day. No uploaded third-party dataset: the eight this bench read until 2026-09-27 all froze on 2026-08-25 and were served as current for 32 days."
  - "Attribution: a transaction counts for a platform when that platform's fee wallet received value in it, and one dex_solana.trades leg per transaction and trader is taken so a multi-hop route counts once. Wallet lists come from the DeFiLlama adapter repo and our solana-unique-traders harness, read 2026-09-27."
  - "Average swap size: dune_platform_avg_trade_usd, the day's attributed volume_usd divided by its attributed transaction count, computed in the query rather than in PromQL."
  - "Bot inclusion: every attributed swap counts, bots and MEV included. A platform whose flow is mostly bot sniping reads a lower average than a human-only baseline would."
  - "Day: the newest UTC day that closed at least 10 hours earlier, the rule DeFiLlama's own Solana adapters use. dune_platform_volume_data_day_unix carries the day each figure is for."
  - "Stale source: a platform whose data day falls more than 3 days behind, or that the query stops returning, has its gauges deleted and reads unresponsive. An old figure is never republished as current."
  - "Scope: Solana only. GMGN, Axiom and Terminal also trade on EVM chains, and those legs are not counted here. pump.fun and BasedBot are not measured at all."

findings:
  - "{{best_name}} attracts the largest average swap at {{best_p50}} per transaction."
  - "{{name:fomo}} reads {{p50:fomo}} and {{name:trojan}} {{p50:trojan}}, so the gap between a sponsored-gas retail wallet and a Telegram bot's flow shows up in the table rather than being asserted."
  - "Every figure here is fee-paying volume: the denominator counts transactions that paid the platform, so the average is the size of a trade the platform actually earned on."
  - "pump.fun and BasedBot read unresponsive. pump.fun charges no bonding-curve fee, so there is no fee wallet to attribute its transactions from, and BasedBot has no public wallet list."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/dune-platform-volume

prometheus:
  window: 24h
  freshness_metric: dune_platform_avg_trade_usd

faq:
  - q: "What does average swap size measure?"
    a: "Average swap size is total 24h attributed volume divided by total 24h attributed trade count. It reflects the typical notional size of a single swap on each platform. A platform with many small trades will show a low average; one with fewer but larger trades will show a high average."
  - q: "Why is the pump.fun row empty?"
    a: "pump.fun cut its bonding-curve fee to 0% in Aug 2026, so no fee wallet receives anything on its trades and the attribution this bench uses cannot see them. The retired dataset that used to fill this row stopped updating on 2026-08-25 and was served as current for a month; the row reads unresponsive now instead."
  - q: "Is this apple-to-apple across platforms?"
    a: "Yes, closer than before. Every row uses the same rule: a transaction counts for the platform whose fee wallet received value in it, and one dex_solana.trades leg per transaction and trader is summed. A pump.fun token bought through GMGN counts under GMGN. The one asymmetry is Fomo, which sponsors gas and so is measured on its USDC fee leg per transaction instead."
  - q: "Why is Fomo's average trade size different from GMGN's?"
    a: "Fomo attracts a broader retail base through social copy-trading and wallet features, and it sponsors the gas on every trade it routes, so its transaction count includes flow a self-funded terminal would not see. Fomo also settles cross-chain trades through Relay, which is not on Solana and not counted here, so the figure is its Solana activity rather than its whole business."

providers:
  - slug: pump-fun
    name: pump.fun
    tag: "Solana meme launchpad + relay"
    formula: "Not measured. pump.fun charges no bonding-curve fee since Aug 2026, so no fee wallet receives anything on its trades and fee-wallet attribution cannot see them. The row reads unresponsive."
    queries:
      p50: dune_platform_avg_trade_usd{platform="pump-fun"}
      p90: dune_platform_avg_trade_usd{platform="pump-fun"}
      p99: dune_platform_avg_trade_usd{platform="pump-fun"}
      mean: dune_platform_avg_trade_usd{platform="pump-fun"}
      success: dune_platform_volume_health{platform="pump-fun"}
      sample_size: dune_platform_txns_24h{platform="pump-fun"}
      series: dune_platform_avg_trade_usd{platform="pump-fun"}

