      sample_size: sum(increase(bridge_quote_latency_ms_count{bridge="lifi"}[24h]))
      series: histogram_quantile(0.50, sum by (le) (rate(bridge_quote_latency_ms_bucket{bridge="lifi"}[1h])))

  - slug: debridge
    name: Debridge
    tag: Native-token fees
