# OpenChainBench. Bench № 241

slug: keyed-rpc-polygon
number: "241"
title: "Fastest Polygon RPC with API key: Alchemy, Infura, Chainstack"
seo_title: "Fastest Polygon RPC API key 2026: Alchemy vs Infura vs Chainstack latency"
seo_description: "Live Polygon RPC latency: Alchemy, Infura, and Chainstack keyed endpoints measured every 60s from 3 regions. Best free API key for Polygon."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against keyed Polygon endpoints (Alchemy, Infura, Chainstack), probed every 60 seconds from 3 regions.
category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Polygon PoS remains the most widely deployed sidechain for consumer
  apps and gaming. This bench probes Alchemy, Infura, and Chainstack
  on their keyed Polygon endpoints every 60 seconds from us-east,
  eu-west, and Singapore, staying inside each provider's free monthly
  quota.
  Alchemy leads at 5-6ms across all regions. Chainstack delivers
  83-97ms, the widest cross-region gap in this cohort, reflecting its
  anycast routing to MATIC validators. Infura sits at 449-461ms,
  consistent with its shared free-tier throttling pattern.
  The multi-chain overview is at
  [rpc-keyed-latency](/benchmarks/rpc-keyed-latency); this page
  isolates Polygon for builders targeting that chain.

abstract: |
  We measure the round-trip latency of a single eth_getBlockByNumber
  call against the keyed free tier of Alchemy, Infura, and Chainstack
  on Polygon PoS. The probe uses a rotating JSON-RPC id to defeat edge
  caches, fires every 60 seconds from 3 regions, and classifies each
  response as ok, http_err, jsonrpc_err, stale, or timeout. Only ok
  responses contribute to the latency distribution.

methodology:
  - "Cadence: every 60 seconds per provider from each of 3 probe regions (us-east, eu-west, sgp), inside each provider's free monthly quota. Headline p50/p90/p99 aggregate across regions via Prometheus avg(quantile_over_time(...))."
  - "Payload: eth_getBlockByNumber('latest', false) with a rotating JSON-RPC id. Non-cacheable by design: the rotating id defeats body-keyed edge caches and forces the provider to serve a real Polygon chain tip."
  - "Authentication: each provider's standard free-tier key, no credit card required. Keys live in env vars on probe services and never in the repo. Endpoint shapes: key-in-path (Alchemy /v2/<key>, Chainstack, Infura /v3/<key>)."
  - "Call-result classification: ok (HTTP 200 with usable block number), http_err, jsonrpc_err (HTTP 200 with error body), stale (block more than 20 behind the cross-provider tip), timeout. Latency is recorded only for ok responses."
  - "Cohort: Alchemy, Chainstack (Global Node, plan disclosed; free plan caps at one node), Infura / MetaMask Developer. A provider is absent when its free tier does not cover Polygon or its key quota was exhausted; that absence is itself a finding."

findings:
  - "{{name:alchemy}} leads at {{p50:alchemy}} (p50, 24h) across all 3 regions."
  - "{{name:chainstack}} delivers {{p50:chainstack}} as the second-fastest option; its cross-region spread on Polygon is wider than on Ethereum or BNB, reflecting longer validator round-trips from some probe locations."
  - "{{name:infura}} sits at {{p50:infura}}, consistent with its shared free-tier throttling pattern across EVM chains."

faq:
  - q: "Which Polygon RPC provider is fastest with a free API key?"
    a: "Per the live data above: {{name:alchemy}} at {{p50:alchemy}} (p50 over 24h, averaged across us-east, eu-west, and Singapore probes). Chainstack follows at {{p50:chainstack}}."
  - q: "Does Polygon's high block rate affect RPC latency?"
    a: "Polygon PoS produces blocks every 2 seconds, roughly 4x faster than Ethereum. A probe arriving between blocks will see the same cached latest-block response as the previous probe; only on-chain progression resets the tip. The stale threshold (20 blocks) is set to account for this higher block rate while still catching genuine sync issues."
  - q: "Is there a meaningful latency difference between Polygon and Ethereum keyed RPCs?"
    a: "Alchemy shows similar latency on both chains (5-7ms) because it routes from the same US/EU PoPs to co-located validator infrastructure. Chainstack is faster on Ethereum (6ms EU-west) than Polygon (83-97ms), likely reflecting different node placement for MATIC vs ETH validators."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-keyed-latency

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="polygon",tier="keyed"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: alchemy
    name: Alchemy
    tag: 30M CU/mo free, keyed Polygon endpoint
    formula: "p50 over 24h of round-trip latency (ms) for eth_getBlockByNumber probed every 60s from 3 regions on Alchemy's keyed Polygon endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="alchemy",chain="polygon",tier="keyed"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="alchemy",chain="polygon",tier="keyed"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="alchemy",chain="polygon",tier="keyed"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="alchemy",chain="polygon",tier="keyed"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="alchemy",chain="polygon",tier="keyed"}) / sum(ocb:rpc_call:rate_24h{provider="alchemy",chain="polygon",tier="keyed"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="alchemy",chain="polygon",tier="keyed"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="alchemy",chain="polygon",tier="keyed"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="alchemy",chain="polygon",tier="keyed",region="us-east"})
          series: avg(avg_over_time(rpc_latency_milliseconds{provider="alchemy",chain="polygon",tier="keyed",region="us-east"}[1h]))
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="alchemy",chain="polygon",tier="keyed",region="eu-west"})
          series: avg(avg_over_time(rpc_latency_milliseconds{provider="alchemy",chain="polygon",tier="keyed",region="eu-west"}[1h]))
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="alchemy",chain="polygon",tier="keyed",region="sgp"})
          series: avg(avg_over_time(rpc_latency_milliseconds{provider="alchemy",chain="polygon",tier="keyed",region="sgp"}[1h]))

