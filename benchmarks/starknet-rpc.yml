# OpenChainBench. Bench № 209

slug: starknet-rpc
number: "209"
title: Fastest free Starknet RPC, live no-key endpoint latency
seo_title: "Fastest free Starknet RPC 2026"
seo_description: "{{best_name}} leads free Starknet RPC at {{best_p50}} (starknet_blockNumber p50, 24h). 5 no-key providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for starknet_blockNumber against every free, no-key public Starknet RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Starknet is a ZK-Rollup on Ethereum using STARK proofs for validity. Blocks finalize on Ethereum L1. Free public RPC endpoints are available without an API key from dRPC, Lava, Nethermind, OnFinality and 1RPC. Every provider was live-verified with consecutive keyless starknet_blockNumber probes at launch.

abstract: |
  Per-chain member of the RPC latency cluster, extended to Starknet.
  We measure the round-trip latency of a single, identical JSON-RPC call
  (starknet_blockNumber) against every no-key public Starknet endpoint
  that sustains continuous probing: 5 providers at launch,
  every 60 seconds, from us-east, eu-west and Singapore. The harness
  classifies every response (ok / http_err / jsonrpc_err / stale /
  timeout) with a Starknet-scaled staleness gap. The cross-chain view
  lives on the parent rpc-capabilities benchmark; this page is the
  Starknet-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: {\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"starknet_blockNumber\",\"params\":[]}. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the rotating id defeats edge caches."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms to 10 s), so percentiles are computed via Prometheus quantile_over_time over the last 24 hours."
  - "Call-result classification: ok (HTTP 200 + non-empty result with a parsable block number), http_err, jsonrpc_err (HTTP 200 carrying an error body), stale, timeout. Latency without reliability is a misleading ranking signal."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain rpc-capabilities benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to chain=starknet. Provider coverage at launch: 5 no-key endpoints (dRPC, Lava, Nethermind, OnFinality, 1RPC)."

findings:
  - "{{best_name}} currently leads free Starknet RPC at {{best_p50}} (starknet_blockNumber p50, 24h) across 5 measured providers."

faq:
  - q: "What is the fastest free Starknet RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (starknet_blockNumber p50 over the last 24h), measured against 5 no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Starknet RPCs work without an API key?"
    a: "5 endpoints sustain continuous keyless probing at launch: dRPC, Lava Network, Nethermind, OnFinality and 1RPC. Every listed endpoint was live-verified with a starknet_blockNumber POST returning a parsable block number before inclusion."
  - q: "Does the fastest Starknet RPC change by region?"
    a: "Often. Public infra concentrates in specific regions; a gateway that wins from Amsterdam can lose from Singapore by multiples. The region tabs at the top of the page re-scope every number to a single origin."
  - q: "How is Starknet RPC latency measured here, technically?"
    a: "One identical starknet_blockNumber POST every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus quantile_over_time over 24 hours."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="starknet"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: drpc
    name: dRPC
    tag: Decentralized RPC mesh, consensus-checked responses, 29+ chains, 210M CU/mo free tier
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single starknet_blockNumber POST sent every 60s from 3 regions to dRPC's no-key Starknet endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="starknet"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="starknet"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="starknet"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="starknet"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="starknet"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="starknet"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="starknet"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="starknet"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="starknet", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="starknet", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="starknet", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="starknet", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="starknet", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="starknet", region="sgp"}[1h])

