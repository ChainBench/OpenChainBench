# OpenChainBench. Bench № 209

slug: starknet-rpc
number: "209"
title: "Starknet RPC endpoints: free public URLs by latency"
seo_title: "Starknet RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Starknet RPC at {{best_p50}} (starknet_blockNumber p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for starknet_blockNumber against every free, no-key public Starknet RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Starknet is a ZK-Rollup on Ethereum using STARK proofs for validity. Blocks finalize on Ethereum L1. Free public RPC endpoints are available without an API key from OnFinality, PublicNode and ZAN. Lava, 1RPC, Nethermind's free endpoint and dRPC's keyless Starknet route stopped answering in 2026 and were removed on 2026-10-19.

abstract: |
  Starknet: {{count}} free public RPC endpoints answering `starknet_blockNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical JSON-RPC call (starknet_blockNumber) against every no-key public Starknet endpoint that sustains continuous probing: {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a Starknet-scaled staleness gap. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Starknet-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: {\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"starknet_blockNumber\",\"params\":[]}. Plain HTTP POST, identical for every endpoint, no API key in any request. The request id rotates, but that does not guarantee a cache miss: many caches normalise `id` away. Measured 2026-10-08, fixed and rotating ids answer within 2 to 4 percent of each other."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Starknet-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=starknet. Provider coverage today: {{count}} no-key endpoints (OnFinality, PublicNode, ZAN)."


source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="starknet"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: onfinality
    name: OnFinality
    endpoint: https://starknet.api.onfinality.io/public
    tag: Global multi-chain gateway, 70+ networks, rate-limited public tier, 5 req/sec
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single starknet_blockNumber POST sent every 60s from 3 regions to OnFinality's no-key Starknet endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="starknet"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="onfinality", chain="starknet"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="onfinality", chain="starknet"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="onfinality", chain="starknet"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="onfinality", chain="starknet"}) / sum(ocb:rpc_call:rate_24h{provider="onfinality", chain="starknet"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="onfinality", chain="starknet"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="starknet"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="starknet", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="starknet", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="starknet", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="starknet", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="starknet", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="starknet", region="sgp"}[1h])

  - slug: publicnode
    name: PublicNode
    endpoint: https://starknet-rpc.publicnode.com
    tag: Allnodes' free public RPC, no key, no sign-up
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single starknet_blockNumber POST sent every 60s from 3 regions to PublicNode's no-key Starknet endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="starknet"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="starknet"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="starknet"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="starknet"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="starknet"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="starknet"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="starknet"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="starknet"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="starknet", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="starknet", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="starknet", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="starknet", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="starknet", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="starknet", region="sgp"}[1h])

  - slug: zan
    name: ZAN
    endpoint: https://api.zan.top/public/starknet-mainnet
    tag: Ant Digital Technologies' node service, public Starknet endpoint without a key
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single starknet_blockNumber POST sent every 60s from 3 regions to ZAN's no-key Starknet endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="zan", chain="starknet"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="zan", chain="starknet"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="zan", chain="starknet"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="zan", chain="starknet"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="zan", chain="starknet"}) / sum(ocb:rpc_call:rate_24h{provider="zan", chain="starknet"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="zan", chain="starknet"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="zan", chain="starknet"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="zan", chain="starknet", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="zan", chain="starknet", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="zan", chain="starknet", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="zan", chain="starknet", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="zan", chain="starknet", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="zan", chain="starknet", region="sgp"}[1h])
