# OpenChainBench. Bench № 192

slug: songbird-rpc
number: "192"
title: Fastest free Songbird RPC, live no-key endpoint latency
seo_title: "Fastest free Songbird RPC 2026"
seo_description: "{{best_name}} leads free Songbird RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). {{count}} no-key endpoints measured, updated every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Songbird EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Songbird (chain 19, SGB) is Flare Network's canary network, a production EVM-compatible chain used to test and validate Flare's FTSO oracle system before mainnet deployment. One keyless endpoint is probed continuously: the official Songbird gateway (songbird-api.flare.network/ext/C/rpc). The FTSO AU community node (songbird.rpc.ftso.au) was removed after DNS went dead.

abstract: |
  Songbird: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:flare-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against the no-key public Songbird endpoint that sustains continuous probing ({{count}} provider: Flare Foundation official), every 60 seconds, from us-east, eu-west and Singapore. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Songbird-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Songbird-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"songbird\"`. Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. FTSO AU removed after DNS went dead."

faq:
  - q: "What is the fastest free Songbird RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber` p50 over the last 24h), measured against {{count}} no-key providers probed every 60 seconds from us-east, eu-west and Singapore."
  - q: "Which Songbird RPCs work without an API key?"
    a: "{{count}} endpoint sustains continuous keyless probing: Flare Foundation official (songbird-api.flare.network/ext/C/rpc). The FTSO AU community node was removed after its DNS went dead."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="songbird"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: flare-official
    name: Flare Foundation
    endpoint: https://songbird-api.flare.network/ext/C/rpc
    tag: Flare Foundation official Songbird public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions to the Flare Foundation's no-key Songbird endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="flare-official", chain="songbird"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="flare-official", chain="songbird"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="flare-official", chain="songbird"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="flare-official", chain="songbird"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="flare-official", chain="songbird"}) / sum(ocb:rpc_call:rate_24h{provider="flare-official", chain="songbird"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="flare-official", chain="songbird"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="flare-official", chain="songbird"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="flare-official", chain="songbird", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="flare-official", chain="songbird", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="flare-official", chain="songbird", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="flare-official", chain="songbird", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="flare-official", chain="songbird", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="flare-official", chain="songbird", region="sgp"}[1h])

