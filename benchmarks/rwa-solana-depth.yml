  - slug: usdy
    name: USDY
    tag: "Ondo, tokenized treasury dollar, quoted at size on Manifest"
    formula: "24h median of the cost of selling $100,000 of USDY on Jupiter relative to a $100 sale on the same tick, in bps."
    queries:
      p50: quantile_over_time(0.50, rwa_depth_cost_100k_bps{asset="usdy"}[24h])
      p90: quantile_over_time(0.90, rwa_depth_cost_100k_bps{asset="usdy"}[24h])
      p99: quantile_over_time(0.99, rwa_depth_cost_100k_bps{asset="usdy"}[24h])
      mean: avg_over_time(rwa_depth_cost_100k_bps{asset="usdy"}[24h])
      success: (avg_over_time(rwa_depth_route_ok{asset="usdy"}[24h]) or on() vector(0))
