# OpenChainBench. Bench № 145

slug: filecoin-rpc
number: "145"
title: Fastest free Filecoin RPC, live no-key FEVM endpoint latency
seo_title: "Fastest free Filecoin RPC 2026"
seo_description: "{{best_name}} leads free Filecoin RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). 3 no-key providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Filecoin FEVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Filecoin's EVM-compatible runtime (FEVM, chain 314) makes the storage network directly addressable via standard Ethereum tooling. Glif's public node (`api.node.glif.io/rpc/v1`) is the canonical keyless entry point operated by Glif.io, with dRPC and Ankr providing multi-cloud alternatives. Every provider is live-verified with consecutive keyless probes before inclusion.

abstract: |
  Per-chain member of the RPC latency cluster, extended to Filecoin EVM.
  We measure the round-trip latency of a single, identical RPC call
  (`eth_getBlockByNumber`) against every no-key public Filecoin FEVM endpoint
  that sustains continuous probing, 3 providers at launch,
  every 60 seconds, from us-east, eu-west and Singapore. The harness
  classifies every response (ok / http_err / jsonrpc_err / stale /
  timeout) so the leaderboard rewards sustained availability rather than
  fast error messages. The cross-chain view lives on the parent
  `rpc-capabilities` benchmark; this page is the Filecoin-scoped answer
  with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms → 10 s), so percentiles are computed via Prometheus `quantile_over_time` over the last 24 hours."
  - "Call-result classification: `ok` (HTTP 200 + non-empty result), `http_err`, `jsonrpc_err` (HTTP 200 carrying an error body), `stale` (more than 20 blocks behind the cross-provider tip), `timeout`."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities) benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to `chain=\"filecoin\"`. Provider coverage at launch: 3 no-key endpoints (Glif, dRPC, Ankr)."

findings:
  - "{{best_name}} currently leads free Filecoin RPC at {{best_p50}} (`eth_getBlockByNumber` p50, 24h) across 3 measured providers."

faq:
  - q: "What is the fastest free Filecoin RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber` p50 over the last 24h), measured against 3 no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Filecoin RPCs work without an API key?"
    a: "3 endpoints sustain continuous keyless probing at launch: Glif, dRPC, Ankr. Every listed endpoint was live-verified before inclusion."
  - q: "Does the fastest Filecoin RPC change by region?"
    a: "Often. The region tabs at the top of the page re-scope every number to a single origin; pick the one closest to where your requests originate."
  - q: "How is Filecoin RPC latency measured here?"
    a: "One identical JSON-RPC POST (`eth_getBlockByNumber`) every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Responses are classified so an endpoint stuck on an old head or returning errors is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="filecoin"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: glif
    name: Glif
    tag: Filecoin community node, primary keyless FEVM endpoint
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Glif's no-key Filecoin endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="glif", chain="filecoin"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="glif", chain="filecoin"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="glif", chain="filecoin"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="glif", chain="filecoin"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="glif", chain="filecoin"}) / sum(ocb:rpc_call:rate_24h{provider="glif", chain="filecoin"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="glif", chain="filecoin"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="glif", chain="filecoin"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="glif", chain="filecoin", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="glif", chain="filecoin", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="glif", chain="filecoin", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="glif", chain="filecoin", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="glif", chain="filecoin", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="glif", chain="filecoin", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    tag: Decentralized RPC mesh, consensus-checked
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to dRPC's no-key Filecoin endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="filecoin"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="filecoin"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="filecoin"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="filecoin"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="filecoin"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="filecoin"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="filecoin"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="filecoin"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="filecoin", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="filecoin", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="filecoin", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="filecoin", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="filecoin", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="filecoin", region="sgp"}[1h])

  - slug: ankr
    name: Ankr
    tag: Multi-cloud RPC network, 40+ chains, keyless tier
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Ankr's no-key Filecoin endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ankr", chain="filecoin"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="ankr", chain="filecoin"})
