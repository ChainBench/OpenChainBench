# OpenChainBench. Bench № 267

slug: trading-app-daily-volume
number: "267"
title: "Trading app daily volume: GMGN, Axiom, Fomo, Terminal, Photon, Trojan by UTC day"
seo_title: "Trading app daily volume 2026: GMGN vs Axiom vs Fomo vs Terminal"
seo_description: "{{best_name}} leads trading apps with {{best_p50}} routed in a UTC day. Eight apps ranked with market share, chain reach and how long each has been running."
subtitle: Routed volume per trading app for one complete UTC day, with each app's share of the cohort, how many chains it reaches and how long it has been running.

category: Trading
status: live
metric: Daily volume
unit: usd
higher_is_better: true
row_noun: { one: app, many: apps }
ledger_reliability: false

disclaimer: |
  Routed volume for one complete UTC day, from the public tehcscreener API, which is Allium-backed. Six apps left this cohort on 2026-10-07 because the source does not cover them: BonkBot, Banana Gun, Bloom, Sol Trading Bot, PepeBoost and o1.exchange. An app that cannot be measured is removed rather than published as zero.

seo_intro: |
  The trading app market is more concentrated than its number of names
  suggests: the top two route more than the other six together, and the gap
  between the largest and the smallest is more than two orders of magnitude.
  This page ranks eight apps by what each routed in a complete UTC day, with
  the share of the cohort that represents, the number of chains it reaches and
  how long it has been running.

abstract: |
  The harness reads the tehcscreener /bots endpoint and publishes routed volume
  per app per chain, summed over 1, 7 and 30 days, with each app's share of the
  cohort over the same windows, its chain reach and the days between its first
  day in the source and its latest.

  This bench read DeFiLlama until 2026-10-07 and covered fourteen apps. It now
  reads tehcscreener, the single source behind the /trading-apps hub, which
  covers eight of those fourteen. The six it does not cover were removed.

methodology:
  - "Source: the public tehcscreener API (https://tehcscreener.com/api), Allium-backed, no key, synced once a day. The single source behind every bench on the /trading-apps hub."
  - "Cohort change on 2026-10-07: BonkBot, Banana Gun, Bloom, Sol Trading Bot, PepeBoost and o1.exchange were removed because this source does not cover them. A row that cannot be measured is removed, not published as zero, because a zero would rank it last on a figure nobody took."
  - "Share: this app's volume over the cohort's total for the same window and chain. It is a share of the eight measured here, not of the whole market, and it moved when the cohort shrank."
  - "Chains: how many chains the app routed measurable volume on during the latest day. Reach, not quality."
  - "Days of history: between the app's first day in the source and its latest. A proxy for how long it has been running, bounded by when the source began tracking it."
  - "Single source by decision, and not cross-checked. On 2026-10-07 this source read pump.fun 2.2x above DeFiLlama on app volume while agreeing with DeFiLlama within 30% on six other platforms."
  - "Windows are sums over days, never averages of daily figures."

findings:
  - "{{best_name}} leads trading apps with {{best_p50}} routed in a UTC day."
  - "Share is of the eight apps measured here, not of the market. It rose for everyone on 2026-10-07 when six uncovered apps left the cohort, without anyone routing more."
  - "Chain reach and volume rank differently: the widest app by chains is not the largest by volume."
  - "Six apps left this page rather than being shown at zero. The source does not cover them, and a zero would have ranked them last on a figure nobody measured."

source: https://github.com/ChainBench/OpenChainBench/tree/dev/harnesses/terminal-activity

prometheus:
  window: 24h
  url: https://prom.openchainbench.com
  expected_freshness_seconds: 172800
  freshness_timestamp_metric: terminal_activity_last_success_unix

dimension_labels:
  chain: Chain

dimensions:
  chain:
    - { value: all,       label: All chains }
    - { value: solana,    label: Solana }
    - { value: bnb,       label: BNB Chain }
    - { value: robinhood, label: Robinhood Chain }
    - { value: base,      label: Base }
    - { value: arc,       label: Arc }
    - { value: ethereum,  label: Ethereum }
    - { value: hyperevm,  label: HyperEVM }

ledger_columns:
  - { label: "Volume", slot: p50, unit: usd, windows: { 7d: vol_7d, 30d: vol_30d } }
  - { label: "Share", panel: share_1d, unit: pct, windows: { 7d: share_7d, 30d: share_30d } }
  - { label: "Chains", panel: chains, unit: count }
  - { label: "Days of history", panel: history_days, unit: count }

metric_panels:
  - id: vol_7d
    label: Volume 7d
    description: Routed volume summed over the last seven days.
    metric: terminal_window_volume_usd{chain="all",window="7d"}
    label_key: platform
    unit: usd
    higher_is_better: true
  - id: vol_30d
    label: Volume 30d
    description: Routed volume summed over the last thirty days.
    metric: terminal_window_volume_usd{chain="all",window="30d"}
    label_key: platform
    unit: usd
    higher_is_better: true
  - id: share_1d
    label: Share
    description: This app's share of the eight measured here, for the day.
    metric: terminal_window_share_pct{chain="all",window="1d"}
    label_key: platform
    unit: pct
    higher_is_better: true
  - id: share_7d
    label: Share 7d
    description: Share of the cohort over seven days.
    metric: terminal_window_share_pct{chain="all",window="7d"}
    label_key: platform
    unit: pct
    higher_is_better: true
  - id: share_30d
    label: Share 30d
    description: Share of the cohort over thirty days.
    metric: terminal_window_share_pct{chain="all",window="30d"}
    label_key: platform
    unit: pct
    higher_is_better: true
  - id: chains
    label: Chains reached
    description: Chains the app routed measurable volume on during the latest complete day.
    metric: terminal_chain_breadth
    label_key: platform
    unit: count
    higher_is_better: true
  - id: history_days
    label: Days of history
    description: Days between the app's first day in the source and its latest. Bounded by when the source began tracking it.
    metric: terminal_history_days
    label_key: platform
    unit: count
    higher_is_better: true

faq:
  - q: "Why did six apps disappear?"
    a: "BonkBot, Banana Gun, Bloom, Sol Trading Bot, PepeBoost and o1.exchange are not covered by the source this page now reads. They were removed rather than left in the table at zero, which would have ranked them last on a figure nobody measured."
  - q: "Is Share a share of the whole market?"
    a: "No. It is a share of the eight apps on this page. It rose for every remaining app on 2026-10-07 when the cohort shrank, without any of them routing more."
  - q: "What does Days of history mean?"
    a: "The days between the app's first day in the source and its latest. It is a floor on how long the app has existed, not a measurement of it: an app older than the source's coverage reads as the coverage."

providers:
  - slug: fomo
    name: Fomo
    queries:
      p50: max(terminal_window_volume_usd{platform="fomo",chain="all",window="1d"})
      p90: max(terminal_window_volume_usd{platform="fomo",chain="all",window="1d"})
      p99: max(terminal_window_volume_usd{platform="fomo",chain="all",window="1d"})
      success: max(terminal_activity_health{platform="fomo",chain="all"})
      sample_size: max(terminal_window_txns{platform="fomo",chain="all",window="1d"})
      series: max by (platform) (terminal_window_volume_usd{platform="fomo",chain="all",window="1d"})

