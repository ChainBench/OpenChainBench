# OpenChainBench. Bench No 226

slug: wax-rpc
number: "226"
title: "WAX RPC endpoints: free public URLs ranked by latency"
seo_title: "WAX RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free WAX RPC at {{best_p50}} (get_info head_block_num p50, 24h). URLs for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for GET /v1/chain/get_info against every available public WAX (Antelope) node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  WAX (Worldwide Asset eXchange) is a delegated proof-of-stake blockchain built on the Antelope protocol, specialising in NFTs and gaming assets. It produces one block every 0.5 seconds and operates the same /v1/chain/get_info REST endpoint as EOS. Public endpoints are available without an API key from Greymass, EOSUSA and WAX Sweden. Every provider was live-verified with consecutive get_info probes at launch.

abstract: |
  WAX: {{count}} free public RPC endpoints answering `the chain's head call` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single REST call (GET /v1/chain/get_info) against every available public WAX node that sustains continuous probing: {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a WAX-scaled staleness gap (600 blocks, around 5 min at 0.5 s/block). The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the WAX-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: HTTP GET /v1/chain/get_info. Plain REST call. The response carries head_block_num as a plain integer."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the WAX-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=wax. Provider coverage at launch: {{count}} endpoints (Greymass, EOSUSA, WAX Sweden)."

faq:
  - q: "Which WAX RPC endpoints work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today: Greymass (wax.greymass.com), EOSUSA (wax.eosusa.io) and WAX Sweden (api.waxsweden.org). Every listed endpoint was live-verified with a get_info call returning a parsable head_block_num before inclusion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="wax"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: greymass
    name: Greymass
    endpoint: https://wax.greymass.com
    tag: Greymass public WAX Antelope API, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /v1/chain/get_info sent every 60s from 3 regions to wax.greymass.com."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="greymass", chain="wax"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="greymass", chain="wax"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="greymass", chain="wax"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="greymass", chain="wax"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="greymass", chain="wax"}) / sum(ocb:rpc_call:rate_24h{provider="greymass", chain="wax"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="greymass", chain="wax"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="greymass", chain="wax"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="greymass", chain="wax", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="greymass", chain="wax", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="greymass", chain="wax", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="greymass", chain="wax", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="greymass", chain="wax", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="greymass", chain="wax", region="sgp"}[1h])

