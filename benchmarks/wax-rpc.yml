    name: EOSUSA
    endpoint: https://wax.eosusa.io
    tag: EOSUSA public WAX Antelope API, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /v1/chain/get_info sent every 60s from 3 regions to wax.eosusa.io."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="eosusa", chain="wax"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="eosusa", chain="wax"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="eosusa", chain="wax"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="eosusa", chain="wax"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="eosusa", chain="wax"}) / sum(ocb:rpc_call:rate_24h{provider="eosusa", chain="wax"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="eosusa", chain="wax"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="eosusa", chain="wax"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="eosusa", chain="wax", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="eosusa", chain="wax", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="eosusa", chain="wax", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="eosusa", chain="wax", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="eosusa", chain="wax", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="eosusa", chain="wax", region="sgp"}[1h])

  - slug: waxsweden
    name: WAX Sweden
    endpoint: https://api.waxsweden.org
    tag: WAX Sweden public Antelope API, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /v1/chain/get_info sent every 60s from 3 regions to api.waxsweden.org."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="waxsweden", chain="wax"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="waxsweden", chain="wax"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="waxsweden", chain="wax"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="waxsweden", chain="wax"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="waxsweden", chain="wax"}) / sum(ocb:rpc_call:rate_24h{provider="waxsweden", chain="wax"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="waxsweden", chain="wax"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="waxsweden", chain="wax"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="waxsweden", chain="wax", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="waxsweden", chain="wax", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="waxsweden", chain="wax", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="waxsweden", chain="wax", region="eu-west"}[1h])
        - region: ap-southeast
