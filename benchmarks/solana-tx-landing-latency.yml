prometheus:
  window: 7d

# Real metrics emitted by the active prober in solana-tx-landing harness:
#   solana_landing_probe_success_total{service, mode, region}              counter
#   solana_landing_probe_dropped_total{service, mode, region, reason}      counter
#   solana_landing_probe_latency_slots_histogram{service, mode, region}    histogram
#   solana_landing_probe_latency_ms_histogram{service, mode, region}       histogram
#   solana_landing_probe_keypair_balance_sol{region}                       gauge
#   solana_landing_probe_cycle_total{region}                               counter
#   solana_landing_probe_enabled{region}                                   gauge
#
# Headline metric = p50 ms time-to-land. lower_is_better.
# Mode label is `swqos_only` for helius-sender, `default` for the rest.

providers:
  - slug: jito
    name: Jito Block Engine
    tag: Baseline + control probe; atomic bundles + tip auction since 2022
    queries:
      p50: histogram_quantile(0.5, sum by (le)(rate(solana_landing_probe_latency_ms_histogram_bucket{service="jito",region="us-east"}[7d])))
      p90: histogram_quantile(0.9, sum by (le)(rate(solana_landing_probe_latency_ms_histogram_bucket{service="jito",region="us-east"}[7d])))
      p99: histogram_quantile(0.99, sum by (le)(rate(solana_landing_probe_latency_ms_histogram_bucket{service="jito",region="us-east"}[7d])))
      mean: avg_over_time(solana_landing_probe_latency_ms{service="jito",region="us-east"}[7d])
      success: sum(rate(solana_landing_probe_success_total{service="jito",region="us-east"}[7d])) / (sum(rate(solana_landing_probe_success_total{service="jito",region="us-east"}[7d])) + sum(rate(solana_landing_probe_dropped_total{service="jito",region="us-east",reason="timeout"}[7d])))
      sample_size: sum(increase(solana_landing_probe_success_total{service="jito",region="us-east"}[7d]))
      series: histogram_quantile(0.5, sum by (le)(rate(solana_landing_probe_latency_ms_histogram_bucket{service="jito",region="us-east"}[1h])))

  - slug: helius-sender
    name: Helius Sender (swqos_only)
    tag: Isolated Helius own-path (no Jito fan-out); anycast + 7 POPs
    queries:
      p50: histogram_quantile(0.5, sum by (le)(rate(solana_landing_probe_latency_ms_histogram_bucket{service="helius-sender",mode="swqos_only",region="us-east"}[7d])))
      p90: histogram_quantile(0.9, sum by (le)(rate(solana_landing_probe_latency_ms_histogram_bucket{service="helius-sender",mode="swqos_only",region="us-east"}[7d])))
      p99: histogram_quantile(0.99, sum by (le)(rate(solana_landing_probe_latency_ms_histogram_bucket{service="helius-sender",mode="swqos_only",region="us-east"}[7d])))
      mean: avg_over_time(solana_landing_probe_latency_ms{service="helius-sender",mode="swqos_only",region="us-east"}[7d])
      success: sum(rate(solana_landing_probe_success_total{service="helius-sender",mode="swqos_only",region="us-east"}[7d])) / (sum(rate(solana_landing_probe_success_total{service="helius-sender",mode="swqos_only",region="us-east"}[7d])) + sum(rate(solana_landing_probe_dropped_total{service="helius-sender",mode="swqos_only",region="us-east",reason="timeout"}[7d])))
      sample_size: sum(increase(solana_landing_probe_success_total{service="helius-sender",mode="swqos_only",region="us-east"}[7d]))
      series: histogram_quantile(0.5, sum by (le)(rate(solana_landing_probe_latency_ms_histogram_bucket{service="helius-sender",mode="swqos_only",region="us-east"}[1h])))

  - slug: astralane
