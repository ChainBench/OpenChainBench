prometheus:
  window: 7d
  expected_freshness_seconds: 7200

# Real metrics emitted by the active prober in solana-tx-landing harness:
#   solana_landing_probe_success_total{service, mode, region}              counter
#   solana_landing_probe_dropped_total{service, mode, region, reason}      counter
#   solana_landing_probe_latency_ms{service, mode, region}                 gauge (set every cycle)
#   solana_landing_probe_latency_slots{service, mode, region}              gauge (set every cycle)
#   solana_landing_probe_latency_slots_histogram{service, mode, region}    histogram (debug)
#   solana_landing_probe_latency_ms_histogram{service, mode, region}       histogram (debug)
#   solana_landing_probe_keypair_balance_sol{region}                       gauge
#   solana_landing_probe_cycle_total{region}                               counter
#   solana_landing_probe_enabled{region}                                   gauge
#
# Headline metric (canonical) = slot_p50 / slot_p99 read from the gauge.
# Wall-clock ms is published alongside via the standard p50/p90/p99 fields
# for reader intuition but is derived (slot_delta × ~400 ms + RTT + variance).
# Mode label is `swqos_only` for helius-sender, `default` for the rest.
#
# Why quantile_over_time(gauge) instead of histogram_quantile(histogram)?
# At V0-Lean cadence (1 probe / hour) we have ~168 samples per cell over 7d.
# Histogram buckets {100, 250, 500, 1000, 2000, 5000, 10000, 30000, 60000} ms
# have ~3 buckets in the 1-5s zone where probes actually land, so
# histogram_quantile collapses to bucket midpoints (1500, 3500 ms) and the
# series looks flat. quantile_over_time on the gauge takes the real sample
# at the 50th percentile, which is the accurate published number.

providers:
  - slug: jito
    name: Jito
    tag: Baseline + control probe; atomic bundles + tip auction since 2022
    formula: "50th percentile over 7d of slot delta (land_slot − submit_slot) for hourly signed mainnet probes submitted to Jito's `ny.mainnet.block-engine.jito.wtf` from us-east."
    queries:
      p50: quantile_over_time(0.5, solana_landing_probe_latency_slots{service="jito",region="us-east"}[7d])
      p90: quantile_over_time(0.9, solana_landing_probe_latency_slots{service="jito",region="us-east"}[7d])
      p99: quantile_over_time(0.99, solana_landing_probe_latency_slots{service="jito",region="us-east"}[7d])
      mean: avg_over_time(solana_landing_probe_latency_slots{service="jito",region="us-east"}[7d])
      success: sum(rate(solana_landing_probe_success_total{service="jito",region="us-east"}[7d])) / (sum(rate(solana_landing_probe_success_total{service="jito",region="us-east"}[7d])) + sum(rate(solana_landing_probe_dropped_total{service="jito",region="us-east",reason="timeout"}[7d])))
      sample_size: sum(increase(solana_landing_probe_success_total{service="jito",region="us-east"}[7d]))
      series: solana_landing_probe_latency_slots{service="jito",region="us-east"}

  - slug: helius-sender
    name: Helius
    tag: Isolated Helius own-path (no Jito fan-out); anycast + 7 POPs
    formula: "50th percentile over 7d of slot delta (land_slot − submit_slot) for hourly signed probes submitted to Helius Sender in `swqos_only=true` mode from us-east, isolating its own-path."
    queries:
      p50: quantile_over_time(0.5, solana_landing_probe_latency_slots{service="helius-sender",mode="swqos_only",region="us-east"}[7d])
