# OpenChainBench. Bench № 081

slug: ws-head-latency-ethereum
number: "081"
title: Fastest Ethereum WebSocket newHeads push, live block-push lag across RPC providers
seo_title: "Fastest Ethereum WebSocket RPC newHeads push 2026"
seo_description: "{{best_name}} pushes the most Ethereum newHeads first over WebSocket, {{best_p50}} of the blocks it received (24h), among PublicNode, dRPC, Tenderly and OnFinality."
subtitle: Share of Ethereum blocks each keyless provider pushed first over WebSocket, raced per region from us-east, eu-west and Singapore.

category: RPCs
status: live
metric: First to push
unit: pct
higher_is_better: true
# A provider that never wins a race reads 0%, a result, not a missing value.
zero_is_a_value: true

seo_intro: |
  Every trading bot, MEV searcher, liquidation keeper and live dashboard
  that subscribes to `eth_subscribe("newHeads")` cares about one thing
  first: which provider hands it block N before the others. Marketing
  pages say "real-time WebSocket streaming"; this page counts who
  actually delivers first.

  The harness holds one persistent WebSocket per provider in each of
  three regions (us-east, eu-west, Singapore), timestamps every newHeads
  frame on receipt, and credits each Ethereum block to the provider that
  delivered it earliest in that region. The headline is each provider's
  share of first arrivals among the blocks it received. {{best_name}}
  currently leads, first on {{best_p50}} of the blocks it received (24
  h), across {{count}} measured providers.

abstract: |
  Keyless WebSocket endpoints raced on Ethereum block delivery. One
  harness holds a persistent `eth_subscribe("newHeads")` connection per
  provider in each of three regions and timestamps every push on
  receipt. Per block, the earliest arrival in that region wins; each
  provider's figure is the share of the blocks it received that it
  delivered first, pooled over 24 hours. A provider at 0% received the
  blocks and was never first.

methodology:
  - "Providers measured (keyless WebSocket endpoints): PublicNode (wss://ethereum-rpc.publicnode.com), dRPC (wss://eth.drpc.org), Tenderly (wss://mainnet.gateway.tenderly.co), Onfinality (wss://eth.api.onfinality.io/public-ws). Keyed providers (Alchemy, Infura, Chainstack, Quicknode) join the cohort when contributor keys are wired via WS_URL_<PROVIDER>_ETHEREUM env vars; the harness skips them cleanly when unset."
  - "Cohort saturation: Ankr, Blast, LlamaRPC, BlockPI, 1RPC, NodeReal and Omniatech all reject a keyless WebSocket handshake at the time of ship (verified 2026-07), which is why the keyless tier stops at four (PublicNode, dRPC, Tenderly, Onfinality)."
  - "Race scoring: the first provider to deliver block N in a region wins it. The published figure is each provider's share of first arrivals among the blocks it received, pooled over 24 hours, so a provider raced from fewer regions is not diluted by the others. A block's cohort closes 5 seconds after the first arrival; a provider arriving later is scored as a missed block (ws_block_gap_total)."
  - "Chains: Ethereum (headline, all four providers compete), Base via newHeads and Solana via slotSubscribe as secondary cohorts. Headline queries on this page are pinned to chain=ethereum so the ranking never mixes block cadences."
  - "Blocks where only one provider delivered within the window emit no lag samples and no win: a one-horse race carries no relative information. Gap counters still increment for live providers that missed the block."
  - "Connection discipline: one persistent WebSocket per (provider, chain), client ping every 30s, read deadline 60s, plus a 90s head watchdog that forces a reconnect when a provider keeps the socket heartbeat alive but silently drops the subscription (a failure mode we have observed in production on other benches). Reconnects use exponential backoff 2s to 60s and are counted in ws_reconnects_total."
  - "Cheat vector disclosure: a provider could theoretically pre-announce heads it has not fully validated to win the race. We keyed the cohort on block number as pushed; hash-level cross-checking against a reference node is on the v2 list. Reading win rate together with the gap counter already flags a provider that pushes early but wrong (retracted heads show up as cohort inconsistencies and reorg noise)."
  - "Why a share and not a lag: a single vantage point cannot separate its own network path from a provider's push pipeline, so the race compares arrivals over the same path. The winner's lag is zero by construction and a median lag mostly measures how often a provider wins; the share of first arrivals states it directly."
  - "Coverage: ws_head_blocks_seen_total per provider divided by the cohort maximum over the same 24h window, clamped to 1. A provider that wins the races it runs but skips blocks loses on this column."
  - "Regions: one harness per region (us-east, eu-west, Singapore), each block raced within its region. Geography moves absolute arrival times for every provider over the same path; a provider whose nearest edge is far from a region is disadvantaged there, which is why each region has its own tab."

findings:
  - "{{best_name}} leads the Ethereum cohort, first on {{best_p50}} of the blocks it received (24 h), across {{count}} measured keyless providers."
  - "{{worst_name}} wins the fewest races, at {{worst_p50}}. A provider that rarely pushes first hands a liquidation bot or MEV searcher block N after a faster feed already delivered it."
  - "Win rate and block coverage are the robust readings together. A provider can win the races it runs while silently skipping blocks; the coverage column (blocks seen against the cohort maximum) and ws_block_gap_total keep that visible."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/ws-head-latency

expected_n: 7000

prometheus:
  window: 24h
  freshness_metric: ws_head_blocks_seen_total

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on provider and region.
rank_matrix_query: 100 * sum by (provider, region) (increase(ws_head_wins_total{chain="ethereum"}[24h])) / sum by (provider, region) (increase(ws_head_blocks_seen_total{chain="ethereum"}[24h]))

# Region is the only dimension: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

faq:
  - q: "Which RPC provider pushes new Ethereum blocks first over WebSocket?"
    a: "{{best_name}} currently wins the largest share of per-block races, first on {{best_p50}} of the blocks it received (24 h) across {{count}} measured keyless providers. The leaderboard re-scores on every Ethereum block, roughly every 12 seconds, so the answer reflects sustained live measurement, not a one-off test. Check coverage too before wiring a latency-sensitive bot to any single provider."
  - q: "Why a share of wins rather than a lag in milliseconds?"
    a: "Because the race is relative. The earliest arrival starts the clock for each block, so the winner's lag is zero by construction and a median lag mostly says how often a provider wins. The share of first arrivals says it directly, read per provider over the blocks it received."
  - q: "Could a provider cheat by pushing heads before validating them?"
    a: "In principle yes: pre-announcing an unvalidated head wins the race at the cost of occasionally pushing a block that gets reorged or retracted. That is why the bench exports more than the share of wins. A provider that pushes early but wrong shows up as cohort inconsistencies, elevated reorg noise and gaps, and the coverage column (blocks seen versus the cohort maximum) penalises skipped or retracted blocks. Hash-level cross-checking against an independent reference node is planned for v2 of the harness."
  - q: "How is the WebSocket push race measured on OpenChainBench?"
    a: "One Go harness per region holds a persistent `eth_subscribe(\"newHeads\")` WebSocket per provider. Every notification is timestamped on receipt, keyed on block number and deduplicated. Each block is a race within its region: the earliest arrival wins. The cohort closes 5 seconds after the first arrival, and each provider's share of first arrivals is computed over 24 hours."
  - q: "Why are only PublicNode, dRPC and Tenderly listed?"
    a: "V1 measures the keyless tier: endpoints anyone can open a WebSocket to without an account, which is also the tier where claims are hardest to verify and marketing is loudest. Alchemy, Infura and Chainstack require API keys; the harness already accepts them via environment variables and they join the leaderboard once contributor keys are wired into the deployment. Keyed tiers usually run on better-provisioned infrastructure, so the keyed race lives on the private WebSocket pages, ethereum-rpc-ws and its siblings."

providers:
  - slug: publicnode
    name: PublicNode
    tag: Keyless WS, wss://ethereum-rpc.publicnode.com
    formula: "Share of the Ethereum blocks this provider pushed over `eth_subscribe(newHeads)` that it delivered first in its region, from one persistent WebSocket per provider per region, pooled over 24h."
    queries:
      p50: 100 * sum(increase(ws_head_wins_total{provider="publicnode", chain="ethereum"}[24h])) / sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="ethereum"}[24h]))
      success: clamp_max(sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="ethereum"}[24h])) / max(sum by (provider) (increase(ws_head_blocks_seen_total{chain="ethereum"}[24h]))), 1)
      sample_size: sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="ethereum"}[24h]))
      series: 100 * sum(increase(ws_head_wins_total{provider="publicnode", chain="ethereum"}[1h])) / sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="ethereum"}[1h]))
      regions:
        - region: us-east
          p50: 100 * sum(increase(ws_head_wins_total{provider="publicnode", chain="ethereum", region="us-east"}[24h])) / sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="ethereum", region="us-east"}[24h]))
          series: 100 * sum(increase(ws_head_wins_total{provider="publicnode", chain="ethereum", region="us-east"}[1h])) / sum(increase(ws_head_blocks_seen_total{provider="publicnode", chain="ethereum", region="us-east"}[1h]))
