# OpenChainBench. Bench No 292

slug: agoric-rpc
number: "292"
title: "Agoric RPC endpoints: free public URLs by latency"
seo_title: "Agoric RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Agoric RPC at {{best_p50}} (Tendermint status p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for the Tendermint `status` method against every free, no-key public Agoric Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Agoric is a Cosmos SDK chain (agoric-3) running a JavaScript smart-contract environment. It is also this cluster's clearest illustration of why a list of endpoints is not a list of providers: the Cosmos chain registry publishes eleven public RPCs for Agoric and only a handful answered the Tendermint `status` probe on 2026-10-07. The eight that did not were kjnodes, AutoStake, Stakeflow, 0base.vc, w3coins, StakeWithUs, Stake&Relax and Bro_n_Bro. This page ranks the three that work: the Agoric official endpoint (main.rpc.agoric.net), StakeAngle and Polkachu.

abstract: |
  Agoric: {{count}} free public RPC endpoints answering Tendermint status every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:agoric-official}}.
  We measure the round-trip latency of a single Tendermint `status` call against every no-key public Agoric endpoint that sustains continuous probing, {{count}} providers measured, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a Agoric-scaled staleness gap (20 blocks at Agoric's ~6 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Agoric-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"status\",\"params\":[]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the rotating id defeats edge caches that would answer a bare head query without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the exclusion rules follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Agoric-scoped view of the same harness."
  - "Roster: every endpoint here answered a real Tendermint status call without a key on the 2026-10-07 sweep before being added to the probe matrix. An endpoint that needs a key, region-blocks us or rate-limits below the 60-second cadence is excluded rather than listed with an asterisk."
  - "Chain scope: every query on this page is pinned to `chain=\"agoric\"`. Provider coverage: {{count}} no-key endpoints."

faq:
  - q: "Which Agoric RPCs work without an API key?"
    a: "{{declared_count}} endpoints are probed on this chain: Agoric (main.rpc.agoric.net), StakeAngle (agoric-rpc.stakeangle.com), Polkachu (agoric-rpc.polkachu.com). Every listed endpoint was live-verified with a Tendermint status call returning a parsable response before inclusion."
  - q: "How is Agoric RPC latency measured here, technically?"
    a: "One identical Tendermint status call every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest."
  - q: "The Cosmos registry lists eleven Agoric RPCs. Why are only three here?"
    a: "Because eight of them did not answer. The registry is a contributed list and dead entries are rarely pruned, so copying it would publish endpoints that fail on first use. Every row on this page answered a real Tendermint `status` call before inclusion and is re-probed every 60 seconds from three regions; an endpoint that stops answering drops out of the ranking rather than sitting there with a stale number."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="agoric"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: agoric-official
    name: Agoric
    endpoint: https://main.rpc.agoric.net
    tag: Agoric official public Tendermint RPC endpoint
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` call sent every 60s from 3 regions (us-east + eu-west + sgp) to Agoric's no-key agoric RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="agoric-official", chain="agoric"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="agoric-official", chain="agoric"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="agoric-official", chain="agoric"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="agoric-official", chain="agoric"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="agoric-official", chain="agoric"}) / sum(ocb:rpc_call:rate_24h{provider="agoric-official", chain="agoric"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="agoric-official", chain="agoric"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="agoric-official", chain="agoric"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="agoric-official", chain="agoric", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="agoric-official", chain="agoric", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="agoric-official", chain="agoric", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="agoric-official", chain="agoric", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="agoric-official", chain="agoric", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="agoric-official", chain="agoric", region="sgp"}[1h])

