slug: privacy-round-trip
number: "306"
title: Privacy round trip cost, what going into Zcash and back loses
seo_title: "Privacy round trip cost: Zcash and Dash in and out"
seo_description: "{{best_name}} loses the least on a round trip into a privacy asset and back, {{best_p50}} at the measured size. {{declared_count}} rails compared."
subtitle: "Basis points and minutes lost converting a liquid asset into a privacy asset and back out, on non-custodial rails, at three sizes."
category: Bridges
status: live
metric: Round trip cost
unit: bp
row_noun: { one: rail, many: rails }
higher_is_better: false

seo_intro: |
  Nobody holds Zcash to hold Zcash. The question is what it costs to go
  private and come back, and that is two swaps rather than one, so a single
  quote answers half of it. This board chains both legs on the same tick:
  it quotes a liquid asset into the privacy asset, then quotes the amount
  that came out back the other way, and publishes the difference.

  The cost is not what most people expect, and it is not flat in size. The
  fixed outbound fee dominates small trades while pool depth dominates large
  ones, so the cheapest size sits in the middle rather than at either end.
  That is why the size selector exists: a board showing one notional would
  report the shape of its own choice instead of the market's.

abstract: |
  Two chained quotes per tick, per rail, per asset and per size. The first
  leg quotes BTC into the privacy asset; the second quotes the first leg's
  own output back into BTC. The published figure is the basis points that
  did not come back, and the published time is the sum of both legs' quoted
  durations.

  Both legs must answer or nothing is recorded for that size. A half
  measured round trip is worse than a gap because it looks like a cheap one.

  Each rail is sent its own natural asset at roughly the tier's notional,
  because quoting one source asset on both would measure our choice rather
  than the rails. The amounts are fixed in their own units rather than
  re-derived from a price each tick, so the tier name is an approximation and
  the methodology states the exact amount each rail receives.

  Quote-only. The harness holds no key and no wallet and has no signing
  path, so these numbers are what the rails advertise, not fills. A rail that
  quotes better than it settles would read well here, which is the honest
  limit of a quote-based board and the reason the quoted duration is
  published beside the cost rather than instead of it.

methodology:
  - "The two rails do not start from the same asset, because forcing one on both would mean quoting a pair one of them serves badly. The size tier is the shared axis and each rail sends its own: Maya sends 0.001, 0.01 and 0.1 BTC, NEAR Intents sends 100, 1,000 and 10,000 USDC on Base. The published figure is basis points of round-trip loss, which is unit-free and therefore comparable across both."
  - "The All sizes tab is the median of the tiers measured on the same tick, not a fourth size and not an average: it is the one summary that does not privilege a trade size. Nothing is pooled from fewer than two tiers."
  - "A tier label is an approximation. The BTC amounts are fixed in BTC rather than re-derived from a price each tick, so the dollar value of Maya's rungs drifts with the BTC price while the tier name does not. The exact amounts are above and in the harness."
  - "Time is the sum of the two legs' own quoted durations, which is what each rail says the swap will take, not a measured settlement."
  - "A negative round trip is counted and not published. It means the two pool prices disagree in the user's favour on that tick, which is a real reading but not a cost."
  - "Rails are included only when their asset list, read from the venue itself, actually carries the asset. Chainflip is absent because it carries no privacy asset: its own endpoint refuses ZEC, XMR and DASH while quoting Solana and Bitcoin normally, so the absence is measured rather than assumed."
  - "THORChain is absent because it was unreachable on twelve public hosts, including one whose TLS certificate expired on 2024-02-07. It is a gap in our access, not a judgement of the venue, and it will be added when a live endpoint exists."

findings:
  - "{{best_name}} loses the least at the selected size, {{best_p50}}, while {{worst_name}} loses {{worst_p50}}. The leader is not the same at every size: a rail with a thin pool can win on a small trade and lose badly on a large one, so the tab you pick changes the answer rather than just the numbers."
  - "Cost is not monotonic in size. On the rails measured here the middle rung is the cheapest: a fixed withdrawal fee is most of the cost on a small trade and almost none of it on a large one, while depth works the other way. Read the size you actually trade."
  - "The pool depth behind each figure is published beside it. A cost of a few hundred basis points on a pool of a couple of thousand coins is a statement about liquidity, not about the venue's pricing engine."

faq:
  - q: "What does it cost to convert Bitcoin into Zcash and back?"
    a: "At the selected size {{best_name}} is the cheapest round trip at {{best_p50}} and {{worst_name}} the most expensive at {{worst_p50}}, both as 24 hour medians of chained quotes. Pick the size you actually trade before reading the order: the ranking is not stable across the tiers, because a fixed withdrawal fee dominates a small trade while pool depth dominates a large one, and the two work in opposite directions."
  - q: "Why measure a round trip instead of one swap?"
    a: "Because almost nobody wants to end up holding the privacy asset permanently. A one way quote tells you the entry price and says nothing about whether you can leave, and on a thin pool the exit is where the cost lives. Chaining the legs also removes the market's drift from the number: both quotes are taken on the same tick, so what is left is the round trip's own friction."
  - q: "Is a quoted cost the same as what I would actually pay?"
    a: "No, and the difference matters. These are quotes, not settled swaps: the harness has no wallet and signs nothing. A rail that quotes better than it settles would look good here. The quoted duration is published next to the cost for that reason, so a rail promising a fast cheap swap can at least be held to its own estimate."
  - q: "Which rails are missing and why?"
    a: "Chainflip carries no privacy asset at all, confirmed against its own endpoint while control requests for Solana and Bitcoin succeed. THORChain was unreachable on twelve public hosts when this board was built. Monero is absent from every quoting rail measured, so it is covered separately rather than forced into this comparison."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/privacy-rails

prometheus:
  window: 24h
  freshness_timestamp_metric: privacy_last_success_timestamp_seconds
  expected_freshness_seconds: 1800

dimensions:
  bucket:
    - { value: all, label: All sizes }
    - { value: usd100, label: About $100 }
    - { value: usd1k, label: About $1k }
    - { value: usd10k, label: About $10k }

metric_panels:
  - id: trip_seconds
    label: Round trip time
    metric: quantile_over_time(0.50, privacy_round_trip_seconds{bucket="all"}[24h])
    label_key: rail
    unit: s
    higher_is_better: false
    description: "Both legs' quoted duration added together, 24h median of the median across the measured sizes."
  - id: pool_depth
    label: Pool depth
    metric: avg_over_time(privacy_pool_depth_asset{}[24h])
    label_key: rail
    unit: count
    higher_is_better: true
    description: "Whole coins on the privacy-asset side of the rail's pool, 24h average. The liquidity the cost came out of."

providers:
  - slug: maya
    name: Maya Protocol
    tag: "No key, carries ZEC and DASH, destination rides in the deposit memo"
    formula: "24h median of the basis points lost on a chained BTC to ZEC to BTC quote at the selected size, from Maya's own quote endpoint."
    queries:
      p50: quantile_over_time(0.50, privacy_round_trip_bps{rail="maya",asset="ZEC.ZEC",bucket="all"}[24h])
      p90: quantile_over_time(0.90, privacy_round_trip_bps{rail="maya",asset="ZEC.ZEC",bucket="all"}[24h])
      p99: quantile_over_time(0.99, privacy_round_trip_bps{rail="maya",asset="ZEC.ZEC",bucket="all"}[24h])
      mean: avg_over_time(privacy_round_trip_bps{rail="maya",asset="ZEC.ZEC",bucket="all"}[24h])
      sample_size: count_over_time(privacy_round_trip_bps{rail="maya",asset="ZEC.ZEC",bucket="all"}[24h])
      series: privacy_round_trip_bps{rail="maya",asset="ZEC.ZEC",bucket="all"}
      success: 100 * sum(rate(privacy_probe_total{rail="maya",probe="round_trip",outcome="ok"}[24h])) / sum(rate(privacy_probe_total{rail="maya",probe="round_trip"}[24h]))

  - slug: near-intents
    name: NEAR Intents
    tag: "No key, carries ZEC, recipient travels in the request body"
    formula: "24h median of the basis points lost on a chained quote into ZEC and back, from the 1Click quote endpoint."
    queries:
      p50: quantile_over_time(0.50, privacy_round_trip_bps{rail="near-intents",asset="ZEC.ZEC",bucket="all"}[24h])
      p90: quantile_over_time(0.90, privacy_round_trip_bps{rail="near-intents",asset="ZEC.ZEC",bucket="all"}[24h])
      p99: quantile_over_time(0.99, privacy_round_trip_bps{rail="near-intents",asset="ZEC.ZEC",bucket="all"}[24h])
      mean: avg_over_time(privacy_round_trip_bps{rail="near-intents",asset="ZEC.ZEC",bucket="all"}[24h])
      sample_size: count_over_time(privacy_round_trip_bps{rail="near-intents",asset="ZEC.ZEC",bucket="all"}[24h])
      series: privacy_round_trip_bps{rail="near-intents",asset="ZEC.ZEC",bucket="all"}
      success: 100 * sum(rate(privacy_probe_total{rail="near-intents",probe="round_trip",outcome="ok"}[24h])) / sum(rate(privacy_probe_total{rail="near-intents",probe="round_trip"}[24h]))
