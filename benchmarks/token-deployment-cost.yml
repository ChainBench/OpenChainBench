# OpenChainBench. Bench № 034

slug: token-deployment-cost
number: "034"
title: Cheapest blockchain to deploy a token, live USD cost across 7 non-EVM L1 chains
seo_title: "Token deployment cost 2026: cheapest chain"
seo_description: "Live USD cost to create a fungible token on 7 non-EVM L1 chains via each chain's canonical method (SPL, Move, TokenFactory, native asset, Stellar 2-account)."
subtitle: "Live USD cost to bring a fungible token into existence on each chain, using that chain's canonical method. 7 non-EVM L1 chains, 5 minute refresh, no transactions broadcast."

seo_intro: |
  This page answers a question every memecoin founder, RWA issuer and non-EVM L1 marketing team asks. How much does it actually cost in dollars to create a token on each non-EVM chain right now. We track 7 non-EVM L1 chains in parallel and refresh the number every 5 minutes. Solana uses the SPL mint plus the Associated Token Account plus the Metaplex metadata account so the comparison is fair against ERC20 which embeds name and symbol natively. Sui and Aptos use Move publish gas budgets. Cardano reads coins_per_utxo_size from koios and applies the Conway minUTxO formula. Stellar uses the canonical issuer plus distribution plus trustline two account flow. Cosmos TokenFactory chains (Osmosis, Injective) read denom_creation_fee from the LCD. Every number is reproducible from source. No transactions are broadcast. EVM chains are excluded from this leaderboard for now while we finalise the canonical OpenZeppelin v5 ERC20 artifact bytecode used in eth_estimateGas.

faq:
  - q: "What does this benchmark measure?"
    a: "The live USD cost to create a fungible token on each of the 7 tracked non-EVM L1 chains, refreshed every 5 minutes, using each chain's canonical and most used method. SPL mint plus ATA plus Metaplex metadata account for Solana, Move publish for Sui and Aptos, TokenFactory MsgCreateDenom for Osmosis and Injective, native asset minting policy for Cardano, two account asset issuance for Stellar."
  - q: "Which chains are tracked?"
    a: "7 non-EVM L1 chains: Solana, Sui, Aptos, Osmosis, Injective, Cardano, Stellar."
  - q: "Why are EVM chains not tracked here?"
    a: "The harness path for EVM chains currently ships a placeholder ERC20 init bytecode to eth_estimateGas, which understates the real deploy cost of the canonical OpenZeppelin v5 ERC20 by roughly 30 to 500x depending on chain. Rather than publish misleading numbers, we removed the EVM leg until we finalise the real OZ v5 artifact and re-enable it in a follow-up."
  - q: "Is the comparison fair across chains?"
    a: "As fair as the underlying chains allow. Token creation means structurally different things in each ecosystem. We do not pretend the numbers are perfectly equivalent. Instead we publish exactly what the canonical and most used method costs in dollars on each chain, plus the formula and inputs for every value so readers can adjust. The methodology field lists the precise method per chain."
  - q: "Why is Osmosis showing near zero?"
    a: "Osmosis TokenFactory has set its denom_creation_fee parameter to an empty list, meaning the only cost is the gas to execute MsgCreateDenom (roughly one tenth of a cent at current gas prices, well below our display precision). We render this as less than zero point zero zero one dollar with a tooltip explaining no protocol level creation fee. Injective by contrast charges a flat zero point one INJ for a tokenfactory denom."
  - q: "Is the Solana number really fair compared to ERC20?"
    a: "Yes. Earlier versions of the benchmark only counted the bare 82 byte mint account rent, which understated the realistic cost by about 2.5 times. The current methodology also includes the 165 byte Associated Token Account for the initial holder and the 679 byte Metaplex Token Metadata account that holds name, symbol and URI. EVM ERC20 deployments embed name and symbol in the contract storage natively, so adding the Solana metadata account is the apples to apples adjustment. A bare mint without metadata would not be discoverable in Phantom, Jupiter or any wallet UI."
  - q: "Why is Cardano always similar?"
    a: "The Cardano min UTxO formula is deterministic. The coins_per_utxo_size protocol parameter is set by governance and moves rarely. A standard native asset bundle (32 byte policy hash plus short asset name) sits around 70 bytes, and the on chain mint transaction fee is a few cents of ADA. The USD figure on the leaderboard moves with ADA price, not with congestion."
  - q: "Can I cite a value from this page?"
    a: "Yes. Every number is a live Prometheus query against the OpenChainBench gateway. The harness source is open at the link in the source field below. Cite the value, the chain and the timestamp at the top of the page."
  - q: "Why publish a live cost when most readers will see a one off snapshot?"
    a: "Because deploying a token is a one off decision and the operator wants the cost at the time of decision, not last quarter's average. The bench is the only public source that publishes this number live with reproducible methodology. Static blog posts go stale within hours when gas prices move."

category: Blockchains
status: live
metric: Token deployment cost USD
unit: usd
higher_is_better: false

abstract: |
  Every 5 minutes the harness asks each of 7 non-EVM L1 chains what it
  would cost right now to create a standard fungible token. For Solana
  it reads rent exemption for the SPL mint, the Associated Token Account
  and the Metaplex metadata account. For Sui and Aptos it uses the
  reference gas price multiplied by a pinned Move publish budget. For
  Cosmos TokenFactory chains (Osmosis, Injective) it reads
  denom_creation_fee from the LCD. For Cardano it reads
  coins_per_utxo_size and applies the Conway min UTxO formula. For
  Stellar it reads base_reserve_in_stroops and base_fee and prices the
  canonical issuer plus distribution plus trustline two account flow.
  No transaction is broadcast on any chain. The 7 numbers are published
  as Prometheus gauges with chain and layer labels. EVM chains are
  excluded pending a canonical OZ v5 ERC20 artifact.

methodology:
  - "Refresh cadence. 5 minutes. One process samples all 7 chains in parallel goroutines and emits Prometheus gauges."
  - "Solana SPL. getMinimumBalanceForRentExemption(82) for the mint + (165) for the Associated Token Account + (679) for the Metaplex Token Metadata account + 5000 lamports per signature. Multiply by SOL USD price. Without the metadata account the headline would understate by ~2.5x."
  - "Sui. suix_getReferenceGasPrice times 5 million MIST gas units for a canonical coin module publish (net of storage rebate). Converted to USD via SUI price."
  - "Aptos. /v1/estimate_gas_price.gas_estimate octas per unit times 150000 gas units for a canonical FA standard publish. Converted to USD via APT price."
  - "Cosmos TokenFactory (Osmosis, Injective). LCD /<chain>/tokenfactory/v1beta1/params.denom_creation_fee. Empty array (Osmosis) means gas only, rendered as less than 0.001 dollar. Injective charges a flat 0.1 INJ."
  - "Cardano. Koios /epoch_params.coins_per_utxo_size. Apply Conway minUTxO formula = (160 byte overhead + 70 byte single asset bundle) × coins_per_utxo_size + 180000 lovelace mint tx fee. Converted to USD via ADA price."
  - "Stellar. Horizon /ledgers.base_reserve_in_stroops and base_fee_in_stroops on the latest ledger. Total cost = 3 base reserves (issuer account + distribution account + trustline on distribution) + 2 base fees (create_account + change_trust). Converted to USD via XLM price."
  - "USD prices. api.mobula.io/api/1/market/multi-data?symbols=SOL,SUI,APT,OSMO,INJ,ADA,XLM polled every 5 minutes."
  - "Failures. Any upstream error increments token_deployment_samples_total{chain,status=error} and leaves the previous gauge value in place."
  - "EVM chains excluded. Ethereum, BNB Chain, Avalanche, Polygon, Arbitrum, Optimism, Base, Blast, Mantle, opBNB, Celo, Scroll and Linea were previously exposed but relied on a placeholder init bytecode that undercounted real ERC20 deploy cost by 30 to 500x. Removed until the canonical OZ v5 artifact is finalised."

findings:
  - "{{best_name}} is the cheapest tracked chain to deploy a token at {{best_p50}} right now."
  - "Osmosis TokenFactory is effectively free (gas only, sub one tenth of a cent). Injective charges a flat 0.1 INJ governance fee."
  - "Solana headline includes the Metaplex metadata account for fair comparison against ERC20 which embeds name and symbol natively. The bare mint cost (no metadata) is roughly 2.5 times lower but produces a token invisible to wallets and DEXs."
  - "Sui canonical coin publish is the most expensive tracked chain on the list, around 0.3 to 0.5 USD, because Move modules are larger than ERC20 bytecode and Sui charges per byte of storage even after the rebate."
  - "Cardano native asset creation is deterministic and stable in ADA terms. The USD figure moves purely with ADA price, not congestion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/token-deployment-cost

prometheus:
  window: 24h

# Real metrics exposed by the token-deployment-cost harness:
#   token_deployment_cost_usd{chain, layer, kind}            gauge (USD)
#   token_deployment_cost_native{chain, layer, kind, unit}   gauge (smallest unit)
#   token_deployment_gas_units{chain, layer, kind}           gauge (gas/compute)
#   token_deployment_native_price_usd{chain}                 gauge (USD per token)
#   token_deployment_sample_duration_seconds{chain}          gauge (seconds)
#   token_deployment_samples_total{chain, status}            counter

providers:
  - slug: solana
    name: Solana
    layer: l1
    tag: SPL mint + ATA + Metaplex metadata
    formula: "rent(82) + rent(165) + rent(679) + 5000 lamports/sig, × SOL USD price."
    queries:
      p50: quantile_over_time(0.50, token_deployment_cost_usd{chain="solana"}[24h])
      p90: quantile_over_time(0.90, token_deployment_cost_usd{chain="solana"}[24h])
      p99: quantile_over_time(0.99, token_deployment_cost_usd{chain="solana"}[24h])
      mean: avg_over_time(token_deployment_cost_usd{chain="solana"}[24h])
      series: token_deployment_cost_usd{chain="solana"}
      sample_size: count_over_time(token_deployment_cost_usd{chain="solana"}[7d])

  - slug: sui
    name: Sui
    layer: l1
    tag: Move coin module publish, 5M MIST budget
    formula: "suix_getReferenceGasPrice × 5,000,000 MIST × SUI USD price."
    queries:
      p50: quantile_over_time(0.50, token_deployment_cost_usd{chain="sui"}[24h])
      p90: quantile_over_time(0.90, token_deployment_cost_usd{chain="sui"}[24h])
      p99: quantile_over_time(0.99, token_deployment_cost_usd{chain="sui"}[24h])
      mean: avg_over_time(token_deployment_cost_usd{chain="sui"}[24h])
      series: token_deployment_cost_usd{chain="sui"}
      sample_size: count_over_time(token_deployment_cost_usd{chain="sui"}[7d])

  - slug: aptos
    name: Aptos
    layer: l1
    tag: FA standard publish, 150k gas budget
    formula: "estimate_gas_price.gas_estimate × 150,000 gas × APT USD price."
    queries:
      p50: quantile_over_time(0.50, token_deployment_cost_usd{chain="aptos"}[24h])
      p90: quantile_over_time(0.90, token_deployment_cost_usd{chain="aptos"}[24h])
      p99: quantile_over_time(0.99, token_deployment_cost_usd{chain="aptos"}[24h])
      mean: avg_over_time(token_deployment_cost_usd{chain="aptos"}[24h])
      series: token_deployment_cost_usd{chain="aptos"}
      sample_size: count_over_time(token_deployment_cost_usd{chain="aptos"}[7d])

  - slug: osmosis
    name: Osmosis
    layer: l1
    tag: TokenFactory denom_creation_fee
    formula: "LCD denom_creation_fee × OSMO USD price. Currently empty array, gas only."
    queries:
      p50: quantile_over_time(0.50, token_deployment_cost_usd{chain="osmosis"}[24h])
      p90: quantile_over_time(0.90, token_deployment_cost_usd{chain="osmosis"}[24h])
      p99: quantile_over_time(0.99, token_deployment_cost_usd{chain="osmosis"}[24h])
      mean: avg_over_time(token_deployment_cost_usd{chain="osmosis"}[24h])
      series: token_deployment_cost_usd{chain="osmosis"}
      sample_size: count_over_time(token_deployment_cost_usd{chain="osmosis"}[7d])

  - slug: injective
    name: Injective
    layer: l1
    tag: TokenFactory denom_creation_fee, 0.1 INJ flat
    formula: "LCD denom_creation_fee = 0.1 INJ × INJ USD price."
    queries:
      p50: quantile_over_time(0.50, token_deployment_cost_usd{chain="injective"}[24h])
      p90: quantile_over_time(0.90, token_deployment_cost_usd{chain="injective"}[24h])
      p99: quantile_over_time(0.99, token_deployment_cost_usd{chain="injective"}[24h])
      mean: avg_over_time(token_deployment_cost_usd{chain="injective"}[24h])
      series: token_deployment_cost_usd{chain="injective"}
      sample_size: count_over_time(token_deployment_cost_usd{chain="injective"}[7d])

  - slug: cardano
    name: Cardano
    layer: l1
    tag: Native asset min-UTxO, deterministic
    formula: "(160 byte overhead + 70 byte single-asset bundle) × coins_per_utxo_size + 180000 lovelace mint tx fee, × ADA USD price."
    queries:
      p50: quantile_over_time(0.50, token_deployment_cost_usd{chain="cardano"}[24h])
      p90: quantile_over_time(0.90, token_deployment_cost_usd{chain="cardano"}[24h])
      p99: quantile_over_time(0.99, token_deployment_cost_usd{chain="cardano"}[24h])
      mean: avg_over_time(token_deployment_cost_usd{chain="cardano"}[24h])
      series: token_deployment_cost_usd{chain="cardano"}
      sample_size: count_over_time(token_deployment_cost_usd{chain="cardano"}[7d])

  - slug: stellar
    name: Stellar
    layer: l1
    tag: Issuer + distribution + trustline, 2-account flow
    formula: "(3 × base_reserve_in_stroops + 2 × base_fee_in_stroops) × XLM USD price."
    queries:
      p50: quantile_over_time(0.50, token_deployment_cost_usd{chain="stellar"}[24h])
      p90: quantile_over_time(0.90, token_deployment_cost_usd{chain="stellar"}[24h])
      p99: quantile_over_time(0.99, token_deployment_cost_usd{chain="stellar"}[24h])
      mean: avg_over_time(token_deployment_cost_usd{chain="stellar"}[24h])
      series: token_deployment_cost_usd{chain="stellar"}
      sample_size: count_over_time(token_deployment_cost_usd{chain="stellar"}[7d])
