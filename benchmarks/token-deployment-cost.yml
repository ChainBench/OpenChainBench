      p90: quantile_over_time(0.90, token_deployment_cost_usd{chain="aptos"}[24h])
      p99: quantile_over_time(0.99, token_deployment_cost_usd{chain="aptos"}[24h])
      mean: avg_over_time(token_deployment_cost_usd{chain="aptos"}[24h])
      series: token_deployment_cost_usd{chain="aptos"}
      sample_size: count_over_time(token_deployment_cost_usd{chain="aptos"}[7d])

  - slug: osmosis
    name: Osmosis
    layer: l1
    tag: TokenFactory, no creation fee, gas only
    formula: "LCD denom_creation_fee (empty) + MsgCreateDenom gas at a pinned gas price, × OSMO USD price."
    queries:
      p50: quantile_over_time(0.50, token_deployment_cost_usd{chain="osmosis"}[24h])
      p90: quantile_over_time(0.90, token_deployment_cost_usd{chain="osmosis"}[24h])
      p99: quantile_over_time(0.99, token_deployment_cost_usd{chain="osmosis"}[24h])
      mean: avg_over_time(token_deployment_cost_usd{chain="osmosis"}[24h])
      series: token_deployment_cost_usd{chain="osmosis"}
      sample_size: count_over_time(token_deployment_cost_usd{chain="osmosis"}[7d])

  - slug: injective
    name: Injective
    layer: l1
    tag: TokenFactory denom_creation_fee, 0.1 INJ flat
    formula: "LCD denom_creation_fee (0.1 INJ) + MsgCreateDenom gas at a pinned gas price, × INJ USD price."
    queries:
      p50: quantile_over_time(0.50, token_deployment_cost_usd{chain="injective"}[24h])
      p90: quantile_over_time(0.90, token_deployment_cost_usd{chain="injective"}[24h])
      p99: quantile_over_time(0.99, token_deployment_cost_usd{chain="injective"}[24h])
      mean: avg_over_time(token_deployment_cost_usd{chain="injective"}[24h])
      series: token_deployment_cost_usd{chain="injective"}
      sample_size: count_over_time(token_deployment_cost_usd{chain="injective"}[7d])

  - slug: cardano
    name: Cardano
    layer: l1
    tag: Native asset min-UTxO, deterministic
    formula: "(160 byte overhead + 70 byte single-asset bundle) × coins_per_utxo_size + 180000 lovelace mint tx fee, × ADA USD price."
    queries:
      p50: quantile_over_time(0.50, token_deployment_cost_usd{chain="cardano"}[24h])
      p90: quantile_over_time(0.90, token_deployment_cost_usd{chain="cardano"}[24h])
      p99: quantile_over_time(0.99, token_deployment_cost_usd{chain="cardano"}[24h])
