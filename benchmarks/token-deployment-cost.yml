# OpenChainBench. Bench № 034

slug: token-deployment-cost
number: "034"
title: Cheapest blockchain to deploy a token, live USD cost per L1 chain
seo_title: "Token deployment cost {{year}}: cheapest chain"
seo_description: "Live USD cost to create a fungible token on {{count}} L1 chains, EVM and non-EVM: an ERC20 deploy, an SPL mint, a jetton, an ASA, a NEAR or ICP token."
subtitle: "Live USD cost to bring a fungible token into existence on each L1, using that chain's canonical method. {{count}} chains, 5 minute refresh, no transactions broadcast."

seo_intro: |
  This page answers a question every token issuer asks before launch: how much does it cost in dollars to create a token on each chain right now. {{best_name}} is the cheapest of {{count}} L1 chains at {{best_p50}}, refreshed every 5 minutes. EVM chains deploy the same OpenZeppelin ERC20, priced as eth_estimateGas on that contract times the live gas price, so the gap between two EVM chains is their gas schedule and their coin, never a different contract. Non-EVM chains use their own canonical method: an SPL mint with its Metaplex metadata on Solana, a Move publish on Sui and Aptos, TokenFactory on Osmosis and Injective, a native asset on Cardano, Stellar and Algorand, a jetton on Gram (TON), the tkn.near factory on NEAR, a ledger canister on the Internet Computer. Deposits the chain locks for as long as the token exists (rent, reserves, minimum balance, storage stake) are counted, because the token cannot exist without them. Every number is reproducible from source and no transaction is broadcast.

faq:
  - q: "What does this benchmark measure?"
    a: "The live USD cost to create a standard fungible token on each tracked L1 chain, refreshed every 5 minutes, using the chain's canonical method: an OpenZeppelin ERC20 deploy on EVM chains, an SPL mint with an Associated Token Account and Metaplex metadata on Solana, a Move publish on Sui and Aptos, TokenFactory on Osmosis and Injective, a native asset on Cardano, Stellar and Algorand, a jetton on Gram, a tkn.near token on NEAR and a ledger canister on the Internet Computer."
  - q: "Which chains are tracked?"
    a: "{{count}} L1 chains with live data. EVM: Ethereum, BNB Chain, Avalanche, Polygon PoS, Sei, Cronos, Kaia and Somnia. Non-EVM: Solana, Sui, Aptos, Osmosis, Injective, Cardano, Stellar, Algorand, Gram (TON), NEAR and the Internet Computer."
  - q: "How are EVM chains priced?"
    a: "Every EVM chain receives the same init code: the OpenZeppelin Contracts Wizard default ERC20 (OpenZeppelin 5.0.2, solc 0.8.24, 200 optimizer runs), whose source and compile script are in the harness. The harness calls eth_estimateGas on it and multiplies by eth_gasPrice. Most chains report about 550,000 gas; Sei and Somnia charge more gas for the same contract because their storage costs differ, which is why gas is measured per chain rather than assumed."
  - q: "Why are rollups and L2s not on the leaderboard?"
    a: "A deploy on a rollup also pays an L1 data fee for posting the contract bytes, and eth_estimateGas does not report that fee the same way on every stack. Pricing it needs a per-stack oracle read, so L2s stay out until that is measured like-for-like rather than approximated."
  - q: "Is the comparison fair across chains?"
    a: "As fair as the chains allow. Creating a token means structurally different things in each ecosystem, so the bench prices the method issuers actually use on each chain and publishes the formula and inputs for every row. Locked deposits (Solana rent, Stellar reserves, the Algorand minimum balance, the NEAR storage stake) are included and the methodology says which part is refundable."
  - q: "Why is NEAR so much more expensive than the rest?"
    a: "NEAR charges storage staking for every byte an account holds, 1 NEAR per 100 kB. A NEP-141 token is its own contract account, and the tkn.near factory deploys a 213 kB contract into it, so most of the {{p50:near}} is that stake. It is locked in the token account for as long as the token exists rather than burned; the transaction fee itself is about a hundredth of a NEAR."
  - q: "Is the Solana number fair compared to an ERC20?"
    a: "Yes. The bench counts the 82 byte mint account, the 165 byte Associated Token Account for the first holder and the 679 byte Metaplex metadata account that holds the name, symbol and URI. An ERC20 stores its name and symbol in its own contract, so the metadata account is the like-for-like addition; a bare mint without it does not show up in wallets or DEX interfaces."
  - q: "What does the Internet Computer row include?"
    a: "The 500 billion cycle fee to create the ledger canister on a 13 node subnet, converted to ICP at the cycles minting canister's live ICP/XDR rate. It does not include the cycles a running ledger must keep in reserve, which are not consumed at creation, so the row is the floor rather than a typical top-up."
  - q: "Can I cite a value from this page?"
    a: "Yes. Every number is a live Prometheus query against the OpenChainBench gateway and the harness source is linked below. Cite the value, the chain and the timestamp at the top of the page."

category: Blockchains
status: live
metric: Token deployment cost USD
unit: usd
higher_is_better: false
row_noun: { one: chain, many: chains }

abstract: |
  Every 5 minutes the harness asks each tracked L1 what it would cost
  right now to create a standard fungible token. EVM chains get the same
  OpenZeppelin ERC20 init code through eth_estimateGas, times
  eth_gasPrice. Solana reads rent exemption for the SPL mint, the
  Associated Token Account and the Metaplex metadata account. Sui and
  Aptos multiply the live gas price by a pinned Move publish budget.
  Osmosis and Injective read denom_creation_fee from the LCD. Cardano
  applies the min UTxO formula to coins_per_utxo_size, Stellar prices
  the issuer plus distribution flow from the latest ledger, Algorand adds
  the per-asset minimum balance to the live min fee. Gram prices the
  standard jetton minter flow with the live basechain config, NEAR asks
  the tkn.near factory for its deposit quote, and the Internet Computer
  converts the canister creation fee at the live ICP/XDR rate. No
  transaction is broadcast. Native costs are converted to USD with a
  live price and published as Prometheus gauges per chain.

methodology:
  - "Refresh cadence. 5 minutes. One process samples every chain in parallel goroutines and emits Prometheus gauges. A chain whose sampler or price has failed for 30 minutes stops publishing a USD cost, so a dead upstream shows as down instead of a stale number."
  - "EVM chains (Ethereum, BNB Chain, Avalanche, Polygon PoS, Sei, Cronos, Kaia, Somnia). eth_estimateGas on the OpenZeppelin Contracts Wizard default ERC20 (OpenZeppelin 5.0.2, solc 0.8.24, 200 runs, evmVersion paris, 3096 bytes of init code) times eth_gasPrice. Same bytes on every chain; source and compile script are in the harness."
  - "Solana SPL. getMinimumBalanceForRentExemption for the 82 byte mint, the 165 byte Associated Token Account and the 679 byte Metaplex metadata account, plus 5000 lamports for the signature. Rent is locked, refundable if the accounts are closed."
  - "Sui. epoch.referenceGasPrice from the Sui GraphQL service times a pinned 5 million gas unit budget for a coin module publish, net of storage rebate. Aptos. /v1/estimate_gas_price gas_estimate times a pinned 150,000 gas unit budget for a fungible asset publish."
  - "Osmosis and Injective TokenFactory. LCD tokenfactory params.denom_creation_fee (empty on Osmosis, 0.1 INJ on Injective) plus MsgCreateDenom gas (80,000 baseline plus denom_creation_gas_consume) at a pinned typical gas price per chain."
  - "Cardano. Koios epoch_params.coins_per_utxo_size times (160 byte overhead plus a 70 byte single asset bundle), plus a 180,000 lovelace mint transaction fee."
  - "Stellar. Latest ledger base_reserve_in_stroops and base_fee_in_stroops: 5 base reserves (2 per new account for the issuer and the distribution account, 1 for the trustline) plus 2 base fees. Reserves are locked, refundable on account closure."
  - "Algorand ASA. algod /v2/transactions/params: max(min-fee, fee per byte times 250 bytes) for the asset config transaction, plus the 0.1 ALGO minimum balance raise per asset, refundable when the asset is destroyed."
  - "Gram (TON) jetton. The standard minter.ton.org flow (wallet, minter with its StateInit and mint, jetton wallet deploy, notification, excess) priced with live basechain config params 21 and 25 from tonapi. Gas and message sizes are pinned from a real mainnet deploy, which the model reproduces to within 28 nanoton. Only fees are counted; the TON attached to the deploy stays in the contracts or returns as excess."
  - "NEAR. The tkn.near factory's own get_required_deposit quote for a token with this bench's name and symbol, the storage stake of the new token account at the live storage price, plus 106 Tgas of create_token gas at the live gas_price. The stake stays locked in the token account."
  - "Internet Computer. 500 billion cycles to create the ledger canister on a 13 node subnet, converted to ICP at the live ICP/XDR rate published from the cycles minting canister (1 trillion cycles is 1 XDR). The ledger's running cycle reserve is not counted."
  - "USD prices. Mobula market multi-data by ticker, refreshed every 5 minutes and treated as missing after an hour. Gram is priced with GRAM, since Mobula's TON ticker resolves to a different asset."
  - "Not tracked. L2s and rollups, whose deploy also pays an L1 data fee that eth_estimateGas does not report uniformly across stacks."

findings:
  - "{{best_name}} is the cheapest tracked chain to deploy a token at {{best_p50}} right now; {{worst_name}} is the most expensive at {{worst_p50}}."
  - "On EVM chains the same ERC20 costs about 550,000 gas almost everywhere, so the dollar gap is the gas price and the coin. Somnia is the exception, reporting about 20 times more gas for the same bytes because its gas schedule differs from Ethereum's; Sei reports about 40 percent more."
  - "NEAR's figure is almost all storage stake for a 213 kB contract, locked in the token account rather than burned. Its transaction fee alone is about a hundredth of a NEAR."
  - "Algorand, Stellar and Solana count a refundable deposit (minimum balance, reserves, rent) in their headline, because the token cannot exist without it."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/token-deployment-cost

prometheus:
  window: 24h

# Real metrics exposed by the token-deployment-cost harness:
#   token_deployment_cost_usd{chain, layer, kind}            gauge (USD)
#   token_deployment_cost_native{chain, layer, kind, unit}   gauge (smallest unit)
#   token_deployment_gas_units{chain, layer, kind}           gauge (gas/compute/cycles)
#   token_deployment_native_price_usd{chain}                 gauge (USD per token)
#   token_deployment_sample_duration_seconds{chain}          gauge (seconds)
#   token_deployment_samples_total{chain, status}            counter

providers:
  - slug: solana
    name: Solana
    layer: l1
    tag: SPL mint + ATA + Metaplex metadata
    formula: "rent(82) + rent(165) + rent(679) + 5000 lamports/sig, × SOL USD price."
    queries:
      p50: quantile_over_time(0.50, token_deployment_cost_usd{chain="solana"}[24h])
      p90: quantile_over_time(0.90, token_deployment_cost_usd{chain="solana"}[24h])
      p99: quantile_over_time(0.99, token_deployment_cost_usd{chain="solana"}[24h])
      mean: avg_over_time(token_deployment_cost_usd{chain="solana"}[24h])
      series: token_deployment_cost_usd{chain="solana"}
      sample_size: count_over_time(token_deployment_cost_usd{chain="solana"}[7d])

  - slug: sui
    name: Sui
    layer: l1
    tag: Move coin module publish, 5M gas budget
    formula: "epoch.referenceGasPrice (GraphQL) × 5,000,000 gas units × SUI USD price."
    queries:
      p50: quantile_over_time(0.50, token_deployment_cost_usd{chain="sui"}[24h])
      p90: quantile_over_time(0.90, token_deployment_cost_usd{chain="sui"}[24h])
      p99: quantile_over_time(0.99, token_deployment_cost_usd{chain="sui"}[24h])
      mean: avg_over_time(token_deployment_cost_usd{chain="sui"}[24h])
      series: token_deployment_cost_usd{chain="sui"}
      sample_size: count_over_time(token_deployment_cost_usd{chain="sui"}[7d])

