# OpenChainBench. Bench № 053

slug: mantle-rpc
number: "053"
title: "Mantle RPC endpoints: free public URLs ranked by latency"
seo_title: "Mantle RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Mantle RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Mantle RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Mantle rounds out the cluster's long tail with {{count}} qualifying no-key providers, all multi-chain gateways (PublicNode, dRPC, Tenderly). Like every chain in the family, the number that matters is a sustained median, the same `eth_getBlockByNumber` call every 60 seconds from three regions over a rolling 24 hours, not a one-off marketing burst, and archive-depth support is audited separately every 5 minutes.

abstract: |
  Mantle: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Mantle endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore. The harness also classifies every response (ok / http_err / jsonrpc_err / stale / timeout) and audits archive depth every 5 minutes, so the leaderboard rewards sustained, honest availability rather than a fast error message. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Mantle-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the latest-header fetch with a rotating id defeats edge caches that answer eth_blockNumber without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Mantle-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=\"mantle\". Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. Exclusions follow the cluster-wide rules documented on the parent benchmark."

faq:
  - q: "Which Mantle RPCs work without an API key?"
    a: "The {{count}} providers on this page are listed with their URLs in the endpoints table above. Every (provider, chain) pair was live-verified no-key before inclusion, and anything that key-gates, region-blocks or rate-limits below our 60-second cadence is excluded rather than listed with an asterisk."
  - q: "Are free Mantle RPCs reliable enough to build on?"
    a: "The {{count}} qualifying gateways all maintain high measured success rates on Mantle, but a {{count}}-provider field means less redundancy if one degrades. Use the current leader as primary and the runner-up as fallback, and re-check this page after incidents, the ranking is live and the honest answer moves."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on region alone.
rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="mantle"})

# Region is the only dimension: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://mantle-rpc.publicnode.com
    tag: Allnodes-operated, 70+ chains, archive on most
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Mantle endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="mantle"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="mantle"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="mantle"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="mantle"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="mantle"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="mantle"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="mantle"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="mantle"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="mantle", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="mantle", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="mantle", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="mantle", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="mantle", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="mantle", region="sgp"}[1h])

