  - slug: tenderly
    name: Tenderly
    endpoint: https://gateway.tenderly.co/public/mantle
    tag: Multi-chain public gateway, 9 chains, no key
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Tenderly's no-key Mantle endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tenderly", chain="mantle"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="tenderly", chain="mantle"})
