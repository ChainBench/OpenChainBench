# OpenChainBench. Bench No 222

slug: tezos-rpc
number: "222"
title: Fastest free Tezos RPC, live no-key endpoint latency
seo_title: "Fastest free Tezos RPC 2026"
seo_description: "{{best_name}} leads free Tezos RPC at {{best_p50}} (block level REST p50, 24h). URLs for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for GET /chains/main/blocks/head/header against every available public Tezos node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Tezos is a self-amending proof-of-stake blockchain using Liquid Proof of Stake (LPoS) and an on-chain governance mechanism that allows protocol upgrades without hard forks. It targets roughly one block every 30 seconds on mainnet. Public REST endpoints are available without an API key from SmartPy, TezBeta, TzKT (Baking Bad) and TCInfra. Every provider was live-verified with consecutive block header probes at launch.

abstract: |
  Tezos: {{count}} free public RPC endpoints answering `the chain's head call` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single REST call (GET /chains/main/blocks/head/header) against every available public Tezos node that sustains continuous probing: {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a Tezos-scaled staleness gap (10 blocks, around 5 min at 30 s/block). The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Tezos-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: HTTP GET /chains/main/blocks/head/header. Plain REST call. The response carries a JSON object with the level field as a plain integer."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Tezos-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=tezos. Provider coverage at launch: {{count}} endpoints (SmartPy, TezBeta, TzKT, TCInfra)."

faq:
  - q: "What is the fastest free Tezos RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (Tezos block level p50 over the last 24h), measured against {{count}} providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Tezos RPC endpoints work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today: SmartPy (mainnet.smartpy.io), TezBeta (rpc.tzbeta.net), TzKT by Baking Bad (rpc.tzkt.io/mainnet) and TCInfra (prod.tcinfra.net/rpc/mainnet). Every listed endpoint was live-verified with a block header call returning a parsable level before inclusion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="tezos"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: smartpy
    name: SmartPy
    endpoint: https://mainnet.smartpy.io
    tag: SmartPy public Tezos mainnet RPC, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /chains/main/blocks/head/header sent every 60s from 3 regions to mainnet.smartpy.io."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="smartpy", chain="tezos"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="smartpy", chain="tezos"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="smartpy", chain="tezos"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="smartpy", chain="tezos"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="smartpy", chain="tezos"}) / sum(ocb:rpc_call:rate_24h{provider="smartpy", chain="tezos"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="smartpy", chain="tezos"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="smartpy", chain="tezos"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="smartpy", chain="tezos", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="smartpy", chain="tezos", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="smartpy", chain="tezos", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="smartpy", chain="tezos", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="smartpy", chain="tezos", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="smartpy", chain="tezos", region="sgp"}[1h])

