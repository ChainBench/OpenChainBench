# OpenChainBench. Bench No 293

slug: xpla-rpc
number: "293"
title: "XPLA RPC endpoints: free public URLs by latency"
seo_title: "XPLA RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free XPLA RPC at {{best_p50}} (Tendermint status p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for the Tendermint `status` method against every free, no-key public XPLA Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  XPLA is a Cosmos SDK chain (dimension_37-1). Three public Tendermint RPCs answered on 2026-10-07: the XPLA official endpoint (dimension-rpc.xpla.dev), PublicNode and Polkachu. One detail worth recording because it changes the count: the registry's Allnodes entry resolves to PublicNode's host, so it is the same endpoint under two names and appears once here rather than twice.

abstract: |
  XPLA: {{count}} free public RPC endpoints answering Tendermint status every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:xpla-official}}.
  We measure the round-trip latency of a single Tendermint `status` call against every no-key public XPLA endpoint that sustains continuous probing, {{count}} providers measured, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a XPLA-scaled staleness gap (20 blocks at XPLA's ~5 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the XPLA-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"status\",\"params\":[]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the rotating id defeats edge caches that would answer a bare head query without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the exclusion rules follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the XPLA-scoped view of the same harness."
  - "Roster: every endpoint here answered a real Tendermint status call without a key on the 2026-10-07 sweep before being added to the probe matrix. An endpoint that needs a key, region-blocks us or rate-limits below the 60-second cadence is excluded rather than listed with an asterisk."
  - "Chain scope: every query on this page is pinned to `chain=\"xpla\"`. Provider coverage: {{count}} no-key endpoints."

faq:
  - q: "Which XPLA RPCs work without an API key?"
    a: "{{declared_count}} endpoints are probed on this chain: XPLA (dimension-rpc.xpla.dev), PublicNode (xpla-rpc.publicnode.com), Polkachu (xpla-rpc.polkachu.com). Every listed endpoint was live-verified with a Tendermint status call returning a parsable response before inclusion."
  - q: "How is XPLA RPC latency measured here, technically?"
    a: "One identical Tendermint status call every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest."
  - q: "Why does XPLA show PublicNode but not Allnodes?"
    a: "They are the same endpoint. The Cosmos registry lists an Allnodes entry for XPLA whose address resolves to PublicNode's host, so counting both would inflate the roster with a duplicate and make the board look wider than it is. We keep the operator that actually serves the request. The same rule applies across this cluster: one host, one row."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="xpla"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: xpla-official
    name: XPLA
    endpoint: https://dimension-rpc.xpla.dev
    tag: XPLA official public Tendermint RPC endpoint
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` call sent every 60s from 3 regions (us-east + eu-west + sgp) to XPLA's no-key xpla RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="xpla-official", chain="xpla"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="xpla-official", chain="xpla"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="xpla-official", chain="xpla"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="xpla-official", chain="xpla"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="xpla-official", chain="xpla"}) / sum(ocb:rpc_call:rate_24h{provider="xpla-official", chain="xpla"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="xpla-official", chain="xpla"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="xpla-official", chain="xpla"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="xpla-official", chain="xpla", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="xpla-official", chain="xpla", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="xpla-official", chain="xpla", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="xpla-official", chain="xpla", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="xpla-official", chain="xpla", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="xpla-official", chain="xpla", region="sgp"}[1h])

