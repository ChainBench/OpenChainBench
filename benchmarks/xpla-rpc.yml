      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="xpla"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="xpla"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="xpla"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="xpla"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="xpla", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="xpla", region="us-east"}[1h])
        - region: eu-west
