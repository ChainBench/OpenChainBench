# OpenChainBench. Bench № 174

slug: dymension-rpc
number: "174"
title: "Dymension RPC endpoints: free public URLs by latency"
seo_title: "Dymension RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Dymension RPC at {{best_p50}} (Tendermint status p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for the Tendermint status method against every free, no-key public Dymension Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Dymension (dymension_1100-1) is a Cosmos SDK blockchain serving as the settlement and liquidity hub for RollApps, which are application-specific rollups launched on the Dymension ecosystem, DYM staking token, CometBFT consensus. Polkachu, PublicNode, and LavenderFive provide keyless Tendermint RPC endpoints probed every 60 seconds from three regions.

abstract: |
  Dymension: {{count}} free public RPC endpoints answering `status` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical Cosmos SDK call (Tendermint `status`) against every no-key public Dymension endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Dymension-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"status\",\"params\":[]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Dymension-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"dymension\"`. Provider coverage today: {{count}} no-key endpoints."


source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="dymension"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: polkachu
    name: Polkachu
    endpoint: https://dymension-rpc.polkachu.com
    tag: Community Cosmos validator and public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Polkachu's no-key Dymension endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="dymension"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="polkachu", chain="dymension"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="polkachu", chain="dymension"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="polkachu", chain="dymension"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="polkachu", chain="dymension"}) / sum(ocb:rpc_call:rate_24h{provider="polkachu", chain="dymension"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="polkachu", chain="dymension"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="dymension"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="dymension", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="dymension", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="dymension", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="dymension", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="dymension", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="dymension", region="sgp"}[1h])

  - slug: publicnode
    name: PublicNode
    endpoint: https://dymension-rpc.publicnode.com
    tag: Allnodes-operated, 70+ chains
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Dymension endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="dymension"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="dymension"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="dymension"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="dymension"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="dymension"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="dymension"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="dymension"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="dymension"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="dymension", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="dymension", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="dymension", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="dymension", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="dymension", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="dymension", region="sgp"}[1h])

  - slug: lavenderfive
    name: LavenderFive
    endpoint: https://rpc.lavenderfive.com:443/dymension
    tag: Cosmos validator and no-key RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to LavenderFive's no-key Dymension endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="dymension"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="lavenderfive", chain="dymension"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="lavenderfive", chain="dymension"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="lavenderfive", chain="dymension"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="lavenderfive", chain="dymension"}) / sum(ocb:rpc_call:rate_24h{provider="lavenderfive", chain="dymension"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="lavenderfive", chain="dymension"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="dymension"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="dymension", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="dymension", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="dymension", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="dymension", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="dymension", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="dymension", region="sgp"}[1h])
