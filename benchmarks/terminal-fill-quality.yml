# OpenChainBench. Bench 268

slug: terminal-fill-quality
number: "268"
title: "Trading terminal fill quality 2026: what a swap costs on Axiom, GMGN, FOMO, Photon, Trojan, measured on-chain"
seo_title: "Trading terminal fill quality 2026: Axiom vs GMGN vs FOMO vs Photon vs Trojan, cost per swap on-chain"
seo_description: "{{best_name}} fills cheapest at a median {{best_p50}} lost per swap against the pool's arrival price. Real Solana swaps read on-chain for {{count}} trading terminals and Telegram bots: terminal fee, priority and Jito tips, pump.fun and pool costs, failed transactions."
subtitle: Value lost per swap on each Solana trading terminal or Telegram bot, from real user transactions read on-chain and valued at the pool's arrival price. Split into what the terminal takes, what the network takes, what pump.fun and the pool take, plus the share of transactions that fail. Rolling 24 hours, refreshed every 90 seconds.

category: Trading
status: live
metric: Cost per swap
unit: bps
higher_is_better: false

disclaimer: |
  Random sample (300 per terminal per day) of the transactions paying each terminal's fee wallets, all counted for the fail rate. Reference = the pool's state before the swap (exact reserves on PumpSwap and Raydium, previous trade on the pool elsewhere); swaps without a readable pool state keep their cost split but no loss figure. The trade's own impact is inside; sandwiches are counted separately. Compare medians, not single swaps.

seo_intro: |
  Every trading terminal advertises a fee. What a swap actually costs is the
  fee plus the priority fee and Jito tip the app attaches, plus what pump.fun
  or the pool keep on the way, plus the price move between the moment the
  user clicked and the moment the swap landed, plus the transactions that fail
  and still burn the priority fee. None of that is in the fee schedule, all of
  it is in the transaction. This benchmark reads real user swaps on Solana for
  Axiom, GMGN, FOMO, Photon, Trojan, BullX, Bloom, Maestro and Pepeboost, values
  the tokens received at the pool's arrival price (the previous trade on the
  same pool, seconds earlier) and publishes the median shortfall in basis
  points with its split: terminal, network, pool, other. A terminal fee of 1 %
  is 100 bps; the median swap on most terminals loses three to five times that.

abstract: |
  Each terminal takes its fee through known wallets. getSignaturesForAddress on
  those wallets returns every transaction the terminal routed, failed ones
  included, through a live WebSocket feed; the harness counts them all (fail
  rate) and reads 300 successful ones per terminal per day, drawn at random. From
  the pre/post balances of every account in the transaction it derives, in quote
  units (SOL or a $1 stable), what left the user, what the pool received, what
  reached the terminal's fee wallets, the tx fee and Jito tips, and the rest
  (pump.fun protocol and creator fees, referral payouts). The token leg is valued
  at the pool's mid before the swap: exactly from the pool's pre-trade balances
  in the transaction on PumpSwap (with the virtual quote reserve its migrated
  pools store) and Raydium, else at the effective price of the previous trade on
  the same pool, read from that pool's own transaction just before ours
  (ref_age_s records the gap; median under a second on active pools). Swaps with
  neither keep their exact cost split and no loss figure. Loss = 1 −
  value received / value given, in basis points of the trade; the split is exact
  and independent of the reference. Rolling 24 hour window, medians, p90, trade
  size and venue mix per terminal; a terminal is published from 20 priced swaps.

methodology:
  - "Sampling: a live WebSocket feed of every transaction touching each terminal's fee wallets (DeFiLlama adapters and Dune's spellbook: Axiom 20, GMGN 9, Trojan 7, Banana Gun 3, BullX 2, Maestro 2, FOMO / Photon / Bloom / Pepeboost / BONKbot / Nova 1; pump.fun's mobile app by its app program) counts them all, failed ones included; 300 successful ones per terminal per day are drawn at random and read. Rolling 24 h. Wallet-funding transfers and fee sweeps are excluded (no user token leg)."
  - "Quote side, exact from balance deltas: user_q = what left or reached the user's SOL / WSOL / stable balance, rent for new token accounts and the tx fee excluded; pool_q = the pool's quote movement, converted to the user's quote unit when the pool is quoted differently; terminal_q = lamports, WSOL or stables landing in the fee wallets."
  - "network_q = tx fee if the user paid it + tips to Jito, 0slot, bloXroute and Nozomi tip accounts (other tip services land in other); other_q = user_q minus pool_q, terminal_q and network_q (pump.fun protocol and creator fees, referral payouts), single-pool routes only. Rent of token accounts created or closed in the transaction is excluded."
  - "Reference price, in order: the pool's exact pre-trade mid from its balances in the transaction when the route is one constant-product pool (PumpSwap, whose migrated pools carry a virtual quote reserve read from the pool account; Raydium v4 / CPMM); else the effective price of the previous trade on the same pool (pump.fun curve, Meteora, CLMM, multi-pool routes)."
  - "Swaps with neither reference keep their exact cost components and stay out of the loss figure; no off-chain price is used. ref_src flags each sample and ref_src_pct per terminal says how many were priced and how."
  - "Loss (headline): buy = 1 − tokens × ref / user_q; sell = 1 − user_q / (tokens × ref). Basis points of the trade (buy: quote spent, sell: tokens × ref). Pool = loss minus terminal, network and other: LP fee and price impact, plus hop costs on multi-pool routes. The four components sum to the loss. Median over priced samples; p90 shown."
  - "Fail rate: failed over all transactions the feed saw on the terminal's wallets in the window, exhaustive. A failed swap still costs the priority fee."
  - "PumpSwap's vault ratio alone is not the mid: pools migrated from pump.fun add a virtual quote reserve (about 17.6 SOL) that the pool account stores; with it x·y = k matches executed trades exactly. pump.fun's 2026 bonding curve fills 20 to 60 % above its stored virtual_sol / virtual_token, so the curve gets the previous-trade reference instead."
  - "Sandwiches: every sampled swap's neighbours in its pool's transaction sequence are checked, since a front-run and a back-run both touch the pool: same signer trading our direction just before us and back just after (same slot or the next), closing a comparable position with a positive take. Published as the share of screened swaps, with the attacker's profit in bps of the victim's trade."
  - "The sandwich victim's extra cost is already inside the loss (the front-run precedes us, so the arrival price includes it). Multi-block sandwiches are not looked for."
  - "Trade-size buckets (under $25, $25 to $250, over $250): median loss per bucket in the public JSON and on each product page, so terminals with different typical trade sizes are compared at equal size."
  - "Not measured: cross-chain trades (FOMO via Relay), perps."
  - "FOMO sponsors gas: its own signer pays the tx fee, so the user's network cost is zero; fees are taken in USDC. BullX's DeFiLlama fee wallets see almost no fee on sampled swaps; its terminal figure is a floor."
  - "Not in the table: BasedBot. The addresses DeFiLlama lists for it belong to a launchpad and bid mechanism that keeps half the tokens, not to the 1 % trading bot, and the bot's Solana fee wallet is not published anywhere readable (no Dune spellbook model, no Mobula attribution). It joins the table the day that wallet is known."
  - "Dust: swaps under $1 are dropped (basis points of nothing are noise)."

findings:
  - "{{best_name}} fills cheapest: a median {{best_p50}} lost per swap against the pool's arrival price, all costs included."
  - "The advertised 1 % fee is the smallest constant: pump.fun protocol and creator fees add about 100 to 200 bps on curve and PumpSwap trades whichever terminal routes them."
  - "Network cost separates the Telegram bots: Trojan attaches Jito tips worth tens of basis points on a median swap, Axiom and GMGN a few."
  - "Failed transactions are a hidden cost: on the busiest terminals several percent of routed transactions fail on-chain and still pay the priority fee."

faq:
  - q: "What is the reference price and why does it matter?"
    a: "The token side of a swap has no price of its own; it has to be valued at something. This bench values it at the pool's mid price just before the swap: exactly, from the pool's own pre-trade balances in the transaction, on PumpSwap (with the virtual quote reserve its migrated pools store) and Raydium; and, where the pool's formula is not known or the route crosses several pools, at the effective price of the previous trade on the same pool, usually under a second earlier. That is the arrival price a TCA desk would use. Valuing at the price after the swap would hide the trade's own impact. When neither is available the swap keeps its exact cost split but no loss figure; no off-chain price is used."
  - q: "Why is the loss much larger than the terminal's 1 % fee?"
    a: "Because the fee is one of five costs. On a pump.fun curve or PumpSwap trade the protocol and creator fees add roughly 1 to 2 %, the pool keeps its LP fee and the price impact of the trade, the app attaches a priority fee and often a Jito tip, and the pool's price may already have moved between the arrival trade and ours. The split is published per terminal so the terminal-attributable part is visible on its own."
  - q: "Is this comparable across terminals?"
    a: "The explicit components (terminal, network) are exact and terminal-attributable. The pool component depends on what users trade and how much, which differs per app (Photon's median swap is small, FOMO's is hundreds of dollars), so read the total loss together with the trade size column. Medians over hundreds of swaps are stable; single swaps are not."
  - q: "How are sandwiches found, and is the loss double counted?"
    a: "A sandwich's two legs both touch the pool, so they are the user's neighbours in the pool's own transaction sequence: a transaction just before, on the same pool and in the same direction, and one just after trading back, both signed by the same account, in the same slot or the next. The Sandwiched column is how often that happens per terminal; the attacker's profit is in the JSON. The victim's extra cost is not a separate line: the front-run precedes the user's swap, so the arrival price already carries it and it sits inside the pool component of the loss."
  - q: "How is a swap attributed to a terminal?"
    a: "By the fee it pays: every terminal transfers its fee to known wallets in the same transaction, and those wallet lists are the ones DeFiLlama's adapters use for volume, so attribution matches benches 201 and 267. FOMO's gas sponsor signs every transaction and is excluded as user."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/terminal-fill-quality

prometheus:
  window: 24h
  freshness_metric: tfq_health
  expected_freshness_seconds: 900

panel_main_description: "Median value lost per swap against the pool's arrival price, all costs included, basis points of the trade. Rolling 24 h of sampled user swaps."

metric_panels:
  - id: terminal_fee
    label: Terminal fee
    label_key: terminal
    metric: tfq_component_bps{component="terminal"}
    unit: bps
    higher_is_better: false
    description: "Median share of the trade that reached the terminal's fee wallets."
  - id: network
    label: Network
    label_key: terminal
    metric: tfq_component_bps{component="network"}
    unit: bps
    higher_is_better: false
    description: "Median transaction fee paid by the user plus Jito tips, share of the trade. Zero when the terminal sponsors gas."
  - id: pool
    label: Pool
    label_key: terminal
    metric: tfq_component_bps{component="pool"}
    unit: bps
    higher_is_better: false
    description: "Median of loss minus terminal, network and other: LP fee and price impact, plus hop costs on multi-pool routes."
  - id: other
    label: Other fees
    label_key: terminal
    metric: tfq_component_bps{component="other"}
    unit: bps
    higher_is_better: false
    tab: false
    description: "Median quote that reached neither pool, terminal nor network: pump.fun protocol and creator fees, referral payouts, hop costs."
  - id: fail_rate
    label: Failed tx
    label_key: terminal
    metric: tfq_fail_rate_pct
    unit: pct
    higher_is_better: false
    description: "Share of the terminal's transactions that failed on-chain in the window; the priority fee is paid anyway."
  - id: sandwiched
    label: Sandwiched
    label_key: terminal
    metric: tfq_sandwich_pct
    unit: pct
    higher_is_better: false
    description: "Share of sampled swaps with a front-run and a back-run by the same signer on the same pool around them. Published from 20 screened swaps."
  - id: trade_usd
    label: Median trade
    label_key: terminal
    metric: tfq_trade_usd{stat="median"}
    unit: usd
    higher_is_better: true
    tab: false
    description: "Median sampled trade size in USD."
  - id: priced
    label: Swaps sampled
    label_key: terminal
    metric: tfq_sample_size{kind="priced"}
    unit: count
    higher_is_better: true
    tab: false
    description: "Priced swaps in the rolling window."

ledger_columns:
  - { label: "Cost per swap", slot: p50 }
  - { label: "Terminal fee", panel: terminal_fee }
  - { label: "Network", panel: network }
  - { label: "Pool", panel: pool }
  - { label: "Failed tx", panel: fail_rate }
  - { label: "Sandwiched", panel: sandwiched }

providers:
  - slug: axiom
    name: Axiom
    tag: "Terminal, Solana"
    formula: "Newest swaps paying Axiom's 20 fee wallets, valued at the previous trade on the same pool; loss in bps of the trade, median over the rolling 24 h."
    queries:
      p50: tfq_loss_bps{terminal="axiom",stat="median"}
      p90: tfq_loss_bps{terminal="axiom",stat="p90"}
      p99: tfq_loss_bps{terminal="axiom",stat="p90"}
      mean: tfq_loss_bps{terminal="axiom",stat="mean"}
      success: tfq_health{terminal="axiom"}
      sample_size: tfq_sample_size{terminal="axiom",kind="priced"}
      series: tfq_loss_bps{terminal="axiom",stat="median"}

