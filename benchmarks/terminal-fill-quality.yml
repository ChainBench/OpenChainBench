# OpenChainBench. Bench 268

slug: terminal-fill-quality
number: "268"
title: "Trading terminal fill quality 2026: what a swap costs on Axiom, GMGN, FOMO, Photon, Trojan, measured on-chain"
seo_title: "Trading terminal fill quality 2026: Axiom vs GMGN vs FOMO vs Photon vs Trojan, cost per swap on-chain"
seo_description: "{{best_name}} fills cheapest at a median {{best_p50}} lost per swap against the pool's state before the trade. Real swaps read on-chain on Solana and the EVM chains for {{count}} trading terminals, wallet apps and Telegram bots: terminal fee, priority fee and tips, pump.fun and pool costs, failed swaps."
subtitle: Value lost per swap on each trading terminal, wallet app or Telegram bot (Solana and five EVM chains), from real user transactions read on-chain and valued at the pool's own state before the trade. Split into what the terminal takes, what the network takes, what pump.fun and the pool take, plus the share of swap attempts that fail. Rolling 24 hours, refreshed every few minutes.

category: Trading
status: live
metric: Cost per swap
unit: bp
higher_is_better: false

disclaimer: |
  Random sample (150 a day per row, Solana and EVM alike) of the swaps each terminal routed, every attempt counted for the fail rate. Reference = the pool's state before the swap (its reserves, or the previous trade within 60 s); swaps without one keep their split, no loss figure. Published from 50 priced swaps pooled over the product's chains at 25 or more (a single-chain product from 25), ranked from 100; the median's 95 % interval is in the JSON. Compare medians, not single swaps.

seo_intro: |
  Every trading terminal advertises a fee. What a swap actually costs is the
  fee plus the priority fee and the inclusion tip the app attaches, plus what
  pump.fun or the pool keep on the way, plus the price impact of the swap
  itself against the pool's state just before it landed, plus the swaps that
  fail and still burn the priority fee. None of that is in the fee schedule, all of
  it is in the transaction. This benchmark reads real user swaps on Solana and
  on the EVM chains they trade on for Axiom, GMGN, FOMO, Phantom, Photon,
  Trojan, Bloom, Maestro, Pepeboost, BONKbot, Banana Gun, Binance Wallet,
  Terminal, BasedBot and pump.fun's own app, values the tokens received at the pool's
  state before the swap (its reserves, or the previous trade on it seconds
  earlier) and publishes the median shortfall in basis points with its split:
  terminal, network, pool, other. A terminal fee of 1 % is 100 bps; the median
  swap on most terminals loses three to five times that.

abstract: |
  Each terminal takes its fee through known wallets. A live WebSocket feed of
  every transaction mentioning those wallets, with its program logs, says which
  ones attempted a swap and whether they failed; the harness counts them all
  (fail rate) and reads 150 successful ones per row per day, drawn at
  random. From the pre/post balances of every account in the transaction it
  derives, in quote units (SOL or a $1 stable), what left the user, what the
  pool received, what reached the terminal's fee wallets (on the EVM rows: the
  router's residual after the pool and the gas), the tx fee and the
  inclusion tips, and the rest (pump.fun protocol and creator fees, referral
  payouts). The pool is the vault pair of the swap instruction, by pubkey, so
  a hop through another pool of the same program is never mistaken for pool
  impact. The token leg is valued at the pool's mid before the swap: exactly
  from the pool's pre-trade balances in the transaction on PumpSwap (with the
  virtual quote reserve its migrated pools store) and Raydium, else at the
  effective price of the previous trade on the same pool, at most 60 seconds
  earlier. Loss = 1 − value received / value given, in basis points of the
  trade; terminal, network and other are exact and independent of the reference, pool is the remainder. Rolling 24 hour
  window, medians with a bootstrap interval, p90, trade size and venue mix per
  terminal; published from 50 priced swaps, ranked from 100.

methodology:
  - "Sampling: a WebSocket feed of every transaction mentioning each terminal's fee wallets (DeFiLlama adapters, Dune's spellbook: Axiom 22, GMGN 9, Trojan 6, Terminal 2, the others 1; pump.fun's app and Banana Gun also by program). The logs say whether a swap program was invoked: only those count as attempts, all of them for the fail rate; 150 successful ones per row per day are read (Solana and EVM alike), drawn at random, weighted by the tick's activity (clamped). Rolling 24 h."
  - "The user is the signer whose token balance moved; when nobody signed for the user (limit, DCA and auto-sell orders executed by the terminal's keeper), the wallet whose token account moved against its SOL / stable balance, never a program-derived pool address. Quote assets: SOL, USDC, USDT, USD1, USDS, PYUSD; token-to-token swaps are not measured."
  - "Quote side, exact from balance deltas: user_q = what left or reached the user's SOL / WSOL / stable balance, the tx fee included when the user paid it, rent excluded (a new token account's ~0.002 SOL deposit comes back when it is closed: shown per swap in the audit table, not a loss); pool_q = the pool's quote movement, in the user's quote unit; terminal_q = lamports, WSOL or stables landing in the fee wallets (FOMO: plus its user-signed USDC legs)."
  - "network_q = tx fee if the user paid it + inclusion tips: Jito, 0slot, bloXroute, Astralane, Nozomi and each terminal's own relay accounts (Axiom, Trojan, Maestro, Photon, Pepeboost, pump.fun app). other_q = user_q minus pool_q, terminal_q and network_q on single-pool routes without hops (pump.fun protocol and creator fees, referral payouts); on routed swaps it stays inside pool."
  - "Pool identity: the token vault that moved against the user and the quote vault of the same swap instruction, both by pubkey. Two pools behind one shared authority (Raydium, Launchpad, Meteora DAMM v2) never merge, so a hop through a sibling pool is never read as pool impact and the previous-trade lookup only sees that pool."
  - "Reference price, in order: the pool's exact pre-trade mid from its balances in the transaction (PumpSwap, Raydium); the venue's swap event when it carries the pre-trade state (Launchpad, DLMM) and reconciles with the vault deltas; else the previous trade on the pool, at most 60 s old (pump.fun curve, CLMM, routed swaps), up to 2 h on the EVM launchpad curves BasedBot's router trades on. No off-chain token price; gas coins at Coinbase spot on Relay rows, at the route's hop mid on native EVM rows."
  - "Loss (headline): buy = 1 − tokens × ref / user_q; sell = 1 − user_q / (tokens × ref). Basis points of the trade (buy: quote spent; sell: tokens × ref, plus the gas on an EVM chain, paid apart from the tokens). Pool = loss minus terminal, network and other: the components (relay on Relay rows) sum to the loss per swap; the split columns are medians (flow-weighted on All chains) and do not sum to the median loss. Losses outside −10 % to +50 % stay out. Median with its 95 % interval, p90."
  - "A product is published from 50 priced swaps in the window (a chain row, or a single-chain product, from 25) and marked as ranked from 100; a pooled entry also needs 25 effective swaps (weights considered), a row with one side only and no fee on it waits, and a product waits while its main chain fills. The previous-trade reference carries the previous trader's direction, so terminals priced mostly that way read some tens of bps worse in buy waves than on the exact mid."
  - "Fail rate: failed over every swap attempt the feed saw on the terminal's wallets in the window, exhaustive; wallet funding, fee sweeps and marker transfers invoke no swap program and are not attempts. Error classes are in the JSON. On the EVM rows the fail rate comes from a sample of blocks read in full (every transaction sent to the routers, reverted or not)."
  - "Cost of failures: 40 failed attempts per terminal per day are read for the fee they paid (a failed transaction executes nothing but pays base + priority fee; zero when the terminal sponsors gas). Failure overhead = fail rate / (1 − fail rate) × median failed fee, in bps of the median trade: what a successful swap carries on average in wasted attempts. Published apart from the cost per swap, not added to it."
  - "PumpSwap's vault ratio alone is not the mid: pools migrated from pump.fun add a virtual quote reserve (about 17.6 SOL) that the pool account stores; with it x·y = k matches executed trades exactly. pump.fun's 2026 bonding curve fills 20 to 60 % above its stored virtual_sol / virtual_token, so the curve gets the previous-trade reference instead."
  - "Sandwiches: each sampled swap's neighbours on its pool are screened (another signer trading our direction in our slot just before, and back just after, closing a comparable position with a take). Kept per swap in the JSON with the attacker and both signatures, not published as a column: how many swaps can be screened depends on pool activity, so terminals are not comparable on it."
  - "Trade-size buckets (under $25, $25 to $250, over $250): median loss per bucket in the public JSON and on each product page, so terminals with different typical trade sizes are compared at equal size."
  - "One row per product; the chain selector shows the product on one chain (Solana and five EVM chains), All chains pools its swaps across chains (bridge funding legs stay out). Each chain is sampled at a fixed daily rate, so All chains weighs a chain's sampled swaps by its swap attempts per sample: the pooled figure follows the users, not the sampler. Published from 50 priced swaps pooled over the chains at 25 or more; it waits while the chain carrying most of the flow fills."
  - "Cross-chain (FOMO): the user pays on BNB, Robinhood Chain, Base, Ethereum or Arc and Relay delivers on Solana. Relay's public requests feed identifies the app's requests (fee address or referrer) with what the user sent in USD, the fees, both hashes and the status. Value received = what the settlement delivered on Solana: USDC / SOL exactly (FOMO funds the wallet this way; the token buy that follows is a native swap in the FOMO row) or a token at the pool's state before the swap."
  - "Cross-chain split: terminal = the app fee the user paid; network = origin gas plus the destination gas Relay charged (its fee breakdown); relay = Relay's fixed and price fees plus the solver's spread (deposit minus received minus app fee minus that gas); pool only when a token was delivered. A token sold on the origin chain is priced at that chain's pool state in its per-chain row. Refunds and failures count in the fail rate. Perps are not measured; swaps under $2 are dropped."
  - "Trading on another chain (FOMO on Robinhood Chain, BNB, Base, Ethereum, Arc): the user pays in USDC or SOL from the FOMO wallet, a Relay solver buys the token there. Value given = what was sent (tx fee inside); value received = the tokens delivered at the pool's state before the settlement swap: v2 forks from the Sync reserves minus the swap, v3 forks and Uniswap v4 from the price left by the previous swap on the pool, all from the pool's own logs on public RPCs."
  - "Which side of an EVM pool is the token is settled by matching the swap event's amounts with the receipt's transfers, not the pool's token order. Split: terminal = the app fee; relay = what Relay kept (fees, spread, gas); pool = the settlement swap's impact and LP fee; network = the Solana tx fee (0 when the app's sponsor signs). Sales the other way (a token sold on that chain, USDC or SOL delivered on Solana) sit in the same per-chain row, priced at the origin pool's state before the sale."
  - "FOMO sponsors gas: its own signer pays the tx fee, so the user's network cost is zero; its fee is a router commission plus user-signed USDC legs, all counted as terminal fee. pump.fun's app takes no fee; the fixed 0.001 SOL it forwards on some swaps is counted as network."
  - "Native EVM (GMGN and Axiom on BNB and Robinhood Chain, Banana Gun): their router contracts emit an event on every swap; eth_getLogs on those routers lists every successful swap they routed; the fail rate comes from a sample of blocks read in full (every tx sent to the routers, reverted or not). Value given = what the user sent plus gas; received = the tokens at the pool's state before the swap; the fee is paid inside the router as a native transfer: the residual after pool and gas."
  - "Unpriced draws: on the EVM rows a share of the drawn swaps (about a sixth on BNB; on Robinhood Chain 2 of 35 fills on 2026-09-21 once the launchpad curves and ETH-quoted v4 pools were decoded) cannot be valued at the pool's state and stays out of the figure; a token launch's first curve buy is its own reject (launch_first_trade), not a fill; each entry's unpriced_share and its rejects in the JSON say how much and why."
  - "Cohort discovery: the fee wallets and routers are learned from the chain, the lists being the seed. On a platform's transactions (Mobula's attribution as the sample, every 6 h), a recipient taking a fixed share of the trade across many payers is its fee wallet, adopted from 30 swaps of 20 payers with a stable 20 to 300 bps share; on EVM the transactions' destination is its router. The window's swaps also give the fee-like recipients no terminal lists yet (JSON, 'discovery')."
  - "Phantom (Solana): its in-wallet swap pays 0.85 % to its fee wallet in SOL or WSOL, sampled like the other Solana terminals. Binance Wallet (BSC, Ethereum, Base): one router on the three chains, no event of its own, so its swaps are the transactions sent to it in blocks read in full; valued like the other native EVM rows. Terminal's EVM fee wallets get under $10 a day: not measured. Banana Gun on Ethereum: buys only, no fee, its users sell on Uniswap directly; held out (one side)."
  - "four.meme's bonding curve on BNB is priced exactly: the curve is a constant product on virtual reserves (checked on consecutive trades to 1e-12), its constants come from the TokenManager's token info, so the mid before the trade is known; the launchpad's 1 % fee is 'other', like pump.fun's on Solana."
  - "Kept out of that residual: a fee the pool's own hook keeps (v4 launchpad pools on Robinhood Chain 1 %, BNB 3.8 %, paid whatever the router) is a pool cost; a native leg (BNB sent, ETH received) is valued at the mid of the route's own stable-to-gas-coin hop before that hop, so the hop's LP fee and impact stay a pool cost; Axiom's inclusion tip (0.0025 BNB fixed; on Robinhood Chain the user's setting, from the call trace) is network cost, like the Solana tip relays."
  - "Not in the table: BullX (suspended June 2026), Nova (no live fee wallet), Bloom on Base and Ethereum (a swap an hour), Photon on EVM. BasedBot's Relay requests are its in-app bridge between the user's Solana and EVM wallets, both ways, no app fee (a bridge leg, not a trade); its EVM rows are those wallets' swaps on its router. On Solana its fee is a separate transaction after the swap, so failed swaps are not seen: no fail rate there."

findings:
  - "{{best_name}} fills cheapest: a median {{best_p50}} lost per swap against the pool's state before the trade, all costs included."
  - "The advertised 1 % fee is the smallest constant: pump.fun protocol and creator fees add about 100 to 140 bps on curve and PumpSwap trades whichever terminal routes them."
  - "Network cost separates the Telegram bots: Maestro's tips through its own relay approach a percent of a median swap, Bloom, Trojan and Photon sit in the tens of basis points, Axiom and Phantom at a few."
  - "Failed swaps are a hidden cost: on the busiest terminals several percent of swap attempts fail on-chain and still pay the priority fee (unless the app sponsors gas, as FOMO does)."

faq:
  - q: "What is the reference price and why does it matter?"
    a: "The token side of a swap has no price of its own; it has to be valued at something. This bench values it at the pool's mid price just before the swap: exactly, from the pool's own pre-trade balances in the transaction, on PumpSwap (with the virtual quote reserve its migrated pools store), Raydium, Launchpad, Meteora DLMM, four.meme and the EVM pools; and, where the pool's formula is not known or the route crosses several pools, at the effective price of the previous trade on the same pool, at most 60 seconds earlier and usually under one. That is the arrival price a TCA desk would use. Valuing at the price after the swap would hide the trade's own impact. When neither is available the swap keeps its exact cost split but no loss figure; no off-chain token price is used for the token side; on the EVM rows the gas-coin leg is valued at the route's own stable-to-gas hop pre-trade mid (the executed rate as fallback), and origin gas at Coinbase spot."
  - q: "Why is the loss much larger than the terminal's 1 % fee?"
    a: "Because the fee is one of five costs. On a pump.fun curve or PumpSwap trade the protocol and creator fees add roughly 1 to 1.4 %, the pool keeps its LP fee and the price impact of the trade, the app attaches a priority fee and often an inclusion tip, and the pool's price may already have moved between the arrival trade and ours. The split is published per terminal so the terminal-attributable part is visible on its own."
  - q: "Is this comparable across terminals?"
    a: "The explicit components (terminal, network) are exact and terminal-attributable. The pool component depends on what users trade and how much, which differs per app (Photon's and FOMO's median swaps are about $20), so read the total loss together with the trade size column and the size buckets. A terminal is marked ranked from 100 priced swaps; read the 95 % interval next to each median, adjacent ranks often overlap; single swaps are not comparable."
  - q: "Are sandwiches counted?"
    a: "Screened, not ranked. A sandwich's two legs both touch the pool, so they are the user's neighbours in the pool's own transaction sequence: another signer trading the same direction just before, and back just after, in the same slot or the next. Every hit is in the JSON with the attacker and both signatures. It is not a column because the share of swaps that can be screened depends on how busy the pool is, which differs per terminal. The victim's extra cost is not a separate line either: the front-run precedes the user's swap, so the arrival price already carries it inside the pool component."
  - q: "How is a swap attributed to a terminal?"
    a: "By the fee it pays: every terminal transfers its fee to known wallets in the same transaction, and those wallet lists are the ones DeFiLlama's adapters use for volume, so attribution matches benches 201 and 267. Where the fee wallet is not enough: pump.fun's app and Banana Gun by their programs, Phantom by its fee token account, FOMO by the vanity account every FOMO transaction carries (its gas sponsor signs and is excluded as user), the EVM rows by the router the transaction was sent to (Binance Wallet from blocks read in full), the cross-chain rows by Relay's referrer or fee recipient (FOMO 0x9fc4…, pump.fun app 0xdab3…, verified by the Solana users behind them)."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/terminal-fill-quality

prometheus:
  window: 24h
  freshness_metric: tfq_health
  expected_freshness_seconds: 900
  probe_ok: time() - tfq_last_refresh_unix < 900

panel_main_description: "Median value lost per swap against the pool's state before the trade, all costs included, basis points of the trade. Rolling 24 h of sampled user swaps. The split columns are medians of each cost (on All chains, the chains' medians weighted by their flow): they do not sum to the median loss."

metric_panels:
  - id: terminal_fee
    label: Terminal fee
    label_key: terminal
    metric: tfq_component_bps{component="terminal",chain="all"}
    unit: bp
    higher_is_better: false
    description: "Median share of the trade the terminal took: what reached its fee wallets on Solana, the router's residual after the pool and the gas on the EVM rows, the app fee on Relay legs."
  - id: network
    label: Network
    label_key: terminal
    metric: tfq_component_bps{component="network",chain="all"}
    unit: bp
    higher_is_better: false
    description: "Median transaction fee paid by the user plus inclusion tips (Jito and the terminal's own relay), share of the trade; on cross-chain rows the destination gas Relay charged (its fee breakdown) is included. Zero when the terminal sponsors gas."
  - id: pool
    label: Pool
    label_key: terminal
    metric: tfq_component_bps{component="pool",chain="all"}
    unit: bp
    higher_is_better: false
    description: "Median of loss minus terminal, network, other and relay: the final pool's LP fee and price impact (on the EVM rows the stable-to-gas-coin hop's own cost included, the native leg being valued at that hop's pre-trade mid)."
  - id: relay
    label: Relay
    label_key: terminal
    metric: tfq_component_bps{component="relay",chain="all"}
    unit: bp
    higher_is_better: false
    tab: false
    description: "Relay's fixed and price fees plus the solver's spread (deposit minus received minus app fee minus the destination gas, which is in Network), share of the trade: the chain row's median; on All chains flow-weighted, blank when the bridged rows carry under half the flow."
  - id: other
    label: Protocol fees
    label_key: terminal
    metric: tfq_component_bps{component="other",chain="all"}
    unit: bp
    higher_is_better: false
    tab: false
    description: "What the protocol took, median share of the trade: launchpad and curve fees (pump.fun; the EVM launchpads' 1 % plus a creator fee set per token), referral payouts, and on routed swaps the routers' cuts and hop leftovers (a residual over a quarter of the trade stays in Pool)."
  - id: fail_rate
    label: Failed swaps
    label_key: terminal
    metric: tfq_fail_rate_pct{chain="all"}
    unit: pct
    higher_is_better: false
    description: "Share of the terminal's swap attempts that failed on-chain in the window; the priority fee is paid anyway."
  - id: trade_usd
    label: Median swap
    label_key: terminal
    metric: tfq_trade_usd{chain="all",stat="median"}
    unit: usd
    higher_is_better: false
    tab: false
    description: "Median sampled trade size in USD."
  - id: fail_overhead
    label: Failure overhead
    label_key: terminal
    metric: tfq_fail_overhead_bps{chain="all"}
    unit: bp
    higher_is_better: false
    tab: false
    description: "Expected fee burnt on failed attempts per successful swap: fail rate / (1 − fail rate) × median failed-attempt fee, bps of the median trade."
  - id: lost_usd
    label: Lost per swap
    label_key: terminal
    metric: tfq_lost_usd{chain="all"}
    unit: usd
    higher_is_better: false
    tab: false
    description: "Median loss applied to the median trade: what the typical swap on this terminal loses, in dollars."
  - id: priced
    label: Swaps sampled
    label_key: terminal
    metric: tfq_sample_size{chain="all",kind="priced"}
    unit: count
    higher_is_better: true
    tab: false
    description: "Priced swaps in the rolling window."

ledger_reliability: false
ledger_columns:
  - { label: "Value lost", slot: p50 }
  - { label: "Median swap", panel: trade_usd }
  - { label: "Lost / swap", panel: lost_usd }
  - { label: "Terminal fee", panel: terminal_fee }
  - { label: "Network", panel: network }
  - { label: "Pool", panel: pool }
  - { label: "Relay", panel: relay }
  - { label: "Protocol fees", panel: other }
  - { label: "Failed swaps", panel: fail_rate }

dimensions:
  chain:
    - { value: all,       label: All chains }
    - { value: solana,    label: Solana }
    - { value: bnb,       label: BNB Chain }
    - { value: robinhood, label: Robinhood Chain }
    - { value: base,      label: Base }
    - { value: ethereum,  label: Ethereum }
    - { value: arc,       label: Arc }
    - { value: hyperevm,  label: HyperEVM }

providers:
  - slug: axiom
    name: Axiom
    tag: "Terminal, Solana + BNB + Robinhood Chain"
    formula: "Solana: random sample of the swaps paying Axiom's fee wallets. BNB, Robinhood Chain: swaps routed through its own contracts. All valued at the pool's state before the trade; loss in bps of the trade, median over 24 h."
    queries:
      p50: tfq_loss_bps{terminal="axiom",chain="all",stat="median"}
      p90: tfq_loss_bps{terminal="axiom",chain="all",stat="p90"}
      p99: tfq_loss_bps{terminal="axiom",chain="all",stat="p99"}
      success: tfq_health{terminal="axiom",chain="all"}
      ranked: tfq_ranked{terminal="axiom",chain="all"}
      sample_size: tfq_sample_size{terminal="axiom",chain="all",kind="priced"}
      series: tfq_loss_bps{terminal="axiom",chain="all",stat="median"}

  - slug: gmgn
    name: GMGN
    tag: "Terminal, Solana + BNB + Robinhood Chain + Ethereum + Base + Arc + HyperEVM"
    formula: "Solana: random sample of the swaps paying GMGN's fee wallets. EVM (BNB, Robinhood Chain, Ethereum, Base, Arc, HyperEVM): swaps routed through its own routers. All valued at the pool's state before the trade; loss in bps, median over 24 h."
    queries:
      p50: tfq_loss_bps{terminal="gmgn",chain="all",stat="median"}
      p90: tfq_loss_bps{terminal="gmgn",chain="all",stat="p90"}
      p99: tfq_loss_bps{terminal="gmgn",chain="all",stat="p99"}
      success: tfq_health{terminal="gmgn",chain="all"}
      ranked: tfq_ranked{terminal="gmgn",chain="all"}
      sample_size: tfq_sample_size{terminal="gmgn",chain="all",kind="priced"}
      series: tfq_loss_bps{terminal="gmgn",chain="all",stat="median"}

  - slug: fomo
    name: FOMO
    tag: "Terminal, Solana + Robinhood Chain + BNB + Base + Ethereum + Arc, gas sponsored"
    formula: "Solana: random sample of the swaps paying FOMO's USDC fee wallet. Other chains: its trades executed through Relay (SOL in, tokens delivered there). Valued at the pool's state before the trade; loss in bps, median over 24 h."
    queries:
      p50: tfq_loss_bps{terminal="fomo",chain="all",stat="median"}
      p90: tfq_loss_bps{terminal="fomo",chain="all",stat="p90"}
      p99: tfq_loss_bps{terminal="fomo",chain="all",stat="p99"}
      success: tfq_health{terminal="fomo",chain="all"}
      ranked: tfq_ranked{terminal="fomo",chain="all"}
      sample_size: tfq_sample_size{terminal="fomo",chain="all",kind="priced"}
      series: tfq_loss_bps{terminal="fomo",chain="all",stat="median"}

  - slug: phantom
    name: Phantom
    tag: "Wallet, Solana + Robinhood Chain + Ethereum + Base + Arc"
    formula: "Solana: random sample of the swaps paying Phantom's in-wallet fee (0.85 %). Other chains: its swaps through Relay (CASH, SOL or USDC in, tokens delivered there, 85 bps app fee). Valued at the pool's state before the trade; median over 24 h."
    queries:
      p50: tfq_loss_bps{terminal="phantom",chain="all",stat="median"}
      p90: tfq_loss_bps{terminal="phantom",chain="all",stat="p90"}
      p99: tfq_loss_bps{terminal="phantom",chain="all",stat="p99"}
      success: tfq_health{terminal="phantom",chain="all"}
      ranked: tfq_ranked{terminal="phantom",chain="all"}
      sample_size: tfq_sample_size{terminal="phantom",chain="all",kind="priced"}
      series: tfq_loss_bps{terminal="phantom",chain="all",stat="median"}

  - slug: photon
    name: Photon
    tag: "Terminal, Solana"
    formula: "Random sample of the swaps paying Photon's fee wallet, valued at the pool's state before the trade; loss in bps of the trade, median over the rolling 24 h."
    queries:
      p50: tfq_loss_bps{terminal="photon",chain="all",stat="median"}
      p90: tfq_loss_bps{terminal="photon",chain="all",stat="p90"}
      p99: tfq_loss_bps{terminal="photon",chain="all",stat="p99"}
      success: tfq_health{terminal="photon",chain="all"}
      ranked: tfq_ranked{terminal="photon",chain="all"}
      sample_size: tfq_sample_size{terminal="photon",chain="all",kind="priced"}
      series: tfq_loss_bps{terminal="photon",chain="all",stat="median"}

  - slug: trojan
    name: Trojan
    tag: "Telegram bot, Solana"
    formula: "Random sample of the swaps paying Trojan's 6 fee wallets, valued at the pool's state before the trade; loss in bps of the trade, median over the rolling 24 h."
    queries:
      p50: tfq_loss_bps{terminal="trojan",chain="all",stat="median"}
      p90: tfq_loss_bps{terminal="trojan",chain="all",stat="p90"}
      p99: tfq_loss_bps{terminal="trojan",chain="all",stat="p99"}
      success: tfq_health{terminal="trojan",chain="all"}
      ranked: tfq_ranked{terminal="trojan",chain="all"}
      sample_size: tfq_sample_size{terminal="trojan",chain="all",kind="priced"}
      series: tfq_loss_bps{terminal="trojan",chain="all",stat="median"}

  - slug: bloom
