# OpenChainBench. Bench 268

slug: terminal-fill-quality
number: "268"
title: "Trading terminal fill quality 2026: what a swap costs on Axiom, GMGN, FOMO, Photon, Trojan, measured on-chain"
seo_title: "Trading terminal fill quality 2026: Axiom vs GMGN vs FOMO vs Photon vs Trojan, cost per swap on-chain"
seo_description: "{{best_name}} fills cheapest at a median {{best_p50}} lost per swap against the pool's state before the trade. Real Solana swaps read on-chain for {{count}} trading terminals and Telegram bots: terminal fee, priority fee and inclusion tips, pump.fun and pool costs, failed swaps."
subtitle: Value lost per swap on each Solana trading terminal or Telegram bot, from real user transactions read on-chain and valued at the pool's own state before the trade. Split into what the terminal takes, what the network takes, what pump.fun and the pool take, plus the share of swap attempts that fail. Rolling 24 hours, refreshed every minute.

category: Trading
status: live
metric: Cost per swap
unit: bp
higher_is_better: false

disclaimer: |
  Random sample (300 per terminal per day) of the swaps each terminal routed, every attempt counted for the fail rate. Reference = the pool's state before the swap (exact reserves on PumpSwap and Raydium, the previous trade on the pool within 60 s elsewhere); swaps without one keep their cost split but no loss figure. The trade's own impact is inside. A terminal is published from 50 priced swaps and ranked from 100; the median's 95 % interval is in the JSON. Compare medians, not single swaps.

seo_intro: |
  Every trading terminal advertises a fee. What a swap actually costs is the
  fee plus the priority fee and the inclusion tip the app attaches, plus what
  pump.fun or the pool keep on the way, plus the price move between the moment
  the user clicked and the moment the swap landed, plus the swaps that fail
  and still burn the priority fee. None of that is in the fee schedule, all of
  it is in the transaction. This benchmark reads real user swaps on Solana for
  Axiom, GMGN, FOMO, Photon, Trojan, Bloom, Maestro, Pepeboost, BONKbot,
  Banana Gun and pump.fun's own app, values the tokens received at the pool's
  state before the swap (its reserves, or the previous trade on it seconds
  earlier) and publishes the median shortfall in basis points with its split:
  terminal, network, pool, other. A terminal fee of 1 % is 100 bps; the median
  swap on most terminals loses three to five times that.

abstract: |
  Each terminal takes its fee through known wallets. A live WebSocket feed of
  every transaction mentioning those wallets, with its program logs, says which
  ones attempted a swap and whether they failed; the harness counts them all
  (fail rate) and reads 300 successful ones per terminal per day, drawn at
  random. From the pre/post balances of every account in the transaction it
  derives, in quote units (SOL or a $1 stable), what left the user, what the
  pool received, what reached the terminal's fee wallets, the tx fee and the
  inclusion tips, and the rest (pump.fun protocol and creator fees, referral
  payouts). The pool is the vault pair of the swap instruction, by pubkey, so
  a hop through another pool of the same program is never mistaken for pool
  impact. The token leg is valued at the pool's mid before the swap: exactly
  from the pool's pre-trade balances in the transaction on PumpSwap (with the
  virtual quote reserve its migrated pools store) and Raydium, else at the
  effective price of the previous trade on the same pool, at most 60 seconds
  earlier. Loss = 1 − value received / value given, in basis points of the
  trade; the split is exact and independent of the reference. Rolling 24 hour
  window, medians with a bootstrap interval, p90, trade size and venue mix per
  terminal; published from 50 priced swaps, ranked from 100.

methodology:
  - "Sampling: a WebSocket feed of every transaction mentioning each terminal's fee wallets (DeFiLlama adapters, Dune's spellbook: Axiom 22, GMGN 9, Trojan 6, Terminal 2, the others 1; pump.fun's app and Banana Gun also by program). The logs say whether a swap program was invoked: only those count as attempts, all of them for the fail rate; 300 successful ones per terminal per day are read, drawn at random with the tick's activity as weight. Rolling 24 h."
  - "The user is the signer whose token balance moved; when nobody signed for the user (limit, DCA and auto-sell orders executed by the terminal's keeper), the wallet whose token account moved against its SOL / stable balance, never a program-derived pool address. Quote assets: SOL, USDC, USDT, USD1, USDS, PYUSD; token-to-token swaps are not measured."
  - "Quote side, exact from balance deltas: user_q = what left or reached the user's SOL / WSOL / stable balance, the tx fee included when the user paid it, rent of accounts created or closed in the transaction excluded; pool_q = the pool's quote movement, converted to the user's quote unit when the pool is quoted differently; terminal_q = lamports, WSOL or stables landing in the fee wallets (FOMO: plus its user-signed USDC legs, under 2 % of the trade)."
  - "network_q = tx fee if the user paid it + inclusion tips: Jito, 0slot, bloXroute, Astralane, Nozomi and each terminal's own relay accounts (Axiom, Trojan, Maestro, Photon, Pepeboost, pump.fun app). other_q = user_q minus pool_q, terminal_q and network_q on single-pool routes without hops (pump.fun protocol and creator fees, referral payouts); on routed swaps it stays inside pool."
  - "Pool identity: the token vault that moved against the user and the quote vault of the same swap instruction, both by pubkey. Two pools behind one shared authority (Raydium, Launchpad, Meteora DAMM v2) never merge, so a hop through a sibling pool is never read as pool impact and the previous-trade lookup only sees that pool."
  - "Reference price, in order: the pool's exact pre-trade mid from its balances in the transaction on one constant-product pool (PumpSwap with its migrated pools' virtual quote reserve, Raydium v4 / CPMM); the venue's swap event when it carries the state before the trade (Launchpad reserves, Meteora DLMM start bin), accepted only when it reconciles with the vault deltas; else the previous trade on the same pool at most 60 s old (pump.fun curve, CLMM, DBC, routed swaps). No off-chain price."
  - "Loss (headline): buy = 1 − tokens × ref / user_q; sell = 1 − user_q / (tokens × ref). Basis points of the trade (buy: quote spent, sell: tokens × ref). Pool = loss minus terminal, network and other; the four sum to the loss. Losses outside −10 % to +50 % are parsing or reference errors and stay out (flagged in the JSON). Median over priced samples with its 95 % bootstrap interval; p90 shown."
  - "A terminal is published from 50 priced swaps in the window and ranked from 100: below that the median's interval is wider than the gaps between terminals. The previous-trade reference carries the previous trader's direction, so terminals priced mostly that way read some tens of bps worse in buy waves than on the exact mid."
  - "Fail rate: failed over every swap attempt the feed saw on the terminal's wallets in the window, exhaustive; wallet funding, fee sweeps and marker transfers invoke no swap program and are not attempts. Error classes (slippage, insufficient funds, program codes) are in the JSON."
  - "Cost of failures: 40 failed attempts per terminal per day are read for the fee they paid (a failed transaction executes nothing but pays base + priority fee; zero when the terminal sponsors gas). Failure overhead = fail rate / (1 − fail rate) × median failed fee, in bps of the median trade: what a successful swap carries on average in wasted attempts. Published apart from the cost per swap, not added to it."
  - "PumpSwap's vault ratio alone is not the mid: pools migrated from pump.fun add a virtual quote reserve (about 17.6 SOL) that the pool account stores; with it x·y = k matches executed trades exactly. pump.fun's 2026 bonding curve fills 20 to 60 % above its stored virtual_sol / virtual_token, so the curve gets the previous-trade reference instead."
  - "Sandwiches: each sampled swap's neighbours on its pool are screened (another signer trading our direction in our slot just before, and back just after, closing a comparable position with a take). Kept per swap in the JSON with the attacker and both signatures, not published as a column: how many swaps can be screened depends on pool activity, so terminals are not comparable on it."
  - "Trade-size buckets (under $25, $25 to $250, over $250): median loss per bucket in the public JSON and on each product page, so terminals with different typical trade sizes are compared at equal size."
  - "Cross-chain (FOMO, BasedBot): the user pays on BNB, Robinhood Chain, Base, Ethereum or Arc and Relay delivers on Solana. Relay's public requests feed identifies the app's requests (fee address or referrer) with what the user sent in USD, the fees, both hashes and the status. Value received = what the settlement delivered on Solana: USDC / SOL exactly (FOMO funds the wallet this way; the token buy that follows is a native swap in the FOMO row) or a token at the pool's state before the swap."
  - "Cross-chain split: terminal = the app fee the user paid; network = the origin gas (receipt on the chain's public RPC); relay = Relay's fees and spread (deposit minus received minus app fee); pool only when a token was delivered. Requests paid with a token on the origin chain are shown but not counted (their value in is Relay's own valuation). Refunds and failures count in the fail rate. Perps are not measured; swaps under $2 are dropped."
  - "Trading on another chain (FOMO on Robinhood Chain, BNB, Base, Ethereum, Arc; BasedBot on Robinhood Chain, HyperEVM): the user pays in SOL, a Relay solver buys the token there. Value given = the SOL sent (tx fee inside); value received = the tokens delivered at the pool's state before the settlement swap: v2 forks from the Sync reserves minus the swap, v3 forks and Uniswap v4 from the price left by the previous swap on the pool, all from the pool's own logs on public RPCs."
  - "Which side of an EVM pool is the token is settled by matching the swap event's amounts with the receipt's transfers, never by reading the pool's token order. Split: terminal = the app fee; relay = what Relay kept (fees, spread, destination gas); pool = the settlement swap's impact and LP fee; network = the Solana tx fee. Sales the other way (a token sold on that chain, USDC or SOL delivered on Solana) sit in the same per-chain row, priced at the origin pool's state before the sale."
  - "FOMO sponsors gas: its own signer pays the tx fee, so the user's network cost is zero; its fee is a router commission plus user-signed USDC legs, all counted as terminal fee. pump.fun's app takes no fee; the fixed 0.001 SOL it forwards per swap is counted as network."
  - "Native EVM (GMGN and Axiom on BNB and Robinhood Chain, Banana Gun): their router contracts emit an event on every swap; eth_getLogs on those routers lists every successful swap they routed; the fail rate comes from a sample of blocks read in full (every tx sent to the routers, reverted or not). Value given = what the user sent plus gas; received = the tokens at the pool's state before the swap; the fee is paid inside the router as a native transfer: the residual after pool and gas."
  - "Cohort discovery: the fee wallets and routers are learned from the chain, the lists being the seed. On a platform's transactions (Mobula's attribution as the sample, every 6 h), a recipient taking a fixed share of the trade across many payers is its fee wallet, adopted from 30 swaps of 20 payers with a stable 20 to 300 bps share; on EVM the transactions' destination is its router. The window's swaps also give the fee-like recipients no terminal lists yet (JSON, 'discovery')."
  - "Phantom (Solana): its in-wallet swap pays 0.85 % to its fee wallet in SOL or WSOL, sampled like the other Solana terminals. Binance Wallet (BSC, Ethereum, Base): one swap router on the three chains, no event of its own, so its swaps are the transactions sent to it in the blocks read in full; valued and split like the other native EVM rows. Terminal's EVM fee wallets get under $10 a day: not measured. Banana Gun on Ethereum: no fee visible on-chain, terminal 0."
  - "four.meme's bonding curve on BNB is priced exactly: the curve is a constant product on virtual reserves (checked on consecutive trades to 1e-12), its constants come from the TokenManager's token info, so the mid before the trade is known; the launchpad's 1 % fee is 'other', like pump.fun's on Solana."
  - "Kept out of that residual: a fee the pool's own hook keeps (Uniswap v4 launchpad pools on Robinhood Chain, 1 %, and BNB, 3.8 %, paid whatever the router) is a pool cost; a native leg (BNB sent, ETH received) is valued at the rate the route itself swapped the gas coin at, not at an exchange's print; Axiom's inclusion tip on every transaction (a fixed 0.0025 BNB; on Robinhood Chain the user's own setting, read from the call trace) is network cost, like the Solana terminals' own tip relays."
  - "Not in the table: BullX (trading suspended since 2026-06-01, its fee wallets only see marker transfers), Nova (no live fee wallet), BasedBot's native Solana swaps (DeFiLlama's addresses belong to a launchpad and bid mechanism, not the trading bot, and the bot's fee wallet is not published; its cross-chain requests are public on Relay and measured). Each joins the day a live wallet is known."

findings:
  - "{{best_name}} fills cheapest: a median {{best_p50}} lost per swap against the pool's state before the trade, all costs included."
  - "The advertised 1 % fee is the smallest constant: pump.fun protocol and creator fees add about 100 to 200 bps on curve and PumpSwap trades whichever terminal routes them."
  - "Network cost separates the Telegram bots: Bloom, Trojan and Maestro attach tips through Jito or their own relays worth tens of basis points on a median swap, Axiom and GMGN a few."
  - "Failed swaps are a hidden cost: on the busiest terminals several percent of swap attempts fail on-chain and still pay the priority fee."

faq:
  - q: "What is the reference price and why does it matter?"
    a: "The token side of a swap has no price of its own; it has to be valued at something. This bench values it at the pool's mid price just before the swap: exactly, from the pool's own pre-trade balances in the transaction, on PumpSwap (with the virtual quote reserve its migrated pools store) and Raydium; and, where the pool's formula is not known or the route crosses several pools, at the effective price of the previous trade on the same pool, at most 60 seconds earlier and usually under one. That is the arrival price a TCA desk would use. Valuing at the price after the swap would hide the trade's own impact. When neither is available the swap keeps its exact cost split but no loss figure; no off-chain price is used."
  - q: "Why is the loss much larger than the terminal's 1 % fee?"
    a: "Because the fee is one of five costs. On a pump.fun curve or PumpSwap trade the protocol and creator fees add roughly 1 to 2 %, the pool keeps its LP fee and the price impact of the trade, the app attaches a priority fee and often an inclusion tip, and the pool's price may already have moved between the arrival trade and ours. The split is published per terminal so the terminal-attributable part is visible on its own."
  - q: "Is this comparable across terminals?"
    a: "The explicit components (terminal, network) are exact and terminal-attributable. The pool component depends on what users trade and how much, which differs per app (Photon's median swap is small, FOMO's is hundreds of dollars), so read the total loss together with the trade size column and the size buckets. A terminal is ranked from 100 priced swaps, where the median's 95 % interval is narrower than the gaps between terminals; single swaps are not comparable."
  - q: "Are sandwiches counted?"
    a: "Screened, not ranked. A sandwich's two legs both touch the pool, so they are the user's neighbours in the pool's own transaction sequence: another signer trading the same direction just before, and back just after, in the same slot or the next. Every hit is in the JSON with the attacker and both signatures. It is not a column because the share of swaps that can be screened depends on how busy the pool is, which differs per terminal. The victim's extra cost is not a separate line either: the front-run precedes the user's swap, so the arrival price already carries it inside the pool component."
  - q: "How is a swap attributed to a terminal?"
    a: "By the fee it pays: every terminal transfers its fee to known wallets in the same transaction, and those wallet lists are the ones DeFiLlama's adapters use for volume, so attribution matches benches 201 and 267. FOMO's gas sponsor signs every transaction and is excluded as user; pump.fun's app is recognised by its app program."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/terminal-fill-quality

prometheus:
  window: 24h
  freshness_metric: tfq_health
  expected_freshness_seconds: 900

panel_main_description: "Median value lost per swap against the pool's state before the trade, all costs included, basis points of the trade. Rolling 24 h of sampled user swaps."

metric_panels:
  - id: terminal_fee
    label: Terminal fee
    label_key: terminal
    metric: tfq_component_bps{component="terminal"}
    unit: bp
    higher_is_better: false
    description: "Median share of the trade that reached the terminal's fee wallets."
  - id: network
    label: Network
    label_key: terminal
    metric: tfq_component_bps{component="network"}
    unit: bp
    higher_is_better: false
    description: "Median transaction fee paid by the user plus inclusion tips (Jito and the terminal's own relay), share of the trade. Zero when the terminal sponsors gas."
  - id: pool
    label: Pool
    label_key: terminal
    metric: tfq_component_bps{component="pool"}
    unit: bp
    higher_is_better: false
    description: "Median of loss minus terminal, network and other: LP fee and price impact, plus hop costs on routed swaps."
  - id: relay
    label: Relay
    label_key: terminal
    metric: tfq_component_bps{component="relay"}
    unit: bp
    higher_is_better: false
    tab: false
    description: "Cross-chain rows: median of Relay's fees and spread (deposit minus received minus app fee), share of the trade."
  - id: other
    label: Other fees
    label_key: terminal
    metric: tfq_component_bps{component="other"}
    unit: bp
    higher_is_better: false
    tab: false
    description: "Median quote that reached neither pool, terminal nor network on single-pool swaps: pump.fun protocol and creator fees, referral payouts."
  - id: fail_rate
    label: Failed swaps
    label_key: terminal
    metric: tfq_fail_rate_pct
    unit: pct
    higher_is_better: false
    description: "Share of the terminal's swap attempts that failed on-chain in the window; the priority fee is paid anyway."
  - id: trade_usd
    label: Median trade
    label_key: terminal
    metric: tfq_trade_usd{stat="median"}
    unit: usd
    higher_is_better: true
    tab: false
    description: "Median sampled trade size in USD."
  - id: fail_overhead
    label: Failure overhead
    label_key: terminal
    metric: tfq_fail_overhead_bps
    unit: bp
    higher_is_better: false
    tab: false
    description: "Expected fee burnt on failed attempts per successful swap: fail rate / (1 − fail rate) × median failed-attempt fee, bps of the median trade."
  - id: priced
    label: Swaps sampled
    label_key: terminal
    metric: tfq_sample_size{kind="priced"}
    unit: count
    higher_is_better: true
    tab: false
    description: "Priced swaps in the rolling window."

ledger_columns:
  - { label: "Cost per swap", slot: p50 }
  - { label: "Terminal fee", panel: terminal_fee }
  - { label: "Network", panel: network }
  - { label: "Pool", panel: pool }
  - { label: "Failed swaps", panel: fail_rate }
  - { label: "Median trade", panel: trade_usd }

providers:
  - slug: axiom
    name: Axiom
    tag: "Terminal, Solana"
    formula: "Random sample of the swaps paying Axiom's 22 fee wallets, valued at the pool's state before the trade; loss in bps of the trade, median over the rolling 24 h."
    queries:
      p50: tfq_loss_bps{terminal="axiom",stat="median"}
      p90: tfq_loss_bps{terminal="axiom",stat="p90"}
      p99: tfq_loss_bps{terminal="axiom",stat="p90"}
      success: tfq_health{terminal="axiom"}
      sample_size: tfq_sample_size{terminal="axiom",kind="priced"}
      series: tfq_loss_bps{terminal="axiom",stat="median"}

