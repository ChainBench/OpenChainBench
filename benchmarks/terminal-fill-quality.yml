    tag: "Terminal, Solana"
    formula: "Newest swaps paying Axiom's 20 fee wallets, valued at the previous trade on the same pool; loss in bps of the trade, median over the rolling 24 h."
    queries:
      p50: tfq_loss_bps{terminal="axiom",stat="median"}
      p90: tfq_loss_bps{terminal="axiom",stat="p90"}
      p99: tfq_loss_bps{terminal="axiom",stat="p90"}
      mean: tfq_loss_bps{terminal="axiom",stat="mean"}
      success: tfq_health{terminal="axiom"}
