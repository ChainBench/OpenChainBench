# OpenChainBench. Bench № 189

slug: etherlink-rpc
number: "189"
title: "Etherlink RPC endpoints: free public URLs ranked by latency"
seo_title: "Etherlink RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Etherlink RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Etherlink EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Etherlink (chain 42793) is a Tezos L2 using Smart Rollup technology, offering EVM compatibility backed by the Tezos Foundation. XTZ is the bridged gas token. {{count}} keyless endpoints are probed continuously, each listed with its URL in the endpoints table on this page.

abstract: |
  Etherlink: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:etherlink-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Etherlink endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Etherlink-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Etherlink-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"etherlink\"`. Provider coverage at launch: {{count}} no-key endpoints."

faq:
  - q: "Which Etherlink RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing, each listed with its URL in the endpoints table above."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="etherlink"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: etherlink-official
    name: Etherlink Foundation
    endpoint: https://node.mainnet.etherlink.com
    tag: Etherlink official public RPC endpoint
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions to Etherlink's no-key endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="etherlink-official", chain="etherlink"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="etherlink-official", chain="etherlink"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="etherlink-official", chain="etherlink"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="etherlink-official", chain="etherlink"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="etherlink-official", chain="etherlink"}) / sum(ocb:rpc_call:rate_24h{provider="etherlink-official", chain="etherlink"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="etherlink-official", chain="etherlink"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="etherlink-official", chain="etherlink"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="etherlink-official", chain="etherlink", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="etherlink-official", chain="etherlink", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="etherlink-official", chain="etherlink", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="etherlink-official", chain="etherlink", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="etherlink-official", chain="etherlink", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="etherlink-official", chain="etherlink", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    endpoint: https://etherlink.drpc.org
    tag: dRPC public gateway for Etherlink mainnet
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions to dRPC's no-key Etherlink endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="etherlink"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="etherlink"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="etherlink"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="etherlink"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="etherlink"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="etherlink"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="etherlink"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="etherlink"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="etherlink", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="etherlink", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="etherlink", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="etherlink", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="etherlink", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="etherlink", region="sgp"}[1h])
