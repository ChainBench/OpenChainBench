# OpenChainBench. Bench № 041

slug: perp-volume-share
number: "041"
title: Perp DEX volume share, live 24h notional ranked
seo_title: "Perp DEX 24h volume: {{best_name}} leads at {{best_p50}}"
seo_description: "{{best_name}} leads perp DEX 24h volume at {{best_p50}} across {{count}} venues, Hyperliquid, Aster, Lighter, Kalshi and more, read from each venue's API every 5 minutes."
subtitle: 24h rolling perpetual futures notional volume in USD across the major decentralized venues, Ondo Perps included. Higher means more flow. Read live from each venue's public API.
category: Trading
status: live
metric: 24h perp volume
unit: usd
higher_is_better: true

seo_intro: |
  This benchmark ranks the major onchain perp venues by 24 hour rolling
  notional volume, in USD. Volume is the cleanest single-number proxy
  for where perpetual futures flow actually lives today. We poll each
  venue's public API every 5 minutes, read the venue's own trailing 24
  hour taker notional in USD, and publish a single gauge per venue.
  The cohort covers {{count}} venues with live data today, among them Hyperliquid, GMX V2, Gains, Aster,
  Lighter, GRVT, Extended, Pacifica, Nado, dYdX v4, Aevo, Paradex,
  Polymarket, Orderly, Backpack and Ondo Perps. Headline number is the 24h average of the live 24h gauge so
  a single noisy print does not move the ranking. The companion benches
  price the cost side (perp-fees for opening, perp-funding for holding);
  this one prices flow.

abstract: |
  The bench polls 15 perp DEX venues every 5 minutes for the trailing
  24 hour taker notional and exposes a USD gauge per venue. Sources:
  Hyperliquid info dayNtlVlm (per-asset day notional summed in USD),
  GMX V2 stats API (hourly buckets summed across Arbitrum and Avalanche),
  Gains backend volume-mix API (auto + direct notional, DefiLlama perimeter), Aster fapi 24h ticker
  per instrument, Lighter public stats endpoint, GRVT public markets,
  Extended API, Pacifica onchain reads, Nado archive, dYdX v4 indexer
  perpetualMarkets, Aevo public markets, Paradex markets summary. Each
  value carries a freshness timestamp and a health gauge so a stale or
  errored venue does not poison the leaderboard. Higher is better.

methodology:
  - "Cadence: every 5 minutes per venue in parallel, 10 second timeout per request."
  - "Hyperliquid: info dayNtlVlm summed across all assets, published as the trailing 24 hour taker notional in USD."
  - "GMX V2: stats.gmx.io hourly-volume API (groupPeriod=3600) for Arbitrum and Avalanche; last 24 hourly buckets summed for the rolling 24h notional in USD."
  - "Gains: Gains backend volume-mix API (backend-global.gains.trade), auto + direct notional per UTC day (opens and closes at full notional, resizes at traded delta, the same perimeter as DefiLlama and bench 266) over Arbitrum, Base, Polygon and MegaETH; rolling 24h = today so far plus the remaining share of yesterday."
  - "Aster: fapi 24h ticker per instrument, quoteVolume summed across all USDT perps."
  - "Lighter: public stats endpoint, 24h volume per market summed across markets in USD."
  - "GRVT: public markets endpoint, 24h volume per instrument summed in USD."
  - "Extended: public markets API, 24h volume per instrument summed in USD."
  - "Pacifica: onchain reads on the Solana program state for trailing 24h taker notional."
  - "Nado (the Vertex team's venue on Ink, published as Vertex until 2026-09-22): archive market_snapshots, cumulative volume per product diffed 24h apart and summed."
  - "Kalshi: margin/markets volume_24h_notional_value_dollars summed. Vest: /v2/ticker/24hr quoteVolume summed. StandX: summary.volume_quote_24h. ApeX Omni: turnover24h per live contract. Jupiter Perps: market-stats volume for SOL, ETH, WBTC. Lighter RH: exchangeStats daily_quote_token_volume. trade.xyz: dayNtlVlm of the xyz dex universe."
  - "dYdX v4: indexer perpetualMarkets, volume24H summed across markets in USD."
  - "Aevo: public markets endpoint, 24h volume per instrument summed in USD."
  - "Paradex: markets summary on Starknet L2, 24h volume summed across perps."
  - "Orderly: public volume/stats endpoint at api-evm.orderly.org; perp_volume_last_1_day gives rolling 24h USD notional across all EVM chains."
  - "Backpack: public tickers endpoint at api.backpack.exchange; quoteVolume summed across all *_PERP symbols in USDC."
  - "Headline. avg_over_time of the 24 hour volume gauge over the last 24 hours, so a one-print spike does not move the ranking. The Series tab plots the raw gauge."
  - "Failures. A venue that errors or times out keeps its last gauge value and its perp_venue_health gauge drops toward 0; the leaderboard tags it as stale."

