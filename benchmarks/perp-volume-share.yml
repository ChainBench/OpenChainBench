  - "{{name:pacifica}} sits at {{p50:pacifica}} of 24h notional. Solana-native onchain perps."
  - "{{name:extended}} sits at {{p50:extended}} of 24h notional. StarkEx-based perps venue."
  - "{{name:dydx}} sits at {{p50:dydx}} of 24h notional. Cosmos appchain orderbook."
  - "{{name:vertex}} sits at {{p50:vertex}} of 24h notional. Arbitrum orderbook plus AMM hybrid."
  - "{{name:paradex}} sits at {{p50:paradex}} of 24h notional. Starknet L2 perps."
  - "{{name:aevo}} sits at {{p50:aevo}} of 24h notional. Optimism L2 orderbook perps."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/perp-cohort-stats

prometheus:
  window: 24h
  expected_freshness_seconds: 1800

faq:
  - q: "What does this benchmark measure?"
    a: "The trailing 24 hour taker notional volume of 10 major perp DEX venues in USD. Headline is the 24h average of the live 24h gauge so single prints do not skew the ranking."
  - q: "Why 24h rolling instead of daily snapshots?"
    a: "Every venue in the cohort publishes a live rolling 24 hour window on its own public API, so a rolling comparison sidesteps timezone bucketing and the noise of a single calendar day. The 24h average smooths intraday micro-spikes without hiding regime shifts within the window."
  - q: "Which venues are in the cohort?"
    a: "Hyperliquid, Aster, Lighter, GRVT, Extended, Pacifica, Vertex, dYdX v4, Aevo and Paradex, the 10 decentralized perp venues whose public APIs expose 24h taker notional cleanly enough to compare without backfilling. Other venues join as their endpoints document the same series."
  - q: "Is this the same as DeFiLlama volume?"
    a: "Methodology is similar in spirit but each venue is queried directly here, not via an aggregator. Numbers should sit close to DeFiLlama on most days, divergences usually mean a downstream feed lagged."

providers:
  - slug: hyperliquid
    name: Hyperliquid
    tag: HyperBFT L1 perp DEX
    formula: "Sum across all assets of Hyperliquid info dayNtlVlm, published as the trailing 24 hour taker notional in USD; headline is the 24h time average."
    queries:
      p50: avg_over_time(perp_venue_volume_24h_usd{venue="hyperliquid"}[24h])
      p90: quantile_over_time(0.90, perp_venue_volume_24h_usd{venue="hyperliquid"}[24h])
      p99: quantile_over_time(0.99, perp_venue_volume_24h_usd{venue="hyperliquid"}[24h])
      mean: avg_over_time(perp_venue_volume_24h_usd{venue="hyperliquid"}[24h])
      success: avg_over_time(perp_venue_health{venue="hyperliquid"}[24h])
      sample_size: count_over_time(perp_venue_volume_24h_usd{venue="hyperliquid"}[24h])
      series: perp_venue_volume_24h_usd{venue="hyperliquid"}

