# OpenChainBench. Bench № 128

slug: swellchain-rpc
number: "128"
title: "Swellchain RPC endpoints: free public URLs ranked by latency"
seo_title: "Swellchain RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Swellchain RPC at {{best_p50}} (`eth_getBlockByNumber` p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for the `eth_getBlockByNumber(\"latest\", false)` method against every free, no-key public Swellchain EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Swellchain is an OP Stack L2 (chain 1923) operated by Swell Network, the restaking-native rollup built on EigenLayer, ETH gas token, ~2 s block cadence, blob calldata settlement on Ethereum. 2026-08-03 re-audit brings the total to {{count}} clean keyless providers: Ankr (rpc.ankr.com/swell), Sentio (swell-mainnet.rpc.sentio.xyz), Thirdweb (1923.rpc.thirdweb.com), and dRPC (swell.drpc.org). Excluded: official alt.technology endpoint (401 Unauthorized without key), Alchemy (key required).

abstract: |
  Swellchain: {{count}} free public RPC endpoints answering `the chain's head call` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical JSON-RPC call (`eth_getBlockByNumber(\"latest\", false)`) against every no-key public Swellchain endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a Swellchain-scaled staleness gap (20 blocks at Swellchain's ~2 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Swellchain-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\", false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the rotating id defeats edge caches that would answer a bare head query without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Swellchain-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"swellchain\"`. Provider coverage: {{count}} no-key endpoints."

faq:
  - q: "Which Swellchain RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing, each listed with its URL in the endpoints table above. Every listed endpoint was live-verified with a `eth_getBlockByNumber` POST returning a parsable response before inclusion."
  - q: "How is Swellchain RPC latency measured here, technically?"
    a: "One identical `eth_getBlockByNumber(\"latest\", false)` POST every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="swellchain"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: ankr
    name: Ankr
    endpoint: https://rpc.ankr.com/swell
    tag: Ankr public RPC gateway for Swellchain
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Ankr's no-key swellchain RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ankr", chain="swellchain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="ankr", chain="swellchain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="ankr", chain="swellchain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="ankr", chain="swellchain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="ankr", chain="swellchain"}) / sum(ocb:rpc_call:rate_24h{provider="ankr", chain="swellchain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="ankr", chain="swellchain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="ankr", chain="swellchain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ankr", chain="swellchain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ankr", chain="swellchain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ankr", chain="swellchain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ankr", chain="swellchain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ankr", chain="swellchain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ankr", chain="swellchain", region="sgp"}[1h])

