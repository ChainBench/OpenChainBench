      p99: avg(ocb:bridge_quote_slippage_usd:p99_7d{bridge="relay", region="eu-west"})
      mean: avg(ocb:bridge_quote_slippage_usd:mean_7d{bridge="relay", region="eu-west"})
      sample_size: round(sum(increase(bridge_success_total{bridge="relay", region="eu-west"}[7d])))
