# OpenChainBench. Bench № 142

slug: core-rpc
number: "142"
title: Fastest free Core Chain RPC, live no-key EVM endpoint latency
seo_title: "Fastest free Core Chain RPC 2026"
seo_description: "{{best_name}} leads free Core Chain RPC at {{best_p50}} (`eth_getBlockByNumber` p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for the `eth_getBlockByNumber("latest", false)` method against every free, no-key public Core Chain EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Core Chain is a Bitcoin-aligned EVM-compatible L1 blockchain (chain 1116) using a hybrid Satoshi Plus consensus that combines Bitcoin PoW mining with delegated PoS, CORE as gas token, ~3 s block cadence, BTC staking via the Self-Custodial Bitcoin Staking protocol. The 2026-08-04 audit confirms {{count}} clean keyless providers: the Core DAO official endpoint (rpc.coredao.org), dRPC (core.drpc.org), Thirdweb (1116.rpc.thirdweb.com), and Ankr (rpc.ankr.com/core). Excluded: Alchemy (no Core route), QuickNode (key required).

abstract: |
  Core Chain: {{count}} free public RPC endpoints answering `the chain's head call` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:core-official}}.
  We measure the round-trip latency of a single, identical JSON-RPC call (`eth_getBlockByNumber("latest", false)`) against every no-key public Core Chain endpoint that sustains continuous probing, {{count}} providers measured, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a Core Chain-scaled staleness gap (20 blocks at Core Chain's ~3 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Core Chain-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\", false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the rotating id defeats edge caches that would answer a bare head query without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Core Chain-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"core\"`. Provider coverage: {{count}} no-key endpoints."

faq:
  - q: "What is the fastest free Core Chain RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber(\"latest\", false)` p50 over the last 24h), measured against {{count}} no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples. Use the region tabs to see the leader from the origin closest to your deployment."
  - q: "Which Core Chain RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing: Core DAO official (https://rpc.coredao.org), dRPC (https://core.drpc.org), Thirdweb (https://1116.rpc.thirdweb.com), and Ankr (https://rpc.ankr.com/core). Every listed endpoint was live-verified with a `eth_getBlockByNumber` POST returning a parsable response before inclusion."
  - q: "How is Core Chain RPC latency measured here, technically?"
    a: "One identical `eth_getBlockByNumber(\"latest\", false)` POST every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="core"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: core-official
    name: Core DAO
    endpoint: https://rpc.coredao.org
    tag: Core DAO official public RPC for Core Chain mainnet
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Core DAO's no-key Core Chain RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="core-official", chain="core"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="core-official", chain="core"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="core-official", chain="core"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="core-official", chain="core"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="core-official", chain="core"}) / sum(ocb:rpc_call:rate_24h{provider="core-official", chain="core"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="core-official", chain="core"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="core-official", chain="core"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="core-official", chain="core", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="core-official", chain="core", region="us-east"}[1h])
        - region: eu-west
