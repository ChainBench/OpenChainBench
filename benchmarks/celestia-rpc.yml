# OpenChainBench. Bench № 151

slug: celestia-rpc
number: "151"
title: "Celestia RPC endpoints: free public URLs ranked by latency"
seo_title: "Celestia RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Celestia RPC at {{best_p50}} (Tendermint status p50, 24h). URLs for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for the Tendermint status method against every free, no-key public Celestia Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Celestia (celestia mainnet) is a modular data availability network decoupling DA from execution, with TIA as the gas token and ~12 s block time. It is used as the DA layer by Arbitrum Nitro, OP Stack, and other rollup frameworks. PublicNode, Polkachu, and LavenderFive all run keyless Tendermint RPC endpoints probed every 60 seconds from three regions.

abstract: |
  Celestia: {{count}} free public RPC endpoints answering `status` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical Cosmos SDK call (Tendermint `status`) against every no-key public Celestia endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a Celestia-scaled staleness gap (10 blocks at ~12 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Celestia-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"status\",\"params\":[]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Celestia-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"celestia\"`. Provider coverage at launch: {{count}} no-key endpoints (PublicNode, Polkachu, LavenderFive)."

faq:
  - q: "Which Celestia RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today; each is listed with its URL, 24h median and success rate in the endpoints table on this page, and the list changes as providers come and go."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="celestia"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://celestia-rpc.publicnode.com
    tag: Allnodes-operated, 70+ chains, includes Cosmos SDK
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Celestia RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="celestia"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="celestia"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="celestia"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="celestia"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="celestia"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="celestia"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="celestia"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="celestia"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="celestia", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="celestia", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="celestia", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="celestia", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="celestia", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="celestia", region="sgp"}[1h])

  - slug: polkachu
    name: Polkachu
    endpoint: https://celestia-rpc.polkachu.com
    tag: Community Cosmos validator + public RPC network
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Polkachu's no-key Celestia RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="celestia"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="polkachu", chain="celestia"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="polkachu", chain="celestia"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="polkachu", chain="celestia"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="polkachu", chain="celestia"}) / sum(ocb:rpc_call:rate_24h{provider="polkachu", chain="celestia"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="polkachu", chain="celestia"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="celestia"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="celestia", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="celestia", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="celestia", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="celestia", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="celestia", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="celestia", region="sgp"}[1h])

  - slug: lavenderfive
    name: LavenderFive
    endpoint: https://rpc.lavenderfive.com:443/celestia
    tag: Cosmos validator + no-key RPC path, multi-chain
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to LavenderFive's no-key Celestia RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="celestia"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="lavenderfive", chain="celestia"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="lavenderfive", chain="celestia"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="lavenderfive", chain="celestia"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="lavenderfive", chain="celestia"}) / sum(ocb:rpc_call:rate_24h{provider="lavenderfive", chain="celestia"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="lavenderfive", chain="celestia"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="celestia"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="celestia", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="celestia", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="celestia", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="celestia", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="celestia", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="celestia", region="sgp"}[1h])
