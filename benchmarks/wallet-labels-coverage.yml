prometheus:
  window: 24h
  expected_freshness_seconds: 5400

# Chain + Kind selectors. tabs at the top of the page. Server injects
# `chain="X"` and `kind="X"` into every PromQL query for the active tab.
# `kind` separates the two distinct signals this bench actually measures:
#  - contract: does the provider resolve a verified smart contract's name
#    (Blockscout gets this for free on any verified contract)
#  - eoa: does the provider resolve an externally-owned account to a
#    curated entity (CEX hot wallet, foundation, public figure) - the
#    real labeling-graph signal
# Default is `eoa` because the contract tab is trivially easy for explorers
# and saturates near 100%; the EOA tab is where curated entity coverage
# actually differentiates providers.
dimensions:
  kind:
    - { value: eoa,      label: EOA }
    - { value: contract, label: Contract }
  chain:
    - { value: ethereum, label: Ethereum }
    - { value: solana,   label: Solana }
    - { value: bnb,      label: BNB Chain }
    - { value: base,     label: Base }
    - { value: arbitrum, label: Arbitrum }
    - { value: polygon,  label: Polygon }
    - { value: optimism, label: Optimism }
    # Dimension value kept as `ton` (the Prom label the wallet-labels
    # harness emits). The dropdown shows "Gram" via label. Once the
    # harness redeploys with chain="gram", flip value to `gram` and add
    # the straddle to every selector in this file.
    - { value: ton,      label: Gram }
    - { value: stellar,  label: Stellar }
    - { value: xrp,      label: XRP }
    - { value: bitcoin,  label: Bitcoin }

# Real metrics emitted by the wallet-labels harness:
#   wallet_labels_checks_total{provider, chain}             counter
#   wallet_labels_success_total{provider, chain}            counter
#   wallet_labels_api_latency_milliseconds{provider}        histogram
#   wallet_labels_fetch_errors_total{provider, error_type}  counter
#   wallet_labels_health{provider}                          gauge (0|1)
#   wallet_labels_queue_depth                               gauge

providers:
  - slug: mobula
    name: Mobula
    tag: Universal coverage, 90+ chains, API key required
    formula: "Share of ~180 anchor addresses for which Mobula's /api/2/wallet/labels returns a non-generic entity name, computed as success_total ÷ checks_total over 24h."
    queries:
      p50: 100 * sum(increase(wallet_labels_success_total{provider="mobula"}[24h])) / sum(increase(wallet_labels_checks_total{provider="mobula"}[24h]))
      p90: 100 * sum(increase(wallet_labels_success_total{provider="mobula"}[24h])) / sum(increase(wallet_labels_checks_total{provider="mobula"}[24h]))
      p99: 100 * sum(increase(wallet_labels_success_total{provider="mobula"}[24h])) / sum(increase(wallet_labels_checks_total{provider="mobula"}[24h]))
      mean: 100 * sum(increase(wallet_labels_success_total{provider="mobula"}[24h])) / sum(increase(wallet_labels_checks_total{provider="mobula"}[24h]))
      success: clamp_min(1 - (sum(increase(wallet_labels_fetch_errors_total{provider="mobula"}[24h])) or vector(0)) / clamp_min(sum(increase(wallet_labels_checks_total{provider="mobula"}[24h])), 1), 0)
      sample_size: sum(increase(wallet_labels_checks_total{provider="mobula"}[24h]))
      series: 100 * sum(rate(wallet_labels_success_total{provider="mobula"}[1h])) / sum(rate(wallet_labels_checks_total{provider="mobula"}[1h]))

  - slug: helius
    name: Helius
    tag: Solana specialist, native program graph, API key required
    formula: "Share of Solana anchor addresses for which Helius /v1/wallet/{addr}/identity returns a non-generic entity name, success_total ÷ checks_total over 24h."
    queries:
      p50: 100 * sum(increase(wallet_labels_success_total{provider="helius"}[24h])) / sum(increase(wallet_labels_checks_total{provider="helius"}[24h]))
      p90: 100 * sum(increase(wallet_labels_success_total{provider="helius"}[24h])) / sum(increase(wallet_labels_checks_total{provider="helius"}[24h]))
      p99: 100 * sum(increase(wallet_labels_success_total{provider="helius"}[24h])) / sum(increase(wallet_labels_checks_total{provider="helius"}[24h]))
      mean: 100 * sum(increase(wallet_labels_success_total{provider="helius"}[24h])) / sum(increase(wallet_labels_checks_total{provider="helius"}[24h]))
      success: clamp_min(1 - (sum(increase(wallet_labels_fetch_errors_total{provider="helius"}[24h])) or vector(0)) / clamp_min(sum(increase(wallet_labels_checks_total{provider="helius"}[24h])), 1), 0)
      sample_size: sum(increase(wallet_labels_checks_total{provider="helius"}[24h]))
      series: 100 * sum(rate(wallet_labels_success_total{provider="helius"}[1h])) / sum(rate(wallet_labels_checks_total{provider="helius"}[1h]))

  - slug: moralis
    name: Moralis
    tag: EVM-centric multichain, entity API, API key required
    formula: "Share of anchor addresses for which Moralis /api/v2.2/entities returns a non-generic entity name across declared EVM chains, success_total ÷ checks_total over 24h."
    queries:
      p50: 100 * sum(increase(wallet_labels_success_total{provider="moralis"}[24h])) / sum(increase(wallet_labels_checks_total{provider="moralis"}[24h]))
      p90: 100 * sum(increase(wallet_labels_success_total{provider="moralis"}[24h])) / sum(increase(wallet_labels_checks_total{provider="moralis"}[24h]))
      p99: 100 * sum(increase(wallet_labels_success_total{provider="moralis"}[24h])) / sum(increase(wallet_labels_checks_total{provider="moralis"}[24h]))
      mean: 100 * sum(increase(wallet_labels_success_total{provider="moralis"}[24h])) / sum(increase(wallet_labels_checks_total{provider="moralis"}[24h]))
      success: clamp_min(1 - (sum(increase(wallet_labels_fetch_errors_total{provider="moralis"}[24h])) or vector(0)) / clamp_min(sum(increase(wallet_labels_checks_total{provider="moralis"}[24h])), 1), 0)
      sample_size: sum(increase(wallet_labels_checks_total{provider="moralis"}[24h]))
      series: 100 * sum(rate(wallet_labels_success_total{provider="moralis"}[1h])) / sum(rate(wallet_labels_checks_total{provider="moralis"}[1h]))

  - slug: blockscout
    name: Blockscout
