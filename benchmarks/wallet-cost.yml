# OpenChainBench. Bench № 309

slug: wallet-cost
number: "309"
title: Cheapest embedded wallet provider for each app size, from published prices
seo_title: "Embedded wallet pricing {{year}}: cheapest vendor per app size"
seo_description: "Embedded wallet pricing for {{declared_count}} vendors. At 10,000 consumer-app users {{best_name}} bills least of {{ranked_count}} priced, {{best_p50}} a month. Privy, Dynamic and more, at any size."
subtitle: The monthly bill each embedded wallet vendor would send for the same app, normalised across monthly active users, signatures, operations and credits, for three usage patterns at any app size.

category: Wallets
status: live
metric: Monthly cost for a consumer app at 10,000 users
unit: usd
higher_is_better: false
row_noun: { one: vendor, many: vendors }

disclaimer: >
  Published prices, not invoices. Every figure was read from the vendor's own
  pricing page on the date the catalogue carries, and the harness re-checks
  those pages on a loop. Gas is excluded. A vendor missing from a cell has no
  self-serve price for that app size or usage, which is a finding, not missing data.

seo_intro: |
  The cheapest embedded wallet depends on the app: for a consumer app at
  10,000 users it is {{best_name}} at {{best_p50}} a month (latest value), and
  the order changes at 1,000 and 100,000 users and with every transaction a
  user signs. About half of these vendors bill per monthly active user and
  nothing per transaction; the other half bill per signature, per operation or
  per credit, so the spread between first and last grows with usage.
  This page applies each vendor's own published billing rules, plan by plan,
  to three usage patterns: a consumer app whose users send 5 transactions a
  month, an active app at 25 and a trading app at 100. The calculator prices
  any size from 100 to 1,000,000 monthly active users; the table under it
  gives the cheapest vendor for each pattern at 1,000, 10,000 and 100,000.
  Gas is left out on purpose. Several vendors sponsor it for a surcharge,
  but that is a percentage of your users' gas, not a price of the wallet.

abstract: |
  {{declared_count}} embedded wallet vendors, three usage profiles and three app sizes,
  plus a calculator over any size from 100 to 1,000,000 monthly active users.
  For each combination the harness applies the vendor's own billing rules:
  what it meters (active users, signatures, wallet operations, credits), what
  each plan includes, its graduated overage, its caps and where its published
  price stops. It reports the monthly bill on the cheapest plan that can
  serve the app, and says so when none can.
  Pricing is read by a human from each vendor's own page, not scraped: half
  of these pages render their billing FAQ only in JavaScript. Every figure
  records the page and the date, and the harness re-hashes the pricing lines
  of every page each hour, and a change that holds for six hours
  raises an alert for a maintainer to re-read the page. The calculator reads a curve the same harness
  emits, with a point at every plan boundary, and a second implementation in
  another language re-prices it at 1,260,000 random app sizes; `pnpm
  validate` re-runs it on an 84,000-size sample on every change.

methodology:
  - "Cohort. {{declared_count}} vendors with a self-serve price on a public page: Privy, Dynamic, Turnkey, Web3Auth, Magic, Para, Coinbase CDP, thirdweb, Openfort, Circle, Reown, ZeroDev, Crossmint and Portal. Alchemy, Dfns, Fireblocks, Sequence and Particle Network are listed below with the reason they cannot be priced. Portal was listed as unpriceable until 2026-10-29, which was wrong: its Start-Up plan is published."
  - "Profiles. A consumer app whose users send 5 transactions a month and 20% of whom are new each month, an active app at 25 and 10%, a trading app at 100 and 5%. One wallet per user. A transaction is one signature followed by one broadcast; sign-in signatures are not counted, and Magic says they are not billed."
  - "Units. Each vendor's own meter is written as a linear function of the app: Privy and Magic bill active users plus signatures, Turnkey signatures, Coinbase CDP and Openfort wallet operations (1 per new wallet, 2 per transaction, from their own tables), ZeroDev credits (10 per signature, 20 per UserOp, so 30 per transaction), and the rest active users or active wallets."
  - "An active user is not one thing. Privy counts a user with a session in the last 30 days, Dynamic a login or a wallet created that month, Web3Auth and thirdweb a login, Magic a wallet accessed through its SDK, Para a user authenticated or created, Circle a wallet that made an on-chain transaction. Every user in these profiles transacts, so all of them count everyone."
  - "Plans. Each plan's fee, what it includes and its overage are applied as published. Graduated rates (Circle, thirdweb) bill each band at its own rate. A plan that stops at a size (Para's free 1,200 users, Reown's free 500, Turnkey's 2,000 wallets) cannot serve above it. Turnkey's limit counts every wallet an organisation holds while this model counts one month's users, so a growing app reaches it sooner than the calculator shows. A size past the last published price is a quote and is not ranked."
  - "Readings. Where a page can be read two ways the catalogue says which reading is priced and the calculator badges the plan. Privy's $2,000 pay-as-you-go base is priced alone, though its $499 Scale fee may also apply, and at exactly 10,000 users Privy is priced on Scale ($499) because pay-as-you-go starts above 10,000, though its Scale card reads 2,500 to 9,999; the other reading is $2,000. Turnkey's $99 Pro fee is priced as a floor the per-signature charges count against."
  - "Openfort's operation table gives 1 per wallet created and 2 per transaction, but its own simulator also adds 2 per active user; on that reading its bill is higher and it can drop a place, as the findings spell out for the 10,000-user consumer view. ZeroDev's 30 credits a transaction assumes each transaction is one signature and one UserOp. thirdweb's bands above 100,000 users are priced band by band."
  - "Openfort's Free plan is priced as stopping at 2,000 operations, as its FAQ states (HTTP 402), though its plan card offers $0.01 per operation once a payment method is added. Portal's wallet overage is priced every month, and a new wallet as two operations (Generate and Backup)."
  - "Vendors' own exclusions are honoured. Reown says exchanges, custodians, payments, gaming and merchant platforms need a custom plan, so its self-serve price is not offered on the trading profile."
  - "Left out. Gas and gas-sponsorship surcharges (thirdweb 2.5% on mainnet, Openfort 10% or 5%, ZeroDev 8%), SMS fees, extra seats, annual discounts, Circle's USDC rebate, and Privy's $1M monthly transaction volume threshold. Features a production app may need are not priced: removing thirdweb branding needs its $499 Scale plan, and custom domains are Enterprise-only at several vendors."
  - "Any size, not only three. The table prices 1,000, 10,000 and 100,000 users because a metric needs a fixed label. The calculator prices any size from 100 to 1,000,000 from a curve the same harness emits, with a point at every tier boundary, cap, quote threshold and plan crossover. Between two points every bill is a straight line, so the slider is exact, not smoothed."
  - "Verification. A second implementation, written in another language from the catalogue's prose rather than the harness code, re-prices every curve point and 1,260,000 random app sizes, and agrees on the bill to the cent and on the plan in every case. `pnpm validate` re-runs it on an 84,000-size sample on every change, and refuses a curve built from a different catalogue."
  - "Freshness. Six of the first thirteen pages measured return a new body on every request while their prices stand still, so the harness hashes only the visible lines that carry a dollar figure or a number beside a billing word. A change that holds for six hours raises an alert, and a maintainer re-reads the page and corrects the catalogue. The page shows the catalogue date."

findings:
  - "There is no single cheapest vendor. At 1,000 users four free plans cost nothing on a consumer app (Circle, Magic, Para, Web3Auth). At 10,000 Reown leads the consumer and active profiles at $214 a month and thirdweb the trading one at $234. At 100,000 thirdweb leads all three at $1,584."
  - "The billing unit decides the order. Per-user vendors cost the same whether users sign 5 or 100 transactions; per-signature and per-operation vendors scale with them. At 100,000 users, going from 5 to 100 transactions a user leaves thirdweb at $1,584 and takes Coinbase CDP from $5,075 to $100,000 and Magic from $6,249 to $53,749."
  - "The spread widens with use. At 10,000 users on a consumer app the eleven priced vendors span 31x, from Reown's $214 to Portal's $6,699, and 2.3x without Portal. On a trading app at 100,000 users thirdweb's $1,584 sits against Privy's $106,000 and Portal's $1,011,299."
  - "Portal, whose $499 plan includes 1,000 operations and 1,000 wallets and bills $0.10 for each operation beyond, the larger charge, and each wallet beyond, is the dearest in every cell; Privy is the next dearest in five of the six cells from 10,000 users up. Past 10,000 users or 50,000 signatures a month it bills a $2,000 base, $0.05 per user and $0.01 per signature, and its own page says an Enterprise plan is typically cheaper at sustained volume."
  - "Dynamic's page states two rates for each user beyond the 5,000 its $249 plan covers: $0.05 on the plan card and $0.005 in its FAQ, a tenfold gap. Priced on the card, as the card read in April 2026 too, Dynamic is $4,999 a month at 100,000 users; on the FAQ's rate it would be the cheapest vendor on every profile at that size. Until 2026-10-30 this page priced the FAQ's rate."
  - "Three vendors publish no self-serve price for a 10,000-user app. Turnkey's Pro plan stops at 2,000 wallets, ZeroDev publishes no price past its Scale plan's 1M credits, and Crossmint has no self-serve paid plan and states two different rates beyond its free tier. Reown is not priced on the trading profile, by its own terms."
  - "Seven vendors' pages read two ways somewhere, each badged in the calculator: Dynamic's per-user rate, Privy's base and band edge, Turnkey's Pro minimum, Openfort's operation count and free-plan stop, ZeroDev's credits per transaction, thirdweb's bands above 100,000 users, Portal's wallet overage. None leads a cell. At 10,000 consumer-app users three move a rank: Openfort is third or fourth, and Dynamic and Privy, eighth at $499, would be fourth and tenth."

faq:
  - q: "Which embedded wallet provider is cheapest?"
    a: "It depends on how many users your app has and how often they transact. At 1,000 users Circle, Magic, Para and Web3Auth are free on a consumer app. At 10,000 users Reown is cheapest at $214 a month for a consumer or active app, and thirdweb at $234 for a trading app. At 100,000 users thirdweb is cheapest on every profile at $1,584. Move the calculator to your own size and usage."
  - q: "Why does the ranking change with transactions per user?"
    a: "Because the vendors bill different things. Dynamic, Web3Auth, Para, thirdweb, Circle and Reown bill per active user, so a user who signs 100 transactions costs the same as one who signs 5. Turnkey bills per signature, Coinbase CDP and Openfort per wallet operation, ZeroDev per credit, and Privy and Magic per user plus per signature, so their bills rise with every transaction."
  - q: "What does Privy cost at 100,000 users?"
    a: "$11,000 a month for a consumer app at 5 transactions a user, $31,000 at 25 and $106,000 at 100, on its published pay-as-you-go rates: a $2,000 base, $0.05 per user above 10,000 and $0.01 per signature above 50,000. Privy's own page says an Enterprise plan is typically cheaper at sustained volume; that price is not published."
  - q: "Is gas included?"
    a: "No. Gas is the same whichever wallet signs, and the vendors that sponsor it charge a percentage of it on top (thirdweb 2.5% on mainnet, Openfort 10% or 5%, ZeroDev 8%). Those surcharges depend on your users' gas, not on the wallet, so they are left out of every figure here."
  - q: "Why is a vendor missing at 10,000 users?"
    a: "Because it publishes no self-serve price for that size. Turnkey's Pro plan holds at most 2,000 wallets and Enterprise is quote-only; ZeroDev publishes no price past its Scale plan's 1M credits; Crossmint has no self-serve paid plan and states two different rates beyond its free tier. Reown is left off the trading profile because its own page sends exchanges and payment platforms to a custom plan."
  - q: "What counts as a monthly active user?"
    a: "Each vendor defines it differently: a user with a session in the last 30 days (Privy), a login or a wallet created that month (Dynamic), a login (Web3Auth, thirdweb), a wallet accessed through the SDK (Magic), a user authenticated or created (Para), or a wallet that transacted on-chain (Circle). In these profiles every user logs in and transacts, so every definition counts every user."
  - q: "Are these prices from real invoices?"
    a: "No. They are published list prices, read by a human from each vendor's pricing page on the date the catalogue records, and applied by the harness. Where a page can be read two ways the calculator badges the price and the methodology says which reading is used. Enterprise contracts, which several vendors steer large apps toward, are not public and are not priced."
  - q: "Can I reproduce these numbers?"
    a: "Yes. The pricing catalogue, the billing model and the usage profiles are in the harness repository linked below, every figure carries its source page and the date it was read, and the calculator's curve is committed alongside the code."

excluded_providers:
  - { name: Alchemy, reason: "Wallet signatures are priced in compute units only in a separate calculator that disagrees with the pricing page." }
  - { name: Dfns, reason: "Annual contracts only, with no overage price." }
  - { name: Fireblocks, reason: "Sold through sales: $999 a month for up to six months, then custom plans from $36,000 a year, plus a share of outbound volume." }
  - { name: Sequence, reason: "No published price." }
  - { name: Particle Network, reason: "No published price." }

source: https://github.com/ChainBench/OpenChainBench/tree/dev/harnesses/wallet-cost

prometheus:
  # The scalars read min(last_over_time(...[20m])): a price is not a
  # distribution, and a range selector keeps a withdrawn series alive for
  # its whole length (rpc-cost published a removed price for a day that
  # way). min() also collapses the two series a plan switch produces.
  window: 24h
  expected_freshness_seconds: 10800
  freshness_timestamp_metric: wallet_cost_last_run_timestamp_seconds

# Metrics exposed by the wallet-cost harness:
#   wallet_cost_monthly_usd{provider, plan, kind, bucket}
#   wallet_cost_per_user_usd{provider, plan, kind, bucket}
#   wallet_cost_eligible{provider, kind, bucket}
#   wallet_cost_plan_confidence{provider, plan, kind, bucket}
#   wallet_pricing_artifact_ok / _drift / _age_seconds{provider, artifact}
#
# kind="all" is the consumer profile and bucket="all" is 10,000 users: the
# site selects those on the unfiltered view and replaces one when a reader
# picks a tab, and averaging a bill across profiles or sizes would describe
# no app at all.

# A bill is a constant read from a committed catalogue: its p50, p90 and p99
# are one number three times, and a success rate measures nothing because
# this bench sends no traffic. $0 is an answer here (a free plan that covers
# the app), not a missing value.
zero_is_a_value: true
ledger_reliability: false
ledger_columns:
  - { label: Monthly bill, slot: p50, unit: usd }
  - { label: Per user, panel: per_user, unit: usd }

metric_panels:
  - id: per_user
    label: Cost per monthly active user
    description: The monthly bill divided by the app's monthly active users. Derived, not a published rate.
    metric: wallet_cost_per_user_usd{kind="all",bucket="all"}
    label_key: provider
    unit: usd
    higher_is_better: false

dimension_labels:
  kind: Usage profile
  bucket: App size

dimensions:
  kind:
    - { value: all,     label: "Consumer app, 5 transactions a user" }
    - { value: active,  label: "Active app, 25 transactions a user" }
    - { value: trading, label: "Trading app, 100 transactions a user" }
  bucket:
    - { value: all,  label: "10,000 users" }
    - { value: 1k,   label: "1,000 users" }
    - { value: 100k, label: "100,000 users" }

providers:
  - slug: privy
    name: Privy
    tag: Active users plus signatures
    queries:
      p50: min(last_over_time(wallet_cost_monthly_usd{provider="privy",kind="all",bucket="all"}[20m]))
      p90: min(last_over_time(wallet_cost_monthly_usd{provider="privy",kind="all",bucket="all"}[20m]))
      p99: min(last_over_time(wallet_cost_monthly_usd{provider="privy",kind="all",bucket="all"}[20m]))
      ranked: wallet_cost_eligible{provider="privy",kind="all",bucket="all"}
      mean: min(last_over_time(wallet_cost_monthly_usd{provider="privy",kind="all",bucket="all"}[20m]))
      series: min by (provider) (wallet_cost_monthly_usd{provider="privy",kind="all",bucket="all"})
      sample_size: min by (provider) (count_over_time(wallet_cost_monthly_usd{provider="privy",kind="all",bucket="all"}[20m]))

