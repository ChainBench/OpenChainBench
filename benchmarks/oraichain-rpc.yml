# OpenChainBench. Bench № 198

slug: oraichain-rpc
number: "198"
title: "Oraichain RPC endpoints: free public URLs ranked by latency"
seo_title: "Oraichain RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Oraichain RPC at {{best_p50}} (Tendermint status p50, 24h). URLs for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for the Tendermint status method against every free, no-key public Oraichain Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Oraichain is an AI-focused Cosmos SDK chain featuring the ORAI native token, an AI oracle network (OraiDEX), and an AI data marketplace. It bridges AI computation and blockchain, enabling verifiable AI inference on-chain. {{count}} keyless Cosmos RPC endpoints are probed continuously: PublicNode (oraichain-rpc.publicnode.com), the Orai Foundation official endpoint (rpc.orai.io), and LavenderFive (oraichain-rpc.lavenderfive.com).

abstract: |
  Oraichain: {{count}} free public RPC endpoints answering `status` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:orai-official}}.
  We measure the round-trip latency of a single, identical Cosmos RPC call (Tendermint `status`) against every no-key public Oraichain endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Oraichain-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: Tendermint/CometBFT `status` JSON-RPC call. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Oraichain-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"oraichain\"`. Provider coverage at launch: {{count}} no-key endpoints."

faq:
  - q: "Which Oraichain RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing, each listed with its URL in the endpoints table above."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="oraichain"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://oraichain-rpc.publicnode.com
    tag: PublicNode multi-chain gateway for Oraichain
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint status POST sent every 60s from 3 regions to PublicNode's no-key Oraichain endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="oraichain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="oraichain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="oraichain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="oraichain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="oraichain"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="oraichain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="oraichain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="oraichain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="oraichain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="oraichain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="oraichain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="oraichain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="oraichain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="oraichain", region="sgp"}[1h])

  - slug: orai-official
    name: Orai Foundation
    endpoint: https://rpc.orai.io
    tag: Orai Foundation official public Cosmos RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint status POST sent every 60s from 3 regions to the Orai Foundation's no-key endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="orai-official", chain="oraichain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="orai-official", chain="oraichain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="orai-official", chain="oraichain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="orai-official", chain="oraichain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="orai-official", chain="oraichain"}) / sum(ocb:rpc_call:rate_24h{provider="orai-official", chain="oraichain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="orai-official", chain="oraichain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="orai-official", chain="oraichain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="orai-official", chain="oraichain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="orai-official", chain="oraichain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="orai-official", chain="oraichain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="orai-official", chain="oraichain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="orai-official", chain="oraichain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="orai-official", chain="oraichain", region="sgp"}[1h])
