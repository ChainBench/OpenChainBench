# OpenChainBench. Bench № 198

slug: oraichain-rpc
number: "198"
title: Fastest free Oraichain RPC, live no-key endpoint latency
seo_title: "Fastest free Oraichain RPC 2026"
seo_description: "{{best_name}} leads free Oraichain RPC at {{best_p50}} (Tendermint status p50, 24h). 3 no-key providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for the Tendermint status method against every free, no-key public Oraichain Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Oraichain is an AI-focused Cosmos SDK chain featuring the ORAI native token, an AI oracle network (OraiDEX), and an AI data marketplace. It bridges AI computation and blockchain, enabling verifiable AI inference on-chain. Three keyless Cosmos RPC endpoints are probed continuously: PublicNode (oraichain-rpc.publicnode.com), the Orai Foundation official endpoint (rpc.orai.io), and LavenderFive (oraichain-rpc.lavenderfive.com).

abstract: |
  Per-chain member of the RPC latency cluster, extended to Oraichain.
  We measure the round-trip latency of a single, identical Cosmos RPC call
  (Tendermint `status`) against every no-key public Oraichain endpoint
  that sustains continuous probing, 3 providers at launch,
  every 60 seconds, from us-east, eu-west and Singapore. The cross-chain
  view lives on the parent `rpc-capabilities` benchmark; this page is the
  Oraichain-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: Tendermint/CometBFT `status` JSON-RPC call. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms to 10 s), so percentiles are computed via Prometheus `quantile_over_time` over the last 24 hours."
  - "Call-result classification: `ok` (HTTP 200 + parsable latest_block_height), `http_err`, `jsonrpc_err`, `stale` (more than 40 blocks behind the cross-provider tip), `timeout`."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities) benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to `chain=\"oraichain\"`. Provider coverage at launch: 3 no-key endpoints."

findings:
  - "{{best_name}} currently leads free Oraichain RPC at {{best_p50}} (Tendermint status p50, 24h) across 3 measured providers."

faq:
  - q: "What is the fastest free Oraichain RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (Tendermint status p50 over the last 24h), measured against 3 no-key providers probed every 60 seconds from us-east, eu-west and Singapore."
  - q: "Which Oraichain RPCs work without an API key?"
    a: "3 endpoints sustain continuous keyless probing: PublicNode, Orai Foundation official, and LavenderFive. Every endpoint was live-verified before inclusion."
  - q: "Does the fastest Oraichain RPC change by region?"
    a: "Often. The region tabs at the top of the page re-scope every number to a single origin."
  - q: "How is Oraichain RPC latency measured here?"
    a: "One identical Tendermint status POST every 60 seconds against each provider from each of 3 regions."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="oraichain"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    tag: PublicNode multi-chain gateway for Oraichain
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint status POST sent every 60s from 3 regions to PublicNode's no-key Oraichain endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="oraichain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="oraichain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="oraichain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="oraichain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="oraichain"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="oraichain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="oraichain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="oraichain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="oraichain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="oraichain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="oraichain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="oraichain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="oraichain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="oraichain", region="sgp"}[1h])

  - slug: orai-official
    name: Orai Foundation
    tag: Orai Foundation official public Cosmos RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint status POST sent every 60s from 3 regions to the Orai Foundation's no-key endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="orai-official", chain="oraichain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="orai-official", chain="oraichain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="orai-official", chain="oraichain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="orai-official", chain="oraichain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="orai-official", chain="oraichain"}) / sum(ocb:rpc_call:rate_24h{provider="orai-official", chain="oraichain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="orai-official", chain="oraichain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="orai-official", chain="oraichain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="orai-official", chain="oraichain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="orai-official", chain="oraichain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="orai-official", chain="oraichain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="orai-official", chain="oraichain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="orai-official", chain="oraichain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="orai-official", chain="oraichain", region="sgp"}[1h])
