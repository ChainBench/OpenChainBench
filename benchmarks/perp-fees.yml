# OpenChainBench. Bench № 007

slug: perp-fees
number: "007"
title: Cheapest perp DEX
seo_title: Cheapest perp DEX - Hyperliquid, dYdX, GMX, Lighter, Gains.trade live fee benchmark
subtitle: All-in cost (in bps) to open a $1000 ETH long 10x position. Taker fee + half-spread + impact, measured live from public APIs.
category: Trading
status: live
metric: All-in cost
unit: bps
higher_is_better: false

abstract: |
  We measure the live all-in cost of opening a $1000 ETH long 10x perp
  position across major perpetual venues. Cost = taker fee + half-spread
  + price impact at notional, all in basis points. No transactions are
  sent. only freely-available public APIs are queried. Every value is
  read live, no hardcoded fee schedules. taker fees come from each
  venue's own API (Hyperliquid `userFees`, dYdX Cosmos REST
  `/feetiers/perpetual_fee_params`, GMX Subsquid `positionFeeFactor`,
  Lighter `/orderBookDetails`). spreads come from walking each venue's
  orderbook for $1000 of buy-side notional. The bench refreshes every
  5 minutes.

methodology:
  - "Cadence: every 5 minutes, in parallel across all venues."
  - "Trade simulated: ETH long 10x, $1000 notional ($100 collateral)."
  - "Hyperliquid: `POST /info {type: l2Book}` for asks + `{type: userFees, user: 0x000...000}` for taker fee + `{type: metaAndAssetCtxs}` for funding."
  - "dYdX v4: indexer `/orderbooks/perpetualMarket/ETH-USD` + `/perpetualMarkets` (funding) + Cosmos REST `/dydxprotocol/v4/feetiers/perpetual_fee_params` for tier-0 default fee."
  - "GMX v2 (Arbitrum): Subsquid GraphQL on the synthetics-arbitrum subgraph for `positionFeeFactorForNegativeImpact` (worst-case open) + gmxinfra REST for funding."
  - "Lighter: `/orderBookDetails` (taker fee per market) + `/orderBookOrders` (orderbook walk)."
  - "gains.trade (Gains v8 on Base): we read the fee directly on-chain. `eth_call pairs(N)` to find the pair index for the asset and its `feeIndex`, then `eth_call fees(feeIndex).openFeeP` for the actual taker fee. Spread comes from `pairs(N).spreadP`. Both values in 1e10 precision per Gains v8 convention. Cached 1h to keep Base RPC quota low."
  - "All-in formula: `all_in_bps = taker_fee_bps + spread_bps`. Both components emitted as separate metrics for transparency."
  - "Failures (5xx, timeouts, rate limits) leave the previous gauge in place and increment a per-venue `fetch_errors_total` counter. The page falls back to the last successful sample."

findings:
  - "Lighter charges zero taker fees on ETH-PERP, confirmed live via their public API."
  - "Hyperliquid (4.5 bps base taker) is the cheapest non-zero-fee venue measured."
  - "GMX position fee is variable: 4 bps on positive impact opens, 6 bps on negative impact. We report the negative branch as the conservative upper bound."

source: https://github.com/OpenChainBench/OpenChainBench/tree/main/harnesses/perp-fees

prometheus:
  url: https://prometheus-production-0859.up.railway.app
  window: 24h

# Asset selector. Tabs at the top of the page let the reader switch
# between ETH, BTC, SOL — every PromQL query gets `chain="X"` injected
# server-side so each tab is its own ranking. Note: the harness uses
# `chain` as the metric label even though semantically it's the
# underlying asset, to reuse the existing dimension-filter mechanism.
dimensions:
  chain:
    - { value: ETH, label: ETH }
    - { value: BTC, label: BTC }
    - { value: SOL, label: SOL }

# Real metrics emitted by the perp-fees harness:
#   perp_fees_taker_fee_bps{venue, asset}                 gauge
#   perp_fees_spread_bps{venue, asset}                    gauge (half-spread + impact at $1k)
#   perp_fees_all_in_bps{venue, asset}                    gauge (taker + spread)
#   perp_fees_funding_rate_per_hour_bps{venue, asset}     gauge (signed)
#   perp_fees_fetch_latency_milliseconds{venue, asset}
#   perp_fees_fetch_errors_total{venue, asset, error_type}  counter
#   perp_fees_health{venue, asset}                        gauge (0|1)
#   perp_fees_last_refresh_timestamp_seconds{venue, asset}

providers:
  - slug: lighter
    name: Lighter
    tag: zk-rollup, zero taker fee
    queries:
      p50: avg_over_time(perp_fees_all_in_bps{venue="lighter"}[24h])
      p90: quantile_over_time(0.90, perp_fees_all_in_bps{venue="lighter"}[24h])
      p99: quantile_over_time(0.99, perp_fees_all_in_bps{venue="lighter"}[24h])
      mean: avg_over_time(perp_fees_all_in_bps{venue="lighter"}[24h])
      success: avg_over_time(perp_fees_health{venue="lighter"}[24h])
      sample_size: count_over_time(perp_fees_all_in_bps{venue="lighter"}[24h])
      series: perp_fees_all_in_bps{venue="lighter"}

  - slug: hyperliquid
    name: Hyperliquid
    tag: HyperBFT L1 perp DEX
    queries:
      p50: avg_over_time(perp_fees_all_in_bps{venue="hyperliquid"}[24h])
      p90: quantile_over_time(0.90, perp_fees_all_in_bps{venue="hyperliquid"}[24h])
      p99: quantile_over_time(0.99, perp_fees_all_in_bps{venue="hyperliquid"}[24h])
      mean: avg_over_time(perp_fees_all_in_bps{venue="hyperliquid"}[24h])
      success: avg_over_time(perp_fees_health{venue="hyperliquid"}[24h])
      sample_size: count_over_time(perp_fees_all_in_bps{venue="hyperliquid"}[24h])
      series: perp_fees_all_in_bps{venue="hyperliquid"}

  - slug: dydx
    name: dYdX v4
    tag: Cosmos-based decentralized perp
    queries:
      p50: avg_over_time(perp_fees_all_in_bps{venue="dydx"}[24h])
      p90: quantile_over_time(0.90, perp_fees_all_in_bps{venue="dydx"}[24h])
      p99: quantile_over_time(0.99, perp_fees_all_in_bps{venue="dydx"}[24h])
      mean: avg_over_time(perp_fees_all_in_bps{venue="dydx"}[24h])
      success: avg_over_time(perp_fees_health{venue="dydx"}[24h])
      sample_size: count_over_time(perp_fees_all_in_bps{venue="dydx"}[24h])
      series: perp_fees_all_in_bps{venue="dydx"}

  - slug: gmx
    name: GMX v2
    tag: Synthetics on Arbitrum, oracle-priced
    queries:
      p50: avg_over_time(perp_fees_all_in_bps{venue="gmx"}[24h])
      p90: quantile_over_time(0.90, perp_fees_all_in_bps{venue="gmx"}[24h])
      p99: quantile_over_time(0.99, perp_fees_all_in_bps{venue="gmx"}[24h])
      mean: avg_over_time(perp_fees_all_in_bps{venue="gmx"}[24h])
      success: avg_over_time(perp_fees_health{venue="gmx"}[24h])
      sample_size: count_over_time(perp_fees_all_in_bps{venue="gmx"}[24h])
      series: perp_fees_all_in_bps{venue="gmx"}

  - slug: gains
    name: gains.trade
    tag: Synthetic perps on Base, fees read on-chain
    queries:
      p50: avg_over_time(perp_fees_all_in_bps{venue="gains"}[24h])
      p90: quantile_over_time(0.90, perp_fees_all_in_bps{venue="gains"}[24h])
      p99: quantile_over_time(0.99, perp_fees_all_in_bps{venue="gains"}[24h])
      mean: avg_over_time(perp_fees_all_in_bps{venue="gains"}[24h])
      success: avg_over_time(perp_fees_health{venue="gains"}[24h])
      sample_size: count_over_time(perp_fees_all_in_bps{venue="gains"}[24h])
      series: perp_fees_all_in_bps{venue="gains"}
