prometheus:
  window: 24h
  expected_freshness_seconds: 1800

faq:
  - q: "Which perp DEX is cheapest for a $1M market order?"
    a: "The venue with the deepest book, not the one with the lowest fee schedule. At $1,000,000 of notional the price impact from walking the book dwarfs the taker fee, so zero fee venues can lose to a 4 bps venue whose book absorbs the size better. The $1M panel on this page reruns the exact same measurement at that size, and the ranking regularly differs from the $1000 headline board. A venue that shows no data there means its visible book could not fill $1M at measurement time, which is a depth signal in itself."
  - q: "Why does the ranking change with order size?"
    a: "Two cost components move in opposite directions. The taker fee is a flat percentage, identical at any size. Price impact grows with size because a bigger order eats deeper into the book. Small orders are fee dominated, so zero fee venues win. Large orders are depth dominated, so the deepest book wins. The board at $1000 and the panels at $100k and $1M show all three regimes live."
  - q: "What is the cheapest perpetual futures DEX right now?"
    a: "{{best_name}} currently leads the leaderboard at {{best_p50}} all-in (24 h average) for opening a $1000 ETH long 10x position. The leaderboard re-sorts every five minutes against fresh Prometheus samples, so the answer reflects the last 24 hours of live data from each venue's public API, not a frozen rack-rate table."
  - q: "Is Lighter really zero fees on perpetual futures?"
    a: "The taker fee on Lighter is 0 bps, confirmed live via `/orderBookDetails` rather than a marketing page. The all-in cost is not zero, however, because every market order still crosses the half-spread and eats price impact at notional. The Lighter line on this benchmark shows what that residual cost actually is at $1000, which is the right number to compare against a paid venue's all-in figure."
  - q: "How do Hyperliquid fees compare to Lighter or dYdX in practice?"
    a: "Hyperliquid quotes 4.5 bps taker but its HyperBFT orderbook is among the deepest of any decentralized venue, so the spread component stays compressed and the all-in figure usually clocks close to the rack rate. Lighter starts from 0 bps taker but pays for it in slightly wider spreads on smaller markets. dYdX v4 sits at 5 bps taker with a comparably tight book. The leaderboard above shows the resulting one-number comparison live."
  - q: "What is the actual cost of trading on Hyperliquid for a $1000 position?"
    a: "{{name:hyperliquid}} is currently at {{p50:hyperliquid}} all-in (24 h average), which means a $1000 ETH 10x long costs that fraction of $1000 to open. Funding is charged separately and is not part of this benchmark; we publish the per-hour funding rate as a side metric (`perp_fees_funding_rate_per_hour_bps`) so traders sizing a multi-hour hold can layer it on top."
  - q: "Why include spread and impact instead of just taker fee?"
    a: "Rack-rate taker fee is what every comparison article quotes; it is also what every trader stops being able to read off a marketing page the second they place a market order. Spread plus impact at notional is the rest of the bill. On a tight book the gap is small, on a thin book it can dominate a 5 bps taker. Bundling both into one number is the only way to make a fair across-venue ranking that survives contact with a $1000 trade."
  - q: "How does GMX v2 fee work and why does this benchmark show the higher number?"
    a: "GMX v2 splits the position fee into a positive-impact branch (4 bps, when your trade reduces the venue's net open interest skew) and a negative-impact branch (6 bps, when it adds to the skew). Which branch fires depends on the current open interest at the moment of the trade and is not predictable from the user's side. We report the negative branch as the conservative upper bound; the positive branch is read by the harness as well and would lower the all-in number by 2 bps when it fires."
  - q: "How do perp fees change with position size?"
    a: "The taker fee does not change: every venue here charges a flat percentage of notional, so 4.5 bps on Hyperliquid costs 45 cents at $1,000 and $45 at $100,000, the same rate. What scales is the impact term: a bigger market order walks deeper into the book, so the effective price moves further from mid. On deep books like BTC on Hyperliquid the $100k figure sits within a fraction of a bp of the $1k figure; on thinner books like SOL the extra impact can exceed the entire taker fee. Oracle priced venues (GMX v2, gains.trade) quote the same bps at any size because there is no book to walk. The harness measures all three tiers every cycle and publishes them to `perp_fees_all_in_bps_tier` with a notional label of 1000, 10000 or 100000; the $10k and $100k panels on this page chart them live. When a book cannot fill a tier we skip the sample rather than extrapolate, so a missing tier is itself a depth signal."
  - q: "Does this benchmark include funding rates or only the open cost?"
    a: "Open cost only. Funding is paid every hour you hold, not at open, so bundling it into a one-number leaderboard would conflate two different fee mechanics. The harness still records funding rate per venue (`perp_fees_funding_rate_per_hour_bps`, signed) so a trader can read both numbers and compute their own time-adjusted cost for a longer hold."

# Asset selector. Tabs at the top of the page let the reader switch
# between ETH, BTC, SOL, every PromQL query gets `chain="X"` injected
# server-side so each tab is its own ranking. Note: the harness uses
# `chain` as the metric label even though semantically it's the
# underlying asset, to reuse the existing dimension-filter mechanism.
dimensions:
  chain:
    - { value: ETH, label: ETH }
    - { value: BTC, label: BTC }
    - { value: SOL, label: SOL }

# Real metrics emitted by the perp-fees harness:
#   perp_fees_taker_fee_bps{venue, asset}                 gauge
#   perp_fees_spread_bps{venue, asset}                    gauge (half-spread + impact at $1k)
#   perp_fees_all_in_bps{venue, asset}                    gauge (taker + spread)
#   perp_fees_funding_rate_per_hour_bps{venue, asset}     gauge (signed)
#   perp_fees_fetch_latency_milliseconds{venue, asset}
#   perp_fees_fetch_errors_total{venue, asset, error_type}  counter
#   perp_fees_health{venue, asset}                        gauge (0|1)
#   perp_fees_last_refresh_timestamp_seconds{venue, asset}
#   perp_fees_all_in_bps_tier{venue, chain, notional}     gauge ($1k/$10k/$100k tiers; notional=1000 duplicates the headline)
#   perp_fees_tier_skipped_total{venue, chain, notional}  counter (fetched book too thin to fill the tier, sample skipped)

providers:
  - slug: polymarket
    name: Polymarket
    tag: Polygon perps by Polymarket, 4 bps base taker tier
    formula: "Average over 24h of (base-tier taker rate from the Polymarket perps fees endpoint + half-spread plus impact from the book endpoint asks walked for $1000 of buy notional in the selected asset), in bps."
    queries:
      p50: avg_over_time(perp_fees_all_in_bps{venue="polymarket"}[24h])
      p90: quantile_over_time(0.90, perp_fees_all_in_bps{venue="polymarket"}[24h])
      p99: quantile_over_time(0.99, perp_fees_all_in_bps{venue="polymarket"}[24h])
      mean: avg_over_time(perp_fees_all_in_bps{venue="polymarket"}[24h])
      success: avg_over_time(perp_fees_health{venue="polymarket"}[24h])
      sample_size: count_over_time(perp_fees_all_in_bps{venue="polymarket"}[24h])
      series: perp_fees_all_in_bps{venue="polymarket"}

