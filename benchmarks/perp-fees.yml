# OpenChainBench. Bench № 007

slug: perp-fees
number: "007"
title: Cheapest perp DEX, live all-in cost from $1k to $1M on ETH, BTC and SOL
seo_title: "Cheapest perp DEX 2026"
seo_description: "{{best_name}} leads cheapest perp DEX at {{best_p50}} all-in (24h avg). ETH, BTC and SOL market orders at $1k, $100k and $1M. Lighter, Hyperliquid, Polymarket, Paradex, Extended, dYdX, GMX, gains.trade ranked live."
subtitle: "All-in cost in basis points to open a long, measured on ETH, BTC and SOL at three order sizes: $1k where fees decide, $100k where impact appears, $1M where book depth takes over. Taker fee plus half-spread plus impact, read live from public APIs across 8 venues including Lighter, Hyperliquid, Polymarket, Paradex and Extended."
category: Trading
status: live
metric: All-in cost
unit: bps
higher_is_better: false

seo_intro: |
  This benchmark answers the question every perp DEX comparison article
  refuses to answer with real numbers. what does it actually cost to
  open a $1000 ETH long 10x position right now, all-in, on each major
  decentralized venue. Published fee schedules quote a taker rate of
  0 bps (Lighter), 4.5 bps (Hyperliquid), 5 bps (dYdX) or 6 bps (GMX),
  but the rack rate is half the story. The other half is the spread you
  cross at market and the price impact you eat at $1000 notional, both
  of which are missing from every comparison roundup currently ranking
  for "best perp DEX". We read taker fees from each venue's own API
  (no hardcoded schedules), walk the orderbook for $1000 of buy-side
  notional to compute spread plus impact where a book exists (GMX and
  gains.trade are oracle priced, so their spread terms come from
  protocol parameters), and sum the two into a single basis-point
  figure refreshed every five minutes. Hyperliquid vs
  Lighter vs Polymarket vs dYdX vs GMX vs gains.trade is then a
  one-number comparison, not a six-tab spreadsheet. Size changes the
  answer, so the board is complemented by two panels that rerun the
  exact same measurement at $100,000 and $1,000,000 of notional. Small
  orders reward the lowest fee schedule; a $1M market order rewards the
  deepest book, and the ranking visibly flips between the two.

abstract: |
  We measure the live all-in cost of opening a $1000 ETH long 10x perp
  position across major perpetual venues. Cost = taker fee + half-spread
  + price impact at notional, all in basis points. No transactions are
  sent, only freely-available public APIs are queried. Every value is
  read live, no hardcoded fee schedules. Taker fees come from each
  venue's own API (Hyperliquid `userFees`, dYdX Cosmos REST
  `/feetiers/perpetual_fee_params`, GMX Subsquid `positionFeeFactor`,
  Lighter `/orderBookDetails`, Gains v8 on-chain `fees()`). On the
  orderbook venues (Hyperliquid, dYdX, Lighter) the spread comes from
  walking the book for $1000 of buy-side notional. GMX v2 is oracle
  priced with no book, so its spread term is zero. gains.trade uses
  half of the on-chain `spreadP`. The bench refreshes every 5 minutes.

methodology:
  - "Cadence: every 5 minutes, in parallel across all venues."
  - "Trade simulated: a long at 10x, measured independently on ETH, BTC and SOL (the chain tabs scope the board; the unfiltered view averages the three). Headline notional $1,000 with $10k, $100k and $1M tiers rewalked on the same book."
  - "Hyperliquid: `POST /info {type: l2Book}` for asks + `{type: userFees, user: 0x000...000}` for taker fee + `{type: metaAndAssetCtxs}` for funding."
  - "dYdX v4: indexer `/orderbooks/perpetualMarket/ETH-USD` + `/perpetualMarkets` (funding) + Cosmos REST `/dydxprotocol/v4/feetiers/perpetual_fee_params` for tier-0 default fee."
  - "GMX v2 (Arbitrum): Subsquid GraphQL on the synthetics-arbitrum subgraph for `positionFeeFactorForNegativeImpact` (worst-case open) on the ETH/USD, BTC/USD and SOL/USD markets + gmxinfra REST for funding. Oracle priced, no orderbook: the spread term is zero."
  - "Lighter: `/orderBookDetails` (taker fee per market) + `/orderBookOrders` (orderbook walk)."
  - "gains.trade (Gains v8 on Base): fees read directly on-chain. `eth_call pairs(N)` gives `spreadP` and `feeIndex`, then `eth_call fees(feeIndex)` gives the open fee (`totalPositionSizeFeeP`). The taker crosses one side of the book, so we charge half of `spreadP`. SOL has `spreadP` 0 on-chain (Gains prices that pair's spread dynamically), so its figure is the open fee alone. Values in 1e10 precision per Gains v8 convention. Fee tier cached 1h, pair config 6h."
  - "Paradex: `/markets` fee config for the api-tier taker rate + `/orderbook?depth=100` walk. The book endpoint caps at 100 levels (about $1M visible on majors), so the $1M tier can be skipped when the visible book thins."
  - "Extended: full public book from `/info/markets/<m>/orderbook` + `/stats` funding (1h native). Its taker fee is not exposed by any public endpoint; the documented base rate of 2.5 bps is used and this is the one venue where the fee is not read live."
  - "All-in formula: `all_in_bps = taker_fee_bps + spread_bps`. Both components emitted as separate metrics for transparency."
  - "Notional tiers: the same measurement runs at $1,000, $10,000, $100,000 and $1,000,000 by rewalking the already fetched book, published to `perp_fees_all_in_bps_tier{venue, chain, notional}`. The headline `perp_fees_all_in_bps` stays defined at $1,000. A tier the book cannot fill is skipped and counted in `perp_fees_tier_skipped_total`, never extrapolated. Oracle priced venues (GMX v2, gains.trade) charge a flat percentage of size, so their figure repeats across tiers."
  - "Book depth for the $1M tier: Lighter is walked on its top 100 levels, dYdX on the full indexer book, Polymarket on up to 500 levels. Hyperliquid returns its 20 best raw levels; when those cannot absorb the tier the harness refetches with nSigFigs=5, the finest price aggregation the API offers, which extends coverage with negligible price rounding."
  - "Failures (5xx, timeouts, rate limits) leave the previous gauge in place and increment a per-venue `fetch_errors_total` counter. The page falls back to the last successful sample."

per_chain_explainer:
  - slug: ETH
    h2: "Cheapest perp DEX for ETH"
    body: |
      The cheapest perp DEX for ETH on this benchmark sits at {{best_p50:chain:ETH}} all-in (p50, 24h) for a $1000 ETH long 10x. ETH-PERP is the deepest pair on every venue measured (Hyperliquid, Lighter, Polymarket, Paradex, Extended, dYdX v4, GMX v2, gains.trade), which means the rack-rate taker fee dominates the all-in number rather than the spread. Lighter quotes 0 bps taker, Hyperliquid 4.5 bps, dYdX 5 bps tier-0, GMX 4 or 6 bps on the impact branch, gains.trade reads the openFeeP slot live from the on-chain Gains v8 fees contract. Spread plus impact at $1000 notional is added on top via an orderbook walk.
  - slug: BTC
    h2: "Cheapest perp DEX for BTC"
    body: |
      The cheapest perp DEX for BTC on this benchmark sits at {{best_p50:chain:BTC}} all-in (p50, 24h) for a $1000 BTC long 10x. BTC-PERP carries the highest open interest across every venue in the cohort, so books are typically tighter than ETH on the same notional and the spread component compresses toward the rack rate. GMX v2 BTC uses the same positionFeeFactor schedule as ETH (4 bps positive impact, 6 bps negative); the bench reports the conservative negative branch. The leaderboard reorders intra-day with funding skew and orderbook depth.
  - slug: SOL
    h2: "Cheapest perp DEX for SOL"
    body: |
      The cheapest perp DEX for SOL on this benchmark sits at {{best_p50:chain:SOL}} all-in (p50, 24h) for a $1000 SOL long 10x. SOL-PERP books are thinner than ETH or BTC on every venue, so the spread plus impact component carries more weight in the all-in figure and a 5 bps taker venue can land above a 0 bps taker venue once the orderbook is walked. Lighter, Hyperliquid and dYdX v4 quote SOL-PERP natively; GMX v2 trades SOL as a synthetic on its Arbitrum deployment.

findings:
  - "{{best_name}} currently leads the leaderboard at {{best_p50}} all-in (24 h average) across {{count}} measured perp venues. The number includes taker fee plus the spread crossed at $1000 notional, not the rack-rate taker fee alone."
  - "Lighter charges zero taker fees on ETH-PERP, confirmed live via their public API. {{name:lighter}} clocks {{p50:lighter}} all-in (24 h average), so the headline figure is essentially the half-spread plus orderbook impact crossed at $1000."
  - "{{name:hyperliquid}} sits at {{p50:hyperliquid}} all-in (24 h average) on a 4.5 bps base taker. The deep HyperBFT orderbook keeps the spread component compressed, so the all-in number tracks the rack rate closer than any other venue in the cohort."
  - "{{name:dydx}} sits at {{p50:dydx}} all-in (24 h average). The published tier-0 taker fee is 5 bps; the rest is the orderbook crossed at $1000, which on dYdX v4 is consistently the tightest non-zero-fee book outside Hyperliquid."
  - "GMX position fee is variable: 4 bps on positive impact opens, 6 bps on negative impact. We report the negative branch (conservative upper bound). {{name:gmx}} clocks {{p50:gmx}} all-in (24 h average)."
  - "{{worst_name}} trails at {{worst_p50}} all-in (24 h average). The leaderboard reorders intra-day with spread volatility, so a venue cheap on the rack rate can still trail when its book thins out at a $1000 buy."

