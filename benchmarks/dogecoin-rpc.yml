# OpenChainBench. Bench No 235

slug: dogecoin-rpc
number: "235"
title: Fastest free Dogecoin RPC, live no-key endpoint latency
seo_title: "Fastest free Dogecoin RPC 2026"
seo_description: "{{best_name}} leads free Dogecoin RPC at {{best_p50}} (getblockcount p50, 24h). 3 providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for getblockcount against every available public Dogecoin node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Dogecoin is a proof-of-work UTXO blockchain forked from Litecoin (itself a Bitcoin fork) and launched in December 2013. It targets one block every 60 seconds using the Scrypt hashing algorithm and has no hard supply cap. Dogecoin exposes a Bitcoin-compatible JSON-RPC interface; most node implementations accept `getblockcount` as a standard method. Public endpoints are available without an API key from Tatum, dRPC and BlockCypher. BlockCypher exposes a REST API instead of JSON-RPC, returning the current chain height via a GET request to its blockchain info endpoint. Every provider was live-verified with consecutive block-height probes at launch.

abstract: |
  Per-chain member of the RPC latency cluster, extended to Dogecoin.
  We measure the round-trip latency of a block-height query against
  every available public Dogecoin node that sustains continuous probing:
  3 providers at launch, every 60 seconds, from us-east, eu-west and
  Singapore. Tatum and dRPC are probed via JSON-RPC POST (getblockcount);
  BlockCypher via REST GET of its blockchain info endpoint. The harness
  classifies every response (ok / http_err / jsonrpc_err / stale / timeout)
  with a Dogecoin-scaled staleness gap (5 blocks, around 5 min at 60 s/block).
  The cross-chain view lives on the parent rpc-capabilities benchmark;
  this page is the Dogecoin-scoped answer with per-region breakdowns as
  a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload (Tatum, dRPC): {\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"getblockcount\",\"params\":[]}. Plain HTTP POST. The result is a decimal integer (block count = current height + 1)."
  - "Payload (BlockCypher): GET https://api.blockcypher.com/v1/doge/main. Returns a JSON object with a `height` field containing the current block height."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms to 10 s), so percentiles are computed via Prometheus quantile_over_time over the last 24 hours."
  - "Call-result classification: ok (parsable block height returned), http_err, jsonrpc_err, stale (block more than 5 behind the cross-provider tip), timeout. Latency without reliability is a misleading ranking signal."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain rpc-capabilities benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to chain=dogecoin. Provider coverage at launch: 3 endpoints (Tatum, dRPC, BlockCypher)."

findings:
  - "{{best_name}} currently leads Dogecoin RPC at {{best_p50}} (getblockcount p50, 24h) across 3 measured providers."

faq:
  - q: "What is the fastest free Dogecoin RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (Dogecoin block count p50 over the last 24h), measured against 3 providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Dogecoin RPC endpoints work without an API key?"
    a: "3 endpoints sustain continuous keyless probing at launch: Tatum (dogecoin-mainnet.gateway.tatum.io, JSON-RPC), dRPC (dogecoin.drpc.org, JSON-RPC) and BlockCypher (api.blockcypher.com/v1/doge/main, REST GET). Every listed endpoint was live-verified with a block-height probe returning a parsable result before inclusion."
  - q: "Does the fastest Dogecoin RPC change by region?"
    a: "Often. dRPC routes through a decentralized mesh so latency varies by origin region; Tatum and BlockCypher have fixed infrastructure, so latency rankings can shift significantly depending on your geographic origin. The region tabs at the top of the page re-scope every number to a single origin."
  - q: "How is Dogecoin RPC latency measured here, technically?"
    a: "One block-height probe every 60 seconds against each provider from each of 3 regions. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus quantile_over_time over 24 hours. Tatum and dRPC use JSON-RPC POST (getblockcount); BlockCypher uses REST GET of its blockchain info endpoint. Best-effort measurements; p50 is the median, p90 the 90th percentile and p99 the 99th percentile of latency samples collected over the last 24 hours."
  - q: "Why does BlockCypher use a different API method than the other Dogecoin providers?"
    a: "BlockCypher exposes a proprietary REST API rather than a Bitcoin-compatible JSON-RPC interface. Instead of getblockcount, we send a GET request to its blockchain info endpoint, which returns a JSON object with a height field. The measurement logic is identical: client-side round-trip in milliseconds, classified as ok when a parsable block height is returned."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="dogecoin"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: tatum
    name: Tatum
    tag: Tatum public Dogecoin RPC gateway, no API key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a getblockcount POST sent every 60s from 3 regions to dogecoin-mainnet.gateway.tatum.io."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tatum", chain="dogecoin"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="tatum", chain="dogecoin"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="tatum", chain="dogecoin"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="tatum", chain="dogecoin"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="tatum", chain="dogecoin"}) / sum(ocb:rpc_call:rate_24h{provider="tatum", chain="dogecoin"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="tatum", chain="dogecoin"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="tatum", chain="dogecoin"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tatum", chain="dogecoin", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tatum", chain="dogecoin", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tatum", chain="dogecoin", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tatum", chain="dogecoin", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tatum", chain="dogecoin", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tatum", chain="dogecoin", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    tag: dRPC decentralized RPC mesh, Dogecoin public endpoint, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a getblockcount POST sent every 60s from 3 regions to dogecoin.drpc.org."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="dogecoin"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="dogecoin"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="dogecoin"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="dogecoin"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="dogecoin"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="dogecoin"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="dogecoin"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="dogecoin"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="dogecoin", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="dogecoin", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="dogecoin", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="dogecoin", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="dogecoin", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="dogecoin", region="sgp"}[1h])

  - slug: blockcypher
    name: BlockCypher
    tag: BlockCypher public Dogecoin REST API, no API key required for basic queries
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET request sent every 60s from 3 regions to api.blockcypher.com/v1/doge/main."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="blockcypher", chain="dogecoin"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="blockcypher", chain="dogecoin"})
