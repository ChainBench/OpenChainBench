  - slug: lighter
    name: Lighter
    tag: zkLighter + Robinhood chain orderbook perps
    formula: "Sum over perp markets of 1d candle quote volume on both deployments, per UTC day."
    queries:
      p50: perp_daily_volume_usd{venue="lighter",window="1d"}
