# OpenChainBench. Bench № 070

slug: indexing-freshness
number: "070"
title: Freshest wallet data API. Zerion, Moralis, Allium, GoldRush, Mobula
seo_title: "Freshest wallet data API 2026"
seo_description: "How fast do wallet APIs index a new transaction? Zerion, Moralis, Allium, GoldRush, Mobula measured live on organic Base transfers, second by second."
subtitle: Seconds between an organic transfer confirming on Base and the moment each wallet data API first returns it, measured continuously on real user transactions.
category: Aggregators
status: live
metric: Indexing freshness
unit: s
higher_is_better: false

seo_intro: |
  Every wallet app, portfolio tracker and exchange faces the same
  question. when a user receives funds, how long before the API my
  app is built on actually shows it. Providers advertise "real-time"
  and "sub-second indexing"; none publish comparable numbers. This
  benchmark measures it the only way that cannot be gamed. we pick a
  random, organic native transfer from the newest Base block, real
  user, different wallet every time, and poll each provider's wallet
  transactions API until the tx hash appears. Because the ground
  truth is a random real transaction there is no benchmark wallet a
  provider could special-case, and every measurement is publicly
  re-verifiable from the tx hash. Cohort. Zerion, Moralis, Allium,
  GoldRush (Covalent) and Mobula, all probed with the identical
  schedule from the same host. The timing context matters in 2026.
  Dune Sim is sunsetting and SimpleHash is gone, so teams are
  choosing a replacement wallet data API right now, and freshness is
  the spec sheet line that separates them.

abstract: |
  We measure the visibility lag of wallet data APIs. the time between
  an organic native transfer confirming on Base (T0 = the instant our
  own RPC observes the containing block) and the first poll at which
  each provider's wallet transactions endpoint returns that tx hash.
  One probe event per 10 minutes; each event uses a fresh random
  transaction from a fresh block, so wallets are cold and results
  include any lazy, on-demand indexing path a provider runs for
  never-before-queried addresses. Detection is parser-free (tx hash
  substring in the raw response), the poll schedule is front-loaded
  (1s to 120s, identical for every provider), and per-provider
  monthly quota guards keep the probe inside every free tier. An
  event a provider has not indexed within 120 seconds counts as
  missed, which feeds the reliability column, because an API that
  never shows the deposit is worse than a slow one.

methodology:
  - "Ground truth: one probe event per 10 minutes. The harness watches new Base blocks through its own RPC and picks one random plain native transfer (value > 0, empty calldata, OP-stack system deposit excluded). T0 is the instant the harness observes the containing block; the same T0 is used for every provider."
  - "Anti-gaming by construction: the measured wallet is a random real user's address, different on every event, so no provider can whitelist or pre-warm a known benchmark wallet. Every measurement is re-verifiable by anyone from the public tx hash."
  - "Poll schedule: each provider's wallet transactions endpoint is polled at 1, 2, 3, 4, 6, 8, 11, 15, 20, 26, 34, 45, 60, 80, 100 and 120 seconds after T0. Reported lag is the first poll at which the response contains the tx hash, an upper bound with resolution equal to the gap between consecutive polls."
  - "Detection is parser-free: the raw response body is scanned for the tx hash substring. Every cohort API returns the hash verbatim, so no provider gains or loses from response schema differences."
  - "Cold wallets by design: because each event uses a never-before-queried address, results include any on-demand indexing path a provider runs for new wallets. This mirrors the experience of a user opening an app on a fresh address, and it is disclosed here because warm, continuously-queried wallets may see lower lags."
  - "Classification: found (lag recorded), missed (not indexed within 120s), api_error (provider errored on every poll of the event). Percentiles are computed from the histogram of found lags over 24h; the miss rate is published alongside because latency without reliability is a misleading ranking signal."
  - "Quota fairness: per-provider monthly call budgets sized to each free tier with headroom, enforced by a guard that pauses probing at 90%. Allium participates in every third event (20k calls/month free tier); all other providers join every event. Sample sizes per provider are published."
  - "Scope: Base mainnet, single probe region. Freshness lags are measured in seconds while cross-region network deltas are milliseconds, so multi-region probing would add cost without changing the ranking; this is revisited if two providers converge within one poll-step of each other."

findings:
  - "{{best_name}} currently leads at {{best_p50}} (p50 of found lags, 24h) across organic Base transfers."
  - "{{name:zerion}} sits at {{p50:zerion}}. Early runs showed a bimodal pattern, some events indexed in about a second and others surfacing several seconds later, consistent with a caching layer in front of the wallet endpoint."
  - "{{name:moralis}} runs at {{p50:moralis}} with a notably tight distribution across events."
  - "{{name:goldrush}} trails at {{p50:goldrush}} on this probe. Its unified multi-chain schema trades freshness for breadth, a real trade-off teams should weigh explicitly."
  - "Miss rates matter more than medians: an API that fails to show a deposit within two minutes breaks the user flow entirely, so read the reliability column before the latency one."

faq:
  - q: "Which wallet data API shows new transactions fastest?"
    a: "Per the live leaderboard above: {{best_name}} at {{best_p50}} (p50 over 24h of organic Base transfers). The ranking re-sorts continuously as probe events land every 10 minutes. Check the miss-rate column too, a provider that occasionally never indexes a transfer is worse for a wallet app than one that is a second slower on median."
  - q: "How is indexing freshness measured here?"
    a: "The harness picks a random organic native transfer from the newest Base block, records T0 when its own RPC observes the block, then polls every provider's wallet transactions endpoint on an identical front-loaded schedule (1s to 120s) until the tx hash appears in the raw response. The lag is the first successful poll. Events a provider has not indexed within 120 seconds count as missed. The full harness is open source and each measurement can be re-verified from the public tx hash."
  - q: "Why use random real transactions instead of a controlled test wallet?"
    a: "Two reasons. First, integrity: a fixed benchmark wallet could be whitelisted or pre-warmed by a provider; a random real user's transfer, different every event, cannot. Second, realism: cold, never-before-queried addresses exercise any lazy indexing path a provider runs for new wallets, which is exactly what a new user experiences. The trade-off, disclosed in the methodology, is that continuously-queried warm wallets may see lower lags than reported here."
  - q: "Does this benchmark cover more chains than Base?"
    a: "Not yet. Base was chosen first for its high volume of plain native transfers (dense organic ground truth) and 2-second blocks. The harness is chain-agnostic and additional EVM chains join by adding an RPC endpoint, subject to each provider's free-tier quota budget. Chain coverage itself differs per provider and is part of what teams should evaluate."
  - q: "Why does freshness matter when choosing a wallet API in 2026?"
    a: "Because the market is consolidating. Dune Sim is sunsetting in August 2026 and SimpleHash shut down in 2025, so many teams are migrating to a new wallet data API right now. Providers advertise real-time indexing but publish no comparable numbers; deposit visibility lag is the difference between a user seeing their funds arrive and a support ticket. This page is the only continuously measured, provider-neutral comparison of that number."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/indexing-freshness

prometheus:
  window: 24h
  freshness_metric: indexing_freshness_seconds

providers:
  - slug: mobula
    name: Mobula
    tag: Wallet + market data API, 50+ chains
    formula: "Median (p50) over 24h of visibility lag in seconds between an organic Base transfer confirming and Mobula's wallet transactions endpoint first returning it, from the shared histogram estimator."
    queries:
      p50: histogram_quantile(0.5, sum by (le) (increase(indexing_freshness_seconds_histogram_bucket{provider="mobula"}[24h])))
      p90: histogram_quantile(0.9, sum by (le) (increase(indexing_freshness_seconds_histogram_bucket{provider="mobula"}[24h])))
      success: sum(increase(indexing_probe_total{provider="mobula", result="found"}[24h])) / sum(increase(indexing_probe_total{provider="mobula", result=~"found|missed"}[24h]))
      sample_size: sum(increase(indexing_probe_total{provider="mobula", result=~"found|missed"}[24h]))
      series: avg_over_time(indexing_freshness_seconds{provider="mobula"}[1h])
  - slug: zerion
    name: Zerion
    tag: Wallet API behind the Zerion app, 25+ chains
    formula: "Median (p50) over 24h of visibility lag in seconds between an organic Base transfer confirming and Zerion's wallet transactions endpoint first returning it, from the shared histogram estimator."
