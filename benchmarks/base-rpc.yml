# OpenChainBench. Bench № 046

slug: base-rpc
number: "046"
title: "Base RPC endpoints: free public URLs and API-key providers by latency"
seo_title: "Base RPC endpoints: public URLs and API-key providers by latency"
seo_description: "{{best_name}} leads free Base RPC at {{best_p50}}, {{best_name:tier:keyed}} the API-key cohort at {{best_p50:tier:keyed}} (eth_getBlockByNumber p50, 24h). URLs for all {{count}} no-key endpoints."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Base RPC endpoint (probed every 60 seconds) and, under the Endpoints selector, against the keyed endpoints of Alchemy, Chainstack and QuickNode (every 120 seconds), from 3 regions. The two cohorts are ranked separately, never against each other.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Base offers the cleanest official-versus-gateway comparison in the cluster: Coinbase operates both the sequencer and the chain-official `mainnet.base.org`, so the house endpoint has every locational advantage, and it still has to beat PublicNode, dRPC, Tenderly and Nodies on a level probe. {{count}} providers, the same `eth_getBlockByNumber` call every 60 seconds, three regions, stale-head detection against the cross-provider tip.

abstract: |
  Base: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:base-official}}. The same page carries the API-key cohort, Alchemy, Chainstack and QuickNode on their keyed Base endpoints every 120 seconds: switch the Endpoints selector; {{best_name:tier:keyed}} leads it at {{best_p50:tier:keyed}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Base endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore. The harness also classifies every response (ok / http_err / jsonrpc_err / stale / timeout) and audits archive depth every 5 minutes, so the leaderboard rewards sustained, honest availability rather than a fast error message. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Base-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the latest-header fetch with a rotating id defeats edge caches that answer eth_blockNumber without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Base-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=\"base\". Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. Blink (formerly Merkle) was delisted 2026-07: its gateway does not serve `eth_getBlockByNumber`, the anti-cache probe this cluster standardized on, so it cannot be measured on equal terms. Exclusions follow the cluster-wide rules documented on the parent benchmark."
  - "API-key cohort (Endpoints selector, API key): Alchemy, Chainstack and QuickNode probed on their keyed Base endpoints every 120 seconds from the same 3 regions, same call (eth_getBlockByNumber, rotating id), same ok / http_err / jsonrpc_err / stale / timeout classification."
  - "Keys live in the probe environment, never in the repo. Plan tiers, disclosed: Alchemy: a Free plan key (30M CU per month, 25 requests per second) normal signup, the tier any reader gets; Alchemy states free and paid keys share one routing; Chainstack: a Global Node on the Growth plan, sponsored by Chainstack; QuickNode: an endpoint on the Mobula enterprise-tier account, shared fleet. GetBlock is listed under exclusions until a key exists."
  - "Two cohorts, two rankings: the public endpoints are shared, rate-limited gateways probed every 60 seconds; the keyed endpoints are metered or dedicated and probed every 120 seconds. The selector switches the whole page (ranking, chart, region tabs, badges, citation) between them. No figure on this page compares a public endpoint with a keyed one."

excluded_providers:
  - { name: Ankr, reason: "public endpoint requires an API key" }
  - { name: NodeReal, reason: "requires an API key" }
  - { name: GetBlock, reason: "requires an API key; no key held yet, so it is not in the API-key cohort either" }
  - { name: 1RPC, reason: "delisted for reliability: under 13 % success at one probe per minute", since: "2026-07-09" }
  - { name: gateway.fm, reason: "29 requests per IP budget, too small for continuous probing" }
  - { name: LlamaRPC, reason: "Cloudflare 521 from the probe regions" }
  - { name: BlockPI, reason: "Cloudflare 521 from the probe regions" }
  - { name: OmniaTech, reason: "Cloudflare 521 from the probe regions" }
  - { name: Alchemy demo, reason: "rate-limited public demo endpoint; Alchemy's keyed endpoint is in the API-key cohort on this page" }

faq:
  - q: "Which Base RPCs work without an API key?"
    a: "The {{count}} providers on this page are listed with their URLs in the endpoints table above. Blink (formerly Merkle) was delisted in July 2026 because its gateway does not serve `eth_getBlockByNumber` (JSON-RPC -32601), the anti-cache probe used across the cluster, so its latency cannot be compared on equal terms. Every (provider, chain) pair was live-verified no-key before inclusion, and anything that key-gates, region-blocks or rate-limits below our 60-second cadence is excluded rather than listed with an asterisk."
  - q: "Is Coinbase's official Base RPC faster than third-party gateways?"
    a: "Compare the two numbers: despite being operated by the same team that runs the sequencer, `mainnet.base.org` measures {{p50:base-official}} against {{best_p50}} for {{best_name}} on the cross-region median, and the ranking moves with the region the request originates from. Check the region tabs on this page for the origin closest to your deployment; the cross-region average hides these flips."
  - q: "Which Base RPC provider is fastest with an API key?"
    a: "Per the live data: {{best_name:tier:keyed}} at {{best_p50:tier:keyed}} (eth_getBlockByNumber p50 over 24h, averaged across us-east, eu-west and Singapore); Alchemy measures {{p50:alchemy}}, Chainstack {{p50:chainstack}} and QuickNode {{p50:quicknode}}. Switch the Endpoints selector to API key for the region tabs and the p99 column; the ranking is origin-dependent and the plan tier of every key is disclosed in the methodology."
  - q: "Is a keyed Base RPC faster than a free public one?"
    a: "Compare the two leaders, measured on the same call from the same three regions: {{best_name}} at {{best_p50}} on the free cohort against {{best_name:tier:keyed}} at {{best_p50:tier:keyed}} with an API key (p50, 24h). They are never ranked in one table because the public probe runs every 60 seconds against shared gateways and the keyed probe every 120 seconds against metered endpoints; the median tells you whether the key buys latency on Base, the success rate whether it buys reliability."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on region alone.
rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="base"})

# Region and access tier: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }
  # Access tier: partitions the provider list (no PromQL label). The
  # first value is the headline cohort; ?tier=keyed reaches the other.
  tier:
    - { value: public, label: "Public, no key" }
    - { value: keyed,  label: "API key" }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://base-rpc.publicnode.com
    tag: Allnodes-operated, 70+ chains, archive on most
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Base endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="base"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="base"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="base"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="base"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="base"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="base"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="base"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="base"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="base", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="base", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="base", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="base", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="base", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="base", region="sgp"}[1h])

