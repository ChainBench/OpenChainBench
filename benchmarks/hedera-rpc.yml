# OpenChainBench. Bench No 218

slug: hedera-rpc
number: "218"
title: "Hedera RPC endpoints: free public URLs by latency"
seo_title: "Hedera RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Hedera RPC at {{best_p50}} (eth_getBlockByNumber EVM p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every available public Hedera EVM-compatible node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Hedera is a proof-of-stake public distributed ledger using the Hashgraph consensus algorithm (asynchronous Byzantine Fault Tolerant), targeting high throughput and deterministic finality in under 3 seconds. Hedera exposes an EVM-compatible JSON-RPC layer via Hashio, allowing standard eth_getBlockByNumber calls. Public EVM-compatible endpoints are available without an API key from Hashio (operated by the Hedera Foundation) and thirdweb. Every provider was live-verified with consecutive eth_getBlockByNumber probes at launch.

abstract: |
  Hedera: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single eth_getBlockByNumber ("latest", false) call against every available public Hedera EVM node that sustains continuous probing: {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a Hedera-scaled staleness gap (100 blocks, around 5 min at 3 s/block). The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Hedera-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: {\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}. Plain HTTP POST. Standard Ethereum JSON-RPC 2.0; Hedera's Hashio layer is EVM-compatible."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Hedera-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=hedera. Provider coverage today: {{count}} endpoints."

faq:
  - q: "Which Hedera RPC endpoints work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today: Hashio (mainnet.hashio.io/api, operated by the Hedera Foundation) and thirdweb (295.rpc.thirdweb.com). Every listed endpoint was live-verified with an eth_getBlockByNumber call returning a parsable block number before inclusion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="hedera"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: hashio
    name: Hashio
    endpoint: https://mainnet.hashio.io/api
    tag: Hedera Foundation Hashio public EVM JSON-RPC endpoint, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for an eth_getBlockByNumber POST sent every 60s from 3 regions to mainnet.hashio.io/api."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="hashio", chain="hedera"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="hashio", chain="hedera"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="hashio", chain="hedera"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="hashio", chain="hedera"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="hashio", chain="hedera"}) / sum(ocb:rpc_call:rate_24h{provider="hashio", chain="hedera"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="hashio", chain="hedera"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="hashio", chain="hedera"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="hashio", chain="hedera", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="hashio", chain="hedera", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="hashio", chain="hedera", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="hashio", chain="hedera", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="hashio", chain="hedera", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="hashio", chain="hedera", region="sgp"}[1h])

  - slug: thirdweb
    name: thirdweb
    endpoint: https://295.rpc.thirdweb.com
    tag: thirdweb public RPC for Hedera EVM (chain 295), no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for an eth_getBlockByNumber POST sent every 60s from 3 regions to 295.rpc.thirdweb.com."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="hedera"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="thirdweb", chain="hedera"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="thirdweb", chain="hedera"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="thirdweb", chain="hedera"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="thirdweb", chain="hedera"}) / sum(ocb:rpc_call:rate_24h{provider="thirdweb", chain="hedera"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="thirdweb", chain="hedera"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="hedera"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="hedera", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="hedera", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="hedera", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="hedera", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="hedera", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="hedera", region="sgp"}[1h])
