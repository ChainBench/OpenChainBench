  - slug: blastapi
    name: Blast API
    tag: Blast API public gateway for Telos EVM
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions to Blast API's no-key Telos endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="blastapi", chain="telos"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="blastapi", chain="telos"})
