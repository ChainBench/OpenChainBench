# OpenChainBench. Bench № 195

slug: telos-rpc
number: "195"
title: "Telos EVM RPC endpoints: free public URLs by latency"
seo_title: "Telos EVM RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Telos EVM RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). {{count}} no-key endpoints measured, updated every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Telos EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Telos EVM (chain 40) is a high-performance EVM-compatible blockchain with sub-0.5 second block times, TLOS as the gas token, and a carbon-neutral operational commitment. One of the longest-running EVM-compatible chains, live since 2021. One keyless endpoint is probed continuously: dRPC (telos.drpc.org). The Telos Foundation official endpoint returned 404 and has been removed.

abstract: |
  Telos EVM: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against the no-key public Telos EVM endpoint that sustains continuous probing ({{count}} provider: dRPC), every 60 seconds, from us-east, eu-west and Singapore. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Telos-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Telos EVM-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"telos\"`. Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. Telos Foundation official returned 404 and has been removed."

faq:
  - q: "Which Telos EVM RPCs work without an API key?"
    a: "{{count}} endpoint sustains continuous keyless probing: dRPC (telos.drpc.org). The Telos Foundation official endpoint (mainnet.telos.net/evm) returned 404 and has been removed."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="telos"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: drpc
    name: dRPC
    endpoint: https://telos.drpc.org
    tag: dRPC public gateway for Telos EVM
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions to dRPC's no-key Telos endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="telos"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="telos"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="telos"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="telos"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="telos"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="telos"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="telos"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="telos"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="telos", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="telos", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="telos", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="telos", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="telos", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="telos", region="sgp"}[1h])
