# OpenChainBench. Bench № 135

slug: moonriver-rpc
number: "135"
title: "Moonriver RPC endpoints: free public URLs by latency"
seo_title: "Moonriver RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Moonriver RPC at {{best_p50}} (`eth_getBlockByNumber` p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for the `eth_getBlockByNumber(\"latest\", false)` method against every free, no-key public Moonriver EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Moonriver is the Kusama canary network for Moonbeam (chain 1285), a full EVM parachain with Ethereum-compatible tooling, MOVR gas token, ~12 s block time under Nominated Proof of Stake, serving as the staging ground for Moonbeam features before they reach Polkadot. The 2026-10-09 audit confirms {{count}} clean keyless providers: OnFinality (moonriver.api.onfinality.io/public), dRPC (moonriver.drpc.org) and UnitedBloc (moonriver.unitedbloc.com). The last two were excluded in August, dRPC for having no Moonriver route and UnitedBloc for dead DNS, and both answer again on the current head. Excluded now: the Moonbeam Foundation endpoint (rpc.api.moonriver.moonbeam.network refuses the TLS handshake from two independent client stacks), PublicNode (moonriver-rpc.publicnode.com answers 404, the chain was dropped), Ankr (requires a key for Moonriver).

abstract: |
  Moonriver: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical JSON-RPC call (`eth_getBlockByNumber(\"latest\", false)`) against every no-key public Moonriver endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a Moonriver-scaled staleness gap (20 blocks at Moonriver's ~12 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Moonriver-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\", false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. The request id rotates, but that does not guarantee a cache miss: many caches normalise `id` away. Measured 2026-10-08, fixed and rotating ids answer within 2 to 4 percent of each other."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Moonriver-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"moonriver\"`. Provider coverage: {{count}} no-key endpoints. Cohort rebuilt 2026-10-09: the Foundation endpoint and PublicNode dropped, dRPC and UnitedBloc restored after both answered on the current head on 10 of 10 probes."

faq:
  - q: "Which Moonriver RPCs work without an API key?"
    a: "{{declared_count}} endpoints are probed on this chain, each listed with its URL in the endpoints table above."
  - q: "How is Moonriver RPC latency measured here, technically?"
    a: "One identical `eth_getBlockByNumber(\"latest\", false)` POST every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="moonriver"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: onfinality
    name: OnFinality
    endpoint: https://moonriver.api.onfinality.io/public
    tag: OnFinality shared node service public endpoint for Moonriver
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to OnFinality's no-key moonriver RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="moonriver"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="onfinality", chain="moonriver"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="onfinality", chain="moonriver"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="onfinality", chain="moonriver"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="onfinality", chain="moonriver"}) / sum(ocb:rpc_call:rate_24h{provider="onfinality", chain="moonriver"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="onfinality", chain="moonriver"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="moonriver"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="moonriver", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="moonriver", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="moonriver", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="moonriver", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="moonriver", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="moonriver", region="sgp"}[1h])

