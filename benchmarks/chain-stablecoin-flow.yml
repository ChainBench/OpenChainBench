# OpenChainBench. Bench 275
slug: chain-stablecoin-flow
number: "275"
title: "Stablecoin flow by chain: where dollars actually moved over 30 days"
seo_title: "Stablecoin flow by chain: {{best_name}} leads at {{best_p50}} over 30 days"
seo_description: "{{best_name}} leads the 30-day stablecoin net flow of {{ranked_count}} chains at {{best_p50}}; {{worst_name}} sits at the bottom with {{worst_p50}}. Net dollars, 7 and 30 day moves, float, from DefiLlama."
subtitle: "The dollar change in each chain's stablecoin float over the trailing 30 days. Unlike a TVL ranking this is a flow, not a level: it only moves when somebody mints or bridges dollars onto a chain, or takes them off. Chains below $100M of float when the cohort was set (2026-09-25) are not ranked, because one mint moves them by a third."
category: Blockchains
status: live
metric: Net stablecoin flow (30d)
row_noun: { one: chain, many: chains }
unit: usd
higher_is_better: true

disclaimer: |
  Stablecoin float is where dollars are parked, not what they do. A chain
  can take in a billion that sits idle, and lose float to a single issuer
  redeeming. The figure is DefiLlama's chain-wide pegged-USD aggregate,
  every issuer combined; it does not separate a bridge inflow from a native
  mint, and a dollar bridged to an L2 counts on both chains, so rows are
  not additive. Read the net dollars with the percentage beside them: the
  same $400M is a rounding error on Ethereum and a doubling elsewhere.

seo_intro: |
  Bridged TVL says how much value a chain secures. It is a level, and a
  level barely moves: an asset bridged eight months ago still counts today.
  Stablecoin float answers the other question. Dollars only appear on a
  chain when somebody mints or bridges them there on purpose, so the change
  in that float over a month is about as close to a capital-flow reading as
  public data gets. It also covers the chains bench 273 cannot: L2Beat
  tracks scaling chains, so Solana, Tron and BNB have no row there; all
  three are ranked here. The board ranks by
  net dollars because that is the quantity that moved, with the percentage
  alongside because $400M means different things at different sizes.

abstract: |
  The chain-kpis harness already read /stablecoincharts/<chain> for each
  chain's current pegged-USD total and kept only the last point. That
  endpoint returns the full daily history, so the same fetch now also
  differences it: chain_stables_net_7d_usd and chain_stables_net_30d_usd
  are the dollar changes, chain_stables_change_7d_pct and
  chain_stables_change_30d_pct the percentages. No extra request. The
  windows are published only when the history reaches back far enough to
  difference, so a chain DefiLlama began tracking last week shows its float
  and no change, rather than a 30-day move measured against its own first
  data point. A chain whose float 30 days ago was zero publishes no
  percentage either, because that is not a division.

methodology:
  - "Source: DefiLlama /stablecoincharts/<chain>, the chain-wide pegged-USD aggregate across every issuer, one point per day. Unfiltered: adding stablecoin=<id> narrows to a single asset and returns an empty 200 on chains where that asset has no issuance."
  - "Net flow = today's float minus the float 30 days earlier, in dollars. The percentage is the same difference over the earlier value. Both windows count back by index on the daily series, so 7d is the point seven days back and not eight."
  - "A window is published only when the series reaches that far back and the starting value is above zero. A chain newly tracked, or one whose float started at zero, publishes its float gauge but no 30-day figure, so it is not ranked until the window exists rather than ranked on an invented move."
  - "Size floor: $100M of stablecoin float, applied when the cohort was chosen rather than recomputed each run. Below it a single mint or redemption moves the percentage by tens of points, and the board would rank issuance events rather than capital movement."
  - "Ranking is by net dollars, because that is the quantity that actually moved. The percentage column is the size-adjusted reading and the two disagree on purpose: the largest net inflow and the largest percentage gain are rarely the same chain."
  - "No cohort-relative column here, unlike bench 273. A flow already carries a sign, so the raw number separates a chain that gained from one that lost. Value secured is a level and moves with the market, which is why that board needs an excess column and this one does not."
  - "Cadence: every 15 minutes, matched to the rest of the DefiLlama reads in the harness. The underlying series is daily, so p50, p90, p99 and the mean read the same value and are equal by construction."
  - "Coverage: the 26 registry chains DefiLlama tracks for stablecoins that sat above the floor when the cohort was chosen on 2026-09-25. A chain DefiLlama does not track for stablecoins answers 404 and is absent rather than shown at zero. Arc cleared the floor ($0.5B) but its history begins on 2026-09-17, too short for a 30-day difference; it joins at the next spec review once that point exists, around 2026-10-17. Under the floor that day: Berachain, zkSync Era, Linea, Unichain, Gnosis."

findings:
  - "{{best_name}} leads the {{ranked_count}} ranked chains on 30-day stablecoin net flow at {{best_p50}}; a positive figure is an inflow, a negative one the smallest outflow in a month where every chain lost float."
  - "{{worst_name}} sits at the bottom at {{worst_p50}}, the largest outflow when the figure is negative, and a chain can shed float while its TVL holds: the two measure different things."
  - "Net dollars and percentage gain rank differently by construction, because the same inflow is a rounding error on the largest chain and a step change on a smaller one."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/chain-kpis

prometheus:
  window: 24h
  expected_freshness_seconds: 5400
  freshness_metric: chain_kpis_health

panel_main_description: "Dollar change in the chain's stablecoin float over the trailing 30 days. Positive means dollars arrived."

# Panel metrics carry no chain matcher: the site queries each panel once per
# provider row (`<metric>{chain="<slug>"}`), so the cohort is the provider
# list below and a 26-chain regex here would only repeat it past the
# 200-character cap on the field.
metric_panels:
  - id: change_30d
    label: 30d change
    label_key: chain
    metric: chain_stables_change_30d_pct{}
    unit: pct
    higher_is_better: true
    description: "The same 30-day move as a percentage of the float it started from. The size-adjusted reading: a chain can lead on dollars and trail here."
  - id: float_usd
    label: Stablecoin float
    label_key: chain
    metric: chain_stables_mcap_usd{}
    unit: usd
    higher_is_better: true
    description: "Total pegged-USD circulating on the chain, every issuer combined. The base the other columns are measured against."
  - id: net_7d
    label: Net 7d
    label_key: chain
    metric: chain_stables_net_7d_usd{}
    unit: usd
    higher_is_better: true
    description: "Dollar change over the trailing week. Where the 30-day move is still running or has already turned."
  - id: change_7d
    label: 7d change
    label_key: chain
    metric: chain_stables_change_7d_pct{}
    unit: pct
    higher_is_better: true
    description: "The weekly move as a percentage of the float."

faq:
  - q: "Why stablecoin float rather than TVL?"
    a: "Because TVL is a level and this is a flow. An asset bridged eight months ago still counts in TVL today; dollars only appear on a chain when somebody mints or bridges them there on purpose, so the monthly change in that float is closer to a reading of where capital is actually moving."
  - q: "How does this differ from the bridged TVL board?"
    a: "That board measures what a chain's bridge secures, from L2Beat, which tracks scaling chains only. Solana, Tron and BNB have no row there; all three are ranked here. It also measures a different thing: dollars arriving rather than value at rest."
  - q: "Why rank on dollars instead of percentage?"
    a: "Because the dollar figure is the quantity that moved. The percentage is on the page beside it and the two rank differently on purpose: the same inflow is a rounding error on the largest chain and a step change on a smaller one."
  - q: "Why are small chains excluded?"
    a: "Because a chain with a few tens of millions of float moves tens of percent on one mint or one redemption, so a board including them would rank issuance events. The floor is $100M of float, applied when the cohort was chosen on 2026-09-25; chains under it then are not on this board, and the cohort is revisited by spec review, not recomputed each run."
  - q: "Does an inflow mean the chain is winning?"
    a: "Not on its own. Dollars can arrive and sit idle, and they can leave because one issuer redeemed rather than because users left. The float is where money is parked, not what it does; read it next to the chain's DEX volume and TVL."
