    name: Ethereum
    formula: "last_over_time(chain_stables_net_30d_usd{chain=\"ethereum\"}[2h])"
    queries:
      p50: last_over_time(chain_stables_net_30d_usd{chain="ethereum"}[2h])
      p90: last_over_time(chain_stables_net_30d_usd{chain="ethereum"}[2h])
      p99: last_over_time(chain_stables_net_30d_usd{chain="ethereum"}[2h])
      mean: last_over_time(chain_stables_net_30d_usd{chain="ethereum"}[2h])
      success: avg_over_time(chain_kpis_health{chain="ethereum",source="defillama"}[24h])
      sample_size: count_over_time(chain_stables_net_30d_usd{chain="ethereum"}[24h])
