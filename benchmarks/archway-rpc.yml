    name: LavenderFive
    endpoint: https://rpc.lavenderfive.com:443/archway
    tag: Cosmos validator and no-key RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to LavenderFive's no-key Archway endpoint."
