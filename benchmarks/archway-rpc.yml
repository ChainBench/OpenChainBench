  - slug: archway-official
    name: Archway Foundation
    tag: Archway Foundation's official public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Archway Foundation's no-key Archway endpoint."
    queries:
