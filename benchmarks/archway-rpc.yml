      sample_size: sum(ocb:rpc_call:increase_24h{provider="lavenderfive", chain="archway"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="archway"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="archway", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="lavenderfive", chain="archway", region="us-east"}[1h])
