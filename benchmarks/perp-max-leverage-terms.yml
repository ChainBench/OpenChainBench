  - { label: "Room to liq", slot: p50 }
  - { label: "Collateral lost", panel: collateral_lost }
  - { label: "Max leverage", panel: max_leverage }
  - { label: "Collateral returned", panel: collateral_kept }

faq:
  - q: "What does room to liquidation mean?"
    a: "It is the percentage the price has to move against a position before the venue closes it, for a position opened at the selected leverage with no margin added beyond the minimum. It is measured at the moment the position opens and excludes funding and borrowing, which push the real trigger closer every hour the position is held."
  - q: "Why does the order change when I change the leverage?"
    a: "Because venues set their maintenance requirement against different quantities. Gains ties it to collateral, so its room falls close to proportionally with leverage. Papertrade fixes it in price at about five basis points, so it barely matters at 10x and consumes roughly half the margin at 1000x. At low leverage Papertrade leaves the most room of the five; at its own maximum it leaves the least."
  - q: "Why is nothing ranked?"
    a: "Because more room is not the same as better terms. Room comes from holding back less maintenance margin, and the venue that holds back least is the one that keeps everything when it fires. A single ranking would reward that, whichever venue came out on top. The rows publish their figures and the reader picks the leverage that matches the question."
  - q: "Why does Gains show less room than its own threshold implies?"
    a: "Because the fee comes out of the same collateral the threshold is measured against. Its contract liquidates at 80 percent of collateral, which alone would be 0.16 percent of price at 500x, but the position pays 0.02 percent of notional on the way in and again on the way out, and at 500x those two legs are 20 points. Eleven real liquidations fired at a median 59.4 percent of collateral, which is 0.1189 percent of price, against the 0.12 percent this model predicts."
  - q: "Does any venue give collateral back on a liquidation?"
    a: "The two margin fraction venues do: dYdX returns 60 percent and Hyperliquid 50 percent at their own maxima. Neither high leverage venue does. Gains returned nothing on all 27 liquidations measured across every pair from 7.5x to 500x, and Papertrade's documentation calls crossing the bust price a hard bust that forfeits the full isolated margin."
  - q: "How is the Papertrade row checked when its contract is unverified?"
    a: "Against external truth rather than an ABI. Its price field matches the live Hyperliquid mid under the per instrument factor from its own instrument tuple, its leverage field caps at exactly the 1000 its documentation states, and under the resulting reading the predicted bust distance is never crossed on 384 adverse closes, the closest reaching 92 percent of it. A ceiling respected 384 times is a measurement, not a decode that happened to look right."
  - q: "Why only BTC and ETH?"
    a: "They are the only two markets all five venues list. Papertrade lists exactly two instruments; the other four list hundreds, but comparing one venue's BTC terms against another's altcoin terms would not mean anything."

providers:
  - slug: hyperliquid
    name: Hyperliquid
    tag: Custom L1 CLOB, maintenance requirement derived from the documented halving rule
    confidence_tier: estimate
    formula: "Room = (1/leverage - 1/(2*maxLeverage)) x 100, with maxLeverage from the info meta endpoint. The maintenance requirement is not published per market; the halving rule is documented. No fee is read from this payload."
    queries:
      p50: perp_liq_price_move_pct{venue="hyperliquid",bucket="all"}
      success: clamp_max(perp_leverage_max{venue="hyperliquid",bucket="all"}, 1)
      sample_size: count_over_time(perp_leverage_max{venue="hyperliquid",bucket="all"}[24h])
      series: perp_liq_price_move_pct{venue="hyperliquid",bucket="all"}
      ranked: vector(0)

  - slug: dydx
    name: dYdX v4
    tag: Cosmos appchain orderbook, both margin fractions published per market
    confidence_tier: published
    formula: "Room = (1/leverage - maintenanceMarginFraction) x 100, collateral returned = maintenanceMarginFraction x leverage, both fractions from indexer.dydx.trade/v4/perpetualMarkets. No fee is read from this payload."
    queries:
      p50: perp_liq_price_move_pct{venue="dydx",bucket="all"}
      success: clamp_max(perp_leverage_max{venue="dydx",bucket="all"}, 1)
      sample_size: count_over_time(perp_leverage_max{venue="dydx",bucket="all"}[24h])
      series: perp_liq_price_move_pct{venue="dydx",bucket="all"}
      ranked: vector(0)

  - slug: gains
    name: Gains
    tag: Synthetic perps on Arbitrum, x500 cohort, threshold and fee read on chain
    confidence_tier: onchain
    formula: "Room = (threshold - 2 x fee x leverage) / leverage, by eth_call on the Arbitrum diamond for the standard pairs 0 and 1 and the x500 pairs 300 and 313. Checked against 11 liquidations: median 59.4% of collateral against 60.0% predicted."
    queries:
      p50: perp_liq_price_move_pct{venue="gains",bucket="all"}
      success: clamp_max(perp_leverage_max{venue="gains",bucket="all"}, 1)
      sample_size: count_over_time(perp_leverage_max{venue="gains",bucket="all"}[24h])
      series: perp_liq_price_move_pct{venue="gains",bucket="all"}
      ranked: vector(0)

  - slug: nova
    name: Nova
    tag: The same gTrade contract as Gains at a different address, priced higher
    confidence_tier: onchain
    formula: "The same read on Nova's own Arbitrum diamond, same pair indices and thresholds. The standard pair charges 0.050% a leg against Gains' 0.035%; the degen pair's maximum is 500.001x where Gains is fixed at 500x. Read 2026-10-22."
    queries:
      p50: perp_liq_price_move_pct{venue="nova",bucket="all"}
      success: clamp_max(perp_leverage_max{venue="nova",bucket="all"}, 1)
      sample_size: count_over_time(perp_leverage_max{venue="nova",bucket="all"}[24h])
      series: perp_liq_price_move_pct{venue="nova",bucket="all"}
      ranked: vector(0)

  - slug: papertrade
    name: Papertrade
    tag: House sided perps on Hyperliquid, bust buffer fixed in price, hard bust
    confidence_tier: onchain
    formula: "Room = (1/leverage - bust buffer) x 100, the buffer from the /state/trading instrument tuple as a share of price. Verified as a ceiling on 384 adverse closes with no exceedance. Collateral returned = 0, a hard bust."
    queries:
      p50: perp_liq_price_move_pct{venue="papertrade",bucket="all"}
      success: clamp_max(perp_leverage_max{venue="papertrade",bucket="all"}, 1)
      sample_size: count_over_time(perp_leverage_max{venue="papertrade",bucket="all"}[24h])
      series: perp_liq_price_move_pct{venue="papertrade",bucket="all"}
      ranked: vector(0)
