# OpenChainBench. Bench 295

slug: perp-max-leverage-terms
number: "295"
title: "Perp DEX leverage terms: room to liquidation and what is left"
seo_title: "Perp leverage: how far price moves before liquidation"
seo_description: "How far price moves before Gains, Papertrade, dYdX or Hyperliquid liquidates a position, at each venue's maximum leverage and at shared settings, read on chain."
subtitle: "Adverse price move that liquidates a position, read from each venue's own published parameters and checked against real liquidations. The selector sets the leverage: the default puts each venue at its own maximum, which is not a like for like reading, and the fixed settings put every venue on the same leverage. No row is ranked, because more room is not the same as better terms."
category: Trading
status: live
metric: Room to liquidation
unit: pct
higher_is_better: true
row_noun: { one: venue, many: venues }
zero_is_a_value: true
ledger_reliability: false

dimensions:
  kind:
    - { value: BTC, label: BTC }
    - { value: ETH, label: ETH }
  bucket:
