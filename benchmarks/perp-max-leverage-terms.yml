# OpenChainBench. Bench 295

slug: perp-max-leverage-terms
number: "295"
title: "Perp DEX leverage terms: room to liquidation and collateral returned"
seo_title: "Perp leverage: how far price moves before liquidation"
seo_description: "{{best_name}} leaves {{best_p50}} of room before liquidation, {{worst_name}} {{worst_p50}}. Room, max leverage and collateral returned for {{ranked_count}} venues at every leverage setting, live."
subtitle: "Adverse price move that liquidates a position, read from each venue's own published parameters. The selector sets the leverage: the default puts each venue at its own maximum, and the fixed settings put every venue on the same leverage so the rows are comparable. Beside the room sit the venue's top leverage and the collateral it returns."
category: Trading
