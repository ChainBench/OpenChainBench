# OpenChainBench. Bench № 210

slug: stellar-rpc
number: "210"
title: Fastest free Stellar Soroban RPC, live no-key endpoint latency
seo_title: "Fastest free Stellar Soroban RPC 2026"
seo_description: "{{best_name}} leads free Stellar Soroban RPC at {{best_p50}} (getLatestLedger p50, 24h). 5 no-key providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for getLatestLedger against every free, no-key public Stellar Soroban RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Stellar uses the Stellar Consensus Protocol (SCP) with roughly 5-second ledger closes and deterministic finality on every close. Soroban is Stellar's smart contract platform with a dedicated JSON-RPC interface. Free public Soroban RPC endpoints are available without an API key from Gateway.fm, Ankr, OnFinality, SorobanRPC.com and Lightsail Network. Every provider was live-verified with consecutive keyless getLatestLedger probes at launch.

abstract: |
  Per-chain member of the RPC latency cluster, extended to Stellar Soroban.
  We measure the round-trip latency of a single, identical JSON-RPC call
  (getLatestLedger) against every no-key public Stellar Soroban endpoint
  that sustains continuous probing — 5 providers at launch,
  every 60 seconds, from us-east, eu-west and Singapore. The harness
  classifies every response (ok / http_err / jsonrpc_err / stale /
  timeout) with a Stellar-scaled staleness gap (roughly 5 s per ledger).
  The cross-chain view lives on the parent rpc-capabilities benchmark;
  this page is the Stellar-scoped answer with per-region breakdowns
  as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: {\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"getLatestLedger\",\"params\":{}}. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the rotating id defeats edge caches."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms to 10 s), so percentiles are computed via Prometheus quantile_over_time over the last 24 hours."
  - "Call-result classification: ok (HTTP 200 + non-empty result with a parsable ledger sequence), http_err, jsonrpc_err (HTTP 200 carrying an error body), stale (more than 10 ledgers behind the cross-provider tip), timeout. Latency without reliability is a misleading ranking signal."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain rpc-capabilities benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to chain=stellar. Provider coverage at launch: 5 no-key Soroban endpoints (Gateway.fm, Ankr, OnFinality, SorobanRPC.com, Lightsail Network)."

findings:
  - "{{best_name}} currently leads free Stellar Soroban RPC at {{best_p50}} (getLatestLedger p50, 24h) across 5 measured providers."

faq:
  - q: "What is the fastest free Stellar Soroban RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (getLatestLedger p50 over the last 24h), measured against 5 no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Stellar Soroban RPCs work without an API key?"
    a: "5 endpoints sustain continuous keyless probing at launch: Gateway.fm, Ankr, OnFinality, SorobanRPC.com and Lightsail Network. Every listed endpoint was live-verified with a getLatestLedger POST returning a parsable ledger sequence before inclusion."
  - q: "What is the difference between Stellar Horizon and Soroban RPC?"
    a: "Horizon is Stellar's REST API for classic payments and account operations. Soroban RPC is the JSON-RPC interface for Stellar's smart contract platform. This benchmark measures Soroban RPC endpoints since they are the primary interface for dApp developers building on Stellar."
  - q: "How is Stellar Soroban RPC latency measured here, technically?"
    a: "One identical getLatestLedger POST every 60 seconds against each provider from each of 3 regions. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus quantile_over_time over 24 hours. Responses are classified (ok / http_err / jsonrpc_err / stale / timeout) so an endpoint stuck on an old ledger or returning errors is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="stellar"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: gateway
    name: Gateway.fm
    tag: Decentralized infrastructure provider with a public Stellar Soroban RPC endpoint, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single getLatestLedger POST sent every 60s from 3 regions to Gateway.fm's no-key Stellar Soroban endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="gateway", chain="stellar"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="gateway", chain="stellar"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="gateway", chain="stellar"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="gateway", chain="stellar"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="gateway", chain="stellar"}) / sum(ocb:rpc_call:rate_24h{provider="gateway", chain="stellar"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="gateway", chain="stellar"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="gateway", chain="stellar"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="gateway", chain="stellar", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="gateway", chain="stellar", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="gateway", chain="stellar", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="gateway", chain="stellar", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="gateway", chain="stellar", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="gateway", chain="stellar", region="sgp"}[1h])

