# OpenChainBench. Bench No 228

slug: merlin-rpc
number: "228"
title: Fastest free Merlin Chain RPC, live no-key endpoint latency
seo_title: "Fastest free Merlin Chain RPC 2026"
seo_description: "{{best_name}} leads free Merlin Chain RPC at {{best_p50}} (eth_getBlockByNumber EVM p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every available public Merlin Chain node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Merlin Chain is an EVM-compatible Bitcoin Layer 2 network (chain ID 4200) that uses ZK-Rollup technology to inherit Bitcoin security while enabling smart contracts and DeFi. It exposes a standard Ethereum JSON-RPC interface. Public EVM endpoints are available without an API key from Merlin Official, dRPC and BlockPI. Every provider was live-verified with consecutive eth_getBlockByNumber probes at launch.

abstract: |
  Merlin Chain: {{count}} free public RPC endpoints answering `the chain's head call` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:merlin-official}}.
  We measure the round-trip latency of a single eth_getBlockByNumber ("latest", false) call against every available public Merlin Chain node that sustains continuous probing: {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a standard EVM staleness gap. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Merlin Chain-scoped answer with per-region breakdowns.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: {\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}. Plain HTTP POST. Standard Ethereum JSON-RPC 2.0."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Merlin Chain-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=merlin. Provider coverage at launch: {{count}} endpoints (Merlin Official, dRPC, BlockPI)."

faq:
  - q: "What is the fastest free Merlin Chain RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (Merlin Chain block number p50 over the last 24h), measured against {{count}} providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Merlin Chain RPC endpoints work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today: Merlin Official (rpc.merlinchain.io), dRPC (merlin.drpc.org) and BlockPI (merlin.blockpi.network). Every listed endpoint was live-verified with an eth_getBlockByNumber call returning a parsable block number before inclusion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="merlin"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: merlin-official
    name: Merlin Official
    endpoint: https://rpc.merlinchain.io
    tag: Merlin Chain official public RPC, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for an eth_getBlockByNumber POST sent every 60s from 3 regions to rpc.merlinchain.io."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="merlin-official", chain="merlin"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="merlin-official", chain="merlin"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="merlin-official", chain="merlin"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="merlin-official", chain="merlin"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="merlin-official", chain="merlin"}) / sum(ocb:rpc_call:rate_24h{provider="merlin-official", chain="merlin"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="merlin-official", chain="merlin"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="merlin-official", chain="merlin"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="merlin-official", chain="merlin", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="merlin-official", chain="merlin", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="merlin-official", chain="merlin", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="merlin-official", chain="merlin", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="merlin-official", chain="merlin", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="merlin-official", chain="merlin", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    endpoint: https://merlin.drpc.org
    tag: dRPC decentralised multi-chain RPC, public Merlin Chain endpoint, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for an eth_getBlockByNumber POST sent every 60s from 3 regions to merlin.drpc.org."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="merlin"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="merlin"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="merlin"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="merlin"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="merlin"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="merlin"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="merlin"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="merlin"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="merlin", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="merlin", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="merlin", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="merlin", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="merlin", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="merlin", region="sgp"}[1h])

  - slug: blockpi
    name: BlockPI
    endpoint: https://merlin.blockpi.network/v1/rpc/public
    tag: BlockPI public Merlin Chain RPC, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for an eth_getBlockByNumber POST sent every 60s from 3 regions to merlin.blockpi.network/v1/rpc/public."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="blockpi", chain="merlin"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="blockpi", chain="merlin"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="blockpi", chain="merlin"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="blockpi", chain="merlin"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="blockpi", chain="merlin"}) / sum(ocb:rpc_call:rate_24h{provider="blockpi", chain="merlin"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="blockpi", chain="merlin"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="blockpi", chain="merlin"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="blockpi", chain="merlin", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="blockpi", chain="merlin", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="blockpi", chain="merlin", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="blockpi", chain="merlin", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="blockpi", chain="merlin", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="blockpi", chain="merlin", region="sgp"}[1h])
