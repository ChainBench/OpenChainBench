# OpenChainBench. Bench № 078

slug: usdy-nav-basis
number: "078"
title: USDY NAV basis, live market price vs official redemption rate
seo_title: "USDY price vs NAV 2026"
seo_description: "Does USDY trade at its NAV? Live basis between Ondo's tokenized treasury market price (Orca pool, Jupiter route) and the redemption price Ondo publishes onchain, in bps."
subtitle: "Signed basis between USDY's onchain market price and the redemption price Ondo publishes onchain, in basis points. Tokenized treasuries are the largest RWA segment; this is the live answer to whether the market actually prices the NAV."

category: RWA
status: live
metric: NAV basis
unit: bps
higher_is_better: false

seo_intro: |
  USDY is Ondo's yield-bearing tokenized treasury note, one of the
  largest RWA tokens by float. Its official value is the redemption
  rate Ondo publishes (the NAV a redeeming holder receives), but its
  price on the open market is whatever the pools say. This page
  measures the gap live: the Orca USDY/USDC whirlpool on Solana (the
  deepest genuine venue, about $2.9M) and the executable price of a
  $1,000 clip routed by Jupiter, each against the redemption price
  Ondo's own oracle publishes on Ethereum, every 60 seconds. A
  persistent negative basis means the market
  discounts the NAV (liquidity preference, exit friction); a positive
  one means buyers pay a premium over redemption value. Most tokenized
  treasuries (OUSG, BUIDL, BENJI) are transfer-restricted and never
  trade on open pools, so their NAV can never be market-tested; USDY
  is the rare one where the question is measurable at all.

abstract: |
  Every 60 seconds the harness reads the USDY redemption price from
  Ondo's RWADynamicOracle on Ethereum (getPrice, one eth_call), the
  Orca USDY/USDC whirlpool price from one Solana getAccountInfo
  (sqrtPrice decoded from the account bytes), and the price Jupiter
  quotes for selling $1,000 of USDY into USDC. Basis = (market - NAV) /
  NAV in signed basis points per venue. Read only, no transactions.
  Until 2026-08-26 the NAV leg was the Pyth Hermes redemption-rate
  feed; Hermes now requires a key for price updates and the harness
  sat on frozen values for a month before the switch on 2026-09-23.

methodology:
  - "NAV leg: getPrice() on Ondo's RWADynamicOracle for USDY (0xA0219AA5B31e65Bc920B5b6DFb8EdF0988121De0 on Ethereum), the redemption price the issuer publishes onchain, 18 decimals, read with one eth_call a minute. The Pyth Hermes RR feed served this leg until Hermes put price updates behind a key (2026-08-26)."
  - "Market leg, Orca: the USDY/USDC whirlpool on Solana (~$2.9M, the deepest genuine USDY pool anywhere), price decoded straight from getAccountInfo bytes (sqrtPrice u128 at offset 65, both mints 6 decimals)."
  - "Market leg, Jupiter: the executable price of selling 1,000 USDY into USDC through Jupiter's public quote API (lite-api.jup.ag, keyless), out amount over in amount. This is what a seller actually receives on Solana, route impact included, so it sits at or under the pool mid."
  - "Basis: signed, (market - NAV) / NAV x 10000. Negative = the market discounts the NAV. The ranking sorts by absolute basis; the sign is the story and both are displayed."
  - "Excluded, verified 2026-07-13: the Arbitrum Camelot USDY/USDC pool holds 232 USDY against 7M USDC, effectively drained, its stale price sitting ~345bps under NAV with near zero volume. Kept out of the ranking as the textbook example of why pool depth gates peg quality; revisited monthly."
  - "Also not measurable, disclosed: OUSG, BUIDL and BENJI are transfer-restricted mint/redeem instruments with no genuine open pools, so no market test of their NAV exists to publish."
  - "USDY is yield accruing: the redemption rate rises daily, so a naive USD peg comparison would show permanent drift. Comparing against the live RR feed removes that by construction."

findings:
  - "{{best_name}} trades closest to NAV at {{best_p50}} (p50 absolute basis, 24h) across {{count}} measured venues."
  - "{{name:orca-solana}} ({{p50:orca-solana}}) is the deepest genuine USDY venue anywhere at about $2.9M; its basis is the closest thing to a market verdict on Ondo's published NAV."
  - "{{name:jupiter-solana}} ({{p50:jupiter-solana}}) is what a $1,000 sale actually returns on Solana, route impact included; the gap between it and the Orca mid is the cost of exiting, the gap between it and NAV is the market's discount on Ondo's published price."
  - "The excluded Camelot pool on Arbitrum is the finding that did not make the table: drained to 232 USDY, price frozen ~345bps under NAV. Depth is not a detail in RWA pricing, it is the whole game."

faq:
  - q: "Does USDY trade at its NAV?"
    a: "Close to it, with a measurable basis that this page tracks live. On 2026-09-23 the Orca pool sat about 30 bps under the redemption price Ondo publishes and a $1,000 Jupiter sale about 40 bps under. A persistent discount reflects exit friction and liquidity preference, not a broken product; the point is that it is now measured instead of assumed."
  - q: "Why only two venues?"
    a: "Because genuine USDY liquidity is rarer than the token's float suggests. The Arbitrum Camelot pool is drained and excluded (232 USDY left, price frozen well under NAV), and most other tokenized treasuries never trade openly at all. Two honest venues beat five misleading ones."
  - q: "What does a negative basis mean?"
    a: "The market prices USDY under its redemption value. Redeeming through Ondo takes time and has minimums, so sellers who want out now accept a small discount. The size and persistence of that discount is exactly what this bench publishes."
  - q: "Why is USDY measurable when OUSG and BUIDL are not?"
    a: "OUSG, BUIDL and BENJI are transfer-restricted: they move between allowlisted addresses and cannot trade on open AMMs, so no market price exists to compare against NAV. USDY circulates freely and has genuine pools, which makes it the one tokenized treasury where the NAV question can be answered by measurement."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/usdy-nav-basis

prometheus:
  window: 24h
  freshness_metric: usdy_basis_bps

providers:
  - slug: orca-solana
    name: Orca (Solana)
    tag: "USDY/USDC whirlpool, ~$2.9M, deepest genuine USDY venue"
    formula: "p50 over 24h of the absolute signed basis (bps) between the Orca whirlpool USDY/USDC price and the redemption price on Ondo's oracle."
    queries:
      p50: quantile_over_time(0.50, abs(usdy_basis_bps{venue="orca-solana"})[24h:])
      p90: quantile_over_time(0.90, abs(usdy_basis_bps{venue="orca-solana"})[24h:])
      p99: quantile_over_time(0.99, abs(usdy_basis_bps{venue="orca-solana"})[24h:])
      mean: avg_over_time(abs(usdy_basis_bps{venue="orca-solana"})[24h:])
      success: avg_over_time(usdy_health{venue="orca-solana"}[24h])
      sample_size: count_over_time(usdy_basis_bps{venue="orca-solana"}[7d])
      series: usdy_basis_bps{venue="orca-solana"}
  - slug: jupiter-solana
    name: Jupiter route (Solana)
    tag: "Executable price of a ~$1k USDY sale into USDC, keyless quote API"
    formula: "p50 over 24h of the absolute signed basis (bps) between the price Jupiter quotes for selling 1,000 USDY into USDC and the redemption price on Ondo's oracle."
    queries:
      p50: quantile_over_time(0.50, abs(usdy_basis_bps{venue="jupiter-solana"})[24h:])
      p90: quantile_over_time(0.90, abs(usdy_basis_bps{venue="jupiter-solana"})[24h:])
      p99: quantile_over_time(0.99, abs(usdy_basis_bps{venue="jupiter-solana"})[24h:])
      mean: avg_over_time(abs(usdy_basis_bps{venue="jupiter-solana"})[24h:])
      success: avg_over_time(usdy_health{venue="jupiter-solana"}[24h])
      sample_size: count_over_time(usdy_basis_bps{venue="jupiter-solana"}[7d])
      series: usdy_basis_bps{venue="jupiter-solana"}
