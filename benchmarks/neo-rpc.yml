# OpenChainBench. Bench No 221

slug: neo-rpc
number: "221"
title: Fastest free NEO N3 RPC, live no-key endpoint latency
seo_title: "Fastest free NEO N3 RPC 2026"
seo_description: "{{best_name}} leads free NEO N3 RPC at {{best_p50}} (getblockcount p50, 24h). URLs for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for getblockcount against every available public NEO N3 node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  NEO N3 is the third generation of the NEO blockchain, a delegated Byzantine Fault Tolerant (dBFT) proof-of-stake L1 blockchain targeting one block every 60 seconds with one-block deterministic finality. NEO N3 uses a dual-token model (NEO for governance/GAS generation, GAS for transaction fees) and supports smart contracts in multiple languages via the NeoVM. Public JSON-RPC endpoints are available without an API key from NSPCC and Neo Global Development. Every provider was live-verified with consecutive getblockcount probes at launch.

abstract: |
  NEO N3: {{count}} free public RPC endpoints answering `the chain's head call` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single JSON-RPC call (getblockcount) against every available public NEO N3 node that sustains continuous probing: {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a NEO-scaled staleness gap (20 blocks, around 5 min at 15 s/block). The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the NEO N3-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: {\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"getblockcount\",\"params\":[]}. Plain HTTP POST. The result is a decimal integer (block count = current height + 1)."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the NEO N3-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=neo. Provider coverage at launch: {{count}} endpoints (NSPCC, NGD seed 1, NGD seed 2)."

faq:
  - q: "What is the fastest free NEO N3 RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (NEO N3 block count p50 over the last 24h), measured against {{count}} providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which NEO N3 RPC endpoints work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today: NSPCC (rpc10.n3.nspcc.ru:10331), NGD seed node 1 (n3seed1.ngd.network:10332) and NGD seed node 2 (n3seed2.ngd.network:10332). Every listed endpoint was live-verified with a getblockcount call returning a parsable block count before inclusion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="neo"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: nspcc
    name: NSPCC
    endpoint: https://rpc10.n3.nspcc.ru:10331
    tag: NSPCC NEO N3 public mainnet RPC node, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a getblockcount POST sent every 60s from 3 regions to rpc10.n3.nspcc.ru:10331."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nspcc", chain="neo"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="nspcc", chain="neo"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="nspcc", chain="neo"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="nspcc", chain="neo"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="nspcc", chain="neo"}) / sum(ocb:rpc_call:rate_24h{provider="nspcc", chain="neo"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="nspcc", chain="neo"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="nspcc", chain="neo"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nspcc", chain="neo", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="nspcc", chain="neo", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nspcc", chain="neo", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="nspcc", chain="neo", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nspcc", chain="neo", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="nspcc", chain="neo", region="sgp"}[1h])

  - slug: ngd
    name: NGD
    endpoint: https://n3seed1.ngd.network:10332
    tag: Neo Global Development seed node 1, public mainnet RPC, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a getblockcount POST sent every 60s from 3 regions to n3seed1.ngd.network:10332."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ngd", chain="neo"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="ngd", chain="neo"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="ngd", chain="neo"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="ngd", chain="neo"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="ngd", chain="neo"}) / sum(ocb:rpc_call:rate_24h{provider="ngd", chain="neo"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="ngd", chain="neo"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="ngd", chain="neo"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ngd", chain="neo", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ngd", chain="neo", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ngd", chain="neo", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ngd", chain="neo", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ngd", chain="neo", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ngd", chain="neo", region="sgp"}[1h])

  - slug: ngd2
    name: NGD (2)
    endpoint: https://n3seed2.ngd.network:10332
    tag: Neo Global Development seed node 2, public mainnet RPC, no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a getblockcount POST sent every 60s from 3 regions to n3seed2.ngd.network:10332."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ngd2", chain="neo"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="ngd2", chain="neo"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="ngd2", chain="neo"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="ngd2", chain="neo"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="ngd2", chain="neo"}) / sum(ocb:rpc_call:rate_24h{provider="ngd2", chain="neo"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="ngd2", chain="neo"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="ngd2", chain="neo"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ngd2", chain="neo", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ngd2", chain="neo", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ngd2", chain="neo", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ngd2", chain="neo", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ngd2", chain="neo", region="sgp"})
