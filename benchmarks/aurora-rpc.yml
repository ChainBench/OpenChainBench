# OpenChainBench. Bench № 147

slug: aurora-rpc
number: "147"
title: "Aurora RPC endpoints: free public URLs ranked by latency"
seo_title: "Aurora RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Aurora RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). {{count}} no-key endpoints measured, updated every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Aurora RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Aurora is the EVM runtime on NEAR Protocol (chain 1313161554), exposing full Ethereum tooling to NEAR's sharded execution environment. The official endpoint (`mainnet.aurora.dev`) is operated by Aurora Labs and is the only keyless endpoint sustaining continuous probing. Ankr and dRPC require an API key for Aurora and have been removed.

abstract: |
  Aurora: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:aurora-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against the no-key public Aurora endpoint that sustains continuous probing ({{count}} provider: Aurora Labs official), every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Aurora-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Aurora-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"aurora\"`. Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. Ankr and dRPC require an API key for Aurora and have been removed."

faq:
  - q: "Which Aurora RPCs work without an API key?"
    a: "{{count}} endpoint sustains continuous keyless probing: Aurora Official (mainnet.aurora.dev). Ankr returns 403 (API key required) and dRPC returns 403 (API key required) for Aurora."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="aurora"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: aurora-official
    name: Aurora Labs
    endpoint: https://mainnet.aurora.dev
    tag: Aurora Labs-operated public RPC for Aurora mainnet
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Aurora Labs's no-key Aurora endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="aurora-official", chain="aurora"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="aurora-official", chain="aurora"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="aurora-official", chain="aurora"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="aurora-official", chain="aurora"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="aurora-official", chain="aurora"}) / sum(ocb:rpc_call:rate_24h{provider="aurora-official", chain="aurora"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="aurora-official", chain="aurora"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="aurora-official", chain="aurora"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="aurora-official", chain="aurora", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="aurora-official", chain="aurora", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="aurora-official", chain="aurora", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="aurora-official", chain="aurora", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="aurora-official", chain="aurora", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="aurora-official", chain="aurora", region="sgp"}[1h])

