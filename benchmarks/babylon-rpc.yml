  - slug: lavenderfive
    name: LavenderFive
    endpoint: https://rpc.lavenderfive.com:443/babylon
    tag: LavenderFive public Babylon RPC, no API key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a Tendermint status GET sent every 60s from 3 regions to rpc.lavenderfive.com/babylon."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="lavenderfive", chain="babylon"})
