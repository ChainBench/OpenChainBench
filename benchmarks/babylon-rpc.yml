# OpenChainBench. Bench No 247

slug: babylon-rpc
number: "247"
title: Fastest free Babylon RPC, live no-key endpoint latency
seo_title: "Fastest free Babylon RPC 2026"
seo_description: "{{best_name}} leads free Babylon RPC at {{best_p50}} (block height p50, 24h). 3 providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for Tendermint status queries against every available public Babylon endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Babylon is a Cosmos SDK proof-of-stake blockchain that enables Bitcoin staking — BTC holders can stake their coins to provide economic security to Babylon and other PoS chains without moving their Bitcoin off the Bitcoin network. Babylon uses the CometBFT consensus engine and exposes a standard Tendermint RPC interface. Public endpoints are available without an API key from PublicNode, Polkachu, and LavenderFive. Every provider was live-verified with consecutive block-height probes at launch.

abstract: |
  Per-chain member of the RPC latency cluster, extended to Babylon.
  We measure the round-trip latency of a Tendermint status query against
  every available public Babylon endpoint that sustains continuous probing:
  3 providers at launch, every 60 seconds, from us-east, eu-west and
  Singapore. Each provider is probed via a GET request to its
  /status endpoint, from which the latest_block_height field is read.
  The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout)
  with a Cosmos-scaled staleness gap (40 blocks, around 4 min at 6 s/block).
  The cross-chain view lives on the parent rpc-capabilities benchmark;
  this page is the Babylon-scoped answer with per-region breakdowns as
  a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: GET <endpoint>/status. Returns a Tendermint status JSON object; block height is read from result.sync_info.latest_block_height."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms to 10 s), so percentiles are computed via Prometheus quantile_over_time over the last 24 hours."
  - "Call-result classification: ok (parsable block height returned), http_err, jsonrpc_err, stale (block more than 40 behind the cross-provider tip), timeout."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain rpc-capabilities benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to chain=babylon. Provider coverage at launch: 3 endpoints (PublicNode, Polkachu, LavenderFive)."

findings:
  - "{{best_name}} currently leads Babylon RPC at {{best_p50}} (Tendermint status p50, 24h) across 3 measured providers."

faq:
  - q: "What is the fastest free Babylon RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (Babylon block height p50 over the last 24h), measured against 3 providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Babylon RPC endpoints work without an API key?"
    a: "3 endpoints sustain continuous keyless probing at launch: PublicNode (babylon-rpc.publicnode.com), Polkachu (babylon-rpc.polkachu.com) and LavenderFive (rpc.lavenderfive.com/babylon). Every listed endpoint was live-verified with a block-height probe returning a parsable result before inclusion."
  - q: "What is Babylon and why does its RPC latency matter?"
    a: "Babylon is a Cosmos SDK chain that enables native Bitcoin staking. Developers building on Babylon or integrating its Bitcoin staking protocol need reliable low-latency RPC access to query chain state, submit transactions, and monitor finality. Knowing which public endpoint is fastest from your region helps optimize integration performance."
  - q: "Does the fastest Babylon RPC change by region?"
    a: "Often. PublicNode, Polkachu, and LavenderFive all have different infrastructure footprints; rankings shift by geographic origin. The region tabs re-scope every number to a single origin."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="babylon"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    tag: PublicNode public Babylon RPC, no API key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a Tendermint status GET sent every 60s from 3 regions to babylon-rpc.publicnode.com."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="babylon"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="babylon"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="babylon"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="babylon"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="babylon"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="babylon"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="babylon"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="babylon"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="babylon", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="babylon", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="babylon", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="babylon", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="babylon", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="babylon", region="sgp"}[1h])

