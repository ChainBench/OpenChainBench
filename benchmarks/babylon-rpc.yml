      sample_size: sum(ocb:rpc_call:increase_24h{provider="polkachu", chain="babylon"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="babylon"}[1h]))
      regions:
        - region: us-east
