# OpenChainBench. Bench № 159

slug: harmony-rpc
number: "159"
title: Fastest free Harmony ONE RPC, live no-key endpoint latency
seo_title: "Fastest free Harmony ONE RPC 2026"
seo_description: "{{best_name}} leads free Harmony ONE RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). 2 no-key providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Harmony ONE RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Harmony (chain 1666600000) is a proof-of-stake sharded EVM blockchain, ONE gas token, running four shards with Effective Proof of Stake across roughly 1000 validators, achieving fast-finality at around 2 seconds on Shard 0. Harmony S0 and 1RPC provide keyless shard-0 access probed every 60 seconds from three regions.

abstract: |
  Per-chain member of the RPC latency cluster, extended to Harmony ONE.
  We measure the round-trip latency of a single, identical RPC call
  (`eth_getBlockByNumber`) against every no-key public Harmony ONE endpoint
  that sustains continuous probing, 2 providers at launch,
  every 60 seconds, from us-east, eu-west and Singapore. The harness
  classifies every response (ok / http_err / jsonrpc_err / stale /
  timeout) so the leaderboard rewards sustained availability rather than
  fast error messages. The cross-chain view lives on the parent
  `rpc-capabilities` benchmark; this page is the Harmony ONE-scoped answer
  with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms to 10 s), so percentiles are computed via Prometheus `quantile_over_time` over the last 24 hours."
  - "Call-result classification: `ok` (HTTP 200 + non-empty result), `http_err`, `jsonrpc_err` (HTTP 200 carrying an error body), `stale` (more than 20 blocks behind the cross-provider tip), `timeout`."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities) benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to `chain=\"harmony\"`. Provider coverage at launch: 2 no-key endpoints (Harmony S0, 1RPC)."

findings:
  - "{{best_name}} currently leads free Harmony ONE RPC at {{best_p50}} (`eth_getBlockByNumber` p50, 24h) across 2 measured providers."

faq:
  - q: "What is the fastest free Harmony ONE RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber` p50 over the last 24h), measured against 2 no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Harmony ONE RPCs work without an API key?"
    a: "2 endpoints sustain continuous keyless probing at launch: Harmony S0, 1RPC. Every listed endpoint was live-verified before inclusion."
  - q: "Does the fastest Harmony ONE RPC change by region?"
    a: "Often. The region tabs at the top of the page re-scope every number to a single origin; pick the one closest to where your requests originate."
  - q: "How is Harmony ONE RPC latency measured here?"
    a: "One identical JSON-RPC POST (`eth_getBlockByNumber`) every 60 seconds against each provider from each of 3 regions. Responses are classified so an endpoint stuck on an old head or returning errors is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="harmony"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: harmony-s0
    name: Harmony S0
    tag: Harmony Foundation Shard-0 alternate gateway
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Harmony Foundation's Shard-0 alternate endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="harmony-s0", chain="harmony"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="harmony-s0", chain="harmony"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="harmony-s0", chain="harmony"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="harmony-s0", chain="harmony"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="harmony-s0", chain="harmony"}) / sum(ocb:rpc_call:rate_24h{provider="harmony-s0", chain="harmony"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="harmony-s0", chain="harmony"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="harmony-s0", chain="harmony"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="harmony-s0", chain="harmony", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="harmony-s0", chain="harmony", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="harmony-s0", chain="harmony", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="harmony-s0", chain="harmony", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="harmony-s0", chain="harmony", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="harmony-s0", chain="harmony", region="sgp"}[1h])

  - slug: 1rpc
    name: 1RPC
    tag: Privacy-first RPC relay, Automata Network
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to 1RPC's no-key Harmony endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="1rpc", chain="harmony"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="1rpc", chain="harmony"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="1rpc", chain="harmony"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="1rpc", chain="harmony"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="1rpc", chain="harmony"}) / sum(ocb:rpc_call:rate_24h{provider="1rpc", chain="harmony"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="1rpc", chain="harmony"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="1rpc", chain="harmony"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="1rpc", chain="harmony", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="1rpc", chain="harmony", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="1rpc", chain="harmony", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="1rpc", chain="harmony", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="1rpc", chain="harmony", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="1rpc", chain="harmony", region="sgp"}[1h])
