prometheus:
  window: 24h
  expected_freshness_seconds: 10800
  freshness_timestamp_metric: server_wallet_cost_last_run_timestamp_seconds

# kind="all" is the AI agents workload and bucket="all" its medium size
# (10,000 agents); see bench 309 for the convention.
zero_is_a_value: true
ledger_reliability: false
ledger_columns:
  - { label: Monthly bill, slot: p50, unit: usd }
  - { label: Per transaction, panel: per_tx, unit: usd }

metric_panels:
  - id: per_tx
    label: Cost per transaction
    description: The monthly bill divided by the month's transactions. Derived, not a published rate.
    metric: server_wallet_cost_per_tx_usd{kind="all",bucket="all"}
    label_key: provider
    unit: usd
    higher_is_better: false

dimension_labels:
  kind: Workload
  bucket: Size

dimensions:
  kind:
    - { value: all,     label: "AI agents, 50 transactions each" }
    - { value: bot,     label: "Trading bot, 20 wallets" }
    - { value: payouts, label: "Payouts, 2 transactions a wallet" }
  bucket:
    - { value: all,   label: "Medium size" }
    - { value: small, label: "Small size" }
    - { value: large, label: "Large size" }

providers:
  - slug: coinbase-cdp
    name: Coinbase CDP
    tag: Wallet operations
    queries:
      p50: min(last_over_time(server_wallet_cost_monthly_usd{provider="coinbase-cdp",kind="all",bucket="all"}[20m]))
      p90: min(last_over_time(server_wallet_cost_monthly_usd{provider="coinbase-cdp",kind="all",bucket="all"}[20m]))
      p99: min(last_over_time(server_wallet_cost_monthly_usd{provider="coinbase-cdp",kind="all",bucket="all"}[20m]))
      ranked: server_wallet_cost_eligible{provider="coinbase-cdp",kind="all",bucket="all"}
      mean: min(last_over_time(server_wallet_cost_monthly_usd{provider="coinbase-cdp",kind="all",bucket="all"}[20m]))
      series: min by (provider) (server_wallet_cost_monthly_usd{provider="coinbase-cdp",kind="all",bucket="all"})
