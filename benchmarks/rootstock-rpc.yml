      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="rootstock"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="rootstock"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="rootstock", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="rootstock", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="rootstock", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="rootstock", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="rootstock", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="rootstock", region="sgp"}[1h])

  - slug: thirdweb
    name: Thirdweb
    endpoint: https://30.rpc.thirdweb.com
    tag: Thirdweb public RPC gateway for Rootstock
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Thirdweb's no-key Rootstock RPC endpoint."
    queries:
