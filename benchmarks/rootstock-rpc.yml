    name: dRPC
    endpoint: https://rootstock.drpc.org
    tag: dRPC public gateway routing to Rootstock node pool
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to dRPC's no-key Rootstock RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="rootstock"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="rootstock"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="rootstock"})
