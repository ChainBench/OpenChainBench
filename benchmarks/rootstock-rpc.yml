# OpenChainBench. Bench № 130

slug: rootstock-rpc
number: "130"
title: Fastest free Rootstock RPC, live no-key EVM endpoint latency
seo_title: "Fastest free Rootstock RPC 2026"
seo_description: "{{best_name}} leads free Rootstock RPC at {{best_p50}} (`eth_getBlockByNumber` p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for the `eth_getBlockByNumber("latest", false)` method against every free, no-key public Rootstock EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Rootstock (chain 30) is the longest-running Bitcoin EVM, a merge-mined sidechain secured by
  54%+ of Bitcoin hashrate under REMASC consensus, with a 30-second block cadence and RBTC as
  its native gas token (RBTC), a 1:1 BTC peg bridged through the Powpeg. The chain has been live
  since 2018, predating most EVM L2s. A 2026-08-03 audit confirms {{count}} clean keyless providers:
  the Rootstock official endpoint (public-node.rsk.co), dRPC (rootstock.drpc.org), and
  Thirdweb (30.rpc.thirdweb.com). Excluded providers: Blast API (shut down, redirects to
  Alchemy), Ankr (no Rootstock route), MyEtherWallet node (rate-limited without key).

abstract: |
  Rootstock: {{count}} free public RPC endpoints answering `the chain's head call` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:rootstock-official}}.
  We measure the round-trip latency of a single, identical JSON-RPC call (`eth_getBlockByNumber("latest", false)`) against every no-key public Rootstock endpoint that sustains continuous probing, {{count}} providers measured, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a Rootstock-scaled staleness gap (20 blocks at Rootstock's ~30 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Rootstock-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\", false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the rotating id defeats edge caches that would answer a bare head query without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Rootstock-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"rootstock\"`. Provider coverage: {{count}} no-key endpoints."

faq:
  - q: "What is the fastest free Rootstock RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber(\"latest\", false)` p50 over the last 24h), measured against {{count}} no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples. Use the region tabs to see the leader from the origin closest to your deployment."
  - q: "Which Rootstock RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing: Rootstock Foundation (https://public-node.rsk.co), dRPC (https://rootstock.drpc.org), and Thirdweb (https://30.rpc.thirdweb.com). Every listed endpoint was live-verified with a `eth_getBlockByNumber` POST returning a parsable response before inclusion."
  - q: "How is Rootstock RPC latency measured here, technically?"
    a: "One identical `eth_getBlockByNumber(\"latest\", false)` POST every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="rootstock"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: rootstock-official
    name: Rootstock Foundation
    endpoint: https://public-node.rsk.co
    tag: RSKSwap public node operated by the Rootstock Foundation
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Rootstock Foundation's no-key Rootstock RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="rootstock-official", chain="rootstock"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="rootstock-official", chain="rootstock"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="rootstock-official", chain="rootstock"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="rootstock-official", chain="rootstock"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="rootstock-official", chain="rootstock"}) / sum(ocb:rpc_call:rate_24h{provider="rootstock-official", chain="rootstock"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="rootstock-official", chain="rootstock"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="rootstock-official", chain="rootstock"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="rootstock-official", chain="rootstock", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="rootstock-official", chain="rootstock", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="rootstock-official", chain="rootstock", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="rootstock-official", chain="rootstock", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="rootstock-official", chain="rootstock", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="rootstock-official", chain="rootstock", region="sgp"}[1h])

