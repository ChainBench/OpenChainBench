# OpenChainBench. Bench 274
slug: protocol-pf-ratio
number: "274"
title: "Price to fees across DeFi: what the market pays per dollar of protocol fees"
seo_title: "DeFi token price to fees: {{best_names}} lowest of {{ranked_count}} at {{best_p50}}"
seo_description: "{{best_name}} has the lowest price to fees of {{ranked_count}} DeFi tokens at {{best_p50}}, each read against its category median, with float and 30-day fee trend."
subtitle: "Circulating market cap divided by annualized fees, for every protocol that earns real fees and has a listed token. The number to read is not the ratio but the column beside it: the same multiple can be ordinary in one category and low in another, so each row is compared to the median of its own category rather than to the market."
category: Trading
status: live
metric: P/F ratio
row_noun: { one: protocol, many: protocols }
unit: x
higher_is_better: false

disclaimer: |
  A screen, not a verdict, and not advice. P/F = circulating market cap
  (CoinGecko) / annualized fees (DeFiLlama, trailing 30d x 365/30) summed
  across every fee adapter that accrues to the token. Fees include the
  share paid to liquidity providers. A low multiple can mean the market
  expects fees to fall, that the fees were incentivised, or that the token
  has no claim on them. Read it with the float, the category median and the
  monthly fee trend, then do your own work.

seo_intro: |
  Price to fees is the on-chain cousin of a price to sales multiple:
  market cap on top, a year of fees at the bottom. Published on its own it
  invites a false comparison, because the multiple a category trades at is
  itself a fact about the category. The category medians published beside
  the board span more than an order of magnitude, so the same multiple is
  high in one column of the market and low in another. Every row here therefore
  carries its own category median next to it, and the ratio of the two is
  what says whether a protocol is priced low against the protocols it actually
  competes with. Float sits beside both, because a multiple on a token with
  most of its supply unvested is a multiple on a market cap that does not
  yet exist.

abstract: |
  The protocol-valuation harness joins three DeFiLlama reads and one from
  CoinGecko, hourly. /overview/fees gives one row per fee adapter with its
  trailing 30d, prior 30d and 1y totals; /protocols gives the child
  protocols, some carrying a CoinGecko id; /config gives the 849 parent
  protocols, 451 of them with one. The third read is what makes the board
  possible: a fee adapter is per product (GMX V1 Perps, GMX V2 Perps, GMX
  Solana) and the token belongs to the parent, which has no row in
  /protocols at all. Resolving only through the adapter's own row finds 90
  tokens; adding the parent table finds 259. Adapters that resolve to the
  same token are summed rather than ranked apart, because one market cap
  divided by the fees of one product would price the token several times
  over. CoinGecko /coins/markets supplies market cap, fully diluted
  valuation, circulating and total supply, and the 30-day price change.
  The same /overview/fees read with dataType=dailyRevenue gives revenue
  per adapter, /protocols gives TVL per row, and CoinGecko /market_chart
  gives 91 days of daily market cap and price per token, whose ratio is
  the circulating supply each day. Gauges are protocol_pf_ratio,
  protocol_pf_fdv_ratio, protocol_float_pct, protocol_fees_30d_usd,
  protocol_fee_growth_30d_pct, protocol_price_change_30d_pct,
  protocol_category_pf_median, protocol_pf_vs_category_ratio,
  protocol_diverging, protocol_revenue_30d_usd, protocol_ps_ratio,
  protocol_tvl_usd, protocol_supply_change_30d_pct and
  protocol_supply_change_90d_pct.

methodology:
  - "Board membership. A token whose fee adapter is knowably incomplete (protocol_fees_incomplete = 1: the adapter reports $0 over 30 days after a year of fees, so the ratio would be built on a fraction of the protocol) is metered but not listed; on 2026-09-25 that is Drift, Bluefin and DoubleZero. The peer median of each category is a live gauge (protocol_category_pf_median), read on the vs-category tab, never a number typed here."
  - "P/F = circulating market cap / annualized fees, where annualized fees are the trailing 30 day sum x 365/30. Same cut as benches 234 and 265, so the three valuation boards stay comparable."
  - "Fees are the total DeFiLlama reports for the protocols behind the token, summed across every adapter: Uniswap V2, V3 and V4 are one row, GMX's five products are one row. Ranking them apart would divide one market cap by a fraction of its own revenue. Total, not revenue: most of a DEX's fees go to liquidity providers and most of a staking protocol's to stakers, so this is what users paid, not what the token earns."
  - "The token is resolved through DeFiLlama's own links, not by name matching: the adapter's defillamaId joins to /protocols, and when that row carries no CoinGecko id the parent protocol from /config does."
  - "Category: the one carrying most of the token's fees, not the one its first-listed adapter sits in. Drift files a small spot product under Dexs and earns most of its fees on perps, so taking the first would compare it to liquid staking protocols and drag their median with it."
  - "Peer comparison: each row carries the median P/F of its category, and protocol_pf_vs_category_ratio is the row divided by that median. A category needs at least 5 tokens before a median is published; a row in a smaller category shows its ratio with no comparison rather than a comparison against one or two protocols."
  - "Market cap floor: 5 million USD of circulating market cap. Below it the ratio is not a valuation: a token worth a few hundred thousand dollars against millions of annual fees prints a multiple near zero and would lead an ascending board as the cheapest token in DeFi, when it is an abandoned or unlisted one. Fifteen of the top twenty rows sat under 10 million before this floor (2026-09-25)."
  - "Float floor: a token with less than 10 percent of supply circulating is not ranked. Its market cap is a fraction of what the token will be, so the ratio reads near zero and would lead an ascending board."
  - "Fee floor: 100,000 USD of trailing 30 day fees, applied to the token after its adapters are summed rather than to each adapter. A token whose products only clear the floor together belongs on the board, and a multi-product token must not lose its smaller products out of its own denominator."
  - "The board shows the largest fee earners; a row whose category has fewer than 5 tokens carries its ratio with no peer comparison. The harness publishes every row that clears the floors, so the cut is editorial and the full set is queryable."
  - "A protocol whose fee history is shorter than the windows is not ranked: when every fee its adapters ever reported falls inside the trailing 30 days (protocol_fees_window_short = 1), x 365/30 would overstate the run rate, so the row is metered with protocol_fees_incomplete = 1 and leaves the board and the median until a full window exists."
  - "Fees and revenue are two views of one business, so they move together. When one grows half again as much as the other over the same month, what changed is what is being counted: protocol_fee_basis_shift marks the row and its fee trend is withheld for a month afterwards, because the seam sits in the prior window that long. DefiLlama rewrote the Convex adapter on 2026-08-18 without backfilling, printing 92 percent on a business that grew 15."
  - "The month-over-month trend needs a full prior month: it publishes only when the year total reaches past both windows, so a 40-day-old adapter is ranked with no trend rather than with growth measured against ten days."
  - "A token with a fee adapter reporting nothing over 30 days after real fees over the year has a published total short of its revenue, and is excluded from the board, from its category median and from the screen. DeFiLlama's Drift Trade adapter is in that state: it reports $0 after $11.1M over the year, so only Drift's $1.2M staking product reaches the token. protocol_fees_incomplete and protocol_silent_adapter_fees_1y_usd publish the flag and the size of the gap."
  - "protocol_diverging is 1 when three things hold at once: fees grew month over month, the token fell over 30 days, and the P/F sits below the category median. The third clause is what stops it naming every protocol having a bad month."
  - "Revenue 30d (protocol_revenue_30d_usd): the share of fees the protocol keeps, per each adapter's own definition on DeFiLlama (/overview/fees with dataType=dailyRevenue), summed over the adapters the fees come from. Absent when no adapter behind the token publishes a revenue series: that is unknown, not zero. Published as 0 when the adapters have one and report none."
  - "protocol_revenue_incomplete is 1 when the revenue total is knowably short: the fee total itself is short, a revenue adapter reports nothing over 30 days after real revenue over the year, or a product earning fees this month has no revenue series while its siblings do (protocol_revenue_missing_adapters counts them). Revenue is published with the flag; the P/S built on it is not, because a multiple on a fraction of the revenue reads higher than it is."
  - "P/S (protocol_ps_ratio) = circulating market cap / annualized revenue, revenue being the trailing 30 day sum x 365/30. The same multiple as P/F on what the token's protocol keeps rather than on what its users paid. Absent when revenue is missing, zero or knowably short, so no row reads as infinitely priced, as free, or as pricier than it is."
  - "TVL (protocol_tvl_usd): DeFiLlama /protocols tvl summed over every row that resolves to the token by the same rule as the fee adapters, its own CoinGecko id first, else its parent's, so Aave V2, V3 and Horizon count once each under AAVE. Absent when no row carries a TVL: a launchpad or a perp DEX settling on its own chain has nothing locked, and that is not a zero."
  - "Supply 30d and 90d (protocol_supply_change_30d_pct, protocol_supply_change_90d_pct): circulating supply now against 30 and 90 days ago, in percent. Source: CoinGecko /market_chart, 91 days of daily market cap and price per token; their ratio is the circulating supply CoinGecko held that day. Absent while the series is shorter than the window. One CoinGecko call per token per UTC day, cached in memory."
  - "Supply change is realized dilution, not an unlock schedule. A positive figure is supply that reached the float over the window (unlocks, emissions), a negative one a burn. A cliff next month is invisible here until it lands, and a token that unlocked last week shows it in the 30 day column before the 90 day one catches up."
  - "Cadence: hourly. DeFiLlama's fee series is daily and CoinGecko's free tier is rate limited, so a faster poll would spend requests re-reading numbers that have not moved. p50, p90, p99 and the mean read the same gauge and are equal by construction."
  - "The cohort is rebuilt from upstream every poll and the per-protocol series are reset with it, so a token that is delisted or drops below a floor loses its row rather than carrying a stale valuation forward."

findings:
  - "{{best_name}} has the lowest price to fees of the {{ranked_count}} ranked protocols, {{best_p50}} of annualized fees."
  - "A ratio only means something inside its category: the medians published alongside the board span more than an order of magnitude, so the same multiple sits above the median in one column of the market and below it in another."
  - "{{worst_name}} carries the highest multiple on the board, {{worst_p50}}, on today's fee run rate."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/protocol-valuation

prometheus:
  window: 24h
  expected_freshness_seconds: 7200
  freshness_metric: protocol_valuation_health
  freshness_timestamp_metric: protocol_valuation_last_success_unix

panel_main_description: "Circulating market cap divided by annualized fees. Lower means the market pays less per dollar of fees the protocol collects."

metric_panels:
  - id: pf_vs_category
    label: vs category
    label_key: protocol
    metric: protocol_pf_vs_category_ratio{}
    unit: x
    higher_is_better: false
    description: "This protocol's P/F divided by the median P/F of its category. Below 1 is a lower multiple than the protocols it competes with; this is the column to read, not the raw ratio."
  - id: fee_growth
    label: Fees MoM
    label_key: protocol
    metric: protocol_fee_growth_30d_pct{}
    unit: pct
    higher_is_better: true
    description: "Change in 30 day fees against the prior 30 days. The revenue side of the trend."
  - id: price_change
    label: Token 30d
    label_key: protocol
    metric: protocol_price_change_30d_pct{}
    unit: pct
    higher_is_better: true
    description: "Token price change over the same window. Fees up while this is down is the divergence the board screens for."
  - id: float_pct
    label: Float
    label_key: protocol
    metric: protocol_float_pct{}
    unit: pct
    higher_is_better: true
    description: "Circulating supply as a percent of total supply. The gap between P/F and FDV/F is this number."
  - id: pf_fdv
    label: FDV / fees
    label_key: protocol
    metric: protocol_pf_fdv_ratio{}
    unit: x
    higher_is_better: false
    description: "Fully diluted valuation divided by annualized fees. The conservative multiple: it prices unvested supply as if it were already trading."
  - id: mcap
    label: Market cap
    label_key: protocol
    metric: protocol_mcap_usd{}
    unit: usd
    higher_is_better: true
    description: "Circulating market cap in USD from CoinGecko, the numerator of P/F and P/S, so each ratio can be rebuilt from its own row."
  - id: fees_30d
    label: Fees 30d
    label_key: protocol
    metric: protocol_fees_30d_usd{}
    unit: usd
    higher_is_better: true
    description: "Trailing 30 day fees in USD, total across every adapter of the protocols behind this token, including the share paid to liquidity providers and stakers."
  - id: revenue_30d
    label: Revenue 30d
    label_key: protocol
    metric: protocol_revenue_30d_usd{}
    unit: usd
    higher_is_better: true
    description: "Trailing 30 day revenue in USD: the share of fees the protocol keeps, per each adapter's DeFiLlama definition, over the same adapters as the fees. Absent when no adapter publishes a revenue series; 0 when they do and report none."
  - id: ps
    label: P/S
    label_key: protocol
    metric: protocol_ps_ratio{}
    unit: x
    higher_is_better: false
    description: "Circulating market cap divided by annualized revenue. The P/F multiple on what the protocol keeps rather than on what its users paid. Absent when revenue is missing, zero or knowably partial."
  - id: tvl
    label: TVL
    label_key: protocol
    metric: protocol_tvl_usd{}
    unit: usd
    higher_is_better: true
    description: "Value locked in USD across every DeFiLlama row that resolves to this token, own row or parent. Absent for protocols with nothing locked, which is not a zero."
  - id: supply_30d
    label: Supply 30d
    label_key: protocol
    metric: protocol_supply_change_30d_pct{}
    unit: pct
    higher_is_better: false
    description: "Change in circulating supply over 30 days, from CoinGecko daily market cap / price. Realized dilution, not an unlock schedule. Absent while the series is shorter than 30 days."
  - id: supply_90d
    label: Supply 90d
    label_key: protocol
    metric: protocol_supply_change_90d_pct{}
    unit: pct
    higher_is_better: false
    description: "Change in circulating supply over 90 days, same source. Absent while the series is shorter than 90 days."

ledger_columns:
  - { label: "P/F", slot: p50 }
  - { label: "vs category", panel: pf_vs_category }
  - { label: "Market cap", panel: mcap }
  - { label: "Fees 30d", panel: fees_30d }
  - { label: "P/S", panel: ps }
  - { label: "Revenue 30d", panel: revenue_30d }
  - { label: "TVL", panel: tvl }
  - { label: "Supply 30d", panel: supply_30d }

faq:
  - q: "What does a P/F of 2 mean?"
    a: "That the market values the token at two years of its current fee run rate. It is the same idea as a price to sales multiple, with annualized protocol fees in place of revenue. Low means the market pays little per dollar of fees; it does not mean the token is underpriced."
  - q: "Why compare to a category median instead of the whole market?"
    a: "Because the multiple a category trades at is itself a fact about the category, and it varies by more than an order of magnitude across the board. A single market-wide median would rank the categories and call it a ranking of protocols."
  - q: "Why is there a market cap floor?"
    a: "Because a multiple is a price divided by something, and a token worth a few hundred thousand dollars is not a price the market agreed on. Its ratio reads near zero and leads an ascending board, where it looks like the cheapest protocol in DeFi rather than an abandoned token. The floor is 5 million USD of circulating market cap, and a row under it publishes no series at all, the same as the float floor."
  - q: "Why are tokens with a small float excluded?"
    a: "Because their market cap is a fraction of what the token will be once supply vests, so the ratio reads near zero and takes the top of an ascending board. The FDV column is the honest view for those tokens, and the float floor is 10 percent of total supply."
  - q: "Are Uniswap V2, V3 and V4 three rows?"
    a: "No. They accrue to one token, so their fees are summed into one row. Ranking them apart would divide one market cap by a fraction of its own revenue three times."
  - q: "Is a diverging row a buy signal?"
    a: "No. It says fees grew while the token fell and the protocol trades at a lower multiple than its peers, which is a place to start work, not a conclusion. Fees can be incentivised, a token can have no claim on them, and a market can be right to re-rate a protocol down."
  - q: "How is the token found for each protocol?"
    a: "Through DeFiLlama's own links rather than by matching names. The fee adapter's defillamaId joins to the protocol catalogue, and where that row carries no CoinGecko id the parent protocol supplies it. A protocol with no listed token has no row here; most of the fee universe is in that state."
