# OpenChainBench. Bench 200

slug: memecoin-platforms
number: "200"
title: Cheapest platform to trade memecoins (Fomo vs pump.fun vs Photon)
seo_title: "Fomo vs pump.fun trading fees 2026"
seo_description: "Compare explicit on-chain fees on Fomo, pump.fun, Photon, Axiom, Trojan, GMGN and Phantom. Real fee data verified against Solana transactions on the top pump.fun tokens."
subtitle: Average explicit on-chain fee per trade (gas plus platform referral and bot tips) as a percent of trade value, sampled across the top 10 pump.fun tokens every 5 minutes.
category: Trading
status: live
metric: Avg explicit fee
unit: pct

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/memecoin-platforms

seo_intro: |
  Every Solana memecoin frontend charges differently. Fomo, Photon, Axiom, Trojan and GMGN
  add referral tips and bot fees on top of the base pool swap. This benchmark measures
  those explicit on-chain charges directly from Solana transaction data, verified per trade
  against the public RPC. The headline number is the average fee as a percent of trade value,
  covering gas plus any referral or bot fee extracted in the transaction. The AMM liquidity
  provider fee (0.20 to 0.25 percent depending on pool) applies equally to all frontends and
  is excluded. Trades below 5 USD are filtered to remove gas-dominated dust.

abstract: |
  The harness fetches the top 10 tokens by market cap from pump.fun every 5 minutes, then
  pulls the last 200 trades per token from Mobula token/trades-enriched (chainId=solana:solana).
  Mobula supplies the platform tag (fomo, photon, trojan, gmgn, axiom, phantom, null) and the
  transaction hash. For each transaction the harness calls the public Solana JSON-RPC
  getTransaction, parses all SOL and token balance changes, and sums the transfers to known
  fee wallet addresses plus any small SOL recipients consistent with bot or referral tips.
  The result is the true explicit fee in USD, independent of any third-party fee field.
  Trades below 5 USD are excluded to avoid gas-dominated micro-trade noise.

methodology:
  - "Tokens: top 10 by market cap from pump.fun public API, refreshed every 5 minutes."
  - "Trades: last 200 trades per token from Mobula token/trades-enriched (chainId=solana:solana), filtered to amountUSD >= 5."
  - "Fee source: Solana public RPC getTransaction per trade hash. Balance changes of known fee wallet owners are summed in USD. Gas (meta.fee) is always included. AMM LP fees that remain inside pool accounts are excluded."
  - "Platform tag: from Mobula platform field. Null-tagged trades are counted as pump-fun native since we exclusively sample pump.fun top tokens."
  - "SOL price: fetched from CoinGecko every 5 minutes, used to convert SOL-denominated fees to USD."
  - "Cadence: full sweep every 5 minutes. Transaction parse results are cached so each tx is only fetched once."
  - "Aggregation: headline is the p50 of memecoin_platform_fee_pct over 24 hours."

findings:
  - "{{best_name}} currently shows the lowest explicit on-chain fee at {{best_p50}} (p50, 24h) across top pump.fun tokens."
  - "{{worst_name}} shows the highest at {{worst_p50}} (p50, 24h). Bot platforms extract a fixed tip per trade on top of DEX fees."

faq:
  - q: "Is Fomo cheaper than pump.fun?"
    a: "{{best_name}} currently leads at {{best_p50}} (p50, 24h). The live leaderboard refreshes every 5 minutes from on-chain Solana data."
  - q: "What fees do memecoin trading platforms charge?"
    a: "Native clients (pump.fun, Phantom) add no explicit referral fee. Aggregators (Photon, Axiom) add a referral tip of roughly 0.85 to 0.9 percent. Trading bots (Trojan, GMGN, Fomo) extract a bot fee of roughly 0.85 to 1.3 percent per trade. All platforms share the same underlying AMM liquidity provider fee, which this benchmark excludes."
  - q: "Why is the AMM LP fee excluded?"
    a: "The LP fee (0.20 to 0.25 percent on PumpSwap and Raydium pools) stays inside the pool as accumulated yield for liquidity providers. It is not extracted as a separate SOL or token transfer and cannot be measured per-trade without a price oracle. Because it applies equally to all frontends routing through the same pool, excluding it does not change the relative ranking."

prometheus:
  window: 24h
  expected_freshness_seconds: 900

providers:
  - slug: pump-fun
    name: pump.fun
    tag: Native launchpad
    formula: "Average explicit on-chain fee for trades on pump.fun bonding curve and graduated PumpSwap pools, 24h median. Native trades carry no referral tip; total fee is gas only."
    queries:
      p50: quantile_over_time(0.50, avg(memecoin_platform_fee_pct{platform="pump-fun"})[24h:5m])
      p90: quantile_over_time(0.90, avg(memecoin_platform_fee_pct{platform="pump-fun"})[24h:5m])
      p99: quantile_over_time(0.99, avg(memecoin_platform_fee_pct{platform="pump-fun"})[24h:5m])
      mean: avg_over_time(avg(memecoin_platform_fee_pct{platform="pump-fun"})[24h:5m])
      sample_size: sum(avg_over_time(memecoin_platform_trade_count{platform="pump-fun"}[24h]))

  - slug: phantom
    name: Phantom
    tag: Wallet
    formula: "Average explicit on-chain fee for trades via Phantom wallet, 24h median."
    queries:
