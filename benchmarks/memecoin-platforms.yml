# OpenChainBench. Bench № 203

slug: memecoin-platforms
number: "203"
title: "Memecoin terminal take rates: what Terminal, Trojan, GMGN and pump.fun keep"
seo_title: "Memecoin terminal take rates 2026"
seo_description: "What each memecoin terminal keeps per dollar routed, measured not quoted. Terminal, Trojan, GMGN, Axiom, Fomo and pump.fun, per chain."
subtitle: Observed take rate per memecoin trading terminal, a day's fee revenue divided by that day's routed volume, per chain. What the terminal kept, not what its fee schedule says it charges.

category: Trading
status: live
metric: Observed take rate
unit: pct
higher_is_better: false
row_noun: { one: terminal, many: terminals }
# The success query is a publication gate (the harness published this terminal
# and chain on a day inside the window, or it did not), never a probe success
# rate. Declaring that hides the Success and Reliability columns, which would
# otherwise read 100% on every live row and invite a reader to take it for a
# measured uptime.
ledger_reliability: false
zero_is_a_value: true

disclaimer: |
  One complete UTC day's fee revenue divided by that day's routed volume, from the public tehcscreener API, which is Allium-backed. What the terminal kept, a lower bound on what it charges: waivers and rebates pull it down. A cell reading zero is withheld rather than ranked whenever that platform charges on another chain, because this page cannot tell a waived fee from an unmeasured one. Not the all-in cost of a swap, which also includes slippage; benches 268 and 279 measure that.

seo_intro: |
  Every trading terminal publishes a fee. What it actually keeps per dollar
  routed is a different number, and it is the one that shows up in revenue.
  This page divides each terminal's fee revenue on the latest complete day by
  the volume it routed that day, per chain. The spread is wider than any fee
  schedule suggests: the terminals that report fees on a chain keep between
  about a half and one and a tenth of a percent of what they route. Cells
  reading exactly zero are not ranked as the cheapest. A terminal that charges
  elsewhere and reports nothing here has a gap, not a price, and the page says
  so rather than crowning it.

abstract: |
  The harness reads one day per terminal per chain from the tehcscreener
  /bots/{bot} endpoint and publishes fees divided by volume as
  terminal_fee_rate_pct. Numerator and denominator are the same row of the
  same day, so the ratio cannot mix two periods or two chains.

  One column this bench used to carry is gone. Until 2026-10-07 it published a
  fee-paying rate, the share of a terminal's transactions that actually paid a
  fee, from a second metered Dune query. The current source reports fee totals
  and not the fee-paying share of transactions, and no arithmetic on the fields
  it does publish recovers it. The panel was removed rather than approximated,
  and the take rate it sat next to is unaffected.

methodology:
  - "Source: the public tehcscreener API (https://tehcscreener.com/api), Allium-backed, no key, synced once a day. The harness reads /bots over the full history for the roster and /bots/{bot} for each terminal's per-chain daily series, and publishes one day: the latest the source names."
  - "The ratio: that day's fee revenue in USD divided by that day's routed volume in USD, times 100, both read from the same row of the same series. A lower bound on what the terminal charges, because waivers, rebates and promotions reduce what it keeps without changing its schedule."
  - "Zeros are not ranked unless they are consistent, guarded at two levels. Per chain: when no terminal on a chain reports any fee, the column has failed and no take rate publishes there. Per cell: a terminal reporting fees on one chain and exactly zero on another, on material volume, has that cell withheld, because a waived fee and an unmeasured one look identical here. Axiom charges 0.92% on Solana and reported $0.00 on $29.8M of Robinhood volume."
  - "Removed on 2026-10-07: the fee-paying rate panel, the share of transactions that paid a fee. The current source publishes fee totals, not that share, and nothing here reconstructs it. Approximating it from the fields that do exist would have put a derived number where a measured one used to be."
  - "Latest complete day, not a rolling 24 hours: the source publishes daily and its latest day is normally yesterday. A terminal with no activity on that day carries no figure and reads unresponsive rather than having its last live day carried forward. BasedBot is the live case, with volume on Robinhood Chain and almost none on Solana."
  - "Stale source: a day more than 3 whole days behind, or a terminal the source stops returning, has its gauges deleted and reads unresponsive. An old figure is never republished as current, because these gauges are scraped every 60 seconds and read through a 24h window."
  - "Two freshness layers, because they fail differently: terminal_activity_last_success_unix says the harness is still running, and terminal_activity_health says this terminal and chain published a day inside the window. A harness that runs while its source freezes trips the second, not the first."
  - "Chains: five are offered as tabs, the ones with at least five terminals and meaningful volume. Arc, HyperEVM, Monad, X Layer and Avalanche are measured but not offered, because one or two terminals on a chain is a list rather than a comparison."
  - "Not the cost of a swap: this is the terminal's cut only. Slippage, priority fees and pool fees are not in it, and a low take rate can sit on top of a worse total execution. Benches 268 and 279 measure the all-in figure."

findings:
  - "{{best_name}} keeps the least per dollar routed at {{best_p50}} on this chain."
  - "Two cells are withheld rather than ranked, and the reason is the same for both: Axiom reports no fee on Robinhood and BNB while charging 0.92% on Solana, and pump.fun reports no fee on Solana while charging on four other chains. A zero from a platform that charges elsewhere is a gap, not the cheapest price in the market."
  - "Observed take rate is a lower bound on the published fee. Waivers, referral rebates and promotional periods all reduce what a terminal keeps without changing what its schedule says."
  - "Take rates differ by chain on the same terminal, which is why this page has a chain axis rather than one pooled number."

source: https://github.com/ChainBench/OpenChainBench/tree/dev/harnesses/terminal-activity

prometheus:
  window: 24h
  url: https://prom.openchainbench.com
  expected_freshness_seconds: 172800
  freshness_timestamp_metric: terminal_activity_last_success_unix
  # The fee column's own integrity gate, per chain. One terminal at zero is a
  # finding; every terminal on a chain at zero is the column having failed, and
  # the harness says which it is. When it says the column failed, no badge on
  # this page may claim a leader.
  probe_ok: max(terminal_fee_column_ok{chain="all"})

dimension_labels:
  chain: Chain

dimensions:
  # `all` is a real cross-chain total here, not an alias: volume, transactions
  # and fees add up, and the two ratios built on them (average trade is total
  # volume over total transactions, take rate is total fees over the volume of
  # the chains whose fees could be measured) are correctly volume-weighted by
  # construction. Bench 232 is the exception and says why on its own page: a
  # wallet trading on two chains is one wallet, so there is no honest
  # all-chains wallet count and its `all` carries Solana instead.
  #
  # Seven chains, the ones with at least four terminals. X Layer, Avalanche and
  # Monad are measured and queryable but not offered: one or two terminals on a
  # chain is a list, not a comparison.
  chain:
    - { value: all,       label: All chains }
    - { value: solana,    label: Solana }
    - { value: bnb,       label: BNB Chain }
    - { value: robinhood, label: Robinhood Chain }
    - { value: base,      label: Base }
    - { value: arc,       label: Arc }
    - { value: ethereum,  label: Ethereum }
    - { value: hyperevm,  label: HyperEVM }

faq:
  - q: "What is an observed take rate?"
    a: "A day's fee revenue divided by the volume routed that day, as a percentage. It is what the terminal kept, which is not the same as what its fee page says it charges: waived fees, referral rebates and promotions all reduce the first without touching the second."
  - q: "Why do some cells have no take rate at all?"
    a: "Because the zero could not be explained. A terminal that charges a fee on one chain and reports exactly nothing on another, while routing tens of millions there, has a gap rather than a price, and this page cannot tell a waived fee from an unmeasured one. Rather than rank that zero as the cheapest in the market, the cell is withheld and flagged. Axiom off Solana and pump.fun on Solana are both in that state as of 2026-10-07. Volume, transactions and wallets for those cells are unaffected and still published."
  - q: "Is this what a swap costs me?"
    a: "No. This is the terminal's cut only. The all-in cost of a swap also includes slippage, priority fees and the pool's own fee, and a terminal with a low cut can still deliver a worse fill. Benches 268 and 279 measure the total."
  - q: "Why does the same terminal show a different rate on each chain?"
    a: "Because fee schedules, flow mix and competition differ by chain, and because the rate is observed rather than quoted. Pooling the chains into one number would average ratios with weights nobody chose, so each chain is read on its own."
  - q: "What happened to the fee-paying rate column?"
    a: "It was removed on 2026-10-07 with the source change. It measured the share of a terminal's transactions that actually paid a fee, which the current source does not report and which cannot be derived from the fields it does. It was dropped rather than approximated."

providers:
  - slug: padre
    name: Terminal
    tag: "Trading terminal, highest observed take"
    formula: "A day's fee revenue divided by that day's routed volume for Terminal on this chain, both from the tehcscreener /bots/terminal series."
    queries:
      p50: max(terminal_fee_rate_pct{platform="padre",chain="all"})
      p90: max(terminal_fee_rate_pct{platform="padre",chain="all"})
      p99: max(terminal_fee_rate_pct{platform="padre",chain="all"})
      success: max(terminal_fee_rate_health{platform="padre",chain="all"})
      sample_size: max(terminal_fees_usd{platform="padre",chain="all"})
      series: max by (platform) (terminal_fee_rate_pct{platform="padre",chain="all"})

