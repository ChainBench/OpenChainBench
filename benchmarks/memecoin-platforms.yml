# OpenChainBench. Bench 203

slug: memecoin-platforms
number: "203"
title: Cheapest platform to trade memecoins (pump.fun vs Fomo vs Photon vs bots)
seo_title: "Solana memecoin trading fees compared 2026"
seo_description: "Compare real on-chain trading fees across pump.fun, Fomo, Phantom, Photon, Axiom, Trojan and GMGN. Fees measured directly from Solana transactions on the top 10 pump.fun tokens."
subtitle: Average explicit on-chain fee per trade (gas + platform fee transfers) as a percent of trade value, sampled across the top 10 pump.fun tokens every 5 minutes.
category: Trading
status: live
metric: Median fee
unit: pct

disclaimer: |
  Measures explicit, separately charged platform fees on sampled trades above $5 USD. Costs embedded in pool pricing (bonding-curve spread, AMM LP fees, price impact) are not captured. Effective round-trip cost may differ; see methodology for sampling scope.

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/memecoin-platforms

seo_intro: |
  Not all Solana memecoin frontends charge the same. This benchmark parses every
  trade transaction directly from the Solana blockchain to measure what each
  platform actually takes out of the user's pocket. Gas, explicit fee transfers to
  platform wallets, and referral tips are all included. AMM LP fees that stay
  inside pool accounts are excluded because they apply equally regardless of which
  frontend you use. The result is the true all-in cost of hitting the buy or sell
  button on each platform.

abstract: |
  The harness fetches the top 25 tokens by market cap from pump.fun every 5
  minutes, then pulls the last 100 trades per token from Mobula's
  token/trades-enriched endpoint (chainId=solana:solana) over a 4-hour window.
  For each trade carrying a hash and sender address, the harness calls the public
  Solana RPC (getTransaction, jsonParsed encoding) and computes explicit fees:
  Solana transaction fee (gas), SOL transfers to known platform fee wallets, small
  SOL recipients below 5% of user net flow, and small USDC/WSOL token recipients
  below 5% of the largest pool receipt. Trades below $5 are excluded to avoid gas
  dominating tiny amounts. Results are grouped by platform tag, weighted by trade
  count across tokens, and emitted as memecoin_platform_fee_pct.

methodology:
  - "Tokens: top 25 by market cap from pump.fun, refreshed every 5 minutes."
  - "Trades: last 100 trades per token from Mobula token/trades-enriched (chainId=solana:solana) over a 4-hour window, filtered to amountUSD >= $5."
  - "Fee source: Solana public RPC getTransaction (jsonParsed) for each trade hash. No third-party fee API."
  - "Gas: meta.fee (lamports) converted to USD at the current SOL/USD price fetched from CoinGecko every 5 min."
  - "Platform fees: explicit SOL or USDC/WSOL transfers to known fee wallet owners (confirmed on-chain). Unknown small recipients are captured via heuristics: SOL recipients receiving less than 5% of the user net flow, USDC/WSOL recipients receiving less than 5% of the largest pool receipt. Trading bots that use pre-funded escrow accounts (Trojan, Maestro) collect fees through a separate settlement mechanism not visible in the swap transaction; their displayed fee represents gas only."
  - "AMM LP fees excluded: the 0.20% PumpSwap fee and 0.25% Raydium fee stay inside pool accounts and are not counted because they apply equally to all frontends routing through the same pool."
  - "Grouping: trades are split by the platform field returned by Mobula. Trades with no platform tag are assigned to pump-fun."
  - "Cadence: full sweep every 5 minutes; tx results are cached to avoid re-parsing the same hash."
  - "Aggregation: headline is the 24h median of the trade-count-weighted average of memecoin_platform_fee_pct across all tracked tokens."

findings:
  - "{{best_name}} currently leads with the lowest average trading fee at {{best_p50}} (p50, 24h) across top pump.fun tokens."
  - "{{worst_name}} has the highest average fee at {{worst_p50}} (p50, 24h)."

faq:
  - q: "Are AMM LP fees included?"
    a: "No. The 0.20% PumpSwap fee and 0.25% Raydium fee stay inside pool accounts and are not transferred anywhere. Since they apply equally to every frontend routing through the same pool, including them would not differentiate platforms. This benchmark measures only explicit transfers out of the user's wallet to platform or protocol fee recipients."
  - q: "What fees do memecoin trading platforms charge?"
    a: "Native clients (pump.fun) collect a small protocol fee on each swap. Aggregator frontends (Phantom) add a referral tip on top, visible as a small SOL or USDC transfer in the swap transaction. Trading bots using pre-funded escrow (Trojan, Maestro) charge a fixed percentage but collect it via a separate settlement mechanism outside the swap transaction. Gas is a separate Solana transaction fee paid per signature."
  - q: "How are fee wallets identified?"
    a: "For confirmed platforms like Fomo, the fee wallet owner address is verified by inspecting multiple tagged trades on-chain. For platforms without a confirmed wallet, the harness uses a heuristic: any non-system, non-pool account receiving less than 5% of the user's net SOL flow, or less than 5% of the largest token pool receipt, is counted as a fee recipient. This captures Phantom-style referral tips without hardcoding every address."
  - q: "Why does Trojan show near-zero fee?"
    a: "Trojan and similar escrow-based bots (Maestro) pre-fund a shared wallet, execute trades from it, then settle with users in a separate transaction. The swap transaction itself shows a fair-price trade with no fee deduction. Their advertised ~0.9% fee is collected in the settlement step, which is not a swap and not captured by this benchmark. Trojan's displayed value reflects gas only."
  - q: "Why is pump.fun near zero?"
    a: "pump.fun's protocol fee goes to a program-owned pool account, not to an identifiable external wallet. Without a price oracle for the memecoin itself, the fee taken in the output token cannot be converted to USD. The benchmark measures explicit USD-denominated or SOL-denominated transfers; pump.fun's LP-style fee is currently outside that scope."

prometheus:
  window: 24h
  expected_freshness_seconds: 900

metric_panels:
  - id: trade_count
    label: Trade count (24h)
    label_key: platform
    metric: memecoin_platform_trade_count
    unit: count
    higher_is_better: true
    description: "Total number of trades sampled across top pump.fun tokens in the last 24h, weighted across all tracked tokens. Higher count = more active trading activity routed through this platform."

providers:
  - slug: pump-fun
    name: pump.fun
    tag: Native launchpad
    formula: "Explicit on-chain fee percent for trades on pump.fun and PumpSwap pools, 24h median. Trades with no platform tag from Mobula are assigned here since the bench exclusively samples pump.fun top tokens."
    queries:
      p50: quantile_over_time(0.50, (sum(memecoin_platform_fee_pct{platform="pump-fun"} * memecoin_platform_trade_count{platform="pump-fun"}) / sum(memecoin_platform_trade_count{platform="pump-fun"}))[24h:5m])
      p90: quantile_over_time(0.90, (sum(memecoin_platform_fee_pct{platform="pump-fun"} * memecoin_platform_trade_count{platform="pump-fun"}) / sum(memecoin_platform_trade_count{platform="pump-fun"}))[24h:5m])
      p99: quantile_over_time(0.99, (sum(memecoin_platform_fee_pct{platform="pump-fun"} * memecoin_platform_trade_count{platform="pump-fun"}) / sum(memecoin_platform_trade_count{platform="pump-fun"}))[24h:5m])
      mean: avg_over_time((sum(memecoin_platform_fee_pct{platform="pump-fun"} * memecoin_platform_trade_count{platform="pump-fun"}) / sum(memecoin_platform_trade_count{platform="pump-fun"}))[24h:5m])
      sample_size: sum(avg_over_time(memecoin_platform_trade_count{platform="pump-fun"}[24h]))

