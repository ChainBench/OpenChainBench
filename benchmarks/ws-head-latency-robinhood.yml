# OpenChainBench. Bench № 244

slug: ws-head-latency-robinhood
number: "244"
title: "Fastest Robinhood Chain WebSocket RPC: Chainstack vs Alchemy vs QuickNode newHeads push lag"
seo_title: "Fastest Robinhood Chain WebSocket RPC 2026: Chainstack vs Alchemy vs QuickNode"
seo_description: "Live Robinhood Chain WebSocket newHeads push lag: Chainstack, Alchemy, and QuickNode keyed endpoints racing per block from 3 regions. First public WS benchmark for this Arbitrum Orbit L2."
subtitle: Per-block WebSocket push lag in milliseconds versus the earliest provider to deliver the same Robinhood Chain head, measured continuously from 3 regions on keyed endpoints.

category: RPCs
status: live
metric: Block push lag
unit: ms
higher_is_better: false

seo_intro: |
  Robinhood Chain (chain ID 4663) produces a block every 100 milliseconds,
  roughly 20 times faster than Ethereum. Any real-time bot on Robinhood
  Chain (settlement keeper, price updater, live order-book) inherits its
  provider's head push pipeline 20 times as often. There is no public
  keyless WebSocket for Robinhood Chain; all three providers in this
  cohort (Chainstack, Alchemy, QuickNode) require an API key.
  This bench holds one persistent `eth_subscribe("newHeads")` keyed
  WebSocket per provider from us-east, eu-west, and Singapore,
  timestamps every frame on receipt, and scores each block as a race:
  earliest arrival sets T0, every other provider's lag is arrival minus T0.
  At 10 blocks per second, the 24h window carries 864000 racing events
  per provider, making this the densest latency distribution on
  OpenChainBench.
  This is the first and only independent public WebSocket latency
  benchmark for Robinhood Chain.

abstract: |
  We measure the per-block WebSocket push lag of Chainstack, Alchemy, and
  QuickNode on Robinhood Chain, using keyed eth_subscribe("newHeads")
  connections from 3 probe regions. Each block is scored as a race:
  earliest provider sets T0, every other provider's lag is arrival minus T0
  in milliseconds. The cohort closes 5 seconds after first arrival; late
  arrivals are counted as missed blocks via ws_block_gap_total rather than
  as large latency samples. p50/p90/p99 are computed via histogram_quantile
  over the 24h rate. All providers use keyed endpoints; no public keyless
  WebSocket exists for Robinhood Chain.

methodology:
  - "Providers: Chainstack (Global Node, keyed), Alchemy (multi-chain keyed endpoint), QuickNode (shared-endpoint fleet, keyed). No keyless WebSocket endpoint exists for Robinhood Chain; all three require an API key. Keys are stored in Railway env vars, not in the repo."
  - "Chain scope: all queries pin to chain=\"robinhood\". Robinhood Chain block cadence is 100ms (10 blocks/sec, ~864000 blocks/24h), roughly 20x faster than Ethereum and 5x faster than Base. Sample volume per provider per 24h window is substantially higher than any other chain in this bench cluster."
  - "Race scoring: first provider to deliver block N sets T0. Each provider's sample for block N is arrival(N) minus T0 in milliseconds. Cohort closes 5 seconds after first arrival; blocks not delivered within that window are counted as missed (ws_block_gap_total) rather than scored with extreme latency values."
  - "Relative, not absolute: subtracting two arrival timestamps over the same vantage path removes network latency to the probe host. The fastest provider reads near zero by construction; honest signals are win rate, trailers' lag distribution, and gap counts."
  - "Aggregation: per-provider lag histogram, p50/p90/p99 via histogram_quantile over the 24h rate. Coverage = ws_head_blocks_seen_total divided by cohort maximum, clamped to 1."
  - "Connection discipline: one persistent WebSocket per (provider, chain, region), client ping every 30s, read deadline 60s, 90s head watchdog forcing reconnect. Exponential backoff 2s to 60s on reconnect."
  - "Vantage points: us-east, eu-west, Singapore (3 regions). Multi-region deployment provides geographic diversity across Robinhood Chain's validator topology."

findings:
  - "{{name:quicknode}} leads at {{p50:quicknode}} (p50, 24h) — near-zero lag across all 3 regions, meaning QuickNode's push pipeline wins or ties the race for nearly every Robinhood Chain block. Its shared-endpoint fleet spans Arbitrum Orbit chains and likely shares sequencer proximity with Robinhood's validator path."
  - "{{name:alchemy}} follows at {{p50:alchemy}} with consistent lag across us-east, eu-west, and Singapore. A solid option for teams already using Alchemy across other chains; the same multi-chain key covers Robinhood Chain with no additional account."
  - "{{name:chainstack}} delivers {{p50:chainstack}} (p50, 24h). Despite being the first provider to launch a dedicated Robinhood Chain Global Node, its push pipeline trails QuickNode and Alchemy in the WebSocket race — a different competitive picture than HTTP latency, where Chainstack wins us-east."

faq:
  - q: "Which Robinhood Chain WebSocket provider is fastest for newHeads?"
    a: "Per the live data above: {{name:quicknode}} at {{p50:quicknode}} (p50, 24h, averaged across 3 regions). QuickNode's near-zero lag indicates it wins or ties the push race for nearly every block. {{name:alchemy}} follows at {{p50:alchemy}}. Note that HTTP latency (eth_getBlockByNumber) tells a different story — see the [keyed-rpc-robinhood](/benchmarks/keyed-rpc-robinhood) bench."
  - q: "Why does Robinhood Chain have no keyless WebSocket endpoint?"
    a: "Robinhood Chain is a new Arbitrum Orbit L2 with a small set of supported infrastructure providers. At the time this bench launched, all three providers (Chainstack, Alchemy, QuickNode) require an API key for WebSocket access. This bench will add keyless providers as they become available."
  - q: "How does Robinhood Chain's 100ms block time affect these measurements?"
    a: "At 10 blocks per second, the 24h window carries roughly 864000 racing events per provider, compared to 43000 on Base (2s blocks) and 7200 on Ethereum (12s blocks). The confidence intervals on all percentiles are correspondingly tighter: a 24h p50 on Robinhood Chain is drawn from an extremely dense sample. The flip side is that a provider that misses 1% of blocks loses 8640 race points per day."
  - q: "What is the fastest Robinhood Chain RPC by HTTP latency?"
    a: "The [keyed-rpc-robinhood](/benchmarks/keyed-rpc-robinhood) bench measures eth_getBlockByNumber round-trip latency on the same providers. HTTP and WebSocket push performance are correlated but not identical: HTTP measures request-response, WebSocket measures push pipeline. Both benches run continuously."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/ws-head-latency

expected_n: 50000

prometheus:
  window: 24h
  freshness_metric: ws_head_blocks_seen_total

rank_matrix_query: histogram_quantile(0.50, sum by (provider, region, le) (rate(ws_head_lag_milliseconds_bucket{chain="robinhood"}[24h])))

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: chainstack
    name: Chainstack
    tag: Global Node, keyed Robinhood Chain WebSocket
    formula: "Median ms behind the earliest provider to push each Robinhood Chain newHeads frame, from a persistent keyed WebSocket (Chainstack Global Node), histogram_quantile over 24h from 3 regions."
    queries:
      p50: histogram_quantile(0.50, sum by (le) (rate(ws_head_lag_milliseconds_bucket{provider="chainstack", chain="robinhood"}[24h])))
      p90: histogram_quantile(0.90, sum by (le) (rate(ws_head_lag_milliseconds_bucket{provider="chainstack", chain="robinhood"}[24h])))
      p99: histogram_quantile(0.99, sum by (le) (rate(ws_head_lag_milliseconds_bucket{provider="chainstack", chain="robinhood"}[24h])))
      mean: sum(rate(ws_head_lag_milliseconds_sum{provider="chainstack", chain="robinhood"}[24h])) / sum(rate(ws_head_lag_milliseconds_count{provider="chainstack", chain="robinhood"}[24h]))
      success: clamp_max(sum(increase(ws_head_blocks_seen_total{provider="chainstack", chain="robinhood"}[24h])) / max(sum by (provider) (increase(ws_head_blocks_seen_total{chain="robinhood"}[24h]))), 1)
      sample_size: sum(increase(ws_head_lag_milliseconds_count{provider="chainstack", chain="robinhood"}[24h]))
      series: histogram_quantile(0.50, sum by (le) (rate(ws_head_lag_milliseconds_bucket{provider="chainstack", chain="robinhood"}[1h])))
      regions:
        - region: us-east
          p50: histogram_quantile(0.50, sum by (le) (rate(ws_head_lag_milliseconds_bucket{provider="chainstack", chain="robinhood", region="us-east"}[24h])))
          series: histogram_quantile(0.50, sum by (le) (rate(ws_head_lag_milliseconds_bucket{provider="chainstack", chain="robinhood", region="us-east"}[1h])))
        - region: eu-west
          p50: histogram_quantile(0.50, sum by (le) (rate(ws_head_lag_milliseconds_bucket{provider="chainstack", chain="robinhood", region="eu-west"}[24h])))
          series: histogram_quantile(0.50, sum by (le) (rate(ws_head_lag_milliseconds_bucket{provider="chainstack", chain="robinhood", region="eu-west"}[1h])))
        - region: ap-southeast
          p50: histogram_quantile(0.50, sum by (le) (rate(ws_head_lag_milliseconds_bucket{provider="chainstack", chain="robinhood", region="sgp"}[24h])))
          series: histogram_quantile(0.50, sum by (le) (rate(ws_head_lag_milliseconds_bucket{provider="chainstack", chain="robinhood", region="sgp"}[1h])))

