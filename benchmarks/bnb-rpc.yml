# OpenChainBench. Bench № 049

slug: bnb-rpc
number: "049"
title: "BNB Chain RPC endpoints: free public URLs and private API-key providers by latency"
seo_title: "BNB Chain RPC endpoints: public and private, by latency"
seo_description: "{{best_name}} leads free BNB Chain RPC at {{best_p50}} (p50, 24h); URLs for all {{count}} no-key endpoints. {{best_name:tier:keyed}} leads the private (API-key) cohort at {{best_p50:tier:keyed}}."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public BNB Chain RPC endpoint (probed every 60 seconds) and, under the Access selector (Private), against the API-key endpoints of Alchemy, Chainstack, GetBlock, Quicknode and Dwellir (every 120 seconds), from 3 regions. The two cohorts are ranked separately, never against each other.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  BNB Chain is the incumbent's chain: Binance's `bsc-dataseed1.binance.org` has been the copy-paste default since 2020, and it measures {{p50:binance}} on the cross-region median today (see the region tabs for the origin split). The catch is that it serves exactly one chain, while PublicNode, NOWNodes and bloXroute bring multi-chain coverage at competitive latency. {{count}} providers, identical probes, three regions.

abstract: |
  BNB Chain: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}. The same page carries the private cohort (API key), Alchemy, Chainstack, GetBlock, Quicknode and Dwellir on their keyed BNB Chain endpoints every 120 seconds: switch the Access selector; {{best_name:tier:keyed}} leads it at {{best_p50:tier:keyed}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public BNB Chain endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore. The harness also classifies every response (ok / http_err / jsonrpc_err / stale / timeout) and audits archive depth every 5 minutes, so the leaderboard rewards sustained, honest availability rather than a fast error message. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the BNB Chain-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. The request id rotates, but that does not guarantee a cache miss: many caches normalise `id` away. Measured 2026-10-08, fixed and rotating ids answer within 2 to 4 percent of each other."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the BNB Chain-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=\"bnb\". Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. Blink (formerly Merkle) was delisted 2026-07: its gateway does not serve `eth_getBlockByNumber`, the anti-cache probe this cluster standardized on, so it cannot be measured on equal terms. Exclusions follow the cluster-wide rules documented on the parent benchmark."
  - "Private cohort (Access selector, Private): Alchemy, Chainstack, GetBlock, Quicknode, Dwellir and BlockMachine probed on their keyed BNB Chain endpoints every 120 seconds from the same 3 regions, same call (eth_getBlockByNumber, rotating id), same ok / http_err / jsonrpc_err / stale / timeout classification."
  - "Keys live in the probe environment, never in the repo. Plan tiers, disclosed: Alchemy: an Enterprise trial key, measured on that tier since 10 November 2026, not a reader's tier; Alchemy states free and paid keys share one routing; Chainstack: a Global Node on the Growth plan; Quicknode: an endpoint on a Build plan ($49 per month), shared fleet; GetBlock: an endpoint on the Enterprise plan, shared by the three probe regions. Chainstack, GetBlock and Quicknode provided their endpoints."
  - "Dwellir plan tier, disclosed: a Developer plan key ($49 per month, 25 million API responses, 100 responses per second; 1 RPC response = 1 API credit, no compute units). Shared nodes, the same product a reader buys. Dwellir publishes no Solana endpoint, so it is absent from that page rather than shown as unavailable."
  - "GetBlock regional pairing: each probe region uses GetBlock's nearest endpoint, us-east to New York, eu-west to Frankfurt, sgp to Singapore. Alchemy, Chainstack and Quicknode publish one routed entry point per chain instead, which in the general case does land a probe on a nearby node. Some of any gap between the two arrangements is deployment topology rather than node speed, and a deployment in one of these regions would see the same benefit GetBlock's endpoint gives the probe."
  - "Two cohorts, two rankings: the public endpoints are shared, rate-limited gateways probed every 60 seconds; the keyed endpoints are metered or dedicated and probed every 120 seconds. The selector switches the whole page (ranking, chart, region tabs, badges, citation) between them. No figure on this page compares a public endpoint with a keyed one."

excluded_providers:
  - { name: Ankr, reason: "public endpoint requires an API key" }
  - { name: NodeReal, reason: "requires an API key" }
  - { name: 1RPC, reason: "delisted for reliability: under 13 % success at one probe per minute", since: "2026-07-09" }
  - { name: gateway.fm, reason: "29 requests per IP budget, too small for continuous probing" }
  - { name: LlamaRPC, reason: "Cloudflare 521 from the probe regions" }
  - { name: BlockPI, reason: "Cloudflare 521 from the probe regions" }
  - { name: OmniaTech, reason: "Cloudflare 521 from the probe regions" }
  - { name: Alchemy demo, reason: "rate-limited public demo endpoint; Alchemy's keyed endpoint is in the private cohort on this page" }

faq:
  - q: "Which BNB Chain RPCs work without an API key?"
    a: "The {{count}} providers on this page are listed with their URLs in the endpoints table above. Blink (formerly Merkle) was delisted in July 2026 because its gateway does not serve `eth_getBlockByNumber` (JSON-RPC -32601), the anti-cache probe used across the cluster, so its latency cannot be compared on equal terms. Every (provider, chain) pair was live-verified no-key before inclusion, and anything that key-gates, region-blocks or rate-limits below our 60-second cadence is excluded rather than listed with an asterisk."
  - q: "Is bsc-dataseed still the best RPC for BNB Chain?"
    a: "It depends entirely on where your requests originate. Its cross-region median is {{p50:binance}} against {{best_p50}} for the leader; the per-region tabs show how far the two ends of that range sit apart. Check the region tabs above, the cross-region average is meaningless for an endpoint with this much geographic variance."
  - q: "Which BNB Chain RPC provider is fastest with an API key?"
    a: "Per the live data: {{best_name:tier:keyed}} at {{best_p50:tier:keyed}} (eth_getBlockByNumber p50 over 24h, averaged across us-east, eu-west and Singapore); Alchemy measures {{p50:alchemy}}, Chainstack {{p50:chainstack}} and Quicknode {{p50:quicknode}}; GetBlock measures {{p50:getblock}}. On the free cohort {{best_name}} leads at {{best_p50}}, measured on the same call from the same three regions; the two cohorts are never ranked in one table (shared gateways at 60 s against metered endpoints at 120 s). Switch the Access selector to Private for the region tabs and the p99 column; plan tiers are disclosed in the methodology."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on region alone.
rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="bnb"})

# Region and access tier: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }
  # Access tier: partitions the provider list (no PromQL label). The
  # first value is the headline cohort; ?tier=keyed reaches the other.
  tier:
    - { value: public, label: "Public, no key" }
    - { value: keyed,  label: "Private, API key" }
    - { value: keyed-cold, label: "Private, cold start" }
    - { value: keyed-heavy, label: "Private, heavy call" }

metric_panels:
  # ---- API capability, keyed cohort only ----
  #
  # Measured by the rpc-keyed-latency harness, which asks each method once per
  # provider per chain every six hours from a single region. These panels are
  # per (provider, chain), which is the granularity of this page, so they sit
  # here rather than on a cross-chain board: pooling them across chains would
  # average different block times, state sizes and node fleets.
  #
  # `tiers: [keyed]` because capability is probed on the keyed endpoints only.
  # On the public tab these panels are absent and their columns disappear with
  # them, instead of drawing dashes under a header that promises a reading.
  - id: cap_debug_trace
    label: "debug_traceTransaction"
    label_key: provider
    metric: 100 * max by (provider) (rpc_api_supported{chain="bnb",api="debug_tracetransaction"})
    unit: pct
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Whether this provider served debug_traceTransaction on this chain at the last check. 100 means served, 0 means the provider declined it, and a blank means we could not ask."
  - id: cap_trace_block
    label: "trace_block"
    label_key: provider
    metric: 100 * max by (provider) (rpc_api_supported{chain="bnb",api="trace_block"})
    unit: pct
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Whether trace_block was served. It sits in a different client namespace from debug_traceTransaction, so a provider can have one and not the other."
  - id: cap_receipts
    label: "eth_getBlockReceipts"
    label_key: provider
    metric: 100 * max by (provider) (rpc_api_supported{chain="bnb",api="eth_getblockreceipts"})
    unit: pct
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Whether eth_getBlockReceipts was served, the one call that returns every receipt in a block instead of one per transaction."
  - id: cap_archive
    label: "Archive at 5M blocks"
    label_key: provider
    metric: 100 * max by (provider) (rpc_api_supported{chain="bnb",api="archive_5m"})
    unit: pct
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Whether a balance read five million blocks behind the head returned non-pruned state. A chain younger than that depth cannot answer and is left blank."
  - id: cap_getlogs_raw
    label: "eth_getLogs, no filter"
    label_key: provider
    metric: 100 * max by (provider) (rpc_api_supported{chain="bnb",api="eth_getlogs_nofilter"})
    unit: pct
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Whether an unfiltered eth_getLogs over five blocks was served. A distinct question from the filtered shapes: some providers require an address or a topic."
  - id: cap_win_address
    label: "eth_getLogs window, address filter"
    label_key: provider
    metric: min by (provider) (rpc_getlogs_max_range_blocks{chain="bnb",filter_shape="address",bound=~"refused|top"})
    unit: count
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Widest address-filtered eth_getLogs window accepted, in blocks, climbing 100 to 1,000,000 and stopping at the first refusal. This is the static guard that trips before any work and freezes an indexer's cursor."
  - id: cap_win_topics
    label: "eth_getLogs window, topic filter"
    label_key: provider
    metric: min by (provider) (rpc_getlogs_max_range_blocks{chain="bnb",filter_shape="topics",bound=~"refused|top"})
    unit: count
    higher_is_better: true
    tab: false
    tiers: [keyed]
    carry: false
    description: "Same ladder for a topic-filtered query. The two shapes are indexed differently and a provider can admit a wider window on one than the other."
  - id: cap_age_hours
    label: "Hours since check"
    label_key: provider
    metric: (time() - min by (provider) (rpc_api_last_probe_timestamp{chain="bnb"})) / 3600
    unit: count
    higher_is_better: false
    tab: false
    tiers: [keyed]
    carry: false
    description: "Age of the capability verdicts on this chain, from the oldest cell. The probe runs every six hours; if it stops, the verdicts are withheld rather than held at their last reading."

  - id: cap_work_ms
    label: "Compute work"
    label_key: provider
    metric: avg by (provider) (ocb:rpc_api_work_heavy_milliseconds:mean_24h{chain="bnb"}) > 0
    unit: ms
    higher_is_better: false
    tab: false
    tiers: [keyed-heavy]
    carry: false
    description: "The heavy call minus its light reference, both on a pooled connection in the same pass, so the difference is the work the node did rather than the distance to it. Withheld at or below zero: a fifty-read call cannot be the faster one, and a negative here is noise."
  - id: cap_archive_ms
    label: "Archive read, 5M blocks back"
    label_key: provider
    metric: avg by (provider) (ocb:rpc_api_archive_heavy_milliseconds:mean_24h{chain="bnb"})
    unit: ms
    higher_is_better: false
    tab: false
    tiers: [keyed-heavy]
    carry: false
    description: "Mean round trip for a balance read five million blocks behind the head. Providers cache the tip and index history differently, so this is the column where a fast headline can come apart. Blank means the provider does not serve the call."
  - id: cap_getlogs_ms
    label: "eth_getLogs, address filter"
    label_key: provider
    metric: avg by (provider) (ocb:rpc_api_getlogs_heavy_milliseconds:mean_24h{chain="bnb"})
    unit: ms
    higher_is_better: false
    tab: false
    tiers: [keyed-heavy]
    carry: false
    description: "Mean round trip for an address-filtered eth_getLogs inside the width each provider accepts. This is the call where indexing quality shows, and the order here is not the order on the cheap call."

ledger_columns:
  # The default latency columns, re-declared: any ledger_columns block
  # replaces the default layout rather than extending it, so leaving
  # these out would strip p90 and p99 from the public tab.
  - label: "p50"
    slot: p50
    unit: ms
  - label: "p90"
    slot: p90
    unit: ms
  - label: "p99"
    slot: p99
    unit: ms
  # The capability matrix, shown under the Private tab. Order follows the
  # question an integrator asks: can it trace, can it read deep history,
  # and how wide a log query will it take.
  - label: "debug_trace"
    panel: cap_debug_trace
    unit: pct
  - label: "trace_block"
    panel: cap_trace_block
    unit: pct
  - label: "Receipts"
    panel: cap_receipts
    unit: pct
  - label: "Archive 5M"
    panel: cap_archive
    unit: pct
  - label: "getLogs raw"
    panel: cap_getlogs_raw
    unit: pct
  - label: "getLogs addr, blocks"
    panel: cap_win_address
    unit: count
  - label: "getLogs topic, blocks"
    panel: cap_win_topics
    unit: count
  - label: "Checked, h"
    panel: cap_age_hours
    unit: count

  - label: "Work, ms"
    panel: cap_work_ms
    unit: ms
  - label: "Archive, ms"
    panel: cap_archive_ms
    unit: ms
  - label: "getLogs, ms"
    panel: cap_getlogs_ms
    unit: ms
providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://bsc-rpc.publicnode.com
    tag: Allnodes-operated, 70+ chains, archive on most
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key BNB Chain endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="bnb"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="bnb"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="bnb"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="bnb"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="bnb"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="bnb"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="bnb"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="bnb"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="bnb", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="bnb", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="bnb", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="bnb", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="bnb", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="bnb", region="sgp"}[1h])

  - slug: nownodes
    name: NOWNodes
    endpoint: https://public-bsc.nownodes.io
    tag: Public node, 110+ chains, 5 RPS free tier
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to NOWNodes public no-key BNB Chain endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nownodes", chain="bnb"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="nownodes", chain="bnb"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="nownodes", chain="bnb"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="nownodes", chain="bnb"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="nownodes", chain="bnb"}) / sum(ocb:rpc_call:rate_24h{provider="nownodes", chain="bnb"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="nownodes", chain="bnb"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="nownodes", chain="bnb"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="nownodes", chain="bnb", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="nownodes", chain="bnb", region="us-east"}[1h])
        - region: eu-west
