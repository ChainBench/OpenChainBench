          series: avg_over_time(rpc_latency_milliseconds{provider="binance", chain="bnb", region="sgp"}[1h])

  - slug: thyme
    name: Thyme Gate
    endpoint: https://bnb-mainnet.rpc.thyme.sh/public
    tag: Thyme Labs-operated, keyless, 22 units/s per IP, no paid fallback
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Thyme Gate's no-key BNB Chain endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thyme", chain="bnb"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="thyme", chain="bnb"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="thyme", chain="bnb"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="thyme", chain="bnb"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="thyme", chain="bnb"}) / sum(ocb:rpc_call:rate_24h{provider="thyme", chain="bnb"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="thyme", chain="bnb"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="thyme", chain="bnb"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thyme", chain="bnb", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thyme", chain="bnb", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thyme", chain="bnb", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thyme", chain="bnb", region="eu-west"}[1h])
