  # API-key cohort (tier: keyed). Queries pin tier="keyed", the label the
  # rpc-keyed-latency harness emits; the public rows above carry no tier label.
  - slug: bloxroute
    name: bloXroute
    endpoint: https://bsc.rpc.blxrbdn.com
    tag: bloXroute public BSC gateway, no key
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to bloXroute public no-key BNB Chain endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="bloxroute", chain="bnb"})
