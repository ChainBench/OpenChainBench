      success: sum(ocb:rpc_call:ok_rate_24h{provider="bloxroute", chain="bnb"}) / sum(ocb:rpc_call:rate_24h{provider="bloxroute", chain="bnb"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="bloxroute", chain="bnb"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="bloxroute", chain="bnb"}[1h]))
      regions:
        - region: us-east
