# OpenChainBench. Bench № 080

slug: tokenized-stock-arb-latency
number: "080"
title: Tokenized stock arb latency, how fast pools catch a Nasdaq move
seo_title: "Tokenized stock arb latency 2026"
seo_description: "When Nasdaq moves 25 bps, how fast does the onchain pool follow? Live measurement across 11 tokenized equities on Robinhood Chain."
subtitle: "Median seconds between a 25 bps one-minute move on the reference market and the onchain pool coming back within 20 bps, per tokenized equity, regular hours only."

category: RWA
status: live
metric: Arb latency
unit: sec
higher_is_better: false

seo_intro: |
  The whole promise of tokenized stocks is that the onchain version
  tracks the real market. During regular trading hours, that only
  works if arbitrageurs close the gap when the Nasdaq moves. This
  page measures exactly how long they take. Each time the Yahoo
  reference for one of our 11 tracked equities moves 50 basis points
  or more in a single minute, the harness starts a timer, and stops
  it when the onchain Uniswap v4 pool comes back within 20 bps of
  the reference. The published number is the median of those
  intervals, per symbol, over the last 24 hours. Fast arbs mean the
  market is real. Slow arbs mean the tokenized version is a
  screenshot of the real one.

abstract: |
  A derived bench on top of the tokenized-stock-peg series already
  in Prometheus. During market_state=\"regular\", the harness tracks
  the trailing 1-minute reference move and the current pool-to-ref
  deviation, and observes the seconds between a 25 bps trigger and
  20 bps convergence into a histogram, per asset.

methodology:
  - "Trigger: a one-minute reference-price move of at least 25 bps observed while market_state=\"regular\". Only regular Nasdaq hours generate events; pre- and post-market moves are excluded (thin liquidity, unreliable reference)."
  - "Convergence: the pool-to-reference deviation drops back below 20 bps. The bench observes seconds from trigger to convergence into a histogram bucket, tagged per asset."
  - "Publication: p50, p90 and p99 of the event distribution over 24 hours, per asset. Events that never converge before regular hours end are counted as still_open on a separate counter, not as latency samples."
  - "Data source: the tsp_price_reference_usd and tsp_price_onchain_usdg series emitted by the tokenized-stock-peg harness at 60s cadence. The event tracker is in-process; no new external calls."
  - "Cohort: the 11 tokenized equities the peg bench measures. Arb latency is a first-order signal of pool quality; the peg deviation number is the second-order signal (how close it stays between moves)."
  - "Caveat: the 25 bps trigger filters out normal market chop while catching real moves. Symbols with fewer than 3 events per 24h during quiet market days will show sparse data; the sample_size column is the honest read of statistical weight."

findings:
  - "{{best_name}} closes a 25 bps gap fastest at {{best_p50}} (p50, 24h) across {{count}} tokenized equities."
  - "Fast arbs on the liquid low-fee pools validate that the market is real during regular hours; which tickers those are on a given day depends on where the 25 bps moves landed."
  - "Slow arbs on the 2 percent fee pools confirm the story the peg bench tells: thin pools do not just deviate more, they take longer to snap back."
  - "The still_open counter is the number that matters most for downstream products using the pool price as an oracle: it is the count of moves the arbs did not close before regular hours ended."

faq:
  - q: "What is arb latency and why does it matter?"
    a: "It is the time it takes for an arbitrageur to close the gap between the real stock price and the onchain pool price after the real one moves. Short latency means the tokenized version is a real reflection of the real market. Long latency means it is a delayed screenshot with a stale price."
  - q: "How are events detected?"
    a: "The harness reads the same Yahoo reference and pool spot every 60 seconds. When the reference moves 25 bps in a single minute while the pool is more than 20 bps off it, a new event opens. The event closes when the pool comes back within 20 bps. Time from open to close is observed into a histogram; p50, p90 and p99 are read from that histogram over 24 hours."
  - q: "Why 25 bps trigger, 20 bps convergence?"
    a: "25 bps is above normal intra-minute noise on liquid stocks and low enough to catch a few events per day per liquid symbol. 20 bps is the convergence band that means the pool is meaningfully close to the reference given the fee tiers of the pools measured (0.3 percent to 2 percent). Both thresholds are disclosed and can be varied in a follow-up dimension."
  - q: "What is the still-open counter?"
    a: "The number of events where the market session ended (Nasdaq closed) before the pool converged. Those are not counted as latency samples because the reference stops moving after 4 pm ET, but they are the honest measure of how many real-market moves the arbs failed to catch that day."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/tokenized-stock-peg

prometheus:
  window: 24h
  freshness_metric: tsp_deviation_bps

providers:
  - slug: nvda
    name: NVDA
    tag: "Nvidia, 0.3% fee, deepest pool"
    formula: "Median seconds until the NVDA pool on Robinhood Chain came back within 20 bps of the Yahoo reference after a 25 bps one-minute move, regular hours only, over 24h."
    queries:
      p50: histogram_quantile(0.50, sum by (le) (rate(tsp_arb_latency_seconds_bucket{issuer="robinhood", asset="nvda"}[24h])))
      p90: histogram_quantile(0.90, sum by (le) (rate(tsp_arb_latency_seconds_bucket{issuer="robinhood", asset="nvda"}[24h])))
      p99: histogram_quantile(0.99, sum by (le) (rate(tsp_arb_latency_seconds_bucket{issuer="robinhood", asset="nvda"}[24h])))
      mean: sum(rate(tsp_arb_latency_seconds_sum{issuer="robinhood", asset="nvda"}[24h])) / sum(rate(tsp_arb_latency_seconds_count{issuer="robinhood", asset="nvda"}[24h]))
      success: sum(increase(tsp_arb_event_total{issuer="robinhood", asset="nvda", outcome="converged"}[24h])) / clamp_min(sum(increase(tsp_arb_event_total{issuer="robinhood", asset="nvda"}[24h])), 1)
      sample_size: sum(increase(tsp_arb_event_total{issuer="robinhood", asset="nvda", outcome="converged"}[24h]))
      series: histogram_quantile(0.50, sum by (le) (rate(tsp_arb_latency_seconds_bucket{issuer="robinhood", asset="nvda"}[1h])))

