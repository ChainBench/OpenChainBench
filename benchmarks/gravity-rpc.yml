# OpenChainBench. Bench № 164

slug: gravity-rpc
number: "164"
title: "Gravity Alpha RPC endpoints: free public URLs by latency"
seo_title: "Gravity Alpha RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Gravity Alpha RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). {{count}} no-key endpoints measured, updated every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Gravity Alpha RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Gravity Alpha Mainnet (chain 1625) is a high-throughput EVM L1 built by Galxe, the onchain loyalty and quest platform with over 20 million users. G is the native gas token. The Gravity Foundation's rpc.gravity.xyz and Ankr provide keyless access probed every 60 seconds from three regions.

abstract: |
  Gravity Alpha: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:gravity-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Gravity Alpha endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Gravity Alpha-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Gravity Alpha-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"gravity\"`. Provider coverage today: {{count}} no-key endpoints."


source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="gravity"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  # This endpoint was filed under provider="publicnode" in the harness
  # registry until 2026-10-21, though rpc.gravity.xyz is the chain's own RPC and not a
  # PublicNode domain. The matcher accepts both labels so the page does not
  # blank for the 24h the recording rules keep the old series alive; narrow
  # it to provider="gravity-official" once that window has passed.
  - slug: gravity-official
    name: Gravity Foundation
    endpoint: https://rpc.gravity.xyz
    tag: Gravity Foundation's official public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Gravity Foundation's no-key Gravity Alpha endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider=~"gravity-official|publicnode", chain="gravity"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider=~"gravity-official|publicnode", chain="gravity"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider=~"gravity-official|publicnode", chain="gravity"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider=~"gravity-official|publicnode", chain="gravity"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider=~"gravity-official|publicnode", chain="gravity"}) / sum(ocb:rpc_call:rate_24h{provider=~"gravity-official|publicnode", chain="gravity"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider=~"gravity-official|publicnode", chain="gravity"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider=~"gravity-official|publicnode", chain="gravity"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider=~"gravity-official|publicnode", chain="gravity", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider=~"gravity-official|publicnode", chain="gravity", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider=~"gravity-official|publicnode", chain="gravity", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider=~"gravity-official|publicnode", chain="gravity", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider=~"gravity-official|publicnode", chain="gravity", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider=~"gravity-official|publicnode", chain="gravity", region="sgp"}[1h])

  - slug: thirdweb
    name: Thirdweb
    endpoint: https://1625.rpc.thirdweb.com
    tag: Thirdweb public RPC gateway, no key
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Thirdweb's no-key Gravity Alpha endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="gravity"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="thirdweb", chain="gravity"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="thirdweb", chain="gravity"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="thirdweb", chain="gravity"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="thirdweb", chain="gravity"}) / sum(ocb:rpc_call:rate_24h{provider="thirdweb", chain="gravity"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="thirdweb", chain="gravity"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="gravity"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="gravity", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="gravity", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="gravity", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="gravity", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="gravity", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="gravity", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    endpoint: https://gravity-alpha.drpc.org
    tag: Decentralized RPC mesh, keyless public endpoint
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to dRPC's no-key Gravity Alpha endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="gravity"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="gravity"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="gravity"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="gravity"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="gravity"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="gravity"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="gravity"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="gravity"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="gravity", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="gravity", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="gravity", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="gravity", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="gravity", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="gravity", region="sgp"}[1h])
