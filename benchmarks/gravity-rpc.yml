# OpenChainBench. Bench № 164

slug: gravity-rpc
number: "164"
title: "Gravity Alpha RPC endpoints: free public URLs ranked by latency"
seo_title: "Gravity Alpha RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Gravity Alpha RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). {{count}} no-key endpoints measured, updated every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Gravity Alpha RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Gravity Alpha Mainnet (chain 1625) is a high-throughput EVM L1 built by Galxe, the onchain loyalty and quest platform with over 20 million users. G is the native gas token. The Gravity Foundation's rpc.gravity.xyz and Ankr provide keyless access probed every 60 seconds from three regions.

abstract: |
  Gravity Alpha: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:gravity-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Gravity Alpha endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Gravity Alpha-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Gravity Alpha-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"gravity\"`. Provider coverage at launch: {{count}} no-key endpoints (Gravity Foundation, Ankr)."

faq:
  - q: "Which Gravity Alpha RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today; each is listed with its URL, 24h median and success rate in the endpoints table on this page, and the list changes as providers come and go."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="gravity"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: gravity-official
    name: Gravity Foundation
    tag: Gravity Foundation's official public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Gravity Foundation's no-key Gravity Alpha endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="gravity"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="gravity"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="gravity"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="gravity"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="gravity"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="gravity"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="gravity"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="gravity"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="gravity", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="gravity", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="gravity", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="gravity", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="gravity", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="gravity", region="sgp"}[1h])

  - slug: ankr
    name: Ankr
    endpoint: https://rpc.ankr.com/gravity
    tag: Multi-cloud RPC network
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Ankr's no-key Gravity Alpha endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ankr", chain="gravity"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="ankr", chain="gravity"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="ankr", chain="gravity"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="ankr", chain="gravity"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="ankr", chain="gravity"}) / sum(ocb:rpc_call:rate_24h{provider="ankr", chain="gravity"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="ankr", chain="gravity"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="ankr", chain="gravity"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ankr", chain="gravity", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ankr", chain="gravity", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ankr", chain="gravity", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ankr", chain="gravity", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="ankr", chain="gravity", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="ankr", chain="gravity", region="sgp"}[1h])
