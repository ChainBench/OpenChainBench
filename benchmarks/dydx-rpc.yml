  - slug: lavenderfive
    name: LavenderFive
    tag: Cosmos validator + no-key RPC path, multi-chain
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to LavenderFive's no-key dYdX Chain RPC endpoint."
    queries:
