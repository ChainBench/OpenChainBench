# OpenChainBench. Bench № 150

slug: dydx-rpc
number: "150"
title: Fastest free dYdX Chain RPC, live no-key Cosmos SDK endpoint latency
seo_title: "Fastest free dYdX Chain RPC 2026"
seo_description: "{{best_name}} leads free dYdX Chain RPC at {{best_p50}} (Tendermint status p50, 24h). 3 no-key providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for the Tendermint status method against every free, no-key public dYdX Chain Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  dYdX Chain (dydx-mainnet-1) is a Cosmos SDK app-chain running the dYdX perpetuals DEX entirely on-chain in CometBFT consensus, with ~1 s block time and the DYDX governance token. PublicNode, Polkachu, and LavenderFive all run keyless Tendermint RPC endpoints probed every 60 seconds from three regions.

abstract: |
  Per-chain member of the RPC latency cluster, extended to dYdX Chain.
  We measure the round-trip latency of a single, identical Cosmos SDK call
  (Tendermint `status`) against every no-key public dYdX Chain endpoint
  that sustains continuous probing, 3 providers at launch,
  every 60 seconds, from us-east, eu-west and Singapore. The harness
  classifies every response (ok / http_err / jsonrpc_err / stale /
  timeout) with a dYdX-scaled staleness gap (40 blocks at ~1 s block time).
  The cross-chain view lives on the parent `rpc-capabilities` benchmark;
  this page is the dYdX Chain-scoped answer with per-region breakdowns
  as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"status\",\"params\":[]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms → 10 s), so percentiles are computed via Prometheus `quantile_over_time` over the last 24 hours."
  - "Call-result classification: `ok` (HTTP 200 + non-empty result with a parsable decimal `sync_info.latest_block_height`), `http_err`, `jsonrpc_err`, `stale` (more than 40 blocks behind the cross-provider tip at ~1 s/block), `timeout`."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities) benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to `chain=\"dydx\"`. Provider coverage at launch: 3 no-key endpoints (PublicNode, Polkachu, LavenderFive)."

findings:
  - "{{best_name}} currently leads free dYdX Chain RPC at {{best_p50}} (Tendermint `status` p50, 24h) across 3 measured providers."

faq:
  - q: "What is the fastest free dYdX Chain RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (Tendermint `status` p50 over the last 24h), measured against 3 no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which dYdX Chain RPCs work without an API key?"
    a: "3 endpoints sustain continuous keyless probing at launch: PublicNode, Polkachu, LavenderFive. Every listed endpoint was live-verified before inclusion."
  - q: "Does the fastest dYdX Chain RPC change by region?"
    a: "Often. Public infra concentrates in specific regions; a node that wins from Virginia can lose from Singapore by multiples. The region tabs at the top of the page re-scope every number to a single origin."
  - q: "How is dYdX Chain RPC latency measured here?"
    a: "One identical Tendermint `status` POST every 60 seconds against each provider from each of 3 regions. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old block is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="dydx"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    tag: Allnodes-operated, 70+ chains, includes Cosmos SDK
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key dYdX Chain RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="dydx"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="dydx"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="dydx"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="dydx"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="dydx"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="dydx"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="dydx"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="dydx"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="dydx", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="dydx", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="dydx", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="dydx", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="dydx", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="dydx", region="sgp"}[1h])

