      sample_size: sum(ocb:rpc_call:increase_24h{provider="infura",chain="ethereum",tier="keyed"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="infura",chain="ethereum",tier="keyed"}[1h]))
      regions:
