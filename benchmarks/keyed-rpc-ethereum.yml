# OpenChainBench. Bench № 237

slug: keyed-rpc-ethereum
number: "237"
title: "Fastest Ethereum RPC with API key: Alchemy, Infura, Chainstack"
seo_title: "Fastest Ethereum RPC API key 2026: Alchemy vs Infura vs Chainstack"
seo_description: "Live Ethereum RPC latency benchmark: Alchemy, Infura, and Chainstack keyed endpoints probed every 60s from 3 regions. Free API keys compared."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against keyed Ethereum endpoints (Alchemy, Infura, Chainstack), probed every 60 seconds from 3 regions.
category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Ethereum is the chain every RPC provider supports first, so it is
  also where the free keyed tier competition is sharpest. This bench
  probes Alchemy, Infura, and Chainstack on their keyed Ethereum
  endpoints every 60 seconds from us-east, eu-west, and Singapore,
  staying inside each provider's free monthly quota.
  Chainstack stands out on Ethereum: its EU-west node matches Alchemy
  at 6ms, the only chain and region where a non-Alchemy provider
  currently ties the leader. Infura's free tier meters 3M credits
  per day and shows 450ms+ in all three regions, consistent with
  heavy rate-throttling of the shared free-tier pool.
  This bench shares the same probe methodology and Prometheus
  recording rules as the multi-chain
  [rpc-keyed-latency](/benchmarks/rpc-keyed-latency) overview, so
  the per-region breakdowns are directly comparable across chains.

abstract: |
  We measure the round-trip latency of a single eth_getBlockByNumber
  call against the signup-gated free tier of Alchemy, Infura, and
  Chainstack on Ethereum. The probe uses a rotating JSON-RPC id to
  defeat edge caches, fires every 60 seconds from 3 regions, and
  classifies each response as ok, http_err, jsonrpc_err, stale, or
  timeout. Only ok responses contribute to the latency distribution.

methodology:
  - "Cadence: every 60 seconds per provider from each of 3 probe regions (us-east, eu-west, sgp), inside each provider's free monthly quota. Headline p50/p90/p99 aggregate across regions via Prometheus avg(quantile_over_time(...))."
  - "Payload: eth_getBlockByNumber('latest', false) with a rotating JSON-RPC id. Non-cacheable by design: the rotating id defeats body-keyed edge caches and forces the provider to serve a real chain tip."
  - "Authentication: each provider's standard free-tier key, obtained via normal signup, no credit card. Keys live in env vars on probe services and never in the repo. Endpoint shapes: key-in-path (Alchemy /v2/<key>, Chainstack, Infura /v3/<key>)."
  - "Call-result classification: ok (HTTP 200 with usable block number), http_err, jsonrpc_err (HTTP 200 with error body), stale (block more than 20 behind the cross-provider tip), timeout. Latency is recorded only for ok responses."
  - "Cohort: Alchemy, Chainstack (Global Node, plan disclosed; free plan caps at one node), Infura / MetaMask Developer. A provider is absent when its free tier does not cover Ethereum or its key quota was exhausted; that absence is itself a finding."

findings:
  - "{{name:alchemy}} leads at {{p50:alchemy}} (p50, 24h) across all 3 regions."
  - "{{name:chainstack}} delivers {{p50:chainstack}} on the 24h cross-region average; in EU-west it matches Alchemy response-for-response, the only provider to do so on any chain."
  - "{{name:infura}} sits at {{p50:infura}}, consistent with heavy rate-throttling on its shared free-tier pool (3M credits per day at 80 credits per call)."

faq:
  - q: "Which Ethereum RPC provider is fastest with a free API key?"
    a: "Per the live data above: {{name:alchemy}} at {{p50:alchemy}} (p50 over 24h, averaged across us-east, eu-west, and Singapore probes). Chainstack ties Alchemy in EU-west at 6ms; if your users are primarily European, either provider delivers equivalent latency."
  - q: "Is a keyed Ethereum endpoint faster than a public one?"
    a: "On Alchemy and Chainstack, keyed and public endpoints run on the same shared infrastructure, so the latency is equivalent. The keyed tier adds a monthly quota and a dedicated API key for rate-limit attribution. The [rpc-capabilities](/benchmarks/rpc-capabilities) bench measures the public no-key tier with the same probe so the comparison is direct."
  - q: "Why is Infura so slow here?"
    a: "Infura's free tier meters 3M credits per day (80 credits per eth_getBlockByNumber call), equivalent to roughly 37k calls per day per key. At our 60s probe cadence across 3 regions that is ~4.3k calls per day, comfortably inside the quota. The 450ms+ latency is consistent with Infura routing free-tier traffic to a throttled shared pool, not a quota exhaustion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-keyed-latency

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="ethereum",tier="keyed"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: alchemy
    name: Alchemy
    tag: 30M CU/mo free, keyed Ethereum endpoint
    formula: "p50 over 24h of round-trip latency (ms) for eth_getBlockByNumber probed every 60s from 3 regions on Alchemy's keyed Ethereum endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="alchemy",chain="ethereum",tier="keyed"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="alchemy",chain="ethereum",tier="keyed"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="alchemy",chain="ethereum",tier="keyed"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="alchemy",chain="ethereum",tier="keyed"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="alchemy",chain="ethereum",tier="keyed"}) / sum(ocb:rpc_call:rate_24h{provider="alchemy",chain="ethereum",tier="keyed"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="alchemy",chain="ethereum",tier="keyed"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="alchemy",chain="ethereum",tier="keyed"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="alchemy",chain="ethereum",tier="keyed",region="us-east"})
          series: avg(avg_over_time(rpc_latency_milliseconds{provider="alchemy",chain="ethereum",tier="keyed",region="us-east"}[1h]))
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="alchemy",chain="ethereum",tier="keyed",region="eu-west"})
          series: avg(avg_over_time(rpc_latency_milliseconds{provider="alchemy",chain="ethereum",tier="keyed",region="eu-west"}[1h]))
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="alchemy",chain="ethereum",tier="keyed",region="sgp"})
          series: avg(avg_over_time(rpc_latency_milliseconds{provider="alchemy",chain="ethereum",tier="keyed",region="sgp"}[1h]))

  - slug: chainstack
    name: Chainstack
    tag: Global Node, keyed Ethereum endpoint, plan disclosed
    formula: "p50 over 24h of round-trip latency (ms) for eth_getBlockByNumber probed every 60s from 3 regions on Chainstack's keyed Ethereum Global Node."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="chainstack",chain="ethereum",tier="keyed"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="chainstack",chain="ethereum",tier="keyed"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="chainstack",chain="ethereum",tier="keyed"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="chainstack",chain="ethereum",tier="keyed"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="chainstack",chain="ethereum",tier="keyed"}) / sum(ocb:rpc_call:rate_24h{provider="chainstack",chain="ethereum",tier="keyed"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="chainstack",chain="ethereum",tier="keyed"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="chainstack",chain="ethereum",tier="keyed"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="chainstack",chain="ethereum",tier="keyed",region="us-east"})
          series: avg(avg_over_time(rpc_latency_milliseconds{provider="chainstack",chain="ethereum",tier="keyed",region="us-east"}[1h]))
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="chainstack",chain="ethereum",tier="keyed",region="eu-west"})
          series: avg(avg_over_time(rpc_latency_milliseconds{provider="chainstack",chain="ethereum",tier="keyed",region="eu-west"}[1h]))
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="chainstack",chain="ethereum",tier="keyed",region="sgp"})
          series: avg(avg_over_time(rpc_latency_milliseconds{provider="chainstack",chain="ethereum",tier="keyed",region="sgp"}[1h]))

