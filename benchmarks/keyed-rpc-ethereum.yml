    name: Infura
    tag: MetaMask Developer, 3M credits/day, keyed Ethereum
    formula: "p50 over 24h of round-trip latency (ms) for eth_getBlockByNumber probed every 60s from 3 regions on Infura's free-tier keyed Ethereum endpoint."
    queries:
