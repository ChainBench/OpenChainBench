      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="bitcore", chain="bitcoin-cash"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="bitcore", chain="bitcoin-cash"}) / sum(ocb:rpc_call:rate_24h{provider="bitcore", chain="bitcoin-cash"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="bitcore", chain="bitcoin-cash"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="bitcore", chain="bitcoin-cash"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="bitcore", chain="bitcoin-cash", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="bitcore", chain="bitcoin-cash", region="us-east"}[1h])
        - region: eu-west
