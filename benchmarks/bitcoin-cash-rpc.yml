  - slug: biggestfan
    name: BiggestFan Node
    tag: BiggestFan public BCHN full node REST API, no API key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET request sent every 60s from 3 regions to rest1.biggestfan.net/v2/blockchain/getBlockchainInfo."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="biggestfan", chain="bitcoin-cash"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="biggestfan", chain="bitcoin-cash"})
