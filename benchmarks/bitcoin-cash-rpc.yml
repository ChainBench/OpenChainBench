      sample_size: sum(ocb:rpc_call:increase_24h{provider="biggestfan", chain="bitcoin-cash"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="biggestfan", chain="bitcoin-cash"}[1h]))
      regions:
