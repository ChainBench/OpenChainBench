# OpenChainBench. Bench No 227

slug: neon-rpc
number: "227"
title: "Neon EVM RPC endpoints: free public URLs ranked by latency"
seo_title: "Neon EVM RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Neon EVM RPC at {{best_p50}} (eth_getBlockByNumber EVM p50, 24h). URLs for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every available public Neon EVM node, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Neon EVM is an Ethereum Virtual Machine runtime that executes Solana-native transactions, allowing standard EVM smart contracts and wallets to operate on Solana infrastructure. It exposes a standard Ethereum JSON-RPC interface (chain ID 245022934) at multiple public endpoints. Public EVM endpoints are available without an API key from P2P Neon Proxy, Thirdweb and Everstake. Every provider was live-verified with consecutive eth_getBlockByNumber probes at launch.

abstract: |
  Neon EVM: {{count}} free public RPC endpoints answering `the chain's head call` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single eth_getBlockByNumber ("latest", false) call against every available public Neon EVM node that sustains continuous probing: {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a standard EVM staleness gap. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Neon EVM-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: {\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}. Plain HTTP POST. Standard Ethereum JSON-RPC 2.0; Neon EVM exposes a full EVM-compatible interface."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Neon EVM-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=neon. Provider coverage at launch: {{count}} endpoints (P2P Neon Proxy, Thirdweb, Everstake)."

faq:
  - q: "Which Neon EVM RPC endpoints work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today: P2P Neon Proxy (neon-proxy-mainnet.solana.p2p.org), Thirdweb (245022934.rpc.thirdweb.com) and Everstake (neon-mainnet.everstake.one). Every listed endpoint was live-verified with an eth_getBlockByNumber call returning a parsable block number before inclusion."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="neon"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: neon-p2p
    name: P2P Neon Proxy
    endpoint: https://neon-proxy-mainnet.solana.p2p.org
    tag: P2P.org public Neon EVM mainnet proxy, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for an eth_getBlockByNumber POST sent every 60s from 3 regions to neon-proxy-mainnet.solana.p2p.org."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="neon-p2p", chain="neon"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="neon-p2p", chain="neon"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="neon-p2p", chain="neon"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="neon-p2p", chain="neon"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="neon-p2p", chain="neon"}) / sum(ocb:rpc_call:rate_24h{provider="neon-p2p", chain="neon"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="neon-p2p", chain="neon"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="neon-p2p", chain="neon"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="neon-p2p", chain="neon", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="neon-p2p", chain="neon", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="neon-p2p", chain="neon", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="neon-p2p", chain="neon", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="neon-p2p", chain="neon", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="neon-p2p", chain="neon", region="sgp"}[1h])

  - slug: thirdweb
    name: Thirdweb
    endpoint: https://245022934.rpc.thirdweb.com
    tag: Thirdweb public Neon EVM RPC (chain 245022934), no key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for an eth_getBlockByNumber POST sent every 60s from 3 regions to 245022934.rpc.thirdweb.com."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="neon"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="thirdweb", chain="neon"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="thirdweb", chain="neon"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="thirdweb", chain="neon"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="thirdweb", chain="neon"}) / sum(ocb:rpc_call:rate_24h{provider="thirdweb", chain="neon"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="thirdweb", chain="neon"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="neon"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="neon", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="neon", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="neon", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="neon", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="thirdweb", chain="neon", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="thirdweb", chain="neon", region="sgp"}[1h])

  - slug: everstake
    name: Everstake
    endpoint: https://neon-mainnet.everstake.one
    tag: Everstake public Neon EVM mainnet RPC, keyless
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for an eth_getBlockByNumber POST sent every 60s from 3 regions to neon-mainnet.everstake.one."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="everstake", chain="neon"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="everstake", chain="neon"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="everstake", chain="neon"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="everstake", chain="neon"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="everstake", chain="neon"}) / sum(ocb:rpc_call:rate_24h{provider="everstake", chain="neon"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="everstake", chain="neon"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="everstake", chain="neon"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="everstake", chain="neon", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="everstake", chain="neon", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="everstake", chain="neon", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="everstake", chain="neon", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="everstake", chain="neon", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="everstake", chain="neon", region="sgp"}[1h])
