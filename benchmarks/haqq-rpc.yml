# OpenChainBench. Bench № 188

slug: haqq-rpc
number: "188"
title: "HAQQ Network RPC endpoints: free public URLs by latency"
seo_title: "HAQQ Network RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free HAQQ Network RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public HAQQ Network EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  HAQQ Network (chain 11235) is a Cosmos SDK EVM-compatible blockchain focused on Islamic finance and halal DeFi, with ISLM as the native gas token. {{count}} keyless endpoints are probed continuously, each listed with its URL in the endpoints table above.

abstract: |
  HAQQ Network: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:haqq-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public HAQQ Network endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the HAQQ-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the HAQQ Network-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"haqq\"`. Provider coverage today: {{count}} no-key endpoints."

faq:
  - q: "Which HAQQ Network RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing, each listed with its URL in the endpoints table above."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="haqq"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://haqq-evm-rpc.publicnode.com
    tag: PublicNode multi-chain gateway for HAQQ EVM
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions to PublicNode's no-key HAQQ endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="haqq"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="haqq"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="haqq"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="haqq"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="haqq"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="haqq"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="haqq"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="haqq"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="haqq", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="haqq", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="haqq", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="haqq", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="haqq", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="haqq", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    endpoint: https://haqq.drpc.org
    tag: dRPC public gateway for HAQQ Network
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions to dRPC's no-key HAQQ endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="haqq"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="haqq"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="haqq"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="haqq"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="haqq"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="haqq"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="haqq"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="haqq"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="haqq", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="haqq", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="haqq", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="haqq", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="haqq", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="haqq", region="sgp"}[1h])

  - slug: haqq-official
    name: HAQQ Foundation
    endpoint: https://rpc.eth.haqq.network
    tag: HAQQ Foundation official public RPC endpoint
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions to HAQQ Foundation's no-key endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="haqq-official", chain="haqq"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="haqq-official", chain="haqq"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="haqq-official", chain="haqq"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="haqq-official", chain="haqq"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="haqq-official", chain="haqq"}) / sum(ocb:rpc_call:rate_24h{provider="haqq-official", chain="haqq"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="haqq-official", chain="haqq"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="haqq-official", chain="haqq"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="haqq-official", chain="haqq", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="haqq-official", chain="haqq", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="haqq-official", chain="haqq", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="haqq-official", chain="haqq", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="haqq-official", chain="haqq", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="haqq-official", chain="haqq", region="sgp"}[1h])
