# OpenChainBench. Bench № 006

slug: l1-finality
number: "006"
title: Layer-1 finality lag
seo_title: Layer-1 finality time benchmark - Ethereum, BNB, Avalanche, Solana, TRON, Stellar, Hedera, SUI, TON, Litecoin, Monero, Cardano
subtitle: Wall-clock distance between each L1's latest block and its finalized block. Lower is faster.
category: Networks
status: live
metric: Finality lag
unit: s
higher_is_better: false

abstract: |
  We measure the live gap between every L1 chain's latest block and its
  finalized block. The harness uses two complementary methods. For
  chains with finality much longer than our 10 s poll interval we read
  `latest.timestamp - finalized.timestamp` from the chain RPCs (Ethereum,
  Solana, TRON, Stellar, Hedera, SUI, TON, Litecoin, Monero, Cardano).
  For chains whose finality is faster than the poll interval (BNB,
  Avalanche) we maintain a persistent WebSocket subscription, recording
  wall-clock time T1 when block N is first seen as `latest` and T2 when
  it becomes `finalized`. lag = T2 − T1 with millisecond precision. The
  WS path is the only honest way to measure sub-poll-cadence finality —
  comparing two pointers at a single instant collapses to zero when
  finalization catches up to head.

methodology:
  - "Cadence: every 10 seconds for HTTP-polled chains, continuous WS for BNB and Avalanche."
  - "Ethereum: `eth_getBlockByNumber(\"latest\")` minus `eth_getBlockByNumber(\"finalized\")`."
  - "BNB / Avalanche (WS wall-clock): persistent `eth_subscribe(\"newHeads\")` records T1 = first time block N is seen as latest. Periodic `eth_getBlockByNumber(\"finalized\")` over same WS records T2 when N becomes finalized. lag = T2 − T1, ms precision, independent of chain timestamp resolution."
  - "Solana: `getSlot{commitment:\"processed\"}` + `getBlockTime` minus `getSlot{commitment:\"finalized\"}` + `getBlockTime`."
  - "TRON: `/wallet/getnowblock` (head) minus `/walletsolidity/getnowblock` (solidity-confirmed)."
  - "Stellar: latest two records of `/ledgers?order=desc&limit=2`. one-back is SCP-final."
  - "Hedera: latest two records of mirror-node `/api/v1/blocks?order=desc&limit=2`. timestamps parsed at nanosecond precision."
  - "SUI: `sui_getLatestCheckpointSequenceNumber` minus 5 checkpoints back."
  - "TON: tonapi.io `/blockchain/masterchain-head` minus 3 seqno."
  - "Litecoin (probabilistic): blockchair `/stats.best_block_height` minus 6 confirmations via `/dashboards/block/{height}.block.time`."
  - "Monero (probabilistic): monero-rpc `get_info` minus 10 confirmations via `get_block_header_by_height`."
  - "Cardano (probabilistic): koios `/tip` minus 50 confirmations via `/blocks?block_height=eq.<height>`."
  - "Result: `lag_seconds = headTimestamp - finalizedTimestamp`. We also record the block-height delta and per-chain fetch latency."
  - "Excluded by design: XRP (no close-time on `ledger_current` — wall-clock measurement requires WS subscribe to ledger stream, not yet implemented)."
  - "Failures (5xx, timeouts, rate limits) leave the previous gauge in place and increment a per-chain `fetch_errors_total` counter; the page falls back to the last successful sample."

findings:
  - "SUI and Hedera return sub-2-second lag, matching their BFT designs. the chains expose ms / ns timestamps so the measurement is genuinely sub-second."
  - "Ethereum sits around 12-13 minutes, aligned with the 2-epoch finalization spec."
  - "TRON's solidity confirmation hovers around 60 s. exactly the documented 20-block delay at 3 s blocks."
  - "PoW-style chains (Litecoin, Monero, Cardano) cluster at 15-30 minutes by construction, set by the chosen confirmation depth."

source: https://github.com/OpenChainBench/OpenChainBench/tree/main/harnesses/l1-finality

prometheus:
  url: https://prometheus-production-0859.up.railway.app
  window: 24h

# Real metrics exposed by the l1-finality harness:
#   l1_finality_lag_seconds{chain}                 gauge (seconds)
#   l1_finality_block_lag{chain}                   gauge (block count)
#   l1_latest_block{chain}                         gauge
#   l1_finalized_block{chain}                      gauge
#   l1_finality_fetch_latency_milliseconds{chain}  gauge (ms)
#   l1_finality_last_refresh_timestamp_seconds{chain}  gauge (unix s)
#   l1_finality_fetch_errors_total{chain, error_type}  counter
#   l1_finality_health{chain}                      gauge (0|1)

# Each "provider" below is one chain. The leaderboard ranks chains by
# observed finality lag (lower = faster). p50/p90/p99 are computed via
# quantile_over_time on the lag_seconds series so a chain that drifts
# during the day shows tail behaviour, not a single flat value.

providers:
  - slug: bnb
    name: BNB Smart Chain
    tag: Fast finality fork (BEP-126), measured via WS wall-clock
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="bnb"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="bnb"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="bnb"}

  - slug: avalanche
    name: Avalanche C-Chain
    tag: Snowman++ consensus, measured via WS wall-clock
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="avalanche"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="avalanche"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="avalanche"}

  - slug: sui
    name: SUI
    tag: Mysticeti DAG, ~1 s checkpoint finality
    queries:
      p50: avg_over_time(l1_finality_lag_seconds{chain="sui"}[24h]) * 1000
      p90: quantile_over_time(0.90, l1_finality_lag_seconds{chain="sui"}[24h]) * 1000
      p99: quantile_over_time(0.99, l1_finality_lag_seconds{chain="sui"}[24h]) * 1000
      mean: avg_over_time(l1_finality_lag_seconds{chain="sui"}[24h]) * 1000
      success: avg_over_time(l1_finality_health{chain="sui"}[24h])
      sample_size: count_over_time(l1_finality_lag_seconds{chain="sui"}[24h])
      series: l1_finality_lag_seconds{chain="sui"} * 1000

  - slug: ton
    name: TON
    tag: Masterchain commit, measured via SSE wall-clock
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="ton"}[24h])
