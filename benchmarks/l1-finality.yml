# OpenChainBench. Bench № 006

slug: l1-finality
number: "006"
title: Fastest L1 blockchain finality, live wall-clock measurement per chain
seo_title: "Fastest L1 finality 2026: {{best_name}} at {{best_p50}}, {{count}} chains"
seo_description: "{{best_name}} finalizes in {{best_p50}} (p50, 24h), the lowest of {{count}} chains measured live. Which chains reach sub-second finality, from Solana and Sei to Ethereum and Bitcoin: wall-clock, not whitepaper."
subtitle: Wall-clock time for a block to become final on {{count}} chains, from Ethereum, Bitcoin and Solana to NEAR, Sei and Algorand, each against its own finality rule, measured live.
seo_intro: |
  This page measures L1 finality time live on {{count}} chains, each against its own finality rule, with p50 / p90 / p99 over 24 hours. Solana finality time dropped from about 12.8 s under Tower BFT to {{p50:solana}} when Alpenglow went live on 21 October 2026. Ethereum finality time is about 12.8 minutes in the ideal case, the 2-epoch Casper FFG window; measured wall-clock finality runs longer, {{p50:ethereum}}. Single-slot BFT chains finalize a block the moment they commit it: Sei at {{p50:sei}}, Cronos at {{p50:cronos}}, Kaia at {{p50:kaia}}, timed from the block's own timestamp to its arrival. NEAR reaches BFT finality in {{p50:near}}, the Internet Computer serves certified state {{p50:icp}} after a block is made, and an Algorand round, proposal to certification, takes {{p50:algorand}}. Stellar closes a ledger every {{p50:stellar}} and Gram (formerly TON) commits a masterchain block every {{p50:gram}}. Probabilistic chains (Bitcoin, Litecoin, Monero) settle on a confirmation-depth convention measured in minutes. Bitcoin takes {{p50:bitcoin}} to the industry-standard 6 confirmations; the protocol itself never reaches absolute finality.

faq:
  - q: "What is blockchain finality?"
    a: "Blockchain finality is the point at which a confirmed transaction cannot be reversed without breaking the protocol's security assumptions. Two finality models exist. Deterministic finality (Ethereum Casper FFG, Stellar SCP, Hedera Hashgraph) reaches an explicit consensus commitment that the network treats as irreversible. Probabilistic finality (Bitcoin, Litecoin, Monero, Cardano) leaves a non-zero reorg probability that decreases exponentially with confirmation depth. This benchmark measures the wall-clock time each chain needs to reach its native finality threshold."
  - q: "Probabilistic vs deterministic finality, what is the difference?"
    a: "Deterministic finality is a binary state. A block is either finalized or it is not, and finalized blocks cannot be reorganized. Probabilistic finality is a confidence curve: a block becomes more final with each confirmation that builds on top of it. Exchanges set a convention (Bitcoin 6, Litecoin 6, Monero 10, Cardano 15) past which they treat funds as settled, but the protocol itself never declares strict finality. This benchmark uses each chain's native convention rather than imposing a uniform depth across all chains."
  - q: "What is Ethereum finality time?"
    a: "Ethereum finality time measured live on this page is {{p50:ethereum}} (p50, 24h). Casper FFG finalizes a checkpoint two epochs after it is justified, where each epoch is 32 slots of 12 seconds, about 12.8 minutes in the ideal case. Observed wall-clock finality runs longer because a block lands mid-epoch and waits before the two-epoch countdown starts. The live table above shows the measured value. The benchmark polls eth_getBlockByNumber(\"latest\") and eth_getBlockByNumber(\"finalized\") every 10 seconds and reports the timestamp delta."
  - q: "What is Solana finality time?"
    a: "Solana switched consensus from Tower BFT to Alpenglow on 21 October 2026 (epoch 1064). Under Tower BFT a block was finalized after 32 confirmed slots, about 12.8 seconds; Alpenglow targets about 150 ms and makes confirmed and finalized the same thing. Measured here as the wall-clock time from a slot first appearing to it being rooted, {{p50:solana}} (p50, 24h). That figure has two parts: the block still arriving after the slot first appears (about 165 ms at the median on 24 October 2026), then voting from the complete block to root (about 242 ms)."
  - q: "What is Gram finality time?"
    a: "Gram (the network formerly branded TON, native token renamed Toncoin → Gram in June 2026) commits a masterchain block every {{p50:gram}} (p50, 24h). A transaction is final once a masterchain block includes it, so the interval between two masterchain commits is how long finality takes to land. Gram splits state across a masterchain and many workchains; the figure here is the masterchain, the canonical reference for cross-chain settlement."
  - q: "What is Stellar finality time?"
    a: "Stellar uses the Stellar Consensus Protocol, a federated Byzantine agreement that reaches deterministic finality at every ledger close, no probabilistic confirmation needed. The interval between two closes is {{p50:stellar}} (p50, 24h), read from the ledgers' own close times on the Horizon stream and averaged over the last ten closes, since each close time is whole seconds."
  - q: "What is BNB Chain finality time?"
    a: "BNB Smart Chain finalizes via the BEP-126 fast-finality fork, dropping the confirmation depth that legacy probabilistic chains require. p50 sits at {{p50:bnb}} (24h), measured via persistent WebSocket subscription that records T1 when block N first appears as latest and T2 when it crosses the finalized threshold."
  - q: "Which blockchain has the fastest finality time?"
    a: "Sub-second BFT chains lead: {{best_name}} posts the lowest median at {{best_p50}} (p50, 24h). {{name:bnb}} follows at {{p50:bnb}} and {{name:avalanche}} at {{p50:avalanche}} via their fast-finality forks. {{name:solana}} finalized clocks {{p50:solana}} and {{name:ethereum}} {{p50:ethereum}}. Probabilistic chains trail by confirmation-depth convention: {{name:litecoin}} at {{p50:litecoin}} and {{name:bitcoin}} at {{p50:bitcoin}} for 6 confirmations."
  - q: "What is Bitcoin finality time?"
    a: "Bitcoin never reaches absolute finality. Nakamoto consensus gives probabilistic finality: any block can in principle be reorganized, with a probability that falls exponentially as more blocks are mined on top. The exchange-industry deposit convention is 6 confirmations, roughly one hour at the 10-minute target block interval, and that is what this benchmark measures: {{p50:bitcoin}} (p50, 24h) wall-clock from a block first appearing at the chain tip to reaching 6 confirmations, timed with the harness clock rather than miner-set block timestamps. Variance is high because block intervals are Poisson distributed; a lucky streak settles in about 30 minutes, an unlucky one takes well over 90. Six confirmations is a risk threshold, not a protocol guarantee, and deep reorgs remain possible with vanishing probability."
  - q: "What is NEAR finality time?"
    a: "NEAR keeps a head (optimistic) and a final block, the newest one with a BFT finality certificate, normally two blocks behind. Every header names that final block. Measured here as the time from a block's own timestamp to the timestamp of the first block naming it final, both in nanoseconds: {{p50:near}} (p50, 24h)."
  - q: "Why are Hedera, Aptos and Somnia not on the board?"
    a: "None of them exposes a public signal that separates a block's proposal from its finality. Hedera finalizes in a documented 3 to 5 seconds through Hashgraph aBFT, but its mirror nodes only publish already-final records, stamped with the consensus time, the moment of finality itself; Block Nodes (HIP-1056) would expose more once they leave private preview. On Aptos and Somnia every block an RPC serves is already final. Somnia timestamps are whole seconds on blocks about 100 ms apart, too coarse for sub-second finality. Aptos timestamps are microseconds, but on 3 November 2026 they read within one network round trip of arrival, often after our request had left, so they do not mark the proposal."
  - q: "How is L1 finality time measured on this page?"
    a: "Four methods, picked per chain. Where a head and a final block coexist, T1 is when block N first appears and T2 when it is final: over WebSocket on BNB, Robinhood Chain and Solana, on block timestamps polled every 10 seconds on Ethereum, TRON and Monero, on NEAR's nanosecond timestamps, and on our own clock at the tip for Bitcoin and Litecoin. Where every block is final when it appears, the figure is the block's own timestamp to its arrival: Avalanche, Sei, Cronos, Kaia and the Internet Computer's certified time. Stellar, Gram, SUI and Algorand report the interval between two final blocks, ledgers, checkpoints or rounds."

per_chain_explainer:
  - slug: ethereum
    h2: "Ethereum finality time"
    body: |
      Ethereum finality time is {{p50:ethereum}} (p50, 24h), measured live. Casper FFG finalizes a checkpoint two epochs after it is justified, where each epoch is 32 slots of 12 seconds, which puts the ideal case at about 12.8 minutes. Observed wall-clock finality runs longer because a block lands mid-epoch and waits before the two-epoch countdown starts. Finality is deterministic once reached, but reorgs of unfinalized blocks remain possible before finalization. Measured by polling `eth_getBlockByNumber("finalized")` against `latest` every 10 seconds and reporting the timestamp delta.
  - slug: solana
    h2: "Solana finality time"
    body: |
      Solana finality time is {{p50:solana}} (p50, 24h). Alpenglow replaced Tower BFT on mainnet on 21 October 2026: finality went from 32 confirmed slots, about 12.8 seconds, to a target of about 150 ms, and the confirmed and finalized commitments became one. The harness subscribes over WebSocket to slots and roots, records the wall-clock moment a slot first appears and the moment a root reaches it, and reports the difference in milliseconds. The slot appears while its block is still arriving, so the figure includes block propagation as well as the vote: over one hour on 24 October 2026, the block took about 165 ms to arrive in full and the vote about 242 ms to root (medians). The earlier method subtracted `getBlockTime` values, which are whole seconds and cannot resolve sub-second finality; it read 0 or 1 s after the switch and was retired on 22 October.
  - slug: stellar
    h2: "Stellar finality time"
    body: |
      Stellar uses the Stellar Consensus Protocol, a federated Byzantine agreement that reaches deterministic finality at every ledger close. Ledgers close every {{p50:stellar}} (p50, 24h). No probabilistic confirmation, no reorg window. Measured from the ledgers' own `closed_at` on the Horizon `/ledgers?cursor=now&order=asc` SSE stream, as the mean interval over the last ten closes (close times are whole seconds). Until 3 November 2026 the row timed ledgers as they arrived on the stream; Horizon delivers them unevenly (3.1, 4.0 and 7.1 s gaps between ledgers closed exactly 5 s apart), which put the median at 4.0 s and p90 at 11 s.
  - slug: hedera
    h2: "Hedera finality time"
    body: |
      Hedera finality time is documented at 3 to 5 seconds via Hashgraph asynchronous Byzantine fault tolerant (aBFT) consensus. The mirror node only exposes already-final blocks, so true wall-clock measurement of consensus lag is currently impossible from public endpoints. This chain is excluded from the live leaderboard for that reason. We re-enable Hedera once the Block Node service (HIP-1056) leaves private preview.
  - slug: gram
    h2: "Gram finality time"
    body: |
      Gram (the chain formerly branded TON, native token renamed Toncoin → Gram in June 2026) commits a masterchain block every {{p50:gram}} (p50, 24h). Gram's docs treat a transaction as final once a masterchain block includes it, so the interval between two masterchain commits is how long finality takes to land. Measured as the wall-clock gap between consecutive masterchain seqnos on the tonapi.io block stream (a 300 ms REST poll stands in when the stream is unavailable, with intervals over 2 s dropped as poll aliasing). Workchain blocks become final once the masterchain references them.
  - slug: bnb
    h2: "BNB Chain finality time"
    body: |
      BNB Smart Chain finalizes via the BEP-126 fast-finality fork, dropping the confirmation depth that legacy probabilistic chains require. p50 sits at {{p50:bnb}} (24h), measured via persistent WebSocket subscription that records T1 when block N first appears as `latest` and T2 when it crosses the finalized threshold. The WS approach gives millisecond precision on a chain whose block timestamps have 1-second granularity.
  - slug: avalanche
    h2: "Avalanche finality time"
    body: |
      Avalanche C-Chain uses Snowman++ consensus and reaches finality at {{p50:avalanche}} (p50, 24h). The Avalanche family targets sub-second finality through a sampled-voting protocol that converges with high probability after a few rounds of random validator queries. Measured from the block's own millisecond production timestamp to the moment it reaches us as `latest` over WebSocket. Since the 22 September 2026 upgrade the C-Chain runs Streaming Asynchronous Execution (ACP-194): a block is final when consensus accepts it, and the `finalized` RPC tag now means settled, a fixed 5 seconds later. Timing `latest` to `finalized` read about 6 s from that afternoon and was measuring the settlement delay, not finality; this figure replaced it on 24 October 2026.
  - slug: robinhood
    h2: "Robinhood Chain finality time"
    body: |
      Robinhood Chain reaches the `finalized` tag in {{p50:robinhood}} (p50, 24h). It is a rollup on the Arbitrum Orbit stack, not an L1: blocks arrive about every 100 ms, but a block is only finalized once the batch carrying it is posted to and finalized on the parent chain. Finality therefore lands in batches of about 10,000 blocks, and the figure is the median lag within each batch, measured from the moment a block is first seen as `latest` on a persistent WebSocket.
  - slug: tron
    h2: "TRON finality time"
    body: |
      TRON's solidity confirmation hovers around {{p50:tron}} (p50, 24h), the 19-block delay (two thirds of the 27 Super Representatives) at 3-second block intervals. The solidity flag in TRON consensus is the chain's equivalent of finalized: a block is irreversible once 19 Super Representatives have built on it. Measured via `/wallet/getnowblock` (head) minus `/walletsolidity/getnowblock` (solidity-confirmed).
  - slug: sui
    h2: "SUI finality time"
    body: |
      SUI commits a checkpoint every {{p50:sui}} (p50, 24h). Under Mysticeti a checkpoint is final when committed, so the interval between two checkpoints is how often finality lands. Measured from the checkpoints' own millisecond commit timestamps, read from the official GraphQL service every 500 ms and divided by the number of checkpoints committed in between.
  - slug: near
    h2: "NEAR finality time"
    body: |
      NEAR reaches BFT finality in {{p50:near}} (p50, 24h). Every NEAR header names `last_final_block`, the newest block with a finality certificate, normally two blocks behind it; RPC finality `final` returns that block. A block is final when the first block naming it is produced, so the figure is the timestamp of that block minus the final block's own timestamp, both in nanoseconds as set by the producers. Read every 2 s from dRPC's free NEAR endpoint: the optimistic head, plus its parent and its final block by hash, so the head is timed only when its parent named an older final block, which proves it is the first to name it.
  - slug: sei
    h2: "Sei finality time"
    body: |
      Sei finalizes a block the moment it is committed, with no separate finalized tag. The figure, {{p50:sei}} (p50, 24h), is the time from the block's header timestamp (nanoseconds) to its arrival on a `NewBlockHeader` subscription over the Tendermint WebSocket, already final. On Sei the header time read 0.2 to 0.3 s before arrival on 3 November 2026, inside one block interval of about 0.45 s, so it marks this block's proposal: the figure is proposal, votes, commit and delivery. Readings outside 0 to 60 s are dropped as clock skew.
  - slug: cronos
    h2: "Cronos finality time"
    body: |
      Cronos (the EVM chain, built on CometBFT) finalizes a block when it is committed. The figure, {{p50:cronos}} (p50, 24h), is the time from the block's header timestamp to its arrival on a `NewBlockHeader` subscription over the Tendermint WebSocket. CometBFT header time is BFT time, the median of the validators' precommit times for the previous height, so the figure spans one full height: from the previous commit, through this block's proposal and votes, to its commit and delivery.
  - slug: kaia
    h2: "Kaia finality time"
    body: |
      Kaia's Istanbul BFT finalizes a block when it is committed. The producer waits until its parent's timestamp plus one second and starts the block then, with that whole second as its timestamp, so for an on-time block the timestamp is the start of block building. The figure, {{p50:kaia}} (p50, 24h), is that moment to the block's arrival on a `newHeads` WebSocket subscription. A late block gets a truncated timestamp with its fraction in `timestampFoS`, which newHeads does not carry; those blocks are not timed.
  - slug: icp
    h2: "Internet Computer finality time"
    body: |
      An Internet Computer subnet finalizes a block, executes it, then threshold-signs the resulting state, and only certified state is served. A `read_state` answer carries the certified `/time`, the nanosecond batch time the block maker wrote into that block. The figure, {{p50:icp}} (p50, 24h), is that time to the moment the certified state reaches us, polled every 250 ms on the NNS subnet (home of the ICP ledger), with the arrival taken at the midpoint between two answers. The certificate signature is not verified, since only the timestamp is used.
  - slug: algorand
    h2: "Algorand finality time"
    body: |
      Algorand has no unfinalized head: a node has a block only once its round is certified, so a block is final the moment it appears. The proposal for the next round starts once a round is certified, so one round, {{p50:algorand}} (p50, 24h), is the time from a block's proposal to its certification. Measured on our own clock as the interval between consecutive rounds returned by algod's `wait-for-block-after` long poll. Block timestamps are whole seconds, too coarse to time this from the chain.
  - slug: bitcoin
    h2: "Bitcoin finality time"
    body: |
      Bitcoin is the reference probabilistic chain: Nakamoto consensus never declares a block final, confidence simply grows with confirmation depth. The exchange deposit convention is 6 confirmations, and this benchmark reports the wall-clock time to reach it, {{p50:bitcoin}} (p50, 24h). Bitcoin block timestamps are miner-set and may legally skew by up to two hours, so the harness does not trust them. It polls the mempool.space tip height every 30 seconds and uses its own clock: T1 when a block first appears at the tip, T2 when the tip is 6 blocks past it. Expect high variance; block intervals are Poisson, so the 6-confirmation wait ranges from about 30 minutes to well over 90. A block with 6 confirmations can still be reversed by a deeper reorg, with probability that vanishes as depth grows.
  - slug: litecoin
    h2: "Litecoin finality time"
    body: |
      Litecoin is a probabilistic chain with a 2.5-minute target block interval. Finality is set by convention at 12 confirmations, giving {{p50:litecoin}} (p50, 24h). Twelve, not the older 6: the 13-block MWEB reorg of April 2026 made 6 unsafe, and 12 is the deposit floor exchanges moved to. Measured like Bitcoin, on our own clock: the harness polls the tip height (`getblockcount` on Tatum's public JSON-RPC) every 30 seconds, T1 when a block first appears at the tip, T2 when the tip is 12 blocks past it. Block intervals are Poisson, so the wait varies widely around the 30-minute expectation.
  - slug: monero
    h2: "Monero finality time"
    body: |
      Monero is a probabilistic chain with a 2-minute target block interval. Finality convention is 10 confirmations (a higher depth reflecting Monero's lower-throughput chain mining a smaller security budget), giving p50 = {{p50:monero}} (24h). Measured via the monero-rpc `get_info` endpoint minus a 10-confirmation lookback through `get_block_header_by_height`.

category: Blockchains
status: live
metric: Finality time
unit: s
higher_is_better: false
row_noun: { one: chain, many: chains }

abstract: |
  We measure how long a block takes to become final on every chain we
  can observe honestly from public endpoints, each against the chain's
  own finality rule. Four methods, picked per chain. Where a head and a
  final block coexist, T1 is when block N is first seen and T2 when it is
  final, lag = T2 − T1: over a persistent WebSocket for BNB, Robinhood
  Chain and Solana (millisecond precision, independent of block timestamp
  resolution), on block timestamps polled every 10 s for Ethereum, TRON
  and Monero, on NEAR's nanosecond header timestamps, and on our own clock
  at the tip for Bitcoin (6 confirmations) and Litecoin (12). Where every
  block is already final when it appears (Avalanche, Sei, Cronos, Kaia,
  the Internet Computer), latest to finalized is zero by construction, so
  the figure is the block's own timestamp to its arrival here. Stellar,
  Gram, SUI and Algorand report the interval between two final ledgers,
  masterchain blocks, checkpoints or rounds. Robinhood Chain is the one
  rollup on the board (Arbitrum Orbit): its `finalized` block only moves
  when a posted batch is finalized on the parent chain, thousands of
  blocks at a time, so its row reports the median lag of each batch.
  Hedera, XRP, Aptos and Somnia are not measured; the methodology says why.
methodology:
  - "Cadence: every 10 seconds for Ethereum, TRON and Monero; continuous WebSocket or SSE streams for BNB, Avalanche, Robinhood Chain, Solana, Sei, Cronos, Kaia, Stellar and Gram; a long poll for Algorand; 250 and 500 ms polls for the Internet Computer and SUI; 2 s for NEAR, whose figure comes from block timestamps; 30 s for Bitcoin and Litecoin."
  - "Ethereum: `eth_getBlockByNumber(\"latest\")` minus `eth_getBlockByNumber(\"finalized\")`."
  - "Avalanche (WS, from production): since Streaming Asynchronous Execution went live on 2026-09-22, `latest` is an accepted (Snowman-final) and executed block and `finalized` is the settled block, 5 s later by design. The figure is therefore arrival over `newHeads` minus the header's `timestampMilliseconds` (proposer clock); readings outside 0 to 60 s are dropped as skew. From 2026-09-22 to 2026-10-24 the row timed latest to finalized and published the settlement delay, about 6 s."
  - "BNB (WS wall-clock): persistent `eth_subscribe(\"newHeads\")` records T1 = first time block N is seen as latest. Periodic `eth_getBlockByNumber(\"finalized\")` over same WS records T2 when N becomes finalized. lag = T2 − T1, ms precision. Since 2026-11-03 a socket with no head for 20 s or no finalized advance for 30 s is reconnected: before that, the public node could stop sending heads for hours while still answering, and the row held its last value."
  - "Robinhood Chain (rollup, WS wall-clock): same subscription as BNB / Avalanche on `wss://robinhood-rpc.publicnode.com`. `finalized` advances by whole batches once they are finalized on the parent chain (about 10,000 blocks at about 100 ms each), so every block of a batch is timed, all of them enter the histogram, and the published series carries the batch median: the last block of a batch always has the smallest lag and would understate finality."
  - "Solana: WebSocket `slotSubscribe` and `rootSubscribe` on the public mainnet endpoint. T1 = first notification of slot S, T2 = first root at or above S; lag = T2 - T1 in ms. Replaced the `getBlockTime` difference on 2026-10-22, after Alpenglow made finality shorter than its one-second resolution."
  - "TRON: `/wallet/getnowblock` (head) minus `/walletsolidity/getnowblock` (solidity-confirmed)."
  - "Stellar (ledger close times): Horizon `/ledgers?cursor=now&order=asc` event stream, SCP-final at every close; sample = (closed_at(N) - closed_at(N-10)) / 10, once per new ledger. Before 2026-11-03 the sample was the gap between two ledgers arriving on the stream, which measured Horizon's uneven delivery: median 4.0 s on a chain closing every 5.0 s."
  - "SUI: latest checkpoint from the official GraphQL service (`graphql.mainnet.sui.io`), polled every 500 ms; sample = (timestamp N − timestamp M) / (N − M) over the checkpoints committed between two polls, from the checkpoints' own millisecond commit timestamps. Before 2026-10-24 the sample was the gap between two polls that saw a new checkpoint, which only measured our 500 ms poll; that day it also moved off `sui_getLatestCheckpointSequenceNumber`, retired with JSON-RPC on the public fullnodes."
  - "Gram: wall-clock interval between consecutive masterchain seqnos on the tonapi.io block stream (`workchain=-1`), first sight of N+1 minus first sight of N; a transaction is final once a masterchain block includes it. When the stream is unavailable a 300 ms REST poll of the masterchain head stands in, with intervals over 2 s dropped as poll aliasing."
  - "Bitcoin (probabilistic, own-clock): mempool.space `/blocks/tip/height` polled every 30 s. T1 = first poll where block N is the tip, T2 = first poll where tip − N ≥ 6 (the exchange deposit convention). lag = T2 − T1 on the harness clock; miner-set block timestamps (consensus allows 2h skew) are never used. The startup tip is not timed. On a tip regression, pending timers above the new tip are dropped; same-height reorgs are invisible to height polling, bounding error to about one block interval."
  - "Litecoin (probabilistic, own-clock): Tatum public JSON-RPC `getblockcount` polled every 30 s. T1 = first poll where block N is the tip, T2 = first poll where tip − N ≥ 12 (the post-April-2026 MWEB reorg deposit floor). Same rules as Bitcoin: the startup tip is not timed, skipped heights are never timed. Until 2026-10-24 this row was the timestamp gap between the tip and the block 12 below it on litecoinspace.org, whose index had fallen about 30 minutes behind the chain."
  - "Monero (probabilistic): monero-rpc `get_info` minus 10 confirmations via `get_block_header_by_height`."
  - "NEAR (chain timestamps): every 2 s, the optimistic head from dRPC's free NEAR endpoint, plus its parent and its `last_final_block` F by hash. Sample = timestamp of the head minus timestamp of F, both nanoseconds, kept only when the parent named an older final block, so the head is the first block naming F."
  - "Sei and Cronos (CometBFT, from header time): `NewBlockHeader` subscription on the publicnode Tendermint WebSocket; sample = arrival minus header `time` (ns). A block is final when committed. On Sei the header time is this block's proposal; on Cronos it is BFT time, the previous height's commit, so the Cronos figure covers one whole height."
  - "Kaia (from block start): `newHeads` on the public Kaia endpoint WebSocket. The producer starts a block at its parent's timestamp plus one whole second (kaia work/worker.go), so for a block whose timestamp is its parent's plus one, sample = arrival minus that second. Late blocks, timestamped with a fraction newHeads does not carry, are skipped."
  - "Internet Computer (certified state): anonymous `read_state` for `/time` on the NNS subnet through icp-api.io, every 250 ms. When the certified time advances, sample = arrival (midpoint of the two answers' receive times) minus that time, the batch time of the block that produced the state."
  - "Algorand (round time): algod `wait-for-block-after` long poll on the Nodely (algonode) free endpoint; sample = arrival of round r+1 minus arrival of round r, consecutive rounds only. Block `ts` is whole seconds, so it is not used."
  - "Hedera (planned, currently disabled): mirror-node `/api/v1/blocks` only exposes already-final blocks, so true wall-clock lag is impossible from public endpoints. Re-enables once Block Nodes (HIP-1056) leave private preview."
  - "Result for the 10 s polled chains (Ethereum, TRON, Monero): `lag_seconds = headTimestamp - finalizedTimestamp`, with the block-height delta and per-chain fetch latency. Every other chain publishes milliseconds to `l1_finality_wallclock_lag_milliseconds`."
  - "Excluded by design: XRP (no close-time on `ledger_current`, wall-clock measurement requires WS subscribe to ledger stream, not yet implemented)."
  - "Excluded, Somnia (checked 2026-11-03): `latest`, `safe` and `finalized` are the same block and block timestamps are whole seconds on blocks about 100 ms apart, so neither a head to finalized gap nor a timestamp to arrival time can resolve its sub-second finality."
  - "Excluded, Aptos (checked 2026-11-03): a fullnode serves only committed blocks, and the latest block's microsecond timestamp read 0 to 200 ms before arrival, often after our request left, so it does not mark the proposal. The Aptos Labs API also answered 429 at four requests a second."
  - "Failures (5xx, timeouts, rate limits) leave the previous gauge in place and increment a per-chain `fetch_errors_total` counter; the page falls back to the last successful sample."

findings:
  - "{{name:ethereum}} sits at {{p50:ethereum}} (p50, 24 h), consistent with the 2-epoch Casper FFG design (32 slots × 12 s × 2 = 12.8 min ideal) plus the mid-epoch wait before the countdown starts."
  - "{{name:tron}}'s solidity confirmation hovers around {{p50:tron}}, the 19-block solidity delay at 3 s blocks."
  - "On single-slot BFT chains latest and finalized are the same block, so the figure runs from a block's own timestamp to its arrival, already final: {{name:sei}} at {{p50:sei}}, {{name:kaia}} at {{p50:kaia}} and {{name:cronos}} at {{p50:cronos}} (p50, 24 h)."
  - "{{name:litecoin}} and {{name:monero}} sit at {{p50:litecoin}} and {{p50:monero}} (p50, 24 h) by construction, set by the chosen confirmation depth."
  - "{{name:bitcoin}} reaches the 6-confirmation deposit convention in {{p50:bitcoin}} (p50, 24 h). This is a convention, not protocol finality: Bitcoin is probabilistic, never finalizes absolutely, and the reorg probability only vanishes with depth."
  - "{{best_name}} currently leads the leaderboard at {{best_p50}} (p50, 24 h) across {{count}} measured chains. {{worst_name}} trails at {{worst_p50}}."
  - "Hedera's Hashgraph aBFT is designed to finalize in 3-5 s but is excluded from the live leaderboard because the mirror node only exposes finalized blocks, wall-clock measurement requires the Block Node service (HIP-1056), still in private preview."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/l1-finality

prometheus:
  window: 24h

# Real metrics exposed by the l1-finality harness:
#   l1_finality_lag_seconds{chain}                 gauge (seconds)
#   l1_finality_block_lag{chain}                   gauge (block count)
#   l1_latest_block{chain}                         gauge
#   l1_finalized_block{chain}                      gauge
#   l1_finality_fetch_latency_milliseconds{chain}  gauge (ms)
#   l1_finality_last_refresh_timestamp_seconds{chain}  gauge (unix s)
#   l1_finality_fetch_errors_total{chain, error_type}  counter
#   l1_finality_health{chain}                      gauge (0|1)

# Each "provider" below is one chain. The leaderboard ranks chains by
# observed finality lag (lower = faster). p50/p90/p99 are computed via
# quantile_over_time on the lag_seconds series so a chain that drifts
# during the day shows tail behaviour, not a single flat value.

providers:
  - slug: bnb
    name: BNB
    tag: Fast finality fork (BEP-126), measured via WS wall-clock
    formula: "Median wall-clock milliseconds between a BNB block first appearing as `latest` on WebSocket and crossing the BEP-126 finalized threshold, p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="bnb"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="bnb"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="bnb"}

  - slug: avalanche
    name: Avalanche
    tag: Snowman consensus, block production to accepted
    formula: "Median milliseconds from a C-Chain block's production timestamp (ms) to its arrival as `latest` over WebSocket, where it is already accepted and final, p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="avalanche"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="avalanche"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="avalanche"}

  - slug: robinhood
    name: Robinhood Chain
    tag: Arbitrum Orbit rollup, finalized by batch on its parent chain
    formula: "Median wall-clock milliseconds between a Robinhood Chain block first appearing as `latest` on WebSocket and the `finalized` tag reaching it (batch median), p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="robinhood"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="robinhood"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="robinhood"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="robinhood"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="robinhood"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="robinhood"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="robinhood"}

  - slug: sui
    name: SUI
    tag: Mysticeti DAG, measured via wall-clock checkpoint cadence
    formula: "Median interval between successive SUI checkpoints, from their own commit timestamps (official GraphQL, polled every 500 ms), p50 over 24h. Checkpoints are final when committed."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="sui"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="sui"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="sui"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="sui"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="sui"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="sui"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="sui"}

  - slug: gram
    name: Gram
    tag: Masterchain commit interval, tonapi.io stream
    formula: "Median wall-clock interval between two consecutive Gram (formerly TON) masterchain blocks on the tonapi.io stream; a transaction is final once a masterchain block includes it, p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="gram"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="gram"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="gram"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="gram"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="gram"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="gram"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="gram"}

  - slug: stellar
    name: Stellar
    tag: SCP federated voting, ledger close interval
    formula: "Median Stellar ledger close interval from the ledgers' own close times on the Horizon `/ledgers` stream, averaged over the last ten closes (SCP finalizes at every close), p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="stellar"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="stellar"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="stellar"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="stellar"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="stellar"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="stellar"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="stellar"}

  - slug: solana
    name: Solana
    tag: Alpenglow, measured via WS wall-clock
    formula: "Median wall-clock milliseconds between a Solana slot first appearing on `slotSubscribe` and a root reaching it on `rootSubscribe`, p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="solana"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="solana"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="solana"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="solana"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="solana"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="solana"}[24h])
      # The chart stitches the two methods. The wall-clock metric starts
      # 2026-10-22 ~15:30 UTC; before it, the getBlockTime method (seconds,
      # x1000) is kept up to 2026-10-21 13:50 UTC (1792590600), the last
      # slot before Alpenglow took over (6.6 s at 13:50, 2.85 s at 14:00,
      # ~0.2 s after). The day in between stays empty: that method read 0
      # or 1 s there, which is not a measurement. `* 1` drops __name__ so
      # both halves form one series.
      series: (l1_finality_wallclock_lag_milliseconds{chain="solana"} * 1) or ((l1_finality_lag_seconds{chain="solana"} * 1000) and on() (vector(time()) < 1792590600))

  - slug: tron
    name: TRON
    tag: 19-block solidity confirmation
    formula: "Median elapsed time between the TRON head and the solidity-confirmed block via `/wallet/getnowblock` vs `/walletsolidity/getnowblock` timestamps, the 19-block irreversibility delay, p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_lag_seconds{chain="tron"}[24h]) * 1000
      p90: quantile_over_time(0.90, l1_finality_lag_seconds{chain="tron"}[24h]) * 1000
      p99: quantile_over_time(0.99, l1_finality_lag_seconds{chain="tron"}[24h]) * 1000
      mean: avg_over_time(l1_finality_lag_seconds{chain="tron"}[24h]) * 1000
      success: avg_over_time(l1_finality_health{chain="tron"}[24h])
      sample_size: count_over_time(l1_finality_lag_seconds{chain="tron"}[24h])
      series: l1_finality_lag_seconds{chain="tron"} * 1000

  - slug: ethereum
    name: Ethereum
    tag: Casper FFG, 2-epoch finalization
    formula: "Median gap between `eth_getBlockByNumber(\"latest\")` and `eth_getBlockByNumber(\"finalized\")` timestamps, polled every 10 s, the 2-epoch Casper FFG window plus intra-epoch wait, p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_lag_seconds{chain="ethereum"}[24h]) * 1000
      p90: quantile_over_time(0.90, l1_finality_lag_seconds{chain="ethereum"}[24h]) * 1000
      p99: quantile_over_time(0.99, l1_finality_lag_seconds{chain="ethereum"}[24h]) * 1000
      mean: avg_over_time(l1_finality_lag_seconds{chain="ethereum"}[24h]) * 1000
      success: avg_over_time(l1_finality_health{chain="ethereum"}[24h])
      sample_size: count_over_time(l1_finality_lag_seconds{chain="ethereum"}[24h])
      series: l1_finality_lag_seconds{chain="ethereum"} * 1000

  - slug: litecoin
    name: Litecoin
    tag: Probabilistic, 12 confirmations, own clock
