      series: l1_finality_wallclock_lag_milliseconds{chain="ton"}

  - slug: stellar
    name: Stellar
    tag: SCP federated voting, measured via Horizon SSE wall-clock
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="stellar"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="stellar"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="stellar"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="stellar"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="stellar"}[24h])
