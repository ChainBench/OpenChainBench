      series: l1_finality_wallclock_lag_milliseconds{chain="gram"}

  - slug: stellar
    name: Stellar
    tag: SCP federated voting, measured via Horizon SSE wall-clock
    formula: "Median wall-clock milliseconds between two SCP-final ledger closes on the Horizon `/ledgers` SSE stream, aligned with Stellar's ~5s close interval, p50 over 24h."
