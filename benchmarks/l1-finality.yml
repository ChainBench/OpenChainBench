      mean: avg_over_time(l1_finality_lag_seconds{chain="tron"}[24h]) * 1000
      success: avg_over_time(l1_finality_health{chain="tron"}[24h])
      sample_size: count_over_time(l1_finality_lag_seconds{chain="tron"}[24h])
      series: l1_finality_lag_seconds{chain="tron"} * 1000

