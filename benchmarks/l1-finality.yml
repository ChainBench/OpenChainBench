prometheus:
  window: 24h

# Real metrics exposed by the l1-finality harness:
#   l1_finality_lag_seconds{chain}                 gauge (seconds)
#   l1_finality_block_lag{chain}                   gauge (block count)
#   l1_latest_block{chain}                         gauge
#   l1_finalized_block{chain}                      gauge
#   l1_finality_fetch_latency_milliseconds{chain}  gauge (ms)
#   l1_finality_last_refresh_timestamp_seconds{chain}  gauge (unix s)
#   l1_finality_fetch_errors_total{chain, error_type}  counter
#   l1_finality_health{chain}                      gauge (0|1)

# Each "provider" below is one chain. The leaderboard ranks chains by
# observed finality lag (lower = faster). p50/p90/p99 are computed via
# quantile_over_time on the lag_seconds series so a chain that drifts
# during the day shows tail behaviour, not a single flat value.

providers:
  - slug: bnb
    name: BNB
    tag: Fast finality fork (BEP-126), measured via WS wall-clock
    formula: "Median wall-clock milliseconds between a BNB block first appearing as `latest` on WebSocket and crossing the BEP-126 finalized threshold, p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="bnb"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="bnb"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="bnb"}

  - slug: avalanche
    name: Avalanche
    tag: Snowman++ consensus, measured via WS wall-clock
    formula: "Median wall-clock milliseconds between a C-Chain block emitting as `latest` and as `finalized` on a persistent WebSocket, p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="avalanche"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="avalanche"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="avalanche"}

  - slug: sui
    name: SUI
    tag: Mysticeti DAG, measured via wall-clock checkpoint cadence
    formula: "Median wall-clock milliseconds for a SUI Mysticeti checkpoint to reach finality, measured via `sui_getLatestCheckpointSequenceNumber` with a 5-checkpoint lookback, p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="sui"}[24h])
