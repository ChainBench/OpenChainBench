# OpenChainBench. Bench № 006

slug: l1-finality
number: "006"
title: Fastest L1 blockchain finality, live wall-clock measurement per chain
seo_title: "Fastest L1 finality 2026: {{best_name}} at {{best_p50}}, {{count}} chains"
seo_description: "{{best_name}} finalizes in {{best_p50}} (p50, 24h), the lowest of {{count}} chains measured live. Ethereum, Solana, Bitcoin, BNB, Stellar: wall-clock, not whitepaper."
subtitle: Wall-clock seconds from latest block to the finalized block on Ethereum, Solana, Bitcoin, Gram, BNB, Stellar and 6 more chains, refreshed every 10 seconds.
seo_intro: |
  This page measures L1 finality time live for every major Layer-1 blockchain, with p50 / p90 / p99 refreshed every 10 seconds. Stellar finality time is ~5 seconds, the close interval the Stellar Consensus Protocol locks in via federated Byzantine agreement. Solana finality time dropped from about 12.8 s under Tower BFT to well under a second when Alpenglow went live on 21 October 2026, and is now measured to the millisecond. Ethereum finality time is about 12.8 minutes in the ideal case, the 2-epoch Casper FFG window; observed wall-clock finality runs longer, and the table below shows the live measurement. Hedera finality time clears in 3-5 seconds via Hashgraph aBFT. Gram finality time (formerly TON) sits under one second via BAG consensus. BNB and Avalanche finality time land near two seconds through fast-finality forks. Probabilistic chains (Bitcoin, Litecoin, Monero) settle on a confirmation-depth convention measured here in minutes. Bitcoin finality time is roughly one hour at the industry-standard 6 confirmations; the protocol itself never reaches absolute finality.

faq:
  - q: "What is blockchain finality?"
    a: "Blockchain finality is the point at which a confirmed transaction cannot be reversed without breaking the protocol's security assumptions. Two finality models exist. Deterministic finality (Ethereum Casper FFG, Stellar SCP, Hedera Hashgraph) reaches an explicit consensus commitment that the network treats as irreversible. Probabilistic finality (Bitcoin, Litecoin, Monero, Cardano) leaves a non-zero reorg probability that decreases exponentially with confirmation depth. This benchmark measures the wall-clock time each chain needs to reach its native finality threshold."
  - q: "Probabilistic vs deterministic finality, what is the difference?"
    a: "Deterministic finality is a binary state. A block is either finalized or it is not, and finalized blocks cannot be reorganized. Probabilistic finality is a confidence curve: a block becomes more final with each confirmation that builds on top of it. Exchanges set a convention (Bitcoin 6, Litecoin 6, Monero 10, Cardano 15) past which they treat funds as settled, but the protocol itself never declares strict finality. This benchmark uses each chain's native convention rather than imposing a uniform depth across all chains."
  - q: "What is Ethereum finality time?"
    a: "Ethereum finality time measured live on this page is {{p50:ethereum}} (p50, 24h). Casper FFG finalizes a checkpoint two epochs after it is justified, where each epoch is 32 slots of 12 seconds, about 12.8 minutes in the ideal case. Observed wall-clock finality runs longer because a block lands mid-epoch and waits before the two-epoch countdown starts. The live table above shows the measured value. The benchmark polls eth_getBlockByNumber(\"latest\") and eth_getBlockByNumber(\"finalized\") every 10 seconds and reports the timestamp delta."
  - q: "What is Solana finality time?"
    a: "Solana switched consensus from Tower BFT to Alpenglow on 21 October 2026 (epoch 1064). Under Tower BFT a block was finalized after 32 confirmed slots, about 12.8 seconds; Alpenglow targets about 150 ms and makes confirmed and finalized the same thing. Measured here as the wall-clock time from a slot first appearing to it being rooted, {{p50:solana}} (p50, 24h). That figure has two parts: the block still arriving after the slot first appears (about 165 ms at the median on 24 October 2026), then voting from the complete block to root (about 242 ms)."
  - q: "What is Gram finality time?"
    a: "Gram's BAG consensus (the network formerly branded TON, with native token renamed Toncoin → Gram in June 2026) pushes masterchain finality to {{p50:gram}} (p50, 24h), one of the lowest deterministic finalities measured on this leaderboard. Gram's design splits state across a masterchain and many workchains. The figure here is the masterchain commit, the canonical reference for cross-chain settlement."
  - q: "What is Stellar finality time?"
    a: "Stellar uses the Stellar Consensus Protocol, a federated Byzantine agreement that reaches deterministic finality at every ledger close, roughly every 5 seconds, no probabilistic confirmation needed. p50 sits at {{p50:stellar}} (24h). The benchmark records wall-clock time between a new ledger appearing on the Horizon stream and its SCP-final commit."
  - q: "What is Hedera finality time?"
    a: "Hedera finality time is documented at 3 to 5 seconds via Hashgraph asynchronous Byzantine fault tolerant (aBFT) consensus. The mirror node only exposes already-final blocks, so true wall-clock measurement of consensus lag is currently impossible from public endpoints. We re-enable Hedera once the Block Node service (HIP-1056) leaves private preview."
  - q: "What is BNB Chain finality time?"
    a: "BNB Smart Chain finalizes via the BEP-126 fast-finality fork, dropping the confirmation depth that legacy probabilistic chains require. p50 sits at {{p50:bnb}} (24h), measured via persistent WebSocket subscription that records T1 when block N first appears as latest and T2 when it crosses the finalized threshold."
  - q: "Which blockchain has the fastest finality time?"
    a: "Sub-second BFT chains lead: {{best_name}} posts the lowest median at {{best_p50}} (p50, 24h). {{name:bnb}} follows at {{p50:bnb}} and {{name:avalanche}} at {{p50:avalanche}} via their fast-finality forks. {{name:solana}} finalized clocks {{p50:solana}} and {{name:ethereum}} {{p50:ethereum}}. Probabilistic chains trail by confirmation-depth convention: {{name:litecoin}} at {{p50:litecoin}} and {{name:bitcoin}} at {{p50:bitcoin}} for 6 confirmations."
  - q: "What is Bitcoin finality time?"
    a: "Bitcoin never reaches absolute finality. Nakamoto consensus gives probabilistic finality: any block can in principle be reorganized, with a probability that falls exponentially as more blocks are mined on top. The exchange-industry deposit convention is 6 confirmations, roughly one hour at the 10-minute target block interval, and that is what this benchmark measures: {{p50:bitcoin}} (p50, 24h) wall-clock from a block first appearing at the chain tip to reaching 6 confirmations, timed with the harness clock rather than miner-set block timestamps. Variance is high because block intervals are Poisson distributed; a lucky streak settles in about 30 minutes, an unlucky one takes well over 90. Six confirmations is a risk threshold, not a protocol guarantee, and deep reorgs remain possible with vanishing probability."
  - q: "How is L1 finality time measured on this page?"
    a: "Three methods, picked per chain. RPC pollers compare latest vs finalized block timestamps every 10 seconds, used for Ethereum, TRON and Monero. Stream subscribers (WebSocket or SSE) record wall-clock time T1 when a block first appears on the head stream and T2 when it crosses the finality threshold, giving millisecond-precision lag for Solana, BNB, Avalanche, Robinhood Chain, Gram and Stellar; SUI reads checkpoint commit timestamps. Bitcoin and Litecoin are timed on our own clock from the tip height, T1 when a block becomes the tip and T2 when it has the conventional confirmations."

per_chain_explainer:
  - slug: ethereum
    h2: "Ethereum finality time"
    body: |
      Ethereum finality time is {{p50:ethereum}} (p50, 24h), measured live. Casper FFG finalizes a checkpoint two epochs after it is justified, where each epoch is 32 slots of 12 seconds, which puts the ideal case at about 12.8 minutes. Observed wall-clock finality runs longer because a block lands mid-epoch and waits before the two-epoch countdown starts. Finality is deterministic once reached, but reorgs of unfinalized blocks remain possible before finalization. Measured by polling `eth_getBlockByNumber("finalized")` against `latest` every 10 seconds and reporting the timestamp delta.
  - slug: solana
    h2: "Solana finality time"
    body: |
      Solana finality time is {{p50:solana}} (p50, 24h). Alpenglow replaced Tower BFT on mainnet on 21 October 2026: finality went from 32 confirmed slots, about 12.8 seconds, to a target of about 150 ms, and the confirmed and finalized commitments became one. The harness subscribes over WebSocket to slots and roots, records the wall-clock moment a slot first appears and the moment a root reaches it, and reports the difference in milliseconds. The slot appears while its block is still arriving, so the figure includes block propagation as well as the vote: over one hour on 24 October 2026, the block took about 165 ms to arrive in full and the vote about 242 ms to root (medians). The earlier method subtracted `getBlockTime` values, which are whole seconds and cannot resolve sub-second finality; it read 0 or 1 s after the switch and was retired on 22 October.
  - slug: stellar
    h2: "Stellar finality time"
    body: |
      Stellar uses the Stellar Consensus Protocol, a federated Byzantine agreement that reaches deterministic finality at every ledger close. p50 sits at {{p50:stellar}} (24h), aligned with the documented 5-second close interval. No probabilistic confirmation, no reorg window. Measured via the Horizon `/ledgers?cursor=now&order=asc` SSE stream, recording wall-clock T1 on first ledger sight and T2 on the next SCP-final commit.
  - slug: hedera
    h2: "Hedera finality time"
    body: |
      Hedera finality time is documented at 3 to 5 seconds via Hashgraph asynchronous Byzantine fault tolerant (aBFT) consensus. The mirror node only exposes already-final blocks, so true wall-clock measurement of consensus lag is currently impossible from public endpoints. This chain is excluded from the live leaderboard for that reason. We re-enable Hedera once the Block Node service (HIP-1056) leaves private preview.
  - slug: gram
    h2: "Gram finality time"
    body: |
      Gram's BAG consensus (the chain formerly branded TON, native token renamed Toncoin → Gram in June 2026) pushes masterchain finality to {{p50:gram}} (p50, 24h), one of the lowest deterministic finalities measured on this leaderboard. Gram's design splits state across a masterchain and many workchains; the figure reported here is the masterchain commit, the canonical reference for cross-chain settlement. Measured as the wall-clock lag of the tonapi.io masterchain head: Gram masterchain blocks are BFT-final at production (validator-signed, no fork choice), so commit lag is finality. Post accelerated upgrade the masterchain produces a block about every 0.4s, verified empirically 2026-07-11.
  - slug: bnb
    h2: "BNB Chain finality time"
    body: |
      BNB Smart Chain finalizes via the BEP-126 fast-finality fork, dropping the confirmation depth that legacy probabilistic chains require. p50 sits at {{p50:bnb}} (24h), measured via persistent WebSocket subscription that records T1 when block N first appears as `latest` and T2 when it crosses the finalized threshold. The WS approach gives millisecond precision on a chain whose block timestamps have 1-second granularity.
  - slug: avalanche
    h2: "Avalanche finality time"
    body: |
      Avalanche C-Chain uses Snowman++ consensus and reaches finality at {{p50:avalanche}} (p50, 24h). The Avalanche family targets sub-second finality through a sampled-voting protocol that converges with high probability after a few rounds of random validator queries. Measured via persistent WebSocket subscription on the C-Chain, recording wall-clock between latest and finalized block emission.
  - slug: robinhood
    h2: "Robinhood Chain finality time"
    body: |
      Robinhood Chain reaches the `finalized` tag in {{p50:robinhood}} (p50, 24h). It is a rollup on the Arbitrum Orbit stack, not an L1: blocks arrive about every 100 ms, but a block is only finalized once the batch carrying it is posted to and finalized on the parent chain. Finality therefore lands in batches of about 10,000 blocks, and the figure is the median lag within each batch, measured from the moment a block is first seen as `latest` on a persistent WebSocket.
  - slug: tron
    h2: "TRON finality time"
    body: |
      TRON's solidity confirmation hovers around {{p50:tron}} (24h average), matching the documented 20-block delay at 3-second block intervals. The solidity flag in TRON consensus is the chain's equivalent of finalized: a block survives until 20 confirmations before being considered irreversible. Measured via `/wallet/getnowblock` (head) minus `/walletsolidity/getnowblock` (solidity-confirmed).
  - slug: bitcoin
    h2: "Bitcoin finality time"
    body: |
      Bitcoin is the reference probabilistic chain: Nakamoto consensus never declares a block final, confidence simply grows with confirmation depth. The exchange deposit convention is 6 confirmations, and this benchmark reports the wall-clock time to reach it, {{p50:bitcoin}} (p50, 24h). Bitcoin block timestamps are miner-set and may legally skew by up to two hours, so the harness does not trust them. It polls the mempool.space tip height every 30 seconds and uses its own clock: T1 when a block first appears at the tip, T2 when the tip is 6 blocks past it. Expect high variance; block intervals are Poisson, so the 6-confirmation wait ranges from about 30 minutes to well over 90. A block with 6 confirmations can still be reversed by a deeper reorg, with probability that vanishes as depth grows.
  - slug: litecoin
    h2: "Litecoin finality time"
    body: |
      Litecoin is a probabilistic chain with a 2.5-minute target block interval. Finality is set by convention at 12 confirmations, giving {{p50:litecoin}} (p50, 24h). Twelve, not the older 6: the 13-block MWEB reorg of April 2026 made 6 unsafe, and 12 is the deposit floor exchanges moved to. Measured like Bitcoin, on our own clock: the harness polls the tip height (`getblockcount` on Tatum's public JSON-RPC) every 30 seconds, T1 when a block first appears at the tip, T2 when the tip is 12 blocks past it. Block intervals are Poisson, so the wait varies widely around the 30-minute expectation.
  - slug: monero
    h2: "Monero finality time"
    body: |
      Monero is a probabilistic chain with a 2-minute target block interval. Finality convention is 10 confirmations (a higher depth reflecting Monero's lower-throughput chain mining a smaller security budget), giving p50 = {{p50:monero}} (24h). Measured via the monero-rpc `get_info` endpoint minus a 10-confirmation lookback through `get_block_header_by_height`.

category: Blockchains
status: live
metric: Finality time
unit: s
higher_is_better: false
row_noun: { one: chain, many: chains }

abstract: |
  We measure the live gap between every L1 chain's latest block and its
  finalized block. The harness uses two complementary methods. For
  chains with finality much longer than our 10 s poll interval we read
  `latest.timestamp, finalized.timestamp` from the chain RPCs (Ethereum,
  TRON, Monero). For chains whose finality
  is faster than the poll interval (Solana, BNB, Avalanche, SUI, Gram, Stellar)
  we maintain a persistent WebSocket / SSE subscription, recording
  wall-clock time T1 when block N is first seen as `latest` and T2
  when it becomes `finalized`. lag = T2 − T1 with millisecond
  precision. The WS path is the only honest way to measure
  sub-poll-cadence finality. Comparing two pointers at a single
  instant collapses to zero when finalization catches up to head.
  Bitcoin uses the same own-clock idea over HTTP polling: T1 when a
  block first appears at the mempool.space tip, T2 when it reaches the
  6-confirmation exchange deposit convention. Litecoin is timed the same
  way to 12 confirmations, from Tatum's public JSON-RPC tip. Miner-set Bitcoin block
  timestamps (up to 2h skew is consensus-legal) are never trusted, and
  Bitcoin never reaches absolute finality; the row reports the wall
  clock to a conventional risk threshold, not a protocol commitment.
  Robinhood Chain is the one rollup on the board (Arbitrum Orbit): its
  `finalized` block only moves when a posted batch is finalized on the
  parent chain, thousands of blocks at a time, so its row reports the
  median lag of each finalized batch.
  Hedera is mentioned in the FAQ but not currently measured, its
  mirror node only exposes already-final blocks, which makes
  wall-clock lag impossible. Re-enabling is gated on Block Nodes
  (HIP-1056) leaving private preview.

methodology:
  - "Cadence: every 10 seconds for HTTP-polled chains, continuous WS for BNB, Avalanche and Robinhood Chain."
  - "Ethereum: `eth_getBlockByNumber(\"latest\")` minus `eth_getBlockByNumber(\"finalized\")`."
  - "BNB / Avalanche (WS wall-clock): persistent `eth_subscribe(\"newHeads\")` records T1 = first time block N is seen as latest. Periodic `eth_getBlockByNumber(\"finalized\")` over same WS records T2 when N becomes finalized. lag = T2 − T1, ms precision, independent of chain timestamp resolution."
  - "Robinhood Chain (rollup, WS wall-clock): same subscription as BNB / Avalanche on `wss://robinhood-rpc.publicnode.com`. `finalized` advances by whole batches once they are finalized on the parent chain (about 10,000 blocks at about 100 ms each), so every block of a batch is timed, all of them enter the histogram, and the published series carries the batch median: the last block of a batch always has the smallest lag and would understate finality."
  - "Solana: WebSocket `slotSubscribe` and `rootSubscribe` on the public mainnet endpoint. T1 = first notification of slot S, T2 = first root at or above S; lag = T2 - T1 in ms. Replaced the `getBlockTime` difference on 2026-10-22, after Alpenglow made finality shorter than its one-second resolution."
  - "TRON: `/wallet/getnowblock` (head) minus `/walletsolidity/getnowblock` (solidity-confirmed)."
  - "Stellar (SSE wall-clock): Horizon `/ledgers?cursor=now&order=asc` event-stream records T1 on first sight of ledger N and T2 on the next ledger close (SCP-final at every close)."
  - "SUI: latest checkpoint from the official GraphQL service (`graphql.mainnet.sui.io`), polled every 500 ms; sample = (timestamp N − timestamp M) / (N − M) over the checkpoints committed between two polls, from the checkpoints' own millisecond commit timestamps. Before 2026-10-24 the sample was the gap between two polls that saw a new checkpoint, which only measured our 500 ms poll; that day it also moved off `sui_getLatestCheckpointSequenceNumber`, retired with JSON-RPC on the public fullnodes."
  - "Gram: wall-clock lag of the tonapi.io masterchain head. Masterchain blocks are BFT-final at production, so head commit lag is the finality figure; the chain produces a block about every 0.4s since the accelerated upgrade."
  - "Bitcoin (probabilistic, own-clock): mempool.space `/blocks/tip/height` polled every 30 s. T1 = first poll where block N is the tip, T2 = first poll where tip − N ≥ 6 (the exchange deposit convention). lag = T2 − T1 on the harness clock; miner-set block timestamps (consensus allows 2h skew) are never used. The startup tip is not timed. On a tip regression, pending timers above the new tip are dropped; same-height reorgs are invisible to height polling, bounding error to about one block interval."
  - "Litecoin (probabilistic, own-clock): Tatum public JSON-RPC `getblockcount` polled every 30 s. T1 = first poll where block N is the tip, T2 = first poll where tip − N ≥ 12 (the post-April-2026 MWEB reorg deposit floor). Same rules as Bitcoin: the startup tip is not timed, skipped heights are never timed. Until 2026-10-24 this row was the timestamp gap between the tip and the block 12 below it on litecoinspace.org, whose index had fallen about 30 minutes behind the chain."
  - "Monero (probabilistic): monero-rpc `get_info` minus 10 confirmations via `get_block_header_by_height`."
  - "Hedera (planned, currently disabled): mirror-node `/api/v1/blocks` only exposes already-final blocks, so true wall-clock lag is impossible from public endpoints. Re-enables once Block Nodes (HIP-1056) leave private preview."
  - "Result: `lag_seconds = headTimestamp - finalizedTimestamp`. We also record the block-height delta and per-chain fetch latency."
  - "Excluded by design: XRP (no close-time on `ledger_current`, wall-clock measurement requires WS subscribe to ledger stream, not yet implemented)."
  - "Failures (5xx, timeouts, rate limits) leave the previous gauge in place and increment a per-chain `fetch_errors_total` counter; the page falls back to the last successful sample."

findings:
  - "{{name:ethereum}} sits at {{p50:ethereum}} (24 h average), consistent with the 2-epoch Casper FFG design (32 slots × 12 s × 2 = 12.8 min ideal) plus the mid-epoch wait before the countdown starts."
  - "{{name:tron}}'s solidity confirmation hovers around {{p50:tron}}, exactly the documented 20-block delay at 3 s blocks."
  - "{{name:litecoin}} and {{name:monero}} sit at {{p50:litecoin}} (p50, 24 h) and {{p50:monero}} (24 h average) by construction, set by the chosen confirmation depth."
  - "{{name:bitcoin}} reaches the 6-confirmation deposit convention in {{p50:bitcoin}} (p50, 24 h). This is a convention, not protocol finality: Bitcoin is probabilistic, never finalizes absolutely, and the reorg probability only vanishes with depth."
  - "{{best_name}} currently leads the leaderboard at {{best_p50}} (p50, 24 h) across {{count}} measured chains. {{worst_name}} trails at {{worst_p50}}."
  - "Hedera's Hashgraph aBFT is designed to finalize in 3-5 s but is excluded from the live leaderboard because the mirror node only exposes finalized blocks, wall-clock measurement requires the Block Node service (HIP-1056), still in private preview."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/l1-finality

prometheus:
  window: 24h

# Real metrics exposed by the l1-finality harness:
#   l1_finality_lag_seconds{chain}                 gauge (seconds)
#   l1_finality_block_lag{chain}                   gauge (block count)
#   l1_latest_block{chain}                         gauge
#   l1_finalized_block{chain}                      gauge
#   l1_finality_fetch_latency_milliseconds{chain}  gauge (ms)
#   l1_finality_last_refresh_timestamp_seconds{chain}  gauge (unix s)
#   l1_finality_fetch_errors_total{chain, error_type}  counter
#   l1_finality_health{chain}                      gauge (0|1)

# Each "provider" below is one chain. The leaderboard ranks chains by
# observed finality lag (lower = faster). p50/p90/p99 are computed via
# quantile_over_time on the lag_seconds series so a chain that drifts
# during the day shows tail behaviour, not a single flat value.

providers:
  - slug: bnb
    name: BNB
    tag: Fast finality fork (BEP-126), measured via WS wall-clock
    formula: "Median wall-clock milliseconds between a BNB block first appearing as `latest` on WebSocket and crossing the BEP-126 finalized threshold, p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="bnb"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="bnb"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="bnb"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="bnb"}

  - slug: avalanche
    name: Avalanche
    tag: Snowman++ consensus, measured via WS wall-clock
    formula: "Median wall-clock milliseconds between a C-Chain block emitting as `latest` and as `finalized` on a persistent WebSocket, p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="avalanche"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="avalanche"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="avalanche"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="avalanche"}

  - slug: robinhood
    name: Robinhood Chain
    tag: Arbitrum Orbit rollup, finalized by batch on its parent chain
    formula: "Median wall-clock milliseconds between a Robinhood Chain block first appearing as `latest` on WebSocket and the `finalized` tag reaching it (batch median), p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="robinhood"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="robinhood"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="robinhood"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="robinhood"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="robinhood"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="robinhood"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="robinhood"}

  - slug: sui
    name: SUI
    tag: Mysticeti DAG, measured via wall-clock checkpoint cadence
    formula: "Median interval between successive SUI checkpoints, from their own commit timestamps (official GraphQL, polled every 500 ms), p50 over 24h. Checkpoints are final when committed."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="sui"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="sui"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="sui"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="sui"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="sui"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="sui"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="sui"}

  - slug: gram
    name: Gram
    tag: Masterchain commit, polled via tonapi.io
    formula: "Median wall-clock milliseconds for a Gram (formerly TON) masterchain block to commit under BAG consensus, polled via tonapi.io with a 3-seqno lookback, p50 over 24h."
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="gram"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="gram"}[24h])
