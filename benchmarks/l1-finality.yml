      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="ton"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="ton"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="ton"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="ton"}

  - slug: hedera
