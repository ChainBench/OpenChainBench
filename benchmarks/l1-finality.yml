    tag: Tower BFT, 32-slot finalized commitment
    formula: "Mean elapsed time (in ms) between Solana's processed and finalized commitments via `getSlot` + `getBlockTime`, covering the 32-slot Tower BFT finalization gap, over 24h."
    queries:
      p50: avg_over_time(l1_finality_lag_seconds{chain="solana"}[24h]) * 1000
