      success: avg_over_time(l1_finality_wallclock_health{chain="sui"}[24h])
      sample_size: increase(l1_finality_wallclock_samples_total{chain="sui"}[24h])
      series: l1_finality_wallclock_lag_milliseconds{chain="sui"}

  - slug: ton
    name: TON
    tag: Masterchain commit, measured via SSE wall-clock
    queries:
      p50: quantile_over_time(0.50, l1_finality_wallclock_lag_milliseconds{chain="ton"}[24h])
      p90: quantile_over_time(0.90, l1_finality_wallclock_lag_milliseconds{chain="ton"}[24h])
      p99: quantile_over_time(0.99, l1_finality_wallclock_lag_milliseconds{chain="ton"}[24h])
      mean: avg_over_time(l1_finality_wallclock_lag_milliseconds{chain="ton"}[24h])
      success: avg_over_time(l1_finality_wallclock_health{chain="ton"}[24h])
