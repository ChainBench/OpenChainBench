    name: Litecoin
    tag: Probabilistic, 6 confirmations
    formula: "Mean elapsed time (in ms) to accumulate 6 Litecoin confirmations via blockchair `/stats.best_block_height` with a 6-block lookback, the standard probabilistic settlement convention, over 24h."
    queries:
      p50: avg_over_time(l1_finality_lag_seconds{chain="litecoin"}[24h]) * 1000
      p90: quantile_over_time(0.90, l1_finality_lag_seconds{chain="litecoin"}[24h]) * 1000
      p99: quantile_over_time(0.99, l1_finality_lag_seconds{chain="litecoin"}[24h]) * 1000
      mean: avg_over_time(l1_finality_lag_seconds{chain="litecoin"}[24h]) * 1000
      success: avg_over_time(l1_finality_health{chain="litecoin"}[24h])
      sample_size: count_over_time(l1_finality_lag_seconds{chain="litecoin"}[24h])
      series: l1_finality_lag_seconds{chain="litecoin"} * 1000

