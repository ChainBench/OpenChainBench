# OpenChainBench. Bench № 028

slug: bridge-revenue
number: "028"
title: Cross-chain bridge implied protocol revenue
seo_title: "Cross-chain bridge revenue tracker 2026"
seo_description: "Live cross-chain bridge implied protocol revenue. (USD in − USD out − gas − app fees) summed over swaps in 24h / 7d / 30d. Upper bound on what each bridge + solvers keep. Relay tracked today; Across / Socket / deBridge to follow. Methodology pre-registered, harness OSS."
subtitle: Implied margin in USD that each cross-chain bridge plus its solver network collectively retain per swap, summed over rolling 24h / 7d / 30d windows. Upper bound, not exact. Read methodology before citing.
category: Bridges
status: live
metric: Implied revenue USD (24h)
unit: usd
higher_is_better: true

disclaimer: |
  This is an UPPER BOUND, not an exact protocol-revenue number. The margin = USD-in minus USD-out minus gas minus disclosed app fees. Some of that margin Relay shares with solvers in ways we cannot distinguish from the public swap data, so the bench attributes the full amount to "Relay plus solvers collectively". Treat the headline as a ceiling on Relay's own take, not a P&L line. Unpriced swaps (token without a USD reference at swap time) are excluded from the sum and counted separately.

seo_intro: |
  This benchmark answers a question that has no honest public
  answer today. how much money does Relay.link, the leading
  cross-chain swap routing protocol, actually retain from the
  flow it processes. The bench computes implied margin per swap
  as (USD value the user paid) minus (USD value the user
  received) minus (gas total in USD) minus (any external app
  fees the API discloses), then sums that margin over rolling
  24-hour, 7-day and 30-day windows. The result is the smallest
  possible number consistent with the on-chain swap data, but
  not necessarily the smallest possible number consistent with
  Relay's books. Relay shares revenue with the solver network
  in ways the public API does not break out, so the bench
  attributes the full margin to "Relay plus solvers collectively".
  Treat the headline as a ceiling on what Relay alone keeps.
  Why publish an upper bound. Because no lower bound exists in
  public data. Relay does not publish a fee schedule mapping
  volume to revenue. Solver-rebate arrangements are private.
  Community-tracked volume ($80M-$150M per day per public
  disclosures) times a market-implied 1-5 bps blended take
  rate yields an expected band of $20k-$100k per day, or
  $0.75M-$2.5M per month. This bench tightens that band by
  measuring directly from the swap stream and discloses every
  methodology choice so readers can reproduce or argue with
  the number.
  How it works. A Go program polls the Relay.link public swap
  API every 60 s, joins each completed swap against a USD
  reference at the swap timestamp, subtracts gas and disclosed
  external app fees, and emits the resulting margin as a
  Prometheus gauge labeled by window. Unpriced swaps are
  excluded from the sum and counted separately. Headline
  numbers render as p50 / p90 / p99 on the bench page; those
  slots are repurposed for 24h / 7d / 30d windows of the same
  margin metric. Take rate in bps is published alongside.

abstract: |
  Relay.link is a cross-chain swap routing protocol that
  publishes per-swap detail through a public API. This
  benchmark consumes that API on a fixed cadence, computes
  per-swap implied margin in USD as (input USD value) minus
  (output USD value) minus (gas USD) minus (disclosed external
  app fees), and sums the margin over rolling 24-hour, 7-day
  and 30-day windows. The result is published as the protocol-
  revenue upper bound. Volume USD, swap count and the implied
  take rate in basis points are surfaced alongside as context.
  The bench does not have access to Relay's internal solver-
  rebate accounting, so the number is interpreted as the
  margin retained collectively by Relay plus its solver
  network, not Relay's own bottom-line revenue. Cross-
  validation. Public disclosures put Relay volume at $80M to
  $150M per day. Bridge / aggregator take rates cluster at 1
  to 5 basis points blended. Multiplying yields an expected
  protocol-revenue band of $20k to $100k per day, or $0.75M
  to $2.5M per month, which the live bench number should fall
  inside. Significant deviation is either a data-quality issue
  the methodology section flags (price-feed gap, unpriced
  swap surge, API change) or genuine signal that solver share
  has shifted. Limitations. The margin definition is an upper
  bound. Solver rebates would lower it; data-quality gaps
  (missing USD reference at swap time, gas estimation drift,
  undisclosed app fees) would lower the published headline
  relative to true protocol revenue. The harness publishes
  unpriced-swap count and last-poll timestamp as freshness
  signals so readers can spot data-quality regressions.

methodology:
  - "Data source. The Relay.link public swap API is polled on a fixed cadence (default 60 s). The harness consumes the swap stream incrementally, deduping by swap ID, and emits each completed swap as a single contribution to the running window sums. Only swaps with status `success` are counted; pending or failed swaps are tracked separately and excluded from the revenue sum."
  - "Margin definition. per_swap_margin_usd = input_usd - output_usd - gas_usd - external_app_fees_usd. input_usd and output_usd are computed by joining the on-chain token amounts against a USD reference at the swap timestamp from CoinGecko or equivalent. gas_usd is the chain-native gas cost (gas_used * gas_price) converted to USD at the same timestamp. external_app_fees_usd is the sum of any frontend or referrer fees the swap payload discloses."
  - "Window sums. relay_revenue_usd{window=\"24h\"} is the rolling 24-hour sum of per-swap margin. relay_revenue_usd{window=\"7d\"} is the rolling 7-day sum. relay_revenue_usd{window=\"30d\"} is the rolling 30-day sum. relay_volume_usd and relay_swap_count are computed the same way over the same windows. The bench page binds the three timescales to the p50 / p90 / p99 slots respectively, so the leaderboard surfaces all three at a glance."
  - "Take rate. relay_take_rate_bps = (relay_revenue_usd{window=\"24h\"} / relay_volume_usd{window=\"24h\"}) * 10000. Reported on the 24-hour window as the most recent operational signal. Expected band per cross-validation is 1-5 bps blended; a take-rate reading outside that band is either a data-quality issue or a regime change worth investigating."
  - "Pricing coverage. relay_swaps_priced_total counts swaps where every leg had a USD reference at swap time. relay_swaps_unpriced_total counts swaps where at least one leg did not (long-tail token, missing reference, price-feed gap). The success column on the bench page is priced / (priced + unpriced), a data-quality ratio rather than a service-uptime ratio. A low ratio means the published headline understates true volume and margin."
  - "Why margin is an upper bound on protocol revenue. Relay shares revenue with its solver network through arrangements the public API does not break out. Per-swap margin therefore captures what Relay AND solvers collectively retain, not Relay alone. Without access to internal rebate accounting, the bench cannot decompose the split. Headline is published as 'Relay implied protocol revenue (upper bound)'. Readers building a P&L model should apply their own solver-share assumption to the headline."
  - "Freshness. relay_last_poll_timestamp_seconds is a Unix-timestamp gauge of the most recent successful API poll. The bench page's success indicator and any cron alerter use this to detect API outages or harness stalls. expected_freshness_seconds is set to 300 (5 min) which is 5x the 60 s poll cadence, so one missed cycle is tolerated and two missed cycles fire."
  - "Cross-validation expected band. Public disclosures put Relay daily volume at $80M to $150M per day. Industry-standard cross-chain take rates cluster at 1 to 5 basis points blended. Multiplying the two ranges yields an expected revenue band of $20k to $100k per day, or $0.75M to $2.5M per month. The live number should fall inside this band. Significant deviation is either a data-quality issue or genuine signal that solver share has shifted."
  - "Reproducibility. The full harness source is published in the OpenChainBench harnesses directory (Go). Anyone can clone, set the Relay.link API endpoint env var, run the binary against a Prometheus scraper, and reproduce these metrics. The bench does not rely on any private Mobula service for measurement, the only external dependency is the Relay.link public API and a public USD price reference (CoinGecko or equivalent)."
  - "Methodology versioning. Any change to the margin definition, window sizes, pricing source, or excluded-swap rules ships as a public PR with a 14-day comment window. Major changes (e.g. switching from upper-bound margin to a solver-net-decomposed model once private data becomes available) run a 30-day shadow period publishing old and new metric series in parallel."

findings:
  - "Relay implied protocol revenue (24h, upper bound) is currently {{p50:relay}}. Sum of (USD paid - USD received - gas - disclosed app fees) across every successful swap in the last 24 hours. This is the smallest number consistent with the public on-chain swap data and an upper bound on what Relay alone retains after solver-share rebates."
  - "The 7-day rolling sum sits at {{p90:relay}}. Smoothing across a week removes day-of-week volume effects and the noise from a single large arbitrage swap that can dominate a 24-hour window. Read this number as the steady-state protocol-revenue ceiling."
  - "The 30-day rolling sum is {{p99:relay}}. Monthly recurring revenue ceiling, useful for comparing against public revenue disclosures from comparable cross-chain protocols and against the $0.75M-$2.5M per month expected band derived from volume times take-rate cross-validation."
  - "Implied take rate over the last 24 hours is approximately (relay_revenue_usd / relay_volume_usd) * 10000 basis points. Expected blended band per industry cross-validation is 1 to 5 bps. A reading outside this band is either a data-quality issue (priced-swap ratio dropping, gas-estimation drift) or genuine signal that solver share has shifted."
  - "Pricing coverage (priced swaps / total swaps over 24h) controls how much of true volume the headline captures. A 100 % ratio means every swap was joined against a USD reference and the headline reflects the full flow. A lower ratio means long-tail tokens are dropping out of the margin sum and the published number understates true protocol revenue proportionally."

faq:
  - q: "Is this Relay.link's actual revenue?"
    a: "No. It is an upper bound. Implied margin equals USD paid minus USD received minus gas minus disclosed app fees, summed over completed swaps. Relay shares an unknown fraction of that margin with its solver network through arrangements the public API does not break out. The headline therefore captures what Relay AND its solver network collectively retain, not Relay's own bottom-line revenue. Without access to internal rebate accounting, the bench cannot decompose the split. Treat the headline as a ceiling and apply your own solver-share assumption if you need a Relay-only number."
  - q: "Why publish an upper bound instead of an exact number?"
    a: "Because no exact number exists in public data and an upper bound is the most rigorous estimate the public swap stream supports. Relay does not publish a fee schedule mapping volume to protocol revenue, and solver-rebate arrangements are private. The alternatives are either to publish nothing, or to publish a guess. An upper bound computed directly from the swap data is more useful than a guess, and is honest about the residual uncertainty. The methodology section spells out exactly what the upper-bound assumption is so readers can apply their own adjustments."
  - q: "What does the expected band of $20k-$100k per day come from?"
    a: "Cross-validation. Public disclosures put Relay daily volume at $80M to $150M per day. Industry-standard cross-chain take rates cluster at 1 to 5 basis points blended (bridge aggregators and routing protocols typically sit in this range). Multiplying the two ranges yields an expected revenue band of $20k to $100k per day, or $0.75M to $2.5M per month. The live bench number should fall inside this band. A reading meaningfully outside it is either a data-quality issue the methodology flags, or a signal that the cross-validation assumptions need to be revisited."
  - q: "Why are 24h, 7d and 30d shown in the p50 / p90 / p99 columns?"
    a: "OpenChainBench's standard leaderboard renders p50 / p90 / p99 of a latency-like metric. For a revenue benchmark there is no native percentile interpretation, so the three slots are repurposed to surface the same metric at three timescales: 24h in p50, 7d in p90, 30d in p99. This preserves the at-a-glance comparability of the leaderboard while making the multi-window nature of the metric explicit. The methodology section calls this out so readers do not misread the columns as actual percentiles."
  - q: "What happens to swaps whose tokens have no USD price at swap time?"
    a: "They are excluded from the margin sum and the volume sum, and counted separately as relay_swaps_unpriced_total. The success column on the bench page is priced / (priced + unpriced), so a low ratio is visible. Causes of an unpriced swap include long-tail token without a CoinGecko entry, price-feed gap, or a brand-new token launched within minutes of the swap. The published headline understates true volume and margin proportionally to the unpriced share, so a 95 % priced ratio means the headline is about 5 % low."
  - q: "Why is the freshness threshold 5 minutes?"
    a: "The harness polls Relay's public API every 60 seconds. expected_freshness_seconds is set to 5 minutes which is 5x the poll cadence, so one missed cycle is tolerated and roughly two missed cycles fire the cron alerter. Setting it tighter (e.g. 90 s) would cause spurious alerts on transient API hiccups; setting it looser (e.g. 30 min) would let a multi-cycle outage go unnoticed. 5 min is the standard balance for a 1-min-cadence harness in this repo."
  - q: "Could solver rebates make the real number much lower than the headline?"
    a: "Yes. If Relay rebates half of every basis point of margin back to the solver that filled the swap, the Relay-only revenue is half the headline. Public disclosures from comparable protocols (e.g. CowSwap, 1inch Fusion) suggest solver-share fractions in the 30 % to 70 % range depending on intent design. The bench does not pick a number for Relay because that would be a guess. Readers building a P&L model should apply their own solver-share assumption to the headline. The headline itself is the ceiling, the floor is open."
  - q: "Why is this bench in the Bridges category?"
    a: "Relay.link is a cross-chain swap routing protocol, the closest fit in the OpenChainBench category list is Bridges. Other benches in this category measure bridge fees, bridge quote latency and bridge-monitor finality. A Trading or Aggregators classification would also be defensible since Relay is structurally closer to an intent-settlement layer than a classic bridge, but Bridges is the most discoverable bucket for the readers most likely to want this number."

source: https://github.com/ChainBench/OpenChainBench/blob/main/benchmarks/bridge-revenue.yml
# The Relay harness lives in the private mobula-api/miniapps tree for
# now; this spec self-links until the harness is ported to the public
# OCB repo. Additional bridges (across-revenue, socket-revenue) will
# land as sibling harnesses and feed their own provider entries into
# this same bench spec.

prometheus:
  window: 24h
  expected_freshness_seconds: 300

# Real metrics emitted by the Relay.link revenue harness:
#   relay_revenue_usd{window}            gauge   (window: 24h | 7d | 30d)
#   relay_volume_usd{window}             gauge   (window: 24h | 7d | 30d)
#   relay_swap_count{window}             gauge   (window: 24h | 7d | 30d)
#   relay_take_rate_bps                  gauge   (24h window only, derived margin / volume * 10000)
#   relay_swaps_priced_total             counter
#   relay_swaps_unpriced_total           counter
#   relay_last_poll_timestamp_seconds    gauge
#
# Mapping to leaderboard columns:
#   p50 = relay_revenue_usd{window="24h"}            (latest 24h window)
#   p90 = relay_revenue_usd{window="7d"}             (rolling 7d window)
#   p99 = relay_revenue_usd{window="30d"}            (rolling 30d window)
#   mean = relay_revenue_usd{window="7d"} / 7         (daily avg over 7d)
#   series = relay_revenue_usd{window="24h"}          (chart, evolves over time)
#   sample_size = relay_swap_count{window="24h"}
#   success = priced / (priced + unpriced)            (data-quality ratio)
#
# Note: the p50 / p90 / p99 slots here are repurposed for the 24h / 7d / 30d
# windows because a revenue gauge has no native percentile interpretation.
# This is called out in the methodology and the FAQ.

providers:
  - slug: relay
    name: Relay
    tag: Cross-chain swap routing protocol
    formula: "Default headline = ceiling: sum over 24h of (input USD − output USD − gas USD − app fees) per successful swap. Toggle Floor for the on-chain solver-wallet stablecoin delta."
    type: relay
    secondary:
      label: Take rate (24h, bps)
      value: "see relay_take_rate_bps"
    queries:
      p50: relay_revenue_usd{window="24h"}
      p90: relay_revenue_usd{window="7d"}
      p99: relay_revenue_usd{window="30d"}
      mean: relay_revenue_usd{window="7d"} / 7
      success: sum(increase(relay_swaps_priced_total[24h])) / (sum(increase(relay_swaps_priced_total[24h])) + sum(increase(relay_swaps_unpriced_total[24h])))
      sample_size: relay_swap_count{window="24h"}
      series: relay_revenue_usd{window="24h"}

# Two switchable metric panels above the chart so readers can flip between
# the public-API ceiling (the default headline) and the on-chain solver-
# wallet floor. The actual revenue Relay retains lives between the two.
metric_panels:
  - id: ceiling
    label: Ceiling (implied margin, 24h)
    metric: relay_revenue_usd{window="24h"}
    label_key: provider
    unit: usd
    higher_is_better: true
    description: "Upper bound from the public Relay swap API. Sum over 24h of input minus output minus gas minus disclosed app fees. Includes solver and integrator share."
  - id: floor
    label: Floor (solver stablecoin delta, 24h)
    metric: relay_solver_balance_delta_usd{kind="stables",window="24h"}
    label_key: provider
    unit: usd
    higher_is_better: true
    description: "Lower bound from the Relay solver EOA stablecoin balance change over 24h, sampled from Mobula's wallet portfolio every 5 min. What the system actually retained before any sweep to ops."
