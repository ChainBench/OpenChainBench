# OpenChainBench. Bench № 146

slug: canto-rpc
number: "146"
title: "Canto RPC endpoints: free public URLs by latency"
seo_title: "Canto RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Canto RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). {{count}} no-key endpoints measured, updated every 60s from 3 regions."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against the free, no-key public Canto RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Canto is a permissionless EVM L1 (chain 7700) built around free public infrastructure; its DEX, lending market, and stablecoin are protocol primitives rather than third-party dApps. The official endpoint (`canto.gravitychain.io`) is maintained by Plex and is the only keyless endpoint sustaining continuous probing from all three regions.

abstract: |
  Canto: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:canto-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against the no-key public Canto endpoint (Canto Official, canto.gravitychain.io), every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Canto-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Canto-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"canto\"`. Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. dRPC requires an API key; Ankr and PublicNode dropped free Canto support."

faq:
  - q: "Which Canto RPCs work without an API key?"
    a: "The Canto Official endpoint (`canto.gravitychain.io`, operated by Plex) is the only keyless endpoint sustaining probes from all 3 regions. dRPC requires an API key; Ankr and PublicNode have dropped free Canto support."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="canto"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: canto-official
    name: Canto Official
    endpoint: https://canto.gravitychain.io/
    tag: Plex-operated public RPC for Canto mainnet
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Canto Official's no-key Canto endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="canto-official", chain="canto"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="canto-official", chain="canto"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="canto-official", chain="canto"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="canto-official", chain="canto"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="canto-official", chain="canto"}) / sum(ocb:rpc_call:rate_24h{provider="canto-official", chain="canto"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="canto-official", chain="canto"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="canto-official", chain="canto"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="canto-official", chain="canto", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="canto-official", chain="canto", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="canto-official", chain="canto", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="canto-official", chain="canto", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="canto-official", chain="canto", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="canto-official", chain="canto", region="sgp"}[1h])
