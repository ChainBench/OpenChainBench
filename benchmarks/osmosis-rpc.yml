      success: sum(ocb:rpc_call:ok_rate_24h{provider="polkachu", chain="osmosis"}) / sum(ocb:rpc_call:rate_24h{provider="polkachu", chain="osmosis"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="polkachu", chain="osmosis"})
