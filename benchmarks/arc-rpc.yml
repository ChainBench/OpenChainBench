      success: sum(ocb:rpc_call:ok_rate_24h{provider="alchemy",chain="arc",tier="keyed",region!="sgp"}) / sum(ocb:rpc_call:rate_24h{provider="alchemy",chain="arc",tier="keyed",region!="sgp"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="alchemy",chain="arc",tier="keyed",region!="sgp"})
