# OpenChainBench. Bench № 270

slug: arc-rpc
number: "270"
title: "Arc RPC endpoints: free public URLs and private API-key providers by latency"
seo_title: "Arc RPC endpoints: public and private, ranked by latency"
seo_description: "{{best_name}} leads free Arc RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h); {{best_name:tier:keyed}} leads the private (API-key) cohort at {{best_p50:tier:keyed}}. URLs for all {{count}} no-key endpoints."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Arc RPC endpoint (probed every 60 seconds) and, under the Endpoints selector (Private), against the API-key endpoints of Alchemy, Chainstack and QuickNode (every 120 seconds), from 3 regions. The two cohorts are ranked separately, never against each other.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Arc is the EVM Layer 1 built by Circle with USDC as the native gas token,
  on mainnet since 2026-09-16 (chain ID 5042, about 0.5 s blocks). Provider
  support is new and uneven, which is exactly when an independent latency
  measurement is most useful. This page measures both sides with one probe,
  `eth_getBlockByNumber` with a rotating request id, every 60 seconds on the
  {{count}} free endpoints (the Circle-operated rpc.mainnet.arc.io, dRPC,
  PublicNode, Tenderly Gateway) and every 120 seconds on the keyed endpoints
  of Alchemy, Chainstack and QuickNode, from us-east, eu-west and Singapore;
  the Endpoints selector switches between the two cohorts, which are never
  ranked against each other.

abstract: |
  Arc: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the Circle-operated endpoint measures {{p50:arc-official}}. The same page carries the private cohort (API key), Alchemy, Chainstack and QuickNode on their keyed Arc endpoints every 120 seconds: switch the Endpoints selector; {{best_name:tier:keyed}} leads it at {{best_p50:tier:keyed}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Arc endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore, and against the keyed endpoints of Alchemy, Chainstack and QuickNode every 120 seconds. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained, honest availability rather than a fast error message. Arc produces blocks in well under a second; the stale check tolerates 40 blocks (20 s) on the public cohort and 20 on the keyed one.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the latest-header fetch with a rotating id defeats edge caches that answer eth_blockNumber without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Arc-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=\"arc\" (chain id 5042). Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. Exclusions follow the cluster-wide rules documented on the parent benchmark."
  - "Private cohort (Endpoints selector, Private): Alchemy, Chainstack and QuickNode probed on their keyed Arc endpoints every 120 seconds from the same 3 regions, same call (eth_getBlockByNumber, rotating id), same ok / http_err / jsonrpc_err / stale / timeout classification."
  - "Keys live in the probe environment, never in the repo. Plan tiers, disclosed: Chainstack: a Global Node on the Growth plan, sponsored by Chainstack; QuickNode: an endpoint on the Mobula enterprise-tier account, shared fleet; Alchemy: a Free plan key (30M CU per month, 25 requests per second) normal signup, the tier any reader gets; Alchemy states free and paid keys share one routing. GetBlock is listed under exclusions until a key exists."
  - "Two cohorts, two rankings: the public endpoints are shared, rate-limited gateways probed every 60 seconds; the keyed endpoints are metered or dedicated and probed every 120 seconds. The selector switches the whole page (ranking, chart, region tabs, badges, citation) between them. No figure on this page compares a public endpoint with a keyed one."
  - "Arc produces blocks in well under a second (Malachite BFT, sub-second finality). The stale check tolerates 40 blocks behind the cross-provider tip (20 s of wall clock) on the public cohort and 20 blocks on the keyed one."

excluded_providers:
  - { name: Ankr, reason: "returns 403 without an API key on Arc" }
  - { name: Blockdaemon, reason: "requires an API key" }
  - { name: Lava, reason: "Arc endpoint discontinued" }
  - { name: GetBlock, reason: "requires an API key; no key held yet, so it is not in the private cohort either" }

faq:
  - q: "Which Arc RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today; each is listed with its URL, 24h median and success rate in the endpoints table on this page, and the list changes as providers come and go. Every (provider, chain) pair was live-verified no-key before inclusion; anything that key-gates, region-blocks or rate-limits below the 60-second cadence is excluded rather than listed with an asterisk."
  - q: "Which Arc RPC provider is fastest with an API key?"
    a: "Per the live data: {{best_name:tier:keyed}} at {{best_p50:tier:keyed}} (eth_getBlockByNumber p50 over 24h, averaged across us-east, eu-west and Singapore); Alchemy measures {{p50:alchemy}}, Chainstack {{p50:chainstack}} and QuickNode {{p50:quicknode}}. Switch the Endpoints selector to Private for the region tabs and the p99 column; the ranking is origin-dependent and the plan tier of every key is disclosed in the methodology."
  - q: "Is a keyed Arc RPC faster than a free public one?"
    a: "Compare the two leaders, measured on the same call from the same three regions: the free cohort's is {{best_name}} at {{best_p50}} (p50, 24h); the private cohort's is {{best_name:tier:keyed}} at {{best_p50:tier:keyed}}. They are never ranked in one table because the public probe runs every 60 seconds against shared gateways and the keyed probe every 120 seconds against metered endpoints; the median tells you whether the key buys latency on Arc, the success rate whether it buys reliability."
  - q: "What is Arc?"
    a: "Arc (chain ID 5042) is Circle's EVM Layer 1 for stablecoin finance: USDC is the gas token, consensus is Malachite BFT with sub-second deterministic finality, and the validator set is permissioned (BlackRock, DTCC, Visa, Mastercard and ICE among the founding validators). Mainnet opened on 2026-09-16; it supports standard EVM tooling and eth_ JSON-RPC methods."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on region alone; the tier
# partition drops the other cohort's samples.
rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="arc"})

# Region and access tier: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }
  # Access tier: partitions the provider list (no PromQL label). The
  # first value is the headline cohort; ?tier=keyed reaches the other.
  tier:
    - { value: public, label: "Public, no key" }
    - { value: keyed,  label: "Private, API key" }

providers:
  - slug: arc-official
    name: Arc
    endpoint: https://rpc.mainnet.arc.io
    tag: Circle-operated mainnet RPC (rpc.mainnet.arc.io)
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Arc's no-key Arc endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="arc-official", chain="arc"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="arc-official", chain="arc"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="arc-official", chain="arc"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="arc-official", chain="arc"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="arc-official", chain="arc"}) / sum(ocb:rpc_call:rate_24h{provider="arc-official", chain="arc"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="arc-official", chain="arc"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="arc-official", chain="arc"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="arc-official", chain="arc", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="arc-official", chain="arc", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="arc-official", chain="arc", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="arc-official", chain="arc", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="arc-official", chain="arc", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="arc-official", chain="arc", region="sgp"}[1h])

