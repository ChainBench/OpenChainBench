# OpenChainBench. Bench № 100

slug: opbnb-rpc
number: "100"
title: Fastest free opBNB RPC, live no-key EVM endpoint latency
seo_title: "Fastest free opBNB RPC 2026"
seo_description: "{{best_name}} leads free opBNB RPC at {{best_p50}} (`eth_getBlockByNumber(\"latest\", false)` p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for the `eth_getBlockByNumber(\"latest\", false)` method against every free, no-key public opBNB EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  opBNB is the OP Stack rollup (chain 204) operated by the BNB Chain team, with BNB gas and settlement onto BNB Chain (not Ethereum). Standard EVM JSON-RPC. Excluded by the launch audit: NodeReal (`opbnb-mainnet.nodereal.io` requires API key), BlockPI (`unknown host`), Grove/Pocket public LB (needs app id), Tatum (404). Every provider live-verified with 4 consecutive keyless probes at launch.

abstract: |
  opBNB: {{count}} free public RPC endpoints answering `the chain's head call` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:opbnb-official}}.
  We measure the round-trip latency of a single, identical JSON-RPC call (`eth_getBlockByNumber(\"latest\", false)`) against every no-key public opBNB endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a opBNB-scaled staleness gap (25 blocks at opBNB's ~1 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the opBNB-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\", false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the rotating id defeats edge caches that would answer a bare head query without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the opBNB-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"opbnb\"`. Provider coverage at launch: {{count}} no-key endpoints (BNB Chain Team, PublicNode, dRPC)."

faq:
  - q: "What is the fastest free opBNB RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber(\"latest\", false)` p50 over the last 24h), measured against {{count}} no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples, so the answer on this page is the answer right now, not a quarterly snapshot. Use the region tabs to see the leader from the origin closest to your deployment."
  - q: "Which opBNB RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today: BNB Chain Team, PublicNode, dRPC. Every listed endpoint was live-verified with a `eth_getBlockByNumber(\"latest\", false)` POST returning a parsable response before inclusion. See the methodology section for the specific endpoints that were audited and excluded."
  - q: "How is opBNB RPC latency measured here, technically?"
    a: "One identical `eth_getBlockByNumber(\"latest\", false)` POST every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="opbnb"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: opbnb-official
    name: BNB Chain Team
    endpoint: https://opbnb-mainnet-rpc.bnbchain.org
    tag: BNB Chain team's official public opBNB RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to BNB Chain Team's no-key opbnb RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="opbnb-official", chain="opbnb"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="opbnb-official", chain="opbnb"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="opbnb-official", chain="opbnb"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="opbnb-official", chain="opbnb"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="opbnb-official", chain="opbnb"}) / sum(ocb:rpc_call:rate_24h{provider="opbnb-official", chain="opbnb"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="opbnb-official", chain="opbnb"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="opbnb-official", chain="opbnb"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="opbnb-official", chain="opbnb", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="opbnb-official", chain="opbnb", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="opbnb-official", chain="opbnb", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="opbnb-official", chain="opbnb", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="opbnb-official", chain="opbnb", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="opbnb-official", chain="opbnb", region="sgp"}[1h])

  - slug: publicnode
    name: PublicNode
    endpoint: https://opbnb-rpc.publicnode.com
    tag: Allnodes-operated, 70+ chains, includes opBNB
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key opbnb RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="opbnb"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="opbnb"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="opbnb"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="opbnb"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="opbnb"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="opbnb"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="opbnb"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="opbnb"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="opbnb", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="opbnb", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="opbnb", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="opbnb", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="opbnb", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="opbnb", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    endpoint: https://opbnb.drpc.org
    tag: Multi-provider RPC load balancer, edge-close routing
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to dRPC's no-key opbnb RPC endpoint."
    queries:
