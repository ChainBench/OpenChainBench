# OpenChainBench. Bench № 026

slug: validator-yield
number: "026"
title: Validator Net Yield Comparison
seo_title: "Validator net yield 2026: Solana vs Hyperliquid live APR × uptime leaderboard"
seo_description: "Live cross-chain validator yield benchmark. Median net yield (APR × uptime) in bps across Solana (top 200 by stake, Stakewiz total_apy, MEV folded in) and Hyperliquid (all active, predictedApr.day). Plus per-validator gross APR, commission, uptime, MEV share, stake, jailed status."
subtitle: Median validator net yield (APR × uptime) in basis points, compared across chains. Solana top 200 by stake, all active Hyperliquid validators.
category: Blockchains
status: live
metric: Net yield
unit: bps
higher_is_better: true

disclaimer: |
  Honest scope. (1) `net_yield = gross_apr × uptime`. NOT "yield net of MEV", Stakewiz `total_apy` already folds Jito MEV into gross, MEV is INCLUDED. `mev_share_bps` exists for transparency, not subtraction. (2) Solana median is dragged by ~42 vals at 0% APY (commission 100% or zero leader slots). (3) Hyperliquid: centralised sequencer, no separate MEV layer, ~30 vals only. (4) Ethereum deferred v2, requires beacon-node or MEV-Boost relay scraping.

seo_intro: |
  This benchmark answers the question every staker asks when
  choosing a chain or a validator. what is the live net yield I
  would actually earn today, after commission, after downtime,
  including MEV where the chain has it. Marketing pages quote
  "up to 7% APY" without specifying validator, uptime
  assumption, or whether MEV tips are folded in. This page
  measures the reality on-chain across two yield surfaces with
  fundamentally different economics: Solana's competitive,
  ~3000-validator, MEV-heavy stake market (top 200 tracked by
  activated stake) and Hyperliquid's permissioned, ~30-validator,
  no-MEV centralised-sequencer model. The headline number per
  chain is the median net yield in basis points, where 1% APY =
  100 bps. Per-validator gauges expose gross APR, commission,
  uptime, MEV share and dollar stake so the reader can drill from
  "Solana median 5.6%" down to "Helius at 6.0%, Figment at 5.4%,
  these 42 validators at 0% because their commission is set to
  100% or they have no leader slots this epoch."

abstract: |
  We compare validator net yield across chains by polling each
  chain's canonical yield source every 5 minutes and computing
  `net_yield_bps = gross_apr_bps × uptime_fraction`. For Solana,
  the source is the Stakewiz validators API
  (`api.stakewiz.com/validators`), which exposes `total_apy` that
  already aggregates staking inflation rewards + Jito MEV tips
  into a single APR; Jito Kobe (`kobe.mainnet.jito.network`)
  enriches each validator with the MEV-share split for the
  transparency gauge. For Hyperliquid, the source is
  `/info validatorSummaries` whose `predictedApr.day` is staking
  yield only (no MEV layer exists, Hyperliquid's centralised
  sequencer captures order flow value upstream). Solana is capped
  to the top 200 validators by activated stake to keep Prometheus
  cardinality bounded (the full set is ~3000); Hyperliquid
  exposes all ~30 active. The per-chain leaderboard number is
  `ocb_chain_median_net_yield_bps{chain}`, the median across the
  per-validator gauges. p90 / p99 over a 24h window via
  `quantile_over_time` surface the right-tail validators (best
  net yield among those tracked). Caveats. (a) Solana's median is
  dragged below the modal value by ~42 validators currently
  emitting 0 APY, commission set to 100% or no leader slots this
  epoch, both legitimate states that still count as "stakeable
  but currently unproductive". (b) Stakewiz `total_apy` is itself
  a 30-epoch trailing estimate, not a forward guarantee. (c)
  Hyperliquid jails ~4 validators at any given time (consensus
  fault), and those land in the dataset with `jailed=1` and
  `predictedApr=0`. We surface them rather than filtering so the
  honest count of active validators stays visible.

methodology:
  - "Sources. Solana primary: `GET api.stakewiz.com/validators` (free, no key). `total_apy` already includes inflation + Jito MEV tips. Solana enrichment: `GET kobe.mainnet.jito.network/api/v1/validators` for MEV-share split. Hyperliquid: `POST api.hyperliquid.xyz/info {type:validatorSummaries}`, field `predictedApr.day` × `uptimeFraction`. Prices: CoinGecko (SOL/USD), HL `metaAndAssetCtxs` (HYPE/USD)."
  - "Cadence. 5-minute scrape interval per chain. Validator-level metrics (APR, commission, uptime, stake) move on epoch boundaries (~2 days on Solana, ~30 seconds on Hyperliquid), so sub-minute polling would add Prom cardinality cost without information."
  - "Net yield formula. `net_yield_bps = gross_apr_bps × uptime_fraction`. Slashing is treated as negligible in v1, Solana has never slashed in production, and Hyperliquid's jailed-validator state is surfaced as `ocb_validator_jailed{chain, validator}=1` separately rather than amortised into the APR. Both chains report APR (simple yield), not APY (compounded); the bench reports APR-as-bps to match what the upstream APIs publish, no compounding adjustment applied."
  - "Cap. Solana exposes ~3000 active validators across the full set; the bench caps to the top 200 by `activated_stake` (USD-weighted) to keep Prom cardinality at ~230 series total across the two chains. The top 200 represent ~90% of staked SOL by value, so the median is representative of where real stake sits, not of the long tail of <1k SOL validators. Hyperliquid exposes ~30 active validators total, all are tracked."
  - "Median (chain-level headline). `ocb_chain_median_net_yield_bps{chain}` is computed harness-side over the per-validator gauges every scrape, not derived from Prom. This includes the ~42 Solana validators currently at 0% APY (commission 100% or no leader slots), which materially pulls the Solana median down vs the modal active-validator yield. A reader who wants 'yield I would get if I picked a sane validator' should look at p75 or higher on the Solana distribution, not the chain median."
  - "MEV treatment. Solana: MEV tips from Jito are already folded into Stakewiz `total_apy`. `ocb_validator_mev_share_bps` is exposed for transparency (a reader sees 'Helius APR 600 bps of which 80 bps MEV') but NOT subtracted to produce a 'staking-only' figure. Hyperliquid: no separate MEV layer (centralised sequencer captures order-flow value at the protocol level), so the MEV gauge is 0 by convention."
  - "Jailed / inactive handling. Hyperliquid: `jailed=1` validators (currently 4) land in the dataset with `predictedApr=0`, so `net_yield_bps=0`. Solana: ~42 validators report `total_apy=0`. Live data shows two causes: commission 100% (operator routes everything to themselves, delegators get 0) or zero leader slots this epoch (no block-production rewards). Both legitimate transient states, both count toward total + median."
  - "Excluded by design. Ethereum validator yield (deferred v2, beacon-node ~1 TB or MEV-Boost relay scraping required, neither is a 5-min poll). Lido / Rocket Pool / Coinbase staked-ETH are products with own fee structures, not validator yields (separate bench `liquid-staking-yield`, future). Cosmos, Polkadot, Avalanche out of scope v1, chain-specific sources would dilute focus."

findings:
  - "{{best_name}} currently leads at {{best_p50}} (median net yield, 24 h) across {{count}} measured chains. The cross-chain gap is structural: Solana's ~5.6% median reflects PoS inflation + Jito MEV tips minus average ~24% validator commission, while Hyperliquid's ~2.2% reflects staking-only rewards on a deflationary HYPE token with no MEV layer to top it up."
  - "{{name:solana}} median sits at {{p50:solana}} (24 h) across the top 200 validators by stake. The headline is dragged down by ~42 validators currently emitting 0% APY, commission set to 100% or no leader slots in the current epoch. The modal active Solana validator is closer to ~6.0%; reading the chain median requires understanding that ~21% of the tracked set is structurally non-yielding right now."
  - "{{name:hyperliquid}} returns {{p50:hyperliquid}} (median, 24 h) across all 31 active validators. 4 are currently jailed (consensus fault, `jailed=1`, `predictedApr=0`) which pulls the median; the active-set median is closer to 2.25% (top operators at ~225 bps cluster very tightly because Hyperliquid's reward model distributes evenly across non-jailed validators)."
  - "Top Solana validators by stake: Figment ($1.36B), Helius ($1.29B), Binance Staking ($1.16B), Jupiter ($1.10B), Ledger by Figment ($794M). These are the institutional and exchange validators where delegated stake concentrates; their individual net yields cluster around the chain modal, not the median."
  - "Top Hyperliquid validators by stake: the four Hyper Foundation validators (1-4) collectively control >$12.8B in staked HYPE, with Anchorage by Figment ($1.43B) and Nansen × HypurrCollective ($1.38B) the largest non-foundation operators. The foundation concentration is much higher than on Solana, a structural difference between a permissioned ~30-validator set and a permissionless ~3000-validator one."
  - "Ethereum is deferred to v2. Honest validator-level APR requires beacon-node integration (storage cost) or per-relay MEV-Boost scraping (which only covers the proposer fraction of yield). Until the v2 ingestion lands, this bench compares Solana vs Hyperliquid only, two chains chosen because each exposes a clean, free, no-key public API for the full validator set."

faq:
  - q: "What is validator net yield?"
    a: "Net yield is the actual APR a staker earns on a given validator, computed as `gross_apr × uptime_fraction`. Gross APR is what the chain's reward formula would pay if the validator never missed a slot; uptime is the fraction of slots the validator actually voted/produced in the measurement window. For Solana the bench uses Stakewiz's `total_apy` for gross (which already includes Jito MEV tips), multiplied by the validator's reported uptime. For Hyperliquid it uses `predictedApr.day` × `stats[day].uptimeFraction` from `/info validatorSummaries`. The unit is basis points (1% = 100 bps) to stay consistent with the rest of OpenChainBench."
  - q: "Why does Solana's median look lower than the typical 6-7% I see quoted elsewhere?"
    a: "Two reasons. (1) ~42 of the top 200 tracked Solana validators are currently emitting 0% APY, some have commission set to 100% (operator takes everything, delegator gets 0), others have zero leader slots in the current epoch (no block-production rewards earned during the measurement window). These are legitimate, transient states that count toward the chain's median by definition. (2) Average validator commission on the tracked set is ~24%, which already eats into the headline 'staking APY' number quoted by chain marketing. If you want 'yield I'd get if I picked a sane validator', look at the per-validator gauges or wait for the leaderboard to expose p75+, those numbers cluster around 5.9-6.0% net."
  - q: "Why is Hyperliquid lower than Solana?"
    a: "Yes, the direction is what it looks like: Solana ~5.6% > Hyperliquid ~2.2%. Three reasons. (1) Hyperliquid pays staking rewards in HYPE only, there is no inflation analogue to Solana's ~5% protocol issuance. (2) No MEV layer exists at the validator level (the centralised sequencer captures order-flow value at protocol level, not validator level), so there's no MEV-tip surcharge to add. (3) The reward pool is split across ~30 validators evenly when active, so per-validator APR is structurally flat, top operators all sit at ~225 bps with very tight spread. A staker chooses a Hyperliquid validator on uptime / jail risk / governance alignment, not on yield differentiation."
  - q: "How is MEV treated in this benchmark?"
    a: "MEV is INCLUDED in the gross APR figure, not subtracted from it. For Solana, Stakewiz's `total_apy` already folds Jito MEV tips into the headline APR by design, this bench inherits that aggregation rather than re-computing. The `ocb_validator_mev_share_bps` gauge is exposed separately for transparency (so you can see e.g. 'Helius's 600 bps APR is 80 bps MEV + 520 bps staking') but it does NOT get subtracted to produce a 'staking-only' number. For Hyperliquid, no separate MEV layer exists at validator level (the centralised sequencer captures value upstream), so the MEV gauge is reported as 0 by convention. This is the same `net_yield` definition every staking dashboard uses, Stakewiz, Solana Beach, Hyperliquid Stats, etc."
  - q: "Why are some Solana validators at 0% APY?"
    a: "Two legitimate causes, both visible in the live data. (1) Commission set to 100%: the validator operator has configured their vote account to route 100% of staking rewards to themselves, so delegators receive 0%. This is common for operators running their own treasury stake (Binance, exchange custody, etc.) where 'delegators' is a fiction, there's only the operator's own SOL. (2) Zero leader slots in the current epoch: Solana's leader schedule is stake-weighted but randomised per epoch, so a small validator can statistically draw zero slots in a given ~2-day epoch and earn zero block-production rewards. Both states are transient: commission can be lowered, leader slots cycle every epoch. The bench surfaces them as 0 rather than filtering because they ARE part of the live validator set."
  - q: "Why is Ethereum missing from this benchmark?"
    a: "Ethereum is deferred to v2. Honest validator-level APR on Ethereum requires either (a) running a beacon-node connection (~1 TB disk, ongoing sync cost) to read per-validator effective balance and attestation history, or (b) scraping every MEV-Boost relay's API for proposer-level payment data (Flashbots, BloXroute, Eden, Aestus, Manifold, etc., each with its own schema). Neither is a 5-minute HTTP poll like Stakewiz or Hyperliquid `/info`. The v1 scope was 'free no-key APIs that expose the full active validator set in one call'; Ethereum doesn't have that. v2 will add beacon-node ingestion or relay aggregation once the harness footprint can afford it."
  - q: "Where do Stakewiz and Jito Kobe data come from?"
    a: "Stakewiz (`api.stakewiz.com`) is a community-maintained Solana validator analytics service that ingests on-chain vote-account state, commission history, leader schedule and reward distribution, then publishes a clean `/validators` JSON with `total_apy` already computed as a 30-epoch trailing estimate. Jito Kobe (`kobe.mainnet.jito.network`) is Jito Labs' public API exposing per-validator MEV-tip earnings broken down by epoch. Both are free, key-less, and well-known in the Solana validator-ops community, this bench treats them as the canonical source for Solana validator APR the same way most Solana staking dashboards do (Solana Beach, Marinade UI, etc., all consume one or both)."
  - q: "Why cap Solana at the top 200 validators?"
    a: "Prometheus cardinality budget. The full Solana validator set is ~3000; tracking all of them across `net_yield`, `gross_yield`, `mev_share`, `commission`, `uptime`, `stake_usd`, `jailed` would land ~21k label combinations on the OCB Prom, vs ~1.6k for the top 200. The top 200 by activated stake represent ~90% of staked SOL by USD value, so the chain median is representative of where real delegated stake sits, not skewed by the long tail of <1k-SOL validators that have negligible delegate base. The cap is a knob, if Prom capacity grows, it lifts to 500 or 1000."

source: https://github.com/OpenChainBench/OpenChainBench/tree/main/harnesses/validator-yield

prometheus:
  window: 24h
  expected_freshness_seconds: 1800

# Real metrics emitted by the validator-yield harness:
#   ocb_validator_net_yield_bps{chain, validator, name}        gauge (APR × uptime, bps)
#   ocb_validator_gross_yield_bps{chain, validator, name}      gauge (APR before uptime adj)
#   ocb_validator_mev_share_bps{chain, validator, name}        gauge (MEV portion of gross, info only)
#   ocb_validator_commission_bps{chain, validator, name}       gauge (operator commission)
#   ocb_validator_uptime_pct{chain, validator, name}           gauge (0-100)
#   ocb_validator_stake_usd{chain, validator, name}            gauge (delegated stake, USD)
#   ocb_validator_jailed{chain, validator, name}               gauge (0|1, HL only in v1)
#   ocb_chain_median_net_yield_bps{chain}                      gauge (chain-level headline)
#   ocb_chain_total_validators{chain}                          gauge (tracked count)
#   ocb_validator_scrape_errors_total{chain, source}           counter
#   ocb_validator_last_scrape_timestamp_seconds{chain}         gauge
#
# Each "provider" below is one chain. The leaderboard ranks chains
# by median net yield (higher = better gross-of-fees yield). Top
# validators per chain are visible via the per-validator gauges
# (`ocb_validator_net_yield_bps{chain="solana"}` etc.) and surface
# in p90 / p99 on the 24h distribution.

providers:
  - slug: solana
    name: Solana
    tag: Top 200 by stake · Stakewiz APY (MEV in)
    formula: "Median net yield in bps across the top 200 Solana validators by stake, where net_yield = Stakewiz total_apy (MEV folded in) × uptime_fraction."
    queries:
      p50: ocb_chain_median_net_yield_bps{chain="solana"}
      p90: quantile(0.90, ocb_validator_net_yield_bps{chain="solana"})
      p99: quantile(0.99, ocb_validator_net_yield_bps{chain="solana"})
      mean: avg(ocb_validator_net_yield_bps{chain="solana"})
      success: clamp_max(avg_over_time(ocb_validator_uptime_pct{chain="solana"}[24h]) / 100, 1)
      sample_size: ocb_chain_total_validators{chain="solana"}
      series: ocb_chain_median_net_yield_bps{chain="solana"}

  - slug: hyperliquid
    name: Hyperliquid
    tag: All active · predictedApr.day × uptime
    formula: "Median net yield in bps across all ~30 active Hyperliquid validators, where net_yield = predictedApr.day × stats[day].uptimeFraction from /info validatorSummaries."
    queries:
      p50: ocb_chain_median_net_yield_bps{chain="hyperliquid"}
      p90: quantile(0.90, ocb_validator_net_yield_bps{chain="hyperliquid"})
      p99: quantile(0.99, ocb_validator_net_yield_bps{chain="hyperliquid"})
      mean: avg(ocb_validator_net_yield_bps{chain="hyperliquid"})
      success: clamp_max(avg_over_time(ocb_validator_uptime_pct{chain="hyperliquid"}[24h]) / 100, 1)
      sample_size: ocb_chain_total_validators{chain="hyperliquid"}
      series: ocb_chain_median_net_yield_bps{chain="hyperliquid"}

# Ethereum deferred to v2, requires beacon-node integration or
# per-relay MEV-Boost scraping for honest validator-level APR.
# The v1 scope was "free no-key public APIs exposing the full
# active validator set in one HTTP call"; Ethereum doesn't fit
# that constraint. When the v2 ingestion lands, Ethereum joins
# this bench as a third provider on the same `ocb_chain_median_net_yield_bps`
# metric without schema change.
