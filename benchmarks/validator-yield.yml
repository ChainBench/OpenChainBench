# OpenChainBench. Bench № 026

slug: validator-yield
number: "026"
title: Highest staking yield, live net APR by proof-of-stake chain
seo_title: "Highest staking yield 2026: {{best_name}} at {{best_p50}} APR"
seo_description: "{{best_name}} pays the highest staking yield today, {{best_p50}} median net APR. Live ranking of {{declared_count}} PoS chains incl. Solana, Ethereum, NEAR, ICP, Gram (TON), Aptos, Sui, Cardano, net of commission."
subtitle: Median net staking yield in basis points across {{count}} proof-of-stake chains, after validator commission and, where the chain exposes it, downtime. Each chain's figure comes from its own on-chain reward data, keyless, every 5 minutes.
category: Blockchains
status: live
metric: Net yield
unit: bps
higher_is_better: true
row_noun: { one: chain, many: chains }

disclaimer: |
  Nominal yield in the staked token, not real yield: a 19% APR on a token that inflates 12% a year is worth less than it looks, and price moves dominate both. MEV is included on Solana only and excluded on Ethereum. ICP is one neuron profile (2 year dissolve delay), Algorand one opt-in solo node, Ethereum one network average. Stellar and Somnia are not ranked, see the methodology.

provider_notes:
  solana: "MEV inc."
  ethereum: "MEV excl."
  hyperliquid: "no MEV"
  icp: "2y neuron"
  algorand: "own node"
  gram: "pool, fee netted"
  cronos: "Cronos POS"

excluded_providers:
  - { name: Stellar, reason: "no staking: SCP validators are unpaid and XLM inflation was removed in protocol 12 (2019), so there is no yield to measure" }
  - { name: Somnia, reason: "fee-only rewards paid by a protocol call that emits no event; no keyless on-chain way to isolate the inflow", since: "2026-11-03" }

seo_intro: |
  This benchmark answers the question every staker asks when choosing
  a chain: what yield would I actually keep today, after the
  validator's commission and, where the chain records it, after
  downtime. Marketing pages quote "up to X% APY" without saying which
  validator, which lockup or whether the figure is compounded. This
  page reads each chain's own reward data instead, for {{declared_count}}
  proof-of-stake chains: the measured reward paid per epoch on
  Cardano, the growth of each staking pool's exchange rate on Sui,
  each validator's on-chain potential reward on Avalanche, the live
  reward rate in the staking config on Aptos, the inflation and
  stake from the protocol config on NEAR, the per-block staker reward
  on Kaia, proposer payouts on Algorand, the daily voting reward pool
  on ICP, issuance over bonded stake on Cosmos Hub, Sei and Cronos,
  nominator pool returns on Gram (TON), Stakewiz on Solana, the
  validator summaries on Hyperliquid and the consensus spec formula
  on Ethereum. The headline per chain is the median across its
  tracked validators, in basis points of APR (1% = 100 bps), simple
  interest, no compounding.

abstract: |
  We compare staking yield across proof-of-stake chains by polling
  each chain's canonical reward data every 5 minutes, keyless, and
  publishing per-validator gauges plus a chain median. The common
  definition is the yield a delegator keeps: gross reward rate times
  (1 - validator commission), times uptime where the chain exposes
  it. Gross is either measured (Cardano epoch rewards paid over
  active stake, Sui pool exchange rate growth over 30 epochs,
  Avalanche potentialReward over each validator's staking period,
  Algorand proposer payouts, Gram nominator pool returns, Solana
  Stakewiz trailing APY, Hyperliquid predictedApr) or read from the
  protocol's own parameters (Aptos rewards_rate per 2 hour epoch,
  NEAR supply times max inflation over total stake, Kaia per-block
  staker reward over staked KAIA, Cosmos Hub, Sei and Cronos annual
  issuance times one minus the community tax over bonded tokens,
  ICP daily voting reward pool over deciding voting power, Ethereum
  consensus spec reward on the live effective balance). On x/mint
  chains the issuance is corrected for real block speed, because the
  module mints a fixed amount per block sized for a block time the
  chain no longer has: on Cosmos Hub, 5.7 second blocks against a
  7.2 second parameter raise real issuance from 10% to about 12.6% of
  supply, which is why the Hub reads well above the 15% that
  explorers quote. Cohorts: Solana top 200 by stake, Cosmos Hub top
  200 bonded, Avalanche top 100, Cardano top 50 pools, NEAR top 200
  staking pools, all active on Hyperliquid, Sui, Sei and Cronos,
  delegation pools on Aptos, council nodes with public delegation on
  Kaia, verified nominator pools on Gram, and one synthetic profile
  on Ethereum (32 ETH solo validator), Algorand (incentive-eligible
  node) and ICP (NNS neuron at the 2 year maximum dissolve delay, no
  age bonus). Stellar has no staking and is not ranked. Somnia pays
  stakers half of gas fees through a protocol call that emits no
  event, which leaves no keyless way to measure it, so it is not
  ranked either. Caveats: nominal APR in the staked token, not real
  yield after inflation; MEV inside Solana's figure only; fees inside
  the measured figures and outside the formula ones.

methodology:
  - "Definition. net_yield_bps = gross APR × (1 − commission) × uptime where the chain exposes uptime, in basis points (1% = 100 bps), simple APR. Gross is measured where the chain records realized rewards and read from protocol parameters where it does not. The chain headline is ocb_chain_median_net_yield_bps, the median over the tracked cohort, computed in the harness every scrape."
  - "Cadence and cohort hygiene. One scrape per chain every 5 minutes. A validator that leaves a cohort has its series deleted on the next scrape, so p90, p99 and the mean never read a departed validator. Prices come from one batched CoinGecko call for the USD stake column only; the yield never depends on a price."
  - "Solana. Stakewiz `api.stakewiz.com/validators`: total_apy, a 30 epoch trailing figure that already folds in Jito MEV tips and is net of commission, times uptime. Top 200 by activated stake. Commission is read in basis points (Stakewiz switched units when Solana moved commission to bps)."
  - "Hyperliquid. `POST api.hyperliquid.xyz/info {type: validatorSummaries}`: predictedApr.day times stats[day].uptimeFraction, all active validators, jailed ones at 0. No MEV layer at validator level."
  - "Ethereum. ultrasound.money live total effective balance into the consensus spec reward formula, APR = 64 × epochs per year / sqrt(total gwei): one network-average row for a 32 ETH solo validator. Execution tips and MEV excluded. Not a liquid staking APY."
  - "Cardano. Koios epoch_info: total rewards paid for the latest computed epoch × 73 epochs / active stake, the measured network return after reserve depletion, treasury cut, pledge influence and saturation. Per pool, net = gross × (1 − margin) for the top 50 registered pools by active stake; the 340 ADA fixed fee is not subtracted."
  - "Sui. Sui GraphQL (public JSON-RPC was retired): each validator's staking pool exchange rate (SUI per pool token) now versus 30 epochs ago, annualized over the elapsed time. Commission is paid inside the pool, so the figure is already the delegator's net."
  - "Avalanche. P-Chain platform.getCurrentValidators: gross = potentialReward / stake × year / staking period, the protocol reward for that validator's own duration and start supply. Net = gross × uptime × (1 − delegation fee). Top 100 by stake; validators with a 100% delegation fee count at 0 for delegators."
  - "Aptos. Fullnode REST: StakingRewardsConfig.rewards_rate (2.60% a year after the April 2026 cut) per 2 hour epoch. Cohort: active validators that are delegation pools. Net = gross × this epoch's successful / total proposals × (1 − operator commission)."
  - "NEAR. FastNEAR RPC: total supply × max inflation (2.5%) × (1 − treasury share) / total validator stake. Net = gross × the protocol online factor (0 under 90% online, full at 99%) × (1 − pool fee). Top 200 validators by stake that are staking pool contracts. Realized previous epoch checked at 5.47% gross against 5.52% formula on 2026-11-03."
  - "Kaia. Endpoint node RPC: kaia_getRewards per-block stakers share × blocks per year (measured over 10 000 blocks) / total staked KAIA from kaia_getStakingInfo. Cohort: council nodes with a public delegation contract, net = gross × (1 − its commissionRate)."
  - "Algorand. algod (Nodely): blocks per year × mean proposer payout of incentive-eligible blocks / online stake. One row: the yield of running your own participating node with 30k to 70M ALGO, opted in. No delegation, no commission; holding ALGO without a node earns nothing."
  - "ICP. ICP dashboard API (NNS governance metrics): 365.25 × daily voting reward pool × 3 / total deciding voting power. One row: a new neuron at the 2 year maximum dissolve delay (bonus 3), no age bonus, voting on everything. Shorter delays earn far less (2 weeks: about a third). Rewards accrue as maturity, subject to maturity modulation at disbursement."
  - "Gram (TON). TonAPI staking pools: the realized nominator APY of each verified, funded, non-liquid pool (TON Whales and Tonkeeper queues), already net of the pool fee, de-compounded to APR over the 131 072 second validation cycle. Liquid staking (Tonstakers) excluded like Lido on Ethereum."
  - "Cosmos Hub, Sei, Cronos. LCD REST: annual issuance × (1 − community tax) / bonded tokens, net = gross × (1 − commission), jailed at 0. Hub and Cronos issuance = annual_provisions × real blocks per year / the mint blocks_per_year parameter; Sei issuance = its token release schedule for the current year. Cronos here is the Cronos POS chain where CRO is staked."
  - "Not ranked. Stellar has no staking. Somnia rewards are half of gas fees, paid by a protocol call at each 5 minute epoch that emits no event, with eth_getLogs capped at 1000 blocks; the fee inflow cannot be isolated from stakes and claims keylessly. Third parties quote Somnia's own dashboard, between 0.06% and 0.25%."

findings:
  - "{{best_name}} leads at {{best_p50}} median net yield across {{count}} chains. The board spans an order of magnitude, from high-inflation chains paying stakers in new tokens to chains whose issuance has decayed or was cut by governance (Aptos in 2026, NEAR in 2025), so the ranking is a ranking of nominal yield in each chain's own token, not of real return."
  - "{{name:cosmos-hub}} reads {{p50:cosmos-hub}}, above the ~15% explorers quote, because its mint module sizes per-block issuance for 7.2 second blocks while the chain produces one every 5.7 seconds: real issuance runs near 12.6% of supply against a nominal 10%. The same correction is applied to Cronos, where blocks are close to the parameter."
  - "{{name:icp}} at {{p50:icp}} is the best case a new staker can pick, a neuron locked for the 2 year maximum. The same ICP at the 2 week minimum dissolve delay earns about a third of it, which makes ICP the board's clearest case of yield bought with lockup."
  - "{{name:solana}} sits at {{p50:solana}} across the top 200 validators, MEV included. The median carries validators at 0% (commission set to 100% or no leader slots this epoch), so a delegator choosing a healthy validator lands closer to the p90 of {{p90:solana}}."
  - "{{name:ethereum}} publishes {{p50:ethereum}} as one network-average consensus-layer APR for a 32 ETH solo validator. Execution tips and MEV are excluded, so a MEV-Boost proposer realizes more, and liquid staking products quote less after their fees."

faq:
  - q: "Which proof-of-stake chain has the highest staking yield right now?"
    a: "{{best_name}} leads at {{best_p50}} median net yield (basis points of APR, 100 bps = 1%) across {{count}} ranked chains, measured from on-chain reward data every 5 minutes. The ranking is nominal yield in each chain's own token: a high APR on a token with high issuance is partly dilution paid back to stakers, so compare it with the chain's inflation and with price risk before reading it as income."
  - q: "What is net staking yield on this page?"
    a: "The APR a delegator keeps: the chain's gross reward rate times (1 minus the validator's commission), times uptime where the chain records it (Solana, Hyperliquid, Avalanche, Aptos proposal success, NEAR online ratio). It is simple APR, not compounded APY, in basis points. Gross is measured where the chain records realized rewards (Cardano, Sui, Avalanche, Algorand, Gram, Solana, Hyperliquid) and read from protocol parameters elsewhere (Aptos, NEAR, Kaia, Cosmos Hub, Sei, Cronos, ICP, Ethereum)."
  - q: "Why is Cosmos Hub higher here than on explorers?"
    a: "Explorers compute inflation × (1 - community tax) / bonded ratio, about 15.5% today. The Hub's mint module pays annual_provisions / blocks_per_year per block, and blocks_per_year (4.36M, a 7.2 second block) no longer matches the chain's real 5.7 second blocks, so the Hub mints about 26% more per year than its nominal 10% inflation. We checked it against supply growth: 12.38 ATOM minted per block, exactly the per-block provision. The bench uses real blocks per year, which puts gross issuance yield near 19.6% and the median validator, after 5% commission, at {{p50:cosmos-hub}}."
  - q: "How is the ICP staking yield calculated?"
    a: "ICP holders stake into NNS neurons and earn voting rewards, not validator rewards. The NNS pays a daily pool across the deciding voting power of all eligible neurons, and a neuron's voting power is its stake times a dissolve delay bonus (up to 3 at the 2 year maximum since Mission 70) times an age bonus (up to 1.25). The page publishes one profile: a new neuron at the 2 year maximum, no age bonus, voting on everything, at {{p50:icp}}. Rewards accrue as maturity, and disbursing maturity applies the NNS maturity modulation (about plus or minus 5%)."
  - q: "Does Algorand pay staking rewards?"
    a: "Only to accounts that run their own participating node. Since consensus incentives (protocol v40, January 2025) each block pays its proposer a bonus plus half the block's fees, if the proposer opted in as incentive eligible (2 ALGO fee, 30k to 70M ALGO online). The page computes blocks per year × the average payout of eligible blocks / total online stake, {{p50:algorand}} today. There is no delegation and no commission, and ALGO sitting in a wallet earns nothing at protocol level."
  - q: "How is Gram (TON) staking yield measured?"
    a: "TON has no native delegation: holders stake through nominator pool contracts that fund an elected validator. The page takes TonAPI's realized nominator APY for the verified, funded, non-liquid pools (TON Whales and Tonkeeper queues), which is already net of the pool fee, and de-compounds it to APR over the 131 072 second validation cycle, {{p50:gram}} median. Stake is locked for a full cycle to be elected for half of it, so the per-capital figure is about half the elector's per-elected-stake rate. Liquid staking (Tonstakers) is excluded, as Lido is on Ethereum."
  - q: "Why are Stellar and Somnia not on the board?"
    a: "Stellar has no staking. Its consensus protocol does not pay validators and XLM inflation was removed in 2019, so there is no yield to rank. Somnia does pay stakers, half of all gas fees with no issuance, but the protocol deposits them through a call that emits no event at each 5 minute epoch, and its public RPC caps log queries at 1000 blocks. The inflow cannot be separated from stakes and claims without an indexer, and published estimates (0.06% to 0.25%) come from Somnia's own dashboard. We would rather show no row than a guessed one."
  - q: "What does the Ethereum number measure?"
    a: "The network-average consensus-layer APR for a 32 ETH solo validator, {{p50:ethereum}}, from the beacon spec reward formula on the live total effective balance published by ultrasound.money, at 100% participation (realized runs about 99.5%, under 2 bps of drift). It excludes execution tips and MEV, so a MEV-Boost proposer earns more, and it is not a liquid staking APY: Lido or Coinbase quote product rates net of their fees."
  - q: "Why is the Solana median lower than the 6 to 7% quoted elsewhere?"
    a: "The median counts every validator in the top 200 by stake, including those currently paying delegators 0%: commission set to 100% (operator stake only) or no leader slots in the epoch. Those are real states of the set, so they stay in. A delegator choosing a validator with sane commission and full uptime lands near the upper part of the distribution, {{p90:solana}} at p90. Stakewiz's total_apy already includes Jito MEV tips and is net of commission."
  - q: "Where does the data come from, and can I check it?"
    a: "Every source is public and keyless: Stakewiz and Jito Kobe (Solana), the Hyperliquid info API, ultrasound.money (Ethereum), Koios (Cardano), Sui GraphQL, the Avalanche P-Chain API, the Aptos Labs fullnode, FastNEAR (NEAR), the Kaia public endpoint node, Nodely algod (Algorand), the ICP dashboard API, TonAPI (Gram), and PublicNode or crypto.org LCDs (Cosmos Hub, Sei, Cronos). The harness source, with the reward rule and a dated verification for each chain, is open on GitHub, and the live figure per chain is at /api/stat/validator-yield."

per_chain_explainer:
  - slug: cosmos-hub
    h2: "Cosmos Hub (ATOM) staking APR"
    body: |
      Cosmos Hub median net staking yield is {{p50:cosmos-hub}} across the top 200 bonded validators. Gross = annual issuance × (1 - community tax) / bonded ATOM, read from the Hub's mint, distribution and staking modules. Issuance is annual_provisions corrected for real block speed: the mint module pays a fixed amount per block sized for 7.2 second blocks and the Hub produces one every 5.7 seconds, so real issuance runs above the nominal 10%. Net subtracts each validator's commission; jailed validators count at 0. Fees are excluded.
  - slug: gram
    h2: "Gram (TON) staking APR"
    body: |
      Gram (formerly TON) median net staking yield is {{p50:gram}} across the verified nominator pools. TON has no protocol delegation, so holders stake through pool contracts that fund an elected validator and pass back the elector's bonuses minus the pool fee. The figure is TonAPI's realized nominator APY, de-compounded to APR over the 131 072 second validation cycle. Liquid staking (Tonstakers) and the unverified single-nominator pools are excluded.
  - slug: icp
    h2: "Internet Computer (ICP) neuron staking APR"
    body: |
      An NNS neuron at the 2 year maximum dissolve delay with no age bonus earns {{p50:icp}}. The NNS distributes a daily voting reward pool across the deciding voting power of eligible neurons, and voting power is stake × dissolve delay bonus (up to 3) × age bonus (up to 1.25). The figure is 365.25 × the latest daily pool × 3 / total deciding voting power, from the NNS governance metrics. A 2 week neuron earns about a third of it. Rewards accrue as maturity.
  - slug: near
    h2: "NEAR staking APR"
    body: |
      NEAR median net staking yield is {{p50:near}} across the top 200 validators that are staking pools. Gross = total supply × max inflation (2.5% since the 2025 vote) × (1 - treasury share) / total validator stake, from the protocol config, the latest block and the validator set. Net applies the protocol's online factor (no reward under 90% online, full reward from 99%) and each pool's reward fee.
  - slug: solana
    h2: "Solana staking APY by validator"
    body: |
      Solana median net staking yield is {{p50:solana}} across the top 200 validators by activated stake, with Jito MEV tips included. The source is Stakewiz total_apy, a 30 epoch trailing figure already net of commission, multiplied by uptime. Validators with 100% commission or no leader slots this epoch count at 0, which pulls the median below what a delegator picking a healthy validator earns (p90 {{p90:solana}}).
  - slug: algorand
    h2: "Algorand staking rewards"
    body: |
      An incentive-eligible Algorand node earns {{p50:algorand}}. Since protocol v40 each block pays its proposer a protocol bonus plus half the fees, if the proposer opted in with 30k to 70M ALGO online. Proposer selection is stake-weighted over all online stake, so the expected yield is blocks per year × the average payout of eligible blocks / online stake. It is the yield of running a node yourself: there is no delegation, and the bonus decays by design.
  - slug: avalanche
    h2: "Avalanche (AVAX) staking APR"
    body: |
      Avalanche median net staking yield is {{p50:avalanche}} across the top 100 P-Chain validators by stake. Gross is read per validator: its potentialReward over its stake, annualized over its staking period, which is the protocol reward for that duration. Net = gross × uptime × (1 - delegation fee). Many of the largest validators set a 100% delegation fee and pay delegators nothing; they count at 0.
  - slug: kaia
    h2: "Kaia staking APR"
    body: |
      Kaia median net staking yield is {{p50:kaia}} across the council nodes that run a public delegation contract. Each block mints a fixed amount, and its stakers share is split across council nodes pro rata to staked KAIA. Gross = stakers reward per block × blocks per year / total staked KAIA, from kaia_getRewards and kaia_getStakingInfo. Net subtracts the public delegation contract's commission rate.
  - slug: sei
    h2: "Sei staking APR"
    body: |
      Sei median net staking yield is {{p50:sei}} across all bonded validators. Sei mints on a fixed token release schedule rather than an inflation rate, so gross = this year's scheduled release / bonded SEI, with no community tax. Net subtracts each validator's commission. Fees are excluded.
  - slug: cronos
    h2: "Cronos (CRO) staking APR"
    body: |
      Cronos POS median net staking yield is {{p50:cronos}} across all bonded validators. CRO is staked on the Cronos POS chain; the Cronos EVM chain has permissioned validators and no public staking. Gross = annual issuance × (1 - community tax of 15%) / bonded CRO, with issuance corrected for real block speed. Net subtracts each validator's commission.
  - slug: ethereum
    h2: "Ethereum solo staking APR"
    body: |
      A 32 ETH solo validator earns {{p50:ethereum}} at the consensus layer, the network average from the beacon spec reward formula on the live total effective balance. Execution tips and MEV are excluded. Consensus rewards are uniform per 32 ETH increment, so one network-average row stands for every validator.
  - slug: aptos
    h2: "Aptos staking APR"
    body: |
      Aptos median net staking yield is {{p50:aptos}} across active delegation pools. The staking config pays a fixed reward rate per 2 hour epoch, 2.60% a year since the April 2026 governance cut, scaled by each validator's share of successful proposals. Net subtracts the pool operator's commission. Private stake pools are not delegatable and are not in the cohort.
  - slug: hyperliquid
    h2: "Hyperliquid (HYPE) staking APR"
    body: |
      Hyperliquid median net staking yield is {{p50:hyperliquid}} across all active validators, from the info API's predictedApr times uptime. There is no validator MEV layer. Jailed validators stay in the set at 0, so the median sits slightly under what a non-jailed validator pays.
  - slug: cardano
    h2: "Cardano (ADA) staking rewards"
    body: |
      Cardano median net staking yield is {{p50:cardano}} across the top 50 pools by active stake. Gross is measured: the rewards actually paid for the latest computed epoch × 73 epochs a year / active stake, which already reflects reserve depletion, the treasury cut, pledge influence and saturation. Net subtracts each pool's margin; pools with a 100% margin pay delegators nothing.
  - slug: sui
    h2: "Sui staking APR"
    body: |
      Sui median net staking yield is {{p50:sui}} across active validators. Each staking pool's exchange rate (SUI per pool token) rises with rewards net of the validator's commission, so the figure is the rate now against 30 epochs ago, annualized over the elapsed time. Stake subsidies have decayed since launch, which is why Sui sits near the bottom of the board.

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/validator-yield

prometheus:
  window: 24h
  expected_freshness_seconds: 1800

# Real metrics emitted by the validator-yield harness:
#   ocb_validator_net_yield_bps{chain, validator, name}        gauge (what the delegator keeps, bps)
#   ocb_validator_gross_yield_bps{chain, validator, name}      gauge (before commission and uptime)
#   ocb_validator_mev_share_bps{chain, validator, name}        gauge (MEV portion of gross, Solana only)
#   ocb_validator_commission_bps{chain, validator, name}       gauge (not written for gram)
#   ocb_validator_uptime_pct{chain, validator, name}           gauge (0-100, 100 where not exposed)
#   ocb_validator_stake_usd{chain, validator, name}            gauge
#   ocb_validator_jailed{chain, validator, name}               gauge (0|1)
#   ocb_chain_median_net_yield_bps{chain}                      gauge (chain-level headline)
#   ocb_chain_total_validators{chain}                          gauge (tracked count, 1 for synthetic rows)
#   ocb_validator_scrape_errors_total{chain, source}           counter
#   ocb_validator_last_scrape_timestamp_seconds{chain}         gauge
#
# Each "provider" below is one chain. The reward rule, source and a
# dated verification for each chain live at the top of its scraper in
# harnesses/validator-yield/cmd/script/<chain>.go.

providers:
  - slug: solana
    name: Solana
    tag: Top 200 by stake · Stakewiz APY, MEV in
    formula: "Median across the top 200 Solana validators by stake of Stakewiz total_apy (Jito MEV folded in, net of commission) times uptime."
    queries:
      p50: ocb_chain_median_net_yield_bps{chain="solana"}
      p90: quantile(0.90, ocb_validator_net_yield_bps{chain="solana"})
      p99: quantile(0.99, ocb_validator_net_yield_bps{chain="solana"})
      mean: avg(ocb_validator_net_yield_bps{chain="solana"})
      success: clamp_max(avg(avg_over_time(ocb_validator_uptime_pct{chain="solana"}[24h])) / 100, 1)
      sample_size: ocb_chain_total_validators{chain="solana"}
      series: ocb_chain_median_net_yield_bps{chain="solana"}

  - slug: hyperliquid
    name: Hyperliquid
    tag: All active · predictedApr × uptime
    formula: "Median across all active Hyperliquid validators of predictedApr.day times stats[day].uptimeFraction from /info validatorSummaries; jailed validators at 0."
    queries:
      p50: ocb_chain_median_net_yield_bps{chain="hyperliquid"}
      p90: quantile(0.90, ocb_validator_net_yield_bps{chain="hyperliquid"})
      p99: quantile(0.99, ocb_validator_net_yield_bps{chain="hyperliquid"})
      mean: avg(ocb_validator_net_yield_bps{chain="hyperliquid"})
      success: clamp_max(avg(avg_over_time(ocb_validator_uptime_pct{chain="hyperliquid"}[24h])) / 100, 1)
      sample_size: ocb_chain_total_validators{chain="hyperliquid"}
      series: ocb_chain_median_net_yield_bps{chain="hyperliquid"}

  - slug: ethereum
    name: Ethereum
    tag: Network avg · consensus spec APR, MEV excluded
    formula: "Consensus-layer APR for a 32 ETH solo validator: 64 × epochs per year / sqrt(total effective balance in gwei), live total stake from ultrasound.money. Tips and MEV excluded."
    queries:
      p50: ocb_chain_median_net_yield_bps{chain="ethereum"}
      p90: quantile(0.90, ocb_validator_net_yield_bps{chain="ethereum"})
      p99: quantile(0.99, ocb_validator_net_yield_bps{chain="ethereum"})
      mean: avg(ocb_validator_net_yield_bps{chain="ethereum"})
      success: clamp_max(avg(avg_over_time(ocb_validator_uptime_pct{chain="ethereum"}[24h])) / 100, 1)
      sample_size: ocb_chain_total_validators{chain="ethereum"}
      series: ocb_chain_median_net_yield_bps{chain="ethereum"}

  - slug: cardano
    name: Cardano
    tag: Top 50 pools · measured epoch rewards, Koios
    formula: "Median across the top 50 Cardano pools of gross × (1 − margin), gross = rewards paid for the latest computed epoch × 73 / active stake (Koios epoch_info)."
    queries:
      p50: ocb_chain_median_net_yield_bps{chain="cardano"}
      p90: quantile(0.90, ocb_validator_net_yield_bps{chain="cardano"})
      p99: quantile(0.99, ocb_validator_net_yield_bps{chain="cardano"})
      mean: avg(ocb_validator_net_yield_bps{chain="cardano"})
