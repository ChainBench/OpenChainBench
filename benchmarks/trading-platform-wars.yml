# OpenChainBench. Bench № 201

slug: trading-platform-wars
number: "201"
title: "Trading terminal leaderboard: what GMGN, Axiom, Fomo and Terminal route and what they charge"
seo_title: "Trading terminal volume and fees 2026: GMGN vs Axiom vs Fomo"
seo_description: "{{best_name}} leads trading terminals with {{best_p50}} routed in a day. Volume, fee revenue and observed take rate for eight terminals, per chain or across all."
subtitle: Routed volume, fee revenue and observed take rate per trading terminal, over one day, seven days or thirty, on one chain or across every chain.

category: Trading
status: live
metric: Daily volume
unit: usd
higher_is_better: true
row_noun: { one: terminal, many: terminals }
ledger_reliability: false

disclaimer: |
  Volume routed through each terminal's own interface, not volume on the tokens it trades: a swap on a pump.fun token executed through Axiom counts for Axiom here and for pump.fun on bench 200. From the public tehcscreener API, which is Allium-backed. Fee revenue is what the source reports as fees, which is more than the terminal's own commission; bench 203 explains what that is and is not.

seo_intro: |
  A trading terminal makes money on flow, so the two figures that describe one
  are how much it routes and what it keeps per dollar. This page puts them side
  by side for eight terminals, over a day, a week or a month, on one chain or
  across all of them. The spread is wide in both directions: the largest
  terminal routes more than a hundred times the smallest, and take rates run
  from nothing at all to above one percent.

abstract: |
  The harness reads the tehcscreener /bots endpoint and publishes routed
  volume, fee revenue and transaction counts per terminal per chain, summed
  over 1, 7 and 30 days. The take rate is total fees over the volume of the
  days whose fees could be measured, so it is volume-weighted and never a mean
  of daily rates.

  This bench read DeFiLlama until 2026-10-07. It now reads tehcscreener, which
  is the single source behind every bench on the /trading-apps hub. The move
  removed a contradiction: the hub previously showed a DeFiLlama take rate and
  a tehcscreener fee rate in the same table, disagreeing by up to a factor of
  two on the same terminal.

methodology:
  - "Source: the public tehcscreener API (https://tehcscreener.com/api), Allium-backed, no key, synced once a day. The single source behind every bench on the /trading-apps hub, so no two columns on one page can disagree about the same product."
  - "Volume: what the terminal routed through its own interface on the selected chain, or summed across every chain on the all-chains tab. Not volume on the tokens it trades, which is bench 200."
  - "Fee revenue: what this source reports as fees. It is demonstrably more than the terminal's own commission, measured against published fee schedules: Trojan advertises 0.9% and this source reads 1.12%. The exact composition is not documented by the source."
  - "Windows are sums over days, never averages of daily rates. Volume, fees and transactions add over days the same way they add over chains, and the take rate built on them is volume-weighted by construction: total fees over the volume of the days whose fees could be measured."
  - "A day a platform reports exactly zero fees while charging on another day or chain is treated as a gap, not a price, and leaves the ratio entirely, numerator and denominator together. A platform reporting nothing anywhere is uniformly free and keeps a real zero."
  - "Single source by decision, and this is what it costs: nothing here is cross-checked against a second indexer. On 2026-10-07 this source read pump.fun 2.2x above DeFiLlama on app volume and 3.7x above both DeFiLlama and Mobula on launchpad volume, while agreeing with DeFiLlama within 30% on six other platforms. The figures published are this source's."
  - "Latest complete day: the source publishes daily and its latest day is normally yesterday. A terminal with no activity on the selected chain reads unresponsive rather than carrying its last live day forward."

findings:
  - "{{best_name}} routes the most of any trading terminal, at {{best_p50}} in a day."
  - "Volume and take rate rank differently. The terminal routing the most is not the one keeping the most per dollar, and a reader choosing where to trade cares about the second."
  - "This is interface volume, not token volume. The same swap appears here under the terminal that routed it and on bench 200 under the launchpad whose token it touched."
  - "One source, not cross-checked. Its pump.fun figures sit well above two other indexers, which the methodology states rather than leaving a reader to discover."

source: https://github.com/ChainBench/OpenChainBench/tree/dev/harnesses/terminal-activity

prometheus:
  window: 24h
  url: https://prom.openchainbench.com
  expected_freshness_seconds: 172800
  freshness_timestamp_metric: terminal_activity_last_success_unix

dimension_labels:
  chain: Chain

dimensions:
  chain:
    - { value: all,       label: All chains }
    - { value: solana,    label: Solana }
    - { value: bnb,       label: BNB Chain }
    - { value: robinhood, label: Robinhood Chain }
    - { value: base,      label: Base }
    - { value: arc,       label: Arc }
    - { value: ethereum,  label: Ethereum }
    - { value: hyperevm,  label: HyperEVM }

ledger_columns:
  - { label: "Volume", slot: p50, unit: usd, windows: { 7d: vol_7d, 30d: vol_30d } }
  - { label: "Fee revenue", panel: fees_1d, unit: usd, windows: { 7d: fees_7d, 30d: fees_30d } }
  - { label: "Take rate", panel: take_1d, unit: pct, windows: { 7d: take_7d, 30d: take_30d } }

metric_panels:
  - id: vol_7d
    label: Volume 7d
    description: Routed volume summed over the last seven days.
    metric: terminal_window_volume_usd{chain="all",window="7d"}
    label_key: platform
    unit: usd
    higher_is_better: true
  - id: vol_30d
    label: Volume 30d
    description: Routed volume summed over the last thirty days.
    metric: terminal_window_volume_usd{chain="all",window="30d"}
    label_key: platform
    unit: usd
    higher_is_better: true
  - id: fees_1d
    label: Fee revenue
    description: Fees reported on the day. More than the terminal's own commission; see the methodology.
    metric: terminal_window_fees_usd{chain="all",window="1d"}
    label_key: platform
    unit: usd
    higher_is_better: true
  - id: fees_7d
    label: Fee revenue 7d
    description: Fees summed over the last seven days.
    metric: terminal_window_fees_usd{chain="all",window="7d"}
    label_key: platform
    unit: usd
    higher_is_better: true
  - id: fees_30d
    label: Fee revenue 30d
    description: Fees summed over the last thirty days.
    metric: terminal_window_fees_usd{chain="all",window="30d"}
    label_key: platform
    unit: usd
    higher_is_better: true
  - id: take_1d
    label: Take rate
    description: Fees over the volume of the days whose fees could be measured, in percent.
    metric: terminal_window_take_rate_pct{chain="all",window="1d"}
    label_key: platform
    unit: pct
    higher_is_better: false
  - id: take_7d
    label: Take rate 7d
    description: Fees over measurable volume across seven days.
    metric: terminal_window_take_rate_pct{chain="all",window="7d"}
    label_key: platform
    unit: pct
    higher_is_better: false
  - id: take_30d
    label: Take rate 30d
    description: Fees over measurable volume across thirty days.
    metric: terminal_window_take_rate_pct{chain="all",window="30d"}
    label_key: platform
    unit: pct
    higher_is_better: false

faq:
  - q: "Is this the same as the volume on bench 200?"
    a: "No, and the two should not be added. This counts what each terminal routed through its own interface. Bench 200 counts trading on each launchpad's tokens whoever routed it. One swap can appear on both, under a terminal here and under a launchpad there."
  - q: "Why did this move off DeFiLlama?"
    a: "So that every bench on the /trading-apps hub reads one source. The hub previously showed a DeFiLlama take rate next to a tehcscreener fee rate, disagreeing by up to two times on the same terminal, which is a contradiction a reader has no way to resolve."
  - q: "What does the fee revenue column actually count?"
    a: "More than the terminal's own commission. Measured against published schedules it runs above them, and the source does not document what it includes. Bench 203 carries the same caveat and the same number per dollar routed."

providers:
  - slug: fomo
    name: Fomo
    queries:
      p50: max(terminal_window_volume_usd{platform="fomo",chain="all",window="1d"})
      p90: max(terminal_window_volume_usd{platform="fomo",chain="all",window="1d"})
      p99: max(terminal_window_volume_usd{platform="fomo",chain="all",window="1d"})
      success: max(terminal_activity_health{platform="fomo",chain="all"})
      sample_size: max(terminal_window_txns{platform="fomo",chain="all",window="1d"})
      series: max by (platform) (terminal_window_volume_usd{platform="fomo",chain="all",window="1d"})

