# OpenChainBench. Bench № 059

slug: unichain-rpc
number: "059"
title: "Unichain RPC endpoints: free public URLs ranked by latency"
# seo_title test cohort (2026-09-19): endpoint-intent title; H1 keeps the measured claim.
seo_title: "Unichain RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Unichain RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Unichain RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Unichain, Uniswap Labs' OP Stack rollup, fields {{count}} no-key providers including the house `mainnet.unichain.org`. For a chain this young the gateway coverage is unusually complete, PublicNode, dRPC and Tenderly all sustain no-key probing at our 60-second cadence, so the official endpoint faces a full gateway tier from day one. Three regions, identical probes, stale-head detection.

abstract: |
  Unichain: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:unichain-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Unichain endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore. The harness also classifies every response (ok / http_err / jsonrpc_err / stale / timeout) and audits archive depth every 5 minutes, so the leaderboard rewards sustained, honest availability rather than a fast error message. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Unichain-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the latest-header fetch with a rotating id defeats edge caches that answer eth_blockNumber without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Unichain-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=\"unichain\". Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. Exclusions follow the cluster-wide rules documented on the parent benchmark."

faq:
  - q: "What is the fastest free Unichain RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber` p50 over the last 24h), measured against {{count}} no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples, so the answer on this page is the answer right now, not a quarterly snapshot. Use the region tabs to see the leader from the origin closest to your deployment."
  - q: "Which Unichain RPCs work without an API key?"
    a: "The {{count}} providers on this page are listed with their URLs in the endpoints table above. Every (provider, chain) pair was live-verified no-key before inclusion, and anything that key-gates, region-blocks or rate-limits below our 60-second cadence is excluded rather than listed with an asterisk."
  - q: "Should I use mainnet.unichain.org or a gateway for Unichain?"
    a: "Check the region tab nearest your deployment. Chain-official endpoints are typically a single origin, so they can only be close to one of our three probes, while anycast gateways answer everywhere. On the 3-region average the current leader is {{best_name}} at {{best_p50}}; a primary-plus-fallback pair from the top of this page is the resilient default for a chain this young."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on region alone.
rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="unichain"})

# Region is the only dimension: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://unichain-rpc.publicnode.com
    tag: Allnodes-operated, 70+ chains, archive on most
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Unichain endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="unichain"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="unichain"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="unichain"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="unichain"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="unichain"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="unichain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="unichain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="unichain"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="unichain", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="unichain", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="unichain", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="unichain", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="unichain", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="unichain", region="sgp"}[1h])

