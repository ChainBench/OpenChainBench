  - slug: tenderly
    name: Tenderly
    endpoint: https://gateway.tenderly.co/public/unichain
    tag: Multi-chain public gateway, no key
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Tenderly's no-key Unichain endpoint."
