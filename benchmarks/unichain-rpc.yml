      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="unichain"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="unichain"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="unichain"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="unichain"}[1h]))
      regions:
