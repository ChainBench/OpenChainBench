# OpenChainBench. Bench No 251

slug: sentinel-rpc
number: "251"
title: "Sentinel DVPN RPC endpoints: free public URLs by latency"
seo_title: "Sentinel DVPN RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Sentinel DVPN RPC at {{best_p50}} (block height p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for Tendermint /status queries against every available public Sentinel DVPN endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Sentinel is a decentralized VPN (dVPN) protocol built on the Cosmos SDK, operating on the sentinelhub-2 mainnet. It enables users to share bandwidth and access privacy-preserving connectivity through DVPN token incentives. Sentinel uses the standard Cosmos Tendermint RPC interface; block height is fetched via the /status endpoint. Public keyless RPC nodes are available from Polkachu, PublicNode, and Cosmos Directory. Every provider was live-verified with consecutive block-height probes at launch.

abstract: |
  Sentinel DVPN: {{count}} free public RPC endpoints answering `GET /status` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a Tendermint /status query against every available public Sentinel endpoint that sustains continuous probing: {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. Each provider is probed via a GET /status request from which the block number is extracted. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a Cosmos-scaled staleness gap (20 blocks, around 120 s at 6 s/block). The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Sentinel-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus avg(quantile_over_time(...)); per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: GET /status. The result.sync_info.latest_block_height field (string-encoded integer) is extracted as the current block height."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Sentinel DVPN-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=sentinel. Provider coverage today: {{count}} endpoints."

faq:
  - q: "Which Sentinel DVPN RPC endpoints work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today: Polkachu (sentinel-rpc.polkachu.com), PublicNode (sentinel-rpc.publicnode.com), and Cosmos Directory (rpc.cosmos.directory/sentinel). Every listed endpoint was live-verified before inclusion."
  - q: "What is Sentinel and why does its RPC latency matter?"
    a: "Sentinel is a decentralized VPN network where node operators earn DVPN tokens for sharing bandwidth. Developers building dVPN clients, node management tools, or on-chain governance integrations require reliable low-latency RPC access to query bandwidth sessions, staking state, and transaction history."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="sentinel"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: polkachu
    name: Polkachu
    endpoint: https://sentinel-rpc.polkachu.com
    tag: Polkachu public Sentinel DVPN RPC, no API key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /status sent every 60s from 3 regions to sentinel-rpc.polkachu.com."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="sentinel"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="polkachu", chain="sentinel"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="polkachu", chain="sentinel"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="polkachu", chain="sentinel"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="polkachu", chain="sentinel"}) / sum(ocb:rpc_call:rate_24h{provider="polkachu", chain="sentinel"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="polkachu", chain="sentinel"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="sentinel"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="sentinel", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="sentinel", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="sentinel", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="sentinel", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="sentinel", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="sentinel", region="sgp"}[1h])

  - slug: publicnode
    name: PublicNode
    endpoint: https://sentinel-rpc.publicnode.com
    tag: PublicNode public Sentinel DVPN RPC, no API key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /status sent every 60s from 3 regions to sentinel-rpc.publicnode.com."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="sentinel"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="sentinel"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="sentinel"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="sentinel"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="sentinel"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="sentinel"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="sentinel"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="sentinel"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="sentinel", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="sentinel", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="sentinel", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="sentinel", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="sentinel", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="sentinel", region="sgp"}[1h])

  - slug: cosmos-directory
    name: Cosmos Directory
    endpoint: https://rpc.cosmos.directory/sentinel
    tag: Cosmos Directory public Sentinel DVPN RPC proxy, no API key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /status sent every 60s from 3 regions to rpc.cosmos.directory/sentinel."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="cosmos-directory", chain="sentinel"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="cosmos-directory", chain="sentinel"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="cosmos-directory", chain="sentinel"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="cosmos-directory", chain="sentinel"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="cosmos-directory", chain="sentinel"}) / sum(ocb:rpc_call:rate_24h{provider="cosmos-directory", chain="sentinel"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="cosmos-directory", chain="sentinel"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="cosmos-directory", chain="sentinel"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="cosmos-directory", chain="sentinel", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="cosmos-directory", chain="sentinel", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="cosmos-directory", chain="sentinel", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="cosmos-directory", chain="sentinel", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="cosmos-directory", chain="sentinel", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="cosmos-directory", chain="sentinel", region="sgp"}[1h])
