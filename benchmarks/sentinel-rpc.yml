          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="sentinel", region="sgp"}[1h])

  - slug: cosmos-directory
    name: Cosmos Directory
    tag: Cosmos Directory public Sentinel DVPN RPC proxy, no API key required
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a GET /status sent every 60s from 3 regions to rpc.cosmos.directory/sentinel."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="cosmos-directory", chain="sentinel"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="cosmos-directory", chain="sentinel"})
