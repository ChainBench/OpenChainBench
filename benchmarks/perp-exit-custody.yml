# OpenChainBench. Bench 123

slug: perp-exit-custody
number: "123"
title: "Perp DEX exit custody: worst-case hours to withdraw without operator help, live"
seo_title: "Perp DEX custody risk 2026"
seo_description: "Lighter leads perp DEX exit independence at 336h worst-case (14-day Desert Mode, self-provable ZK exit). Ostium 720h (public tryNewSettlement() fallback). gains.trade, GMX, Hyperliquid and Aster have no permissionless exit path. Withdrawal depends on operator liveness. Live settlement age monitored."
subtitle: "Worst-case hours a user must wait to withdraw funds without any operator or validator cooperation. Lower is better. Venues with no permissionless exit path are ranked last. Settlement freshness monitored live via RPC for venues with on-chain settlement mechanisms."
category: Trading
status: draft
metric: Worst-case exit hours (no operator)
unit: count
higher_is_better: false

disclaimer: |
  Worst-case exit hours: if the protocol operator (keeper, sequencer, validator set) went offline permanently, how long until a user can withdraw without any cooperation? Venues with no permissionless path are marked infinity. This is a custody-risk metric, not a UX metric. In normal operation all venues process withdrawals faster. Evidence tier (bytecode/documented) noted per venue.

seo_intro: |
  The standard perp DEX comparison covers fees, speed and liquidity. It
  almost never covers the question that matters most for large capital:
  if the team disappeared tomorrow, could you get your money out?
  This benchmark measures the worst-case hours to permissionless
  withdrawal for seven major perp venues: gains.trade, GMX v2, Ostium,
  Vertex, Hyperliquid, Lighter and Aster, using on-chain source code
  analysis (Slither, cast) and official documentation as evidence.

  The results are not intuitive. The protocol with the most
  censorship-resistant LP exit on Arbitrum is Ostium, not through
  any design claim, but because its vault source code contains a
  public function, tryNewSettlement(), that anyone can call once
  the maxSettlementInterval elapses. gains.trade and GMX v2 have
  no equivalent: gains LP withdrawals require oracle epochs to
  advance (oracle-triggered, not time-triggered), and GMX withdrawals
  require keeper execution with the CONTROLLER role. Hyperliquid,
  the volume leader, has no escape hatch: the bridge contract on
  Arbitrum is upgradeable by a single EOA with no timelock, and
  withdrawals require 2/3 validator co-signature with no user override.
  The only venue with a formally bounded exit window under operator
  failure is Lighter, via a 14-day Desert Mode triggered from the
  Ethereum priority queue.

abstract: |
  The harness combines two layers. The first is a static registry
  (registry.yaml) encoding the exit architecture per venue: whether
  a permissionless exit path exists, what its trigger mechanism is,
  and the worst-case duration in hours. This registry is derived from
  verified smart contract source code (via deficollective/permission-scanner
  with Slither) for EVM venues and from official documentation plus
  L2Beat for non-EVM venues. The confidence tier (bytecode/onchain/documented)
  is stored per field.

  The second layer is a live RPC/HTTP probe that runs every 5 minutes
  and emits fresh metrics for venues with on-chain settlement mechanisms.
  For Ostium the harness reads lastSettlementTs and maxSettlementInterval
  from the OstiumVault proxy to compute settlement age in seconds and
  a flag for whether tryNewSettlement() is currently callable. For
  gains.trade the harness reads currentEpoch() and currentEpochStart()
  from each gToken vault to track epoch freshness.

  The worst-case exit hours for each venue:
  gains.trade: infinity (oracle must advance epochs; no time-based override).
  GMX v2: infinity (keeper CONTROLLER role required to execute withdrawals; no override).
  Ostium: 720h (3 settlements x 30-day maxSettlementInterval; tryNewSettlement() public).
  Vertex: unknown (implementation contracts not verified on Arbiscan; architecture opaque).
  Hyperliquid: infinity (2/3 validator co-sign required; no escape hatch; bridge upgradeable by EOA).
  Lighter: 336h (14-day Desert Mode from priority queue; self-provable ZK exit; circuits open source).
  Aster: infinity (2/3 internal validator co-sign required; no escape hatch documented).

methodology:
  - "Static architecture: contract source code downloaded via Etherscan API v2 for EVM venues; analyzed with deficollective/permission-scanner (Slither). Evidence tier noted per field: bytecode (from verified source), onchain (from direct RPC read), documented (from official docs or L2Beat)."
  - "gains.trade (gToken vaults, solc 0.8.9): withdraw()/redeem() have no admin modifier (ERC4626 checks only), but maxWithdraw(holder) = 0 for real holders. Mandatory 2-step: makeWithdrawRequest() then wait 3 oracle epochs then withdraw(). Epochs advance via openTradesPnlFeed oracle callback, not by time. If oracle stops, epochs freeze indefinitely. Current epoch: {{metric:perp_exit_epoch_number{venue=gains}}}."
  - "GMX v2 (DataStore solc 0.8.18, Timelock solc 0.8.18): scanner found 39 DataStore functions gated onlyController. Withdrawals via WithdrawalHandler require keeper bots with CONTROLLER role. cancelWithdrawal() lets users recover pending requests but not execute them. Worst-case: keepers offline, no exit. Custom Timelock TIMELOCK_ADMIN held by 2 plain EOAs among 4 holders."
  - "Ostium (OstiumVault impl solc 0.8.24): requestWithdraw has checks modifier; claimWithdraw has none. Settlement: (a) operator calls _settlement(); (b) anyone calls tryNewSettlement() PUBLIC once maxSettlementInterval (30 days, changed from 24h by gov) elapses. withdrawSettlementDelay=2 means 3 settlements needed. Worst-case: 3x30 = 90 days. Live: settlement age {{metric:perp_exit_settlement_age_hours{venue=ostium}}}h, callable: {{metric:perp_exit_settlement_callable{venue=ostium}}}."
  - "Vertex (Arbitrum, Endpoint proxy solc 0.8.2): ALL implementation contracts (Endpoint impl 0x91ffc8, Clearinghouse impl 0x63a497, SpotEngine 0x32d91a, PerpEngine 0xb74c78, OffchainExchange 0xa43698) are NOT verified on Arbiscan. GitHub repo documents submitSlowModeTransaction() slow-mode mechanism but bytecode cannot be compared to repo. Worst-case: unknown. Displayed as infinity."
  - "Hyperliquid (bridge on Arbitrum 0x2Df1c5, verified): L2Beat confirmed bridge upgradeable by EOA with no timelock delay. Withdrawals require 2/3+ staking-weighted validator co-signature (~27 nodes, historically team-controlled). No escape hatch documented. Worst-case: infinity. L2Beat: no window for users to exit since contracts are instantly upgradeable. Category: Other (not rated as L2)."
  - "Lighter (Ethereum mainnet, ZkLighter 0x3B4D79, verified, L2Beat Stage 0): Desert Mode triggers when sequencer ignores priority queue for 14 days. Rollup freezes; user self-generates ZK proof of balance from Ethereum blob data and exits directly from contract. Prover circuits open source at github.com/elliottech/lighter-prover, audited by ZKSecurity. UpgradeGatekeeper has no delay, concurrent risk. Worst-case: 14 days = 336h."
  - "Aster (multi-chain: BNB primary, ETH, ARB, SOL): cross-chain withdrawals require 2-of-3 internal validator co-signature. No forced exit or escape hatch documented. Core chain (Aster PoSA L1, March 2026) closed source. Upgrade key management not disclosed. Worst-case: infinity. Tier: documented (bridge contracts not independently verified at measurement time)."
  - "Live probe cadence: every 5 minutes. Ostium: cast call OstiumVault lastSettlementTs() and maxSettlementInterval() on Arbitrum. gains: cast call gDAI currentEpoch() and currentEpochStart(). Hyperliquid: bridge USDC balance on Arbitrum (sanity check). RPC: public Arbitrum One and Ethereum endpoints."

findings:
  - "Lighter is the only venue in the cohort with a formally bounded worst-case exit: 336 hours (14 days) via Desert Mode, requiring only a self-generated ZK proof from public on-chain data. No operator cooperation needed after the 14-day window."
  - "Ostium is the only EVM venue on Arbitrum with a permissionless exit fallback: tryNewSettlement() is a PUBLIC function anyone can call once maxSettlementInterval (currently 30 days) elapses. Worst-case: 3 settlements x 30 days = 90 days. Settlement age live: {{metric:perp_exit_settlement_age_hours{venue=ostium}}}h."
  - "gains.trade LP exit has no admin permission gate (withdraw/redeem use ERC4626 checks modifier) but requires 3 oracle epoch advances. Epochs are triggered by openTradesPnlFeed oracle callbacks, not by time. If the oracle stops, epochs freeze indefinitely. Worst-case: infinity. Current epoch: {{metric:perp_exit_epoch_number{venue=gains}}}."
  - "GMX v2 withdrawals require keeper bots with the CONTROLLER role to execute. No user override exists. Worst-case: infinity. Additional finding: 2 of 4 TIMELOCK_ADMIN holders in GMX custom Timelock are plain EOAs (single private key, no multisig)."
  - "Hyperliquid bridge (Arbitrum 0x2Df1c5) is upgradeable by a single EOA with no timelock (L2Beat CRITICAL flag). Withdrawals require 2/3+ validator co-signature. No escape hatch. Worst-case: infinity."
  - "Vertex implementation contracts (Endpoint, Clearinghouse, SpotEngine, PerpEngine, OffchainExchange) are NOT verified on Arbiscan. The GitHub repo documents a slow-mode exit but bytecode cannot be confirmed to match. Worst-case: unknown."
  - "Aster cross-chain withdrawals require 2-of-3 internal validator co-sign. No forced exit documented. Core chain closed source. Worst-case: infinity. Tier: documented only."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/permissions-scan

prometheus:
  window: 24h
  expected_freshness_seconds: 600
  freshness_metric: perp_exit_settlement_age_seconds

faq:
  - q: "What does 'worst-case exit hours' mean?"
    a: "The hours a user would wait to withdraw all funds if the protocol operator (keeper, sequencer, validator set) went permanently offline right now, with no operator cooperation. Venues with no permissionless path are marked infinity. In normal operation all venues process withdrawals much faster."
  - q: "Why does Ostium rank better than gains.trade for LP custody?"
    a: "Ostium's OstiumVault has tryNewSettlement(), a public function anyone can call once maxSettlementInterval (30 days currently) has passed since the last settlement. After it fires, claimWithdraw() has no permission modifier and executes immediately. gains.trade gToken epochs advance only when the openTradesPnlFeed oracle provides a new value; there is no time-based override. If the oracle stops, gains LP withdrawals are frozen with no user override."
  - q: "Does 'no admin gate on withdraw()' mean permissionless exit?"
    a: "Not necessarily. The Slither permission scanner only reports modifier-level access control. It does not detect state-based locks: epoch locks (gains), settlement delays (ostium), keeper-required execution (GMX), or time-gated queues. maxWithdraw(holder) returning 0 for real holders with positive balances is the concrete on-chain test. This bench tested real gDAI holders and confirmed maxWithdraw = 0 in all cases; meaning withdraw() would revert despite having no onlyOwner modifier."
  - q: "Why is Lighter rated Stage 0 if it has an escape hatch?"
    a: "L2Beat's Stage 1 requires no security council or upgrade delay. Lighter's UpgradeGatekeeper EOA can upgrade the contract instantly with no delay. An instant-upgrade key can drain funds before Desert Mode would ever trigger. Stage 0 correctly reflects that the upgrade risk exists regardless of the Desert Mode mechanism."
  - q: "Why are Hyperliquid's implementation contracts not on Arbitrum?"
    a: "Hyperliquid runs its own L1 (HyperBFT). Only the USDC bridge is on Arbitrum. User funds are escrowed on Arbitrum; the trading logic runs on the Hyperliquid L1, which is closed source."
  - q: "Why is Vertex shown as unknown rather than infinity?"
    a: "Unknown is distinct from infinity. Infinity means we know no permissionless exit exists. Unknown means the bytecode of the deployed contracts is not verifiable (implementation contracts are not verified on Arbiscan), so we cannot determine from on-chain evidence whether a slow-mode exit exists in the deployed code. The GitHub repo documents one, but the repo describes intent, not the deployed system."
  - q: "Is Ostium's tryNewSettlement() guaranteed to work if I call it after 30 days?"
    a: "It is permissionless once the time condition is met, but it has a dependency: _updateAccPnlPerTokenUsed() is called internally, which reads from the oracle price. If the oracle feed is stale or reverts, the settlement may fail. The permissionless path is time-gated, not fully oracle-independent."
  - q: "How often is this data updated?"
    a: "Live metrics (settlement age, epoch number) are updated every 5 minutes via RPC probes. Architecture findings (worst-case exit hours, ownership chain, upgrade delay) are derived from versioned scanner output and updated when a governance action or contract upgrade changes the architecture. The measurement block and timestamp are stored in harnesses/permissions-scan/out/*.json."

