# OpenChainBench. Bench № 001

slug: aggregator-head-lag
number: "001"
title: Fastest crypto price API, live head lag across Mobula, Codex, GeckoTerminal
seo_title: "Fastest crypto price API 2026"
seo_description: "{{best_name}} leads fastest crypto price API at {{best_p50}} (p50, 24h). Mobula WebSocket, Codex GraphQL, GeckoTerminal REST live across Base, BNB, Solana."
subtitle: Wall-clock head lag in seconds from on-chain swap event to API emission, measured live for Mobula, Codex and GeckoTerminal on Base, BNB Chain, Solana and Robinhood Chain.

per_chain_explainer:
  - slug: base
    h2: "Lowest Base price feed head lag"
    body: |
      {{best_name:chain:base}} currently leads Base head lag at {{best_p50:chain:base}} (p50, 24h) across the 3 measured providers. Base targets a 2 s sequencer cadence on the OP Stack, so the chain itself sets a roughly 2 s floor below which no provider can publish: any latency you see beyond that floor is pipeline work (indexer, fan-out, edge). Measured by holding archive-node `eth_subscribe("newHeads")` and timestamping each provider's emission of the same swap event from us-east, eu-west and Singapore.
  - slug: bnb
    h2: "Lowest BNB Chain price feed head lag"
    body: |
      {{best_name:chain:bnb}} currently leads BNB Chain head lag at {{best_p50:chain:bnb}} (p50, 24h). BNB Smart Chain runs a Parlia PoSA consensus with 21 active validators on a fixed 3 s slot (recently tightened toward 0.75 s under BEP-524 testing), which sets the structural floor for any price-feed provider; the spread between leader and trailer reflects indexer pipeline depth, not chain speed. Cross-region samples taken every 15 seconds.
  - slug: solana
    h2: "Lowest Solana price feed head lag"
    body: |
      {{best_name:chain:solana}} currently leads Solana head lag at {{best_p50:chain:solana}} (p50, 24h). Solana runs a 400 ms slot under Proof of History with confirmed status at typically 1-2 slots, so any second-scale provider latency lives entirely in the indexer pipeline rather than in the chain. Providers that subscribe to Yellowstone gRPC streams of confirmed blocks beat REST-pollers by definition. Measured against a canonical archive node from us-east, eu-west and Singapore.
  - slug: robinhood
    h2: "Lowest Robinhood Chain price feed head lag"
    body: |
      {{best_name:chain:robinhood}} currently leads Robinhood Chain head lag at {{best_p50:chain:robinhood}} (p50, 24h). Robinhood Chain is an Arbitrum Orbit L2 with sub-second block cadence, so nearly all of the latency you see here is provider pipeline (indexer, fan-out, edge) rather than chain time. It is also the youngest chain on this bench: indexer coverage is uneven across providers, which makes the leader-to-trailer spread wider than on mature chains. Measured on the highest-activity pool (USDG/WETH, about 40k swaps per day) from us-east, eu-west and Singapore.

category: Aggregators
status: live
metric: Head lag
unit: s

seo_intro: |
  This benchmark measures the question every builder of a trading UI, a
  PnL tracker or a live DEX dashboard has to answer before picking a
  data provider. how many seconds elapse between a swap landing on
  chain and the same event appearing on the provider's feed. Marketing
  pages quote "real-time" without a number; this page quotes the
  number. Mobula's WebSocket, Codex's GraphQL feed and GeckoTerminal's
  REST endpoint are watched from three regions (us-east, eu-west, sgp)
  against canonical-tip archive
  nodes on Base, BNB Chain, Solana and Robinhood Chain. Because each chain has its own
  base block cadence (Solana's ~400 ms slots vs Base/BNB's 2-3 s
  blocks), the headline winner shifts by chain. On Solana the leader
  is {{best_name:chain:solana}} at {{best_p50:chain:solana}}; on Base
  it's {{best_name:chain:base}} at {{best_p50:chain:base}}; on BNB
  Chain it's {{best_name:chain:bnb}} at {{best_p50:chain:bnb}}.
  p50 and p99 are computed via Prometheus `quantile_over_time` over a
  24-hour window so the leaderboard reflects sustained freshness, not
  a cherry-picked cold-start sample. The same harness tracks presence
  (5760 expected samples per provider per day), so a provider whose
  feed dropped for an hour shows it on the success rate column rather
  than disappearing silently from the latency aggregate.

abstract: |
  We measure the gap between a transaction settling on chain and the same
  transaction appearing on each aggregator's data feed. The harness watches
  reference pools across Base, BNB Chain, Solana and Robinhood Chain from three regions
  (us-east, eu-west, sgp), records every new on-chain event with millisecond
  timestamps, and observes when each aggregator's WebSocket reflects the
  same event.

methodology:
  - "Aggregators measured: Mobula, Codex, GeckoTerminal."
  - "Chains: Base, BNB Chain, Solana, Robinhood Chain."
  - "Regions: us-east, eu-west, sgp. Cross-region median reported in the headline."
  - "Reference: archive nodes per chain, validated against block hashes."
  - "Metric: gauge `head_lag_seconds`, sampled every 15 seconds. Aggregated over the 24-hour window using `quantile_over_time`."
  - "Success rate: presence ratio. Share of expected sampling slots where a value was actually emitted (5,760 expected per provider per day at the 15s cadence). 100% means the aggregator's feed was reachable for the full window."
  - "Cardinality: 3 aggregators × 4 chains × 3 regions = 36 active series."

findings:
  - "Across the unfiltered cross-chain aggregate the leader is {{best_name}} at {{best_p50}} (p50, 24 h) over {{count}} measured providers, but that headline number mixes chains with very different baseline cadences (Solana 400 ms slots vs Base/BNB 2-3 s blocks) so the per-chain breakdown below is what to read for an integration decision."
  - "On Solana the leader is {{best_name:chain:solana}} at {{best_p50:chain:solana}} (p50, 24 h); the trailer is {{worst_name:chain:solana}} at {{worst_p50:chain:solana}}. Slot cadence is sub-second, so any second-scale aggregate latency is on the provider's pipeline, not the chain."
  - "On Base the leader is {{best_name:chain:base}} at {{best_p50:chain:base}} (p50, 24 h); the trailer is {{worst_name:chain:base}} at {{worst_p50:chain:base}}. Base targets a 2 s block cadence, so head lag here measures pipeline latency on top of the chain's natural block interval."
  - "On BNB Chain the leader is {{best_name:chain:bnb}} at {{best_p50:chain:bnb}} (p50, 24 h); the trailer is {{worst_name:chain:bnb}} at {{worst_p50:chain:bnb}}. BNB's ~3 s blocks set the floor; the spread between leader and trailer is the provider-side delta."
  - "{{name:mobula}} returns {{p50:mobula}} (p50, 24 h) cross-chain. WebSocket feeds compress latency by pushing events the moment the harness emits them rather than waiting for the next poll cycle, which is the architectural reason real-time integrations prefer them over REST."
  - "{{name:codex}} clocks {{p50:codex}} (p50, 24 h) cross-chain. GraphQL subscriptions are a server-push pattern in practice and cluster near WebSocket performance on liquid pools, but tail latency tends to widen on long-tail tokens with sparse events."
  - "{{name:geckoterminal}} sits at {{p50:geckoterminal}} (p50, 24 h) cross-chain. REST polling adds the poll interval to every read, so head lag tracks the publisher's chosen cadence rather than raw infrastructure speed."
  - "p99 is the integration-grade number. The gap between p50 and {{p99:mobula}} / {{p99:codex}} / {{p99:geckoterminal}} is what a live UI feels when a chain spikes or a region's path degrades."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/aggregator-head-lag

prometheus:
  window: 24h
  # Live-feed sanity gate. Sums event-arrival changes across every
  # aggregator series in the last 15min. If this is 0, ALL our probes
  # are silent (harness crash / Prom scrape failing / config drift) and
  # the per-provider "Feed down" badges would be misleading, so the UI
  # suppresses them. If > 0, at least one provider is actively receiving
  # events from us, which means a provider showing 0 changes on its own
  # is genuinely silent from Codex/Mobula/Gecko upstream.
  probe_ok: sum(changes(head_lag_seconds[15m]))

faq:
  - q: "Which crypto data API has the lowest latency right now?"
    a: "It depends on the chain, because each chain's base block cadence sets a different floor. On Solana the leader is {{best_name:chain:solana}} at {{best_p50:chain:solana}} (p50, 24 h). On Base it's {{best_name:chain:base}} at {{best_p50:chain:base}}. On BNB Chain it's {{best_name:chain:bnb}} at {{best_p50:chain:bnb}}. The unfiltered cross-chain aggregate puts {{best_name}} on top at {{best_p50}}, but that ranking is influenced by chain mix as much as by provider pipeline speed - read the per-chain numbers if you're picking a provider for a specific chain."
  - q: "What is head lag in a crypto data feed?"
    a: "Head lag is the wall-clock interval between a transaction landing in a confirmed block on chain and the same transaction appearing on the data provider's feed. A provider with 200 ms head lag pushes the event a fifth of a second after it settled; a provider with 6 s head lag pushes it after six seconds. The number controls how live a trading UI, a chart or a PnL tracker actually feels when the underlying chain moves."
  - q: "Is WebSocket faster than REST for crypto market data?"
    a: "Yes, structurally. A WebSocket connection pushes events the moment the provider's indexer has them, so latency tracks the publisher's indexer speed and the network path. REST polling adds the poll interval to every read: a one-second poll cadence puts a floor of one second on top of whatever the indexer adds. The leaderboard shows the difference live, with Mobula on a WebSocket feed, Codex on GraphQL subscriptions and GeckoTerminal on REST."
  - q: "How fast does GeckoTerminal update prices?"
    a: "{{name:geckoterminal}} currently sits at {{p50:geckoterminal}} (p50, 24 h) head lag on this benchmark. REST endpoints update at the publisher's chosen cadence rather than the moment a swap lands, which is the architectural reason REST polling reads slower than WebSocket feeds for the same underlying chain data."
  - q: "How is head lag measured on OpenChainBench?"
    a: "The harness holds a live WebSocket subscription to canonical-tip archive nodes on each chain (Base, BNB Chain, Solana, Robinhood Chain). Every new on-chain swap is timestamped on receipt with millisecond precision. The harness then watches each provider's feed for the same event and computes the delta. p50, p90 and p99 are aggregated over 24 hours via Prometheus `quantile_over_time`. Errors and dropouts are tracked separately as a presence ratio so a fast feed that disappears does not silently rank above a slower feed that stays up."
  - q: "Which data provider should I pick for a real-time trading interface?"
    a: "Read both the p50 and the p99 columns. p50 tells the typical experience, p99 tells the worst minute a user will see when a chain spikes or a region's path degrades. A 500 ms p50 with a 30 s p99 means most of the time the UI feels snappy and once per minute it stutters. The leaderboard splits both, plus the success rate column flags providers whose feed dropped during the measurement window."

# Chain filter tabs above the chart. The "all" option leaves queries
# unscoped (cross-chain aggregate); the others inject chain="<value>" into
# every PromQL selector via lib/spec.ts:injectChainFilter.
dimensions:
  chain:
    - { value: all,       label: All chains }
    - { value: base,      label: Base }
    - { value: bnb,       label: BNB Chain }
    - { value: solana,    label: Solana }
    - { value: robinhood, label: Robinhood }
  # Region values match the raw harness labels (REGION env on each
  # Railway probe: us-east / eu-west / sgp). Declared so the
  # /compare/[slug] page can render a per chain x per region matrix
  # for pairs that compete in this bench. The bench page chart owns
  # its own inline region picker; both stay in sync because they hit
  # the same Prom queries with the same region label.
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

# Rank matrix query gates the per-region badge claims. The bench
# metric uses the `aggregator` label (legacy harness naming); we use
# label_replace to alias it to `provider` so the cross-bench badge
# infra (which assumes a `provider` label) lines up. Validator only
# checks the query string carries the `provider` token; the actual
# Prom evaluation runs identically against either label.
rank_matrix_query: avg by (provider, chain, region) (label_replace(quantile_over_time(0.5, head_lag_seconds[24h]), "provider", "$1", "aggregator", "(.+)"))

# Legacy comment (resolved by the region block above):
# a region selector inline (TimeSeriesChart's built-in switch), which is a
# better-placed affordance. The top-level dimensions framework still
# supports it generically if any other bench wants two-axis filtering.

# Real metric exposed by the head-lag harness:
#   head_lag_seconds{aggregator, chain, region}   . gauge in seconds
#   head_lag_errors_total{aggregator, chain, region, error_type} . counter
#
# Label is `aggregator=`, not `provider=`. Values are in seconds; queries
# multiply by 1000 so the loader stores milliseconds (consistent across the
# repo). The `unit: s` field tells the page to display in seconds.

providers:
  - slug: mobula
    name: Mobula
    tag: WebSocket feed
    formula: "Median seconds between an on-chain swap landing on Base/BNB/Solana archive nodes and the same event arriving on Mobula's WebSocket, sampled every 15s over 24h."
    queries:
      p50: quantile_over_time(0.50, head_lag_seconds{aggregator="mobula"}[24h]) * 1000
      p90: quantile_over_time(0.90, head_lag_seconds{aggregator="mobula"}[24h]) * 1000
      p99: quantile_over_time(0.99, head_lag_seconds{aggregator="mobula"}[24h]) * 1000
      mean: avg_over_time(head_lag_seconds{aggregator="mobula"}[24h]) * 1000
      success: clamp_max(count_over_time(head_lag_seconds{aggregator="mobula"}[24h]) / 5760, 1)
      sample_size: sum(count_over_time(head_lag_seconds{aggregator="mobula"}[24h]))
      # No `unless changes == 0` guard on the historical series: it
      # false-drops points on backfilled data (Prom-compacted to ~1
      # sample per hour, so `changes[15m]` returns 0 even though the
      # gauge was healthy at the time). The 30D view was losing the
      # first ~8 days of data to this. Live-feed silence is still
      # surfaced by the `live_activity` scalar below (badge + banner
      # + downtime pill), which runs against fresh 15s-cadence data.
      series: avg_over_time(head_lag_seconds{aggregator="mobula"}[1h]) * 1000
      # Total gauge-value changes on this aggregator across chains and
      # regions in the last 15min. Non-zero = fresh events arrived; 0 =
      # every subscription has been silent for 15+ minutes (the gauge is
      # frozen at its last value). Threshold is > 0 rather than a rate
      # so quiet chains at night don't false-flag the aggregate view.
      live_activity: sum(changes(head_lag_seconds{aggregator="mobula"}[15m]))
      regions:
        - region: us-east
          p50: quantile_over_time(0.50, head_lag_seconds{aggregator="mobula", region="us-east"}[24h]) * 1000
          series: avg_over_time(head_lag_seconds{aggregator="mobula", region="us-east"}[1h]) * 1000
        - region: eu-west
          p50: quantile_over_time(0.50, head_lag_seconds{aggregator="mobula", region="eu-west"}[24h]) * 1000
          series: avg_over_time(head_lag_seconds{aggregator="mobula", region="eu-west"}[1h]) * 1000
        - region: ap-southeast
          p50: quantile_over_time(0.50, head_lag_seconds{aggregator="mobula", region="sgp"}[24h]) * 1000
          series: avg_over_time(head_lag_seconds{aggregator="mobula", region="sgp"}[1h]) * 1000

  - slug: codex
    name: Codex
    tag: GraphQL feed
    formula: "Median seconds between an on-chain swap landing on Base/BNB/Solana archive nodes and the same event arriving on Codex's GraphQL subscription, sampled every 15s over 24h."
    queries:
      p50: quantile_over_time(0.50, head_lag_seconds{aggregator="codex"}[24h]) * 1000
      p90: quantile_over_time(0.90, head_lag_seconds{aggregator="codex"}[24h]) * 1000
      p99: quantile_over_time(0.99, head_lag_seconds{aggregator="codex"}[24h]) * 1000
      mean: avg_over_time(head_lag_seconds{aggregator="codex"}[24h]) * 1000
      success: clamp_max(count_over_time(head_lag_seconds{aggregator="codex"}[24h]) / 5760, 1)
      sample_size: sum(count_over_time(head_lag_seconds{aggregator="codex"}[24h]))
      series: avg_over_time(head_lag_seconds{aggregator="codex"}[1h]) * 1000
      live_activity: sum(changes(head_lag_seconds{aggregator="codex"}[15m]))
      regions:
        - region: us-east
          p50: quantile_over_time(0.50, head_lag_seconds{aggregator="codex", region="us-east"}[24h]) * 1000
          series: avg_over_time(head_lag_seconds{aggregator="codex", region="us-east"}[1h]) * 1000
        - region: eu-west
          p50: quantile_over_time(0.50, head_lag_seconds{aggregator="codex", region="eu-west"}[24h]) * 1000
          series: avg_over_time(head_lag_seconds{aggregator="codex", region="eu-west"}[1h]) * 1000
        - region: ap-southeast
          p50: quantile_over_time(0.50, head_lag_seconds{aggregator="codex", region="sgp"}[24h]) * 1000
          series: avg_over_time(head_lag_seconds{aggregator="codex", region="sgp"}[1h]) * 1000

  - slug: geckoterminal
    name: GeckoTerminal
    tag: REST feed
    formula: "Median seconds between an on-chain swap landing on Base/BNB/Solana archive nodes and the same event surfacing on GeckoTerminal's REST endpoint, sampled every 15s over 24h."
    queries:
      p50: quantile_over_time(0.50, head_lag_seconds{aggregator="geckoterminal"}[24h]) * 1000
      p90: quantile_over_time(0.90, head_lag_seconds{aggregator="geckoterminal"}[24h]) * 1000
      p99: quantile_over_time(0.99, head_lag_seconds{aggregator="geckoterminal"}[24h]) * 1000
