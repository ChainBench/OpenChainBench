prometheus:
  window: 7d
  expected_freshness_seconds: 1800

# Real metrics emitted by the buyback-audit harness:
#   ocb_buyback_executed_usd{protocol, window}              gauge (USD)
#   ocb_buyback_promised_usd{protocol, window}              gauge (USD)
#   ocb_buyback_ratio{protocol, window}                     gauge (executed / promised, 0..1+)
#   ocb_buyback_scrape_errors_total{protocol, source}       counter
#   ocb_buyback_last_scrape_timestamp_seconds{protocol}     gauge
#
# Each "provider" below is one buyback program. The leaderboard ranks
# programs by their 7d execution ratio (higher = closer to delivering
# the promised buyback). The 30d ratio is exposed on the same metric
# with `window="30d"` for readers who want the longer-cadence view;
# the live page defaults to 7d to match the prometheus.window above.
# p50/p90/p99 columns are filled with the same scalar gauge because
# the ratio is a single observation per (protocol, window), not a
# statistical distribution, the OCB renderer expects all four to
# resolve regardless.

providers:
  - slug: hyperliquid
    name: Hyperliquid
    tag: Assistance Fund, 97% fees → HYPE spot buyback
    formula: "USD value of HYPE spot fills credited to the Assistance Fund 0xfefe…fefe over the rolling 7d window, divided by 97% of DeFiLlama's hyperliquid fees for the same window."
    queries:
      p50: ocb_buyback_ratio{protocol="hyperliquid",window="7d"}
      p90: ocb_buyback_ratio{protocol="hyperliquid",window="7d"}
      p99: ocb_buyback_ratio{protocol="hyperliquid",window="7d"}
      mean: ocb_buyback_ratio{protocol="hyperliquid",window="7d"}
      success: clamp_min(clamp_max(1 - 300 * sum(rate(ocb_buyback_scrape_errors_total{protocol="hyperliquid"}[24h])), 1), 0)
      sample_size: ocb_buyback_executed_usd{protocol="hyperliquid",window="7d"}
      series: ocb_buyback_ratio{protocol="hyperliquid",window="7d"}

  - slug: sky
    name: Sky (Maker)
    tag: Smart Burn Engine, 100% surplus → SKY via Uniswap
    formula: "USD value of SKY ERC-20 inflows to the SBE 0xBE8E…98FB over 7d (Etherscan v2, priced at CoinGecko), divided by 100% of DeFiLlama's makerdao fees for the same window."
    queries:
      p50: ocb_buyback_ratio{protocol="sky",window="7d"}
      p90: ocb_buyback_ratio{protocol="sky",window="7d"}
      p99: ocb_buyback_ratio{protocol="sky",window="7d"}
      mean: ocb_buyback_ratio{protocol="sky",window="7d"}
      success: clamp_min(clamp_max(1 - 300 * sum(rate(ocb_buyback_scrape_errors_total{protocol="sky"}[24h])), 1), 0)
      sample_size: ocb_buyback_executed_usd{protocol="sky",window="7d"}
      series: ocb_buyback_ratio{protocol="sky",window="7d"}

# GMX is intentionally excluded from v1. V2 does not run a single
# on-market buyback wallet whose inflows we can audit, fees flow
# to GLP / GM pool LPs (paid in ETH and stables) and to GMX stakers
# via esGMX reward distributors. The original treasury
# 0x68863dDE…dea6A has been dormant since 2022-08 (verified on
# Etherscan v2). v2 of this bench will add Jupiter Litterbox Trust
# (50% of Jupiter fees → on-market JUP buyback on Solana) and
# Aave AFC once the executor addresses are confirmed.
