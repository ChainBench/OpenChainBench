# OpenChainBench. Bench № 018

slug: buyback-audit
number: "018"
title: DeFi token buyback tracker, live executed vs promised ratio
seo_title: "DeFi buyback tracker 2026"
seo_description: "DeFi token buyback tracker: executed vs promised ratio, verified onchain and live. Hyperliquid HYPE, Sky SKY and more protocols held accountable."
subtitle: Executed USD over promised USD for live on-chain buyback programs, computed against destination-wallet inflows over rolling 7-day and 30-day windows.
category: Trading
status: live
metric: Execution ratio
unit: pct
higher_is_better: true

disclaimer: |
  Two caveats. (1) A low ratio is not a protocol failure. Some programs (Sky SBE) batch executions, so the executed_usd line is lumpy and routinely sits well below promised_usd inside a rolling window even though the long-run ratio converges to ~1. (2) The Sky leg requires an ETHERSCAN_API_KEY on the harness host. Without it the executed side returns 0 and the ratio reads 0; the live deployment has the key set.

seo_intro: |
  This benchmark answers the question every long-term token holder
  asks but almost no one measures. when a protocol says "we use 97%
  of our fees to buy back the token", does that actually show up
  on-chain, and over what window. The industry standard answer is
  "yes" plus a marketing blog post. The on-chain reality is a ratio:
  USD value of tokens the destination wallet actually received,
  divided by USD value the promise implies given the protocol's
  reported revenue over the same window. We compute that ratio for
  two of the largest live programs in DeFi. Hyperliquid's Assistance
  Fund (the multisig at `0xfefe…fefe` that takes 97% of HyperCore
  fees and spot-buys HYPE on the native order book) and Sky's
  Smart Burn Engine (the `0xBE8E…98FB` SBE contract that pulls the
  Maker / Sky protocol surplus and market-buys SKY through Uniswap).
  The promised side is reconstructed from DeFiLlama's per-protocol
  fees endpoint, scaled by the protocol's stated buyback share. The
  executed side is the actual ERC-20 (or native HYPE) inflow into
  the destination wallet over the same window, priced at CoinGecko.
  The leaderboard surfaces the live ratio over both 7-day and 30-day
  rolling windows so readers can see both the short-term execution
  rhythm (where batched programs look low) and the long-run accrual
  (where programs that actually run the trade converge near 1.0).

abstract: |
  We measure live token buyback execution ratio by independently
  reconstructing the two sides of the equation. Promised USD comes
  from DeFiLlama's protocol fees endpoint, summed over a rolling
  window and multiplied by the protocol's publicly stated buyback
  share (Hyperliquid 97%, Sky SBE 100% of the surplus stream).
  Executed USD comes from the destination wallet's actual token
  inflows over the same window, HYPE spot fills credited to the
  Assistance Fund on HyperCore for Hyperliquid, SKY ERC-20 transfers
  into the SBE address on Ethereum mainnet for Sky, priced at the
  CoinGecko per-token spot at scrape time. The ratio
  `executed_usd / promised_usd` is the headline number. Two windows
  (7d, 30d) are tracked so readers can separate execution cadence
  (a batched program looks low on 7d, closer to long-run on 30d)
  from sustained delivery. GMX V2 is intentionally excluded because
  it does not run a single auditable on-market buyback wallet, fees
  flow to GLP / GM LPs in ETH and stables and to esGMX reward
  distributors, so the on-chain footprint of "buyback" is structurally
  unmeasurable with the methodology used here.

methodology:
  - "Promised USD, DeFiLlama `summary/fees/<protocol>` endpoint, summed over the rolling window, multiplied by the protocol's documented buyback share. Hyperliquid: `hyperliquid` slug, share 0.97 (HyperCore fees → Assistance Fund). Sky: `makerdao` slug, share 1.00 (Maker / Sky protocol surplus → SBE)."
  - "Executed USD, Hyperliquid, HYPE buys credited to the Assistance Fund multisig `0xfefefefefefefefefefefefefefefefefefefefe` on HyperCore, retrieved from the Hyperliquid `info` API user fills endpoint. Quantity is converted to USD using the on-chain oracle price returned by `metaAndAssetCtxs` because that is the price the AF actually pays at execution, not a CEX index."
  - "Executed USD, Sky, SKY ERC-20 inflows into the SBE receiver `0xBE8E3e3618f7474F8cB1d074A26afFef007E98FB` on Ethereum mainnet, paginated through Etherscan v2 (`chainid=1`, single API key for the whole multichain unified endpoint). Quantity is decoded with the SKY contract's 18 decimals and priced at the CoinGecko `sky` spot at scrape time."
  - "Windows, rolling 7d and 30d. The harness recomputes the full window's sums each scrape rather than maintaining a delta, so historical revisions of DeFiLlama's fees series propagate automatically and no state leaks across restarts."
  - "Cadence, 5 minutes per protocol. The numbers are gauges, not counters; sub-5-minute resolution is meaningless because both promised and executed sides are bounded by minutes-to-hours-grain upstream data (DeFiLlama daily aggregation, on-chain block time)."
  - "Excluded, GMX. V2 does not run a single on-market buyback wallet whose inflows we can audit. Fees flow to GLP / GM pool LPs in ETH and stables and to GMX stakers via esGMX reward distributors. The original treasury `0x68863dDE…dea6A` has been dormant since 2022-08 (verified via Etherscan v2), so there is no executor address that would let an audit of this shape resolve. v2 of this bench will add Jupiter Litterbox Trust (50% fees → JUP buyback on Solana) and Aave AFC as cleaner replacements."
  - "Pricing, CoinGecko free tier (`hyperliquid`, `sky`) for the executed-side USD valuation. For Hyperliquid the on-chain oracle from `metaAndAssetCtxs` is preferred when available because that is the AF's actual fill reference, not a delayed third-party median. Aggregator drift between CoinGecko and the on-chain oracle is typically < 50 bps and is dwarfed by the ratio's own measurement scale."
  - "Honesty boundary, the ratio measures execution against a documented promise. It does not measure whether the promise itself is generous or stingy, whether the bought-back token is held vs burned vs redistributed, or whether the buy was timed adversarially. Those are separate benchmarks that this one explicitly does not try to answer."

findings:
  - "{{best_name}} currently leads at {{best_p50}} (execution ratio, 7d) across {{count}} measured buyback programs. The ratio is the USD value of tokens actually credited to the destination wallet over the window, divided by the USD value the published promise implies given DeFiLlama's reported fee revenue over the same window."
  - "{{name:hyperliquid}} returns {{p50:hyperliquid}} (execution ratio, 7d). The Assistance Fund executes HYPE spot buys on HyperCore on a near-continuous cadence as HyperCore fees accrue, so the 7-day window stays close to the long-run delivery. Persistent gap from 1.0 reflects timing between fee accrual and AF execution plus a small CoinGecko-vs-oracle pricing drift on the executed side."
  - "{{name:sky}} sits at {{p50:sky}} (execution ratio, 7d). This is not under-delivery, the Smart Burn Engine pulls surplus and market-buys SKY via Uniswap on a batched schedule, so the executed line is lumpy by design. The SBE often spends most of a 7d window accumulating surplus inside Maker and concentrates buys into shorter windows, so the rolling ratio reads low even when long-run accrual converges closer to 1.0."
  - "The 7d vs 30d split is where this bench earns its keep. A program that delivers on long-run promises but executes lumpily (Sky) shows a 7d well below 30d; a program that executes near-continuously (Hyperliquid) shows the two windows close to each other. Comparing the two columns is the cheapest tell for which protocol runs the trade on a tick basis vs which one batches."
  - "GMX is absent by design. The V2 design does not pay fees into a single on-market buyback wallet, they flow to GLP / GM pool LPs in ETH and stables and to GMX stakers via esGMX reward distributors. An audit of `executed_usd / promised_usd` shape would have nothing on-chain to point at, so reporting a number would be dishonest. v2 of this bench will add Jupiter Litterbox Trust and Aave AFC."

faq:
  - q: "What is a token buyback execution ratio?"
    a: "It is the USD value of tokens that the protocol's destination buyback wallet actually received over a rolling window, divided by the USD value the protocol's published promise implies given the protocol's own fee revenue over the same window. A ratio of 1.0 means the program delivered exactly what the promise scaled to. Above 1.0 means the program executed more than the promise (rare, usually a window-edge effect or a one-off top-up). Below 1.0 means either the program is batched and the executed side is mid-cycle, or the executor address fell behind, or the documented share overstates what the program actually pays out. The benchmark reports the ratio at 7d and 30d so readers can distinguish 'mid-batch' from 'under-delivering'."
  - q: "Why is Sky's ratio so much lower than Hyperliquid's?"
    a: "Cadence, not generosity. Hyperliquid's Assistance Fund executes HYPE buys on HyperCore as the protocol's fee stream accrues, so the executed line is roughly continuous and a 7-day window reads close to the long-run delivery. Sky's Smart Burn Engine pulls surplus DAI from the Maker / Sky protocol and market-buys SKY through Uniswap on a batched schedule, the SBE can sit for days accumulating surplus and then concentrate the on-market buys into shorter windows, so a 7-day snapshot taken mid-accumulation shows a low ratio. The 30-day window damps the effect but does not eliminate it because the batch frequency is irregular. Long-run delivery against the 100% surplus promise tracks closer to 1.0, the rolling ratio is a cadence signal, not a delivery verdict."
  - q: "Why isn't GMX in this benchmark?"
    a: "GMX V2 does not run a single on-chain buyback wallet whose inflows can be audited the way Hyperliquid's Assistance Fund or Sky's SBE can. V2 fees flow to GLP / GM pool LPs (paid out in ETH and stables) and to GMX stakers via the esGMX reward distributor system. There is no executor address that aggregates 'bought back GMX' on a measurable cadence. The original GMX treasury at `0x68863dDE…dea6A` has been dormant since August 2022 (verified via Etherscan v2). Reporting a ratio for GMX with this methodology would either be zero by construction or require imputing the buyback equivalent from staker-side distributions, which is a different benchmark. v2 of this bench will add Jupiter Litterbox Trust (50% of Jupiter fees → JUP buyback on Solana) and Aave's AFC once the executor addresses are confirmed."
  - q: "How accurate is the on-chain measurement?"
    a: "The executed-side measurement is exact at the chain level, the SBE address holds the SKY Etherscan reports, the AF address holds the HYPE the Hyperliquid `info` API reports. Three noise sources sit on top. (1) Pricing, executed is USD-valued at scrape time, not at fill time, so a token that pumped between fill and scrape over-prices the executed side; drift is typically < 1% over a 5-minute window. (2) Promised, DeFiLlama's fees series occasionally revises historical days, and the harness recomputes the full window each scrape, so the ratio can move on prior-day revisions independent of fresh execution. (3) Pagination, the Etherscan v2 query for Sky paginates through transfers and any missing page would understate executed; `ocb_buyback_scrape_errors_total` surfaces failures."
  - q: "Where does the 97% / 100% promise share come from?"
    a: "Hyperliquid's 97% comes from the protocol's published fee allocation: 97% of HyperCore fees route to the Assistance Fund for HYPE buybacks, with the remainder funding HLP and other on-chain mechanisms. Sky's 100% reflects the Smart Burn Engine's design, the SBE is supposed to consume the entire Maker / Sky protocol surplus stream and convert it into on-market SKY purchases via Uniswap. Both numbers are the protocols' own published commitments; if either changes the harness config updates the share constant and the ratio rebases automatically against the new promise. The benchmark does not opine on whether 97% vs 100% is the 'right' share for a buyback program, it only measures whether the share that was promised showed up."
  - q: "How is this bench different from a simple 'tokens burned per week' chart?"
    a: "A burn chart shows what the destination wallet did with the tokens it received. This bench shows whether the destination wallet received what the protocol promised it would. Those are different questions and answer different concerns. A burn chart with healthy burns tells you the supply mechanic is working; a low execution ratio with healthy burns can still mean the protocol's promise is being under-funded relative to fees, just that the small amount that does arrive gets cleanly burned. The reverse is also true, a high execution ratio with no burns means the destination wallet is accumulating, which can be by design (the SBE holds SKY before burning in batches) or a warning sign (a treasury that promises buyback but never actually retires supply). The two numbers complement each other; OCB tracks the upstream one because it is the harder one to fake."
  - q: "How often does this bench update?"
    a: "Every 5 minutes per protocol. The numbers are gauges over rolling 7-day and 30-day windows, so sub-5-minute resolution would not surface anything new, both the DeFiLlama promised side and the destination-wallet executed side are bounded by minutes-to-hours upstream cadences. The full window is recomputed on each scrape rather than carrying a running delta, so the ratio reacts immediately to DeFiLlama historical revisions or to a freshly indexed Etherscan transfer without needing a backfill pass."

