      mean: sum(rate(quote_api_latency_milliseconds_sum{provider="jupiter"}[24h])) / sum(rate(quote_api_latency_milliseconds_count{provider="jupiter"}[24h]))
      success: sum(rate(quote_api_status_codes_total{provider="jupiter", status_code=~"2.."}[24h])) / sum(rate(quote_api_status_codes_total{provider="jupiter"}[24h]))
      sample_size: sum(increase(quote_api_status_codes_total{provider="jupiter"}[24h]))
      series: histogram_quantile(0.50, sum by (le) (rate(quote_api_latency_milliseconds_bucket{provider="jupiter"}[1h])))

