# OpenChainBench — Bench № 001
# Self-contained spec: editorial metadata + Prometheus queries.
# Schema: src/lib/spec-schema.ts · Validate: pnpm validate

slug: aggregator-quote-latency
number: "001"
title: DEX Aggregator — Quote Latency
subtitle: End-to-end response time of swap-quote APIs across the leading DEX aggregators.
category: Aggregators
status: live
metric: Quote latency
unit: ms

abstract: |
  We benchmark how long the major DEX-aggregator APIs take to return a usable
  swap quote across multiple chains. The harness issues identical requests
  from three regions (us-east, eu-west, sgp) and records p50, p90 and p99
  wall-clock latency along with the success rate. Failures and non-2xx
  responses are excluded from latency aggregates and counted toward success
  rate.

methodology:
  - "Chains: Base, BNB Chain, Solana."
  - "Regions: us-east, eu-west, sgp. Reported figures are the cross-region median; per-region figures appear in Fig. 3."
  - "Latency metric: histogram `quote_api_latency_milliseconds_bucket` (counters of requests by latency bucket)."
  - "Success rate: share of `quote_api_status_codes_total` responses with status `2xx` over the 24-hour window."
  - "Failures (non-2xx, timeout, malformed) are excluded from latency aggregates and counted toward success rate."
  - "Cardinality: ~33 active series across providers × chains × regions."

findings: []

source: https://github.com/OpenChainBench/OpenChainBench/tree/main/harnesses/aggregator-quote

prometheus:
  url: https://prometheus-production-0859.up.railway.app
  window: 24h

# Real metrics exposed by the aggregator-quote harness:
#   quote_api_latency_milliseconds_{bucket,sum,count}{provider, chain, region}
#   quote_api_status_codes_total{provider, chain, region, status_code}
#   quote_api_errors_total{provider, chain, region, error_type}
#
# Label is `provider=`. Label values currently scraped:
#   provider: codex | jupiter | kyberswap | lifi | mobula | openocean | paraswap
#   region:   us-east | eu-west | sgp
#
# Regions in the YAML use canonical names (`ap-southeast` for the sgp probe);
# the actual Prometheus label value is `sgp` so the queries pin that.

providers:
  - slug: mobula
    name: Mobula
    tag: Multi-DEX aggregator
    queries:
      p50: histogram_quantile(0.50, sum by (le) (rate(quote_api_latency_milliseconds_bucket{provider="mobula"}[24h])))
      p90: histogram_quantile(0.90, sum by (le) (rate(quote_api_latency_milliseconds_bucket{provider="mobula"}[24h])))
      p99: histogram_quantile(0.99, sum by (le) (rate(quote_api_latency_milliseconds_bucket{provider="mobula"}[24h])))
      mean: sum(rate(quote_api_latency_milliseconds_sum{provider="mobula"}[24h])) / sum(rate(quote_api_latency_milliseconds_count{provider="mobula"}[24h]))
      success: sum(rate(quote_api_status_codes_total{provider="mobula", status_code=~"2.."}[24h])) / sum(rate(quote_api_status_codes_total{provider="mobula"}[24h]))
      sample_size: sum(increase(quote_api_status_codes_total{provider="mobula"}[24h]))
      series: histogram_quantile(0.50, sum by (le) (rate(quote_api_latency_milliseconds_bucket{provider="mobula"}[1h])))
      regions:
        - region: us-east
          p50: histogram_quantile(0.50, sum by (le) (rate(quote_api_latency_milliseconds_bucket{provider="mobula", region="us-east"}[24h])))
        - region: eu-west
          p50: histogram_quantile(0.50, sum by (le) (rate(quote_api_latency_milliseconds_bucket{provider="mobula", region="eu-west"}[24h])))
        - region: ap-southeast
          p50: histogram_quantile(0.50, sum by (le) (rate(quote_api_latency_milliseconds_bucket{provider="mobula", region="sgp"}[24h])))

  - slug: jupiter
    name: Jupiter
    tag: Solana
