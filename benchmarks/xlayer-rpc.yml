# OpenChainBench. Bench № 140

slug: xlayer-rpc
number: "140"
title: Fastest free X Layer RPC, live no-key EVM endpoint latency
seo_title: "Fastest free X Layer RPC 2026"
seo_description: "{{best_name}} leads free X Layer RPC at {{best_p50}} (`eth_getBlockByNumber` p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for the `eth_getBlockByNumber("latest", false)` method against every free, no-key public X Layer EVM endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  X Layer is a ZK-powered L2 blockchain (chain 196) built by OKX using the Polygon CDK and Aggregation Layer, bringing OKX users and the broader crypto ecosystem together, ETH gas token, ~2 s block cadence, Ethereum settlement. Mainnet launched April 2024. The 2026-08-04 audit confirms {{count}} clean keyless providers: the X Layer official endpoint (rpc.xlayer.tech), dRPC (xlayer.drpc.org), and Thirdweb (196.rpc.thirdweb.com). Excluded: Ankr (no X Layer route), Alchemy (key required), QuickNode (key required).

abstract: |
  X Layer: {{count}} free public RPC endpoints answering `the chain's head call` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:xlayer-official}}.
  We measure the round-trip latency of a single, identical JSON-RPC call (`eth_getBlockByNumber("latest", false)`) against every no-key public X Layer endpoint that sustains continuous probing, {{count}} providers measured, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with an X Layer-scaled staleness gap (20 blocks at X Layer's ~2 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the X Layer-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\", false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the rotating id defeats edge caches that would answer a bare head query without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the X Layer-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"xlayer\"`. Provider coverage: {{count}} no-key endpoints."

faq:
  - q: "What is the fastest free X Layer RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (`eth_getBlockByNumber(\"latest\", false)` p50 over the last 24h), measured against {{count}} no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples. Use the region tabs to see the leader from the origin closest to your deployment."
  - q: "Which X Layer RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing: X Layer official (https://rpc.xlayer.tech), dRPC (https://xlayer.drpc.org), and Thirdweb (https://196.rpc.thirdweb.com). Every listed endpoint was live-verified with a `eth_getBlockByNumber` POST returning a parsable response before inclusion."
  - q: "How is X Layer RPC latency measured here, technically?"
    a: "One identical `eth_getBlockByNumber(\"latest\", false)` POST every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="xlayer"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: xlayer-official
    name: X Layer
    endpoint: https://rpc.xlayer.tech
    tag: OKX official public RPC for X Layer mainnet
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber(\"latest\", false)` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to X Layer's no-key official RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="xlayer-official", chain="xlayer"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="xlayer-official", chain="xlayer"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="xlayer-official", chain="xlayer"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="xlayer-official", chain="xlayer"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="xlayer-official", chain="xlayer"}) / sum(ocb:rpc_call:rate_24h{provider="xlayer-official", chain="xlayer"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="xlayer-official", chain="xlayer"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="xlayer-official", chain="xlayer"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="xlayer-official", chain="xlayer", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="xlayer-official", chain="xlayer", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="xlayer-official", chain="xlayer", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="xlayer-official", chain="xlayer", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="xlayer-official", chain="xlayer", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="xlayer-official", chain="xlayer", region="sgp"}[1h])

