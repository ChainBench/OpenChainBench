# OpenChainBench. Bench № 029

slug: solana-dex-quote-latency
number: "029"
title: Fastest Solana DEX quote API
seo_title: "Fastest Solana DEX quote API in 2026: Jupiter vs Mobula vs OpenOcean vs Raydium"
seo_description: "Live ms latency benchmark for Solana DEX aggregator quote APIs. Jupiter, Mobula, OpenOcean and Raydium probed every 60s from 3 regions, p50/p90/p99 over a 24h window."
subtitle: Wallclock milliseconds from quote request to usable quote response.
category: Aggregators
status: live
metric: Quote latency
unit: ms

seo_intro: |
  Solana DEX aggregators sit on the hot path of every swap a wallet,
  trading UI or routing front-end builds. A quote API that takes 600 ms
  pushes a perceptible delay onto the user; a quote API at 80 ms feels
  instant. This benchmark measures the wall-clock latency of the
  request-response round trip on each major Solana DEX aggregator's
  quote endpoint, against the tokens that are *actually trending right
  now* on Solana. Every 60 seconds the harness picks a fresh bonded
  token from Mobula Pulse V2's live WebSocket feed (post-bonding-curve
  graduates from Pump.fun, Meteora, Raydium LaunchLab and friends) and
  asks each provider for a 100 USDC → tokenOut quote at 1% slippage.
  Rotating against newly-trending tokens defeats every per-pair edge
  cache and forces each provider to actually search a route, so the
  recorded number reflects routing-search cost rather than a CDN hit.
  Liquidity-gap failures (a provider that can't route the picked token
  at all) land on their own counter and are excluded from the latency
  histogram, so a provider that fails fast on long-tail coverage isn't
  penalised on the percentiles.

abstract: |
  We measure the wallclock latency of the Solana DEX aggregator quote APIs
  on freshly-trending tokens. Every 60 seconds the harness picks one token
  from a sliding 30-minute window of Mobula Pulse V2 bonded events on
  Solana, then sends an identical 100 USDC → tokenOut quote (1% slippage,
  no fee, no referrer) to each provider from three Railway regions and
  records the time from request dispatch to the first byte of a response
  that contains a usable quoted output amount.

methodology:
  - "Providers measured: Jupiter, Mobula, OpenOcean, Raydium. (DFlow added when partnership API key is available.)"
  - "Canonical request: 100 USDC → tokenOut at 1% slippage. The tokenOut rotates every tick (see below)."
  - "Token rotation (Pulse-fed). A persistent WebSocket to Mobula Pulse V2 (bonded view, Solana) maintains a 30-min sliding pool of trending bonded tokens, typically 50-300 active mints. Each tick picks one at random. A REST snapshot fallback (`market/query` volume ranks 6-55) refreshes every 10 min for Pulse outages. In steady state every tick is sourced from the WS feed."
  - "Cadence: one quote per provider per region every 60 seconds. 1,440 samples per provider per region per day."
  - "Regions: us-east, eu-west, sgp."
  - "Latency definition: wallclock from HTTP request dispatch to the first byte of a response body that includes the quoted output amount (Jupiter `outAmount`, Mobula `data.amountOutTokens`, OpenOcean `data.outAmount`, Raydium `data.outputAmount`). The HTTP client reuses TCP + TLS connections across ticks (warm-path), matching how a long-running backend integration actually consumes the API. The bench measures steady-state round-trip cost, not the first-request cold-start penalty."
  - "Failure classes. Each non-success outcome lands on exactly one counter and is excluded from the latency histogram: `solana_quote_throttled_total` (HTTP 429), `solana_quote_auth_error_total` (401/403), `solana_quote_no_route_total` (provider can't route the picked token), `solana_quote_other_error_total` (network/timeout/parse). Each provider's no-route signal is verified: Jupiter NO_ROUTES_FOUND, Mobula 'No route found', Raydium INSUFFICIENT_LIQUIDITY, OpenOcean payload-level."
  - "Raydium scope. Raydium's compute API is single-venue (Raydium AMM v4 / CPMM / CLMM only) and does not multi-hop via SOL like Jupiter or Mobula. On Pulse-fed bonded tokens (mostly Pump.fun graduates living on PumpSwap, plus Meteora and Orca pools) it returns no-route ~80% of the time. That's an honest coverage signal and surfaces on the success-rate column, not as latency outliers."
  - "Direct egress from Railway, no residential proxy. The bench measures backend-to-backend latency as a real integration would see it."
  - "Histogram buckets: 10, 25, 50, 100, 200, 500, 1000, 2000, 5000 ms."

findings:
  - "{{best_name}} leads at {{best_p50}} (p50, 24 h) across {{count}} measured Solana DEX quote APIs. The headline is the cross-region median across a rotating long-tail token target; the per-region tabs below show where each provider's infrastructure actually sits."
  - "{{name:jupiter}} returns quotes in {{p50:jupiter}} (p50, 24 h). Without an SOL ↔ USDC edge-cache shortcut to lean on, Jupiter's lite endpoint is doing the real routing search every tick. That's the steady-state number a long-running backend integration would actually see."
  - "{{name:mobula}} returns quotes in {{p50:mobula}} (p50, 24 h). Mobula's quote API runs a live multi-DEX routing search per request, no per-pair body caching, so the gap to providers that historically cached the canonical 1 SOL → USDC pair closes once the bench rotates targets."
  - "{{name:openocean}} returns quotes in {{p50:openocean}} (p50, 24 h). OpenOcean's v4 Solana endpoint runs a separate multi-DEX path engine; the routing search dominates the latency curve on long-tail tokens."
  - "{{name:raydium}} returns quotes in {{p50:raydium}} (p50, 24 h). Raydium's Trade API is a single-venue compute endpoint (Raydium pools only). It cannot multi-hop via SOL, so it no-routes on long-tail tokens whose dominant liquidity lives elsewhere (Pump.fun, Meteora, Orca). Latency below is the conditional p50 on the subset of tokens it does cover."
  - "p99 is the integration-grade number. {{p99:jupiter}} / {{p99:mobula}} / {{p99:openocean}} / {{p99:raydium}} is what a swap UI feels when a region spikes or a provider's route engine churns."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/solana-quote-latency

prometheus:
  window: 24h
  freshness_metric: solana_quote_latency_ms_count

# Region selector, tabs at the top of the page. Server-side injects
# `region="X"` into every PromQL query for the active tab. The special
# value `all` skips the filter and aggregates across every region.
# Values match the raw harness labels emitted by the MONITOR_REGION env
# var on each Railway service.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

# Exact per-region rankings for scoped badges. One query, one sample per
# (provider, region) cell.
rank_matrix_query: avg by (provider, region) (ocb:solana_quote_latency_ms:p50_24h)

faq:
  - q: "Which Solana DEX has the fastest quote API right now?"
    a: "{{best_name}} currently returns quotes the fastest at {{best_p50}} (p50, 24 h) across {{count}} measured providers. The leaderboard re-sorts every 60 seconds against fresh samples and rotates the target token each tick so no provider can serve from edge cache. The answer reflects 24 hours of measured latency across us-east, eu-west and sgp, not a marketing-page claim."
  - q: "What is quote latency on a DEX aggregator?"
    a: "Quote latency is the wallclock time between a swap UI asking a DEX aggregator 'what would I get if I traded 100 USDC for this token right now?' and the aggregator answering with a usable routed price. A quote API at 80 ms feels instant to the user; a quote API at 600 ms introduces a visible delay between input change and updated output. The number sets the floor on how live a swap UI can feel before any other latency (RPC, signing, broadcast) is added."
  - q: "Why does the bench rotate the target token instead of always quoting SOL → USDC?"
    a: "SOL → USDC is the most-cached pair on Solana: Jupiter's lite endpoint serves it from a CloudFront edge in 30-50 ms, but that measures cache hit, not routing. Rotating the target every tick, and rotating against the tokens that are *actually trending right now* via Mobula Pulse V2's bonded WebSocket feed, defeats every per-pair edge cache and forces each provider to actually run a routing search. The metric becomes a fair comparison of routing engines, not CDN configurations."
  - q: "How is quote latency measured on OpenChainBench?"
    a: "A harness in each of three Railway regions (us-east, eu-west, sgp) ticks every 60 seconds: it picks one Solana token from a sliding 30-minute window of bonded tokens emitted by Mobula Pulse V2 over WebSocket, then asks each provider for a 100 USDC → tokenOut quote at 1% slippage in parallel. The HTTP client reuses TCP and TLS connections across ticks, so the recorded number is the steady-state round-trip a long-lived backend integration sees, not the one-off cold-start handshake. The wallclock from request dispatch to the first byte containing a usable quoted output amount is the recorded latency. p50, p90 and p99 are aggregated via Prometheus `histogram_quantile` over 24 hours."
  - q: "What if a provider can't quote a particular long-tail token?"
    a: "It's counted as a no-route, not as a slow quote. Each provider has a recognisable 'I have no path for this pair' signal (Jupiter `NO_ROUTES_FOUND` / `TOKEN_NOT_TRADABLE`, Mobula `No route found` / `Token not found`, Raydium `INSUFFICIENT_LIQUIDITY` / `ROUTE_NOT_FOUND`, OpenOcean payload-level signal). When the harness sees it, the tick lands on `solana_quote_no_route_total` and is excluded from the latency histogram entirely, so providers that fail fast on coverage gaps aren't penalised on the percentiles. The success-rate column reflects the no-route rate honestly."
  - q: "Why does Raydium have a much lower success rate than the aggregators?"
    a: "Raydium's compute endpoint is single-venue: it only routes against Raydium's own AMM v4 / CPMM / CLMM pools and does not multi-hop via SOL the way Jupiter or Mobula do. Because the rotation now pulls from Mobula Pulse V2's bonded feed (most of which are Pump.fun graduates living on PumpSwap, plus Meteora and Orca pools), Raydium returns INSUFFICIENT_LIQUIDITY or ROUTE_NOT_FOUND on roughly 80% of picks. That's accurate: Raydium's API is a Raydium-pool route engine, not an aggregator. The latency column for Raydium is the conditional p50 over the small subset of bonded tokens that happen to have a Raydium pool."
  - q: "Are authentication errors and rate limits counted as 'slow'?"
    a: "No. HTTP 401/403/429 responses are excluded from the latency histogram entirely. They are counted in separate counters (`solana_quote_auth_error_total`, `solana_quote_throttled_total`) which show up on the success rate column. A provider that's fast but rate-limits us at the configured cadence loses points on success rate, not on latency."

providers:
  - slug: jupiter
    name: Jupiter
    tag: DEX aggregator (REST)
    formula: "Median wallclock ms over 24h on Jupiter's `lite-api.jup.ag/swap/v1/quote` for 100 USDC → <rotating long-tail token> at 1% slippage. Recorded only on 200 + non-empty `outAmount`. No-route ticks excluded."
    queries:
      p50: avg(ocb:solana_quote_latency_ms:p50_24h{provider="jupiter"})
      p90: avg(ocb:solana_quote_latency_ms:p90_24h{provider="jupiter"})
      p99: avg(ocb:solana_quote_latency_ms:p99_24h{provider="jupiter"})
      mean: sum(ocb:solana_quote_latency_ms:sum_rate_24h{provider="jupiter"}) / sum(ocb:solana_quote_latency_ms:count_rate_24h{provider="jupiter"})
      success: avg(ocb:solana_quote_success:avg_24h{provider="jupiter"})
      sample_size: sum(ocb:solana_quote_latency_ms:count_increase_24h{provider="jupiter"})
      series: histogram_quantile(0.50, sum by (le) (rate(solana_quote_latency_ms_bucket{provider="jupiter"}[1h])))
      regions:
        - region: us-east
          p50: avg(ocb:solana_quote_latency_ms:p50_24h{provider="jupiter", region="us-east"})
          series: histogram_quantile(0.50, sum by (le) (rate(solana_quote_latency_ms_bucket{provider="jupiter", region="us-east"}[1h])))
        - region: eu-west
          p50: avg(ocb:solana_quote_latency_ms:p50_24h{provider="jupiter", region="eu-west"})
          series: histogram_quantile(0.50, sum by (le) (rate(solana_quote_latency_ms_bucket{provider="jupiter", region="eu-west"}[1h])))
        - region: sgp
