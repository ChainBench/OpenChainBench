# OpenChainBench. Bench № 180

slug: quicksilver-rpc
number: "180"
title: Fastest free Quicksilver RPC, live no-key endpoint latency
seo_title: "Fastest free Quicksilver RPC 2026"
seo_description: "{{best_name}} leads free Quicksilver RPC at {{best_p50}} (Tendermint status p50, 24h). 3 no-key providers measured every 60s from 3 regions."
subtitle: HTTP round-trip latency for the Tendermint status method against every free, no-key public Quicksilver Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Quicksilver (quicksilver-2) is a Cosmos SDK ICS (Interchain Security) liquid staking protocol providing qATOM, qOSMO, qSTARS, and other IBC-connected staked representations, QCK staking token, CometBFT consensus. Polkachu, PublicNode, and the Quicksilver Foundation provide keyless Tendermint RPC endpoints probed every 60 seconds from three regions.

abstract: |
  Per-chain member of the RPC latency cluster, extended to Quicksilver.
  We measure the round-trip latency of a single, identical Cosmos SDK call
  (Tendermint `status`) against every no-key public Quicksilver endpoint
  that sustains continuous probing, 3 providers at launch,
  every 60 seconds, from us-east, eu-west and Singapore. The harness
  classifies every response (ok / http_err / jsonrpc_err / stale /
  timeout) so the leaderboard rewards sustained availability rather than
  fast error messages. The cross-chain view lives on the parent
  `rpc-capabilities` benchmark; this page is the Quicksilver-scoped answer
  with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"status\",\"params\":[]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency: client-side round-trip delta in milliseconds, exposed as both a gauge and a histogram (buckets 50 ms to 10 s), so percentiles are computed via Prometheus `quantile_over_time` over the last 24 hours."
  - "Call-result classification: `ok` (HTTP 200 + non-empty result with a parsable decimal `sync_info.latest_block_height`), `http_err`, `jsonrpc_err`, `stale` (more than 40 blocks behind the cross-provider tip), `timeout`."
  - "This page is part of the per-chain RPC cluster derived from the cross-chain [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities) benchmark; the identical harness, cadence and exclusion rules apply on every chain."
  - "Chain scope: every query on this page is pinned to `chain=\"quicksilver\"`. Provider coverage at launch: 3 no-key endpoints (Polkachu, PublicNode, Quicksilver Foundation)."

findings:
  - "{{best_name}} currently leads free Quicksilver RPC at {{best_p50}} (Tendermint `status` p50, 24h) across 3 measured providers."

faq:
  - q: "What is the fastest free Quicksilver RPC right now?"
    a: "{{best_name}} currently leads at {{best_p50}} (Tendermint `status` p50 over the last 24h), measured against 3 no-key providers probed every 60 seconds from us-east, eu-west and Singapore. The leaderboard re-sorts continuously against fresh Prometheus samples."
  - q: "Which Quicksilver RPCs work without an API key?"
    a: "3 endpoints sustain continuous keyless probing at launch: Polkachu, PublicNode, and Quicksilver Foundation. Every listed endpoint was live-verified before inclusion."
  - q: "Does the fastest Quicksilver RPC change by region?"
    a: "Often. The region tabs at the top of the page re-scope every number to a single origin; pick the one closest to where your requests originate."
  - q: "How is Quicksilver RPC latency measured here?"
    a: "One identical Tendermint `status` POST every 60 seconds against each provider from each of 3 regions. Responses are classified so an endpoint stuck on an old block is never ranked as fastest."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="quicksilver"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: polkachu
    name: Polkachu
    tag: Community Cosmos validator and public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Polkachu's no-key Quicksilver endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="quicksilver"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="polkachu", chain="quicksilver"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="polkachu", chain="quicksilver"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="polkachu", chain="quicksilver"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="polkachu", chain="quicksilver"}) / sum(ocb:rpc_call:rate_24h{provider="polkachu", chain="quicksilver"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="polkachu", chain="quicksilver"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="quicksilver"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="quicksilver", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="quicksilver", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="quicksilver", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="quicksilver", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="quicksilver", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="quicksilver", region="sgp"}[1h])
  - slug: publicnode
    name: PublicNode
    tag: Non-profit public RPC by Allnodes
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Quicksilver endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="quicksilver"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="quicksilver"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="quicksilver"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="quicksilver"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="quicksilver"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="quicksilver"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="quicksilver"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="quicksilver"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="quicksilver", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="quicksilver", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="quicksilver", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="quicksilver", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="quicksilver", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="quicksilver", region="sgp"}[1h])
  - slug: quicksilver-official
    name: Quicksilver Foundation
    tag: Official Quicksilver Foundation public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to the Quicksilver Foundation's no-key endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="quicksilver-official", chain="quicksilver"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="quicksilver-official", chain="quicksilver"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="quicksilver-official", chain="quicksilver"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="quicksilver-official", chain="quicksilver"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="quicksilver-official", chain="quicksilver"}) / sum(ocb:rpc_call:rate_24h{provider="quicksilver-official", chain="quicksilver"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="quicksilver-official", chain="quicksilver"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="quicksilver-official", chain="quicksilver"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="quicksilver-official", chain="quicksilver", region="us-east"})
