# OpenChainBench. Bench № 054

slug: perp-execution-quality
number: "054"
title: Best DEX for a $BOT market order, live slippage ranked
seo_title: "Best DEX to trade $BOT, live orderbook slippage"
seo_description: "{{best_name}} leads $BOT slippage at {{best_p50}} for a $10,000 buy (24h avg). Lighter vs Hyperliquid HIP-3 (xyz:BOT), measured live from public orderbooks every 30 seconds."
subtitle: Effective slippage in basis points for a $10,000 market buy of $BOT perps, walked live on each DEX orderbook every 30 seconds. Lower means the venue fills the size closer to mid. Lighter native and Hyperliquid HIP-3 (xyz:BOT) are the two DEX venues currently listing $BOT.
category: Trading
status: live
metric: Effective slippage
unit: bps
higher_is_better: false

seo_intro: |
  $BOT is currently listed on two decentralized perp venues, Lighter and
  Hyperliquid HIP-3 (as `xyz:BOT`, deployed by third-party operator xyz).
  Rack-rate taker fees do not tell a trader which venue actually fills
  their market order closer to mid; the answer depends on the depth of
  the visible orderbook at the notional they want to trade, and both
  books move continuously. This benchmark polls the two public
  orderbook endpoints every 30 seconds, walks each side for a fixed set
  of USD notionals (from $100 up to $500,000), and publishes the
  effective slippage in basis points as a live gauge per venue, per side
  and per size. The headline number is the 24 hour average at the
  $10,000 buy bucket, which is the size a mid-sized $BOT trader is most
  likely to execute at market. CEX venues are not part of this bench;
  DefiLlama covers the CEX side of the audit.

abstract: |
  We measure the live execution quality of a $BOT market order across
  every DEX that lists $BOT as a perp. Every 30 seconds the harness
  polls Lighter `/api/v1/orderBookOrders?market_id=185` and Hyperliquid
  `POST /info {type:l2Book, coin:"xyz:BOT"}`, computes the top-of-book
  mid, then walks each side for a set of USD notional buckets to derive
  the size-weighted average execution price. Effective slippage is
  reported in basis points relative to mid, per venue, per side and per
  size. Books that lack the depth for a given size are excluded from
  the slippage series and only reported through
  `perp_execution_max_fillable_usd`. No trades are placed; every value
  is derived from public, unauthenticated REST endpoints.

methodology:
  - "Cadence: every 30 seconds, in parallel across both venues, 10 second timeout per fetch."
  - "Lighter: `GET https://mainnet.zklighter.elliot.ai/api/v1/orderBookOrders?market_id=185&limit=100` returns the top-100 asks and bids for the $BOT perp market."
  - "Hyperliquid HIP-3: `POST https://api.hyperliquid.xyz/info {\"type\":\"l2Book\",\"coin\":\"xyz:BOT\"}` returns the L2 book for the xyz-deployed BOT perp under HIP-3 permissionless listings."
  - "Mid price: (best_bid + best_ask) / 2 from the top of each book, per tick, per venue."
  - "Walk: for each USD notional bucket, iterate the sorted side, consuming `min(level_notional_usd, remaining_target_usd)` until target is filled; size-weighted average execution price is target_usd / total_base_filled."
  - "Slippage bps: (avg_execution_price - mid) / mid x 10000 on the buy side, mirrored on the sell side, sign-normalized so every published value represents cost to the trader."
  - "Buckets published: $100, $1,000, $5,000, $10,000, $25,000, $50,000, $100,000, $500,000. Both sides (buy, sell)."
  - "Depth fallback: if the visible book does not cover 99% of the requested size, the slippage series for that (venue, side, size) is dropped for that tick and `perp_execution_max_fillable_usd{side}` reports the ceiling instead."
  - "Headline. avg_over_time of `perp_execution_slippage_bps{asset=\"BOT\", side=\"buy\", size_usd=\"10000\"}` over 24h, per venue. A one-print spike does not move the ranking."
  - "Failures. A venue that errors or times out drops its `perp_execution_health` to 0 and increments `perp_execution_fetch_errors_total{error_type}`; the leaderboard tags it as stale."
  - "CEX venues are intentionally out of scope. Traders comparing against a Binance or Bybit fill should read DefiLlama for the CEX-side audit; the DEX bench does not aggregate what it cannot orderbook-walk from a public endpoint."

findings:
  - "{{best_name}} currently leads at {{best_p50}} of slippage on a $10,000 $BOT buy (24 h average) between the {{count}} DEX venues listing $BOT."
  - "{{name:lighter}} sits at {{p50:lighter}} on the same $10,000 bucket. Fully onchain orderbook on zk-rollup, zero taker fee, so the number is essentially the crossed half-spread plus depth impact."
  - "{{name:hyperliquid}} sits at {{p50:hyperliquid}} on the same $10,000 bucket. HIP-3 markets settle through the same HyperBFT orderbook engine as native Hyperliquid perps but liquidity is provided by the deployer-affiliated market maker, so depth can be thinner than on a native flagship pair."
  - "Both venues publish additional size buckets ($100 up to $500,000, both sides). The full grid is exposed via the raw `perp_execution_slippage_bps` series with the `size_usd` and `side` labels."
  - "$BOT is not currently listed on any other decentralized perp venue with a public orderbook endpoint. New listings will show up here automatically once their `(asset, venue)` pair is added to the harness config."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/perp-execution-scanner

prometheus:
  window: 24h
  expected_freshness_seconds: 300

faq:
  - q: "Which DEX has the best execution for a $BOT market order right now?"
    a: "{{best_name}} currently leads at {{best_p50}} of slippage on a $10,000 buy (24 h average). The leaderboard re-sorts every 30 seconds against fresh Prometheus samples so the answer reflects the last day of live orderbook walks on Lighter and Hyperliquid HIP-3 (`xyz:BOT`), not a marketing snapshot."
  - q: "Why is $BOT only tracked on two venues?"
    a: "Because those are the only two decentralized perp venues currently listing $BOT with a public orderbook endpoint: Lighter (market_id 185) and Hyperliquid HIP-3 under the `xyz:BOT` coin symbol. Native Hyperliquid does not have $BOT listed, so `coin=\"BOT\"` on `/info` returns nothing; the HIP-3 permissionless listing is the only path for $BOT on Hyperliquid infrastructure today."
  - q: "What is HIP-3 and how is `xyz:BOT` different from a native Hyperliquid perp?"
    a: "HIP-3 is Hyperliquid's permissionless perp listing standard: a third party (here `xyz`) stakes HYPE and deploys a perp market under a namespaced coin symbol, e.g. `xyz:BOT`. The orderbook is settled on the same HyperBFT infrastructure as native Hyperliquid perps, but liquidity is bootstrapped by the deployer rather than by the flagship Hyperliquid market-making stack, so depth on smaller HIP-3 markets is typically thinner."
  - q: "How is slippage computed here vs a raw quote?"
    a: "Every 30 seconds the harness fetches the top of book on each venue, walks the ask side (for a buy) or the bid side (for a sell), and consumes levels until the requested USD notional is filled. Effective execution price is size-weighted; slippage is (avg_exec - mid) / mid in basis points. This is exactly what a market order would cross assuming the visible book at tick time, no impact model on top."
  - q: "Why publish so many size buckets?"
    a: "Because execution quality is not linear in size. A venue that fills $1k with 1 bps of slippage can charge 200 bps at $50k if its book thins out fast. The bench publishes eight size buckets from $100 to $500,000 on both sides so a trader can pick the row that matches their intended clip."
  - q: "What about CEX venues like Binance or Bybit for $BOT?"
    a: "Out of scope for this bench. CEX taker fees and orderbook depth are covered by DefiLlama's aggregated stats for the CEX side. This bench answers a narrower question: given that a user wants to execute onchain, which DEX will fill their $BOT order closer to mid right now."
  - q: "What happens when the visible book cannot fill the requested size?"
    a: "The slippage series for that (venue, side, size) is dropped for that tick and `perp_execution_max_fillable_usd{side}` reports how much notional the book could actually clear, so the leaderboard does not silently print a misleading number when depth runs out."

providers:
  - slug: lighter
    name: Lighter
    tag: zk-rollup perp DEX, fully onchain orderbook
    formula: "Average over 24h of the effective slippage in bps for a $10,000 buy on Lighter's native $BOT orderbook, walked live every 30 seconds from `/api/v1/orderBookOrders?market_id=185`."
    queries:
      p50: avg_over_time(perp_execution_slippage_bps{asset="BOT", venue="lighter", side="buy", size_usd="10000"}[24h])
      p90: quantile_over_time(0.90, perp_execution_slippage_bps{asset="BOT", venue="lighter", side="buy", size_usd="10000"}[24h])
      p99: quantile_over_time(0.99, perp_execution_slippage_bps{asset="BOT", venue="lighter", side="buy", size_usd="10000"}[24h])
      mean: avg_over_time(perp_execution_slippage_bps{asset="BOT", venue="lighter", side="buy", size_usd="10000"}[24h])
      success: avg_over_time(perp_execution_health{asset="BOT", venue="lighter"}[24h])
      sample_size: count_over_time(perp_execution_slippage_bps{asset="BOT", venue="lighter", side="buy", size_usd="10000"}[24h])
      series: perp_execution_slippage_bps{asset="BOT", venue="lighter", side="buy", size_usd="10000"}

