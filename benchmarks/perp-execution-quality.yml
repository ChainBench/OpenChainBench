# OpenChainBench. Bench № 054
slug: perp-execution-quality
number: "054"
title: "Perp DEX execution quality: slippage on a $100k market order, live across orderbook venues"
seo_title: "Perp DEX slippage: {{best_name}} fills $100k ETH at {{best_p50}}"
seo_description: "{{best_name}} fills a $100k ETH market order at {{best_p50}} of slippage, {{worst_name}} at {{worst_p50}}. {{ranked_count}} of {{count}} orderbook DEXs ranked, books walked every 30 s."
subtitle: "Half-spread plus price impact in basis points to fill a $100,000 market buy against each venue's live orderbook, fee excluded, on ETH, BTC and SOL. Lower means the venue fills the size closer to mid. Books walked every 30 seconds across {{count}} orderbook perp DEXs, including Hyperliquid, Lighter, Aster, Extended, dYdX v4, Paradex, Ondo Perps, Polymarket and edgeX."
category: Trading
status: live
metric: Slippage at $100k
unit: bps
higher_is_better: false
seo_intro: |
  Rack-rate taker fees do not tell a trader which perp DEX fills a market
  order closer to mid: that depends on the depth of the visible orderbook
  at the notional being traded, and books move continuously. This
  benchmark isolates the execution component of the perp-fees bench: the
  same 30 second orderbook walks, the same $1k to $1M tiers, but with the
  taker fee taken out, so a zero-fee venue and a 5 bps venue are compared
  on depth alone. The headline is the $100,000 buy, the size where
  impact starts to separate venues (at $1,000 every deep book fills
  within a fraction of a basis point). ETH is the headline tab; BTC and
  SOL have their own rankings, and the $1k, $10k and $1M tiers are
  published as raw series. Oracle-priced venues (GMX v2, Gains) have no
  book to walk and are left out; their fixed spread parameter is part of
  their all-in figure on the perp-fees bench.
abstract: |
  Every 30 seconds the perp-fees harness fetches the public orderbook of
  each venue for ETH, BTC and SOL, computes the top-of-book mid and walks
  the ask side for $1,000, $10,000, $100,000 and $1,000,000 of notional,
  consuming levels until the size is filled. The size-weighted average
  execution price against mid, in basis points, is the slippage of a
  market buy at that size. The harness publishes the all-in cost per
  tier (perp_fees_all_in_bps_tier{venue,chain,notional}) and the taker
  fee (perp_fees_taker_fee_bps{venue,chain}); this bench subtracts the
  second from the first and ranks venues on the 24 hour average at the
  $100,000 tier. A tier the visible book cannot fill is dropped for that
  tick and counted in perp_fees_tier_skipped_total instead of being
  extrapolated. No trades are placed; every value comes from public,
  unauthenticated REST endpoints.
methodology:
  - "Cadence: every 30 seconds per venue and asset, 8 second timeout per fetch, from the perp-fees harness (bench 007). The metric is perp_fees_all_in_bps_tier{notional=\"100000\"} minus perp_fees_taker_fee_bps for the same venue and asset, averaged over 24 hours."
  - "Mid price: (best_bid + best_ask) / 2 from the top of each book at tick time. Slippage: (size-weighted average ask price filled - mid) / mid x 10,000, so half the quoted spread is part of the number and a one-tick book reads above zero."
  - "Walk: levels are consumed in price order, min(level_notional_usd, remaining_target_usd) at each, until $100,000 is filled. Books capped by the venue API (Paradex 100 levels, edgeX 200 levels) skip the tier when the visible depth cannot fill it (or, on Paradex, when the walk would eat more than 90 % of the visible side) rather than publish an inflated number."
  - "Book endpoints, part 1: Hyperliquid POST /info l2Book; Lighter GET /api/v1/orderBookOrders (100 levels); Aster GET /fapi/v1/depth (100 levels); Extended GET /api/v1/info/markets/{market}/orderbook; dYdX v4 indexer GET /v4/orderbooks/perpetualMarket/{ticker}."
  - "Book endpoints, part 2: Paradex GET /orderbook/{market}/interactive (the Retail book, RPI liquidity included, see perp-fees); Ondo Perps GET /v1/perps/depth (100 levels); Polymarket perps GET /v1/info/book (500 levels); edgeX GET /api/v2/public/quote/getDepth (200 levels)."
  - "Fee excluded on purpose: Lighter quotes 0 bps taker, Hyperliquid 4.5, Aster and dYdX 5, Extended and Ondo 2.5, Polymarket 4, edgeX 3.8, Paradex 0 on Retail orders. The all-in ranking with fees is the perp-fees bench; this page answers the depth question only."
  - "Oracle-priced venues excluded: GMX v2 and Gains price against an oracle with a fixed spread and impact parameter, there is no book to walk, so their tiers are flat and would read as zero or constant slippage. They stay on perp-fees where the fee and the spread parameter are counted together."
  - "Headline tier $100,000, tabs ETH, BTC, SOL. The $1,000, $10,000 and $1,000,000 tiers are available as raw series through perp_fees_all_in_bps_tier{notional} on the API and MCP surfaces."
  - "Failures: a venue that errors or returns an empty book drops perp_fees_health to 0 for that asset and increments perp_fees_fetch_errors_total{error_type}; the leaderboard tags it as stale and the 24 h average excludes the missing ticks."
findings:
  - "{{best_name}} fills a $100,000 ETH market buy at {{best_p50}} of slippage over mid (24 h average), the tightest book among the {{count}} orderbook venues; {{worst_name}} sits at {{worst_p50}}."
  - "{{name:hyperliquid}} reads {{p50:hyperliquid}} and {{name:lighter}} {{p50:lighter}} at $100k on ETH: the two deepest onchain books, where the number is mostly the crossed half-spread."
  - "{{name:aster}} reads {{p50:aster}} and {{name:extended}} {{p50:extended}}, within a basis point of the leaders at this size."
  - "{{name:dydx}} reads {{p50:dydx}}, {{name:ondo}} {{p50:ondo}}, {{name:polymarket}} {{p50:polymarket}}: thinner books where $100k already consumes several levels."
  - "The ranking changes with size. At $1,000 every venue fills within a few basis points; at $1,000,000 the gap between the deepest and the thinnest book is an order of magnitude. Read the tier that matches your clip."
source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/perp-fees
prometheus:
  window: 24h
  expected_freshness_seconds: 300
  freshness_metric: perp_fees_all_in_bps_tier

# Asset selector, same mechanism as perp-fees: every PromQL selector gets
# `chain="X"` injected server-side, so each tab is its own ranking. The
# harness labels the underlying asset `chain` to reuse the dimension filter.
dimensions:
  chain:
    - { value: ETH, label: ETH }
    - { value: BTC, label: BTC }
    - { value: SOL, label: SOL }

faq:
  - q: "Which perp DEX has the lowest slippage on a $100k market order right now?"
    a: "{{best_name}} at {{best_p50}} on ETH (24 h average), ahead of {{count}} orderbook venues. The ranking re-sorts every minute from the last 24 hours of 30 second orderbook walks, and the BTC and SOL tabs rank the same venues on their own books."
  - q: "How is slippage computed here?"
    a: "The harness reads each venue's public orderbook, takes mid as (best bid + best ask) / 2 and walks the ask side until $100,000 of notional is filled. The size-weighted average fill price against mid, in basis points, is the slippage. It includes half the quoted spread and the impact of eating through levels; it excludes the taker fee."
  - q: "Why is the fee left out when perp-fees already exists?"
    a: "perp-fees ranks the all-in cost (fee plus spread plus impact) and a zero-fee venue can win it on the fee alone. This bench removes the fee so the comparison is about book depth: how much the fill price moves for a given size. Both numbers matter; a trader with a fee rebate or a large clip reads this one."
  - q: "Why are GMX v2 and Gains missing?"
    a: "They price against an oracle with a fixed spread and impact parameter instead of an orderbook, so there is no depth to walk and their tiers are flat. They are ranked on perp-fees, where the fee and the spread parameter are added together."
  - q: "What happens when a book cannot fill $100k?"
    a: "The tier is skipped for that tick and counted in perp_fees_tier_skipped_total instead of being extrapolated from the last visible level. Paradex (100 visible levels) and edgeX (200) are the venues where this happens on thin sessions; the sample size column shows how many ticks made it into the 24 h average."
  - q: "Does this measure what I would pay on the venue's UI?"
    a: "For the book component, yes: the walk uses the same public book the UI shows, at the same instant. On Paradex it reads the interactive book that Retail (UI) orders cross, RPI liquidity included; a plain API order on Paradex sees a thinner book. Latency, partial fills and price protection settings can still move an actual fill."
  - q: "What about the $BOT bench that used to live here?"
    a: "The earlier version of this page compared Lighter and Hyperliquid HIP-3 on the $BOT perp alone; that data still runs in the perp-execution-scanner harness. This page now ranks the whole orderbook cohort on ETH, BTC and SOL, which is what most readers asked it."

providers:
  - slug: lighter
    name: Lighter
    tag: zk-rollup orderbook, zero taker fee
    formula: "24 h average of perp_fees_all_in_bps_tier{notional=\"100000\"} minus perp_fees_taker_fee_bps for Lighter on the selected asset: half-spread plus impact of a $100k market buy walked on GET /api/v1/orderBookOrders, in bps."
    queries:
      p50: avg_over_time(perp_fees_all_in_bps_tier{venue="lighter", notional="100000"}[24h]) - ignoring(notional) avg_over_time(perp_fees_taker_fee_bps{venue="lighter"}[24h])
      p90: quantile_over_time(0.90, perp_fees_all_in_bps_tier{venue="lighter", notional="100000"}[24h]) - ignoring(notional) avg_over_time(perp_fees_taker_fee_bps{venue="lighter"}[24h])
      p99: quantile_over_time(0.99, perp_fees_all_in_bps_tier{venue="lighter", notional="100000"}[24h]) - ignoring(notional) avg_over_time(perp_fees_taker_fee_bps{venue="lighter"}[24h])
      mean: avg_over_time(perp_fees_all_in_bps_tier{venue="lighter", notional="100000"}[24h]) - ignoring(notional) avg_over_time(perp_fees_taker_fee_bps{venue="lighter"}[24h])
      success: avg_over_time(perp_fees_health{venue="lighter"}[24h])
      sample_size: count_over_time(perp_fees_all_in_bps_tier{venue="lighter", notional="100000"}[24h])
