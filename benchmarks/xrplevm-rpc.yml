# OpenChainBench. Bench No 294

slug: xrplevm-rpc
number: "294"
title: "XRPL EVM RPC endpoints: free public URLs by latency"
seo_title: "XRPL EVM RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free XRPL EVM RPC at {{best_p50}} (Tendermint status p50, 24h). URLs for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for the Tendermint `status` method against every free, no-key public XRPL EVM Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  XRPL EVM is a Cosmos SDK chain (xrplevm_1440000-1) that brings an EVM execution environment to the XRP ecosystem. This page measures its Cosmos consensus RPC, which is a different surface from its EVM JSON-RPC: every endpoint the registry lists answered the Tendermint `status` probe on 2026-10-07, operated by Peersyst (cosmos-rpc.xrplevm.org), Cumulo and Polkachu. All three listed in the registry answered, which is the exception rather than the rule in this part of the cluster.

abstract: |
  XRPL EVM: {{count}} free public RPC endpoints answering Tendermint status every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:xrplevm-official}}.
  We measure the round-trip latency of a single Tendermint `status` call against every no-key public XRPL EVM endpoint that sustains continuous probing, {{count}} providers measured, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) with a XRPL EVM-scaled staleness gap (20 blocks at XRPL EVM's ~3 s block time). The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the XRPL EVM-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"status\",\"params\":[]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the rotating id defeats edge caches that would answer a bare head query without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the exclusion rules follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the XRPL EVM-scoped view of the same harness."
  - "Roster: every endpoint here answered a real Tendermint status call without a key on the 2026-10-07 sweep before being added to the probe matrix. An endpoint that needs a key, region-blocks us or rate-limits below the 60-second cadence is excluded rather than listed with an asterisk."
  - "Chain scope: every query on this page is pinned to `chain=\"xrplevm\"`. Provider coverage: {{count}} no-key endpoints."

faq:
  - q: "Which XRPL EVM RPCs work without an API key?"
    a: "{{declared_count}} endpoints are probed on this chain: Peersyst (cosmos-rpc.xrplevm.org), Cumulo (rpc.xrpl.cumulo.org.es), Polkachu (xrp-rpc.polkachu.com). Every listed endpoint was live-verified with a Tendermint status call returning a parsable response before inclusion."
  - q: "How is XRPL EVM RPC latency measured here, technically?"
    a: "One identical Tendermint status call every 60 seconds against each provider from each of 3 regions, using the same plain HTTP client the rest of the RPC cluster uses. Wall-clock round-trip is recorded at millisecond precision; p50/p90/p99 are computed via Prometheus `quantile_over_time` over 24 hours. Responses are classified (`ok` / `http_err` / `jsonrpc_err` / `stale` / `timeout`) so an endpoint stuck on an old head or returning errors behind HTTP 200 is never ranked as fastest."
  - q: "Is this the EVM endpoint or the Cosmos endpoint?"
    a: "The Cosmos consensus endpoint. XRPL EVM exposes both: a Tendermint RPC that answers `status` and an EVM JSON-RPC that answers `eth_getBlockByNumber`. They are separate services with separate hostnames and separate latency, so mixing them in one column would compare different work. This board is the consensus surface; it does not tell you how fast a contract call returns."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="xrplevm"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: xrplevm-official
    name: Peersyst
    endpoint: https://cosmos-rpc.xrplevm.org
    tag: Peersyst official public Tendermint RPC endpoint for XRPL EVM
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` call sent every 60s from 3 regions (us-east + eu-west + sgp) to Peersyst's no-key xrplevm RPC endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="xrplevm-official", chain="xrplevm"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="xrplevm-official", chain="xrplevm"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="xrplevm-official", chain="xrplevm"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="xrplevm-official", chain="xrplevm"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="xrplevm-official", chain="xrplevm"}) / sum(ocb:rpc_call:rate_24h{provider="xrplevm-official", chain="xrplevm"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="xrplevm-official", chain="xrplevm"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="xrplevm-official", chain="xrplevm"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="xrplevm-official", chain="xrplevm", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="xrplevm-official", chain="xrplevm", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="xrplevm-official", chain="xrplevm", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="xrplevm-official", chain="xrplevm", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="xrplevm-official", chain="xrplevm", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="xrplevm-official", chain="xrplevm", region="sgp"}[1h])

