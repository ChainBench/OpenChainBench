# OpenChainBench. Bench № 173

slug: axelar-rpc
number: "173"
title: "Axelar RPC endpoints: free public URLs ranked by latency"
seo_title: "Axelar RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Axelar RPC at {{best_p50}} (Tendermint status p50, 24h). URLs for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for the Tendermint status method against every free, no-key public Axelar Cosmos SDK endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Axelar (axelar-dojo-1) is a Cosmos SDK blockchain providing general message passing and token bridging across 50+ connected chains, AXL governance and fee token, using CometBFT consensus with a validator set that collectively holds threshold-signature keys for each connected chain. Polkachu, PublicNode, and LavenderFive provide keyless Tendermint RPC endpoints probed every 60 seconds from three regions.

abstract: |
  Axelar: {{count}} free public RPC endpoints answering `status` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical Cosmos SDK call (Tendermint `status`) against every no-key public Axelar endpoint that sustains continuous probing, {{count}} providers live today, every 60 seconds, from us-east, eu-west and Singapore. The harness classifies every response (ok / http_err / jsonrpc_err / stale / timeout) so the leaderboard rewards sustained availability rather than fast error messages. The cross-chain view lives on the parent `rpc-capabilities` benchmark; this page is the Axelar-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"status\",\"params\":[]}`. Plain HTTP POST, identical for every endpoint, no API key in any request."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Axelar-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to `chain=\"axelar\"`. Provider coverage at launch: {{count}} no-key endpoints (Polkachu, PublicNode, LavenderFive, AutoStake)."

faq:
  - q: "Which Axelar RPCs work without an API key?"
    a: "{{count}} endpoints sustain continuous keyless probing today; each is listed with its URL, 24h median and success rate in the endpoints table on this page, and the list changes as providers come and go."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="axelar"})

dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: polkachu
    name: Polkachu
    endpoint: https://axelar-rpc.polkachu.com
    tag: Community Cosmos validator and public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single Tendermint `status` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Polkachu's no-key Axelar endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="axelar"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="polkachu", chain="axelar"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="polkachu", chain="axelar"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="polkachu", chain="axelar"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="polkachu", chain="axelar"}) / sum(ocb:rpc_call:rate_24h{provider="polkachu", chain="axelar"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="polkachu", chain="axelar"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="axelar"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="axelar", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="axelar", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="axelar", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="axelar", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="polkachu", chain="axelar", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="polkachu", chain="axelar", region="sgp"}[1h])

