# OpenChainBench. Bench № 058

slug: moonbeam-rpc
number: "058"
title: "Moonbeam RPC endpoints: free public URLs by latency"
seo_title: "Moonbeam RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Moonbeam RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Moonbeam RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Moonbeam, the EVM chain of the Polkadot ecosystem, fields 3 no-key
  public endpoints that sustain continuous probing. The cohort was
  rebuilt on 2026-10-09: PublicNode stopped serving the chain and
  answers 404 on every hostname it published, Tenderly's public gateway
  answers 404, and the Foundation endpoint refuses the TLS handshake
  from two independent client stacks. OnFinality and UnitedBloc take
  their place, each verified on the same head as dRPC before inclusion.
  Probes every 60 seconds from three regions with the cluster's
  anti-cache payload.

abstract: |
  Moonbeam: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Moonbeam endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore. The harness also classifies every response (ok / http_err / jsonrpc_err / stale / timeout) and audits archive depth every 5 minutes, so the leaderboard rewards sustained, honest availability rather than a fast error message. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Moonbeam-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. The request id rotates, but that does not guarantee a cache miss: many caches normalise `id` away. Measured 2026-10-08, fixed and rotating ids answer within 2 to 4 percent of each other."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Moonbeam-scoped view of the same harness, with the same exclusion rules."
  - "Cohort rebuilt 2026-10-09. Dropped: PublicNode and Tenderly, both 404, and the Foundation endpoint, which refuses the TLS handshake from two independent client stacks (LibreSSL 3.3.6 and OpenSSL 3.5.5), so it cannot be measured from here whatever the cause. Added: OnFinality and UnitedBloc, each probed with `eth_getBlockByNumber` and kept only after returning dRPC's head on 10 of 10 tries."


source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on region alone.
rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="moonbeam"})

# Region is the only dimension: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: drpc
    name: dRPC
    endpoint: https://moonbeam.drpc.org
    tag: Decentralized RPC mesh, consensus-checked
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to dRPC's no-key Moonbeam endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="moonbeam"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="moonbeam"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="moonbeam"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="moonbeam"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="moonbeam"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="moonbeam"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="moonbeam"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="moonbeam"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="moonbeam", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="moonbeam", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="moonbeam", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="moonbeam", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="moonbeam", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="moonbeam", region="sgp"}[1h])

  - slug: onfinality
    name: OnFinality
    endpoint: https://moonbeam.api.onfinality.io/public
    tag: OnFinality shared node service public endpoint
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to OnFinality's no-key Moonbeam endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="moonbeam"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="onfinality", chain="moonbeam"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="onfinality", chain="moonbeam"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="onfinality", chain="moonbeam"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="onfinality", chain="moonbeam"}) / sum(ocb:rpc_call:rate_24h{provider="onfinality", chain="moonbeam"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="onfinality", chain="moonbeam"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="moonbeam"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="moonbeam", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="moonbeam", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="moonbeam", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="moonbeam", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="onfinality", chain="moonbeam", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="onfinality", chain="moonbeam", region="sgp"}[1h])

  - slug: unitedbloc
    name: UnitedBloc
    endpoint: https://moonbeam.unitedbloc.com
    tag: UnitedBloc community-operated public RPC
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to UnitedBloc's no-key Moonbeam endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="unitedbloc", chain="moonbeam"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="unitedbloc", chain="moonbeam"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="unitedbloc", chain="moonbeam"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="unitedbloc", chain="moonbeam"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="unitedbloc", chain="moonbeam"}) / sum(ocb:rpc_call:rate_24h{provider="unitedbloc", chain="moonbeam"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="unitedbloc", chain="moonbeam"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="unitedbloc", chain="moonbeam"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="unitedbloc", chain="moonbeam", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="unitedbloc", chain="moonbeam", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="unitedbloc", chain="moonbeam", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="unitedbloc", chain="moonbeam", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="unitedbloc", chain="moonbeam", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="unitedbloc", chain="moonbeam", region="sgp"}[1h])

