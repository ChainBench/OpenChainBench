          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="moonbeam", region="sgp"}[1h])

  - slug: tenderly
    name: Tenderly
    endpoint: https://gateway.tenderly.co/public/moonbeam
    tag: Multi-chain public gateway, no key
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Tenderly's no-key Moonbeam endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tenderly", chain="moonbeam"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="tenderly", chain="moonbeam"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="tenderly", chain="moonbeam"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="tenderly", chain="moonbeam"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="tenderly", chain="moonbeam"}) / sum(ocb:rpc_call:rate_24h{provider="tenderly", chain="moonbeam"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="tenderly", chain="moonbeam"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="tenderly", chain="moonbeam"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tenderly", chain="moonbeam", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tenderly", chain="moonbeam", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tenderly", chain="moonbeam", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tenderly", chain="moonbeam", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="tenderly", chain="moonbeam", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="tenderly", chain="moonbeam", region="sgp"}[1h])

  - slug: moonbeam-official
    name: Moonbeam
    endpoint: https://rpc.api.moonbeam.network
    tag: Moonbeam Foundation public RPC, Moonbeam only
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to Moonbeam's no-key Moonbeam endpoint."
    queries:
