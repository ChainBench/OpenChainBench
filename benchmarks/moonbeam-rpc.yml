# OpenChainBench. Bench № 058

slug: moonbeam-rpc
number: "058"
title: "Moonbeam RPC endpoints: free public URLs by latency"
seo_title: "Moonbeam RPC endpoints: free public URLs by latency"
seo_description: "{{best_name}} leads free Moonbeam RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, probed every 60 s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Moonbeam RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Moonbeam, the EVM chain of the Polkadot ecosystem, fields 4 no-key
  descoped cluster-wide to Ethereum and Arbitrum after its keyless
  per-IP daily budget proved too tight for continuous multi-chain
  probing; the remaining cohort covers the multi-chain gateways plus
  the chain-official endpoint. Probes every 60 seconds from three
  regions with the cluster's anti-cache payload.

abstract: |
  Moonbeam: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:moonbeam-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Moonbeam endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore. The harness also classifies every response (ok / http_err / jsonrpc_err / stale / timeout) and audits archive depth every 5 minutes, so the leaderboard rewards sustained, honest availability rather than a fast error message. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Moonbeam-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the latest-header fetch with a rotating id defeats edge caches that answer eth_blockNumber without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Moonbeam-scoped view of the same harness, with the same exclusion rules."


source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on region alone.
rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="moonbeam"})

# Region is the only dimension: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://moonbeam-rpc.publicnode.com
    tag: Allnodes-operated, 70+ chains, archive on most
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Moonbeam endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="moonbeam"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="moonbeam"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="moonbeam"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="moonbeam"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="moonbeam"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="moonbeam"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="moonbeam"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="moonbeam"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="moonbeam", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="moonbeam", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="moonbeam", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="moonbeam", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="moonbeam", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="moonbeam", region="sgp"}[1h])

  - slug: drpc
    name: dRPC
    endpoint: https://moonbeam.drpc.org
    tag: Decentralized RPC mesh, consensus-checked
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to dRPC's no-key Moonbeam endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="moonbeam"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="drpc", chain="moonbeam"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="drpc", chain="moonbeam"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="drpc", chain="moonbeam"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="drpc", chain="moonbeam"}) / sum(ocb:rpc_call:rate_24h{provider="drpc", chain="moonbeam"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="drpc", chain="moonbeam"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="moonbeam"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="moonbeam", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="moonbeam", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="drpc", chain="moonbeam", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="drpc", chain="moonbeam", region="eu-west"}[1h])
        - region: ap-southeast
