# OpenChainBench. Bench № 047

slug: optimism-rpc
number: "047"
title: "Optimism RPC endpoints: free public URLs ranked by latency"
seo_title: "Optimism RPC endpoints: free public URLs ranked by latency"
seo_description: "{{best_name}} leads free Optimism RPC at {{best_p50}} (eth_getBlockByNumber p50, 24h). URLs and chain ID for all {{count}} no-key endpoints, updated every 60s."
subtitle: HTTP round-trip latency for eth_getBlockByNumber against every free, no-key public Optimism RPC endpoint, audited every 60 seconds from 3 regions.

category: RPCs
status: live
metric: RPC latency
unit: ms
higher_is_better: false

seo_intro: |
  Optimism pits the Foundation's `mainnet.optimism.io` against {{count}} multi-chain no-key gateways. As on Arbitrum, the official endpoint is documented best-effort, and the measured tail confirms it, while the gateway tier (PublicNode, dRPC, Tenderly, Nodies) competes on tighter distributions. Probes run every 60 seconds from three regions with full response classification, so an endpoint stuck on an old head is flagged `stale` rather than ranked fast.

abstract: |
  Optimism: {{count}} free public RPC endpoints answering `eth_getBlockByNumber` every 60 seconds from us-east, eu-west and Singapore, ranked by 24h median. {{best_name}} leads at {{best_p50}}; the chain-official endpoint measures {{p50:optimism-official}}.
  We measure the round-trip latency of a single, identical RPC call (`eth_getBlockByNumber`) against every no-key public Optimism endpoint that sustains continuous probing, {{count}} providers, every 60 seconds, from us-east, eu-west and Singapore. The harness also classifies every response (ok / http_err / jsonrpc_err / stale / timeout) and audits archive depth every 5 minutes, so the leaderboard rewards sustained, honest availability rather than a fast error message. The cross-chain view lives on the parent rpc-capabilities benchmark; this page is the Optimism-scoped answer with per-region breakdowns as a first-class dimension.

methodology:
  - "Cadence: every 60 seconds per provider, from each of 3 probe regions (us-east Virginia, eu-west Amsterdam, sgp Singapore). Headline p50/p90/p99 aggregate across all 3 regions via Prometheus `avg(quantile_over_time(...))`; per-region breakdowns are first-class on this page via the region tabs."
  - "Payload: `{\"jsonrpc\":\"2.0\",\"id\":<rotating>,\"method\":\"eth_getBlockByNumber\",\"params\":[\"latest\",false]}`. Plain HTTP POST, identical for every endpoint, no API key in any request. Non-cacheable by design: the latest-header fetch with a rotating id defeats edge caches that answer eth_blockNumber without touching a node."
  - "Latency measurement, call-result classification (`ok`, `http_err`, `jsonrpc_err`, `stale`, `timeout`) and the archive-depth audit follow the cluster method documented on [rpc-capabilities](https://openchainbench.com/benchmarks/rpc-capabilities#methodology); this page is the Optimism-scoped view of the same harness, with the same exclusion rules."
  - "Chain scope: every query on this page is pinned to chain=\"optimism\". Provider coverage: {{count}} no-key public-read endpoints live today, each listed with its URL in the endpoints table on this page. Exclusions follow the cluster-wide rules documented on the parent benchmark."

excluded_providers:
  - { name: Ankr, reason: "public endpoint requires an API key" }
  - { name: NodeReal, reason: "requires an API key" }
  - { name: GetBlock, reason: "requires an API key; compared on the keyed pages" }
  - { name: Chainstack, reason: "requires an API key; compared on the keyed pages" }
  - { name: 1RPC, reason: "delisted for reliability: under 13 % success at one probe per minute", since: "2026-07-09" }
  - { name: gateway.fm, reason: "29 requests per IP budget, too small for continuous probing" }
  - { name: LlamaRPC, reason: "Cloudflare 521 from the probe regions" }
  - { name: BlockPI, reason: "Cloudflare 521 from the probe regions" }
  - { name: OmniaTech, reason: "Cloudflare 521 from the probe regions" }
  - { name: Alchemy demo, reason: "rate-limited public demo endpoint; the keyed tier is compared on the keyed pages" }

faq:
  - q: "Which Optimism RPCs work without an API key?"
    a: "The {{count}} providers on this page are listed with their URLs in the endpoints table above. Every (provider, chain) pair was live-verified no-key before inclusion, and anything that key-gates, region-blocks or rate-limits below our 60-second cadence is excluded rather than listed with an asterisk."
  - q: "Do Base and Optimism RPCs perform the same since both are OP Stack?"
    a: "No. The stack is shared but the infrastructure is not: different operators, different peering, different gateway coverage. Our measurements regularly show different leaders and different tail behavior on the two chains. If you deploy on both, pick the RPC per chain from each page rather than assuming OP Stack parity."

source: https://github.com/ChainBench/OpenChainBench/tree/main/harnesses/rpc-capabilities

prometheus:
  window: 24h
  freshness_metric: rpc_latency_milliseconds

# Per-cell (region) ranking matrix for scoped badge claims. Chain is
# fixed for the whole bench, so cells key on region alone.
rank_matrix_query: avg by (provider, region) (ocb:rpc_latency_milliseconds:p50_24h{chain="optimism"})

# Region is the only dimension: chain is baked into every query.
dimensions:
  region:
    - { value: all,     label: All regions }
    - { value: us-east, label: US-East }
    - { value: eu-west, label: EU-West }
    - { value: sgp,     label: Singapore }

providers:
  - slug: publicnode
    name: PublicNode
    endpoint: https://optimism-rpc.publicnode.com
    tag: Allnodes-operated, 70+ chains, archive on most
    formula: "50th percentile over 24h of client-side round-trip latency (ms) for a single `eth_getBlockByNumber` POST sent every 60s from 3 regions (us-east + eu-west + sgp) to PublicNode's no-key Optimism endpoint."
    queries:
      p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="optimism"})
      p90: avg(ocb:rpc_latency_milliseconds:p90_24h{provider="publicnode", chain="optimism"})
      p99: avg(ocb:rpc_latency_milliseconds:p99_24h{provider="publicnode", chain="optimism"})
      mean: avg(ocb:rpc_latency_milliseconds:mean_24h{provider="publicnode", chain="optimism"})
      success: sum(ocb:rpc_call:ok_rate_24h{provider="publicnode", chain="optimism"}) / sum(ocb:rpc_call:rate_24h{provider="publicnode", chain="optimism"})
      sample_size: sum(ocb:rpc_call:increase_24h{provider="publicnode", chain="optimism"})
      series: avg(avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="optimism"}[1h]))
      regions:
        - region: us-east
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="optimism", region="us-east"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="optimism", region="us-east"}[1h])
        - region: eu-west
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="optimism", region="eu-west"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="optimism", region="eu-west"}[1h])
        - region: ap-southeast
          p50: avg(ocb:rpc_latency_milliseconds:p50_24h{provider="publicnode", chain="optimism", region="sgp"})
          series: avg_over_time(rpc_latency_milliseconds{provider="publicnode", chain="optimism", region="sgp"}[1h])

