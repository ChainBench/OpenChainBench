  - slug: turnkey
    name: Turnkey
    url: https://www.turnkey.com
    cohort: ranked
    unit: Signatures, with a cap on total wallets
    note: >-
      Billed per signature; the wallet limit (1K on Pay as You Go, 2K on Pro)
      caps how many wallets an organisation holds, so an app with more users
      than that needs Enterprise, which has no published price. Wallets are
      taken as one per active user, a lower bound since wallets accumulate
      across months.
    meters:
      signatures: { per_tx: 1 }
      wallets: { per_user: 1 }
    plans:
      - id: payg
        name: Pay as You Go
        monthly_usd: 0
        confidence: verified
        caps: { wallets: 1000 }
        tiers:
          signatures: [{ up_to: 25, rate: 0 }, { rate: 0.10 }]
      - id: pro
        name: Pro
        monthly_usd: 99
        minimum: true
        confidence: uncertain
        note: >-
          "$99/mo." beside "$0.05 / signature", and the FAQ calls it "a minimum
          monthly fee". Read as a spending floor, max($99, $0.05 per signature);
          read as a fee on top, the bill is $99 higher. Per-transaction fees for
          Turnkey's own broadcasting are quote-only and not included.
        caps: { wallets: 2000 }
        tiers:
          signatures: [{ rate: 0.05 }]
      - id: enterprise
        name: Enterprise
        monthly_usd: null
        confidence: verified
    source:
      pricing:
        url: https://www.turnkey.com/pricing
        body_sha256: eb91b7dd5113d9e3797c23a44d250d5c82b29a15ef70a7ef7ca962018767a665
        verified_at: "2026-10-29"
        poll: true

