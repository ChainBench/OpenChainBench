# Embedded wallet pricing catalogue, the input of record for bench wallet-cost.
#
# Every figure was read by a human from the vendor's own pricing page on the
# date in `verified_at`, and every plan says which page. Nothing here is
# scraped: half of these pages render their FAQ only in JavaScript and a
# parser that guesses is worse than one that does not exist.
#
# How a bill is built (harness model.go, and the independent scorer that
# checks it):
#
#   workload  = MAU (monthly active users), transactions per user per month,
#               and the share of MAU that are new users creating a wallet.
#   meter     = a quantity the vendor bills, written as a linear function of
#               the workload: per_user x MAU + per_tx x transactions +
#               per_new_wallet x new wallets.
#   plan      = monthly_usd, then for each meter a list of graduated tiers on
#               the TOTAL quantity (the first tier at rate 0 is what the plan
#               includes), a hard `cap` (the plan cannot serve more; the vendor
#               cuts off or forces an upgrade) and a `quote_above` (beyond it
#               the vendor publishes no price; not ranked).
#   bill      = monthly_usd + sum of tier charges; when `minimum: true` the
#               fee is a spending floor instead: max(monthly_usd, charges).
#   cheapest  = the lowest bill among the vendor's eligible plans.
#
# Null and zero are opposite claims. `monthly_usd: null` means no published
# price (a quote), never free. A meter a plan does not list is a meter the
# plan does not bill, so leaving one out is a statement; the validator refuses
# a plan that bills a meter the vendor does not define.
#
# Gas is excluded everywhere. Several vendors sponsor gas for a surcharge
# (thirdweb 2.5% on mainnet, Openfort 10% or 5%, ZeroDev 8%); that is a
# percentage of the user's gas, not a price of the wallet, and it is the same
# gas whichever wallet signs.

version: 1
as_of: "2026-10-29"

# Workload profiles. Shared input, never retyped: the harness and the
# independent scorer both read them from here. One wallet per user, and every
# transaction is one signature followed by one broadcast.
profiles:
  - id: consumer
    label: Consumer app
    tx_per_user: 5
    new_user_share: 0.20
  - id: active
    label: Active app
    tx_per_user: 25
    new_user_share: 0.10
  - id: trading
    label: Trading app
    tx_per_user: 100
    new_user_share: 0.05

# The three volumes the gauges publish. The calculator prices any count from
# `curve_floor` to `curve_ceiling` monthly active users.
volumes:
  - { id: 1k, mau: 1000 }
  - { id: 10k, mau: 10000 }
  - { id: 100k, mau: 100000 }
headline: { profile: consumer, volume: 10k }
curve_floor: 100
curve_ceiling: 1000000

providers:
  - slug: privy
    name: Privy
    url: https://www.privy.io
    cohort: ranked
    unit: Monthly active users plus signatures
    note: >-
      Plan bounds are the cards' "Up to" figures (500, 2,500, and 10,000 for
      Scale, whose band reads 2,500 to 9,999), because pay-as-you-go starts
      only when usage "exceeds 10,000 MAU or 50,000 signatures". A Privy MAU is
      a user with an active session in the last 30 days.
    meters:
      mau: { per_user: 1 }
      signatures: { per_tx: 1 }
    plans:
      - id: free
        name: Free
        monthly_usd: 0
        confidence: verified
        caps: { mau: 500, signatures: 50000 }
      - id: core
        name: Core
        monthly_usd: 299
        confidence: verified
        caps: { mau: 2500, signatures: 50000 }
      - id: scale
        name: Scale
        monthly_usd: 499
        confidence: verified
        # Unambiguous below 10,000 users. At exactly 10,000 the card's band
        # (2,500 to 9,999) and the pay-as-you-go trigger (exceeds 10,000)
        # disagree, and the cap above takes the trigger's side.
        uncertain_above: { mau: 9999 }
        note: >-
          The card bands Scale at 2,500 to 9,999 users, while pay-as-you-go
          applies only when usage exceeds 10,000. At exactly 10,000 users
          Scale is priced at $499; on the card's reading the bill is $2,000.
        caps: { mau: 10000, signatures: 50000 }
      - id: payg
        name: Pay as you go
        monthly_usd: 2000
        confidence: uncertain
        note: >-
          Applies above 10,000 MAU or 50,000 signatures a month: "a volume PAYG
          base fee of $2,000; $0.05 per MAU above 10,000 MAUs; and $0.01 per
          signature above 50,000 signatures". The page does not say whether the
          $499 Scale fee is charged on top, so the $2,000 base is priced alone,
          the lower reading. The free allowance also stops at $1M of monthly
          transaction volume, which this model does not track. Privy's own page
          says an Enterprise plan is "typically cheaper" at sustained volume.
        tiers:
          mau: [{ up_to: 10000, rate: 0 }, { rate: 0.05 }]
          signatures: [{ up_to: 50000, rate: 0 }, { rate: 0.01 }]
    source:
      pricing:
        url: https://www.privy.io/pricing
        body_sha256: 5cee07da8b21944d68ac6706cdffb8f124eb91d70641e82f468e5535540c34b3
        verified_at: "2026-10-29"
        poll: true

