# Paymaster pricing catalogue, the input of record for bench paymaster-cost
# (312). Same model and rules as bench 310's catalogue
# (harnesses/server-wallet-cost/pricing/catalogue.yml); read bench 309's
# header (harnesses/wallet-cost/pricing/catalogue.yml) for the grammar of
# meters, tiers, caps, quote_above, minimum and uncertain_above.
#
# What is billed: what a vendor charges a developer for sponsoring its users'
# gas, ON TOP OF the gas itself. The gas a sponsored user operation burns is
# the same whoever sponsors it, so it is left out of every bill and stated
# beside it on the page; what differs is the plan fee, the per-operation or
# per-request charge, and the surcharge on the gas.
#
# Each scenario is a chain. Its axis x is sponsored user operations a month
# (tx = x), and `gas_usd_per_tx` is the USD of gas one sponsored operation
# burns there, so a surcharge meter `{ per_gas_usd: 1 }` counts USD of
# sponsored gas and its rate is the surcharge as a fraction (10% is 0.10).
#
# gas_usd_per_tx, measured 2026-10-30 (ETH $2,230.95, Coinbase spot): the
# median actualGasCost of UserOperationEvent on EntryPoint v0.7 for
# successful sponsored operations, strict profile (a bundle of exactly one
# operation, no account deployment, one ERC-20 transfer, no other logs):
#   Base      blocks 53,293,921-53,294,526  n=37  ~148.6k gas  $0.0020
#   Arbitrum  blocks 519,699,712-519,731,559 n=25 ~161.4k gas  $0.0072
#   Ethereum  blocks 26,306,702-26,306,872  n=57  ~132.1k gas  $0.150
# actualGasCost is the base the surcharges are stated on (Pimlico's FAQ
# bills `actualGasCost * 1.1`; CDP's uses the UserOperationEvent too). On
# Ethereum it moves with the base fee (0.51 gwei here): a surcharge there is
# a share of a number that can double in a busy hour.

version: 1
as_of: "2026-10-30"

scenarios:
  - id: base
    label: Base
    axis: sponsored user operations a month
    wallets_fixed: 0
    wallets_per_x: 0
    tx_fixed: 0
    tx_per_x: 1
    gas_usd_per_tx: 0.0020
    floor: 1000
    ceiling: 10000000
    sizes:
      - { id: small, x: 10000 }
      - { id: medium, x: 100000 }
      - { id: large, x: 1000000 }
  - id: arbitrum
    label: Arbitrum
    axis: sponsored user operations a month
    wallets_fixed: 0
    wallets_per_x: 0
    tx_fixed: 0
    tx_per_x: 1
    gas_usd_per_tx: 0.0072
    floor: 1000
    ceiling: 10000000
    sizes:
      - { id: small, x: 10000 }
      - { id: medium, x: 100000 }
      - { id: large, x: 1000000 }
  - id: ethereum
    label: Ethereum
    axis: sponsored user operations a month
    wallets_fixed: 0
    wallets_per_x: 0
    tx_fixed: 0
    tx_per_x: 1
    gas_usd_per_tx: 0.150
    floor: 1000
    ceiling: 10000000
    sizes:
      - { id: small, x: 10000 }
      - { id: medium, x: 100000 }
      - { id: large, x: 1000000 }

headline: { scenario: base, size: medium }

providers:
  - slug: pimlico
    name: Pimlico
    url: https://www.pimlico.io
    cohort: ranked
    unit: API credits plus a gas surcharge
    note: >-
      Pay-as-you-go has no monthly fee: 10,000,000 credits a month included,
      then $1 per 100,000 credits, and a 10% surcharge on sponsored gas on
      mainnets (`actualGasCost * 1.1`). Pimlico's own count is 1,050 credits
      per sponsored user operation ("~9,500 if sponsored" included, then
      "~$0.0105 if sponsored", against ~$0.0075 unsponsored). The Free plan
      is testnet only.
    meters:
      credits: { per_tx: 1050 }
      gas_surcharge: { per_gas_usd: 1 }
    plans:
      - id: payg
        name: Pay-as-you-go
        monthly_usd: 0
        confidence: verified
        tiers:
          credits: [{ up_to: 10000000, rate: 0 }, { rate: 0.00001 }]
          gas_surcharge: [{ rate: 0.10 }]
      - id: enterprise
        name: Enterprise
        monthly_usd: null
        confidence: verified
    source:
      pricing:
        url: https://docs.pimlico.io/guides/pricing.md
        body_sha256: 5e6f36c014de28225742dba63f58fb77e7116f8e9eee6a2362d6f2c28889cc20
        verified_at: "2026-10-30"
        poll: true

  - slug: alchemy
    name: Alchemy
    url: https://www.alchemy.com
    cohort: ranked
    unit: Compute units plus an admin fee on gas
    note: >-
      Pay as You Go: $0.52 per million compute units for all usage and an 8%
      fee on gas sponsored on mainnet. On mainnet a PAYG team sponsors
      through Bundler Sponsored Operations (the onchain paymaster is
      Enterprise only): a sponsored send costs 3,000 CU, an estimate 500 and
      a receipt 20, so 3,520 CU an operation. BSO gas is "the onchain
      settlement cost plus a BSO service fee" that is not published, so every
      Alchemy price here is a lower bound and is never named cheapest.
    meters:
      million_compute_units: { per_tx: 0.00352 }
      gas_surcharge: { per_gas_usd: 1 }
    plans:
      - id: payg
        name: Pay as You Go
        monthly_usd: 0
        confidence: uncertain
        bound: lower
        tiers:
          million_compute_units: [{ rate: 0.52 }]
          gas_surcharge: [{ rate: 0.08 }]
    source:
      pricing:
        url: https://www.alchemy.com/pricing
        body_sha256: f6ba1f865cc7dfcda0551a9e39caf352628d631c31dc0a96f448d30ec0406175
        verified_at: "2026-10-30"
        poll: true
