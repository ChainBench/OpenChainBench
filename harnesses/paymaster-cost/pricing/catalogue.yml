  - slug: openfort
    name: Openfort
    url: https://www.openfort.io
    cohort: ranked
    unit: Operations plus a paymaster surcharge
    note: >-
      "Paymaster calls" are free and unmetered; broadcasting a transaction is
      1 operation, so a sponsored operation sent through Openfort's bundler
      is one. The paymaster surcharge is 10% on Free and Growth, 5% on Pro
      and Scale. The Free card shows $0.01 an operation past 2,000, but a
      project without a paid subscription "stops at the included limit", so
      Free stops there. Openfort's v0.8 paymaster is not deployed on Ethereum, so
      delegated (EIP-7702) accounts there are not sponsored; smart accounts
      are.
    meters:
      operations: { per_tx: 1 }
      gas_surcharge: { per_gas_usd: 1 }
    plans:
      - id: free
        name: Free
        monthly_usd: 0
        confidence: verified
        caps: { operations: 2000 }
        tiers:
          gas_surcharge: [{ rate: 0.10 }]
      - id: growth
        name: Growth
        monthly_usd: 99
        confidence: verified
        tiers:
          operations: [{ up_to: 25000, rate: 0 }, { rate: 0.008 }]
          gas_surcharge: [{ rate: 0.10 }]
      - id: pro
        name: Pro
        monthly_usd: 249
        confidence: verified
        tiers:
          operations: [{ up_to: 100000, rate: 0 }, { rate: 0.006 }]
          gas_surcharge: [{ rate: 0.05 }]
      - id: scale
        name: Scale
        monthly_usd: 599
        confidence: verified
        tiers:
          operations: [{ up_to: 500000, rate: 0 }, { rate: 0.004 }]
          gas_surcharge: [{ rate: 0.05 }]
    source:
      pricing:
        url: https://www.openfort.io/pricing
        body_sha256: 1ad524f7fe11c8bed79baec6d4616c15fc6541cf5f7b956b789b6bf5ec4ff2dc
        verified_at: "2026-10-30"
