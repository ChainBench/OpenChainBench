        confidence: verified
        caps: { credits: 100000 }
        tiers:
          gas_surcharge: [{ rate: 0.08 }]
      - id: scale
        name: Scale
        monthly_usd: 399
        confidence: verified
        caps: { credits: 1000000 }
        tiers:
          gas_surcharge: [{ rate: 0.08 }]
      - id: enterprise
        name: Enterprise
        monthly_usd: null
        confidence: verified
    source:
      pricing:
        url: https://www.zerodev.app/pricing
        body_sha256: 8f42ece562b144b9a61e15a5f46047e7aa7f80725c933e454b96b059fed47186
        verified_at: "2026-10-30"
        poll: true

  - slug: thirdweb
    name: thirdweb
    url: https://thirdweb.com
    cohort: ranked
    unit: Sponsored transactions, banded, plus a gas surcharge
    note: >-
      Growth ($99) includes 1,000 sponsored transactions, then $1, $0.60 and
      $0.20 per thousand at 100K and 250K, and a 2.5% gas surcharge on
      mainnet. Priced band by band; whether the lower rate applies to the
      whole count is not stated. The page lists 145+ chains without naming
      them.
    meters:
      thousand_transactions: { per_tx: 0.001 }
      gas_surcharge: { per_gas_usd: 1 }
    plans:
      - id: growth
        name: Growth
        monthly_usd: 99
        confidence: verified
        uncertain_above: { thousand_transactions: 100 }
        bound: upper
        note: >-
          Unambiguous to 100,000 transactions. Above, priced band by band,
          the higher reading: if a lower rate applies to the whole count the
          bill is smaller, so this is the most thirdweb would charge.
        tiers:
          thousand_transactions:
            - { up_to: 1, rate: 0 }
            - { up_to: 100, rate: 1 }
            - { up_to: 250, rate: 0.60 }
            - { rate: 0.20 }
          gas_surcharge: [{ rate: 0.025 }]
    source:
      pricing:
        url: https://thirdweb.com/pricing
        body_sha256: b1b48708af995b501f27f4f8f948f203ad11bd045a408bfaf3eb3bfea05ec3de
        verified_at: "2026-10-30"
        poll: true

  - slug: coinbase-cdp
    name: Coinbase CDP
    url: https://www.coinbase.com/developer-platform
    cohort: ranked
    unit: Gas markup, plus node billing units
    note: >-
      No plan fee: "actualGasUsed × ethPriceUsd × 1.07", a 7% markup on the
      gas, billed monthly. Gas estimation on CDP Node is 500 billing units,
      10M free a month then $0.50 per million; one estimate per operation is
      counted, the most it would add. Base only. Coinbase also grants up to
      $15,000 of gas credits on application, which no bill here assumes.
    scenario_exclusions:
      arbitrum: The CDP paymaster runs on Base only.
      ethereum: The CDP paymaster runs on Base only.
    meters:
      million_billing_units: { per_tx: 0.0005 }
      gas_surcharge: { per_gas_usd: 1 }
    plans:
      - id: payg
        name: Pay as you go
        monthly_usd: 0
        confidence: uncertain
        bound: upper
        tiers:
          million_billing_units: [{ up_to: 10, rate: 0 }, { rate: 0.50 }]
          gas_surcharge: [{ rate: 0.07 }]
    source:
      pricing:
        url: https://docs.cdp.coinbase.com/paymaster/faqs.md
        body_sha256: 2ba12d038cc50be87a3aad3787667cfe38831750e55c1553e0408b49400ba6f8
        verified_at: "2026-10-30"
        poll: true
      node:
        url: https://docs.cdp.coinbase.com/data/node/pricing.md
        body_sha256: c5155170de3aaf117c66107eef2328d8998923bb8909021c968ece7426cf4cf1
        verified_at: "2026-10-30"
        poll: true
        pin_phrases: ["estimateuseroperationgas"]

  - slug: circle
    name: Circle
    url: https://www.circle.com/wallets
    cohort: ranked
    unit: Processing fee on gas
    note: >-
      Gas Station sponsors gas for Circle Wallets and invoices it with "a 5%
      processing fee". It works only with Circle's own smart-contract
      wallets, which bill per monthly active wallet past the first 1,000;
      that fee depends on how many wallets send, which this axis does not
      fix, so every Circle price here is a lower bound and is never named
      cheapest. Circle Paymaster, where the user pays gas in USDC, is a
      separate product and is not developer sponsorship.
    meters:
      gas_surcharge: { per_gas_usd: 1 }
    plans:
      - id: gas-station
        name: Gas Station
        monthly_usd: 0
        confidence: uncertain
        bound: lower
        tiers:
          gas_surcharge: [{ rate: 0.05 }]
    source:
      pricing:
        url: https://developers.circle.com/wallets/gas-station/billing.md
        body_sha256: 3570cf285e0340971c1cdb9db73497baa1b9593f83b054564278c35324745152
        verified_at: "2026-10-30"
        poll: true

  - slug: candide
    name: Candide
    url: https://www.candide.dev
    cohort: ranked
    unit: Sponsored operations, no gas markup
    note: >-
      "We never mark up the gas itself." Launch ($333 a month billed yearly,
      $399 billed monthly) includes 5,000 sponsored operations a month then
      $0.01 each, up to 100,000 user operations; Grow ($749 billed yearly,
      $899 monthly) includes 25,000 then $0.005, up to 500,000; Enterprise is
      from $3,000. The page shows the yearly price by default, and it is the
      cheaper, so it is the one priced; the monthly price sits in an attribute
      of the page that the drift check does not read. Starter's 1,000 sponsored operations are a
      lifetime allowance, not a monthly one, so it is not a plan here.
    meters:
      user_operations: { per_tx: 1 }
    plans:
      - id: launch
        name: Launch, billed yearly
        monthly_usd: 333
        confidence: verified
        caps: { user_operations: 100000 }
        tiers:
          user_operations: [{ up_to: 5000, rate: 0 }, { rate: 0.01 }]
      - id: grow
        name: Grow, billed yearly
        monthly_usd: 749
        confidence: verified
        caps: { user_operations: 500000 }
        tiers:
          user_operations: [{ up_to: 25000, rate: 0 }, { rate: 0.005 }]
      - id: enterprise
        name: Enterprise
        monthly_usd: null
        confidence: verified
    source:
      pricing:
