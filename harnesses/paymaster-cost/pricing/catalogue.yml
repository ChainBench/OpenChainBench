  - slug: zerodev
    name: ZeroDev
    url: https://zerodev.app
    cohort: ranked
    unit: Credits plus a gas premium
    note: >-
      A user operation is 20 credits; mainnet sponsorship starts on Launch
      ($69, 100,000 credits) and Scale ($399, 1,000,000 credits), each with
      an 8% gas sponsorship premium. Wallet signatures (10 credits) are
      ZeroDev's signer and are not counted here. Overage past the included
