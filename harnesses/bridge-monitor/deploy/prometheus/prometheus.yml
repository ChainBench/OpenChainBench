global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'bridge-latency'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager.railway.internal:9093

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'bridge-monitor'
    static_configs:
      - targets: ['bridge-monitor.railway.internal:9090']
