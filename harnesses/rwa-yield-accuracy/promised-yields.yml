# Promised APY for each token in the rwa-yield-accuracy cohort.
#
# This file is the manual source of truth for what each issuer
# ADVERTISES. Updated at least weekly. Each entry cites its source URL
# and the date it was last read. When an issuer changes its advertised
# APY, edit the value + source_date here; the harness reloads this
# file every 60 seconds so a commit lands within a scrape cycle.
#
# Format:
#   token: <slug>          — matches the provider slug in the bench spec
#   promised_apy_bps: N    — e.g. 530 for 5.30%
#   source: <URL>          — the exact page consulted
#   source_date: YYYY-MM-DD — when this value was last verified
#   notes: <string>        — methodology caveats (SEC 7-day vs current,
#                            gross vs net, etc.)
#
# When adding a token, cross-check the value against the fund's
# quarterly fact sheet or SEC filing to guard against the marketing
# page drifting from the regulated disclosure.

