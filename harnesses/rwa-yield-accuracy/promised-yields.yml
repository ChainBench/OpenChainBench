# Reference APY for each token in the rwa-yield-accuracy cohort.
#
# One convention for every row since 2026-09-23: the 30-day mean APY on
# the DefiLlama yields feed (https://yields.llama.fi/pools, field
# apyMean30d), the same window as the delivered figure the bench
# measures. The issuer's own displayed APY, where a page is readable
# (Ondo), is recorded in the notes for the reader; it is not the number
# the deviation is computed against, because a spot figure against a
# 30-day realized yield opens a gap that is the window's, not the fund's
# (audit 2026-09-23: the choice moved USTB by 26 bps and SyrupUSDC by 17).
# Read by hand, dated per entry; the harness reloads this file every 60
# seconds and the Promised column on the bench page shows the value in
# force. Refresh cadence is best effort, not weekly (the July values sat
# unchanged for two months).
#
#   token: <slug>          — matches the provider slug in the bench spec
#   promised_apy_bps: N    — e.g. 530 for 5.30%
#   source: <URL>          — the feed or page consulted
#   source_date: YYYY-MM-DD — when this value was last read
#   refresh_note           — issuer-displayed figure that day, history
updated: 2026-09-23

