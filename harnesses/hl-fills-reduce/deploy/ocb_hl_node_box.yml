# Alerts for the Hyperliquid node box in Singapore (15.235.224.14), scraped
# as job hl-fills-reduce.
#
# Written after 2026-10-07, when that box ran 15 hours with its cleanup job
# failing every 15 minutes and its disk climbing from 80% to 86%, roughly a
# day and a half from full. Nothing noticed, because nothing scraped it. A
# full disk stops the node, and the node is now the only source of whole
# Hyperliquid days.
groups:
  - name: ocb_hl_node_box
    interval: 60s
    rules:
      # The disk is the failure that takes everything else with it. 75% gives
      # days of warning at the observed ~340 GB/day fill rate; 88% is above
      # the cleanup's own 85% ceiling, so firing means the cleanup is not
      # keeping up rather than merely that it has not run yet.
      - alert: HlNodeDiskFilling
        expr: hl_reduce_disk_used_pct > 75
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "HL node box disk at {{ $value | printf \"%.0f\" }}%"
          description: "Cleanup holds this under 85%. Above 75% for 30m means retention is losing ground. Check hl-cleanup.service on 15.235.224.14."

      - alert: HlNodeDiskCritical
        expr: hl_reduce_disk_used_pct > 88
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "HL node box disk at {{ $value | printf \"%.0f\" }}%, above the cleanup ceiling"
          description: "hl-cleanup enforces 85% and is not succeeding. A full disk stops hl-node. Check `journalctl -u hl-cleanup.service` first: in the 2026-10-07 incident it had been exiting non-zero every 15 minutes."

      # The root filesystem, which the two rules above do not cover: they read
      # the data volume. On 2026-10-08 this box's root filled to 100% while
      # /mnt/hyperliquid sat at 29%, held by a 185 GB deleted-but-open trace
      # file a container had kept open since August. hl-visor stages new node
      # binaries through /tmp, which lives on the root, so it could not write
      # the 106 MB binary a hardfork required and the node froze at the fork
      # height for three days. Every disk signal on this box pointed at the
      # data volume, so none of them moved.
      - alert: HlNodeRootDiskFilling
        expr: hl_reduce_root_disk_used_pct > 85
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "HL node box root filesystem at {{ $value | printf \"%.0f\" }}%"
          description: "The root holds the node binaries, the journal and /tmp. Nothing prunes it, unlike the data volume. Deleted-but-open files are invisible to du and are the usual cause: `sudo lsof -nP +L1 | sort -k8 -rn | head`, then truncate the descriptor rather than restarting the holder."

      - alert: HlNodeRootDiskCritical
        expr: hl_reduce_root_disk_used_pct > 93
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "HL node box root filesystem at {{ $value | printf \"%.0f\" }}%, node upgrades will fail"
          description: "At 100% hl-visor cannot stage a new node binary through /tmp and the node freezes at the next hardfork while systemd still calls it active. This is the 2026-10-08 failure."

      # -1 is the gauge's \"could not read the mount\" value. A disk that is
      # not being measured must not look like a disk that is empty, which is
      # the mistake every other rule in this file was written against.
      - alert: HlNodeRootDiskUnmeasured
        expr: hl_reduce_root_disk_used_pct < 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "HL node box root filesystem is not being measured"
          description: "statfs on / failed in hl-fills-reduce, so the root disk is unmonitored. The node can fill its root and freeze with no signal."

      # systemd can report hyperliquid.service active while the node has
      # stopped applying blocks, so liveness is read from the data it writes.
      # Hours land on the hour, so 2h is one missed file plus slack.
      - alert: HlNodeNotWritingFills
        expr: hl_reduce_node_last_hour_age_seconds > 7200
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "HL node has not written a fill file for {{ $value | humanizeDuration }}"
          description: "hl-node writes one file per hour. Silence here means the node is stalled or desynced even if systemd calls it active, and the whole-day Hyperliquid figures stop advancing."

      # The reducer should always hold yesterday. Two days means it is stuck
      # or the node is not producing days to reduce.
      - alert: HlFillsReduceStale
        expr: hl_reduce_newest_day_age_seconds > 172800
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Newest reduced Hyperliquid day is {{ $value | humanizeDuration }} old"
          description: "hl-fills-reduce sweeps every 30m and should hold yesterday within 90 minutes of midnight UTC. Check hl-fills-reduce.service."

      # The window the site reads is 30 days. Fewer whole days than that and
      # the figures start leaning back on the truncated public export.
      - alert: HlFillsReduceThinWindow
        expr: hl_reduce_days_total{complete="true"} < 30
        for: 2h
        labels: { severity: warning }
        annotations:
          summary: "Only {{ $value }} whole Hyperliquid days reduced"
          description: "The site reads a 30-day window. Below 30 whole days it falls back to the public export, which carries about half of each day. Check the node's uptime and FILLS_RETENTION_DAYS in hl-cleanup.sh."

      - alert: HlNodeBoxUnreachable
        expr: up{job="hl-fills-reduce"} == 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "HL node box is not answering the scrape"
          description: "Port 8090 on 15.235.224.14 is open to this VPS only. Check caddy and hl-fills-reduce.service on the box."
