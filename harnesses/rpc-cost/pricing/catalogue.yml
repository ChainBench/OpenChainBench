  - slug: pokt
    name: POKT Network
    cohort: excluded
    status: live
    exclusion_reason: >-
      EXCLUDED FROM SCORING — a protocol, not a purchasable plan. POKT is the underlying supplier
      network (it is not a gateway over someone else's infrastructure), but there is no plan, no
      monthly fee, no included allowance and no overage: you pay by burning a volatile token against
      a governance-maintained USD peg, after staking POKT you cannot spend. The $1.579/1M Ethereum
      figure is a wholesale input price that excludes the staked capital and any gateway markup, so
      it is not like-for-like against a retail plan. Retained in the ranking tables as a marked
      `[ref]` row only, never as a winner.
    unit: relay
    pricing_model: per_chain
    currency: USD
    plans:
      - id: public-portal
        name: Public API portal (Foundation-funded)
        tier: free
        monthly_usd: 0
        annual_monthly_usd: null
        included_units: null
