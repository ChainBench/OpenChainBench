      value: null
      note: Archive node availability is NOT PUBLISHED. Nodes run Geth + Lighthouse.
    source:
      plans:
        url: https://aws.amazon.com/managed-blockchain/pricing/
        kind: html
        poll: manual
        extraction: "public price list: node-hour by instance class and region, plus the per-request rate"
      weights:
        url: https://aws.amazon.com/managed-blockchain/pricing/
        kind: html
        poll: manual
        extraction: "n/a — the unit is not a call (see caveats)"
    caveats:
      - "THE UNIT IS NOT A REQUEST. A billable 'request' is 32 KB exchanged OR 500 ms elapsed, whichever comes first — a 320 KB eth_getLogs bills as 10. No $/1M-CALLS figure is derivable without a response-size and latency distribution, so AWS is reported with a stated assumption rather than a number."
      - "ANNOUNCED END OF SUPPORT: stops accepting new customers 2026-10-29, full end of support 2027-09-30. A benchmark row for it goes stale by design."
      - "Break-even against a $6.00/1M metered provider is node_cost / (6.00 - 3.00) per million: bc.t3.large 32.6M req/mo, bc.m5.large 37.5M, bc.c5.xlarge 66.2M — and storage and egress are excluded from those, so the real crossover is higher."

