        confidence: verified
        note: >-
          "Free for all use — development, testing, and production — up to a rate limit of 2,000
          requests per second (RPS)." No API key, no signup, no published volume cap. 51 mainnet +
          14 testnet endpoints. By a wide margin the most generous free tier in the cohort. The
          Foundation covers the POKT burn. Archive/trace per endpoint: NOT PUBLISHED.
      - id: burn
        name: Staked application (pay-per-relay by POKT burn)
        tier: entry
        tier_note: "TIER: banded `entry` by COMMITMENT — no fee; cost is a per-relay token burn. Not a purchasable plan."
        monthly_usd: 0
        annual_monthly_usd: null
        included_units: 0
        allowance_period: month
        overage_per_1m_units_usd: 0.001
        overage_allowed: true
        throughput: {unit: rps, value: null}
        archive: null
        trace: null
        confidence: uncertain
        note: >-
          overage_per_1m_units_usd is the USD peg per 1M COMPUTE UNITS — "1 CU = $1 / 1,000,000,000",
          i.e. $0.001 per 1M CU — NOT per request. Multiply by the chain's compute_units_per_relay
          (Ethereum 1579, Solana 5033) to get $/1M requests: $1.579 and $5.033. There is no plan, no
          monthly fee, no included allowance and no overage. Minimum application stake 100 POKT;
          access is "proportional to your stake" with no published RPS.
      - id: foundation-partnership
        name: Foundation partnership (chain sponsors its users)
        tier: enterprise
        tier_note: "TIER: banded `enterprise` — negotiated with the Pocket Network Foundation, no published fee."
        monthly_usd: 0   # no monthly fee exists; the price is the $0.001/1M CU wholesale rate
        annual_monthly_usd: null
        included_units: null
        allowance_period: month
        overage_per_1m_units_usd: 0.001
        overage_allowed: true
        throughput: {unit: rps, value: null}
        archive: null
        trace: null
        confidence: verified
        note: >-
          "This wholesale, non-profit rate is $1 USD per 1 Billion Compute Units (CUs)", with all RPS
          limits and daily caps removed for the sponsored chain. Negotiated with directors@pokt.foundation.
    weights:
      ethereum:
        default: 1579
        eth_call: 1579
        eth_getLogs: 1579
        eth_getBlockByNumber: 1579
        eth_getBlockReceipts: 1579
        eth_getBalance: 1579
        eth_blockNumber: 1579
        eth_getTransactionReceipt: 1579
        eth_estimateGas: 1579
        eth_sendRawTransaction: 1579
        debug_traceTransaction: 1579
        trace_block: 1579
      solana:
        default: 5033
        getAccountInfo: 5033
        getMultipleAccounts: 5033
        getLatestBlockhash: 5033
        sendTransaction: 5033
        simulateTransaction: 5033
        getProgramAccounts: 5033
        getTransaction: 5033
    archive_rule:
      kind: none
      value: 1
      note: >-
        Weighted per CHAIN, not per method — compute_units_per_relay is fixed per service, so
        debug_traceTransaction costs exactly the same as eth_chainId on the same chain. There is no
        eth_getLogs-costs-more mechanism and no archive surcharge. Solana is 3.19x Ethereum
        (5033 vs 1579), expressed once per chain rather than per method.
    source:
      plans:
        url: https://pocket.network/foundation-partnerships/
        kind: html
        poll: manual
        extraction: "'Public RPC List' server-rendered <table>: chain, CU per request, requests per $1. Greppable; no JSON."
      weights:
        url: https://pocket.network/foundation-partnerships/
        kind: html
        poll: manual
        extraction: "same table — the per-chain CU column IS the weight model"
    caveats:
      - "THIS IS A WHOLESALE INPUT PRICE, NOT A RETAIL PRICE. Payment is a burn of a volatile token pegged to USD only by a governance parameter (CUTTM); the figure excludes the capital cost of the POKT that must be staked to get access, and excludes any gateway markup. A '$1.579 per 1M Ethereum requests vs OnFinality's $2.45' comparison is not like-for-like."
      - "There is no plan, no monthly fee, no included allowance and no overage. You either stake an Application (100 POKT minimum) or delegate to a Gateway that resells on its own terms — Nodies is one such gateway, and its $4.00-$7.50 per 1M retail rate is the same supply with a markup."
      - "Volume rebates (10-40% above 250B CU/day, capped at 128 trillion CU/quarter) are paid by the DAO to GATEWAYS, not to end applications."
      - "Batch and WebSocket metering at the pricing level: NOT PUBLISHED. WebSocket claim handling is an open protocol issue."
      - "The live CUTTM is on-chain and would need a Cosmos SDK REST query to track; the USD peg is governance-maintained, not guaranteed."

