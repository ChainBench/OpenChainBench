        eth_call: 20
        eth_getLogs: 20
        eth_getBlockByNumber: 20
        eth_getBlockReceipts: 20
        eth_getBalance: 20
        eth_blockNumber: 20
        eth_getTransactionReceipt: 20
        eth_estimateGas: 20
        eth_sendRawTransaction: 20
        debug_traceTransaction: 40
        trace_block: 40
      solana:
        default: 50
        getAccountInfo: 50
        getMultipleAccounts: 50
        getLatestBlockhash: 50
        sendTransaction: 50
        simulateTransaction: 50
        getProgramAccounts: 50
        getTransaction: 50
    # Archive cost is an independent lookup column in GetBlock's API, not a
    # multiple of the standard cost: the Ethereum catch-all `others` row is
    # 20 full / 40 archive, while every enumerated debug/trace/txpool method
    # is 40 full / 120 archive. That is a 2x step on one family and a 3x step
    # on the other, so no single multiplier is correct. Values read from
    # platform-api.getblock.io/v3/prices/CU/methods/ (archive_cu).
    archive_weights:
      ethereum:
        default: 40
        eth_call: 40
        eth_getLogs: 40
        eth_getBlockByNumber: 40
        eth_getBlockReceipts: 40
        eth_getBalance: 40
        eth_blockNumber: 40
        eth_getTransactionReceipt: 40
        eth_estimateGas: 40
        eth_sendRawTransaction: 40
        debug_traceTransaction: 120
        trace_block: 120
      solana:
        default: 100
        getAccountInfo: 100
        getMultipleAccounts: 100
        getLatestBlockhash: 100
        sendTransaction: 100
        simulateTransaction: 100
        getProgramAccounts: 100
        getTransaction: 100
    archive_rule:
      kind: none
      value: 1
      note: >-
        Superseded by archive_weights above. NOT a multiplier and NOT computable. archive_cu is an INDEPENDENT lookup column in
        prices/CU/methods/. On Ethereum the catch-all `others` row is 20 full / 40 archive, while every
        enumerated debug/trace/txpool method is 40 full / 120 archive — archive_multiplier is a flat
        ceiling of 6, so it is a 3x step on the 2x family and a 1.5x step on the 4x family. The
        published formula (Chain x Method x Archive Modifier) is arithmetically impossible against
        GetBlock's own API: it understates the 2x family by 33% (80 vs 120) and overstates the 4x
        family by 33% (160 vs 120). Read full_cu / archive_cu directly. Solana does obey the formula (x2).
    source:
      plans:
        url: https://platform-api.getblock.io/v3/prices/public/plans/
        kind: json
        poll: manual
        extraction: "$['plans/*'] -> .name, .price, .cu_amount, .rps, .periods_with_prices['12m'].regular.discount_price. Filter is_archived; key on _key (four dead plans are all named 'Start')."
      weights:
        url: https://platform-api.getblock.io/v3/prices/CU/methods/
        kind: json
        poll: manual
        extraction: "flat array of 2,159 objects {method, protocol, full_multiplier, archive_multiplier, full_cu, archive_cu} across 100 protocols; the default is an explicit row with method == 'others'"
    caveats:
      - "GetBlock's marketing contradicts GetBlock's own table: 'heavy calls such as eth_getLogs cost more CUs than a simple balance lookup' is false — eth_getLogs is not in the method table and bills at 20 CU on Ethereum, identical to eth_getBalance. The weighting bites ONLY on debug_*/trace_*/txpool_* (EVM) and 7 Solana methods."
      - "Both /v3/prices/ endpoints are UNDOCUMENTED internal APIs with no ETag, no Last-Modified and no Cache-Control; /v3/prices/ and /v3/prices/CU/ both 404 so there is no index to detect a rename from. Highest silent-breakage risk in the cohort despite being the best data."
      - "The pricing page's SSR payload puts the free allowance in the same cuAmount field as the monthly plans (free.cuAmount = 50000). A scraper reads the free tier as 50,000 CU/MONTH — a 30x error. Only the docs carry the /day qualifier."
      - "Annual discount is 20% then floored to whole dollars (588 x 0.80 = 470.40 -> 470); the 3-month term is 5% then floored and is absent from every public page."
      - "Batch metering, WebSocket per-event metering, free-tier cap behaviour, egress fees and overage rates below Pro: all NOT PUBLISHED."

