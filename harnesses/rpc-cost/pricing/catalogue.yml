      routes calls to third-party "Lava RPC Node Providers" and rewards them from chain-funded pools;
      its own docs describe the developer-facing product as a gateway over that supplier set, and the
      only on-chain plan is literally named `gateway`. (2) NO PUBLISHED PRICE, which would exclude it
      on its own: Lava's per-method CU table is excellent and machine-readable (on-chain REST +
      GitHub), but the $ PER CU is either sales-gated or self-disclaimed. The marketing pricing page carries real-looking
      figures ($0/$29/$199/$499/$999/$2,499) under its own verbatim footnote: "CU and rate limits shown
      are illustrative for this mockup; confirm final allotments before launch." The docs plan page has
      no USD figure at all and is form-gated. The only on-chain price is 10,000 LAVA/month for a
      `gateway` plan whose allowed_buyers are two Lava-controlled addresses — not purchasable by a
      developer and not convertible to USD by any Lava-published rate.
