      - id: enterprise
        name: Enterprise
        tier: enterprise
        monthly_usd: null
        annual_monthly_usd: null
        included_units: null
        allowance_period: month
        overage_per_1m_units_usd: null
        overage_allowed: true
        throughput: {unit: cu_per_s, value: null}
        archive: true
        trace: true
