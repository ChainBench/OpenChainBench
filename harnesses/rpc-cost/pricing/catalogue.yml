# OpenChainBench — RPC provider pricing catalogue
# Normalized from wave-1 collection + wave-2 adversarial verification.
# Wave 2 wins on every CORRECTED field; UNRESOLVED fields carry both readings and confidence: uncertain.
# Every number here traces to a wave-2-verified value, or to a wave-1 value wave 2 did not contradict.
# Where a figure exists only as an assumption it is null and the assumption is in `note`.
version: 1
as_of: "2026-09-29"

fx:
  eur_usd: 1.1355
  source: "ECB euro foreign-exchange reference rate, via api.frankfurter.dev/v1/latest?base=EUR&symbols=USD"
  rate_date: "2026-09-29"
  cross_check: 1.137347   # open.er-api.com/v6/latest/EUR, 2026-09-29T00:02:31Z — 0.16% above the ECB rate
  note: >-
    Applied nowhere in this file. NOWNodes prices stay in EUR with currency: EUR so the conversion is
    visible at the point of use rather than baked into the catalogue.

conventions:
  month_days: 30
  month_seconds: 2592000
  note: >-
    Providers whose allowance is daily (Infura, GetBlock free, 1RPC, Omnia, OnFinality Developer) are
    recorded with their published daily figure and allowance_period: day. Any monthly rollup assumes
    perfectly flat traffic across 30 days; a bursty workload is strictly worse because these quotas
    do not roll over.

providers:

# ─────────────────────────────────────────────────────────────── usage cohort

