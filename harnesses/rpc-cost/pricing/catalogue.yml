        annual_monthly_usd: null
        included_units: 0
        allowance_period: month
        overage_per_1m_units_usd: 0.525
        overage_allowed: true
        throughput: {unit: cu_per_s, value: 30000}   # self-serve ceiling: PAYG includes 10,000 and sells 5,000 more per $160/mo up to 30,000
        archive: true
        trace: true
        confidence: verified
        note: >-
          Flat $0.525 per 1M CU across all usage — no volume tiering. The old $0.45/$0.40 ladder was
          deleted 2026-09-11 (docs PR #1615). 10,000 CU/s included (~300 RPS); above that $160/mo per
