        docs text. Wayback on docs/billing/credits shows the archival rule changed from 10 to 1
        between 2026-01-23 and 2026-04-11, and two other live primaries agree at 1
        ("All archival methods cost 1 credit"). Scoring archival at 10 overstates Helius 10x.
    source:
      plans:
        url: https://www.helius.dev/pricing.md
        body_sha256: d91c8fd0fbc4236dac1f4933b39be305f19fe2cf45bb6b8eadc1b15de0fde83d
        verified_at: "2026-09-30"
        kind: markdown
        poll: etag
        extraction: "^### (?P<plan>\\w+) - \\$(?P<usd>[\\d,]+)/month$ ; detail under '## Detailed Plan Comparison'"
      weights:
        url: https://www.helius.dev/docs/billing/credits.md
        body_sha256: cfc41720a5a403880dc034c61fb059645d71194602b3e0479e15c65b18908327
        verified_at: "2026-09-30"
        kind: markdown
        poll: body_hash
        extraction: "MDX <table> blocks under '## Standard Credits' (Service | Credits | Notes); class-level, not per-method"
    caveats:
      - "Solana only. No EVM product at any price."
      - "getProgramAccounts is 10 credits but getProgramAccountsV2 is 1 — a 10x difference between two names one character apart."
      - "Sender costs 0 credits but requires a SOL tip (0.001 SOL minimum on Sender Max). A $0.00 column for Sender is wrong in substance; the tip floor dominates."
      - "pricing.md front-matter reads last-updated 2025-01-20 while the body describes features metering from 2026-09-24. Dead metadata — never poll it. Its ETag is a true content hash (MD5 of the body); credits.md has no ETag and a render-time Last-Modified, so hash the body."
      - "Crypto (USDC) payers cannot use autoscaling at all and must buy prepaid credits manually."
      - "Enhanced Transactions API and Wallet API are 100 credits each — $500 per 1M calls at the overage rate."

