      - "Four different published answers to 'how many chains': marketing 28+, docs FAQ 'over 30', docs plan pages 'Lava and Starknet only', on-chain show_all_chains 50+."
      - "The marketing pricing page is NEW — Wayback shows lavanet.xyz/pricing 404 on 2026-06-02 — and still carries the mockup disclaimer."
      - "The on-chain CU table would be an excellent harness target if a dollar rate ever appears."

