      - "There is no $/credit overage rate anywhere. At the cap you get HTTP 402 and WebSocket connections are severed. The only escape is the $200 add-on or a plan upgrade."
      - "402 and 429 responses are free; other 4xx cost 5 credits; an unknown JSON-RPC method costs 160."
      - "docs.infura.io/get-started/pricing.md contains zero dollar figures — it is a prose allowance list. Plan dollars exist only inside the HTML page's __NEXT_DATA__."
