      - "20 CU is a CEILING, not a bill. dRPC is a router; operators may discount the base price per method/chain/archive/region via a `mul` multiplier constrained to 0..1 ('base price is currently price ceiling'). Those multipliers are not published, no response header reports CU charged, and calls routed to public providers are billed at zero."
      - "Provider selection is random with probability proportional to a rating recomputed every 5 seconds that takes operator price as an input — two identical requests a second apart can bill differently."
      - "The charge is provisional and settled after the fact against the providers that did meaningful work; dRPC's cost-model doc allows it to 'deduct more'."
      - "dRPC's own calculator computes at $5.988/1M (1 USD = 3,340,000 CU); the published $0.30/1M CU is that constant rounded. 0.2% gap, immaterial."
