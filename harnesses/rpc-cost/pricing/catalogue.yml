        note: SALES-GATED. Re-confirmed 2026-09-29; no rate, no seat price, no app count agreed.
    weights:
      ethereum:
        default: null            # Alchemy publishes no fallback default; unlisted methods are unpriced
        eth_call: 26
        eth_getLogs: 60
        eth_getBlockByNumber: 20
        eth_getBlockReceipts: 20
        eth_getBalance: 20
        eth_blockNumber: 10
        eth_getTransactionReceipt: 20
        eth_estimateGas: 20
        eth_sendRawTransaction: 40
        debug_traceTransaction: 40
        trace_block: 20
      # separate meter -- what counts against CU/s, not against the bill
      solana:
        default: null
        getAccountInfo: 10
        getMultipleAccounts: 20
        getLatestBlockhash: 20
        sendTransaction: 20
        simulateTransaction: 20
        getProgramAccounts: 20
        getTransaction: 40
    # Alchemy meters volume in Compute Units and the rate limit in
    # Throughput Compute Units, and the two differ by up to 25x on the same
    # method. Its published table fills the Throughput column only where it
    # differs; a blank means the CU value applies, which is the reading that
    # reproduces Alchemy's own worked examples exactly. Values below are the
    # CU column with the three published overrides applied.
    throughput_weights:
      ethereum:
        default: null
        eth_call: 26
        eth_getLogs: 60
        eth_getBlockByNumber: 20
        eth_getBlockReceipts: 500
        eth_getBalance: 20
        eth_blockNumber: 10
        eth_getTransactionReceipt: 20
        eth_estimateGas: 20
        eth_sendRawTransaction: 50
        debug_traceTransaction: 1000
        trace_block: 20
    archive_rule:
      kind: none
      value: 1
      note: >-
        Archive draws on the same CU pool with no surcharge ("Archival data — Free up to 30M CU").
        Free tier includes archive; debug/trace are PAYG-only.
    source:
      plans:
        url: https://www.alchemy.com/docs/reference/pricing-plans.md
        body_sha256: 141879aab5b692382d3e9d8bbedf5ed6ccc6fbbdffd5ac08f7878f82cc5ddc1c
        verified_at: "2026-09-30"
        kind: markdown
        poll: body_hash
        extraction: "table under '## Feature comparison'; rows 'Compute Unit rate', 'Base Compute Units', 'Base Throughput (CUs/second)'; read col 2 (PAYG)"
      weights:
        url: https://www.alchemy.com/docs/reference/compute-unit-costs.md
        body_sha256: 6fcfa2398263bdcdc6c889fc096de3da4c4997a97ab8f9c6c3a0210a056e899a
        verified_at: "2026-09-30"
        kind: markdown
        poll: body_hash
        extraction: "slice between {/* cu:auto product=\"evm\" */} and {/* cu:auto end */}; header '| Method | CU | Throughput CU |'; 41 product blocks"
    caveats:
      - "Last-Modified is render-time on both .md files and advances every fetch — conditional GET is useless; hash the body."
      - "Method names arrive backslash-escaped (eth\\_chainId); strip before keying."
      - "Average CU/request is UNRESOLVED: docs FAQ says 25, pricing page and calculator say 27 — a ±8% band on any $/1M-request headline. Alchemy publishes four mutually inconsistent request→CU factors (20, 25, 27, 33.3)."
      - "Throughput capacity is billed on 'Throughput CU', not billing CU — eth_getBlockReceipts is 20 CU billed but 500 CU/s of capacity, debug_traceTransaction 40 vs 1000. A trace or receipts workload can exceed the 30,000 CU/s self-serve ceiling long before it is expensive."
      - "EVM WebSocket/webhook events bill 0.04 CU/byte (~$21,000/TB); Solana WS 0.0002 CU/byte (~$105/TB); Solana Yellowstone gRPC $75/TB. The 200x EVM/Solana gap is real, not a typo."
      - "eth_getLogs is 60 CU. The 75 on the compute-units page is frozen legacy prose (its own worked example only balances at 75 and has had no content edit since 2026-02-23)."

