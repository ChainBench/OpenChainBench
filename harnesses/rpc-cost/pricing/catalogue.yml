      - "'Starter / Pro / Scale' are NOT plans — they are the metadata.paygoTier band on 13 credit tiers inside a single PAYGO Stripe product."
      - "unit_amount is in CENTS; a naive read publishes 4900 dollars. The _yearly and _2year lookup keys both carry recurring.interval 'year' and are period TOTALS, not monthly."
      - "The PAYGO overage string says '$9 per credit equating to $9 per million credits'. The companion field ($0.000009 per call) resolves it: $9.00 per 1M credits. 'per credit' is a typo."
      - "Unused credits do not roll over. The free tier's 100k credits are LIFETIME, not monthly."
      - "docs.tatum.io/llms-full.txt 404s with a 383 KB HTML body; docs.tatum.io/llms.txt returns 200 with a 503 KB SPA shell. Assert Content-Type and a content sentinel, not size."
      - "Per-method credit costs below class granularity, eth_subscribe/WebSocket metering and batch treatment: NOT PUBLISHED."

