      - "The .md pricing pages 403 to curl AND to a full Chrome UA (TLS/JA3 fingerprint gate, not User-Agent). Use llms-full.txt, which is served from a different cache path, returns 200 and supports If-Modified-Since."
      - "llms-full.txt is 2.5 MB and the two tables sit at lines ~17,400 and ~56,548 with escaped dollar signs. A truncated grep reports 'no pricing here' and is wrong — this is exactly the error that produced wave 1's 'NO MACHINE-READABLE SOURCE EXISTS' verdict."
      - "Two near-duplicate plan tables exist ('## Plan Overview' and '## Plan Tiers'). They agree today; a harness must fail loudly if they ever diverge rather than pick the first."
      - "Odd published asymmetries: eth_getBlockByHash 12 vs eth_getBlockByNumber 3; eth_getTransactionReceipt 8 vs eth_getBlockReceipts 3."
      - "Secondary comparison posts circulating 'eth_chainId 0, eth_blockNumber 10, eth_call 26, eth_getLogs 60' for Moralis contradict the primary table (3/3/3/12) and are REJECTED."

