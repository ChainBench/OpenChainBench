global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'chain', 'aggregator']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m
  receiver: 'slack-webhook'

receivers:
  # Replace with your own Slack-bridge webhook URL before deploying.
  # In your alertmanager container's entrypoint, run
  #   envsubst < alertmanager.yml.tpl > alertmanager.yml
  # so the value comes from the SLACK_WEBHOOK_URL env var, not the repo.
  - name: 'slack-webhook'
    webhook_configs:
      - url: 'https://example.invalid/your-slack-webhook'
        send_resolved: true

inhibit_rules:
  # Inhibit warning alerts if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'chain', 'aggregator']

  # Inhibit stale metrics alerts if service is down
  - source_match:
      alert_type: 'service_down'
    target_match:
      alert_type: 'stale_metrics'

  # Inhibit stale metrics if missing metrics alert is firing
  - source_match:
      alert_type: 'missing_metrics'
    target_match:
      alert_type: 'stale_metrics'
    equal: ['aggregator']
