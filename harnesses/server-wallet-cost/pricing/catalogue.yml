        confidence: verified
        quote_above: { wallets: 10, signatures: 100 }
      - id: basic
        name: Basic
        annual_usd: 8000
        confidence: verified
        quote_above: { wallets: 10000, signatures: 1000 }
      - id: pro
        name: Pro
        annual_usd: 35000
        confidence: verified
