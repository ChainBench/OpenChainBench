        name: Prepaid credits
        monthly_usd: 0
        confidence: uncertain
        bound: lower
        tiers:
          signatures: [{ rate: 0.01 }]
    source:
      pricing:
        url: https://developer.litprotocol.com/management/pricing.md
        body_sha256: 44d7a035dcc321c080bc90e8c0130da4eb140fa78c606e70db1efdbb9d44a1e7
        verified_at: "2026-10-29"
        poll: true

  - slug: turnkey
    name: Turnkey
    url: https://www.turnkey.com
