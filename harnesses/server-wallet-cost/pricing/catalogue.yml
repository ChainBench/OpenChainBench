      transactions: { per_tx: 1 }
    plans:
      - id: free
        name: Free
        monthly_usd: 0
        confidence: verified
        quote_above: { active_wallets: 1000, transactions: 2000 }
    source:
      pricing:
        url: https://www.crossmint.com/pricing
        body_sha256: 5ab59425dadae17656247d9bffbf9d27d2c8a61e3aaab3d7e020d6984cc03e87
        verified_at: "2026-10-29"
        poll: true

  # Named so the methodology can say why, never priced.
  - slug: dynamic
    name: Dynamic
    url: https://www.dynamic.xyz
    cohort: excluded
    excluded_reason: >-
      Prices per monthly active user; server wallets have no Dynamic user and
      no published price of their own.
  - slug: fireblocks
    name: Fireblocks
    url: https://www.fireblocks.com
    cohort: excluded
    excluded_reason: Plans are sold through sales and bill a share of transaction volume.
  - slug: para
    name: Para
    url: https://www.getpara.com
    cohort: excluded
    excluded_reason: Server-side REST signing is available on request, not self-serve.
  - slug: alchemy
    name: Alchemy
    url: https://www.alchemy.com
    cohort: excluded
    excluded_reason: Its smart wallets use another vendor's signer and publish no signing price of their own.
  - slug: bitgo
    name: BitGo
    url: https://www.bitgo.com
    cohort: excluded
    excluded_reason: No published price.
  - slug: fordefi
    name: Fordefi
    url: https://www.fordefi.com
    cohort: excluded
    excluded_reason: No published price.
