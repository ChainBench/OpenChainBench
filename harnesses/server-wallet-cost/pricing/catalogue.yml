      pricing:
        url: https://www.dfns.co/pricing
        body_sha256: 260887d11c99e18a92da9943bc2310b4146c410cfe22172c0811a1d122118361
        verified_at: "2026-10-29"
        poll: true

  - slug: crossmint
    name: Crossmint
    url: https://www.crossmint.com
    cohort: ranked
    unit: Monthly active wallets, free tier only
    note: >-
      Free up to 1,000 wallets and 2,000 transactions. Beyond, two different
