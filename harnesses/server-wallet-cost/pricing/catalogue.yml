# Server and agent wallet pricing catalogue, the input of record for bench
# server-wallet-cost (310). Same model and rules as bench 309's catalogue
# (harnesses/wallet-cost/pricing/catalogue.yml); read its header for the
# grammar of meters, tiers, caps, quote_above, minimum and uncertain_above.
#
# What differs: there is no end user. A company's backend or an AI agent
# holds the wallets and signs. Each scenario has its own axis x, and the
# month's ACTIVE wallets and TRANSACTIONS are affine in it:
#
#   wallets = wallets_fixed + wallets_per_x * x
#   tx      = tx_fixed      + tx_per_x      * x
#
# A meter is per_wallet x wallets + per_tx x tx. Every wallet in a scenario
# transacts every month, so "active wallets" and "wallets held" are the same
# number here; for a vendor that caps wallets HELD this is a lower bound.
# Creating a wallet is a one-time cost and is left out of the monthly bill.
# A transaction is one signature followed by one broadcast. Gas is excluded.

version: 1
as_of: "2026-10-29"

scenarios:
  - id: agents
    label: AI agents
    axis: agents
    wallets_fixed: 0
    wallets_per_x: 1
    tx_fixed: 0
    tx_per_x: 50
    floor: 10
    ceiling: 100000
    sizes:
      - { id: small, x: 1000 }
      - { id: medium, x: 10000 }
      - { id: large, x: 100000 }
  - id: bot
    label: Trading bot
    axis: transactions a month
    wallets_fixed: 20
    wallets_per_x: 0
    tx_fixed: 0
    tx_per_x: 1
    floor: 1000
    ceiling: 10000000
    sizes:
      - { id: small, x: 10000 }
      - { id: medium, x: 100000 }
      - { id: large, x: 1000000 }
  - id: payouts
    label: Payouts
    axis: payout wallets
    wallets_fixed: 0
    wallets_per_x: 1
    tx_fixed: 0
    tx_per_x: 2
    floor: 100
    ceiling: 1000000
    sizes:
      - { id: small, x: 1000 }
      - { id: medium, x: 10000 }
      - { id: large, x: 100000 }

headline: { scenario: agents, size: medium }

providers:
  - slug: coinbase-cdp
    name: Coinbase CDP
    url: https://www.coinbase.com/developer-platform
    cohort: ranked
    unit: Wallet operations
    note: >-
      "Pricing is consistent across wallet types": server wallets on API-key
      authentication bill the same operations as embedded ones. Sending a
      transaction (sign and broadcast) is 2 operations. A policy evaluation
      is 1 more; these scenarios configure no policy. Creating an account is
      1 operation, once.
    meters:
      operations: { per_tx: 2 }
    plans:
      - id: payg
        name: Pay as you go
        monthly_usd: 0
        confidence: verified
        tiers:
          operations: [{ up_to: 5000, rate: 0 }, { rate: 0.005 }]
    source:
      pricing:
        url: https://docs.cdp.coinbase.com/wallets/pricing.md
        body_sha256: 8276ec67b1699b1133abe997d3b8aa7d237ac882b55f73f2367f6948eb7a3d18
        verified_at: "2026-10-29"
        poll: true

  - slug: openfort
    name: Openfort
    url: https://www.openfort.io
    cohort: ranked
    unit: Wallet operations
    note: >-
      Backend wallets are in every plan. A payment is "two operations: sign,
      then broadcast". A project without a paid subscription "stops at the
      included limit" with HTTP 402, while the Free card offers $0.01 per
      operation once a payment method is added. Both readings are priced:
      Free stops at 2,000 (exact), and "Free with a card" meters $0.01 an
      operation past it, as a lower bound since the FAQ says that plan
      stops instead; it is never named cheapest.
    meters:
      operations: { per_tx: 2 }
    plans:
      - id: free
        name: Free
        monthly_usd: 0
        confidence: verified
        caps: { operations: 2000 }
      - id: free-card
        name: Free with a card
        monthly_usd: 0
        confidence: uncertain
        bound: lower
        tiers:
          operations: [{ up_to: 2000, rate: 0 }, { rate: 0.01 }]
      - id: growth
        name: Growth
        monthly_usd: 99
        confidence: verified
        tiers:
          operations: [{ up_to: 25000, rate: 0 }, { rate: 0.008 }]
      - id: pro
        name: Pro
        monthly_usd: 249
        confidence: verified
        tiers:
          operations: [{ up_to: 100000, rate: 0 }, { rate: 0.006 }]
      - id: scale
        name: Scale
        monthly_usd: 599
        confidence: verified
        tiers:
          operations: [{ up_to: 500000, rate: 0 }, { rate: 0.004 }]
    source:
      pricing:
        url: https://www.openfort.io/pricing
        body_sha256: 3275b5fb44180e305ea2b17ec63b9be9627f694555beafd89ed20f8bc0326074
        verified_at: "2026-10-29"
        poll: true

  - slug: magic
    name: Magic
    url: https://magic.link
    cohort: ranked
    unit: Monthly active wallets plus signatures
    note: >-
      Server wallets on Express or Core "count when they successfully sign".
      Every successful signing request counts against 50,000 a month per
      team. Magic signs; broadcasting is the customer's.
    meters:
      active_wallets: { per_wallet: 1 }
      signatures: { per_tx: 1 }
    plans:
      - id: developer
        name: Developer
        monthly_usd: 0
        confidence: verified
        tiers:
          active_wallets: [{ up_to: 1000, rate: 0 }, { rate: 0.045 }]
          signatures: [{ up_to: 50000, rate: 0 }, { rate: 0.005 }]
      - id: startup
        name: Startup
        monthly_usd: 99
        confidence: verified
        tiers:
          active_wallets: [{ up_to: 2500, rate: 0 }, { rate: 0.04 }]
          signatures: [{ up_to: 50000, rate: 0 }, { rate: 0.005 }]
    source:
      pricing:
        url: https://magic.link/pricing
        body_sha256: a8194db2eabb982af7eb2405fdbfadef4598c3b711b9a806018a3da3ee6c2f87
        verified_at: "2026-10-29"
        poll: true

  - slug: privy
    name: Privy
    url: https://www.privy.io
    cohort: ranked
    unit: Signatures
    note: >-
      Server wallets have no Privy user, so only signatures are billed: 50,000
      a month free, then pay-as-you-go at a $2,000 base and $0.01 per
      signature. Privy also bills apps above $1M of monthly transaction
      volume "based on usage" at a rate it does not publish; a real payout or
      trading flow is likely to cross it, so every Privy price here is a
      lower bound.
    meters:
      signatures: { per_tx: 1 }
    plans:
      - id: free
        name: Free
        monthly_usd: 0
        confidence: uncertain
        bound: lower
        caps: { signatures: 50000 }
      - id: payg
        name: Pay as you go
        monthly_usd: 2000
        confidence: uncertain
        bound: lower
        tiers:
          signatures: [{ up_to: 50000, rate: 0 }, { rate: 0.01 }]
    source:
      pricing:
        url: https://www.privy.io/pricing
        body_sha256: 5cee07da8b21944d68ac6706cdffb8f124eb91d70641e82f468e5535540c34b3
        verified_at: "2026-10-29"
        poll: true

  - slug: thirdweb
    name: thirdweb
    url: https://thirdweb.com
    cohort: ranked
    unit: Server wallet requests, banded
    note: >-
      Server wallets bill per API request: 1,000 included, then $1, $0.60
      and $0.20 per thousand at 100K and 250K. A transaction is one request
      that signs and sends. Priced band by band; whether the lower rate
      applies to the whole count is not stated.
    # Metered in thousands of requests, the unit the page prices in, so the
    # drift check finds every rate on the page as written.
    meters:
      thousand_requests: { per_tx: 0.001 }
    plans:
      - id: growth
        name: Growth
        monthly_usd: 99
        confidence: verified
        uncertain_above: { thousand_requests: 100 }
        bound: upper
        note: >-
          Unambiguous to 100,000 requests. Above, priced band by band, the
          higher reading: if a lower rate applies to the whole count the bill
          is smaller, so this is the most thirdweb would charge.
        tiers:
          thousand_requests:
            - { up_to: 1, rate: 0 }
            - { up_to: 100, rate: 1 }
            - { up_to: 250, rate: 0.60 }
            - { rate: 0.20 }
    source:
      pricing:
        url: https://thirdweb.com/pricing
        body_sha256: d9056af82567c1451d8887384fda974138bf30f98bb45b059f63ad892ed10738
        verified_at: "2026-10-29"
        poll: true

  - slug: circle
    name: Circle
    url: https://www.circle.com/wallets
    cohort: ranked
    unit: Monthly active wallets, banded
    note: >-
      Developer-controlled wallets bill per monthly active wallet, one that
      "conducted an on-chain transaction" that month, with no fee per
      transaction. Two plans, both graduated by band: "Signing API only"
      (Circle signs, the customer broadcasts, as at Turnkey, Magic, Lit and
      Portal; Circle's signing APIs are for developer-controlled wallets
      "when you manage broadcasting yourself") and All-included (signing,
      indexing, broadcasting). A bot's 20 wallets sit inside the free 1,000
      at any volume. Added 2026-10-30: the signing-only plan was missed.
    meters:
      active_wallets: { per_wallet: 1 }
    plans:
      - id: signing-api
        name: Signing API only
        monthly_usd: 0
        confidence: verified
        tiers:
          active_wallets:
            - { up_to: 1000, rate: 0 }
            - { up_to: 5000, rate: 0.038 }
            - { up_to: 10000, rate: 0.035 }
            - { up_to: 25000, rate: 0.030 }
            - { up_to: 50000, rate: 0.026 }
            - { up_to: 100000, rate: 0.023 }
            - { up_to: 250000, rate: 0.015 }
            - { rate: 0.012 }
      - id: all-included
        name: All-included
        monthly_usd: 0
        confidence: verified
        tiers:
          active_wallets:
            - { up_to: 1000, rate: 0 }
            - { up_to: 5000, rate: 0.050 }
            - { up_to: 10000, rate: 0.047 }
            - { up_to: 25000, rate: 0.040 }
            - { up_to: 50000, rate: 0.035 }
            - { up_to: 100000, rate: 0.030 }
            - { up_to: 250000, rate: 0.025 }
            - { rate: 0.020 }
    source:
      pricing:
        url: https://www.circle.com/wallets
        body_sha256: e1d3f810e9b33eb8154fe744f48c7b8030315d92ab15cb4f8a3c23a3e3fbad6f
        verified_at: "2026-10-29"
        poll: true

  - slug: lit
    name: Lit Protocol
    url: https://www.litprotocol.com
    cohort: ranked
    unit: Prepaid credits per execution second
    note: >-
      Prepaid credits, no subscription. A Lit Action is billed $0.01 per
