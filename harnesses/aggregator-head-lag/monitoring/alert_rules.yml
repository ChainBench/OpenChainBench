groups:
  - name: aggregator_latency_alerts
    interval: 30s
    rules:
      # Missing metrics alerts
      - alert: MissingMobulaMetrics
        expr: absent(rest_api_latency_milliseconds_count{aggregator="mobula"})
        for: 5m
        labels:
          severity: critical
          aggregator: mobula
          alert_type: missing_metrics
        annotations:
          summary: "Mobula metrics are missing"
          description: "No REST API metrics received from Mobula for 5 minutes. Check API key and monitor status."

      # Stale metrics alerts (>20 minutes without update)
      - alert: MobulaEthereumStaleMetrics
        expr: (time() - timestamp(rest_api_latency_milliseconds_count{aggregator="mobula",chain="ethereum"})) > 1200
        for: 2m
        labels:
          severity: warning
          aggregator: mobula
          chain: ethereum
          alert_type: stale_metrics
        annotations:
          summary: "Mobula Ethereum metrics are stale"
          description: "Mobula Ethereum REST API hasn't responded in over 20 minutes. Check API connectivity."

      - alert: MobulaBaseStaleMetrics
        expr: (time() - timestamp(rest_api_latency_milliseconds_count{aggregator="mobula",chain="base"})) > 1200
        for: 2m
        labels:
          severity: warning
          aggregator: mobula
          chain: base
          alert_type: stale_metrics
        annotations:
          summary: "Mobula Base metrics are stale"
          description: "Mobula Base REST API hasn't responded in over 20 minutes. Check API connectivity."

      # Latency spike alerts
      - alert: MobulaEthereumLatencySpike
        expr: |
          (
            rate(rest_api_latency_milliseconds_sum{aggregator="mobula",chain="ethereum"}[5m]) /
            rate(rest_api_latency_milliseconds_count{aggregator="mobula",chain="ethereum"}[5m])
          ) > 500
        for: 3m
        labels:
          severity: warning
          aggregator: mobula
          chain: ethereum
          alert_type: latency_spike
        annotations:
          summary: "Mobula Ethereum latency spike"
          description: "Mobula Ethereum average latency is {{ $value | humanize }}ms over the last 5 minutes (threshold: 500ms)"

      - alert: MobulaBaseLatencySpike
        expr: |
          (
            rate(rest_api_latency_milliseconds_sum{aggregator="mobula",chain="base"}[5m]) /
            rate(rest_api_latency_milliseconds_count{aggregator="mobula",chain="base"}[5m])
          ) > 500
        for: 3m
        labels:
          severity: warning
          aggregator: mobula
          chain: base
          alert_type: latency_spike
        annotations:
          summary: "Mobula Base latency spike"
          description: "Mobula Base average latency is {{ $value | humanize }}ms over the last 5 minutes (threshold: 500ms)"

      # Instant spike detection for Mobula (any single request >10s)
      - alert: MobulaInstantLatencySpike
        expr: |
          rest_api_latency_milliseconds{aggregator="mobula"} > 10000
        labels:
          severity: warning
          aggregator: mobula
          alert_type: instant_spike
        annotations:
          summary: "Mobula instant latency spike on {{ $labels.chain }}"
          description: "Mobula {{ $labels.chain }} single request took {{ $value | humanize }}ms (>10s). Brief spike detected."

      # Extreme latency spikes (>5x normal)
      - alert: MobulaExtremeLatencySpike
        expr: |
          (
            rate(rest_api_latency_milliseconds_sum{aggregator="mobula"}[5m]) /
            rate(rest_api_latency_milliseconds_count{aggregator="mobula"}[5m])
          ) > 1000
        for: 1m
        labels:
          severity: critical
          aggregator: mobula
          alert_type: extreme_latency
        annotations:
          summary: "Mobula EXTREME latency spike on {{ $labels.chain }}"
          description: "Mobula {{ $labels.chain }} latency is {{ $value | humanize }}ms (>1000ms). Possible service degradation."

      # Error rate alerts
      - alert: HighRESTErrorRate
        expr: |
          (
            rate(rest_api_errors_total[5m]) /
            (rate(rest_api_errors_total[5m]) + rate(rest_api_latency_milliseconds_count[5m]))
          ) > 0.1
        for: 5m
        labels:
          severity: warning
          alert_type: high_error_rate
        annotations:
          summary: "High REST API error rate for {{ $labels.aggregator }} {{ $labels.chain }}"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes (threshold: 10%)"

      # Service availability
      - alert: CodexServiceDown
        expr: up{job="latency_monitor"} == 0
        for: 2m
        labels:
          severity: critical
          alert_type: service_down
        annotations:
          summary: "Latency monitor service is down"
          description: "The aggregator latency monitor has been down for 2 minutes. No metrics are being collected."
