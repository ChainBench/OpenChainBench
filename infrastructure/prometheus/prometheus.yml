global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: openchainbench

# OpenChainBench is a federation: each harness is hosted by whoever wrote it
# (Mobula, an independent contributor, a provider that wants to be benchmarked).
# This single shared Prometheus scrapes every harness's public /metrics
# endpoint and aggregates everything into one queryable instance. the URL
# referenced by every YAML spec's `prom_url`.
#
# To onboard a new harness:
#   1. The contributor exposes /metrics on a publicly reachable URL
#      (Railway, Fly, Cloud Run, a VPS. anywhere with HTTPS).
#   2. Append a `- job_name: <slug>` block below pointing at that URL.
#   3. Open a PR. Once merged, redeploy the prometheus service so it picks
#      up the new target (or hit the /-/reload endpoint).
#
# All metrics receive a `benchmark: <slug>` label automatically; YAML specs
# use it to scope queries.

scrape_configs:
  # ─ Aggregator head lag ────────────────────────────────────────────────
  # Currently hosted by Mobula on Railway. Replace the URL if you fork.
  - job_name: aggregator-head-lag
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - aggregator-head-lag-production.up.railway.app
        labels:
          benchmark: aggregator-head-lag
          host: mobula

  # ─ Bridge quote latency + cost ────────────────────────────────────────
  # Currently hosted by Mobula on Railway. Replace the URL if you fork.
  - job_name: bridge-monitor
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - bridge-monitor-production.up.railway.app
        labels:
          benchmark: bridge-monitor
          host: mobula

  # ─ Wallet labels coverage ────────────────────────────────────────────
  # Currently hosted by Mobula on Railway. Replace the URL if you fork.
  - job_name: wallet-labels
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - mobula-monorepo-production-1f1b.up.railway.app
        labels:
          benchmark: wallet-labels
          host: mobula

  # ─ L1 finality ────────────────────────────────────────────────────────
  # Currently hosted by Mobula on Railway. Replace the URL if you fork.
  - job_name: l1-finality
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - l1-finality-production.up.railway.app
        labels:
          benchmark: l1-finality
          host: mobula

  # ─ Metadata coverage ──────────────────────────────────────────────────
  # Currently hosted by Mobula on Railway. Replace the URL if you fork.
  - job_name: metadata-coverage
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - metadata-coverage-production.up.railway.app
        labels:
          benchmark: metadata-coverage
          host: mobula

  # ─ Network coverage ───────────────────────────────────────────────────
  # Currently hosted by Mobula on Railway. Replace the URL if you fork.
  - job_name: network-coverage
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - network-coverage-production.up.railway.app
        labels:
          benchmark: network-coverage
          host: mobula

  # ─ Perp fees ──────────────────────────────────────────────────────────
  # Currently hosted by Mobula on Railway. Replace the URL if you fork.
  - job_name: perp-fees
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - perp-fees-production.up.railway.app
        labels:
          benchmark: perp-fees
          host: mobula

  # ─ PM data freshness ─────────────────────────────────────────────────
  # Cross-correlates Polymarket CLOB WebSocket (T0) vs Mobula PM WS vs
  # Codex (defined.fi) GraphQL WS for the same trade. Reports per-provider
  # millisecond lag.
  #
  # Scraped over Railway internal DNS because the harness lives in the
  # same `Dashboard OpenChainBench` Railway project as this Prometheus.
  # Public *.up.railway.app routes go through the edge and Railway does
  # not always allow same-project traffic to loop back via the public
  # gateway. Internal DNS is HTTP on port 2112 (the harness's exposed
  # /metrics port) — never goes through Cloudflare / edge.
  - job_name: pm-freshness
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - pm-freshness-bench-production.railway.internal:2112
        labels:
          benchmark: pm-freshness
          host: mobula

  # ─ PM venue rate limits + latency ────────────────────────────────────
  # Probes the public APIs of 5 prediction-market venues (Polymarket,
  # Kalshi, Limitless, Manifold, Myriad): warm/cold latency on book,
  # price and list classes, plus a daily rate-limit ramp. One Railway
  # service per region, scraped over internal DNS like pm-freshness.
  # Service names must match these targets when deploying.
  - job_name: pm-rate-limits
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - pm-rate-limits-us.railway.internal:2112
          - pm-rate-limits-eu.railway.internal:2112
          - pm-rate-limits-sgp.railway.internal:2112
        labels:
          benchmark: pm-rate-limits
          host: mobula

  # ─ Self-scrape ────────────────────────────────────────────────────────
  # Surfaces Prometheus's own health (scrape error rates, target up/down)
  # in the same UI used to debug harnesses.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
