global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: openchainbench

# OpenChainBench is a federation: each harness is hosted by whoever wrote it
# (Mobula, an independent contributor, a provider that wants to be benchmarked).
# This single shared Prometheus scrapes every harness's public /metrics
# endpoint and aggregates everything into one queryable instance, the URL
# referenced by every YAML spec's `prom_url`.
#
# One harness per benchmark. Adding a new bench means one new harness Go
# project, one new Railway service, one new scrape job below.
#
# To onboard a new harness:
#   1. The contributor exposes /metrics on a publicly reachable URL
#      (Railway, Fly, Cloud Run, a VPS, anywhere with HTTPS).
#   2. Append a `- job_name: <slug>` block below pointing at that URL.
#   3. Open a PR. Once merged, redeploy the prometheus service so it picks
#      up the new target (or hit the /-/reload endpoint).
#
# All metrics receive a `benchmark: <slug>` label automatically; YAML specs
# use it to scope queries.

scrape_configs:
  # ─ № 001 · aggregator-head-lag ───────────────────────────────────────
  # Hosted by Mobula on Railway. WebSocket monitor + canonical-tip checks.
  - job_name: aggregator-head-lag
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - aggregator-head-lag-production.up.railway.app
        labels:
          benchmark: aggregator-head-lag
          host: mobula

  # ─ № 002 · bridge-quote-latency ──────────────────────────────────────
  # Hosted by Mobula on Railway. Bridge quote loop, latency-focused.
  - job_name: bridge-quote-latency
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - bridge-quote-latency-production.up.railway.app
        labels:
          benchmark: bridge-quote-latency
          host: mobula

  # ─ № 003 · bridge-fee ────────────────────────────────────────────────
  # Hosted by Mobula on Railway. Bridge cost-percent measurement.
  - job_name: bridge-fee
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - bridge-fee-production.up.railway.app
        labels:
          benchmark: bridge-fee
          host: mobula

  # ─ № 004 · metadata-coverage ─────────────────────────────────────────
  # Hosted by Mobula on Railway. Pulse V2 feeder + per-aggregator metadata
  # field checks (logo / description / twitter / website).
  - job_name: metadata-coverage
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - metadata-coverage-production.up.railway.app
        labels:
          benchmark: metadata-coverage
          host: mobula

  # ─ Self-scrape ────────────────────────────────────────────────────────
  # Surfaces Prometheus's own health (scrape error rates, target up/down)
  # in the same UI used to debug harnesses.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
