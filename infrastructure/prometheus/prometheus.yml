global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: openchainbench

# OpenChainBench is a federation: each harness is hosted by whoever wrote it
# (Mobula, an independent contributor, a provider that wants to be benchmarked).
# This single shared Prometheus scrapes every harness's public /metrics
# endpoint and aggregates everything into one queryable instance. the URL
# referenced by every YAML spec's `prom_url`.
#
# To onboard a new harness:
#   1. The contributor exposes /metrics on a publicly reachable URL
#      (Railway, Fly, Cloud Run, a VPS. anywhere with HTTPS).
#   2. Append a `- job_name: <slug>` block below pointing at that URL.
#   3. Open a PR. Once merged, redeploy the prometheus service so it picks
#      up the new target (or hit the /-/reload endpoint).
#
# All metrics receive a `benchmark: <slug>` label automatically; YAML specs
# use it to scope queries.

scrape_configs:
  # ─ Aggregator head lag ────────────────────────────────────────────────
  # Currently hosted by the maintainers on Railway. Replace the URL if you fork.
  - job_name: aggregator-head-lag
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - aggregator-head-lag-production.up.railway.app
        labels:
          benchmark: aggregator-head-lag
          host: openchainbench

  # ─ Bridge quote latency + cost ────────────────────────────────────────
  # Currently hosted by the maintainers on Railway. Replace the URL if you fork.
  - job_name: bridge-monitor
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - bridge-monitor-production.up.railway.app
        labels:
          benchmark: bridge-monitor
          host: openchainbench

  # ─ Wallet labels coverage ────────────────────────────────────────────
  # Currently hosted by the maintainers on Railway. Replace the URL if you fork.
  - job_name: wallet-labels
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - upstream-monorepo-production-1f1b.up.railway.app
        labels:
          benchmark: wallet-labels
          host: openchainbench

  # ─ L1 finality ────────────────────────────────────────────────────────
  # Currently hosted by the maintainers on Railway. Replace the URL if you fork.
  - job_name: l1-finality
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - l1-finality-production.up.railway.app
        labels:
          benchmark: l1-finality
          host: openchainbench

  # ─ Metadata coverage ──────────────────────────────────────────────────
  # Currently hosted by the maintainers on Railway. Replace the URL if you fork.
  - job_name: metadata-coverage
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - metadata-coverage-production.up.railway.app
        labels:
          benchmark: metadata-coverage
          host: openchainbench

  # ─ Network coverage ───────────────────────────────────────────────────
  # Currently hosted by the maintainers on Railway. Replace the URL if you fork.
  - job_name: network-coverage
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - network-coverage-production.up.railway.app
        labels:
          benchmark: network-coverage
          host: openchainbench

  # ─ Perp fees ──────────────────────────────────────────────────────────
  # Currently hosted by the maintainers on Railway. Replace the URL if you fork.
  - job_name: perp-fees
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets:
          - perp-fees-production.up.railway.app
        labels:
          benchmark: perp-fees
          host: openchainbench

  # ─ Self-scrape ────────────────────────────────────────────────────────
  # Surfaces Prometheus's own health (scrape error rates, target up/down)
  # in the same UI used to debug harnesses.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
