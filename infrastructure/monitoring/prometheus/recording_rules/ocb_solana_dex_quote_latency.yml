# Recording rules for OCB bench 029 (solana-dex-quote-latency).
#
# Histogram bench, region-dimensioned only (Solana single chain).
# Same conventions as ocb_evm_quote_latency.yml.
groups:
  - name: ocb_solana_dex_quote_latency
    interval: 60s
    rules:
      - record: ocb:solana_quote_latency_ms:p50_24h
        expr: histogram_quantile(0.50, sum by (provider, region, le) (rate(solana_quote_latency_ms_bucket[24h])))
      - record: ocb:solana_quote_latency_ms:p90_24h
        expr: histogram_quantile(0.90, sum by (provider, region, le) (rate(solana_quote_latency_ms_bucket[24h])))
      - record: ocb:solana_quote_latency_ms:p99_24h
        expr: histogram_quantile(0.99, sum by (provider, region, le) (rate(solana_quote_latency_ms_bucket[24h])))
      - record: ocb:solana_quote_latency_ms:sum_rate_24h
        expr: sum by (provider, region) (rate(solana_quote_latency_ms_sum[24h]))
      - record: ocb:solana_quote_latency_ms:count_rate_24h
        expr: sum by (provider, region) (rate(solana_quote_latency_ms_count[24h]))
      - record: ocb:solana_quote_latency_ms:count_increase_24h
        expr: sum by (provider, region) (increase(solana_quote_latency_ms_count[24h]))
      - record: ocb:solana_quote_success:avg_24h
        expr: avg_over_time(solana_quote_success[24h])
