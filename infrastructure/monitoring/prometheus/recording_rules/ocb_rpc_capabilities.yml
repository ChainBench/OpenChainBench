# Recording rules for OCB bench 010 (rpc-capabilities).
#
# Why: the bench page used to evaluate quantile_over_time(...[24h]) over
# the raw gauge per provider per request. At Vercel cold start every
# bench fires at once and the burst of 24h-window quantiles browns out
# this Prom (providers time out -> partial leaderboards). These rules
# precompute the heavy aggregates once a minute; the site then reads
# them with cheap instant selectors (ocb:* series).
#
# Naming: ocb:<metric_family>:<stat>_<window>. Quantiles over the gauge
# are per-series (labels provider/chain/region/instance preserved); the
# site-side queries wrap them in avg()/sum by () as needed. Counter
# ratios are recorded as numerator/denominator pairs so the site can
# keep ratio-of-sums semantics.
groups:
  - name: ocb_rpc_capabilities
    interval: 60s
    rules:
      - record: ocb:rpc_latency_milliseconds:p50_24h
        expr: quantile_over_time(0.50, rpc_latency_milliseconds[24h])
      - record: ocb:rpc_latency_milliseconds:p90_24h
        expr: quantile_over_time(0.90, rpc_latency_milliseconds[24h])
      # p95 next to p90 and p99, added 2026-10-16 on a provider's request.
      # It was missing for no reason beyond the conventional 50/90/99 triple:
      # 0.95 appeared nowhere in this repo. With a 120 s probe cadence a cell
      # holds about 720 measurements per 24 h, so the p95 rests on the 36th
      # worst sample where the p99 we already publish rests on the 7th. The
      # one that was skipped is the better supported of the two.
      - record: ocb:rpc_latency_milliseconds:p95_24h
        expr: quantile_over_time(0.95, rpc_latency_milliseconds[24h])
      - record: ocb:rpc_latency_milliseconds:p99_24h
        expr: quantile_over_time(0.99, rpc_latency_milliseconds[24h])
      - record: ocb:rpc_latency_milliseconds:mean_24h
        expr: avg_over_time(rpc_latency_milliseconds[24h])
      # `tier` is in the by-clause since 2026-10-16, and its absence was not
      # cosmetic: the keyed harness emits rpc_call_total with tier="keyed",
      # these rules summed it away, and so every keyed spec's success and
      # sample_size query matched nothing. The loader defaults a missing
      # success to 100, so the private cohort published a success rate of
      # exactly 100% on every row as an assumption. Public series carry no
      # tier label, and an absent label equals an empty one, so selectors
      # without `tier` keep matching them unchanged.
      - record: ocb:rpc_call:ok_rate_24h
        expr: sum by (provider, chain, region, tier) (rate(rpc_call_total{result="ok"}[24h]))
      - record: ocb:rpc_call:rate_24h
        expr: sum by (provider, chain, region, tier) (rate(rpc_call_total[24h]))
      - record: ocb:rpc_call:increase_24h
        expr: sum by (provider, chain, region, tier) (increase(rpc_call_total[24h]))

      # Cold-connection arm, added 2026-10-08 with the keyed probe fix.
      #
      # rpc_latency_milliseconds is now explicitly the WARM arm: a probe on a
      # pooled connection. rpc_latency_cold_milliseconds is the same call on a
      # connection that is never reused, so it carries DNS + TCP + TLS every
      # time. The keyed harness alternates between the two, which is why each
      # arm lands half the samples of the old single series.
      #
      # Why the arms exist at all: every probe used to share one implicit
      # transport, so whether a call was warm or cold depended on how often its
      # HOSTNAME happened to be touched. A provider serving nine chains from one
      # hostname stayed warm; a provider using a hostname per chain went cold
      # between 60 s ticks and paid a ~25 ms handshake. That gap, not node
      # speed, was most of the published ranking.
      #
      # No tier filter, same as the rules above: the keyed harness emits the
      # same metric names with tier="keyed", so one rule set covers both
      # cohorts and all three regions.
      - record: ocb:rpc_latency_cold_milliseconds:p50_24h
        expr: quantile_over_time(0.50, rpc_latency_cold_milliseconds[24h])
      - record: ocb:rpc_latency_cold_milliseconds:p90_24h
        expr: quantile_over_time(0.90, rpc_latency_cold_milliseconds[24h])
      - record: ocb:rpc_latency_cold_milliseconds:p95_24h
        expr: quantile_over_time(0.95, rpc_latency_cold_milliseconds[24h])
      - record: ocb:rpc_latency_cold_milliseconds:p99_24h
        expr: quantile_over_time(0.99, rpc_latency_cold_milliseconds[24h])
      - record: ocb:rpc_latency_cold_milliseconds:mean_24h
        expr: avg_over_time(rpc_latency_cold_milliseconds[24h])

      # WebSocket arm, added 2026-10-15. Same keyed endpoints, subscription
      # instead of request/response.
      #
      # The headline is a race rather than a latency: every provider on a chain
      # waits for the same block, so head_lead is the distance from whoever
      # pushed it first and the chain's block time cancels out. Do NOT build a
      # column on time-to-first-head: that is block time with a provider's name
      # on it (7 to 11 s on Ethereum, 240 to 490 ms on Robinhood, for everyone
      # alike).
      #
      # head_lead's p50 is the honest headline. Its mean is not, because one
      # reconnection drags it: a provider that drops a connection misses pushes
      # and then scores a large lead on the block it rejoins.
      #
      # Recorded as bucket rates rather than finished quantiles, following
      # histogram_recording_rules.yml: one rule then serves the headline and
      # every region tab, and the heavy 24h bucket rate is evaluated once a
      # minute here instead of on every page render. Nine new pages each firing
      # a raw rate(..._bucket[24h]) is precisely the outbound-call cost these
      # rules exist to avoid.
      #
      # Keeping the dimensions puts an obligation on the SPEC: it must
      # aggregate with sum by (le) over whatever it does not pin, or
      # prom.scalar takes result[0] and the headline becomes a random cell.
      # That is how a live page once showed a p99 below its own p50.
      - record: ocb:rpc_ws_head_lead_milliseconds_bucket:rate24h
        expr: sum by (provider, chain, region, tier, le) (rate(rpc_ws_head_lead_milliseconds_histogram_bucket[24h]))
      - record: ocb:rpc_ws_head_lead_milliseconds_sum:rate24h
        expr: sum by (provider, chain, region, tier) (rate(rpc_ws_head_lead_milliseconds_histogram_sum[24h]))
      - record: ocb:rpc_ws_head_lead_milliseconds_count:rate24h
        expr: sum by (provider, chain, region, tier) (rate(rpc_ws_head_lead_milliseconds_histogram_count[24h]))

      - record: ocb:rpc_ws_call_milliseconds_bucket:rate24h
        expr: sum by (provider, chain, region, tier, le) (rate(rpc_ws_call_milliseconds_histogram_bucket[24h]))

      # The subscribe round trip is a gauge set once per connection rather than
      # a stream of observations, so a quantile over time is its right shape.
      - record: ocb:rpc_ws_subscribe_milliseconds:p50_24h
        expr: quantile_over_time(0.50, rpc_ws_subscribe_milliseconds[24h])
      - record: ocb:rpc_ws_subscribe_milliseconds:p90_24h
        expr: quantile_over_time(0.90, rpc_ws_subscribe_milliseconds[24h])

      # Win rate as a numerator/denominator pair, the same convention as
      # ocb:rpc_call above, so the site keeps ratio-of-sums semantics when it
      # aggregates across regions. A ratio recorded here would average
      # percentages of unequal block counts instead.
      - record: ocb:rpc_ws_head_first:increase_24h
        expr: sum by (provider, chain, region, tier) (increase(rpc_ws_head_first_total[24h]))
      - record: ocb:rpc_ws_head_seen:increase_24h
        expr: sum by (provider, chain, region, tier) (increase(rpc_ws_head_seen_total[24h]))

      # Stability. Published as a result, not kept as an implementation
      # detail: a provider that reconnects twice in two minutes is unusable for
      # a subscriber however good its median is, and nobody publishes this.
      - record: ocb:rpc_ws_disconnect:increase_24h
        expr: sum by (provider, chain, region, tier) (increase(rpc_ws_disconnect_total[24h]))
      - record: ocb:rpc_ws_messages:increase_24h
        expr: sum by (provider, chain, region, tier) (increase(rpc_ws_messages_total[24h]))
