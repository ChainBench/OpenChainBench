groups:
  - name: aggregator_latency_alerts
    interval: 30s
    rules:
      # NOTE: rules depending on rest_api_latency_* / rest_api_errors_total were
      # removed when the binary was split — those metrics belong to a future
      # bench (REST API latency) that doesn't exist yet. Reintroduce them when
      # that harness ships.

      # Head lag (WebSocket latency) alerts - per-chain thresholds
      # NOTE: alerts use fixed-cardinality gauges now (no tx_hash label) to avoid stale-series spam.
      # Sustained 30s window avoids single-spike firings (reconnect bursts, transient network jitter).
      - alert: MobulaHeadLagSpikeBase
        expr: mobula_head_lag_detailed_seconds{chain="base"} > 2.5
        for: 30s
        labels:
          severity: warning
          aggregator: mobula
          alert_type: head_lag_spike
          app: aggregator_latency_monitor
          chain: base
        annotations:
          summary: '{{ if eq $externalLabels.environment "staging" }}[STAGING] {{ end }}Mobula head lag spike on Base'
          description: |
            **Mobula WebSocket Latency Spike - Base**

            **Latency:** {{ $value }}s (threshold: 2.5s, sustained ≥30s)
            • Mobula Processing: {{ with query (printf "mobula_processing_lag_seconds{chain=\"base\",region=\"%s\",pool_address=\"%s\"}" $labels.region $labels.pool_address) }}{{ . | first | value }}s{{ end }}
            • Network: {{ with query (printf "mobula_network_lag_seconds{chain=\"base\",region=\"%s\",pool_address=\"%s\"}" $labels.region $labels.pool_address) }}{{ . | first | value }}s{{ end }}

            • Pool: {{ $labels.pool_address }}
            • Region: {{ $labels.region }}
            • Latest tx: {{ with query (printf "mobula_last_tx_hash{chain=\"base\",region=\"%s\",pool_address=\"%s\"}" $labels.region $labels.pool_address) }}https://basescan.org/tx/{{ . | first | label "tx_hash" }}{{ end }}

      - alert: MobulaHeadLagSpikeSolana
        expr: mobula_head_lag_detailed_seconds{chain="solana"} > 2
        for: 30s
        labels:
          severity: warning
          aggregator: mobula
          alert_type: head_lag_spike
          app: aggregator_latency_monitor
          chain: solana
        annotations:
          summary: '{{ if eq $externalLabels.environment "staging" }}[STAGING] {{ end }}Mobula head lag spike on Solana'
          description: |
            **Mobula WebSocket Latency Spike - Solana**

            **Latency:** {{ $value }}s (threshold: 2s, sustained ≥30s)
            • Mobula Processing: {{ with query (printf "mobula_processing_lag_seconds{chain=\"solana\",region=\"%s\",pool_address=\"%s\"}" $labels.region $labels.pool_address) }}{{ . | first | value }}s{{ end }}
            • Network: {{ with query (printf "mobula_network_lag_seconds{chain=\"solana\",region=\"%s\",pool_address=\"%s\"}" $labels.region $labels.pool_address) }}{{ . | first | value }}s{{ end }}

            • Pool: {{ $labels.pool_address }}
            • Region: {{ $labels.region }}
            • Latest tx: {{ with query (printf "mobula_last_tx_hash{chain=\"solana\",region=\"%s\",pool_address=\"%s\"}" $labels.region $labels.pool_address) }}https://solscan.io/tx/{{ . | first | label "tx_hash" }}{{ end }}

      - alert: MobulaHeadLagSpikeBNB
        expr: mobula_head_lag_detailed_seconds{chain="bnb"} > 2.5
        for: 30s
        labels:
          severity: warning
          aggregator: mobula
          alert_type: head_lag_spike
          app: aggregator_latency_monitor
          chain: bnb
        annotations:
          summary: '{{ if eq $externalLabels.environment "staging" }}[STAGING] {{ end }}Mobula head lag spike on BNB Chain'
          description: |
            **Mobula WebSocket Latency Spike - BNB Chain**

            **Latency:** {{ $value }}s (threshold: 2.5s, sustained ≥30s)
            • Mobula Processing: {{ with query (printf "mobula_processing_lag_seconds{chain=\"bnb\",region=\"%s\",pool_address=\"%s\"}" $labels.region $labels.pool_address) }}{{ . | first | value }}s{{ end }}
            • Network: {{ with query (printf "mobula_network_lag_seconds{chain=\"bnb\",region=\"%s\",pool_address=\"%s\"}" $labels.region $labels.pool_address) }}{{ . | first | value }}s{{ end }}

            • Pool: {{ $labels.pool_address }}
            • Region: {{ $labels.region }}
            • Latest tx: {{ with query (printf "mobula_last_tx_hash{chain=\"bnb\",region=\"%s\",pool_address=\"%s\"}" $labels.region $labels.pool_address) }}https://bscscan.com/tx/{{ . | first | label "tx_hash" }}{{ end }}

      # Missing head lag metrics (no data for 5 minutes = monitor down)
      - alert: MissingHeadLagMetrics
        expr: absent(head_lag_seconds)
        for: 5m
        labels:
          severity: critical
          alert_type: missing_head_lag
          app: aggregator_latency_monitor
        annotations:
          summary: '{{ if eq $externalLabels.environment "staging" }}[STAGING] {{ end }}Head lag metrics missing'
          description: "No head_lag_seconds metrics received for 5 minutes. Check if monitors are running."

      # Per-aggregator staleness: fires when one provider stops pushing data
      # (e.g. Codex WS disconnect) while others keep running — global absent()
      # would NOT catch this.
      - alert: AggregatorHeadLagStale
        # changes() et non timestamp(): un gauge gelé (souscription morte,
        # harness qui ré-expose la dernière valeur) a des samples frais à
        # chaque scrape — timestamp() ne voit rien (Codex Solana 2026-07-09,
        # 8h de 26.3s figés sans alerte). Un vrai flux a toujours du jitter.
        # Scope mobula uniquement: un feed tiers (codex/gecko) qui meurt est
        # leur histoire, le watchdog purge ses gauges et la page montre le
        # trou. Pas de bruit Slack pour eux.
        expr: changes(head_lag_seconds{aggregator="mobula"}[30m]) == 0
        for: 1m
        labels:
          severity: warning
          alert_type: head_lag_stale
          app: aggregator_latency_monitor
        annotations:
          summary: '{{ if eq $externalLabels.environment "staging" }}[STAGING] {{ end }}{{ $labels.aggregator }} head_lag stale on {{ $labels.chain }} ({{ $labels.region }})'
          description: |
            **{{ $labels.aggregator }}** hasn't pushed a head_lag sample for **{{ $labels.chain }} / {{ $labels.region }}** in over 5 minutes.

            Likely cause: WebSocket disconnected, JWT expired, proxy IP banned, or auth cookie rotated.

            Check the monitor logs for `[HEAD-LAG][{{ $labels.aggregator | toUpper }}]` errors.

      # Service availability
      - alert: CodexServiceDown
        expr: up{job="latency_monitor"} == 0
        for: 2m
        labels:
          severity: critical
          alert_type: service_down
          app: aggregator_latency_monitor
        annotations:
          summary: '{{ if eq $externalLabels.environment "staging" }}[STAGING] {{ end }}Latency monitor service is down'
          description: "The aggregator latency monitor has been down for 2 minutes. No metrics are being collected."

  - name: bench_coverage_alerts
    interval: 60s
    rules:
      # RPC provider error-rate (no-key + keyed): the 1RPC/dRPC per-IP
      # throttling incident (2026-07-08) ran for days unalerted. Fires
      # when a (provider, chain) cell errors on >50% of calls for 1h.
      - alert: RpcProviderErrorRate
        # cloudflare exclu: mort documenté (permissioned mode, -32046 sur
        # eth_getBlockByNumber) qu'on garde probé exprès comme cautionary
        # tale sur la page ethereum-rpc. Pas besoin de rappel Slack.
        expr: |
          (
            sum by (provider, chain) (rate(rpc_call_total{result!="ok",provider!="cloudflare"}[30m]))
            / sum by (provider, chain) (rate(rpc_call_total{provider!="cloudflare"}[30m]))
          ) > 0.5
        for: 1h
        labels:
          severity: warning
          alert_type: rpc_error_rate
          app: rpc_benches
        annotations:
          summary: '{{ $labels.provider }} erroring on {{ $labels.chain }} ({{ $value | humanizePercentage }})'
          description: "More than half of probes to {{ $labels.provider }} on {{ $labels.chain }} failed over the last 30m, sustained 1h. Rate limit, dead endpoint, or our own footprint (check probe cadence before blaming the provider)."

      # Keyed free-tier quota guard approaching: the guard pauses at 90%,
      # this warns at 85% so a human can react before data gaps appear.
      - alert: KeyedQuotaNearExhaustion
        expr: rpc_keyed_quota_used_ratio > 0.85
        for: 10m
        labels:
          severity: warning
          alert_type: quota
          app: rpc_benches
        annotations:
          summary: 'Keyed RPC quota {{ $labels.provider }} at {{ $value | humanizePercentage }} of monthly budget'
          description: "The 90% guard will pause probing soon; leaderboard gaps follow. Consider a cadence reduction or a bigger plan."

      # Aggregator WS silently down: connection-state gauge from the
      # reconnect instrumentation (PR #950).
      - alert: AggregatorWSDisconnected
        # mobula only, même logique que AggregatorHeadLagStale.
        expr: ws_connected{aggregator="mobula"} == 0
        for: 10m
        labels:
          severity: warning
          alert_type: ws_state
          app: aggregator_latency_monitor
        annotations:
          summary: '{{ $labels.aggregator }} WebSocket disconnected ({{ $labels.region }})'
          description: "ws_connected has been 0 for 10 minutes; reconnect loop is running but not succeeding. Check JWT/cookie/proxy for codex, API key for mobula."
