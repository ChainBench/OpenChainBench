intro: |
  Gains v8 is an oracle-priced perpetuals venue running on Arbitrum, Base, Polygon and ApeChain. It settles against a GNS staking vault rather than a central orderbook, with the position open fee read directly on-chain from the fees contract and the spread term built from half of the on-chain spreadP parameter plus the protocol's cumulative volume price impact, which grows with trade size. This benchmark measures the live all-in cost of opening a $1000 ETH long 10x position across major perpetual venues, every five minutes, by reading taker fees from each venue's own API and walking each orderbook for $1000 of buy-side notional. Gains is queried via eth_call on Arbitrum: pairs(N) gives the spreadP and feeIndex for each market, fees(feeIndex) gives the open fee (totalPositionSizeFeeP), and getTradeCumulVolPriceImpactP gives the impact of a long and a short at each size, averaged. Values are in 1e10 precision per Gains v8 convention. The same harness queries Hyperliquid, Lighter, dYdX v4 and GMX v2. Funding rate is published separately because it accrues per hour held, not at open.

seo_title: "Gains alternatives: live benchmark"
seo_description: Compare Gains against Hyperliquid, Lighter, dYdX, GMX v2 on live taker fee plus spread crossed at $1k, $100k and $1M notional, refreshed every five minutes.

status: live

positioning: |
  Gains v8 uses a decentralized GNS staking vault rather than an orderbook. Traders open positions against the vault, priced against a Chainlink or Pyth oracle rather than a live book. The vault absorbs trader profits and receives trader losses, with GNS stakers backstopping it in exchange for a share of protocol fees. This oracle-driven model is architecturally distinct from CLOB venues: there is no maker side, no maker rebate to earn, and the fee schedule is a single flat percentage of position size. For the perp-fees axis, there is no book to walk, but the protocol charges its own price impact. The benchmark counts the cumulative volume term and leaves out the open interest skew term, which Gains applies again with the same sign at close. The all-in cost at each size is the open fee plus half of spreadP plus that impact, averaged over a long and a short, all read live from on-chain. The venue covers 364 active markets across crypto, forex, tokenized stocks, commodities and stock indices, the widest multi-asset catalog among EVM perp DEXes. The typical use case is directional traders on mid-cap or exotic pairs that lack deep orderbook liquidity on any CLOB venue.
