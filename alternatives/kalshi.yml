slug: kalshi
target_product: Kalshi
target_url: https://kalshi.com
description: CFTC-regulated event contracts exchange with a token bucket API
benchmark: pm-rate-limits

intro: |
  Kalshi runs a CFTC-regulated event contracts exchange with the only documented token bucket in its cohort (around 20 requests per second on the basic read tier at the time of writing). Its order book and single-market endpoints go to origin on every request, but the market list is served from CloudFront with `max-age=15`, so list latency measures the edge rather than the API origin. The WebSocket requires authentication, which excludes Kalshi from the public WS panel. Builders sizing against this kind of API need two numbers: the real latency of the hot endpoints at a polite request rate, and what happens as the rate climbs. This benchmark probes book (`/markets/{ticker}/orderbook`), price (`/markets/{ticker}`) and list (`/markets`) endpoints continuously from three Railway regions (us-east, eu-west, sgp), every 5 to 7 seconds over warm keep-alive connections, with a separate cold-connect probe once per minute. Once per day per venue it runs a 60-second-per-tier ramp at rising request rates, recording added latency against the same-hour warm baseline and any 429 onset. Kalshi's ramp uses tiers 25/50/100 requests per 10 seconds and stops at the first 429 out of respect for the documented contract. The harness flags CDN cache hits via `cf-cache-status`, `x-cache` and `age` headers and excludes them from latency aggregates so no venue ranks on its CDN. Every request carries an identifying User-Agent with a contact address. The cohort competing with Kalshi includes Polymarket (Cloudflare-queued CLOB), Limitless (undocumented limits, errors CDN cached for 4 hours), Manifold (500 req/min per IP, whole API behind a 5-second cache) and Myriad (single-region Heroku origin, no order book).

seo_title: "Kalshi alternatives: live benchmark"
seo_description: "Kalshi vs Polymarket, Limitless, Manifold, Myriad on warm book latency and ramp throttle (us-east, eu-west, sgp)."

status: live

positioning: |
  Kalshi is a US event-contracts exchange with two API surfaces (Predictions and Perps) exposed over REST, WebSocket and FIX, authenticated by API key and governed by a documented to
  ken-budget rate-limit model with 7 named tiers (Basic, Advanced, Expert, Premier, Paragon, Prime, Prestige) that scale from a few hundred to several thousand tokens per second, wit
  h a burst allowance after idle time. Its architectural moat is regulatory: the venue operates under CFTC-recognised status for event contracts, which shapes the API surface (identi
  fied market participants, published limits, FIX access for institutional flow) and the data redistribution terms that any downstream consumer inherits. For a pm-rate-limits benchma
  rk, that means Kalshi is the cohort's baseline for what a documented contract looks like: token budgets are formally tiered, order and book endpoints go to origin on every call, an
  d the market-list endpoint is served from a CDN with a short max-age, so list latency measures the edge. WebSocket access requires authentication, which is standard for a regulated
   venue and keeps the public unauthenticated WebSocket surface small. Trading systems that require CFTC-supervised counterparty, FIX connectivity or auditable API terms integrate on
   Kalshi natively. Teams migrate to a Polygon-based CLOB when the product requires permissionless market creation, non-US retail flow, or on-chain settlement receipts that the regul
  ated venue's off-chain matching does not surface.
