slug: relay
target_product: Relay
target_url: https://relay.link
description: Cross-chain bridge with intent-based routing
benchmark: bridge-quote-latency

intro: |
  Relay is an intent-based bridge: the user signs an order, a solver fronts the destination-chain funds and the cross-chain settlement happens off the user's critical path. The architecture compresses the user-felt latency because the quote does not have to scan many upstream venues; the solver inventory itself is the route. That same architecture exposes a different failure mode, which is solver depth: routes the solvers do not maintain inventory on either fail or fall back to a slower path, so coverage on long-tail pairs is narrower than a fan-out aggregator's. Fees are quoted inclusive of the solver spread rather than as a separate gas-plus-bridge breakdown. Teams that switch away usually do so for a chain pair the Relay solvers do not actively support, where a route that exists at all beats a fast quote that does not.

seo_title: "Relay alternatives: live benchmark"
seo_description: Compare Relay alternatives on cross-chain bridge quote latency. Debridge, Li.Fi and Mobula measured on identical routes, refreshed every five minutes.

positioning: |
  Relay is a cross-chain payments network built on the Relay Protocol, an open system that connects users to a network of relayers who execute on-chain actions on their behalf, combi
  ned with DEX meta-aggregation across a documented set of 85 or more chains. Its architectural moat is the intent-plus-relayer model: the quote API is a thin price-discovery call ag
  ainst a pool of relayers who already hold inventory on the destination, so the request does not run a route-search graph across N underlying bridges. That thin surface is exactly w
  hat a bridge-quote-latency benchmark rewards, the API returns a single canonical price against pre-positioned liquidity rather than fanning out to third-party providers. The trade-
  off lives on the fill side, where a relayer must accept the intent, and on corridor coverage, which is bounded by which relayers hold inventory where. Relay is integrated as a swap
   layer for wallets, cross-chain gas-abstraction flows and app-chain onboarding where quote responsiveness dictates perceived UX. Teams migrate off when their corridor sits outside 
  the relayer inventory footprint, or when they need multi-hop routing through long-tail bridges that a meta-aggregator with wider integration coverage handles natively.
