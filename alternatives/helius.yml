slug: helius
target_product: Helius
target_url: https://helius.dev
description: Solana RPC provider with a transaction landing service (Sender)
benchmark: solana-tx-landing-latency

intro: |
  Helius runs a Solana RPC provider with a dedicated transaction landing service called Sender, available in both default mode (with Jito fan-out) and `swqos_only=true` mode (own-path only, no Jito leg). The only question that matters to a Solana trader picking a landing service is how many slots a signed mainnet transaction takes to reach the confirmed state on chain, because Solana confirmation is a slot-level event and a 1-slot difference is roughly 400 ms (enough for a MEV bot to front-run a competitor). This benchmark probes five landing services from a us-east Railway region, once per hour, by submitting an identical signed mainnet transaction to each in parallel. The payload is a compute-budget instruction pair (50k CU limit, 50k micro-lamport/CU price), a 1-lamport self-transfer, the per-service tip transfer at a pre-registered floor and an OCB-prefixed memo for forensic traceability. The headline metric is slot delta (`land_slot` minus `submit_slot`) captured from the `signatureSubscribe` WebSocket notification's `context.slot` field at commitment level confirmed. Wall-clock milliseconds is published alongside as a derived approximation but the canonical RTT-independent number is the slot delta. Helius is probed in `swqos_only=true` mode against `ewr-sender.helius-rpc.com/fast` to isolate the own-path from the Jito leg, with a 10,000-lamport tip floor. Other services in the V0-Lean cohort: Jito (control baseline), Astralane Iris (tip-refund), Nozomi by Temporal Labs (1M-lamport hard floor) and the Mobula multi-RPC fan-out aggregator. p50 and p99 slot delta are computed over a rolling 7-day window (168 samples per service per cell).

seo_title: Helius alternatives. Live Solana tx landing slot delta benchmark
seo_description: Compare Helius Sender against Jito, Astralane, Nozomi and Mobula on slot delta from submit to confirmed. Signed mainnet probes every hour from us-east, 7-day window.

status: live
