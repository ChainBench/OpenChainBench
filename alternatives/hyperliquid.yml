slug: hyperliquid
target_product: Hyperliquid
target_url: https://hyperliquid.xyz
description: HyperBFT L1 perpetuals exchange with an on-chain orderbook
benchmark: perp-fees

intro: |
  Hyperliquid is an L1 perpetuals exchange running on HyperBFT consensus, with an on-chain orderbook and a published base taker fee of 4.5 basis points. Its book is among the deepest of any decentralized venue, which means the spread crossed at market and the impact eaten at $1000 notional usually stay compressed and the all-in cost tracks the rack rate closely. This benchmark measures the live all-in cost of opening a $1000 ETH long 10x position across major perpetual venues, every five minutes, by reading taker fees from each venue's own API and walking each orderbook for $1000 of buy-side notional. No transactions are sent. Hyperliquid is queried via `POST /info {type: l2Book}` for asks, `{type: userFees, user: 0x000...000}` for taker fee and `{type: metaAndAssetCtxs}` for funding. The same harness queries Lighter (`/orderBookDetails` plus `/orderBookOrders`), dYdX v4 (indexer plus Cosmos REST), GMX v2 (synthetics-arbitrum subgraph for `positionFeeFactor`), and gains.trade on Base (fee read directly on-chain via `eth_call`). All-in cost equals taker fee plus half-spread plus impact, all in basis points, with both components emitted as separate Prometheus gauges for transparency. Funding rate is published separately (`perp_fees_funding_rate_per_hour_bps`) because it accrues per hour held rather than at open, so a trader sizing a multi-hour position can layer it on top of the open cost. The dimension tab at the top of the page swaps the underlying asset between ETH, BTC and SOL, with the leaderboard re-sorting on each switch.

seo_title: "Hyperliquid alternatives: live benchmark"
seo_description: Compare Hyperliquid against Lighter, dYdX, GMX v2 and gains.trade on live taker fee plus spread crossed at $1000 notional, refreshed every five minutes.

status: live

positioning: |
  Hyperliquid runs a purpose-built L1 whose flagship application is the perp exchange itself. HyperCore holds the orderbook, margin, and matching engine as protocol state; HyperBFT, 
  a HotStuff variant, orders blocks with median end-to-end latency of 0.2 seconds for co-located clients. Every resting order, fill, and liquidation is part of consensus and visible 
  to every node, with strict price-time priority. This is architecturally different from dYdX v4, where matching happens in a validator in-memory book and only settlement lands on ch
  ain, and different from GMX, which has no orderbook at all. For the perp-fees axis, the design has two implications. The fee schedule is a 7-tier maker-taker table keyed to 14-day 
  weighted volume, with maker rebates paid on every trade rather than settled periodically. HYPE staking layers a separate 5 to 40 percent discount as an overlay on top of the number
  ed volume tiers, and staking-linking lets a discount wallet apply to a distinct trading wallet, permanently. The typical use case is active perp traders and market makers who want 
  CEX-shaped fees without a central operator; teams migrate away when they need EVM composability HyperCore itself does not offer, in which case HyperEVM sits on the same validator s
  et.
