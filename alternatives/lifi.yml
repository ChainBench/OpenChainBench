slug: lifi
target_product: Li.Fi
target_url: https://li.fi
description: Cross-chain bridge + DEX aggregator
benchmark: bridge-quote-latency

intro: |
  Li.Fi is a cross-chain aggregator that stitches together third-party bridges (Stargate, Across, Connext, Hop and others) and DEX aggregators behind a single `/quote` endpoint. The quote response carries a full execution plan with calldata, approval steps and gas estimates, which is convenient for a wallet integration but means the latency reflects fan-out across many underlying providers plus the time to pick a winner. Each upstream has its own SLA, and a slow leg in the cohort drags the quote even when the chosen route is fast. The trade-off is breadth for tail-latency: Li.Fi covers a long tail of bridges that intent-routed competitors do not, but pays for that breadth on the p95 of its `/quote` call. Teams move off when the latency of the fastest route they actually use exceeds what a narrower router can return for the same pair.

seo_title: "Li.Fi alternatives: quote latency benchmark"
seo_description: Compare Li.Fi alternatives on cross-chain quote latency. Debridge, Mobula and Relay measured on identical routes, refreshed every five minutes.

positioning: |
  Li.Fi is a cross-chain routing and orchestration layer that normalises calls across many bridges, DEX aggregators and intent networks behind a unified /quote and /routes API surfac
  e, plus a TypeScript SDK and a drop-in widget. Its architectural moat is coverage: routes are searched across a wide set of underlying providers (Across, Hop, Mayan, Allbridge, Sym
  biosis, Squid, Synapse, CCTP, Wormhole among others), token standards and chain differences are normalised, and the response returns a full execution plan with calldata, approval s
  teps and gas estimates ready for a wallet to sign. That breadth matters when a builder needs any-token-to-any-token support without hand-integrating each bridge, and it does not ma
  tter, or actively hurts, when the metric is bridge-quote-latency on a single well-known corridor. The /quote call fans out across underlying providers and picks a winner, so its wa
  ll-clock reflects the slowest leg searched, not the fastest route returned. Builders integrating a wallet swap modal, a portfolio rebalance tool or a treasury flow across long-tail
   chains stay on Li.Fi for the coverage. Teams that route a fixed hot corridor and need sub-second p95 typically front the Li.Fi SDK with a faster narrower router for the paths they
   actually use.
