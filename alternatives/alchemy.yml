slug: alchemy
target_product: Alchemy
target_url: https://www.alchemy.com
description: Multi-chain node + enhanced API provider
benchmark: rpc-cost

intro: |
  Alchemy is an EVM-first node and API provider whose surface is shaped by its enhanced endpoints (`alchemy_getAssetTransfers`, NFT API, webhooks, getTokenBalances, the simulation and debug suite, the account-abstraction bundler) rather than by a raw RPC tuned for edge latency. Pricing is metered in compute units, which charges more for an enhanced call than for a plain `eth_call`, so the ceiling shows up first on teams streaming high-cardinality events into a backend rather than on dapp front-ends issuing single reads. Solana coverage exists but sits on a stack built around Ethereum and its L2s. Teams that need a live view of trades on Base, BNB Chain or Solana usually leave Alchemy at the point where the enhanced API list stops mapping to what the product actually reads from chain.

seo_title: "Alchemy alternatives: live benchmark"
seo_description: Compare Alchemy alternatives on what they would actually bill. The same workload priced across 28 RPC providers, every plan tier, compute units normalised.

positioning: |
  Alchemy's moat is a vertically integrated node platform. It runs archive nodes across 100+ chains (approximately 120 listed on the chain-connect page) and layers a data stack on top of the same infrastructure (Node API, Prices API, Notify webhooks, Subgraphs). On cost, the load-bearing detail is the unit. Alchemy bills compute units rather than requests, and the weight per method is not uniform: an enhanced call such as alchemy_getAssetTransfers costs a multiple of a plain eth_call, so two workloads at the same request count can differ severalfold on the invoice. Archive access is priced inside the same meter rather than as a separate tier, which favours teams that read history occasionally and penalises those that read it constantly. The free allowance is monthly and rolls within the month, so a burst does not lock the account out the way a daily allowance does. Alchemy tends to win when a team wants one meter across reads, webhooks and the bundler and will accept paying more per enhanced call for it; teams migrate when a single high-volume method dominates their mix, because a provider that bills flat requests prices that shape far lower. Chain coverage skews heavily to EVM plus Solana; long-tail EVM L2s and Bitcoin sit inside the standard Node API surface.
