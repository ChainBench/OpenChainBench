slug: pump-portal
target_product: Pump Portal
target_url: https://pumpportal.fun
description: Real-time pump.fun token data API on Solana
benchmark: aggregator-head-lag

intro: |
  Pump Portal is a single-purpose WebSocket on Solana, scoped to pump.fun and the bonding-curve launchpad ecosystem around it (new token creations, migration to Raydium, per-mint trade events). The surface is intentionally narrow: no support for other chains, no general DEX coverage outside the pump.fun graduates and no historical query layer beyond the live stream. The free tier exists, but high-volume readers route through a paid trading endpoint that adds a per-trade priority fee on top. The provider sits close to the launchpad it tracks rather than near a canonical Solana archive, so the bottleneck is usually the upstream indexer rather than the WebSocket itself. Teams that outgrow the pump.fun-only scope (cross-DEX routing, non-Solana chains, OHLCV history) tend to drop it the moment a second venue or chain enters the product.

seo_title: "PumpPortal alternatives: live benchmark"
seo_description: "Pump Portal alternatives: Codex, GeckoTerminal, Mobula on real-time block ingestion + Solana mint feed."

positioning: |
  PumpPortal is a Solana-only, Pump.fun-native WebSocket relay. The Data API exposes a single connection at wss://pumpportal.fun/api/data with four subscription methods: subscribeNewToken, subscribeMigration, subscribeTokenTrade and subscribeAccountTrade. There is no REST fallback and no polling surface; the entire product is push. The moat is protocol specialization rather than infrastructure: PumpPortal decodes the Pump.fun bonding curve and PumpSwap AMM directly, so a launch, a trade or a migration to Raydium appears as a typed event through subscribeMigration without any client-side program-log parsing. For head lag on Solana specifically, this matters because the alternative is running a Yellowstone gRPC subscription plus a bonding-curve decoder in-house. Coverage does not extend beyond Solana Pump.fun and PumpSwap, so this product does not compete on breadth, only on latency to a specific event surface. It also ships a Lightning Transaction API for signed swap execution, which is a separate REST product. Teams win with PumpPortal when the use case is a Solana memecoin sniper or a Pump.fun-specific dashboard; teams migrate away the moment coverage needs to include Raydium CLMM, Meteora, Orca or any non-Solana venue.
