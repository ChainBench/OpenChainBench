name: PyPI Publish

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag or sha)"
        required: false
        default: "main"

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        working-directory: packages/python-client
        run: python -m build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: packages/python-client/dist/

  smoke-test:
    name: Install + import smoke test
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Install built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/openchainbench-*.whl
      - name: Import smoke test
        run: |
          python -c "import openchainbench; print(openchainbench.__version__)"

  publish:
    name: Publish to PyPI (Trusted Publisher)
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openchainbench/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
