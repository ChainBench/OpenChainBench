name: Vercel prod deploy

# Auto-deploy to Vercel Production on every push to main (any merged PR).
# Same VERCEL_TOKEN as the staging workflow. The openbench-monitoring
# control plane that originally drove this was retired 2026-07-10; the
# workflow itself stays as the sole prod deploy path.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — vercel.com/account/tokens, scope = the Vercel team
#   VERCEL_ORG_ID      — already set for staging-deploy.yml
#   VERCEL_PROJECT_ID  — already set for staging-deploy.yml

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: scripts/emit-page-mtimes.ts (prebuild) reads each
          # content file's last commit for the sitemap <lastmod>. A depth-1
          # checkout dates only the files touched by HEAD and every other
          # URL falls back to the build time (929 of 929 on 2026-09-19).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env (Production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        # NEXT_PUBLIC_POSTHOG_KEY comes from a repository variable: `vercel pull`
        # writes the literal "[SENSITIVE]" for env vars flagged sensitive on
        # Vercel, and that string was compiled into the bundle as the PostHog
        # token (no event reached PostHog from 2026-08-24 to 2026-09-20).
        # process.env wins over the pulled .env file. The token is public by
        # nature (it ships to every browser), so a variable, not a secret.
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Production
        id: deploy
        run: |
          # --archive=tgz uploads ONE tarball instead of thousands of
          # individual file requests, avoiding the 40k/24h upload quota.
          url=$(vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployed at $url"

      # Each deployment starts with an empty ISR cache, so the first hit on
      # a page is a cold render. Warming closes that window.
      #
      # This warmed all 184 benchmark pages until 2026-09-30. It no longer
      # does, for the same reason the smoke test below is now stratified:
      # six production deploys in two days spent most of the runtime bill
      # on cold renders nobody was waiting for. The hubs carry the traffic
      # and are warmed here; a detail page warms on its first visitor and
      # then serves from ISR for an hour.
      #
      # The smoke test used to render the whole catalogue a minute later
      # anyway, which is why trimming this step alone would have saved
      # nothing. It samples now, so this saving is real.
      - name: Warm hubs and top-level pages
        run: |
          base="https://openchainbench.com"
          curl -sf --max-time 30 "$base/sitemap.xml" \
            | grep -o 'https://[^<]*' \
            | sort -u \
            | awk -F/ 'NF<=4' \
            | xargs -P 4 -I{} curl -s -o /dev/null -w "%{http_code} %{time_total}s {}\n" --max-time 120 {} \
            || echo "warm-up failed (non-blocking)"

      # Warm pages that can cold-render 500: products/polymarket triggers the
      # degraded-read tripwire on empty store; alternatives/* for perp venues
      # run a live Prom cohort fetch on first hit. Both self-heal after one
      # successful warm render, so hitting them here pre-empts the smoke gate.
      - name: Warm ISR-sensitive pages
        run: |
          base="https://openchainbench.com"
          for path in /products/polymarket /alternatives/dydx /alternatives/gains /alternatives/hyperliquid /alternatives/polymarket; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$base$path" || echo "000")
            echo "$code $base$path"
          done

      # Warm /api/citable explicitly: the aggregator cache is independent
      # from per-bench caches, and the bench-page warm-up only populates
      # the latter. Without this step, /api/citable's first hit after
      # deploy runs 26 parallel Prom queries on a cold function instance,
      # which has historically produced mostly-placeholder snapshots that
      # cached for 60s and shipped status=insufficient to LLM agents.
      - name: Warm citable aggregate
        run: |
          base="https://openchainbench.com"
          # /api/mcp is the docs path under /mcp, the live JSON-RPC
          # endpoint is /api/mcp/mcp (Streamable HTTP). Warm the real
          # endpoint so the first agent request after deploy is hot.
          for ep in /api/citable /api/llm-context /api/mcp/mcp; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$base$ep" || echo "000")
            echo "$code $base$ep"
          done

      # Indexability smoke test runs AFTER the warm-up steps so cold
      # renders cannot false-fail. If any sitemap URL returns non-200 or
      # carries a noindex hint (X-Robots-Tag header OR <meta name=robots>),
      # the next step auto-rolls back the prod alias to the previous good
      # deploy. This catches the class of bug that bled SEO on 2026-06-25
      # (bench page 404 + noindex while still in the sitemap).
      #
      # Sitemap fetched from the deployment URL (bypasses s-maxage=3600
      # CDN cache — was serving the previous deploy's sitemap for up to
      # 1 h, causing false rollbacks). Pages checked against the prod
      # domain (second arg) so the noindex injected on Vercel preview
      # URLs does not false-fail the per-page checks.
      # Pages this deploy actually touched are always checked, on top of
      # the hubs. A regression arrives with a change, so the changed set
      # is the half of the catalogue worth checking every single time.
      - name: Collect touched page slugs
        id: touched
        run: |
          slugs=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null \
            | grep -oE '^(benchmarks|answers|alternatives)/[a-z0-9-]+\.yml' \
            | sed -E 's|.*/||; s|\.yml$||' | sort -u | paste -sd'|' -)
          echo "regex=${slugs}" >> "$GITHUB_OUTPUT"
          echo "touched slugs: ${slugs:-none}"

      - name: Sitemap indexability smoke
        id: smoke
        continue-on-error: true
        env:
          # Hubs and touched pages in full, plus a rotating slice of the
          # tail. See the reasoning block in scripts/sitemap-smoke.mjs.
          SMOKE_SAMPLE: "120"
          SMOKE_SEED: ${{ github.run_number }}
          SMOKE_ALWAYS_REGEX: ${{ steps.touched.outputs.regex }}
        run: node scripts/sitemap-smoke.mjs ${{ steps.deploy.outputs.url }} https://openchainbench.com

      - name: Auto-rollback on smoke failure
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Sitemap smoke failed. Rolling back prod alias to the previous deploy."
          vercel rollback --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --yes
          # Re-fail the job so the rollback is visible in the workflow
          # status (a red X on the commit + an email).
          exit 1

      - name: Ping IndexNow (post-deploy)
        if: steps.smoke.outcome != 'failure' && env.CRON_SECRET != ''
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://openchainbench.com/api/cron/indexnow || echo "000")
          echo "IndexNow ping: $code"

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ steps.smoke.outcome }}" = "failure" ]; then
              echo "## Vercel prod deploy ✗ rolled back"
              echo ""
              echo "**Reason:** sitemap smoke test failed. Prod alias was reverted to the previous deploy."
            else
              echo "## Vercel prod deploy ✓"
              echo ""
              echo "**Live:** https://openchainbench.com"
            fi
            echo ""
            echo "**Deploy URL:** ${{ steps.deploy.outputs.url }}"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
