name: Codex token push

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  push-token:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Paris box token refresh
        run: |
          set -euo pipefail
          # The Paris box pm2 "codex-push" job handles token refresh automatically
          # via Tor+utls every 8 minutes. This workflow just verifies the sidecar is alive.
          http_code=$(curl -s -o /tmp/tok -w "%{http_code}" --max-time 10 \
            "http://57.130.19.92:8080/token")
          len=$(wc -c < /tmp/tok)
          if [ "$http_code" = "200" ] && [ "$len" -gt 100 ]; then
            echo "Sidecar OK: HTTP $http_code, token len=$len"
          else
            echo "Sidecar unhealthy: HTTP $http_code, len=$len"
            exit 1
          fi
