<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2488 1175" width="2488" height="1175" role="img" aria-label="Validation Cloud">
  <!--
    Validation Cloud publishes no SVG and no brand kit, so this is their mark
    rebuilt to the geometry measured off their own 3848 x 1216 asset: three
    concentric stadiums, stroke 91, gap 71, outer 2488 x 1175. The dark tile
    and silver mark follow their favicon, which is the only square lockup they
    ship, so the logo reads on a light or a dark page without a chip behind it.
  -->
  <defs>
    <linearGradient id="vc-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8EBEF"/>
      <stop offset="0.5" stop-color="#AEB6C0"/>
      <stop offset="1" stop-color="#8A929C"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#vc-mark)" stroke-width="91">
    <rect x="45.5" y="45.5" width="2396.5" height="1083" rx="541.5"/>
    <rect x="207.5" y="207.5" width="2072.5" height="759" rx="379.5"/>
    <rect x="369.5" y="369.5" width="1748.5" height="435" rx="217.5"/>
  </g>
</svg>
