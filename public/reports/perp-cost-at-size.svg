<text x="26" y="494" font-size="11.5" fill="#1c1917">Gains and GMX are oracle-priced: no book to walk, so the cost in basis points is the same at both sizes.</text>
<text x="26" y="514" font-size="10" fill="#78716c">All-in cost on ETH = taker fee + half spread + impact, 24 h means, the same scope the boards in this report use.</text>
<text x="26" y="530" font-size="10" fill="#78716c">OpenChainBench bench 007, read 28 October 2026. A venue with no $1M point never had the tier fill in the window.</text>
