<text x="26" y="494" font-size="11.5" fill="#1c1917">Gains and GMX are oracle-priced: no book to walk, so the cost in basis points is the same at both sizes.</text>
<text x="26" y="514" font-size="10" fill="#78716c">All-in cost = taker fee + half spread + impact, 24 h averages across ETH, BTC and SOL.</text>
<text x="26" y="530" font-size="10" fill="#78716c">OpenChainBench bench 007, 28 October 2026. Fill rate is noted where the $1M probe did not always complete.</text>
