<title id="t">All-in cost to open an ETH perp at $1,000 and at $1,000,000 notional, eleven venues, 24 hour means</title>
<desc id="d">Gains and GMX are flat because they are oracle-priced. Order books rise: Ondo from 4.1 to 24.3 basis points, dYdX from 6.6 to 18.6, Hyperliquid from 4.8 to 5.8. Paradex is second cheapest at $1,000 and produced no reading at $1,000,000 because its tier never filled.</desc>
