<title id="t">Solana finality compared with Gram and BNB Chain, before and after Alpenglow</title>
<desc id="d">Median finality per 30 minutes over seven days: Solana falls from about 7 seconds to about 0.4 seconds on 21 October 2026, joining Gram near 0.4 seconds and passing BNB Chain near 0.75 seconds.</desc>
